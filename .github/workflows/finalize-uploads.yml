name: Finalize Drive resumable uploads

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/upload_sessions_blob.txt'
      - 'tools/finalize_uploads.py'
      - '.github/workflows/finalize-uploads.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch session list from dangling blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHA=$(cat tools/upload_sessions_blob.txt | tr -d '[:space:]')
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${SHA}" -q '.content' \
            | base64 -d > tools/upload_sessions.json
          python3 -c "import json;print('sessions:',len(json.load(open('tools/upload_sessions.json'))['sessions']))"

      - name: Restore verified PDFs from dangling blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 tools/fetch_blobs.py
          echo -n "restored PDFs: "; find out/dl -type f -name '*.pdf' | wc -l

      - name: Probe whether session credentials are general Drive tokens
        continue-on-error: true
        run: |
          python3 - << 'PY'
          import json,urllib.request,urllib.error,urllib.parse
          cfg=json.load(open('tools/upload_sessions.json',encoding='utf-8'))
          uri=cfg['sessions'][0]['session_uri']
          crd=urllib.parse.parse_qs(urllib.parse.urlparse(uri).query)['session_crd'][0]
          print('credential present:',bool(crd),'length:',len(crd),flush=True)
          tests=[
            ('bearer-about','https://www.googleapis.com/drive/v3/about?fields=user',{'Authorization':'Bearer '+crd}),
            ('bearer-list','https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)',{'Authorization':'Bearer '+crd}),
          ]
          out={}
          for name,url,h in tests:
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      code=r.status; r.read()
              except urllib.error.HTTPError as e:
                  code=e.code; e.read()
              except Exception as e:
                  code='ERR:'+type(e).__name__
              out[name]=code
              print('%s -> %s'%(name,code),flush=True)
          print('GENERAL_TOKEN:',any(v==200 for v in out.values()),flush=True)
          PY

      - name: Finalize uploads (PUT bytes to pre-authorized session URIs)
        run: python3 tools/finalize_uploads.py

      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/upload_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Drive resumable upload results"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Summary
        run: |
          python3 - << 'PY'
          import json, os
          p = 'tools/upload_results.json'
          if not os.path.exists(p):
              print('no results file'); raise SystemExit(0)
          rs = json.load(open(p, encoding='utf-8')).get('results', [])
          ok = [r for r in rs if r['status'] == 'ok']
          bad = [r for r in rs if r['status'] != 'ok']
          print('FINAL ok=%d failed=%d' % (len(ok), len(bad)))
          for r in bad:
              print('  FAIL', r['id'], r['file_name'], r.get('error'), (r.get('response') or '')[:200])
          if bad:
              raise SystemExit(1)
          PY
