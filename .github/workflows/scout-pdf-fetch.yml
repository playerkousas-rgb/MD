name: Fetch and verify Scout PDFs

# Download engine for the 童軍PDF補收 task.
# The Arena sandbox can only reach github.com / api.github.com / codeload, so
# this workflow (on a GitHub-hosted runner with normal internet) fetches the
# official PDFs listed in the checked-in collection list, verifies each one is
# a real PDF, and publishes the bundle as dangling git blobs retrievable via
# api.github.com. Only a tiny JSON index + text reports are committed; no large
# binaries enter Git history.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/scout_pdf_manifest.json'
      - 'tools/download_scout_pdfs.py'
      - 'tools/build_manifest.py'
      - 'tools/publish_blobs.py'
      - '.github/workflows/scout-pdf-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild manifest from the checked-in list
        run: python tools/build_manifest.py

      - name: Download and verify every PDF
        env:
          SCOUT_OUT: ${{ github.workspace }}/out
        run: python tools/download_scout_pdfs.py

      - name: Publish bundle as API blobs (allowed-host transport)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCOUT_OUT: ${{ github.workspace }}/out
        run: python tools/publish_blobs.py

      - name: Save small text records + commit transport index
        env:
          SCOUT_OUT: ${{ github.workspace }}/out
        run: |
          cp "$SCOUT_OUT/download_report.json" tools/download_report.json
          cp "$SCOUT_OUT/download_summary.txt" tools/download_summary.txt
          git config user.name "arena-scout-pdf-agent"
          git config user.email "arena-scout-pdf-agent@users.noreply.github.com"
          git add tools/_transport_index.json tools/download_report.json tools/download_summary.txt
          git diff --cached --quiet || git commit -m "Record PDF download results + blob transport index"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload verified PDFs as Actions artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: scout-pdfs-classified
          path: ${{ github.workspace }}/out
          if-no-files-found: error
          retention-days: 14

      - name: Write run summary
        if: always()
        run: |
          if [ -f out/download_summary.txt ]; then
            cat out/download_summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
