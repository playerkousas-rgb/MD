name: Probe Drive session credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Probe
        run: |
          python3 - << 'PY'
          import json,base64,urllib.request,urllib.error,urllib.parse
          cfg=json.load(open('tools/upload_sessions.json',encoding='utf-8'))
          # reconstruct from committed compact TSV
          tsv=[l.rstrip('\n').split('\t') for l in open('tools/session_uris.tsv',encoding='utf-8') if l.strip() and not l.startswith('#')]
          BASE=("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"
                "&supportsAllDrives=True&upload_id={uid}&session_crd={crd}&upload_protocol=resumable")
          uri=BASE.format(uid=tsv[0][1],crd=tsv[0][2])
          crd=urllib.parse.parse_qs(urllib.parse.urlparse(uri).query)['session_crd'][0]
          print('credential present:',bool(crd),'length:',len(crd),flush=True)
          tests=[
            ('bearer-about','https://www.googleapis.com/drive/v3/about?fields=user',{'Authorization':'Bearer '+crd}),
            ('bearer-list','https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)',{'Authorization':'Bearer '+crd}),
            ('upload-protocol-header','https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)',{'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Session-Credential':crd}),
          ]
          out={}
          for name,url,h in tests:
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      code=r.status; r.read()
              except urllib.error.HTTPError as e:
                  code=e.code; e.read()
              except Exception as e:
                  code='ERR:'+type(e).__name__
              out[name]=code
              print('%s -> %s'%(name,code),flush=True)
          print('GENERAL_TOKEN:',any(v==200 for v in out.values()),flush=True)
          PY
