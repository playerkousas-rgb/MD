name: Weekly Scout circular knowledge update

on:
  # GitHub cron uses UTC. Monday 02:17 UTC avoids the top-of-hour rush.
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-scout-circulars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test listing crawler and report helpers
        run: python -m unittest discover -s tests -p 'test_weekly_scout_circulars.py' -v

      - name: Install PDF extraction and OCR dependencies
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            'pymupdf>=2.0' \
            'rapidocr-onnxruntime>=1.3' \
            'opencv-python-headless>=4.9' \
            'opencc-python-reimplemented>=0.1.7'
          # RapidOCR pulls non-headless OpenCV; restore the headless wheel used by this repo.
          python -m pip uninstall -y opencv-python || true
          python -m pip install --upgrade --force-reinstall --no-deps 'opencv-python-headless>=4.9'
          python - <<'PY'
          import cv2, pymupdf
          from rapidocr_onnxruntime import RapidOCR
          from opencc import OpenCC
          print('PyMuPDF:', pymupdf.__version__)
          print('OpenCV:', cv2.__version__)
          print('RapidOCR and OpenCC: import OK')
          PY

      - name: Scan all official listing pages, download and convert new PDFs
        id: scan
        continue-on-error: true
        run: python tools/weekly_scout_circulars.py

      - name: Commit new Markdown documents and the dated run report
        if: always()
        run: |
          git config user.name 'arena-scout-pdf-agent'
          git config user.email 'arena-scout-pdf-agent@users.noreply.github.com'
          git add knowledge/03_政策及安全指引 knowledge/04_行政及領袖訓練 knowledge/05_資助計劃
          if [ -d tools/weekly_reports ]; then
            git add tools/weekly_reports/
          fi
          if git diff --cached --quiet; then
            echo 'No knowledge or report changes to commit.'
          else
            git commit -m "Weekly Scout circular update: $(date -u +%F)"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Mark dependency or scan problems as failed after committing the report
        if: steps.deps.outcome == 'failure' || steps.scan.outcome == 'failure'
        run: exit 1
