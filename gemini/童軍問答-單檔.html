）、社區參與章或「積極公民」獎章系列 – 社區應急 先鋒章等 \n\n- II. 認識區議會及立法會之組織和功能，並向小隊隊員解釋投票的重 要性 \n\nIII. 參與一次共融活動，並從中認識個別人士的需要 \n\n- IV. 與小隊隊員一同認識香港非物質文化遺產或參觀一個香港的法定 古蹟 \n\n#### 3 . 生態環境（選修項目） \n\na. 完成下列其中一項： \n\n- I. 向小隊隊員介紹香港生境、物種的分類、其多樣性及分佈，並舉 出香港的瀕危物種及其面對的威脅 \n\nII. 參與一次與香港的生物多樣性或瀕危物種相關的活動 \n\n#### 4 . 氣象（選修項目） \n\na. 介紹四季的成因及廿四節氣，以及略述廿四節氣與風土習俗的關係 \n\n進度性獎章 | 37\n\n<!-- p.39 -->\n##### 童軍高級獎章 \n\n   - b. 完成下列其中一項： \n\n      - I. 介紹本港的氣候，及列舉不同氣候適合之小隊活動 \n\n      - II. 介紹本港常用之天氣術語、警告定義及惡劣天氣應變措施，及本 會對惡劣天氣警告之應變指引 \n\n- 5 . 危機及保護（選修項目） \n\n   - a. 完成下列其中一項： \n\n      - I. 參與一次與聯合國可持續發展目標（Sustainable Development Goals）或「可持續發展」相關的活動 \n\n      - II. 參與一次環境保育活動，例如：實踐、推廣或教育 \n\n         - ． 主題例如：保護生物多樣化、改善空氣質素、減少噪音污染、 改善水質、減少製造廢物或可持續地應用能源等 \n\n### **E. 國際視野** \n\n- 1 . 完成下列其中一項： \n\n   - a. 向小隊隊員介紹一個國際組織及其宗旨、目的及工作 \n\n   - b. 向小隊隊員介紹一個其他國家／地區的童軍組織及其支部架構及活 動 \n\n### **F. 探索新知** \n\n- 1 . 參與一項從未嘗試之活動，並向團內其他成員介紹 \n\n   - ． 活動性質需具有自我挑戰及自我成長元素，例如：攀石或歷奇 活動等 \n\n   - ． 向小隊隊員介紹及分享有關經歷 \n\n38 | 進度性獎章\n\n<!-- p.40 -->\n總領袖獎章 \n\n## 總 領 袖 獎 章 **Chief Scout's Award** \n\n適合: \n\n- ( 1 )  已完成童軍高級獎章*，或 \n\n- ( 2 )  年滿十四歲而考獲會員章，完成童軍探索獎章、 童軍標準獎章及童軍高級獎章內「戶外挑戰」 項目及童軍高級獎章之童軍成員。 \n\n於選修項目中，海童軍必須選擇「海上活動」；空童軍必須選擇「航空活動」。 \n\n- 如成員希望在考覈總領袖獎章的同時完成相關的香港青年獎勵計劃銀章級 的內容，成員必須在年滿十四歲及已完成童軍高級獎章後開展總領袖獎章的 考覈。 \n\n完成下列各項： \n\n### **A. 戶外挑戰** \n\n#### 1 . 營藝 \n\na. 策劃及實行一次至少兩日一夜的露營 \n\n   - ． 製作一個露營計劃，其內容應最少包括個人及小隊物資、營 地資料、營區分佈及紮作圖、膳食安排、小隊活動安排、財 政計劃、交通安排及工作分配等 \n\n- b. 教授小隊隊員基本露營技巧 \n\n   - ． 包括收拾露營背囊、架搭及收拾營幕、戶外烹調食物及營地 紮作等 \n\n- c. 製作一個露營報告 \n\n   - ． 記錄一個露營活動，其內容應最少包括個人及小隊物資、營 地資料、營區分佈及紮作圖、膳食安排、露營日誌、財政報 告、工作分配及檢討等 \n\n#### 2 . 歷險 \n\n##### a. 教授小隊隊員基本郊野旅程技巧 \n\n- ． 包括地圖、習用圖例、比例及距離、方格座標的運用、正置 地圖的技巧、收拾郊野旅程用背囊等 \n\nb. 示範野外基本求生技能 \n\n- ． 例如：淨化食水、收拾及使用殘存盒、發送求生訊號等 \n\n進度性獎章 | 39\n\n<!-- p.41 -->\n##### 總領袖獎章 \n\nc. 完成以下其中一項： \n\nI. 參與策劃、進行及記錄一次兩日一夜及不少於二十公里遠足或不 少於二十五公里單車／獨木舟／風帆／船艇之郊野旅程 \n\n      - ． 計劃書內容應最少包括路程目的、擬定露營地點及停泊處 （如有需要）、旅程表及路線圖（需包括後備及緊急路線）、 天氣預報、個人物資及小隊物資、安全及緊急措施及個人資 料等 \n\n      - ． 記錄是次郊野旅程，其內容應最少包括路線圖（需包括後備 及緊急路線）、遠足路程表、行程紀錄及小隊及個人物資 \n\n   - II. 參與策劃、進行及記錄一次不少於三日兩夜（最少共二十一小時 之活動時間）遠足／單車／獨木舟／風帆／船艇之郊野旅程 \n\n      - ． 計劃書內容應最少包括路程目的、擬定露營地點及停泊處 （如有需要）、旅程表及路線圖（需包括後備及緊急路線）、 天氣預報、個人物資及小隊物資、安全及緊急措施及個人資 料等 \n\n      - ． 記錄是次郊野旅程，其內容應最少包括路線圖（需包括後備 及緊急路線）、遠足路程表、行程紀錄及小隊及個人物資 \n\n- 3 . \n\n- ． 以上之郊野旅程前須進行分別一次一日及一次兩日一夜的訓 練旅程 \n\n- 先鋒工程 \n\na. 計劃及帶領小隊或團完成一個應用不少於三種編結之先鋒工程 \n\n   - ． 計劃及帶領有關的事前準備及事後收拾工作 \n\n   - ． 例如：烽火臺 （Beacon Tower） 、三角形瞭望臺 （Brynbach Tower）、凌空旗架（Suspended Flag Pole） 或搖臂橋 （Rocker Bridge）等 \n\n   - ． 製作一個先鋒工程計劃，其內容應最少包括圖樣、工作程序、 所需器材、工具及時間等 \n\n- b. 教授小隊隊員或團員基本先鋒工程技巧 \n\n   - ． 包括繩結之結法與用途，及收繩的方法與技巧 \n\n##### 完成下列項目其中一項： \n\n註：成員只需在戶外活動／海上活動／航空活動選取其中一項為主要考覈項 目，而各進度性獎章的選項均須相同。惟海童軍必須選擇「海上活動」； 空童軍必須選擇「航空活動」。 \n\n#### 4 . 戶外活動 ( 選修項目) \n\na. 完成童軍高級獎章戶外活動部分 \n\nb. 策劃和參與一個全日小隊、團或旅戶外活動 \n\n- ． 例如：原野烹飪、野外追蹤、密碼通訊或天象觀測等 \n\n40 | 進度性獎章\n\n<!-- p.42 -->\n總領袖獎章 \n\n   - c. 考獲以下其中一個從未在過往獎章獲得的指定技能組專科徽章 ． 露營、探險、先鋒工程或原野烹飪專科徽章 \n\n- 5 . 海上活動 ( 選修項目) \n\n   - a. 完成童軍高級獎章海上活動部分 \n\n   - b. 策劃及參與一個不少於六小時之海上旅程 \n\n- 6 . 航空活動 ( 選修項目) \n\n   - a. 完成童軍高級獎章航空活動部分 \n\n   - b. 與團長商討後，於自選航空活動項目內選擇其中兩項從未進行過之 項目 \n\n### **B. 身心創藝** \n\n- 1 . 身心健康 \n\n   - a. 考獲一個從未在過往獎章獲得與體適能有關之專科徽章 \n\n         - ． 例如：龍舟（興趣組）、騎術（興趣組）、划艇（興趣組）、 運動（興趣組）、滑浪風帆（興趣組）、射箭（技能組）、 艇長（技能組）、獨木舟（技能組）、野外定向（技能組）、 射擊（技能組）、技擊（技能組）、風帆（技能組）或徒手 潛水（技能組）等 \n\n         - ． 學習或練習上述專科徽章之技能的時間最少需要二十六小 時，且持續地在不少於六個月（即二十六個星期）進行 \n\n   - b. 完成下列其中一項： \n\n      - I. 考獲一個從未在過往獎章獲得與身心健康有關之專科徽章或獎章 \n\n         - ． 例如：精神健康（服務組）、食物營養（服務組）、公共衛 生（服務組）、「積極公民」獎章系列 – 保護兒童章等或 完成SOUL Keeper 精神健康守護者課程（Level 1） \n\n      - II. 與小隊隊員或團員一同認識香港社區有關精神健康的支援，或參 觀／探訪一個與精神健康有關的機構並瞭解其服務 \n\n#### 2 . 科學、科技、工程、藝術、數學及創意 \n\n- a. 創作及帶領一個營火會或營燈會歡呼、表演節目或遊戲 \n\n- b. 完成下列其中一項： \n\n   - I. 分享一件藝術品創作過程 \n\n      - ． 為一個主題製作一件藝術品，並與團內其他成員分享創作過 程 \n\n   - II. 教授製作一個模型 \n\n      - ． 教授小隊隊員或團員製作一個符合比例的模型 \n\n   - III. 教授以資訊科技製作宣傳品 \n\n      - ． 教授小隊隊員或團員以資訊科技製作宣傳品，分享小隊、團或 旅活動 \n\n進度性獎章 | 41\n\n<!-- p.43 -->\n##### 總領袖獎章 \n\nIV. 教授製作一個以電池驅動的機械 \n\n   - ． 教授小隊隊員或團員製作一個以電池驅動的小工具、機械動物 或昆蟲 \n\n- V. 建立電子地圖 \n\n   - ． 與小隊隊員或團員分享使用電子地圖的技巧和心得 \n\n   - ． 利用電子地圖標示旅部所屬社區的地標或為未來郊野旅程標示 有關路線及檢查點，並發佈至個人網站、網誌或社交網站中 \n\n- VI. 製作一個可操控之機械模型 \n\n   - ． 製作一個可操控（有線或無線）之機械模型，例如：機械動 物、機械昆蟲或機械人等 \n\n   - ． 示範操作及指出其用途、製作材料及運作原理 \n\n### **C. 領袖修養** \n\n- 1 . 領導才 \n\n   - a. 考獲領導才獎章 \n\n- 2 . 靈性發展 \n\na. 向新加入的成員介紹童軍誓詞、規律及銘言的內容和意義 \n\n- b. 完成下列其中一項： \n\n   - I. 帶領一次默禱儀式 \n\n      - ． 認識默禱的意義、目的及內容 \n\n      - ． 在團集會或旅活動完結時帶領一次默禱 \n\n   - II. 協助一次童軍崇拜會 \n\n      - ． 認識童軍崇拜會的目的及意義 \n\n      - ． 負責其中一個環節，例如：領唱、背誦誓詞和規律或短講分享 等 \n\n   - III. 考獲宗教章 \n\n### **D. 社會責任** \n\n#### 1 . 服務他人 \n\na. 考獲以下其中一個指定服務組專科徽章 \n\n   - ． 急救、消防或拯溺專科徽章 \n\n- b. 考獲服務獎章 \n\n42 | 進度性獎章\n\n<!-- p.44 -->\n總領袖獎章 \n\n- c. 協助策劃及持續地參與共不少於二十六小時服務（為期不少於 二十六個星期） \n\n   - ． 協助策劃及參與由總會、地域、童軍區或旅團認許之服務， 其中可包括日常學校內進行的恆常服務 \n\n   - ． 當中有至少兩小時的服務時數必須以童軍身份參與，而其他 的服務時數可以童軍或非童軍身份參與 \n\n   - ． 簡單記錄有關服務內容，例如：服務機構、對象、時間、地 點內容等 \n\n##### 完成下列項目其中兩項： \n\n- 註：成員只需在社區認識／生態環境／氣象／危機及保護選取其中兩項為主 要考覈項目，而總領袖獎章的選項須與童軍高級獎章的選項不同。 \n\n#### 2 . 社區認識（選修項目） \n\n- a. 完成下列其中一項： \n\n   - I. 考獲旅遊（興趣組）專科徽章 \n\nII. 學習與有特殊需要人士的溝通方法 \n\n- ． 認識有特殊需要人士日常生活中的溝通方法 \n\n- ． 參與專門的工作坊或課程，例如：參加手語訓練班或學習凸字 等 \n\nIII. 調查社區設施及服務 \n\n   - ． 在所屬社區就殘疾人士、長者、青少年、少數族裔、新移民 或低入息家庭等，使用社區設施及服務的情況進行一項調查 \n\n   - ． 向小隊、團或公眾人士發佈調查結果及建議改善的方法 \n\n- 3 . 生態環境（選修項目） \n\na. 考獲一個從未在過往獎章獲得與生態環境有關之專科徽章或獎章 \n\n- ． 例如：地質（興趣組）、自然（興趣組）、農務（興趣組） 、樹木護理（技能組）、地球部落章或任何「地球部落」系 列之徽章等 \n\n#### 4 . 氣象（選修項目） \n\na. 完成下列其中一項： \n\n- I. 考獲氣象（興趣組）專科徽章 \n\nII. 教授一項氣象知識 \n\n- ． 教授小隊隊員或團員一項有關的知識，例如：天氣要素、雲層 種類及天氣對童軍活動之影響等 \n\n進度性獎章 | 43\n\n<!-- p.45 -->\n##### 總領袖獎章 \n\nIII. 介紹天氣圖及記錄一個童軍營地自動氣象站的一週天氣 \n\n- ． 從香港天文臺或其他氣象組織取得天氣圖，並指出其用途及 基本圖例，例如：雨、驟雨、雷暴、雪、煙霞、霧、無風、鋒 面或槽等 \n\n- ． 指出天氣圖所描述的天氣概況 \n\n- ． 參考本會自動氣象站天氣資料連續紀錄七天天氣，並指出該 週天氣要素變化的原因 \n\n#### 5 . 危機及保護（選修項目） \n\n- a. 完成下列其中一項： \n\nI. 向小隊隊員或團員介紹人類活動對環境的影響 \n\n   - ． 例如：酸雨形成、溫室效應、熱帶雨林、破壞臭氧層、泥土污 染、水源污染、光害及噪音污染等 \n\n- II. 計劃及帶領參與一個不少於一天或兩次環境保育活動，例如：實 踐、推廣或教育計劃 \n\n   - ． 主題例如：保持郊野環境清潔、保護生物多樣化、改善空氣質 素、減少噪音污染、改善水質、減少製造廢物或可持續地應 用能源等 \n\n### **E. 國際視野** \n\n- 1 . 世界認識 \n\n   - a. 完成下列其中一項： \n\nI. 參加國際電訊日 \n\n   - ． 在國際電訊日活動中與外地童軍聯絡 \n\n- II. 介紹一位外地童軍朋友 \n\n   - ． 與外地童軍持續聯繫不少於三個月，互相認識當地文化、日 常及童軍生活 \n\n   - ． 利用任何形式與小隊隊員分享 \n\n- III. 參加一個與外地童軍交流的活動 \n\n   - ． 參加在本港或外地有關的交流活動，互相認識當地文化、日 常及童軍生活等 \n\n### **F. 探索新知** \n\n- 1 . 參與一項從未嘗試之活動，並向團內其他成員介紹 \n\n   - ． 活動性質需具有自我挑戰及自我成長元素，例如：攀石、歷奇 活動等 \n\n   - ． 向小隊隊員介紹及分享有關經歷 \n\n- 2 . 考獲一個教導組專科徽章 \n\n#### 3 . 考獲深資童軍先修章 \n\n44 | 進度性獎章\n\n<!-- p.46 -->\n# 童軍專科徽章（興趣組） **Scout Proficiency Badges (Interest)** \n\n興趣組專科徽章考驗方法 考驗安排：由童軍團長安排主考 主考：總會、地域或區會的獲授權代表、童軍團長所委任之合適人士 \n\n釣魚 射箭 藝術 運動 Angler Archery Artist Athlete 觀鳥 抱石 營地烹飪 營火 Birdwatcher Boulderer Camp Cook Campfire Host \n\n<!-- Start of picture text -->\n獨木舟 蒐集 電腦<br>Canoeist Collector Computer<br>龍舟 步操 地質<br>Dragon Boatman Footdrill Geologist<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n單車<br>Cyclist<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n騎術<br>Horseman<br><!-- End of picture text -->\n\n專科徽章 ( 興趣組) | 45\n\n<!-- p.47 -->\n風箏 圖書管理 氣象 模型製作 Kite Flyer Librarian Meteorologist Model Maker \n\n音樂 自然 公園定向 動物飼養 Musician Naturalist Park Orienteer Petkeeper \n\n攝影 划艇 風帆 農務 Photographer Rowing Boatman Sailor Smallholder 立劃板 立劃板水球 游泳 旅遊 Stand Up Stand Up Swimmer Tourism Paddleboarder Paddling Polo \n\n46 | 專科徽章 ( 興趣組)\n\n<!-- p.48 -->\n<!-- Start of picture text -->\n滑浪風帆<br>Windsurfer<br><!-- End of picture text -->\n\n專科徽章 ( 興趣組) | 47\n\n<!-- p.49 -->\n完成下列各項： \n\n## 釣  魚 **Angler** \n\n1. 明瞭水上安全規則，明白涉水的危險及其應注重事項，知悉危險的釣魚 場之定義。 \n\n2. 在三個月內，於淡水（水塘區）或鹹水釣魚最少三次，每次需記錄所釣得 之魚類、數目、大小尺寸、垂釣地方、所釣方法、使用之釣具及魚餌、當 日之天氣、水流與潮汐，並記下此等因素對該次魚獲之影響。 \n\n3. 最少能辨別十種魚類（六種鹹水，四類淡水）。 \n\n4. 熟知該十種魚類之習性和其他有關知識，如：釣魚期、分佈地區、釣法 及應用魚餌等。 \n\n5. 認識和懂得運用各類魚餌，羽毛類魚餌及各種海水垂釣之浮子、浮標及 沉子等。 \n\n6. 明白各種釣及其基本結法，各種釣魚輔助工具之使用和保養。 \n\n48 | 專科徽章 ( 興趣組)\n\n<!-- p.50 -->\n完成下列各項： \n\n## 射  箭 **Archery** \n\n1. 能說明弓及箭之各部分名稱。 \n\n2. 認識正確裝拆及保養弓、箭及弦。 \n\n3. 認識射箭之安全守則。 \n\n4. 正確示範射箭的基本姿勢，例如：企立、推弓、拉弦、瞄準、放箭及完成。 \n\n5. 認識熱身及緩和運動。 \n\n6. 認識射箭比賽之規則。 \n\n7. 認識計分制度及升級制度。 \n\n8. 連續參與三個月之有關練習。 \n\n專科徽章 ( 興趣組) | 49\n\n<!-- p.51 -->\n完成下列各項： \n\n## 藝  術 **Artist** \n\n1. 對下列其中一項藝術活動有基本認識： \n\n   - (a) 繪畫； \n\n   - (b) 陶瓷； \n\n   - (c) 雕塑； \n\n   - (d) 書法； \n\n   - (e) 戲劇； \n\n   - (f) 舞蹈；或 \n\n   - (g) 其他性質類似及程度相若之藝術活動。 \n\n2. 持續參與該項藝術活動不少於三個月。 \n\n3. 示範或展示其個人作品。 \n\n4. 認識在該項藝術活動中個人喜愛或有成就的人物或團體，並能介紹其獨 特之處。 \n\n50 | 專科徽章 ( 興趣組)\n\n<!-- p.52 -->\n完成下列各項： \n\n## 運  動 **Athlete** \n\n1. 對下列其中一項運動有基本認識： \n\n   - (a) 田徑； \n\n   - (b) 球類； \n\n   - (c) 溜冰； \n\n   - (d) 跳繩； \n\n   - (e) 體操；或 \n\n   - (f) 其他性質類似及程度相若之運動。 \n\n2. 持續參與該項運動不少於三個月。 \n\n3. 示範該項運動的各種基本技巧。 \n\n4. 認識在該項運動中個人喜愛或有成就的人物或團體，並能介紹其獨特之處。 \n\n專科徽章 ( 興趣組) | 51\n\n<!-- p.53 -->\n## 觀  鳥 \n\n## **Birdwatcher** \n\n完成下列各項： \n\n1. 認識觀鳥的來源和歷史。 \n\n2. 認識鳥類身體結構、特徵，留鳥／候鳥及遷徒路線等。 \n\n3. 認識鳥類及相關生物與自然生境之關係。 \n\n4. 認識本地觀鳥組織及香港熱門的觀鳥地點。 \n\n5. 認識本地十二種常見的鳥種。 \n\n6. 說出觀鳥時的注意事項及禮儀。 \n\n7. 認識觀鳥技巧及所需器材。 \n\n8. 參加一次觀鳥活動並作出紀錄（地點例如：公園、濕地公園或其他合適 之觀鳥場所）。 \n\n52 | 專科徽章 ( 興趣組)\n\n<!-- p.54 -->\n完成下列各項： \n\n## 抱  石 **Boulderer** \n\n1. 懂得如何安全進行抱石運動，包括： \n\n   - (a) 場地及環境安全； \n\n   - (b) 正確下降及落地姿勢；及 \n\n   - (c) 適當裝備，如：攀石鞋及粉袋。 \n\n2. 示範抱石的各種基本技巧（例如：三點支撐法，以及不同種類的手部抓 握方式等）。 \n\n3. 持續參與抱石運動不少於一個月。 \n\n專科徽章 ( 興趣組) | 53\n\n<!-- p.55 -->\n## 營 地 烹 飪 **Camp Cook** \n\n完成下列各項： \n\n1. 設計一小隊週末露營，包括早、午、晚三餐之菜單，內容應有以下項目： (a) 材料及份量； \n\n   - (b) 價格；及 \n\n   - (c) 烹調方法。 \n\n- 註： 早餐最少有一熱食，午、晚餐為三餸一湯（以新鮮食物為主，包括：魚、肉、蔬菜及蛋）。 \n\n2. 由一助手協助在露營期間烹調上述設計之晚餐。 \n\n- 註： 此章宜安排在小隊或團露營時進行考驗。 \n\n54 | 專科徽章 ( 興趣組)\n\n<!-- p.56 -->\n## 營  火 **Campfire Host** \n\n完成下列各項： \n\n1. 明白營火會的意義和類別。 \n\n2. 簡述營火會的儀式。 \n\n3. 製作及擁有一件營火袍並在袍上縫上至少兩個布章。 \n\n4. 認識至少十首營火歌曲，其中一首必須為 \"Campfire's Burning 熊熊烈火\"。 \n\n5. 參與一次營火會。 \n\n6. 創作及帶領一個營火會歡呼、表演節目或遊戲。 \n\n專科徽章 ( 興趣組) | 55\n\n<!-- p.57 -->\n完成下列各項： \n\n## 獨 木 舟 **Canoeist** \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港獨木舟總會獨木舟二星章／少年獨木舟海獅章或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會頒佈的最新課程為依歸。 \n\n56 | 專科徽章 ( 興趣組)\n\n<!-- p.58 -->\n完成下列各項： \n\n## 搜  集 **Collector** \n\n1. 以最少六個月時間去搜集一種物件，並有系統地去整理。 \n\n- 註：(1) 蒐集物由童軍自己選擇，如：郵票、火柴盒、錢幣及貝殼等。 \n\n   - (2) 所蒐集之物件必須有足夠之數量，並知其本質之特性，所蒐集物件之質素亦為重要之 條件。 \n\n2. 與主考討論選擇所蒐集物件之理由，並顯示對所蒐集之物件有真正興趣 及認識。 \n\n專科徽章 ( 興趣組) | 57\n\n<!-- p.59 -->\n完成下列各項： \n\n## 電  腦 **Computer** \n\n1. 認識電腦軟件和硬件的分別。 \n\n2. 認識電腦基本硬件，如CPU 及GPU 等。 \n\n3. 概述電腦的演變史。 \n\n4. 認識有損和無損檔案格式的分別。 \n\n5. 闡述聲音、圖像和視像如何數碼化。 \n\n6. 認識惡意軟件、保護資訊及安全通訊的方法。 \n\n7. 認識互聯網的基本概念及路由器的組成。 \n\n8. 使用試算表／文字處理器／簡報/ 繪圖軟件完成一項小隊事工（例如：製 作小隊通訊表、小隊簡介簡報、小隊財政報表或小隊徽等）。 \n\n58 | 專科徽章 ( 興趣組)\n\n<!-- p.60 -->\n完成下列各項： \n\n## 單  車 **Cyclist** \n\n1. 擁有或曾滿意地使用一輛裝備及功能良好之單車六個月以上。 \n\n2. 能作簡單之單車修理，例如：更換內呔、外呔、補呔、換車掣、調整座 位及車之高度及位置等。 \n\n3. 對交通安全規則、交通標誌、交通燈號、道路符號、本地之道路編排和 方向有所認識，並能閱讀街道圖。 \n\n4. 參加一項包括使用單車之童軍活動。 \n\n專科徽章 ( 興趣組) | 59\n\n<!-- p.61 -->\n## 龍  舟 \n\n## **Dragon Boatman** \n\n完成下列各項： \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 完成由本會舉辦（為期一天及不少於六小時）之龍舟訓練班或本會認許之 龍舟槳手訓練班，內容包括： \n\n   - (a) 明瞭下列各項理論： \n\n      - (i) 龍舟運動之歷史與發展； \n\n      - (ii) 熱身運動之重要性； \n\n      - (iii) 龍舟的裝備及各部分名稱； \n\n      - (iv) 龍舟的類別及製造材料； \n\n      - (v) 龍舟運動的水上安全知識；及 \n\n      - (vi) 一般龍舟賽事之賽制。 \n\n   - (b) 完成下列各項實習： \n\n      - (i) 握槳的正確方法； \n\n      - (ii) 正確的坐姿； \n\n      - (iii) 處理每一槳之四個步驟—準備、入水、划水、起水； \n\n      - (iv) 前槳、後槳、橫槳、急停技術之掌握； \n\n      - (v) 認識覆舟後的處理方法； \n\n      - (vi) 明瞭對齊及平衡的重要性及技巧； \n\n      - (vii) 正確準備、收拾及保養龍舟及槳；及 \n\n      - (viii) 進行不少於兩小時訓練，並進行一場距離不短於二百五十米的 練習賽。 \n\n60 | 專科徽章 ( 興趣組)\n\n<!-- p.62 -->\n## 步  操 \n\n## **Footdrill** \n\n主考必須持有總會認可步操基本訓練班證書。 \n\n完成下列各項： \n\n1. 明瞭步操的目的。 \n\n2. 明瞭及能正確做出下列動作： \n\n   - (a) 立定步操 (Footdrill at the halt)：立正 (Position of attention)、稍息 (Stand at ease)、休息 (Stand easy)、左或右轉 (Left or right turn)、後 轉 (About turn)、斜轉 (Inclining)、橫移 (Side pace)、向前敬禮 (Saluting to the front)； \n\n   - (b) 快步步操 (Footdrill in quick time)：快步開步 (Marching in quick time)、快步停步 (Halting in quick time)；及 \n\n   - (c) 排列隊形 (Formation)：報數及排列 (Numbering & sizing)、解散 (Dismissing and falling out)。 \n\n專科徽章 ( 興趣組) | 61\n\n<!-- p.63 -->\n完成下列各項： \n\n## 地  質 \n\n## **Geologist** \n\n1. 解釋下列各項： \n\n   - (a) 岩石及礦物的定義； \n\n   - (b) 火成（原生）巖、沉積巖及變質巖的特徵和形成過程；及 \n\n   - (c) 岩石循環。 \n\n2. 略述香港主要的岩石及礦物的種類，並列舉例子及其分佈情況。 \n\n3. 自行製作一份擁有十五種以上岩石及礦物的觀察紀錄冊，內容應包括： 其照片、分類、來源、化學成份及物理性質。 \n\n4. 參加一次戶外地質考察活動，並於旅團集會中作出匯報。 \n\n62 | 專科徽章 ( 興趣組)\n\n<!-- p.64 -->\n完成下列各項： \n\n## 騎  術 \n\n## **Horseman** \n\n1. 對馬匹的烈性行為有基本認識。 \n\n2. 認識策騎和處理馬匹時所穿著的保護衣物和裝備。 \n\n3. 懂得怎樣安全地牽引馬匹。 \n\n4. 懂得怎樣安全地使用上馬臺騎上馬匹。 \n\n5. 調整腳鐙帶至合適長度，並檢查馬肚帶已收緊妥當。 \n\n6. 示範慢步時的騎術 — 停止至慢步、慢步至停止、左右轉。 \n\n7. 示範快步時的騎術 — 慢步至快步、快步至慢步、左右轉。 \n\n8. 示範輕快步時的騎術 — 慢步至輕快步、輕快步至慢步、左右轉。 \n\n9. 認識常用馬具的名稱和用途 — 馬鞍、馬肚帶、馬勒、嚼子、韁繩、腳鐙、 腳鐙帶。 \n\n10. 認識騎術學校內的基本「道路規則」。 \n\n11. 說出馬匹身體的六個部分。 \n\n12. 使用軟刷為馬匹作簡單刷身。 \n\n專科徽章 ( 興趣組) | 63\n\n<!-- p.65 -->\n完成下列各項： \n\n## 風  箏 **Kite Flyer** \n\n1. 對風箏的歷史有基本知識。 \n\n2. 製作一款風箏，能簡介該風箏的各部分名稱及製作方法。 \n\n3. 能解釋風箏飛行原理。 \n\n4. 明瞭風箏活動安全守則。 \n\n5. 明瞭飄放風箏之相關法例。 \n\n6. 成功將風箏升空並停留在天空中不少於十五分鐘。 \n\n64 | 專科徽章 ( 興趣組)\n\n<!-- p.66 -->\n完成下列各項： \n\n## 圖 書 管 理 **Librarian** \n\n1. 向主考描述一本書之製造過程及保養方法。 \n\n2. 明瞭圖書之編目方法。 \n\n3. 知道怎樣利用一圖書館之目錄索引。 \n\n4. 擔任學校或團體之圖書館服務員最少六個月，並有良好之服務紀錄 （需出示服務機構之書面證明）。 \n\n專科徽章 ( 興趣組) | 65\n\n<!-- p.67 -->\n## 氣  象 \n\n## **Meteorologist** \n\n完成下列各項： \n\n1. 明瞭各種天氣要素及其重要性。 \n\n2. 明瞭雲的形成過程及辨認十種基本雲層種類。 \n\n3. 閱讀地面天氣圖及地面等壓線圖，以簡述當前天氣概況。 \n\n4. 明瞭四季形成的原因，並簡述廿四節氣與中國習俗的關係。 \n\n5. 明瞭天氣與氣候的分別。 \n\n6. 明瞭本港之氣候，及本港常用之天氣術語及警告之定義。 \n\n7. 明瞭各種獲取天氣資訊的方法。 \n\n8. 明瞭天氣對各種童軍活動之影響，並與小隊討論各種天氣變化時的應變 措施。 \n\n9. 認識人類活動對氣候變化的影響，建議實踐綠色童軍生活的方法。 \n\n10. 利用童軍自動氣象站資料，記錄一週天氣（包括溫度、濕度、雨量及風 速等），並解釋天氣變化趨勢之主因。 \n\n66 | 專科徽章 ( 興趣組)\n\n<!-- p.68 -->\n## 模 型 製 作 **Model Maker** \n\n完成(A) 至(D) 其中一項： \n\n(A) \n\n1. 製造一模型飛機（可以用模型盒）當飛行時應符合下列其中一項之條件： \n\n   - (a) 滑翔（用手拋擲） 二十五秒； \n\n   - (b) 滑翔（用不長於五十公尺之線拖起） 四十五秒； (c) 橡筋推動 三十秒； \n\n   - (d) 機器推動（於十五秒內能離地起飛） 四十五秒；或 \n\n   - (e) 控制線，使飛機完滑地起飛，於離地兩公尺之高度平穩地打圈三次， 然後爬昇及俯衝降落。 \n\n2. 對飛行基本原理有所認識，包括飛機之三軸及其對飛機之平衡及控制之影 響。 \n\n- (B) \n\n1. 製作一個長度不少於四十五公分之電動或機動模型船或遊艇（可使用模 型盒），使之可以直線航行二十三公尺以上。 \n\n2. 解釋亞基米得原理。 \n\n##### (C) \n\n1.  (a) 製造一電動模型軌跡跑車（不準利用模型盒，但可使用商造之車身 及配件）及使之在任何軌道上不停行駛一百二十二公尺，不得離開 軌道超過四次；或 \n\n   - (b) 製造任何兩種模型汽車（可用模型盒）及使之走動至少十八公尺， 可以利用電動摩打推進。 \n\n2. 明瞭怎樣量度路軌及輪距並解釋阿克曼駕駛原理。 \n\n##### (D) \n\n1. 做一車廂及示範它能在一火車頭拖引下順利行走。 \n\n2. 做一景物之模型，例如：戰地、火車站、農莊等；這些景物應依照比例 分佈。 \n\n3. 認識指揮電動火車之訊號。 \n\n專科徽章 ( 興趣組) | 67\n\n<!-- p.69 -->\n## 音  樂 \n\n## **Musician** \n\n完成(A) 至(E) 其中一項： \n\n##### (A) \n\n1. 曾擔任獨唱或在合唱團中唱高音或低音部分；另唱一首臨時指定歌。 \n\n2. 瞭解基本樂理： \n\n   - (a) 能寫三種譜號（高音、中音、低音）；及 \n\n   - (b) 能寫出三個大調或小調。 \n\n3. 知道奏鳴曲、協奏曲及聖樂之分別，同時能分別舉出三個例子。 \n\n4. 與主考研究近期參加過的演奏會或從其他電子媒介中收看或收聽的演奏會 表演。 \n\n##### (B) \n\n1. 以合規定之樂器演奏一首有伴奏之自選樂曲；或獨奏兩首自選曲；或為 學校或其他組織的樂隊現役成員。 \n\n2. 獨奏一首臨時指定之樂曲。 \n\n3. 瞭解基本樂理： \n\n   - (a) 能寫三種譜號（高音、中音、低音）；及 \n\n   - (b) 能寫出三個大調或小調。 \n\n4. 知道奏鳴曲、協奏曲及聖樂之分別，同時能分別舉出三個例子。 \n\n5. 與主考研究近期參加過的演奏會或從其他電子媒介中收看或收聽的演奏會 表演。 \n\n##### (C) \n\n1. (a) 不用樂器伴奏，唱出不同類型或不同地方之民歌兩首，如靈歌及船 歌、山歌或催眠歌等； \n\n   - (b) 以樂器（五絃琴、結他、瓢琴等）自我伴奏唱兩首不同類型之民 歌；或 \n\n   - (c) 用五絃琴、結他、瓢琴、手風琴及口琴或其他民歌樂器演奏兩首不 同類型之民歌。 \n\n   - 註：民歌以越簡單越好，各童軍須運用個人技巧創作出個人風格。 \n\n2. 瞭解基本樂理，例如調子、和絃、低音音符及為自己的樂器調音等。 3. 與主考討論一些你所喜愛之民歌及歌手或作曲家，並須指出你所喜愛之理 由。 \n\n68 | 專科徽章 ( 興趣組)\n\n<!-- p.70 -->\n##### (D) \n\n1. 顯示你能調校風笛子音調。 \n\n2. 以2/4 拍子演奏兩首風笛進行曲。 \n\n3. 以6/8 拍子演奏兩首風笛進行曲。 \n\n4. 演奏一首慢進行曲或慢抒情曲。 \n\n5. 演奏一首進行曲，一首斯特拉斯貝舞曲及一首蘇格蘭高地舞曲（進行曲 須為上述第二項其中之一首）。 \n\n   - 註：(1)  可自由選擇音調。 \n\n   - (2)  如用愛爾蘭或諾森伯蘭笛子時，主考可根據情形選擇另外方法考驗。 \n\n##### (E) \n\n1. 擔任童軍、學校或其他組織樂隊成員，如：救世軍等。 \n\n2. 證明你對下列其中一種樂器有所專長： \n\n   - (a) 小鼓： \n\n      - (i) 示範你的樂器之例行保養； \n\n      - (ii) 能正確地吊著鼓及拿著鼓棒操行（不必打鼓）； \n\n      - (iii) 以2/4 及6/8 拍敲擊； \n\n      - (iv) 以2/4、6/8 及3/4 拍之「弱拍」敲擊； \n\n      - (v) 以旋轉方式之敲擊： \n\n         - ． 三拍旋轉 \n\n         - ． 五拍旋轉 \n\n         - ． 七拍旋轉 \n\n      - (vi) 成功地參加六種不同款式之操行。 \n\n   - (b) 高音鼓： \n\n      - (i) 示範你對你的樂器之例行保養； \n\n      - (ii) 能正確地吊著鼓及拿著鼓棒操行（不必打鼓）； \n\n      - (iii) 以2/4 及6/8 拍敲擊； \n\n      - (iv) 以2/4、6/8 及3/4 拍之「弱拍」敲擊； \n\n      - (v) 以旋轉方式之敲擊: \n\n         - ． 三拍旋轉 \n\n         - ． 五拍旋轉 \n\n         - ． 七拍旋轉 \n\n      - (vi) 在樂隊操行時或停止時表演擊鼓錘； \n\n      - (vii) 操行不少於五十公尺，一分鐘敲擊一百一十六拍；及 \n\n      - (viii) 以慢操操行不少於五十公尺，一分鐘敲擊六十五拍。 \n\n專科徽章 ( 興趣組) | 69\n\n<!-- p.71 -->\n- (c) 低音鼓（大鼓）： \n\n   - (i) 示範你的樂器之例行保養； \n\n   - (ii) 能正確地吊著鼓及拿著鼓棒操行（不必打鼓）； \n\n   - (iii) 在樂隊進行或休息時，以棒表現簡單之指導員姿態； \n\n   - (iv) 操行不少於五十公尺，一分鐘敲擊一百一十六拍；及 (v) 以慢操操行不少於五十公尺，一分鐘敲擊六十五拍。 \n\n- (d) 號角或喇叭： \n\n   - (i) 示範你的樂器之例行保養； \n\n   - (ii) 用右手提著號角或喇叭，前腰掛上響鈴，搖動左手操行 （不必吹奏）；及 \n\n   - (iii) 奏出：集合、炊事、熄燈、起牀、敬禮及日落或撤退。 \n\n70 | 專科徽章 ( 興趣組)\n\n<!-- p.72 -->\n完成下列各項： \n\n## 自  然 **Naturalist** \n\n1. 認識昆蟲的種類及身體結構，包括：鱗翅目、蜻蜓目、膜翅目、直翅目、 半翅目、螳螂目、雙翅目及鞘翅目。 \n\n2. 認識三種香港常見昆蟲的習性。 \n\n3. 認識植物的種類，包括：非維管植物與維管植物；無種子植物與有種子 植物；和無花植物與有花植物。 \n\n4. 辨認十種香港常見植物（例如：洋紫荊、宮粉羊蹄甲、大紅花、牽牛花 等）。 \n\n5. 以照片形式記錄其中一項： \n\n   - (a) 攀援植物、喬木和灌木各兩種；或 \n\n   - (b) 三種昆蟲。 \n\n專科徽章 ( 興趣組) | 71\n\n<!-- p.73 -->\n## 公 園 定 向 **Park Orienteer** \n\n完成下列各項： \n\n1. 認識越野式及奪分式定向比賽類型。 \n\n2. 認識公園定向所需要之裝備。 \n\n3. 明瞭公園定向地圖比例、等高線、顏色及其相關圖例之定義。 \n\n4. 懂得正置公園定向地圖方法。 \n\n5. 明瞭3S 及拇指輔行法之應用。 \n\n6. 明瞭公園定向比賽程序、安全措施及規則。 \n\n7. 能描述地圖上一段不少於一百米路程所見到的地理特徵。 \n\n8. 參與一次公園定向活動、比賽或短途定向賽事。 \n\n72 | 專科徽章 ( 興趣組)\n\n<!-- p.74 -->\n完成下列各項： \n\n## 動 物 飼 養 **Petkeeper** \n\n1. 辨別五大類脊椎動物（魚類、兩棲類、爬行類、鳥類及哺乳類）及無脊 椎動物，並認識其等的生活習性、棲息地和生存的基本需要。 \n\n2. 認識香港動物常見的疾病。 \n\n3. 明瞭飼養動物的責任。 \n\n4. 擁有飼養任何動物至少一年的經驗，明瞭飼養動物是對動物一生的承諾， 並作簡單記錄： \n\n   - (a) 如該動物為哺乳類： \n\n      - 應知道其居住空間需要、飲食、行為傾向、訓練、生活習慣及美 容娛樂等的注意事項； \n\n   - (b) 如該動物為兩棲類： \n\n      - 應知道其溫度濕度需要、底材、躲藏空間、飲食、飼育箱空間、 獨立飼養及環境清潔等的注意事項； \n\n   - (c) 如該動物為爬行類： \n\n      - 應知道其熱源光源需要、水陸比例、躲藏空間、水質、飲食及活 動空間等的注意事項； \n\n   - (d) 如該動物為鳥類： \n\n      - 應知道其居所佈置（例如：澡盆、棲枝佈置、鳥籠放置高度、籠 內飛行空間）、清潔及梳理羽毛、互動及訓練及飲食等的注意事 項；或 \n\n   - (e) 如該動物為魚類： \n\n      - 應知道魚缸佈置、植物動物比例、燈光、水溫、水質、鹹淡程度、 活動空間、食種及排泄物處理等的注意事項。 \n\n專科徽章 ( 興趣組) | 73\n\n<!-- p.75 -->\n## 攝  影 \n\n## **Photographer** \n\n完成(A) 或(B) 其中一項： \n\n##### (A) 攝影 \n\n1. 以實體印刷／電子方式出示十二幅個人攝影作品（可選擇菲林相機、 數碼相機或智能電話），照片應包括以下最少四種不同之題材，並向 主考解釋作品中使用的攝影技巧及意念： \n\n   - (a) 人像； \n\n   - (b) 風景； \n\n   - (c) 童軍活動； \n\n   - (d) 街頭攝影； \n\n   - (e) 運動； \n\n   - (f) 團體照；或 \n\n   - (g) 縮時攝影。 \n\n   - 註：智能電話須具備手動曝光和對焦功能。 \n\n2. (a)   明瞭菲林相機或數碼相機之各主要部分及使用方法，包括：快 \n\n   - 門、光圈、感光度、景深及焦距等，以獲致最佳的攝影效果；及 (b) 明瞭數碼相機或智能電話之各主要部分及使用方法，包括：解 像度、壓縮格式其如何影響最後打印等，以獲致最佳的攝影效 果。 \n\n3. (a)    介紹菲林相機、數碼相機及智能電話之配件及其使用方法；及 (b)    解釋相機及相機鏡頭的保養方法。 \n\n4. 懂得使用圖像處理軟件, 並向主考解釋如何利用圖像處理軟件為你的 作品進行下列調整以改善相片質素。 \n\n   - (a) 曝光調整； \n\n   - (b) 色彩調整；及 \n\n   - (c) 相片剪裁。 \n\n5. 瞭解如何避免各種錯誤的攝影技巧或沖印技巧（例如：曝光過度不足 及錯誤對焦等）。 \n\n6. 認識機身震動與主體移動的分別。 \n\n74 | 專科徽章 ( 興趣組)\n\n<!-- p.76 -->\n##### (B) 攝錄 \n\n1. 出示一段下列其中一種題材而不少於五分鐘之個人攝錄作品。 （提交之作品可以利用電腦或電話簡單之常用軟件編輯。） \n\n   - (a) 教學短片； \n\n   - (b) 短劇／微電影； \n\n   - (c) 活動花絮； \n\n   - (d) 音樂短片；或 \n\n   - (e) 活動宣傳片。 \n\n2. 明瞭一般攝錄機的功能，包括：變焦、對焦、光圈、白平衡及常用 的紀錄媒體。 \n\n3. 明瞭使用機體預設設定有可能產生的問題及如何解決。 \n\n4. 懂得拍攝影片的基本技巧（例如：水平移動、變焦、近鏡、遠鏡及 燈光運用等）。 \n\n5. 懂得製作影片的基本技巧（例如：編輯、剪接、平穩緩慢拍攝及維 持影片連貫性等）。 \n\n6. 懂得如何良好地保養攝錄機及各種配件。 \n\n專科徽章 ( 興趣組) | 75\n\n<!-- p.77 -->\n## 劃  艇 \n\n## **Rowing Boatman** \n\n完成下列各項： \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港賽艇協會二星單槳/ 雙槳賽艇技術評核證書或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n76 | 專科徽章 ( 興趣組)\n\n<!-- p.78 -->\n完成下列各項： \n\n## 風  帆 **Sailor** \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港帆船運動總會一級風帆證書或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n專科徽章 ( 興趣組) | 77\n\n<!-- p.79 -->\n## 農  務 **Smallholder** \n\n完成下列各項： \n\n1. 一般認識 \n\n   - (a) 認識本港的農業發展。 \n\n   - (b) 認識農場的基本結構，其每日及每季之工作，特別是飼養牲口、 種植農作物、耕種土地及使用農業機械等。 \n\n   - (c) 認識新式耕作，例如：魚菜共生、水耕及有機耕作等的原理。 \n\n##### 2. 理論實踐 \n\n- (a) 種植一種植物並製作一本紀錄冊，紀錄種植過程及植物生長。 \n\n- (b) 基本種植： \n\n   - (i) 辨認十種市面常見的蔬菜；及 \n\n   - (ii) 指出三種香港常見的家種蔬果，包括其特徵、環境要求及如 何打理。 \n\n78 | 專科徽章 ( 興趣組)\n\n<!-- p.80 -->\n## 立 劃 板 \n\n## **Stand Up Paddleboarder** \n\n完成下列各項： \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港獨木舟總會立劃板二段章、少年立劃板二段章證書或同等 資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n專科徽章 ( 興趣組) | 79\n\n<!-- p.81 -->\n## 立 劃 板 水 球 **Stand Up Paddling Polo** \n\n完成下列各項： \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港獨木舟總會立劃板水球二段章證書、少年立劃板水球二段 章證書或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n80 | 專科徽章 ( 興趣組)\n\n<!-- p.82 -->\n完成下列各項： \n\n## 遊  泳 \n\n## **Swimmer** \n\n1. 明瞭游泳安全守則。 \n\n2. 懂得使用基本游泳器材，如：水泡、浮牀、救生衣等。 \n\n3. 用任何方式游泳二百公尺。 \n\n4. 完成下列任何兩項： \n\n   - (a) 捷泳五十公尺； \n\n   - (b) 背泳五十公尺； \n\n   - (c) 胸泳五十公尺；或 \n\n   - (d) 蝶泳五十公尺。 \n\n5. 池邊縱身下水。 \n\n6. 能浮水五分鐘。 \n\n7. 從水面潛入水中，用雙手於兩公尺深之水底找尋一目的物，並用雙手持 之遊回岸邊。 \n\n專科徽章 ( 興趣組) | 81\n\n<!-- p.83 -->\n完成下列各項： \n\n## 旅 遊 \n\n## **Tourism** \n\n1. 旅遊業知識： \n\n   - (a) 概述訪港旅客的需要、期望和想法； \n\n   - (b) 認識三個香港旅遊景點和活動並作出分類； \n\n   - (c) 明白「特色主題旅遊」的重要性，並能說出香港的「特色主題旅遊 點」； \n\n   - (d) 認識中國傳統節日和香港獨有慶典； \n\n   - (e) 瞭解不同文化背景的遊客及其文化和行為差異；及 \n\n   - (f) 明白旅遊業對香港經濟的影響。 \n\n2. 實習： \n\n   - (a) 以其他國家語言或方言介紹一處香港旅遊景點及一個中國傳統節 日或慶典；及 \n\n   - (b) 編寫一個一天「特色主題旅遊」活動的宣傳單張，包括：簡介、 行程、費用、圖片等資料。 \n\n82 | 專科徽章 ( 興趣組)\n\n<!-- p.84 -->\n完成下列各項： \n\n## 滑 浪 風 帆 **Windsurfer** \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港滑浪風帆會初級滑浪風帆證書或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n專科徽章 ( 興趣組) | 83\n\n<!-- p.85 -->\n# 童軍專科徽章（技能組） **Scout Proficiency Badges (Pursuit)** \n\n技能組專科徽章考驗方法 考驗批准人：由童軍團長安排主考 主考：總會、地域或區會的獲授權代表所委任之合適人士 \n\n立體打印 沿繩下降 3D Printing Technician Abseiler \n\n射箭 天象 Archery Astronomer \n\n航空領航 Aviation Navigator \n\n原野烹飪 Backwoods Cook \n\n露營 獨木舟 Camper Canoeist \n\n<!-- Start of picture text -->\n獨木舟水球 攀登<br>Canoe Polo Climber<br>手藝 數據分析<br>Craftsman Data Analyst<br><!-- End of picture text -->\n\n通訊 烹飪 Communicator Cook \n\n<!-- Start of picture text -->\n電子 探險<br>Electronics Explorer<br><!-- End of picture text -->\n\n84 | 專科徽章 ( 技能組)\n\n<!-- p.86 -->\n<!-- Start of picture text -->\n模擬飛行 步操 地圖繪製 地圖閱讀<br>Flight Simulator Footdrill Map Maker Map Reader<br>射擊 技擊 機械 氣象<br>Marksman Master-at-arms Mechanic Meteorologist<br>多媒體創作 領航 觀察 野外定向<br>Multimedia Designer Navigator Observer Orienteer<br>先鋒工程 編程 風帆 徒手潛水<br>Pioneer Programmer Sailor Skin Diver<br><!-- End of picture text -->\n\n專科徽章 ( 技能組) | 85\n\n<!-- p.87 -->\n<!-- Start of picture text -->\n艇長<br>Skipper<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n體育 樹木護理<br>Sportsman Tree Carer<br><!-- End of picture text -->\n\n86 | 專科徽章 ( 技能組)\n\n<!-- p.88 -->\n## 立 體 打 印 \n\n## **3D Printing Technician** \n\n完成下列各項： \n\n1. 明瞭立體打印原理及材料選擇。 \n\n2. 明瞭笛卡爾坐標系XYZ-axis type 立體打印機及三角型Delta type 立體打 印機的操作原理及其優缺點。 \n\n3. 學習任何一種立體設計軟件（建議但不限於使用TinkerCAD），並設計一 個水杯或容器。 \n\n4. 瞭解現今工商業對立體打印應用。 \n\n5. 利用立體設計軟件及立體打印機設計及打造一個獨特的童軍產品，如巾 圈等，並說明其設計的理念。 \n\n專科徽章 ( 技能組) | 87\n\n<!-- p.89 -->\n## 沿 繩 下 降 **Abseiler** \n\n持有下列其中一項： \n\n1. 中國香港攀山及攀登總會之一級繩索技術訓練證書； \n\n2. 香港繩索總會之初級繩索技術證書； \n\n3. 中國香港挑戰網陣協會之康樂緣繩下降技術證書；或 \n\n4. 完成下列各項： \n\n   - (a) 明瞭進行繩索運動的安全要點； \n\n   - (b) 認識個人保護裝備，其安全標準及保養方法；示範正確穿戴、使 用及雙重覆檢程序； \n\n   - (c) 認識繩索活動使用的器材，包括：繩索、各種鎖扣、八字形環下 降器等； \n\n   - (d) 明瞭活動場地安全守則及口號； \n\n   - (e) 認識並示範下列繩結之結法及用途：反手結、八字結、稱人結、 單圈八字結、漁翁結及普式結； \n\n   - (f) 認識各種不同安全防禦措施，包括：頂繩防護法、下拉繩防護法 及個人繩索垂降防護法；及 \n\n   - (g) 示範八字環下降器的設置方法及安全操作，示範正確下降、制停 及鎖繩法。 \n\n88 | 專科徽章 ( 技能組)\n\n<!-- p.90 -->\n## 射  箭 \n\n## **Archery** \n\n完成(A) 至(D) 其中一項： \n\n- (A) 完成下列各項︰ \n\n   1. 明瞭弓之類別； \n\n   2. 明瞭箭之類別； \n\n   3. 能說明弓及箭之各部分名稱； \n\n   4. 明瞭正確裝拆及保養弓、箭及弦； \n\n   5. 正確示範射箭企立、推弓、拉弦、瞄準、放箭、完成姿勢； \n\n   6. 明瞭熱身及緩和運動； \n\n   7. 明瞭射箭之安全守則； \n\n   8. 明瞭射箭比賽之規則及衣著； \n\n   9. 明瞭計分制度及升級制度；及 \n\n   10. 使用反曲弓於十八米及二十五米，或使用複合弓於三十米及四十 米距離以八十釐米面，各射三十六枝箭，總分取得三百環或以上。 \n\n- (B) 參加由中國香港射箭總會或其屬會，或香港童軍射箭聯會屬下之各地域 射箭小組所舉辦之初級訓練班及參加最少一次公開比賽，並於總分取得 三百環或以上。 \n\n- (C) 參加三次中國香港射箭總會認可之反曲弓新秀組，或複合弓初級組比賽， 每次取得三百環或以上之成績。 \n\n- (D) 參加中國香港射箭總會認可之反曲弓新秀組／複合弓初級組比賽並成功 晉組。 \n\n專科徽章 ( 技能組) | 89\n\n<!-- p.91 -->\n## 天  象 \n\n## **Astronomer** \n\n完成下列各項： \n\n1. 概述下列天文觀測概念： \n\n   - (a) 中國星座及西方星座； \n\n   - (b) 太陽、月球、恆星和行星在天球上的運動及其觀測特徵；及 (c) 季節交替變更。 \n\n2. 能說出下列天文現象的成因、特性及觀測方法：月相、日食、月食、流 星及流星雨。 \n\n3. 對太陽系中各主要成員有基本認識。 \n\n4. 概述宇宙的結構。 \n\n5. 明瞭觀星禮儀及光污染對觀星的影響；認識香港的觀星地點。 \n\n6. 示範一種安全觀測太陽的方法。 \n\n7. 能說出天文望遠鏡之功用及其原理。 \n\n8. 參加一次晚間戶外觀星活動。在活動中使用旋轉星圖辨別三個或以上星座， 並能以星座辨別方向。 \n\n9. 參加一次特別天文現象的觀測活動；或有系統地完成一份為期一個月的 月相或性質類似的觀測紀錄。 \n\n90 | 專科徽章 ( 技能組)\n\n<!-- p.92 -->\n## 航 空 領 航 **Aviation Navigator** \n\n完成下列各項： \n\n1. 對現時航空界主要使用的航空圖種類、比例與標示有基本的認識。 \n\n2. 能利用飛行計算尺，透過航線、風速、風向計算飛機的航向。 \n\n3. 明暸 VOR、DME 及 GPS 等導航儀器的應用。 \n\n4. 認識 NOTAM 內容對飛行員的用途及對主考作簡單介紹。 \n\n5. 根據主考提供的路線要求，配合 NOTAM 及航空圖資訊，製作一份航程 不少於五十海里的目視或儀表飛行計劃書，其中必需設定四個或以上的 航程點（不包括起點和終點）。 \n\n6. 按照第五項要求所製作的計劃書，擔任一次模擬飛行領航員。 \n\n專科徽章 ( 技能組) | 91\n\n<!-- p.93 -->\n## 原 野 烹 飪 **Backwoods Cook** \n\n完成下列各項︰ \n\n1. 解釋「燃燒四面體」的原理。 \n\n2. 懂得選擇合適的天然物品作為燃料。 \n\n3. 示範正確使用潛在危險工具的方法。 \n\n4. 示範搭建柴架的正確方法。 \n\n5. 懂得利用天然物料，以不多於十支火柴在二十分鐘內生火。 \n\n6. 以原野烹飪方法（不用任何炊具）煮熟下列其中四種食物： (a) 薯仔蛋或洋蔥蛋； \n\n   - (b) 麵包； \n\n   - (c) 雞肉； \n\n   - (d) 魚； \n\n   - (e) 飯； \n\n   - (f) 水； \n\n   - (g) 蛋糕；或 \n\n   - (h) 其他相若之食物。 \n\n7. 認識野外生火的安全守則。 \n\n92 | 專科徽章 ( 技能組)\n\n<!-- p.94 -->\n完成下列各項： \n\n## 露   營 **Camper** \n\n1. 曾以童軍身份在三個或以上不同地方進行露營活動 [1] 八晚或以上。 \n\n2. 明瞭如何選擇理想營地。 \n\n3. 明瞭營地衛生知識、整潔及安全的重要性，及意外事件的處理方法。 \n\n4. 策劃及執行一個為期最少兩日一夜的小隊固定露營活動，並示範下列各項： \n\n   - (a) 收拾一個兩日一夜固定露營用之背囊； \n\n   - (b) 懂得營區分佈方法； \n\n   - (c) 使用及清理爐具； \n\n   - (d) 正確使用潛在危險工具； \n\n   - (e) 攜帶及貯藏食物的方法； \n\n   - (f) 保持營地衛生整潔的方法及措施； \n\n   - (g) 報到檢查、晚間檢查、晨早檢查及最後檢查的內容及其重要性； \n\n   - (h) 運用露營活動所需的常用繩結； \n\n   - (i) 完成下列之營地建設項目： \n\n      - 營門、營區圍欄、旗架及小隊旗、住宿營、貯物營、貯物架、 \n\n      - 工作檯、紗櫃、飯桌、衣鞋架、廢物處理設施、天幕、告示板 \n\n   - (j) 架搭、拆卸及收拾最少兩種不同種類的營帳； \n\n   - (k) 設計及烹調露營早、午、晚三餐之菜單，包括食物的份量及烹調 方法；及 \n\n   - (l) 撰寫露營計劃書及露營報告書。 \n\n- 註：[1] 露營活動指在營帳或原野天遮下度宿。 \n\n專科徽章 ( 技能組) | 93\n\n<!-- p.95 -->\n完成下列各項： \n\n## 獨 木 舟 **Canoeist** \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港獨木舟總會中級銀章證書或同等資歷。 \n\n- 註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n94 | 專科徽章 ( 技能組)\n\n<!-- p.96 -->\n## 獨 木 舟 水 球 **Canoe Polo** \n\n完成下列各項： \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港獨木舟總會初級獨木舟水球球員證書／獨木舟水球二段章 ／少年獨木舟水球球員深造證書或同等資歷。 \n\n註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n專科徽章 ( 技能組) | 95\n\n<!-- p.97 -->\n完成下列各項： \n\n## 攀  登 \n\n## **Climber** \n\n1. 持有中國香港攀山及攀登總會一級運動攀登訓練證書或一級攀巖訓練證 書。 \n\n2. 進行下列其中一項： \n\n   - (a) 參與一次運動攀登的比賽；或 \n\n   - (b) 在兩個不同的場地（例如：天然巖壁或人工牆等），以頂繩防護法 進行攀登並完成至少三條攀登路線。 \n\n96 | 專科徽章 ( 技能組)\n\n<!-- p.98 -->\n## 通  訊 \n\n## **Communicator** \n\n##### 完成(A) 或(B) 其中一項： \n\n- (A) \n\n1. (a) 用旗語以每分鐘四十五個字母的速率收發一不少過一百五十個字母 的訊息，並用摩士訊號（發報機或訊號燈）以每分鐘二十五個字母 的速率收發一不少於一百五十個字母的訊息；或 \n\n   - (b) 用發報機以每分鐘四十個字母之速率及用訊號燈以每分鐘三十個 字母的速率收發不少於一百五十個字母的訊息。 \n\n2. 示範收訊及發訊的正確步驟。 \n\n3. 在距離一百五十公尺外，以最少兩種方法使用旗語或摩士訊號以每分鐘 二十個字母之速率發出一訊息。 \n\n- 註：以上各測驗應有百份之八十的準確性。戶外收發站之最少距離應有一百四十公尺，發報機 之收發站應設在不同之房間。 \n\n- (B) \n\n1. (i) 於三個月內，紀錄五十個不同之業餘無綫電臺，紀錄資料包括： 時間、日期、該電臺呼號、訊息強度、可讀性及電臺位置；及 \n\n   - (ii) 與考驗員討論你對業餘無線電資料蒐集紀錄之經驗，例如：發射 、接收機使用方法、最遠可收聽到的訊息等。 \n\n2. 與考驗員討論各業餘電臺所使用的頻帶，明白日間與晚上，採用不同之 頻率通訊時可達到的範圍。 \n\n3. 明確解說最少十二個國際上使用的“Q”訊息。 \n\n4. 清楚香港電訊管理局對使用無線電手提對講機的規定。 \n\n專科徽章 ( 技能組) | 97\n\n<!-- p.99 -->\n完成下列各項： \n\n## 烹   飪 **Cook** \n\n1. 知曉普通烹飪名詞： \n\n   - (a) 爆 \n\n- (b) 醃 \n\n      - (c) 過冷河 \n\n   - (d) 慢火煮 (e) 炆 (f) 拌碟 \n\n2. 明瞭及示範烹飪時應有之安全、整潔及衛生習慣。 \n\n3. 懂得明火烹煮米飯。 \n\n4. 選取一種菜系（例如：中國菜、意大利菜、泰國菜等），設計及製作包 括湯及甜品的五道菜式，當中需要包含下列中三種不同烹調方式： \n\n   - (a) 煎 \n\n   - (d) 炆 \n\n   - (g) 蒸 \n\n- (b) 炒 \n\n   - (c) 炸 \n\n- (e) 燉 \n\n      - (f) 焗 \n\n   - (h) 其他相若之烹調方式 \n\n5. 介紹菜式的煮法、營養及當中使用的擺盤技巧。 \n\n6. 撰寫烹調的工作流程或分工表。 \n\n98 | 專科徽章 ( 技能組)\n\n<!-- p.100 -->\n## 手  藝 \n\n## **Craftsman** \n\n完成(A) 至(G) 其中一項： \n\n##### (A) 籐工 \n\n1. 以籐、水草、稻草或尼龍草編織一實用物件。 \n\n2. 對所用之原料有簡略之認識，如原料之來源、製成經過及怎樣加 工始作編織之用。 \n\n##### (B) 釘書 \n\n   1. 以線帶釘裝一份簿冊用之紙張。 \n\n   2. 把釘裝好之紙張黏上首、尾空頁。 \n\n   3. 用紙或布將硬紙板裱好以作書面，並套上縫好的紙張，釘裝成冊。 \n\n- (C) 木工 \n\n   1. 將螺絲釘旋至三點八公分深，而不損壞該釘及木板。 \n\n   2. 正確地使用一點三公分厚木板及三點八公分長之鐵釘，將一木箱 蓋釘裝妥當。 \n\n   3. 使用普通手鋸將一塊二點五公分厚六十公分長之木板平均縱分為 二，而鋸口不能週開鋸線五分之一公分。 \n\n   4. 磨利一把鑿及一個鉋，用入榫方法接合的小屋。 \n\n   5. 利用入榫方法，以五個榫口將兩塊木板接合，或做一木枱、椅子 或其他傢俱。 \n\n   6. 能分辨本地所用之各類木材，並知道其特性及通常之用途。 \n\n##### (D) 皮工 \n\n1. (a) 用釘及線把一對皮鞋或皮靴之鞋底釘縫妥當；或 \n\n   - (b) 製造一件設計新穎及著色之用具，如手提包、皮夾或錢袋等， 認識怎樣使用及調製各種染料。 \n\n2. 對所用之工具有良好之認識。 \n\n3. 認識各類皮革的用途及怎樣去選擇。 \n\n專科徽章 ( 技能組) | 99\n\n<!-- p.101 -->\n##### (E) 金工 \n\n1. 以銅片或鐵片做一件物件。 \n\n2. 展示所用之工具及示範其用法。 \n\n3. 解釋釬料及鎔接劑之成份及其特性。 \n\n4. 依照指定之尺寸做一個有蓋之鐵罐。 \n\n##### (F) 印刷 \n\n1. 將一張傳單或一頁書排版，然後用印刷機印出。 \n\n2. 明瞭字粒排位之系統及認識六種普通之字體。 \n\n3. 明瞭印刷上改正之符號及認識各種紙張之名稱及尺寸。 \n\n##### (G) 絲網印刷 \n\n1. 懂得用木或金屬製作網架。 \n\n2. 示範拉網上架方法。 \n\n3. 使用雕版紙或曬網方式製版。 \n\n4. 認識水性及油性印刷用料。 \n\n5. 知道膠刮之形狀、應用角度、力度和移動速度，對印網的影響。 6. 示範一個不少於三種顏色之多色印法。 \n\n100 | 專科徽章 ( 技能組)\n\n<!-- p.102 -->\n## 數 據 分 析 **Data Analyst** \n\n完成下列各項： \n\n1. 明確解說平均數、眾數、中位數及四分位數。 \n\n2. 明瞭箱形圖。 \n\n3. 懂得csv 檔案格式的用途。 \n\n4. 指出資料中可能影響其真確性之因素（例如：來源、樣本、時間或偏差）， 並明白如何分辨資料的真確性及可靠程度。 \n\n5. 明白及分辨一手資料及二手資料。 \n\n6. 明白不同的資料收集方法（例如：焦點小組、問卷及訪問）。 \n\n7. 明白如何運用適當的分析工具（例如：圓形圖及棒形圖）匯報所收集的 數據。 \n\n8. 明白如何從數據中整合出趨勢及作出簡單結論。 \n\n9. 完成一項簡單數據分析事工，數據的性質或種類不限（例如：分析童軍 青少年成員人數），內容需要包括以下各項： \n\n   - (a) 事工目的； \n\n   - (b) 數據收集方式； \n\n   - (c) 透過一手或／及二手來源； \n\n   - (d) 數據匯報； \n\n   - (e) 透過合適的分析圖表工具（例如：圓形圖及棒形圖）；及 \n\n   - (f) 闡述不少於三項個人見解。 \n\n專科徽章 ( 技能組) | 101\n\n<!-- p.103 -->\n##### 完成下列各項： \n\n## 電  子 \n\n## **Electronics** \n\n1. 認識可編程的實體物件 (Programmable Physical Objects)，並列出日常生活 中使用到可編程的實體物件的例子。 \n\n2. 認識單板微控制器 (Single-Board Microcontroller)、輸入設備及輸出設備， 並列出日常生活中使用到輸入設備及輸出設備的例子。 \n\n3. 明瞭不同的程序結構，例如：條件句式 (if, else)、循環 (for loop, while loop, break) 等。 \n\n4. 明瞭數碼訊號 (Digital Signal) 和模擬訊號 (Analog Signal) 的區別。 \n\n5. 明瞭各種傳感器的用途及運作原理，如溫度傳感器、溫度和濕度傳感器、 紅外線近距離傳感器和超聲波傳感器等。 \n\n6. 明瞭物聯網 (Internet of Things) 的概念，及其應用的例子。 \n\n7. 完成以下實習： \n\n   - (a) 向主考介紹單板微控制器 ( 例如：Arduino 或micro:bit)、麵包板和 其他電子元件 ( 例如：LED、電阻器、馬達、蜂鳴器、各類傳感器 等) 的功能； \n\n   - (b) 利用任何一種編程環境來建立簡單的程序 ( 例如：mBlock、 Ardublock 或S4A)，並構建簡單的電路 ( 例如：LED 閃爍)； \n\n   - (c) 利用單板微控制器上的模擬輸入及模擬輸出 (PWM)，構建一 個相關的控制電路，例如：控制LED 光暗或控制馬達轉速等； \n\n   - (d) 利用條件句式 (if, else)、循環 (for loop, while loop, break) 等， 設計一個相關的電路； \n\n   - (e) 利用無線收發模組 ( 例如：Bluetooth、Wi-Fi 或Zigbee)，構 建一個無線通訊及數據交換的電路；及 \n\n   - (f) 設計及實踐一個能應用於童軍活動或場地 ( 例如：童軍室) 的專案 ( 例如：LED 走馬燈牌、電子鐘、無線電收音機等)，並說明其設 計理念及目的。 \n\n102 | 專科徽章 ( 技能組)\n\n<!-- p.104 -->\n## 探  險 \n\n## **Explorer** \n\n完成(A) 或(B) 其中一項： \n\n- (A) 完成本會之「基本遠足訓練班」。 \n\n- (B) 完成下列各項： \n\n1. 考獲地圖閱讀章。 \n\n2. 明瞭下列郊野探險的基本技巧： \n\n   - (a) 裝備認識； \n\n   - (b) 策劃及計劃書製作； \n\n   - (c) 事工計劃； \n\n   - (d) 露營技巧； \n\n   - (e) 食物與炊事； \n\n   - (f) 登山技巧； \n\n   - (g) 戶外活動守則； \n\n   - (h) 急救知識及安全措施； \n\n   - (i) 天氣認識； \n\n   - (j) 郊野旅程安全及意外事件處理；及 \n\n   - (k) 報告書製作。 \n\n3. 完成一次兩日一夜的郊野旅程 [1]，該旅程的距離應不少於二十公里，應在 陌生的郊野地區進行荒野探險旅程，並完成一項事工。 \n\n註：[1] 必須以徒步形式。 \n\n專科徽章 ( 技能組) | 103\n\n<!-- p.105 -->\n## 模 擬 飛 行 \n\n## **Flight Simulator** \n\n完成下列各項︰ \n\n1. 明瞭飛行模擬器硬件的安裝及收納方法，包括電腦主機、顯示屏及周邊控 制元件等，並對該等器材的保養具有一般認識。 \n\n2. 運用總會或地域認可的飛行模擬器完成下列各項： \n\n   - (a) 累積不少於十次而總時數不少於十八小時的模擬飛行活動經驗，並 保存一份個人模擬飛行紀錄冊； \n\n   - (b) 正確示範模擬駕駛一架單引擎小型飛機或直昇機，完成一次模擬 目視五邊飛行航程；及 \n\n   - (c) 完成以下其中一項： \n\n      - (i) 在目視模擬飛行航程中，正確示範基本飛行通訊，包括收聽 機場情報通播(ATIS)、要求滑行、出發許可、獲取進場／離 場許可等； \n\n      - (ii) 正確填寫一份符合香港民航處要求的本地目視飛行通知表格 (DCA 6b)，並按表格內容完成一次小型飛機或直升機模擬飛 行航程； \n\n      - (iii) 撰寫一份不少於半小時航程的跨越國土飛行的目視飛行計劃 書，並按照計劃書內容完成一次小型飛機或直升機模擬飛行 航程；或 \n\n      - (iv) 懂得閱讀模擬民航客機的電子飛行儀表系統資料，並在飛行 模擬器上正確示範運用飛行管理系統(FMS)。 \n\n104 | 專科徽章 ( 技能組)\n\n<!-- p.106 -->\n## 步  操 \n\n## **Footdrill** \n\n主考必須持有總會認可的助理步操教練員、步操 教練員或高級步操教練員資格。 \n\n完成(A) 或(B) 其中一項： \n\n- (A) 完成由總會、地域或區會舉辦之童軍步操基本訓練班。 \n\n- (B) 完成下列各項： \n\n1. 明瞭步操述語包括： 全隊 (Squad)、睇齊 (Dressing)、排 (Rank)、行 (File)、 空行 (Blank file)、標號員 (Marker)、收窄排 (Close order)、開闊排 (Open order)。 \n\n2. 明瞭步操之步速和步幅。 \n\n3. 明瞭及能正確做出下列動作： \n\n   - (a) 立定步操 (Footdrill at the halt)：立正 (Position of attention)、稍息 (Stand at ease)、休息 (Stand easy)、左或右轉 (Left or right turn)、後 轉 (About turn)、斜轉 (Inclining)、橫移 (Side pace)、向前敬禮 (Saluting to the front)； \n\n   - (b) 快步步操 (Footdrill in quick time)：快步開步 (Marching in quick time)、快步停步 (Halting in quick time)、左及右轉 (Left or right turn)、後轉(About turn)、左及右轉彎 (Left or right wheel)、向左、右 及前敬禮 (Salute to the left, right or front)、向左及右行注目禮 (Paying of compliments)、原地踏步 (Marking time)；及 \n\n   - (c) 排列隊形 (Formation)：報數及排列 (Numbering & sizing)、三排轉兩 排／兩排轉三排 (Forming two ranks from three ranks and three ranks from two ranks)、睇齊 (Dressing in two / three ranks)、開闊排／收窄 排 (Open and close order at the halt)、行進間開闊排或收窄排 (Open and close order in quick time)、解散 (Dismissing and falling out)。 \n\n4. 明瞭會操的各項程序包括：進場 (Get on parade)、檢閱 (Inspection)、操過 檢閱臺 (March past)、最高致敬 (Review order)、離場 (March off)。 \n\n5. 參加由總會、地域、區或旅所舉辦之會操或步操比賽。 \n\n專科徽章 ( 技能組) | 105\n\n<!-- p.107 -->\n完成下列各項： \n\n## 地 圖 繪 製 **Map Maker** \n\n1. 在一塊由主考選擇一千平方米的地方，使用指南針或平板式，用測量方 法（Radiation, Intersections, Resections）繪製一幅1:200 比例的地圖， 該地圖應包括：田野、建築物或其他類似的地理特徵。 \n\n2. 利用測量方法，指南針及紀錄簿，以1:2000 比例繪製一幅五百米長的 道路地圖，該地圖應包括道路兩旁兩米的突出之物體。 \n\n3. 由主考在1:1000 地圖中選擇之某一部分放大，比例為1:200。 \n\n4. 繪畫一幅1:5000 地圖之簡單橫切面圖，所選之切割線應包括各種不同 的高度及地形。 \n\n5. 簡單匯報香港現時的地圖繪製方法，例如：電子地圖（Digital Mapping），或地理資訊系統（Geographic Information System）。 \n\n106 | 專科徽章 ( 技能組)\n\n<!-- p.108 -->\n## 地 圖 閱 讀 **Map Reader** \n\n完成下列各項︰ \n\n1. 明瞭下列地圖閱讀的基本技巧︰ \n\n   - (a) 地圖認識及保養； \n\n   - (b) 比例及距離； \n\n   - (c) 習用圖例； \n\n   - (d) 坐標系統； \n\n   - (e) 方向及北的認識； \n\n   - (f) 指南針的應用； \n\n   - (g) 等高線與地形；及 \n\n   - (h) 指南針運用技巧。 \n\n2. 完成不少於兩次（共不少於十二小時）於野外進行的實習，內容須包括 以上各項地圖閱讀技巧的實地應用。 \n\n專科徽章 ( 技能組) | 107\n\n<!-- p.109 -->\n完成下列各項： \n\n## 射  擊 \n\n## **Marksman** \n\n1. 認識香港《火器及彈藥條例》。 \n\n2. 認識氣槍射擊安全守則。 \n\n3. 認識所用之氣槍的構造、保養及維修。 \n\n4. (a) 完成一個由香港童軍總會認可之射擊會主辦的氣槍射擊訓練；或 \n\n   - (b) 加入一個射擊會，並於三個月內在認可的靶場內進行不少於十次的射 擊練習。 \n\n5. (a) 在一個標準的十米氣槍靶場，根據國際射擊運動聯盟（ISSF）規則， 進行一次練習，須在四十發以內獲取不低過二百八十環之成績。靶咭 或成績須由靶場主任、槍械導師或教練簽署證明；或 \n\n   - (b) 在一個五十平方米的IPSC 靶場進行一次射擊考覈，根據IPSC 實用射 擊安全規則，在靶場內進行兩組射擊練習，須在二十發以內獲取不低 過十六槍中靶，及沒有被取消資格(Disqualification) — 走火或危險 槍枝操作，方為合格。靶咭或成績須由靶場主任、槍械導師或教練簽 署證明。 \n\n- 註：有關上述射擊專章考驗，應由各旅團或報考的童軍向總會青少年活動署申請。 \n\n108 | 專科徽章 ( 技能組)\n\n<!-- p.110 -->\n## 技  擊 \n\n## **Master-at-arms** \n\n完成下列各項： \n\n1. 對下列其中一項有相當造詣：刀法、棍法、劍擊、拳術、柔道、摔角或 中外武術。 \n\n2. 按時接受所選項目的訓練三個月以上。 \n\n3. 示範所選項目之正確進攻及防守方法。 \n\n專科徽章 ( 技能組) | 109\n\n<!-- p.111 -->\n## 機  械 \n\n## **Mechanic** \n\n##### 完成(A) 或(B) 其中一項： \n\n##### (A) \n\n1. 認識內燃機推動之基本原理，明白汽車離合器、波箱及尾軸之作用。 \n\n2. 拆除及清理火咀，檢查其寬度是否正確，並顯示它於清理後仍能使用。 \n\n3. 清理及安裝分火點，明白分火次序並重新將各火咀插頭正確地接上。 \n\n4.  能分辨汽車內每一保險絲所保護之電路，並將一汽車電池充電。 \n\n5.  檢查及注入適量之汽車摩托油。 \n\n6.  拆除及更換車胎，並明瞭所應採取之預防措施。 \n\n##### (B) \n\n1. 安裝一部最少有兩個半導體之無線電收音機。不得用現成套件，並可 使用耳筒收聽，畫出這收音機之線路圖，並向主考解釋各主要部分之 作用。 \n\n2. 示範能正確地使用小型接釬器，並明瞭於接釬電晶體及印刷電路時所 須特別留意之處。 \n\n3.  明瞭安裝從交流電電源取電而控制之收音機時所需特別小心之處。特別 是交流電及直流電兩用者。（例如裝置一機外揚聲器或作機內之調整。） \n\n4.  修理家庭用收音機之簡單毛病。（如開關掣損壞、雜聲之控制等。） \n\n5.  簡述有關無線電控制之模型、業餘無線電轉播、普通家庭無線電收發 等牌照之頒發條件。 \n\n110 | 專科徽章 ( 技能組)\n\n<!-- p.112 -->\n## 氣  象 \n\n## **Meteorologist** \n\n完成下列各項： \n\n1. 考獲氣象章（興趣組）。 \n\n2. 明瞭大氣結構，及對流層的重要性。 \n\n3. 明瞭各種天氣要素之測量方法。 \n\n4. 明瞭各種天氣系統及天氣現象的形成機制及影響。 \n\n5. 示範閱讀天氣圖、雷達圖及衛星雲圖。 \n\n6. 明瞭基本天氣預測方法，並試行一次短期天氣預報。 \n\n7. 明瞭氣象站設立目的及影響氣象站所得數值之因素。 \n\n8. 完成以下其中一項事工： \n\n   - (a) 設計一實驗或模型，並向其他童軍展示及解釋一種天氣系統或天 氣現象； \n\n   - (b) 設計及製作一氣象儀器，用以示範測量一天氣要素，並明瞭儀器 中的假設及限制； \n\n   - (c) 深入探討一個氣象範疇；或 \n\n   - (d) 比較兩個自動氣象站的天氣要素數值。 \n\n專科徽章 ( 技能組) | 111\n\n<!-- p.113 -->\n## 多 媒 體 創 作 \n\n## **Multimedia Designer** \n\n完成下列各項： \n\n1. 使用圖像處理軟件（例如：Photoshop，Illustrator 等）完成下列其中兩項， 並向主考分享其設計理念： \n\n   - (a) 為童軍活動設計不少於兩項宣傳品（例如：海報、宣傳單張、小 冊子、場刊或橫額等）； \n\n   - (b) 設計不少於兩款童軍活動紀念章； \n\n   - (c) 為旅團網頁或社交平臺設計不少於三個資訊圖表(Infographic)；或 \n\n   - (d) 為旅團網頁設計使用者介面(UX)。 \n\n2. 製作兩條不同類型的短片（例如：紀錄片、短劇、微電影、影片日記 (vlog)、活動宣傳片、活動花絮或教學短片等）。每條短片需與童軍活動 有關及不少於五分鐘，作品亦需包含不同場景、字幕、對白／旁白、音 效及視覺特效等基本元素。 \n\n112 | 專科徽章 ( 技能組)\n\n<!-- p.114 -->\n完成下列各項： \n\n## 領  航 **Navigator** \n\n1. 明白在1:20,000 之地圖中，下列各項之作用： (a) 比例； \n\n      - (b) 座標； \n\n      - (c) 正北； \n\n      - (d) 圖北； \n\n      - (e) 磁北；及 \n\n      - (f) 等高線。 \n\n2. 對道路交通圖所示的交通標誌有基本認識。 \n\n3. 預備一幅適合主考所定之八十公里路程之道路圖，給一名汽車或電單車 駕駛者使用。 \n\n4. 坐於駕駛者旁擔任領途者，作一百公里的旅程。 \n\n   - 註：(1) 旅程之一半以上應在快速公路外行駛，而使用汽車道路則不能多於三十二公里。 (2) 如得主考同意，可用電單車或其他交通工具。 \n\n5. 參加一項有組織之野外定向活動。 \n\n專科徽章 ( 技能組) | 113\n\n<!-- p.115 -->\n完成下列各項： \n\n## 觀  察 \n\n## **Observer** \n\n1. 在金氏遊戲中，以一分鐘時間觀察三十種物件，然後記出其中二十四件， 測驗分兩次舉行，每次均用不同的物件。 \n\n2. 聽十種簡單音響而能辨認其中八種。 \n\n3. 對一件過程不短於一分鐘而涉及三人的事件作一準確的口述或書面報告， 這報告應包括對其中一個由主考指定的人作詳細描述。 \n\n4. 做六個鳥類、動物、汽車或單車痕跡的石膏印模，所有印模須由接受測 驗者單獨印取，並列明印取之日期和地點，其中最少有兩個為鳥類或野 獸之足跡。 \n\n5. 在郊野地方追蹤一段一點五公里長的路程，該路程約有四十個用天然物 件所做的符號。 \n\n114 | 專科徽章 ( 技能組)\n\n<!-- p.116 -->\n完成下列各項： \n\n## 野 外 定 向 **Orienteer** \n\n1. 完成 (a) 或 (b) 或 (c) 項： \n\n   - (a) 完成總會、地域或區會舉辦之野外定向專章訓練班； \n\n   - (b) 持有「中國香港定向總會」之野外定向第一階段訓練班證書；或 \n\n   - (c) 完成下列各項： \n\n      - (i) 認識野外定向的歷史及形式； \n\n      - (ii) 認識野外定向運動裝備； \n\n      - (iii) 明瞭野外定向地圖比例、等高線、顏色及其相關圖例之定義； (iv) 認識國際控制點提示符號表； \n\n      - (v) 能分別使用指南針及地貌來正置地圖； \n\n      - (vi) 明瞭下列定向技術 — 3S、拇指輔行法、扶手法及沿途蒐集 特徵； \n\n      - (vii) 明瞭野外定向比賽之類型、程序和規則； \n\n      - (viii) 明瞭野外定向活動之安全措施；及 \n\n      - (ix) 能描述地圖上其中一段路程( 不少於五百米)。 \n\n2. 完成下列其中一場越野式野外定向比賽： \n\n   - (a) 由總會、地域或區會舉辦之野外定向比賽；或 \n\n   - (b) 「中國香港定向總會」認可之公開野外定向賽事。 \n\n- 註：雙人組、體驗組、公園定向及短途定向賽將不計算在內。 \n\n專科徽章 ( 技能組) | 115\n\n<!-- p.117 -->\n## 先 鋒 工 程 \n\n## **Pioneer** \n\n完成(A) 或(B) 其中一項： \n\n- (A) 完成本會認許之先鋒工程訓練班。 \n\n- (B) 完成下列各項： \n\n1. 認識各類適合先鋒工程使用之人造纖維或天然纖維製造繩纜的主要特 性，示範怎樣保養及綑捲繩纜，並估計繩纜之狀況及所能承受之力量。 \n\n2. 認識下列情形所造成的危險：漠視領導人之指示、不守紀律、工具 之誤用或超越負荷、繩結及編結之錯誤等。明瞭人造纖維繩纜在裂 斷時所做成之危險。 \n\n   3. 明瞭及示範使用各類先鋒工程所需之不同樁躉，使能適用於各類先鋒 工程紮作、位置及土壤，包括鬆土及沼澤。 \n\n   4. 認識並示範下列繩結之結法及用途： 接繩結、雙套結、繫木結、稱人結、曳木結、縮繩結、四方編結、西 部或普通繩端結、滑輪代用結、雙接繩結、漁翁結、三套結、八字編 結、十字編結、帆工繩端結、鳳眼織結、繩端織結、接棍編結、絞盤 結、貓爪結。 \n\n   5. 在主考出示之先鋒工程圖片中選擇一項，然後有效率地與三至四位接 受測驗者合作完成之。接受測驗者應施行各種需要的安全措施。 \n\n   6. 獨自設計一項先鋒工程。該設計之用途、圖則、工作程序、所需材料 、工具及時間等均須事前與主考討論及得其同意。製造一個此先鋒工 程之合比例模型。 \n\n- 註：(1) 接受測驗之童軍可自由選擇各類先鋒工程，並可要求主考在請示時可提出一些建議。雖 然童軍設計之先鋒工程可能有部分與圖片或他人之設計相同，但該童軍須顯示其創作力 ，以證明他能勝任該項活動，並非只能抄襲他人者。 \n\n   - (2) 上列(5)、(6) 各項必須為不同類之先鋒工程。例如: 木筏、瞭望臺、橋樑、起重機等。 這類紮作應有足夠之比例，以能顯示其先鋒工程技術之運用技巧。 \n\n116 | 專科徽章 ( 技能組)\n\n<!-- p.118 -->\n## 編  程 \n\n## **Programmer** \n\n完成下列各項： \n\n1. 學習使用任何一個整合開發環境（Integrated Development Environment） 編寫應用程式或網頁，不限於iOS、Android 或其他作業系統平臺應用程 式（Apps）。 \n\n2. 學習使用任何一種程式語言，如Python、JavaScript、C++，包括以下內容： (a) 資料型別 (Data type)； \n\n   - (b) 數學運算 ( 加、減、乘、除、最小值、最大值、平均值) \n\n   - (c) 邏輯運算 (and, or, not)； \n\n   - (d) 條件句式 (if, else)；及 \n\n   - (e) 循環 (for loop, while loop, break) 。 \n\n3. 完成以下實習： \n\n   - (a) 以任何程式語言，設計及編寫一個多畫面、聲音及包含數據輸入/ 輸出功能的程式；及 \n\n   - (b) 以任何程式語言，設計及編寫一個簡單的遊戲程式，適合童軍活 動中應用，及後收集用戶的用後感，提出改善建議。 \n\n專科徽章 ( 技能組) | 117\n\n<!-- p.119 -->\n完成下列各項： \n\n## 風  帆 **Sailor** \n\n1. 持有本會之有效游泳測試證明書。 \n\n2. 考獲中國香港帆船運動總會二級風帆證書或同等資歷。 \n\n- 註：此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n118 | 專科徽章 ( 技能組)\n\n<!-- p.120 -->\n完成下列各項： \n\n## 徒 手 潛 水 **Skin Diver** \n\n1.  (a) 能安全及正確地使用有關徒手潛水的儀器；及 \n\n   - (b) 熟悉個人潛水儀器（不論在泳池或在平靜的開放水域）。 \n\n2. 在沒有儀器幫助下，能游泳最少五十公尺（不限泳式）。 \n\n3. 明瞭以下各項： \n\n   - (a) 特深呼吸的潛在危險和壓力改變對潛水員的影響； \n\n   - (b) 徒手潛水技術；及 \n\n   - (c) 徒手潛水儀器的運用。 \n\n4.  (a) 能熟悉徒手潛水儀器的運用及保養； \n\n- (b) 能在水面及水底保持中性浮量； \n\n- (c) 能掌握徒手潛水的技術； \n\n- (d) 懂得水中自救及拯救其他潛水員；及 \n\n- (e) 能遵守徒手潛水的安全規則。 \n\n- 註：(1) 在上述理論及技術評估中，達到最低要求或以上，方為及格。 \n\n- (2) 如持有本港認可之徒手潛水證書者，可由有關單位獲授權人士直接簽發「童軍專科徽章 證書」。 \n\n專科徽章 ( 技能組) | 119\n\n<!-- p.121 -->\n完成下列各項 \n\n## 艇  長 **Skipper** \n\n##### 1. 已考獲水手章。 \n\n##### 2. 繩索技能 \n\n- (a) 對繩索有普遍的認識，包括不同用途、拉力及韌力； \n\n- (b) 示範收捲（Stowing）鋼索、盤繞（Coiling）、拴住（Belaying）及 懸掛（Hanging）繩索之正確方法； \n\n- (c) 示範下列繩結及其用途：三套結、稱人結、接繩結、雙接繩結、 貓爪結、鈎口結及帆工繩端結； \n\n- (d) 示範下列織結及其在船上的用途：長織結、短織結、回織結及鳳 眼織結，及使用嵌環（Thimble）完成鳳眼織結；及 \n\n- (e) 示範你能準確地拋擲一條救生繩二十米。 \n\n##### 3. 索具技能 \n\n- (a) 明暸索具的術語：固定索具（Standing Rigging）及活動索具（Running Rigging），並能夠指出前述索具在裝上帆具之童軍標準艇上的位 置；及 \n\n- (b) 明暸兩種起重索具，並對機械利益及效率有簡單認識。 \n\n##### 4. 帆工技能 \n\n- (a) 對帆布質料和尼龍質料的帆有所認識，並能列出帆各部分的名稱 及知曉如何保養帆以達致良好效能；及 \n\n- (b) 能夠使用縫帆掌革（Palm）及縫帆針（Needle），並使用帆布製造 一海錨。 \n\n120 | 專科徽章 ( 技能組)\n\n<!-- p.122 -->\n5. 參與下列任何一項活動： \n\n   - (a) 建造一艘獨木舟，或一艘小艇； \n\n   - (b) 為一艘木製或玻璃纖維之船隻進行船身修理；或 \n\n   - (c) 檢查與修理一艘童軍標準艇的索具及帆。 \n\n6. 負責領導下列任何兩項練習： \n\n   - (a) 放出及收回一海錨； \n\n   - (b) 將一艘童軍標準艇拉上沙灘及浮出水面，懂得抓地滑車組 （Ground Tackle）的用途，並使用此滑車組完成此實習； \n\n   - (c) 在岸上示範如何裝上臨時桅杆（Jury Mast）或臨時船舵（Jury Rudder）；或 \n\n   - (d) 在一艘童軍標準艇上進行錨泊工作。 \n\n專科徽章 ( 技能組) | 121\n\n<!-- p.123 -->\n完成下列各項： \n\n## 體  育 **Sportsman** \n\n1. 對隊際及個人活動如球類、田徑、單車、游泳、溜冰等之規則有良好的 認識。 \n\n2. 做一個有良好體育精神、熟練技巧及熱心於一項個人和一項隊際運動的 運動員。 \n\n3. 與主考討論參加體育活動所能獲得的好處，並與主考談述你對所選擇的 兩種體育活動的歷史有良好認識。 \n\n4. 認識兩位國際或本地知名運動員的姓名，並與主考討論有關他們的動態， 及顯示你曾研究一些有關他們的事情。 \n\n122 | 專科徽章 ( 技能組)\n\n<!-- p.124 -->\n完成下列各項： \n\n## 樹 木 護 理 **Tree Carer** \n\n1. 辨識及製作紀錄冊以記錄十種香港常見的樹木品種。 \n\n2. 認識樹木在大自然及市區中的作用和重要性。 \n\n3. 認識樹木的基本知識。 \n\n4. 辨識常見的樹木健康及結構問題。 \n\n5. 認識妥善護理樹木的重要性。 \n\n6. 記錄住所／旅部附近休憩設施內之樹木。 \n\n7. 製作一個護樹報告。 \n\n專科徽章 ( 技能組) | 123\n\n<!-- p.125 -->\n# 童軍專科徽章（服務組） **Scout Proficiency Badges (Service)** \n\n服務組專科徽章考驗方法 考驗批准人：由童軍團長安排主考 主考：總會、地域或區會的獲授權代表所委任之合適人士 \n\n愛護動物 公民 Animal Carer Civics \n\n網絡安全 多元共融 Cybersecurity Diversity & Inclusion Analyst Ambassador \n\n消防 急救 指引 語言 Fireman First Aider Guide Interpreter \n\n工藝 拯溺 精神健康 食物營養 Jobman Lifesaver Mental Health Nutritionist Ambassador \n\n<!-- Start of picture text -->\n領港<br>Pilot<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n公共衛生 物資管理 祕書<br>Public Health  Quartermaster Secretary<br>Ambassador<br><!-- End of picture text -->\n\n124 | 專科徽章 ( 服務組)\n\n<!-- p.126 -->\n<!-- Start of picture text -->\n國際友誼<br>World Friendship<br>Ambassador<br><!-- End of picture text -->\n\n專科徽章 ( 服務組) | 125\n\n<!-- p.127 -->\n## 愛 護 動 物 \n\n## **Animal Carer** \n\n完成下列各項： \n\n##### 1. 動物飼養 \n\n完成下列其中一項： \n\n   - (a) 考獲動物飼養章（興趣組）；或 \n\n   - (b) 瞭解一隻寵物的基本資料及日常照顧需要，並向主考報告其成長、 飼養及訓練過程，以及生活習慣。 \n\n2. 一般認識 \n\n明瞭下列各項： \n\n      - (a) 認識何謂動物福利； \n\n      - (b) 認識現行保護動物的法例； \n\n      - (c) 明瞭人們遺棄寵物的原因； \n\n      - (d) 認識一間香港動物福利機構的工作； \n\n      - (e) 選擇參觀一間動物福利機構／診所及認識其工作； \n\n      - (f) 探討一則有關動物福利受損的香港時事議題，分享個人體會及提 出一項改善方法；及 \n\n      - (g) 認識如何尊重野生動物和麪對野生動物時如何保護自己。 \n\n3. 義工服務 \n\n   - 參與至少一次與愛護動物相關的義工服務，而總服務時數不少於六小時。 \n\n126 | 專科徽章 ( 服務組)\n\n<!-- p.128 -->\n完成下列各項： \n\n## 公  民 **Civics** \n\n1. (a)  完成本會認許之公民章訓練班；或 \n\n- (b)  明瞭下列各項： \n\n   - (i) 認識祖國及香港特別行政區 \n\n      - ． 認識祖國的歷史文化、地理和公共行政； \n\n      - ． 認識香港特別行政區的歷史文化、地理和公共行政； \n\n      - ． 認識中央與香港特別行政區的關係； \n\n      - ． 認識基本法； \n\n      - ． 明瞭香港特別行政區的行政、立法及司法制度，其產生、 組織、功能和職責；及 \n\n      - ． 認識香港特別行政區政府組織架構。 \n\n   - (ii) 認識社區 \n\n      - ． 認識何謂社區； \n\n      - ． 認識社區內可提供之設施； \n\n      - ． 明瞭社區組職可提供之支援和服務； \n\n      - ． 明瞭區議會的產生、組織、功能和職責；及 \n\n      - ． 認識義務工作的定義、範疇和籌劃方法。 \n\n   - (iii) 認識公民的權利及義務 \n\n      - ． 認識公民的定義、權利和義務； \n\n      - ． 明瞭公民應有的價值觀和態度（包括人權與責任、承擔 精神、誠信及國民身份認同）；及 \n\n      - ． 認識公民教育委員會的工作。 \n\n##### 2.   專題研習 \n\n完成下列其中一項： \n\n- (a) 於導修員指導下，以小組形式編寫一份社區參與服務計劃書，並 依照計劃內容完成一個不少於兩小時之實際社區參與服務，並於 完成後呈交活動報告書；或 \n\n- (b) 參與一項由班領導人、地域、區會或旅團安排之實際社區參與服 務，而該服務（可多於一項）時數應不少於六小時，並於完成後 呈交活動報告書。 \n\n專科徽章 ( 服務組) | 127\n\n<!-- p.129 -->\n## 網 絡 安 全 \n\n## **Cybersecurity Analyst** \n\n完成下列各項： \n\n1. 明瞭資料外泄及身分盜竊的風險因素及其對個人用戶和機構的影響，並 懂得防範及應對資料外泄及身分盜竊。 \n\n2. 明瞭安裝手機程式時當中的資訊保安風險，並懂得如何保護你的流動裝 置及個人電腦。 \n\n3. 認識反追蹤方法（例如：無痕模式及Cookies 等概念）。 \n\n4. 認識有關網絡安全的概念（例如：虛擬私人網路（VPN）、多重要素驗證 （Multi-factor authentication）、防火牆、WPA2 及AES、SSL、TLS 及Endto-End encryption）。 \n\n5. 認識常見的電腦病毒或攻擊（例如：仿冒詐騙（釣魚攻擊 - Phishing）、 DDoS、木馬程式、蠕蟲病毒等），並懂得相應防範與應對措施。 \n\n6. 明瞭域名系統（DNS）在互聯網上的運作，並瞭解域名系統安全擴展 （DNSSEC）如何保護互聯網用戶。 \n\n7. 向隊員分享一個重大網絡安全事故及其嚴重性，並說明網絡安全對個人 用戶和機構的重要性。 \n\n8. 示範設立一個路由器。 \n\n128 | 專科徽章 ( 服務組)\n\n<!-- p.130 -->\n## 多 元 共 融 \n\n## **Diversity & Inclusion Ambassador** \n\n完成下列各項： \n\n1. \n\n   - 一般認識 \n\n   - (a) 認識特能童軍活動。 \n\n   - (b) 認識多元與共融的基本概念： \n\n   - (i)   說明何謂多元與共融，並理解其對社會及童軍運動的重要性； 及 \n\n   - (ii)  瞭解不同個人差異的例子（例如：身體、特殊教育需要、文化 背景、語言、性別表達、價值觀或生活方式等）。 \n\n   - (c) 認識相關政策與法例： \n\n      - (i) 認識世界童軍組織及香港童軍總會有關多元與共融的政策；及 (ii) 認識本港與平等機會相關的條例及其在社會上的應用。 \n\n   - (d) 認識尊重與平等的實踐： \n\n   - (i)   瞭解如何在童軍活動及社區服務中推動共融與平等； \n\n   - (ii)  認識與殘疾人士溝通方式及如何在日常生活中協助殘疾人士； \n\n   - (iii) 認識公共設施與科技如何促進人人參與（例如：智能裝置的輔 助功能、無障礙設施的概念）；及 \n\n- (iv) 認識多元文化、宗教、性別及家庭價值在社會共存中的角色。 \n\n2. 服務活動 \n\n   - 完成下列其中一項： \n\n   - (a)  以個人或小組方式舉辦或參與兩次推動共融與平等的社區服務或活 \n\n      - 動，並向主考人報告； \n\n- (b) 選擇其中一地方作無障礙設施實地觀察（例如：旅部、學校、童軍 營地等），撰寫報告，向主考人講述那些設施是否適合殘疾人士使 用，及作出改善建議，讓殘疾人士更方便使用；或 \n\n- (c)  以個人或小組方式舉辦或參與兩次與多元文化、性別平等、宗教或 種族共融相關的活動，並與主考人報告。 \n\n專科徽章 ( 服務組) | 129\n\n<!-- p.131 -->\n## 消  防 \n\n## **Fireman** \n\n完成(A) 或(B) 其中一項： \n\n- (A) 完成本會認許之消防訓練班。 \n\n- (B) 1. 認識本地消防處的工作。 \n\n   2. 明瞭下列各項有關家庭設備之危險性及防火措施： 各類發熱器、特別是火水爐、石油氣爐、煤氣爐、電爐發熱線、火柴、 電線、保險線、家庭電器、煤氣、汽油、爆竹、蠟燭、煙火、宴會之裝 飾品及門窗等。 \n\n   3. 設計一防火措施之活動，並明瞭防範措施之重要。 \n\n   4. 明瞭露營時起火之危險性及防範方法，知道火燒山草的原因及如何撲 滅山火。 \n\n   5. 闡釋當室內及戶外發生火警時所須採取之行動及原因。明瞭召喚消防 車之各種方法及步驟，知道消防處由接到投訴至出動這段時間所做的 事情及知曉其原因。 \n\n   6. 明瞭樓宇內消防裝備的用途如滅火筒、滅火氈及煙霧感應器，知道怎 樣使用下列各式滅火筒：二氧化碳水式，二氧化碳氣體式，溴氯二氟 甲烷氣體式，乾粉式及化學泡沫式，並說明其適合撲滅那一類型火。 知曉如何處理一個衣服著火的人。 \n\n   7. 能純熟地運用椅結及雙稱人結，解釋其應用之方法，示範怎樣拖一個 昏迷的人爬離火場。 \n\n   8. 對燃燒之進行作一簡明之闡釋，知曉煙和熱的影響及在煙幕中應採取 之步驟。 \n\n130 | 專科徽章 ( 服務組)\n\n<!-- p.132 -->\n## 急  救 **First Aider** \n\n持有下列其中一項： \n\n1. 本會之急救證書； \n\n2. 香港聖約翰救護機構之基本急救證書； \n\n3. 香港紅十字會之青少年急救證書；或 \n\n4. 本會認可之相等程度證書。 \n\n專科徽章 ( 服務組) | 131\n\n<!-- p.133 -->\n完成下列各項： \n\n## 指  引 **Guide** \n\n1. 顯示你熟悉自己住所和旅部附近環境，如住在市區者半徑一點五公里， 而住在郊區者則半徑三公里。 \n\n2. 熟悉下列之所在地點： \n\n   - (a) 醫院、救護車站、診所； \n\n   - (b) 消防局、警署及公共電話； \n\n   - (c) 公共交通工具之總站和上落處，及前往鄰近地區之路線； \n\n   - (d) 童軍總部、地域總部及各區之童軍區會、公園、劇院、戲院、教堂、 博物館、郵局、民政事務處、公廁和其他名勝地點及建築物；及 \n\n   - (e) 區總監、旅長、團長及本隊各隊員之住址。 \n\n3. 顯示出你能使用本區之地圖和用此指出第二項中任何六個地點，並能向 主考指出通往上述地點之最快途徑。 \n\n4. 向一位使用公共交通工具、單車或汽車之人士清楚指示前往童軍營地之 路線。 \n\n132 | 專科徽章 ( 服務組)\n\n<!-- p.134 -->\n## 語  言 **Interpreter** \n\n用任何第二種語言進行下列各項測驗： \n\n1. 與主考作最少十分鐘之談話。 \n\n2. 寫一封約一百五十字以童軍為題材的文章。 \n\n3. 於閱讀報紙或雜誌中一段文字數分鐘後，譯出其大意。 \n\n4. 擔任傳譯員十分鐘。 \n\n專科徽章 ( 服務組) | 133\n\n<!-- p.135 -->\n## 工  藝 \n\n## **Jobman** \n\n示範下列任何六項： \n\n1. 修理或安裝窗簾繩。 \n\n2. 安裝鐵窗或木窗的玻璃。 \n\n3. 將天花板髹漆或掃灰水，用牆紙裝飾或髹掃一房間。 \n\n4. 修補批盪。 \n\n5. 重新安裝一扇門和修理門鎖及把手等。 \n\n6. 修理輕微損壞的傢俬。 \n\n7. 用碎石舖一行人路。 \n\n8. 清理及調較煤氣或石油氣爐之火力。 \n\n9. 修補衣服。 \n\n10. 洗汽車及打蠟。 \n\n11. 修理一道閘或籬笆。 \n\n12. 混和三合土以作簡單修補。 \n\n13. 修理兒童玩具。 \n\n14. 舖地氈。 \n\n15. 換水喉皮。 \n\n16. 修理剪草機及加油。 \n\n17. 水喉爆裂時應採取的步驟。 \n\n18. 更換保險絲及安裝插頭。 \n\n134 | 專科徽章 ( 服務組)\n\n<!-- p.136 -->\n完成下列各項： \n\n## 拯  溺 \n\n## **Lifesaver** \n\n1. 考獲童軍游泳章。 \n\n2. (a)  考獲中國香港拯溺總會拯溺銅章；或 \n\n   - (b) 完成下列各項： \n\n      - (i) 先在陸上示範兩個拯溺方法，然後在水中進行； \n\n      - (ii) 示範用拖身及拖頭的拯溺方法去救一個在五十公尺外之被溺 者； \n\n      - (iii) 從零點三公尺至一公尺高的地方跳入水中，遊往二十公尺外使 被溺者浮於水面兩分鐘以上； \n\n      - (iv) 將一條十八公尺之救生繩拋往十二公尺外的兩支柱中，兩柱間 之距離為一點二公尺，拋三次中應有兩次拋中；及 \n\n      - (v) 用一人體模型，示範口對口人工呼吸救生法。 \n\n專科徽章 ( 服務組) | 135\n\n<!-- p.137 -->\n## 精 神 健 康 \n\n## **Mental Health Ambassador** \n\n完成下列各項： \n\n1. (a)  完成SOUL Keeper 精神健康守護者課程 (Level 1) ；或 \n\n- (b)  完成下列各項： \n\n      - (i) 認識精神健康的定義； \n\n      - (ii) 認識情緒的基本概念，包括：情緒的名稱、其功能及行為反 應，及調節強烈情緒的方法； \n\n      - (iii) 認識自我照顧的重要性及促進精神健康的方法（例如：靜觀、 正向心理學、培養健康生活習慣及興趣、找朋友或長輩傾訴、 自我關懷等）； \n\n      - (iv) 認識關顧別人的正確態度和技巧，包括： \n\n         - ． 日常觀察、主動關懷與問候； \n\n         - ． 積極聆聽與陪伴； \n\n         - ． 適當的回應；及 \n\n         - ． 適切的求助及轉介；及 \n\n      - (v) 完成一星期的情緒日記並紀錄該星期內的自我照顧活動。 \n\n2. 認識常見精神健康問題（例如：焦慮、抑鬱、創傷經歷、睡眠問題等） 及公眾對精神健康的誤解，瞭解社區上對精神健康的支援服務，並掌握 對待精神健康議題的正確態度。 \n\n3. 探討青少年日常生活中常見的精神健康議題( 例如：學業壓力、家庭、 朋輩、愛情與關係、網絡及電玩、成長、失望、自卑、成癮行為等)。 \n\n4. 完成下列其中兩項，並向主考報告： \n\n   - (a) 嘗試瞭解兩位童軍或同學的精神健康狀況或生活習慣，並給予適 當的支持和鼓勵； \n\n   - (b) 設計推廣精神健康的活動並於小隊、童軍團或幼童軍團中實踐； \n\n   - (c) 參與社區內的精神健康體驗活動（例如：童軍知友社體驗活動、 青山醫院精神健康體驗館等）； \n\n   - (d) 參觀一間社區上對精神健康提供支援的機構並認識其服務；或 \n\n   - (e) 參與一項精神健康相關的服務活動。 \n\n136 | 專科徽章 ( 服務組)\n\n<!-- p.138 -->\n完成下列各項： \n\n## 食 物 營 養 **Nutritionist** \n\n1. 認識營養素、熱量、「食物金字塔」或「我的餐碟飲食指引」及其之間 的關係。 \n\n2. 認識食物營養標籤。 \n\n3. 認識均衡飲食及定時進餐的重要性。 \n\n4. 認識不同食物種類（例如：有機食物、加工食物、基因改造食物等）及 其特點。 \n\n5. 說明兩種不同的食物安全處理方法。 \n\n6. 認識青少年成長階段的額外營養需要及其攝取方法。 \n\n7. 專題研習，完成下列其中兩項： \n\n   - (a) 為有需要進行體重管理的人士，設計及落實兩星期的均衡飲食餐 單，包括計算當中的熱量及營養素含量，並記錄其兩星期的身體 狀況轉變，向主考作簡報，解釋餐單的設計與身體狀況轉變的關 連； \n\n   - (b) 分析市面上四種零食的熱量及營養素含量，並說明過份進食零食 可能構成的影響，以簡報或其他方式向其他童軍成員及主考分享； 或 \n\n   - (c) 分析至少四種不同飲食模式（例如：純素食主義、素食主義、無 麩質飲食、生酮飲食、原型食物飲食、排毒飲食、各種宗教信仰 飲食等），比較它們的特點，並研究該飲食模式下如何達至均衡 飲食，以簡報或其他方式向其他童軍成員及主考分享。 \n\n專科徽章 ( 服務組) | 137\n\n<!-- p.139 -->\n完成下列各項： \n\n## 領  港 **Pilot** \n\n##### 1. 已考獲水手章。 \n\n##### 2. 理解 \n\n- (a) 讀解一個著有方向（points）及度數（degrees）之羅盤，對羅盤有 一般的認識，包括其磁差及自差之分別； \n\n- (b) 讀解及明瞭海圖上之「符號及略字」；解釋羅更之用途；海圖基準 （Chart Datum）之意義，並能在海圖上運用潮汐變化的知識； \n\n- (c) 明瞭各類通用之浮泡、航標、燈塔及導航燈船隻，常用之危險、 颱風及霧訊號； \n\n- (d) 明瞭氣壓計之用途，並能解釋蒲爾福風力表（Beaufort Scale）。能 運用氣壓計及蒲爾福風力表預測天氣； \n\n- (e) 明瞭1972 年國際海上避碰規則（IRPC at Sea 1972）； \n\n- (f) 明瞭及示範1972 年國際海上避碰規則附錄四內的遇難信號；及 \n\n- (g) 熟悉本地船艇規條，包括海港條例、水域界限及本地拯救設施。 \n\n##### 3. 練習 \n\n- 完成一次本地水域航行及一次遮蔽水域黑夜航行。兩次航程須有指定之 目標及在海圖上進行計劃。 \n\n##### 4. 服務 \n\n- 參加一次使用划船、帆船或機動船的冒險航程，作為一名船員或同時擔 任其他工作，及擔任領航員。 \n\n   - (a) 考生須在冒險航程計劃中，作為活躍份子； \n\n   - (b) 考生須預先呈交一份摘要（以筆記形式加上插圖），內容包括預定 之航行路線及目的地、潮汐及水流資料、預先安排之浮泡、航程時 間及緊急通訊等；及 \n\n   - (c) 在完成航程後，考生須與主考討論是次航程。利用三角推算法及 重疊陸標等，在海圖上指出實際航線。並特別注意潮汐及／或水 流、港口、海峽及河口水深等及作一口頭報告有關任何特別觸目 之事物包括燈、天氣情況、海上交通情況等。 \n\n138 | 專科徽章 ( 服務組)\n\n<!-- p.140 -->\n## 公 共 衞 生 \n\n## **Public Health Ambassador** \n\n完成下列各項： \n\n1. 一般認識 \n\n   - (a) 明瞭世界衞生組織對「公共衞生」及「健康」的定義。 \n\n   - (b) 完成下列其中一項專題研習，並與童軍成員分享： \n\n      - (i) 蒐集兩間本港與公共衞生有關的政府機構的資料，比較其主 要職責及日常工作； \n\n      - (ii) 探討一項於香港實行的公共衞生政策，說明該政策的內容及 成效；或 \n\n      - (iii) 分享本港歷史上一次重大公共衞生事件，說明其對本港造成 的損害及對日後制定公共衞生政策的影響。 \n\n   - (c) 參加由與公共衞生有關的機構舉辦的訓練、服務或工作坊，活動 主題須緊扣公共衞生，再向童軍成員分享當中的內容及其對本港 公共衞生所帶來的正面影響。 \n\n2. 健康體格 \n\n完成下列其中一項： \n\n- (a) 指導其他童軍成員考獲與運動相關的專科徽章或其相應之教導 組徽章，指導時間需不少於三個月。 \n\n   - ． 與運動相關的專科徽章包括：射箭、運動、獨木舟、單車*、 龍舟、步操、騎術、公園定向、划艇、風帆*、游泳*、滑 浪風帆、獨木舟水球、射擊、技擊、野外定向*、體育、拯溺*； （* 設有教導組專科徽章） \n\n- (b) 在團活動內教授及帶領體適能或家居運動，為期不少於三個月；一 個月不少於兩次，每次不少於一小時；或 \n\n- (c) 拍攝一段教學影片，介紹一項體育運動或家居運動，並與童軍成 員分享。 \n\n專科徽章 ( 服務組) | 139\n\n<!-- p.141 -->\n##### 3. 均衡飲食 \n\n完成下列其中一項： \n\n- (a) 設計一宣傳作品，分享均衡飲食的概念，並分享於社交媒體上； \n\n- (b) 設計一份均衡營養餐單，並於小隊露營、宿營或戶外活動期間向 其他童軍成員推廣及示範烹調；或 \n\n- (c) 策劃及實踐一次推廣均衡飲食的活動，並向主考分享當中的內容 及成效。 \n\n##### 4. 心理健康 \n\n完成下列其中一項： \n\n- (a) 考獲精神健康章（服務組）； \n\n- (b) 考獲由香港聖約翰救護機構所發出之基本心理支援術課程證書或 同等證書； \n\n- (c) 與童軍成員分享三個抗壓的方法，並帶領他們嘗試不同的抗壓方 法；或 \n\n- (d) 向領袖介紹三種常見的精神疾病，並分享患者所面對的困難，從 而帶出展現關懷及消除歧視的信息。 \n\n140 | 專科徽章 ( 服務組)\n\n<!-- p.142 -->\n## 物 資 管 理 \n\n## **Quartermaster** \n\n完成(A) 或(B) 其中一項： \n\n##### (A) \n\n1. 曾有效率地協助旅或團之物資管理員工作六個月或以上。 \n\n2. 明瞭及示範下列各項： \n\n   - (a) 繩索之保養：如端結法、織結法、束繩法和捲繩法、驗繩及收藏 的方法； \n\n   - (b) 營幕之保養：如更換營繩、簡單修補、防水、檢驗及收藏的方法； \n\n   - (c) 工具之保養：保持鋒利、重嵌工具、安裝手柄、工具清埋、檢驗 及收藏的方法；及 \n\n   - (d) 炊具及爐具之保養：修補、清理，檢驗及收藏的方法。 \n\n3. 明瞭及示範怎樣做一本簡單及正確之物資貯存紀錄及物資借用及交還 紀錄。 \n\n4. 明白怎樣保存旅團所有的視聽教材，例如幻燈機、高影機、掛圖、繪 圖工具及其他特別的教具。 \n\n5. 明瞭怎樣處理器材的折舊。 \n\n6. 明瞭整齊是良好物資管理之重要條件，並解釋如何在旅團中推行。 \n\n專科徽章 ( 服務組) | 141\n\n<!-- p.143 -->\n##### (B) \n\n1. 曾協助團部露營或幼童軍渡假營之物資管理員工作五天或以上。 \n\n2. 明瞭及示範下列用品在營地的保養方法： \n\n   - (a) 繩索：如捲繩法、觀察及器材之保存； \n\n   - (b) 營幕：如更換營繩、簡單修補、防水、檢驗及收藏的方法； \n\n   - (c) 工具：保持鋒利、重嵌工具、安裝手柄、工具清理、檢驗及收藏 的方法；及 \n\n   - (d) 炊具：修補、清理，檢驗及收藏的方法。 \n\n3. 明瞭及示範怎樣做一本營地之物資貯存紀錄及物資借用及交還紀錄。 \n\n4. 明瞭及示範怎樣保養特別的設備：例如制服、遠足用具、攀山用品或 獨木舟等。 \n\n5. 預備一份適合四十八小時露營的菜單與主考討論。 \n\n6. 闡述在露營期間之食物貯藏方法。 \n\n7. 列出一份你準備帶往營地作營具緊急修理用之工具表，並說明每一工 具之適當用途。 \n\n8. 明瞭整齊是良好物資管理之重要條件，並解釋如何協助營地物資管理 員推行。 \n\n142 | 專科徽章 ( 服務組)\n\n<!-- p.144 -->\n完成下列各項： \n\n## 祕  書 \n\n## **Secretary** \n\n1. 對童軍區和旅／團的行政及職責有一般性的認識（例如：小隊長會議、旅 領袖會議、 旅務委員會、區領袖會議及區務委員會)。 \n\n2. 完成以下其中一個項目： \n\n      - (a) 以良好書法抄寫一篇約二百五十字的散文； \n\n      - (b) 打字至少一百個，並懂得運用及清理不同的打字儀器（例如：打 字機、打印機或傳真機等）；或 \n\n      - (c) 使用電郵平臺（例如：Gmail或Outlook 等）撰寫、發送及回覆電郵。 \n\n3. 掌握不同文件的書寫格式，瞭解各類行政文件的基本格式與結構，並能 根據情境選用合適格式撰寫文件。例如： \n\n      - (a) 會議記錄，並列明日期、出席者、議程、討論內容及決議； \n\n      - (b) 活動通告，並包含活動名稱、日期、地點、對象、報名方法及聯 絡方式； \n\n      - (c) 計劃書及報告書，並具備標題、背景、內容、結論及建議；或 \n\n      - (d) 請假／申請表格，並清楚列出申請人資料、事由及批覈欄位。 \n\n4.   (a) 懂得使用 Microsoft Word（或相類似軟件及程式）處理文書工作， \n\n   - 包括：排版、插入表格、儲存及列印文件。 \n\n   - (b) 懂得使用 Microsoft Excel （或相類似軟件及程式）處理基本數據， 包括： \n\n         - (i) 建立及編輯表格； \n\n         - (ii) 輸入及整理資料（如：出席紀錄、報名名單）；及 \n\n         - (iii) 使用簡單公式（如：加總、平均）。 \n\n   - (c)  懂得使用 Microsoft PowerPoint （或相類似軟件及程式）製作簡報。 (d) 瞭解Google Workspace 工具（Docs、Sheets、Forms）或相類似軟件 及程式作協作用途。 \n\n5. 對旅部之財政組織有普通認識，懂得準備一份以小隊或團之進支一覽表， 並認識銀行私人戶口的管理方法。 \n\n專科徽章 ( 服務組) | 143\n\n<!-- p.145 -->\n6.   用主考指定之題目寫一封信，並草擬一邀請外界人士出席參觀旅團或小 隊活動之請柬。 \n\n7.   認識本港與外地郵匯之郵費率，知道在何處查詢有關寄郵包，掛號信及 外郵件的事情。 \n\n8.   寫一篇關於旅團活動之新聞報導，或替童軍刊物寫一篇有關童軍區和旅 ／團活動的文章。 \n\n9.   擔任小隊、小隊長會議或其他團體祕書之職三個月以上，其工作應能令 任職處之主管人滿意。 \n\n144 | 專科徽章 ( 服務組)\n\n<!-- p.146 -->\n## 國 際 友 誼 \n\n## **World Friendship Ambassador** \n\n完成下列各項： \n\n1. 認識國際童軍組織及活動 \n\n   - (a) 明暸世界童軍組織（World Organization of the Scout Movement） 及亞太區童軍組織 (Asia-Pacific Scout Region) 的組織架構、功能、 職責及其所主辦的童軍活動；及 \n\n   - (b) 蒐集四個不同的國家／地區童軍組織之資料，包括當地的童軍活 動、訓練特色、生活方式及文化，並將之與香港童軍總會進行比 較，並且向主考呈交報告。 \n\n2. 參與國際童軍活動或通訊 \n\n- 完成下列其中兩項： \n\n   - (a) 與外地童軍一起露營或遠足七天以上（在本地或外地），並將所 見所聞及各方面之知識作出報告，形式不限； \n\n   - (b) 親身探訪一個香港以外的童軍旅團，比較外地旅團與自身旅團的 異同，並報告所見所聞及學得之知識，形式不限； \n\n   - (c) 出示最少三十張由自己拍攝的外地童軍活動、生活情況、人物、 習俗及風景照片，並與主考講解有關照片； \n\n   - (d) 以童軍團、小隊或個人的名義持續與外地的童軍通訊六個月或以 上，並將與外國童軍通訊中所獲得關於該國之童軍活動、生活狀 況及當地所發生的事件等資料彙編成一份報告；或 \n\n   - (e) 參與由世界童軍組織舉辦的國際電訊日，並將所見所聞及感想進 行報告，形式不限。 \n\n3. 國際友誼服務 \n\n##### 完成下列其中一項： \n\n- (a) 製作一條最少五分鐘的影片，用作向其他童軍成員分享在外國所 獲得的知識及遇到有趣的事情，吸引他們參加國際童軍活動； \n\n- (b) 將你從外地童軍所獲得的資料或你對其他國家的知識，用來組織 及進行一個童軍團或小隊的活動； \n\n- (c) 為在香港舉行的國際童軍活動擔任工作人員，並將所見所聞及感 想進行報告，形式不限；或 \n\n- (d) 款待外國童軍訪客或外地來港的青年，並將款待外地訪客的方法 及技巧向主考作報告。 \n\n專科徽章 ( 服務組) | 145\n\n<!-- p.147 -->\n# 童軍專科徽章（教導組） **Scout Proficiency Badges (Instructor)** \n\n教導組專科徽章考驗方法 考驗批准人：由童軍團長安排主考 主考：總會、地域或區會的獲授權代表所委任之合適人士 \n\n釣魚 抱石 營火 單車 Angler Boulderer Campfire Host Cyclist \n\n<!-- Start of picture text -->\n模型製作 攝影 風帆 游泳<br>Model Maker Photographer Sailor Swimmer<br>天象 原野烹飪 露營 通訊<br>Astronomer Backwoods Cook Camper Communicator<br>烹飪 手藝 模擬飛行 地圖繪製<br>Cook Craftsman Flight Simulator Map Maker<br><!-- End of picture text -->\n\n146 | 專科徽章 ( 教導組)\n\n<!-- p.148 -->\n<!-- Start of picture text -->\n地圖閱讀 機械 氣象 多媒體創作<br>Map Reader Mechanic Meteorologist Multimedia<br>Designer<br>觀察 野外定向 先鋒工程 編程<br>Observer Orienteer Pioneer Programmer<br>樹木護理 拯溺<br>Tree Carer Lifesaver<br><!-- End of picture text -->\n\n專科徽章 ( 教導組) | 147\n\n<!-- p.149 -->\n# 教導組專科徽章 **Instructor Group Proficiency Badges** \n\n童軍可考取下列之教導組專章： \n\n釣      魚 （興趣組） 原野烹飪 （技能組）   氣      象 （技能組） 抱      石 （興趣組） 露      營 （技能組） 多媒體創作 （技能組） 營      火 （興趣組） 通      訊 （技能組）   觀      察 （技能組） 單      車 （興趣組） 烹      飪 （技能組）   野外定向 （技能組） 模型製作 （興趣組） 手      藝 （技能組） 先鋒工程 （技能組） 攝      影 （興趣組） 模擬飛行 （技能組）   編      程 （技能組） 風      帆 （興趣組）     地圖繪製 （技能組） 樹木護理 （技能組） 遊      泳 （興趣組） 地圖閱讀 （技能組） 拯      溺 （服務組） 天      象 （技能組） 機      械 （技能組） \n\n除風帆外，各教導組專章之考驗應注意下列事項： \n\n1. 考驗須於完成相關專科徽章的三個月後，始可申請報考教導組之該項專 科徽章。 \n\n2. 報考教導組專科徽章的童軍成員須於適當時間內（通常為三個月）指導 最少一名童軍，教授相應之專科徽章內容，被指導之童軍可由主考指定 或由報考教導組專科徽章之童軍推薦並經主考同意。 \n\n- （註：成員可透過協助訓練班，達到以上要求，以完成教導組專章之考驗。） \n\n風帆教導組專章內容如下： \n\n風帆 \n\n1. 已完成風帆（技能組）專章三個月或以上。 \n\n2. 在本會認可之風帆教練監督下，教授及指導一名或多名童軍成員考獲風帆 （興趣組）專章。 \n\n註：(1) 指導時須有本會認可之風帆教練在場監督下方可進行。 \n\n- (2) 此專章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n148 | 專科徽章 ( 教導組)\n\n<!-- p.150 -->\n# 海上活動 **The Sea Activity** \n\n水手長 Boatswain \n\n水手 Boatman \n\n艇工 Oarsman \n\n海上活動徽章 | 149\n\n<!-- p.151 -->\n# 海上活動 **The Sea Activity Programme** \n\n海上活動是公開給所有童軍參與。部份童軍希望能更深入研究及增進部 分知識，所學將有助成為航海專才，並將其知識系統性地傳授予其他童軍。 當一個童軍參與更多富冒險精神的活動時，其知識必隨之增長。 \n\n為協助一般熱心水上運動之童軍，故特提供有進度性之訓練，以配合更 有系統的童軍訓練計劃。海上活動徽章分為三級，各童軍可在宣誓後立刻學 習及考驗。 \n\n海童軍應對水上活動有特別興趣，故鼓勵他們採用水上訓練計劃作為一 種訓練程序。 \n\n總會海童軍及海上活動組其中一項職責是為促進本港童軍之海上活動訓 練。因此各旅團可向青少年活動署諮詢有關借取用具或訓練資料，及其他有 關之問題。 \n\n150 | 海上活動徽章\n\n<!-- p.152 -->\n# 海上活動徽章 **Sea Activity Badges** \n\n海上活動徽章可供童軍及深資童軍成員考取。這些徽章是認可的海童軍 訓練課程，能提升海童軍成員對海事訓練知識的熟練程度及水準。 \n\n童軍支部海上活動徽章分為三個階段 —— 艇工章、水手章及水手長章。 其訓練程序分別對應童軍探索獎章、童軍標準獎章、童軍高級獎章及總領袖 獎章之進程。 \n\n海上活動徽章的課程內容與各級「童軍標準艇證書」課程內容相若（對 等關係見下表）。童軍在考取這些徽章時，只需考獲各級童軍標準艇證書， 便可一併獲簽發同等之海上活動徽章。惟他們在參加童軍標準艇證書考驗 前，必須先呈交紀錄予主考，以便辦理簽發手續。 \n\n##### 課程內容之關連 \n\n童軍標準艇證書 <====> 海上活動徽章 一級童軍標準艇證書 <====> 艇工章 二級童軍標準艇證書 <====> 水手章 三級童軍標準艇證書 <====> 水手長章 \n\n##### ( 註：詳細內容請直接參閱訓練綱要) \n\n這些徽章之考驗乃由區專章祕書安排總會委任之童軍標準艇教練員負 責。如已持有本會認可之證書，可由獲授權人士直接簽發該等徽章。 \n\n海上活動徽章 | 151\n\n<!-- p.153 -->\n完成下列各項： \n\n## 艇 工 \n\n## **Oarsman** \n\n1. 持有本會之遊泳測試證明書。 \n\n2. 考獲本會之一級童軍標準艇證書或同等資歷。 \n\n152 | 海上活動徽章\n\n<!-- p.154 -->\n完成下列各項： \n\n## 水 手 \n\n## **Boatman** \n\n1. 持有本會之遊泳測試證明書。 \n\n2. 考獲本會之二級童軍標準艇證書或同等資歷。 \n\n海上活動徽章 | 153\n\n<!-- p.155 -->\n完成下列各項： \n\n## 水  手  長 **Boatswain** \n\n1. 持有本會之遊泳測試證明書。 \n\n2. 考獲本會之三級童軍標準艇證書或同等資歷。 \n\n154 | 海上活動徽章\n\n<!-- p.156 -->\n# 航空活動 **The Air Activity** \n\n高級航空活動 Advanced Air Activity \n\n中級航空活動 Intermediate Air Activity \n\n初級航空活動 Basic Air Activity \n\n航空活動徽章 | 155\n\n<!-- p.157 -->\n# 航空活動 **The Air Activity Programme** \n\n隨著年青人對於航空方面的興趣及需求日漸增長，本會已重新檢視航空 活動的發展工作，並修訂有關支部的航空活動政策及綱要。 \n\n所有童軍成員均可參與航空活動。當中通過有遞進和富吸引力的訓練活 動，鼓勵成員認識航空知識之餘，更能積極參與具挑戰性的體驗項目，並將 所學分享和授予其他童軍成員，使其對航空的興趣、知識和技能有所提升。 課程設計和要求標準基於童軍支部成員的年齡和潛能而設，經參考過往經驗 及諮詢有關童軍單位和專業意見而制定。 \n\n為了給予童軍於航空方面的學習平臺，其內容亦需兼顧空童軍的發展計 劃，故提供三級制之航空活動徽章，從而配合成員的興趣和不同學習程度的 需求。 \n\n156 | 航空活動徽章\n\n<!-- p.158 -->\n# 航空活動徽章 **Air Activity Badges** \n\n航空活動徽章屬童軍支部航空活動訓練課程，其內容重點為學習小型飛 機的知識及其他有關的航空知識，並附以模擬飛行體驗和自選航空活動，讓 成員能夠從實驗中學習及運用所學知識。 \n\n童軍航空活動課程共分為初級航空活動章、中級航空活動章及高級航空 活動章三個階段，其訓練程序相等於童軍探索獎章、童軍標準獎章、童軍高 級獎章及總領袖獎章之進行。 \n\n這些徽章之考驗皆由總會委任之主考負責，各童軍旅可向總會青少年活 動署或地域航空活動組申請考驗事宜。 \n\n航空活動徽章 | 157\n\n<!-- p.159 -->\n## 初  級  航  空  活  動 **Basic Air Activity** \n\n完成下列各項： \n\n1. 飛行安全及航空概念 \n\n   - (a) 對下列其中一個航空機構有一般認識： \n\n      - (i) 香港民航處 \n\n      - (ii) 政府飛行服務隊 \n\n      - (iii) 香港機場管理局 \n\n      - (iv) 中國人民解放軍駐港部隊空軍 \n\n   - (b) 認識香港國際機場( 包括地理位置、設施、交通) 。 \n\n   - (c) 明瞭進入機場飛行區範圍的限制、要求及一般安全守則。 \n\n   - (d) 明瞭旅客寄艙行李及手提行李違禁物品對航空安全的影響，並向主 考舉出一些違禁物品例子。 \n\n   - (e) 明瞭空運危險品對航空安全的影響，並向主考舉出一些空運危險品 例子。 \n\n   - (f) 認識香港註冊的航空公司，並向主考介紹該等公司的一些基本資料， 包括使用中的飛機型號服務航點等。 \n\n2. 航空知識 \n\n   - (a) 對世界及香港航空歷史有一般認識，並向主考分享你最有興趣的一 段航空歷史。 \n\n   - (b) 說出不同種類的飛行器。 \n\n   - (c) 說出現代飛機( 包括定翼機、直升機和軍用機) 的各主要部分及名稱。 \n\n   - (d) 對下列三種航空運動有一般認識( 包括基本原理、裝備)： (i) 降落傘 \n\n      - (ii) 滑翔機 \n\n      - (iii) 熱氣球 \n\n158 | 航空活動徽章\n\n<!-- p.160 -->\n##### 3. 定翼機基本知識 \n\n- (a) 瞭解翼剖面的基本原理。 \n\n- (b) 說出定翼機的三個基本操縱面(Primary Control Surfaces) 和次級飛行效 應(Secondary Effect) 及明瞭駕駛員如何操縱及它們如何改變飛行姿態。 \n\n- (c) 解釋定翼飛機升力與重力及推力與阻力之間的關係。 \n\n- (d) 明瞭「配平」(Trim) 的功用及工作原理。 \n\n- (e) 認識駕駛艙內六個基本飛行儀錶(Primary Flight Instruments)，並能讀 取儀錶所提供的資料。 \n\n##### 4. 航機辦認 \n\n- (a) 認識WEFT 辨認方法。 \n\n- (b) 能辨認總會認可的「航機辨認清單」內指定的十二種香港常見飛機 (四架民航機、四架直升機、兩架小型飛機/商務飛機和兩架軍用機)。 \n\n##### 5. 實習 \n\n- (a) 製作一隻翼寬不少於二十釐米的紙製手搖滑翔機，並向主考示範如 何調校其操縱面令飛機作直線或轉向飛行。 \n\n- (b) 在地域認可的飛行模擬器完成以下指定項目(不少於兩小時十五分鐘)： (i) 操縱面控制(Effects of controls) \n\n   - (ii) 直和水平飛行(Straight and level) \n\n   - (iii) 爬升及下降(Climb and descent) \n\n   - (iv) 水平轉向(Medium level turn) \n\n- (c) 參觀一所航空機構或地域認可的航空活動不少於兩小時。 \n\n- (d) 完成「自選航空活動」內其中一項事工。 \n\n航空活動徽章 | 159\n\n<!-- p.161 -->\n## 中  級  航  空  活  動 **Intermediate Air Activity** \n\n完成下列各項： \n\n1. 考獲初級航空活動章。 \n\n2. 飛行安全及航空概念 \n\n   - (a) 認識與飛行安全相關的航空法例。 \n\n   - (b) 認識飛行救生衣的各部分名稱及示範使用方法。 \n\n   - (c) 認識民航機一般緊急救生設備。 \n\n##### 3. 航空知識 \n\n- (a) 示範定翼機在日間及夜間的飛機指桿手號。 \n\n- (b) 認識飛行區內的地面標誌、地面燈號及方型訊號，明瞭機師如何利用 該標誌及燈號。於飛行區內運作。 \n\n- (c) 認識十個本港常見之民航機的ICAO 國家註冊編碼、航空公司標誌 及 IATA 編碼。 \n\n- (d) 一般航空業常用的單位及時間系統。 \n\n- (e) 明瞭風如何影響飛行活動。 \n\n- (f) 認識飛行的「真空速」(TAS)、「指示空速」(IAS) 及「地面速度」(GS) 在導航的使用。 \n\n##### 4. 定翼機基本知識 \n\n   - (a) 解釋失速定義及原因。 \n\n   - (b) 解釋襟翼之功用及運作。 \n\n   - (c) 認識小型飛機起飛和降落程序。 \n\n   - (d) 認識地面效應(Ground effect) 及其對飛行之影響。 \n\n5. 航機辨認 \n\n   - (a) 能辨認總會認可的「航機辨認清單」內指定的十二種世界常見飛機 ( 四架民航機、四架直升機、兩架小型飛機/ 商務飛機和兩架軍用機)。 \n\n160 | 航空活動徽章\n\n<!-- p.162 -->\n6. 實習 \n\n   - (a) 製作一架翼寬不少於四十釐米及能飛行不少於十米的木製滑翔機。 \n\n   - (b) 在地域認可的飛行模擬器完成以下指定項目(不少於一小時三十分鐘)： \n\n      - (i) 地面滑行(Taxiing) \n\n      - (ii) 正常起飛(Normal takeoff) \n\n      - (iii) 正常降落(Normal landing) \n\n   - (c) 製作一份報告書或簡報向主考介紹你最近一次參與由地域認可的航 空活動。 \n\n   - (d) 完成「自選航空活動」內其中兩項從未進行過之事工。 \n\n航空活動徽章 | 161\n\n<!-- p.163 -->\n## 高  級  航  空  活  動 **Advanced Air Activity** \n\n完成下列各項： \n\n1. 考獲中級航空活動章。 \n\n2. 航空知識及飛行安全 \n\n   - (a) 認識目視飛行(VFR) 和儀表飛行(IFR) 的條件。 \n\n   - (b) 認識裝置在飛機上的導航燈及其功用。 \n\n   - (c) 認識象限高度(Quadrantal Rule) 及平法分規則(Separation Rule)。 \n\n   - (d) 明瞭活塞發動機的主要部分及基本原理。 \n\n   - (e) 認識飛前檢查的程序及明瞭對飛行安全的重要性。 \n\n   - (f) 明瞭地對空和空對地緊急燈號及煙火訊號。 \n\n   - (g) 明瞭下列因素對飛行的影響及預防方法： \n\n      - (i) 雷暴、霧、結冰 \n\n      - (ii) 風切變 \n\n      - (iii) 雀鳥及野生動物 \n\n##### 3. 導航知識 \n\n   - (a) 認識各種飛行圖，並能解讀標示。 \n\n4. 通訊知識 \n\n   - (a) 認識雷達在航空方面的應用及重要性。 \n\n   - (b) 示範懂得使用電訊字母及一般片語。 \n\n   - (c) 認識機師與控制塔之無線電通訊程序。 \n\n5. 定翼機基本知識 \n\n   - (a) 認識小型飛機五邊飛行程序(Flight Circuit Procedure)。 \n\n162 | 航空活動徽章\n\n<!-- p.164 -->\n6. 航機辨認 \n\n   - (a) 能辨認總會認可的「航機辨認清單」內指定的十二種世界常見飛機 (四架民航機、四架直升機、兩架小型飛機/商務飛機和兩架軍用機)。 \n\n7. 實習 \n\n   - (a) 指導兩名童軍成員完成探索獎章內< 戶外活動> 航空活動一欄。 \n\n   - (b) 在地域認可的飛行模擬器向主考示範完成一個五邊飛行（Flight Circuit）（不少於兩小時)。 \n\n   - (c) 完成「自選航空活動」內其中兩項從未進行過之事工。 \n\n航空活動徽章 | 163\n\n<!-- p.165 -->\n## 航機辨認清單 \n\n### 初級航空活動章 \n\n### 中級航空活動章 \n\n### 高級航空活動章 \n\n<!-- Start of picture text -->\nA 民航機 A 民航機<br>1 Airbus A300-600<br>1 Airbus A320（空中巴士A320)<br>（空中巴士A300-600）<br>港龍航空使用的機型 華民航空使用的貨機機型<br>2 Airbus A330 Series  2 Airbus A380<br>（空中巴士A330系列） （空中巴士A380）<br>全球載客量最高的客機<br>國泰航空及港龍航空使用<br>3 Boeing B747-8(波音B747-8)<br>的機型<br>國泰航空使用的貨機機型<br>3 Boeing B747-400  世界機身最長民航機<br>（波音B747-400） 4 Boeing B787-8 Dreamliner<br>國泰航空使用的貨機機型 （波音B787-8夢幻客機）<br>首款主要使用複合材料建<br>4 Boeing B777 Series<br r）（安託諾夫安-124） 空運超大貨物到香港使用 的機型 2 Lockheed C-130/L-100 Hercules 英國及法國空軍運送政府物 資到香港使用的機型 \n\n164 | 航空活動徽章\n\n<!-- p.166 -->\n## 自選航空活動清單 \n\n1. 製作風箏一隻，明瞭放風箏的法例和安全守則，認識一般本港放風箏之 熱點並參與一次小隊放風箏活動。 \n\n2. 製作一架機身長度不少於二十釐米的塑膠注模飛機模型，須全部完成及 適當著色，並向主考介紹該飛機的一般資料。 \n\n3. 參與一次地域認可的飛行體驗，並向主考提交一份報告書或簡報。 \n\n4. 於本港機場附近範圍紀錄兩小時內抵港或離港的飛機，包括時間、機型、 所屬航空公司等。 \n\n5. 蒐集六款飛機圖片，並向主考介紹它們的型號、歷史、用途、一般資料及 辨認方法。 \n\n6. 認識一個國家的空軍，並向主考介紹其基本資料，包括其空軍標誌及意 義、歷史、使用中的主要飛機型號及編制等。 \n\n7. 向主考簡述軍機如何作出攻擊和防禦，並介紹一些機載武器。 \n\n8. 操控遙控定翼機或直升機，並向主考示範起飛、降落及基本飛行姿態， 並明瞭操控遙控飛機的法例和安全守則。 \n\n9. 認識香港天文臺的航空氣象服務，並向主考介紹香港國際機場的氣象設備。 \n\n10. 認識消防處機場消防隊，並向主考介紹其救援及滅火裝備。 \n\n11. 向主考介紹一般民航機使用的無線電通訊系統。 \n\n12. 向主考介紹一般民航機使用的導航系統。 \n\n13. 向主考介紹一款研發中的飛機，並簡報該機型的基本資料、特色及研發 進度。 \n\n14. 考取一個與航空活動有關之專科徵章。 \n\n航空活動徽章 | 165\n\n<!-- p.167 -->\n# 第三章 世界童軍組織推出的徽章 **Chapter 3 : The World Scout Badges** \n\n# 和 平 使 者 章 **Messengers of Peace** \n\n##### 和平使者計劃 \n\n世界童軍委員會於2011 年推出「和平使者計劃」（Messengers of Peace）， 旨在鼓勵逾百萬名童軍成員為其社區作出小貢獻，並向全世界推廣，以感染 更多童軍成員為社區出一分力。任何有助促進健康、環境、社會環境、安全 或減少衝突等的童軍活動，都可納入為「和平使者計劃」。 \n\n本會鼓勵各童軍單位（包括旅及區）籌辦和平使者活動。認可條件如下： \n\n1. 活動必須切合和平使者計劃的任何一項主題；及 \n\n2. 活動過程中必須含有服務元素，每名參加者須為社區提供最少一小時的 服務。 \n\n##### 和平使者章 \n\n為了對童軍成員的貢獻作出肯定，由2014 年12 月1 日起，童軍成員參加任 何已於世界童軍組織可持續發展目標網站https://sdgs.scout.org/ 登記及獲本會 覈准的和平使者計劃活動，即可獲發和平使者章購章券。青少年成員在獲取 和平使者章（見右圖）後可佩戴於童軍制服直至晉升支部前。晉升支部後需 重新參與相關活動以再獲取戴資格。成年成員則可由活動首天起計佩戴於童 軍制服上為期12 個月如完成另一項認可的和平使者計劃活動，則可繼續佩 戴和平使者章 12 個月。 \n\n（詳情請參閱「和平使者計劃（香港）」國際通告第 05/2023 號） \n\n166 | 世界童軍組織推出的徽章\n\n<!-- p.168 -->\n### 地球部落 \n\n世界童軍組織於 2020 年 6 月推出「地球部落 (Earth Tribe)」，作為一項全 球性的環境保育計劃，目標在於促進青少年參與地球保護工作。該計劃包含 三項主要挑戰：「走塑達人挑戰」(Plastic Tide Turners Challenge)、「自然守 護者挑戰」(Champions for Nature Challenge) 及「日光善用者挑戰」(Scouts Go Solar Challenge)，旨在鼓勵青少年養成可持續發展消費行為並實踐健康環保 的生活方式。計劃重點包括加強與大自然的聯繫、保育生物多樣性、推廣潔 淨能源的選擇，同時恢復水陸生態系統，以預防環境污染。地球部落邀請全 球青少年共同推動生態保護，確保地球長遠的可持續發展。本計劃強調青少 年主導，著重於環境與可持續發展議題的實際解決，並藉由「部落」概念強 化團隊學習、支持及協作精神。日光善用者挑戰、走塑達人挑戰、 自然守護 者挑戰均為地球部落計劃的一部份，因此，凡考獲地球部落計劃任何一個挑 戰之支部成員，均已成為地球部落一員。 \n\n地球部落章 Earth Tribe Badge \n\n走塑達人章 Plastic Tide Turners Badge \n\n自然守護者章 Champions for Nature Badge \n\n日光善用者章 Scouts Go Solar Badge \n\n世界童軍組織推出的徽章 | 167\n\n<!-- p.169 -->\n## 走 塑 達 人 章 \n\n# **Plastic Tide Turners Badge** \n\n##### 學習目標 \n\n領袖可因應成員能力，就活動內容作出適當調適，並可考慮以下學習目標： \n\n1. 瞭解人類活動造成的污染如何影響生態系統，並識別本地和區域的主要 \n\n   - 污染物。 \n\n2. 知道在污染環境中採取的行動，以保障生命和健康。 \n\n3. 認識戶外活動對自然的影響，並區分良好和不良的做法。 \n\n4. 意識到日常生活如何在全球範圍內影響環境，並努力實現環保的生活體 驗。 \n\n5. 減少污染以保護生態系統，並鼓勵同伴不要亂丟垃圾或進行其他導致污 染的行為。 \n\n完成下列各項： \n\n1. 認知 \n\n   - (a) 完成三個走塑達人挑戰的學習活動。 \n\n   - (b) 領袖可參考本署所列出的參考學習活動，也可自行安排符合上述 學習目標的活動。 \n\n2. 合作及行動 \n\n   - (a) 在領袖的帶領下，與小隊成員一起計劃及完成一個與上述學習目 標有關之事工或服務計劃。 \n\n3. 反思 \n\n   - (a) 在完成小隊事工或服務計劃後，須與其他成員分享心得，形式不 限。 \n\n168 | 世界童軍組織推出的徽章\n\n<!-- p.170 -->\n# 自 然 守 護 者 章 **Champions for Nature Badge** \n\n##### 學習目標 \n\n領袖可因應成員能力，就活動內容作出適當調適，並可考慮以下學習目標： \n\n1. 瞭解自然法則並觀察它們在環境中的表現。 \n\n2. 認識社會對生物多樣性的影響，並承諾採取行動減少生物多樣性喪失， 鼓勵他人一起參與。 \n\n3. 參加保護和恢復本地自然的活動。 \n\n4. 理解生活方式選擇、環境問題和全球財富分配之間的聯繫，並對個人行 為對環境和他人的影響負責。 \n\n5. 瞭解食物的來源，並對個人行為對環境和社會的影響負責。 \n\n##### 完成下列各項： \n\n1. 認知 \n\n   - (a) 完成三個自然守護者挑戰的學習活動。 \n\n   - (b) 領袖可參考本署所列出的參考學習活動，也可自行安排符合上述 學習目標的活動。 \n\n2. 合作及行動 \n\n   - (a) 在領袖的帶領下，與小隊成員一起計劃及完成一個與上述學習目 標有關之事工或服務計劃。 \n\n3. 反思 \n\n   - (a) 在完成小隊事工或服務計劃後，須與其他成員分享心得，形式不 限。 \n\n世界童軍組織推出的徽章 | 169\n\n<!-- p.171 -->\n# 日 光 善 用 者 章 **Scouts Go Solar Badge** \n\n##### 學習目標 \n\n領袖可因應成員能力，就活動內容作出適當調適，並可考慮以下學習目標： \n\n1. 瞭解氣候變化的成因以及不同能源對環境和氣候的影響。 \n\n2. 知道如何減少日常能源消耗，並承認個人在保護氣候方面的責任。 \n\n3. 積極嘗試減少個人對氣候變化的影響。 \n\n完成下列各項： \n\n1. 認知 \n\n   - (a) 完成三個自然守護者挑戰的學習活動。 (b) 領袖可參考本署所列出的參考學習活動，也可自行安排符合上述 學習目標的活動。 \n\n2. 合作及行動 \n\n   - (a) 在領袖的帶領下，與小隊成員一起計劃及完成一個與上述學習目 標有關之事工或服務計劃。 \n\n3. 反思 \n\n   - (a) 在完成小隊事工或服務計劃後，須與其他成員分享心得，形式不 限。 \n\n170 | 世界童軍組織推出的徽章\n\n<!-- p.172 -->\n# 第四章 其他獎章及徽章 **Chapter 4 : Other Awards and Badges** \n\n服務獎章 Service Flash \n\n領導才獎章 Leadership Award \n\n小隊活動巾圈 Patrol Activity Woggle \n\n社區參與章 Community Involvement Badge \n\n宗教章 Religious Badge \n\n深資童軍先修章 Venture Scout Link Badge \n\n香港青年獎勵計劃 The Hong Kong Award For Young People \n\n其他獎章及徽章 | 171\n\n<!-- p.173 -->\n### 「積極公民」獎章系列 \n\n### \" **Active Citizenship\" Badge Series** \n\n此獎章系列旨在透過實踐公民責任、參與社會服務計劃、發展領導能力等活 動，培養青少年成為具有良好道德、知識和技能的積極公民，能夠積極服務 社會，為社會的進步和發展作出貢獻。 \n\n防騙先鋒章 Anti-Deception Badge \n\n保護兒童章 Child Protection Badge \n\n禁毒章 Anti-Drug Badge \n\n社區應急先鋒章 環保先鋒章 Community Emergency Green Pioneer Badge Responder Badge \n\n詳情請參閱「積極公民」徽章系列網站以獲取更多資訊。 \n\n172 | 其他獎章及徽章\n\n<!-- p.174 -->\n## 服 務 獎 章 **Service Flash** \n\n完成下列各項： \n\n1. 考獲童軍標準獎章或以上之進度性獎章。 \n\n2. 獲取兩個服務組之專章，亦可以一興趣組或技能組之專章代替其中之一 個服務章，但該章之內容必須具備服務性質，並參加該項經常性之服務， 例如圖書管理。 \n\n3. 考獲一教導組之專章或服務組專章中之急救、消防或拯溺其中之一，但 此章不能計算在第二項內。 \n\n4. 參與一個為期三個月以上之服務，一般標準的需求為每星期一小時。 \n\n其他獎章及徽章 | 173\n\n<!-- p.175 -->\n## 領 導 才 獎 章 **Leadership Award** \n\n完成下列各項： \n\n適合十三至十五歲之童軍成員。 \n\n1. 考獲童軍探索獎章或以上之進度性獎章。 \n\n2. 闡述小隊長會議之功能，並出席最少一次會議及負責執行其中一項議決案。 \n\n3. 完成一個小隊長會議認可之個人事工計劃，例如：幼童軍團服務或在外 地進行之事工計劃。 \n\n4. (a)  經小隊會議認可，組織一個小隊戶內集會；或 (b)  經小隊會議認可，組織一個小隊戶外集會。 \n\n5. (a)  指導兩名童軍完成任何一個進度章內之其中三個童軍技能項目；或 (b)  指導一名或以上童軍至其中一位考獲一個專科徽章。 \n\n6. 完成一個由總會、地域或區舉辦之領導才訓練班。 \n\n7. (a)  擔任一個小隊職務六個月以上（例如：物資管理或小隊隊長）；或 \n\n   - (b)  參與由一個小隊長會議和童軍團長認可有類似性質及相若程度之領 導才活動。 \n\n174 | 其他獎章及徽章\n\n<!-- p.176 -->\n## 小 隊 活 動 巾 圈 **Patrol Activity Woggle** \n\n本巾圈適合十一至十五歲，並已完成童軍標準獎章或以上之童軍成員佩戴， 無需另行考驗。 \n\n其他獎章及徽章 | 175\n\n<!-- p.177 -->\n## 社 區 參 與 章 \n\n## **Community Involvement Badge** \n\n完成下列各項： \n\n- \" 註\" 1. 考獲下列其中一個專科徽章或獎章： \n\n   - (a) 多元共融（服務組）； \n\n   - (b) 指引（服務組）； \n\n   - (c) 公共衛生（服務組）； \n\n   - (d) 食物營養（服務組）； \n\n   - (e) 精神健康（服務組）；或 \n\n   - (f) 服務獎章。 \n\n- \" 註\" 2. 完成下列其中一項主題之相關專題講座／工作坊或考取下列其中一個 徽章或獎章，並獲取有關證書或證明文件： \n\n   - (a) 「積極公民」獎章系列 ； \n\n   - (b) 「地球部落」； \n\n   - (c) 環境清潔及衛生講座／工作坊； \n\n   - (d) 肅貪倡廉講座／工作坊； \n\n   - (e) 撲滅罪行講座／工作坊； \n\n   - (f) 環保講座／工作坊； \n\n   - (g) 生命教育講座／工作坊； \n\n   - (h) 防止濫用藥物／藥物教育講座／工作坊； \n\n   - (i) 平等機會教育講座／工作坊； \n\n   - (j) 愛滋病預防教育講座／工作坊；或 \n\n   - (k) 尊重知識產權教育講座／工作坊。 \n\n##### 3. 考獲公民章（服務組）。 \n\n- 註：上述第一項之專科徽章／獎章與上述第2 項之專題講座／工作坊之主題不能重覆。 上述第二項之相關專題講座／工作坊可由總會、地域或區會舉辦；或由認可機構（如學校、 獲註冊之認可社會服務機構及政府部門）提供，參加者必須出示有關參與／服務證書以茲 證明。 \n\n176 | 其他獎章及徽章\n\n<!-- p.178 -->\n##### 研習及考覈 \n\n## 宗 教 章 \n\n## **Religious Badge** \n\n童軍可選擇宗教章其中一項課程進行研習，可由團長、副團長、教練員自行 教導或安排適當人士，如法師、牧師、神職人員、主日學導師等協助考覈。 \n\n##### (A) 天主教課程 \n\n1. 明白使用《聖經》及明白如何在《褔音》內尋找天主聖言。 \n\n2. 明白彌撒的程序及意義。 \n\n3. 能詠唱聖歌三首。 \n\n4. 明白天主十誡。 \n\n5. 曾參與一項天主教節目（例如聖週禮儀，傳教節），並明白其意義。 \n\n6. 曾參觀一天主教機構。 \n\n7. 複考幼童軍宗教章（天主教）*；或 訓練一位幼童軍考取幼童軍宗教章（天主教）。 \n\n   - 持幼童軍宗教章（天主教）證書者毋須複考。 \n\n##### (B) 孔教課程 \n\n1. 尊重中國傳統文化和儒教思想。 \n\n2. 能列舉四書、五經、六藝、八德的名目。 \n\n3. 能念誦《禮運．大同》篇。 \n\n4. 能念誦《孟子經訓》。 \n\n5. 能唱《孔聖頌》。 \n\n6. 能在《論語》中摘出章句兩則，並解釋其意義。 \n\n7. 每年拜祭祖先、天地。 \n\n8. 參與傳統祭禮時，認識並遵守有關禮儀。 \n\n9. 曾參觀孔教團體和傳統廟宇。 \n\n其他獎章及徽章 | 177\n\n<!-- p.179 -->\n##### (C) 伊斯蘭教課程 \n\n1. 擁有一本《古蘭經》（中文譯本）及明白如何使用。 \n\n2. 背誦及明白清真言，「萬物非主，唯有真主，穆罕默德，是主差使」。 \n\n3. 明白伊斯蘭的意義是和平、順從。 \n\n4. 解釋念、禮、齋、課、朝五功的意義。 \n\n5. 說出全世界穆斯林信徒的數目。 \n\n6. 說出香港各間清真寺的位置。 \n\n7. 說出聖訓兩則。 \n\n##### (D) 佛教課程 \n\n完成下列其中八項： \n\n1. 能唱佛寶歌及誦佛號。 \n\n2. 能解釋五戒意義。 \n\n3. 能誦唸佛教經文一則（般若心經或八大人覺經）。 \n\n4. 能在佛經經文中摘出金句兩則，並能解釋其意義。 \n\n5. 能解釋佛教基本意義。 \n\n6. 曾參加佛教浴佛禮或佛教活動。 \n\n7. 在團集會／小隊露營講述佛經故事兩則。 \n\n8. 經已皈依三寶。 \n\n9. 協助一位幼童軍／童軍皈依三寶。 \n\n##### (E) 基督教課程 \n\n1. 擁有《聖經》或《褔音》袖珍本。 \n\n2. 背誦主禱文及使徒信經。 \n\n3. 唱聖詩五首。 \n\n4. 能敘述聖經故事四則：舊約兩則、新約兩則，包括耶穌所說的譬喻。 \n\n5. 背誦你所喜歡的《聖經》章節一段或詩篇二十三篇，並說明為甚麼 喜歡這段經文。 \n\n6. 在團集會／小隊露營負責領禱最少一次。 \n\n7. 能使用《聖經》或《褔音》袖珍本找尋上帝的話。 \n\n8. 明白主日的意義及參加主日崇拜四次以上。 \n\n9. 協助一位幼童軍／童軍進行宗教章（基督教）課程。 \n\n178 | 其他獎章及徽章\n\n<!-- p.180 -->\n##### (F) 道教課程 \n\n1. 能誦《太上道祖頌》。 \n\n2. 擁有一本《道德經》。 \n\n3. 能誦《道德經》其中三章。 \n\n4. 能說出道教「三清」的名號。 \n\n5. 能解釋「道家三寶」的意義。 \n\n6. 能解釋「七善」、「九美」的意義。 \n\n7. 能在團集會／小隊露營講述道祖生平故事或其他一位仙師的故事。 \n\n8. 曾參觀兩間道教宮觀。 \n\n其他獎章及徽章 | 179\n\n<!-- p.181 -->\n## 深 資 童 軍 先 修 章 **Venture Scout Link Badge** \n\n- 簡介：深資童軍先修章之設立旨在幫助適齡之童軍支部成員認識深資童軍支 部活動，鼓勵他們晉升為深資童軍。 \n\n年滿十四歲半之童軍支部成員可考取深資童軍先修章，完成後由其童軍 團長簽發。在特殊情況下，可由區、地域或總會委派指定人士簽發。童 軍團領袖應鼓勵及安排團內之成員認識及參與深資童軍支部活動。區總 監或其代表有責任協助區內之童軍團推行先修章考覈，尤其是沒有開辦 深資童軍團或因事未能安排有關活動之童軍旅。 \n\n完成下列各項： \n\n1. 說出深資童軍支部的目的、方法及預期成果。 \n\n2. 認識深資童軍制服。 \n\n3. 明瞭深資童軍獎章及榮譽童軍獎章之四個考驗組別及考驗範圍。 \n\n4. 明瞭深資童軍獎章及榮譽童軍獎章與其他機構互相關連的地方。 \n\n5. 說出執行委員會之基本功能。 \n\n6. 說出執行委員會之組織及委員的職責。 \n\n7. 明瞭執行委員會之產生方法。 \n\n8. 明瞭執行委員會中領袖的角色。 \n\n9. 認識多元化的深資童軍活動。 \n\n10. 參加最少一次深資童軍執行委員會會議。 \n\n180 | 其他獎章及徽章\n\n<!-- p.182 -->\n## 香 港 青 年 獎 勵 計 劃 **The Hong Kong Award For Young People** \n\n### 獎勵計劃簡介 \n\n- ‧ 香港青年獎勵計劃（前身為香港愛丁堡公爵 獎勵計劃），是國際青年獎勵計劃協會成員 之一。獎勵計劃擁有一套國際既定的原則， 讓年青人透過完成章級要求，培養勇於挑戰 及堅毅的精神。 \n\n### 獎勵級別 \n\n- ‧ 獎勵分為銅章，銀章，金章三級，參加者可 以直接參加任何一級或順序參與，但必須符 合各級年齡之規定方可獲準參加。此外，參 加者必須在二十五歲生日前，完成各項活動， 經評核合格後， 便可獲頒獎狀及獎章。 \n\n銀章 Silver \n\n銅章 Bronze \n\n### 計劃內容 \n\n- ‧ 每個章級均包括有四個科目，包括服務科、野外鍛鍊科、技能科及康樂 體育科，而金章級則需加上團體生活科。 \n\n- ‧ 銅章級、直接銀章級和直接金章級參加者從服務科、康樂體育科及技能 科三個科目中選擇一科作為「主項」，其餘兩科則為「副項」。 \n\n- ‧ 服務科鼓勵參加者認識、學習及參與志願服務，藉此培養服務社會及互 相幫助精神。 \n\n- ‧ 技能科鼓勵參加者發掘和發展個人興趣、社交及實用技能。 \n\n- ‧ 康樂體育科鼓勵參加者參與康樂體育活動，以強身健體，並提高自己的 技術水平。 \n\n- ‧ 野外鍛鍊科旨在鍛鍊參加者體能和意志，培養歷險和探索精神。 \n\n- ‧ 團體生活科鼓勵參加者透過參加羣體的外宿活動擴闊個人的經驗，改進 社交技巧。 \n\n- ‧ 有關獎勵計劃各科詳細的規條及內容，可參考香港青年獎勵計劃之活動 手冊http://www.ayp.org.hk \n\n其他獎章及徽章 | 181\n\n<!-- p.183 -->\n##### 童軍支部參加級別 \n\n參加者必須先出席由總會或地域辦事處舉辦之迎新講座，並開設獎 勵計劃紀錄簿，方能展開獎勵計劃活動。年齡十四至十六歲前 之童軍支部參加者，可選擇銅章級或直接銀章級作為獎勵計劃的開 始級別。為配合童軍支部的訓練特色及內容，我們建議童軍支部參 加者經由銅章級參與獎勵計劃的活動。童軍支部內之訓練內容均適 合同時作為獎勵計劃中有關科目的評核，惟必須同時符合獎勵計劃 中各科目的特定要求。詳情請參閱綱要內有關附註或香港青年獎勵 計劃香港童軍總會總會執行處網頁（http://www.scout.org.hk/ hkayp/）。 \n\n##### ‧ 五科在各章級的要求簡列如下（直接考取）： \n\n||銅章級|( 直接考取) 銀章級|( 直接考取) 金章級|\n|---|---|---|---|\n|要求|十四歲或以上|十五歲或以上|十六歲或以上|\n|服務科|[ 主]：最少二十六<br>小時， 不少於六個<br>月進行|[ 主]：最少五十二<br>小時， 不少於十二<br>個月進行|[ 主]：最少七十八<br>小時， 不少於十八<br>個月進行|\n||[ 副]：最少十三小<br>時， 不少於三個月<br>進行|[ 副]：最少二十六<br>小時， 不少於六個<br>月進行|[ 副]：最少五十二<br>小時， 不少於十二<br>個月進行|\n|康樂體育科|[ 主]：最少二十六<br>小時， 不少於六個<br>月進行|[ 主]：最少五十二<br>小時， 不少於十二<br>個月進行|[ 主]：最少七十八<br>小時， 不少於十八<br>個月進行|\n||[ 副]：最少十三小<br>時， 不少於三個月<br>進行|[ 副]：最少二十六<br>小時， 不少於六個<br>月進行|[ 副]：最少五十二<br>小時， 不少於十二<br>個月進行|\n|技能科|[ 主]：最少二十六<br>小時， 不少於六個<br>月進行|[ 主]：最少五十二<br>小時， 不少於十二<br>個月進行|[ 主]：最少七十八<br>小時， 不少於十八<br>個月進行|\n||[ 副]：最少十三小<br>時， 不少於三個月<br>進行|[ 副]：最少二十六<br>小時， 不少於六個<br>月進行|[ 副]：最少五十二<br>小時， 不少於十二<br>個月進行|\n|野外鍛鍊科|兩日一夜，<br>最少十二小時|三日兩夜，<br> 定向、游泳、射箭|[主]：完成其中一<br>個，參與活動為期<br>不少於六個月，完<br>成項目及持續參與<br>之合共時間不少於<br>二十六小時|完成其中一個#，參<br>與活動為期不少於六<br>個月，完成項目及持|\n||【技能組】射擊、技擊、野外定向、<br>徒手潛水、體育、射箭|[副]：完成其中一<br>個，參與活動為期<br>不少於三個月，完<br>成項目及持續參與<br>之合共時間不少於<br>十三小時|續參與之合共時間不<br>少於二十六小時|\n\n＊ 圖書管理專科徽章只可對應服務科或技能科其中之一科 \n\n#  只可選擇未曾用於獎勵計劃活動之專科徽章 \n\n其他獎章及徽章 | 185\n\n<!-- p.187 -->\n## 「積極公民」獎章系列 - 防 騙 先 鋒 章 **\"Active Citizenship\" Badge Series - Anti-Deception Badge** \n\n##### 簡介及學習內容 \n\n- 認識詐騙：介紹常見的詐騙手段和策略，如詐騙電話、詐騙郵件和網路詐騙 等。 \n\n- 辨識詐騙：教導如何辨識詐騙行為的特徵和警示訊號，如不實承諾、高壓銷 售和虛假資訊等。 \n\n應對詐騙：提供實用的應對策略，如保持警惕、保護個人資料、報告詐騙行 為和尋求幫助等。 \n\n##### 學習目標 \n\n1. 認識以下各種騙案，包括詐騙方式及預防方法，例如： \n\n   - (a) 網購騙案 \n\n   - (b) 電郵騙案 (c) 電話騙案 \n\n   - (d) 網戀騙案一 \n\n   - (e) 網戀騙案二 \n\n   - (f) 求職騙案一 \n\n   - (g) 求職騙案二：刷單騙案 \n\n2. 認識保護個人資料的重要及健康的網絡使用習慣： \n\n   - (a) 認識資料外洩的常見原因： \n\n      - (i) 網絡釣魚攻擊 \n\n      - (ii) 在社交媒體披露過多個人資料使用不明的網路 \n\n      - (iii) 在不明的網站輸入個人資料 \n\n      - (iv) 黑客利用保安漏洞，盜取個人資料 \n\n   - (b) 認識資料外泄可引致的影響，例如： \n\n      - (i) 財務損失 – 個人資料可能被用作財務詐騙（例如利用受害者 的帳戶進行未獲授權的交易） \n\n      - (ii) 身分被冒充 – 盜用的個人資料可能被用作進入系統或網絡從 事詐騙、商業間諜行為或身分盜竊 \n\n186 | 其他獎章及徽章\n\n<!-- p.188 -->\n- (iii) 情緒困擾 – 個別用戶可能會對資料外泄所帶來的負面後果感 到憂慮，例如個人資料可能被用作羞辱受害者，並對其造成 情緒困擾（例如名人照片外泄） \n\n- (c) 認識應對資料外洩的防範措施，包括但不限於： \n\n   - (i)  登入名稱/ 密碼不要包含個人/ 敏感資料 \n\n   - (ii)  不要與他人共用帳戶 \n\n   - (iii)  不再需要時把帳戶刪除 \n\n   - (iv)  定期檢查帳戶存取權及權限 \n\n   - (v)  使用高強度密碼及雙重認證 \n\n   - (vi)  使用防毒軟件及定期更新防火牆 \n\n   - (vii)  小心使用社交平臺 （如拒絕來歷不明的交友邀請及訊息、小 心發布個人敏感資料） \n\n   - (viii)  不要使用來歷不明的網站/ 網絡 \n\n- (d) 認識求助方法，包括但不限於： \n\n   - (i)  重設任何懷疑被入侵的網上帳戶的密碼 \n\n   - (ii)  防範仿冒詐騙電郵或其他意圖使用外泄資料的騙局 \n\n   - (iii)  採取適當行動刪除外洩的資料（例如向相關網站及討論區的 管理員提出要求） \n\n   - (iv)  尋求家長、老師協助 \n\n   - (v)  若事件涉及任何犯罪活動，需向警方舉報。 \n\n   - (vi)  若事件涉及個人資料外泄，需向個人資料私隱專員公署投訴 \n\n- (e) 認識及向小隊隊員分享最近三個月內所發生最少3 份有關課題內 容的新聞，並必須附有個人評論及提出可行的建議。 \n\n其他獎章及徽章 | 187\n\n<!-- p.189 -->\n## 「積極公民」獎章系列 - 保 護 兒 童 章 **\"Active Citizenship\" Badge Series - Child Protection Badge** \n\n##### 簡介及學習內容 \n\n認識兒童侵害情況：介紹常見的兒童侵害情況，如：身體傷害和性侵害等。 應對兒童侵害情況：提供學習自身或身邊的人遇到兒童被侵害的情況時的處 理方法。 \n\n##### 學習目標 \n\n1. 認識以下四種常見兒童侵害情況： \n\n   - (a) 網絡侵害或罪案 \n\n   - (b) 身體傷害 \n\n   - (c) 性罪行 \n\n   - (d) 詐騙 \n\n2. 學習自身或身邊的人遇到相關事件時的處理方法 \n\n   - (a) 當身邊的人遇到罪案時，可採取以下幾個步驟來處理： \n\n      - (i) 保持冷靜 \n\n      - (ii) 尋找安全地點 \n\n      - (iii) 聯絡可信任成人 \n\n      - (iv) 報警求助 \n\n      - (v) 提供詳細資訊 \n\n      - (vi) 情緒支持 \n\n3. 觀看最少3 條媒體採訪，就每一條所觀看影片做個案分析，並向小隊隊 員分享事件中的個人看法、處理方法及可行建議。 \n\n   - (a) 性罪行 \n\n   - (b) 身體虐待 \n\n   - (c) 網絡罪案 \n\n   - (d) 刑事毀壞 \n\n188 | 其他獎章及徽章\n\n<!-- p.190 -->\n## 「積極公民」獎章系列 - 禁 毒 章 \n\n**\"Active Citizenship\" Badge Series - Anti-Drug Badge** \n\n##### 簡介及學習內容 \n\n認識毒品：介紹常見毒品種類及其等對身體的禍害。 辨識販毒：教導常見被招攬販毒的原因及渠道。 瞭解刑責：瞭解法例中與毒品相關刑責。 \n\n應對毒品：遇到毒品誘惑的求助方式及應對方法，以及認識在香港提供相關 支援康復服務的機構。 \n\n##### 學習目標 \n\n1. 以下常見毒品及其對身體之禍害： \n\n   - (a) 依託咪酯 \n\n   - (b) 氯胺酮 \n\n   - (c) 大麻 \n\n   - (d) 冰毒 \n\n   - (e) 可卡因 \n\n   - (f) 海落英 \n\n2. 與毒品相關的刑罰 \n\n3. 常見的吸毒場所與原因 \n\n4. 應對及求助方法 \n\n5. 常見被招攬販毒的原因 \n\n其他獎章及徽章 | 189\n\n<!-- p.191 -->\n## 「積極公民」獎章系列 - 社 區 應 急 先 鋒 章 **\"Active Citizenship\" Badge Series - Community Emergency Responder Badge** \n\n##### 簡介及學習內容 \n\n防火知識：介紹及協助推廣防火。 \n\n應急認知：救人自救，在危急事故中更有信心地向有需要人士伸出援手。 心肺復甦法及自動心臟除顫器：認識及推廣心肺復甦法及自動心臟除顫器。 \n\n##### 學習目標 \n\n1. 完成一小時網上課程，且認識及向小隊隊員分享最近三個月內所發生最 少三份有關課題內容的新聞，並必須附有個人評論及提出可行的建議： \n\n   - (a) 火警逃生； \n\n   - (b) 消防安全及家居防火資訊；及 \n\n   - (c) 認識常見的基本消防安全裝置。 \n\n2. 完成下列其中一項： \n\n   - (a) 完成總會／地域／區舉辦的社區應急先鋒訓練班；或 \n\n   - (b) 持有「社區應急先鋒」計劃證書。 \n\n190 | 其他獎章及徽章\n\n<!-- p.192 -->\n## 「積極公民」獎章系列 - 環 保 先 鋒 章 \n\n## **\"Active Citizenship\" Badge Series - Green Pioneer Badge** \n\n簡介及學習內容 \n\n認識香港的環保政策及措施 本地及全球環境議題 人與環境的關係 保護環境的方法 \n\n##### 學習目標 \n\n1. 完成由環境運動委員會委任的環保先鋒導師教授有關環保的內容。 \n\n2. 完成一項由環境運動委員會安排的環境教育培訓活動。 \n\n3. 完成一項由香港童軍總會或其他機構舉辦的環境教育培訓活動。 \n\n其他獎章及徽章 | 191\n\n<!-- p.193 -->\n# 第五章 徽章簽發 / 領取∕購買 **Chapter 5 : Issue / Collection / Purchase of Badges** \n\n# 徽章簽發 \n\n# **Issue of Badges** \n\n徽章簽發之指引一切以網上公佈的最新版本為依據。 \n\n||徽章名稱|簽發單位|簽發人士|\n|---|---|---|---|\n|1.<br>2.|童軍探索獎章／<br>童軍標準獎章／<br>童軍高級獎章<br> 服務組／<br>教導組專科徽章<br>10. 宗教章<br>11. 社區參與章||\n|12. 深資童軍先修章<br>13. 「積極公民」獎章系列<br>14. 航空活動徽章<br>（初級航空活動章、<br>中級航空活動章 及<br>高級航空活動章）|在童軍物品供應社發售，購買時須出示由獲<br>授權人士簽署及蓋上獲授權單位印章之相關<br>證書正本。註|\n|15. 海上活動徽章<br>（艇工章、水手章 及<br> 水手長章）||\n\n徽章簽發∕領取∕購買 | 195\n\n<!-- p.197 -->\n# 徽章領取∕購買 \n\n# **Collection / Purchase of Badges** \n\n|徽章名稱|領取／購買方法|\n|---|---|\n|16. 拯溺布章|在童軍物品物供應社發售，購買時須出示由<br>中國香港拯溺總會發出之有效拯溺銅章或以<br>上級別之證書正本及有效童軍紀錄冊。註|\n|17. 金紫荊獎章標誌|在童軍物品供應社發售，購買時須出示金紫<br>荊獎章證書副本，每次可購買獎章標誌三<br>枚。|\n|18. 香港青年獎勵計劃獎章<br>（銅／銀章）|由青少年活動署送贈，童軍物品供應社代為<br>派發，領取時須出示由地域發出之恭賀信正<br>本及有效童軍紀錄冊。註|\n|19.  和平使者章|可憑個人和平使者章購章券自行到童軍物品<br>供應社購買或由活動負責人或單位領袖憑和<br>平使者章團體購章券為所有參加者到香港童<br>軍物品供應社購買。<br>詳情請參閱「和平使者計劃（香港）」國際<br>通告第 05／2023 號。|\n|20. 「地球部落」|可持青少年活動署所發出的二維碼於辦公時<br>間內，親身到青少年活動署領取徽章，直至<br>另行通告為止。<br>詳情請參閱「地球部落」通告第06／2026<br>號 。|\n\n註：每張證書／獲獎證明最多可購買徽章兩枚，童軍物品供應社職員會於證 書／獲獎證明背面蓋印證明已出售布章予該證書持有人。 \n\n196 | 徽章簽發∕領取∕購買\n\n<!-- p.198 -->\n# 第六章 典禮與儀式 \n\n# **Chapter 6 : Ceremonies** \n\n傳統的典禮與儀式，在童軍運動中甚受重視，因時代的進展，建議中採 用精簡而不失莊重的方式舉行。 \n\n儀式最好能在戶外舉行，各參加者應預知典禮的程序及其責任。 \n\n### 幼童軍晉團儀式： \n\n這儀式最好在兩團集會時舉行，晉團的幼童軍向團員作簡短道別後，由 童軍團長迎接入團，介紹他與新隊長及其他團員認識。 \n\n### 童軍宣誓或覆誓儀式： \n\n這是各童軍儀式中最重要的一項，程序可依以下建議的方式舉行： \n\n童軍由隊長引導給團長後，團長詢問其是否明瞭童軍規律，再命其隨團 長逐句背誦童軍誓詞，團長對會員章作一簡明解釋後，便為該童軍佩戴於制 服上。團旗在此儀式中並不需要，因童軍既以其信譽為誓，已表明他對童軍 運動的忠誠。 \n\n宣誓儀式不應在劇烈活動後舉行，最適宜的時間是在團集會開始後，因 此時各人皆精神煥發；其次是在散會前舉行。最後以一適合而簡短的祈禱作 儀式的完結。 \n\n宣誓對該童軍、其領袖及團都有密切的關係，領袖可助該童軍遵守其誓 言，故宣誓儀式不應由旅團以外人士領導；同時，儀式不應公開舉行，但童 軍家長可出席，若有數位童軍同時宣誓，應個別單獨宣誓而非集體舉行，可 安排他們分別在集會開始或散會前舉行。 \n\n### 小隊長就職儀式： \n\n在儀式進行中，領袖可詢問該童軍是否準備負擔領導該小隊的責任，又 可否為小隊而犧牲自己，或為團而犧牲小隊，及能否作領導者，最後可由該 新隊長覆背誓詞，表示其願意負起未來的責任。 \n\n典禮與儀式 | 197\n\n<!-- p.199 -->\n### 童軍晉團儀式（晉升深資童軍團）： \n\n如果本旅有深資童軍團，便應齊集舉行，但若深資童軍團是和別旅聯合 組成，則團部祇需舉行一簡單的話別，感謝其對本團的服務，及祝福其未來； 童軍參加本區的聯合深資團後，可在其舊旅團中擔任幼童軍或童軍團的教練 員，作為其考取獎章中所需的服務活動的資格。 \n\n### 頒授獎章與專章： \n\n各團可舉行其本團傳統的儀式恭賀獲獎者。 \n\n198 | 典禮與儀式\n\n<!-- p.200 -->\n# 小隊隊名及隊色 **Patrol Names & Colours** \n\n|獾|Badger|紫|白|Purple and White|\n|---|---|---|---|---|\n|海     狸|Beaver|藍|黃|Blue and Yellow|\n|水     牛|Buffalo|紅|白|Re SNIPE                鷸 TIGER   老虎<br>隊色               深藍鮮紅 隊色  紫<br>SQUIRREL   松鼠 WOLF   狼<br>隊色  灰紅 隊色  黃黑<br>STAG   牡鹿 WOODPECKER   啄木鳥<br>隊色  紫黑 隊色  綠紫<br>SWIFT   燕子 WOOD PIGEON   班鳩<br>隊色  深藍 隊色  藍灰<br><!-- End of picture text -->\n\n202 | 附錄\n\n<!-- p.204 -->\n# 活動資料 \n\n# **Programme Materials** \n\n### 活動資料 \n\n範圍廣泛及可自由發揮的活動及特殊活動，可使團及小隊之集會更多姿 多采。童軍訓練之主要特色是自由選擇及有彈性，故活動之內容不可有硬性 規限。為方便採用，現把所有活動根據其興趣、活動性質及發展不同，而分 類如下： \n\n### 戶外活動： \n\n露營 滑翔 原野烹飪 先鋒工程 爬山 足球 獨木舟 釣魚 射箭 小型賽車 旅行 騎馬 游泳 野外遊戲 潛水 黑夜活動 拯溺 遠足 划艇 野外定向 服務計劃（道路調查） 古蹟探訪 風帆 單車 行山 其他體育活動 探訪機場、警署、消防局 \n\n（及其他性質之參觀： 如油渣機器廠、發電廠、水務署、船塢、科學博物 館、戶外展覽等。） \n\n附錄 | 203\n\n<!-- p.205 -->\n### 戶內活動： \n\n指南針製造 西洋拳、器械操、柔道 獨木舟製造 各種模型製作 太空圖表 文娛表演 簡單工具運用 參觀馬廄 急救 繪製地圖或人口調查 救生 公共服務人員演講 展覽 攝影及沖曬 蒐集 小隊攝影機製造 冒險性活動安全措施 氣象臺建造 參觀航空控制塔 體育家示範 摩士電碼或旗語 繪畫及雕刻 \n\n### 科學性及技術性活動： \n\n自然（收集、參觀、展覽） 考古學 無線電通訊 金工 林務 氣象學（氣候圖表、量雨計） 汽車原理 天文學 發熱機 電子發光體製造 地質學 模型渦輪機製造 製造電力發動機 製造利用噴射原理發動之機械 \n\n204 | 附錄\n\n<!-- p.206 -->\n# 郊野守則 **The Country Code** \n\n（仍同為山野不留痕的七大原則） \n\n(Also known as Seven Principles of Leave No Trace) \n\n   1. 事前策劃及準備 \n\n2. 在耐久的地面行進及露營 \n\n   3. 妥善地處理廢物 \n\n   4. 保持環境原有風貌 \n\n5. 減低用火對環境的影響 \n\n   6. 尊重野生動物 \n\n   7. 為其他遊人設想 \n\n註： 詳情請參閱「郊野守則」青少年活動通告第105／2019號。 \n\n附錄 | 205\n\n<!-- p.207 -->\n# 全港嘉爾頓錦標賽 **Hong Kong Carlton Trophy Competition** \n\n### 簡介 \n\n在1949 年隨英國海軍調派至香港之田家騰（Carlton W.TINN），其本 身為一資深童軍領袖，並完成木章訓練，且於 1947 年在英國被委任為童子 軍訓練主任。到香港後即參與本港之童軍運動，並獲委任為領袖訓練主任 （Deputy Camp Chief），協助戰後香港童軍之重組和艱巨之領袖訓練工作。 至 1951 年，田家騰更被委任為香港副總監，協助升任香港總監的柯昭璋， 田氏和同為英國海軍之訓練總監顧華牧師（Rev. T.E. GOVER）皆認為童子軍 支部和新成立之深資童子軍支部應各有一個全港團際比賽。故田氏捐贈一面 錦標作為全港童子軍團比賽獎旗之用，而前稱的全港威爾斯太子錦標則為新 成立的深資童軍支部所用。 \n\n### 目的 \n\n全港嘉爾頓錦標賽，旨在透過各項童軍技能比賽，考驗參賽小隊之技能 水平和合作性，讓各童軍團得以交流和切磋，並透過賽事提高童軍技能之水 準，以及選出最優秀之小隊隊伍以作典範。 \n\n206 | 附錄\n\n<!-- p.208 -->\n### 歷屆冠軍 \n\n|1951|九龍第8 旅|2024|港島第15 旅|\n|---|---|---|---|\n|1952|九龍第11 旅|||\n|1953|九龍第17 旅<br>|||\n|1954|九龍第11 旅<br>|||\n|1955|九龍區<br>|||\n|1956|維多利亞區|||\n|1957|九龍區<br>|||\n|1959|香港第12 旅<br>|||\n|1962|港島西區|||\n|1963|維多利亞城區|||\n|1967|香港第12
