vision June 2016] \n\nPage 2 of 2\n\n<!-- p.96 -->\n**Annex 16 To Technical Note** \n\n**Sample Letter of Acceptance** \n\n###### **BY FAX & BY HAND** \n\nOur Ref.: <To be inserted by Procuring scout unit> \n\n<Date> \n\n<Name of Contractor & Address> \n\n(Attn: <XXXX>) \n\nDear Mr/Ms <XXXX>, \n\n###### Building / Fitting-out / Repairs * Works <Project Title> for <Address> **_Letter of Acceptance_** \n\nScout Association of Hong Kong (‘SAHK’) is pleased to inform you that your tender for the captioned Works is accepted based on the following terms and conditions: \n\n- 1) The Contract Sum shall be at a lump sum fixed price of Hong Kong Dollars XXXXXXXXXXXX only (HK$XXX,XXX). \n\n- 2) The Date for Possession and Date for Completion of the Works shall be **<** date **> (** XXXXday **)** and **<** date **> (** XXXXday **)** respectively. \n\n- 3) * You are required to submit, before commencement of the Works, a certified true copy of the third party insurance policy or a certificate of insurance together with a copy of the receipt of premium payment in the joint names of your Company and Scout Association of Hong Kong covering the captioned Works. \n\n- 4) The tender documents, your tender and this Letter of Acceptance shall constitute a binding contract between SAHK and your Company. \n\nA kick off meeting will be held on **<** date **> (** XXXXday **)** at XX:XX (am / pm) in **<** venue **>.** Please confirm by **<** date **>** the names of your representatives who are to attend the meeting. \n\nYours faithfully, \n\n<Name > <Post of Budget Holder / Head of Procuring Scout Unit> \n\nEncl. * delete as appropriate \n\n[Version: June 2016]\n","03_政策及安全指引/pc072025c_SustainabilityFramework.md":"---\nsource_file: \"pc072025c_SustainabilityFramework.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2025** 年 **8** 月 **1** 日 第 **07/2025** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 可持續發展框架 \n\n**1.** 引 言 \n\n   - 1.1 2024 年 8 月舉行的第 43 屆世界童軍會議通過接納「世界童軍運動策略」 (Strategy for Scouting) 及「2024-2027 年世界童軍三年計劃草擬目標」，《20242027 年世界童軍三年計劃》(World Triennial Plan 2024-2027)於 2024 年 11 月 獲得世界童軍委員會通過。三年計劃提出 11 項關鍵工作領域以實踐三個影 響聲明（包括︰「一個和平與共融的世界」、「一個由青年塑造的世界」和「一 個可持續發展的世界」）及世界童軍優先策略。 \n\n   - 1.2 「一個可持續發展的世界」是三個影響聲明之一︰ 「童軍運動透過教育及賦權年輕人，推動他們適應、減緩並採取行動以應對 氣候變化、污染和保護生物多樣性，平衡經濟發展、社會進步與環境保護。 童軍將以身作則，倡導環境、經濟及社會可持續發展，提升本地及全球的氣 候與環境韌性和正面影響力。」（翻譯自“World Triennial Plan 2024-2027”） \n\n   - 1.3 這 11 項工作領域旨在推進童軍運動策略目標。此綜合發展方針確保童軍運 動持續成為推動包容、具韌性及可持續發展的積極力量（《2024-2027 年世界 三年計劃》）。其中，第 3 項工作領域為「環境可持續發展」： \n\n      - 1.3.1 童軍運動將推動可持續發展議程，並將其融入所有營運層面。 \n\n      - 1.3.2 童軍運動將提高意識並實施措施以預防及抵銷其對環境的影響，例 如︰追蹤溫室氣體排放、開發氣候適應工具，以及在童軍活動實踐可 持續發展措施。 \n\n      - 1.3.3 透過建立策略性合作夥伴和倡導氣候政策變革，童軍運動將推動其對 世界的影響力，並透過「童軍支持聯合國可持續發展目標」倡議（Scouts for SDGs），加強對氣候行動及環境可持續發展的貢獻。 \n\n   - 1.4 香港童軍總會（下稱「本會」）於 2024 年 2 月公佈《發展策略計劃（20242027）》，當中包括四大目標（A 至 D）和 10 個策略（1-10），「推動可持續發 展」（SDGs）屬於目標 B「全人發展與教育」下的策略（7）。此目標為香港 童軍運動推動聯合國可持續發展目標提供方向，包括︰降低碳排放、提高能 源效益、保護生物多樣性、促進節能發展、加強環境保護，以及提升可持續 教育和意識。\n\n<!-- p.2 -->\n**2.** 生效日期 此框架由2025年8月1日起生效。 \n\n## **3.** 綱 領 \n\n   - 3.1 所有人類活動（包括任何規模的童軍活動）都會在社會、經濟及環境等方面 對社區產生影響。可持續發展活動考慮以上因素，致力減少活動對社區的負 面影響，同時提升其正面影響。（《世界童軍組織指引︰籌辦可持續活動》） \n\n   - 3.2 本框架概述通用原則及指引，以評估在香港舉辦的童軍活動的可持續性，並 致力將童軍活動對社會、經濟及環境造成的影響減至最低。為達成目標，本 會參考以下指引／原則： \n\n      - 3.2.1 《2024-2027 年世界童軍三年計劃》第 3 項工作領域； \n\n      - 3.2.2 《世界童軍組織指引︰籌辦可持續活動》 (WOSM Guidelines for Organising Sustainable Events)； \n\n      - 3.2.3 本會《發展策略計劃（2024-2027）》策略（7）。 \n\n**4.** 發展方向 \n\n   - 4.1 本框架為在香港籌辦可持續發展童軍活動提供方向： \n\n      - 4.1.1 研究與發展 \n\n         - (1) 建立機制以支持本會各層面實踐可持續發展措施； \n\n         - (2) 於研究與發展中應用氣候適應工具。 \n\n      - 4.1.2 童軍活動的環境可持續發展 \n\n         - 整合童軍活動（當中包括以青少年為主的活動和總會層面的活動）實 踐環境可持續發展的措施與要求，以符合《世界童軍組織指引︰籌辦 可持續活動》。 \n\n      - 4.1.3 倡議與政策 透過拓展策略合作夥伴和倡議氣候政策變革，加強對氣候變化行動及 環境可持續發展的貢獻。 \n\n      - 4.1.4 對童軍旅、區和地域的支援 \n\n         - 進一步推動「童軍支持聯合國可持續發展目標」倡議，支援及促進童 軍旅、童軍區及童軍地域在社區層面帶領具影響力的氣候變化行動。 \n\n   - 4.2 為確保可持續發展措施得以落實執行，本會採納《世界童軍組織指引︰籌辦 可持續活動》提倡的原則。有關原則為本會提供逐步指南，在籌辦活動過程 （由開始籌備至活動結束）運用可持續發展措施以評估及盡力減低對環境的 影響，確保活動盡可能符合環境可持續發展。有關原則包括： \n\n      - 4.2.1 提早規劃 \n\n         - (1) 將可持續發展措施納入活動規劃的核心部分（如選擇場地與供應 商、量度二氧化碳排放量基準等）； \n\n         - (2) 委任一隊具備可持續發展思維的團隊； \n\n         - (3) 考慮本地關於可持續發展的法例要求； \n\n         - (4) 建立可持續發展承諾並收集反饋意見。\n\n<!-- p.3 -->\n- 4.2.2 減量優先，抵償次之 \n\n在考慮補償損耗之前，已盡一切可能減少耗用資源。 \n\n- 4.2.3 優先考慮本地與季節性資源 \n\n優先選用本地（及當季）資源，再考慮外地資源。 \n\n      - 4.2.4 提高意識與賦權 \n\n         - (1) 清晰說明使活動可持續發展的措施，並賦權參與者共同落實相關 措施； \n\n         - (2) 將活動視為重要的教育機會。 \n\n   - 4.3 《世界童軍組織指引︰籌辦可持續活動》為將「可持續發展」納入活動管理 流程和分工提供良好範例。 \n\n   - 4.4 本會承諾透過採納世界童軍三年計劃加強環境可持續發展，包括： \n\n      - 4.4.1 「童軍運動中的年輕人提升能力以減低其對自然環境的影響，促進可 持續發展生活模式，並成為自然環境可持續發展的變革者。」（翻譯自 “World Triennial Plan 2024-2027”, 1c） \n\n      - 4.4.2 「童軍運動將為氣候變化對我們組織的影響做好準備，並就各方面的 運作實施氣候行動。」（翻譯自 “World Triennial Plan 2024-2027”, 5c） \n\n   - 4.5 為評估實行世界童軍運動策略和世界童軍三年計劃的進展，同時促進協作及 品質保證，各童軍地域及總會各署應將環境倡議（包括但不限於「地球部落」 計劃）整合至青少年活動之中，以作為自然環境可持續發展的成效指標。有 關成效指標透過現有渠道（如成員人數統計、問卷調查和 GSAT）收集實用、 可靠及可衡量的數據，以反映實踐世界童軍三年計劃目標與世界童軍優先策 略的進展。 \n\n**5.** 檢視與修訂 此框架最少每五年或按需要作出檢視及修訂，以優化其內容，與時並進。 \n\n**6.** 參考文件 \n\n   - 6.1 WOSM 2018. Scouts for SDGs. \n\n   - 6.2 WOSM 2021. WOSM Guidelines for Organising Sustainable Events. \n\n   - 6.3 WOSM 2024. World Triennial Plan 2024-2027, World Scout Committee, Strategy for Scouting. \n\n   - 6.4 香港童軍總會《發展策略計劃（2024-2027）》 \n\n**7.** 查 詢 \n\n如有查詢，請與青少年活動執行幹事聯絡（電話︰2957 6415）。 \n\n香港總監 \n\n（陳勇 代行）\n","03_政策及安全指引/「性罪行定罪紀錄查核」常見問題.md":"---\nsource_file: \"「性罪行定罪紀錄查核」常見問題.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n# 香港童軍總會 \n\n「性罪行定罪紀錄查覈」常見問題 \n\n**1.** 為何要進行「性罪行定罪紀錄查覈」（下稱「查覈」）？哪些成員需要進行查 核？ \n\n香港童軍總會（下稱「總會」）一直致力培育青少年的工作，有責任為青少年 成員提供一個安全的活動環境，保護他們免受任何危害或侵犯。同時，為配合 香港特區政府擴展查覈機制至涵蓋志願工作者，故總會決定由 2026 年 4 月 1 日 起，所有總監、領袖（包括教練員）及總會認為有需要之人士，必須進行查覈， 並提交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件，以便在處理提名委任 或續任時作參考。 \n\n**2.** 某些領袖或會有超過一個童軍職位，是否需在每個職位續任時進行新查覈？ \n\n領袖只需進行一次查覈，並提交「性罪行定罪紀錄查覈：獨特的查詢密碼」信 件作為完成查覈的證明，以便處理其續任時作參考。查覈結果的有效期為 3 年 （ 36 個月），在此期間如需續任童軍職位亦不用進行新查覈。 \n\n**3.** 查覈結果的有效期為 **3** 年，領袖是否需要續期？如需要，領袖應在什麼時候進 行續期？ \n\n領袖需要在有效期內最後 3 個月透過網上申請查覈續期。總會行政署亦會於領 袖的查覈有效期到期前 3 個月，以 SMIS 系統發出提示電郵提示有關領袖需完成 查覈續期，並於完成續期後透過提示電郵內提供的電子表格上載證明及交予行 政署。如行政署在查覈有效期到期後仍未收到相關領袖的「性罪行定罪紀錄查 核：獨特的查詢密碼」信件，其委任將會被終止。 \n\n**4.** 進行查覈時需要提交由僱主／ 所屬團體發出的證明信，領袖如何索取有關證明 信？ \n\n# 首次被提名或獲委任新職位的總監及領袖 \n\n首次被提名或獲委任新職位的總監及領袖，在提交委任提名錶（表格 A01 ）時， 可與所屬署／地域／屬會聯絡索取證明信，用於申請查覈時提交。有關證明信 會由本會行政署以電郵發出。 \n\n# 現役總監及領袖 \n\n現役總監及領袖在獲提名續任時，所屬署／地域／屬會將以電郵發出有關證明 信。\n\n<!-- p.2 -->\n# 教練員 \n\n總會行政署於收到教練員註冊及委任表格（表格 CR01 ）後，將透過電郵向被提 名人發出遞交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件的電子表格。如 之前未曾進行過相關查覈，可向行政署索取證明信，用於申請查覈時提交。 \n\n# **5.** 進行查覈的程序是怎樣？ \n\n# 新申請 \n\n申請人可預約前往查覈辦事處；或經香港警務處網上服務辦理申請查覈手續。 如網上申請，遞交申請表、上載文件及繳費後，可預約前往警察總部或 24 小時 指定警署，套取指紋以進行查覈。 \n\n# 續期 \n\n申請人可在有效期內最後 3 個月透過網上申請續期或預約親身到辦事處遞交申 請（必須使用「智方便」或「智方便＋」登入系統提交申請或作預約）。但若 過了有效期，合資格申請人便需要重新申請。 \n\n有關申請查覈的詳情，請瀏覽香港警務處性罪行定罪紀錄查覈網頁： https://www.police.gov.hk/ppp_tc/11_useful_info/scrc.html \n\n# **6.** 進行查覈後，如何遞交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件？ \n\n# 首次被提名或獲委任新職位的總監及領袖 \n\n首次被提名或獲委任新職位的總監及領袖，在提交委任提名錶（表格 A01 ）時， 須連同成年成員註冊表格﹙表格 R01 ﹚、完成「保護童軍成員免受傷害」網上 自學課程證書及「性罪行定罪紀錄查覈：獨特的查詢密碼」信件，交予所屬署 ／地域／屬會處理。 \n\n# 現役總監及領袖 \n\n現役總監及領袖在獲提名續任後，所屬署／地域／屬會將發出電子委任聲明書 （表格 R02 ），獲提名的總監及領袖須於填寫表格 R02 時上載「性罪行定罪紀 錄查覈：獨特的查詢密碼」信件。 \n\n# 教練員 \n\n總會行政署於收到教練員註冊及委任表格（表格 CR01 ）後，將透過電郵向被提 名人發出遞交及上載「性罪行定罪紀錄查覈：獨特的查詢密碼」信件的電子表 格。 \n\n# **7.** 如果領袖未能在指定時間內完成查覈會如何處理？ \n\n若被提名委任及續任之總監及領袖（包括教練員），以及總會認為有需要之人 士未能在指定時間前提供「性罪行定罪紀錄查覈：獨特的查詢密碼」信件，總 會或未能處理其委任或續任。\n\n<!-- p.3 -->\n# **8.** 總會會否為政策設過度期？ \n\n「性罪行定罪紀錄查覈」政策將設 6 個月過度期（ 2026 年 4 月 1 日至 2026 年 9 月 30 日），惟領袖必須盡量在指定時間前完成查覈。 \n\n# **9.** 成員可否向總會申領進行查覈的費用？ \n\n如有需要申領查覈費用，可填寫相關的電子申請表格及上載收據證明，向總會 申領查覈的費用。有關費用將於成功完成委任／續任後發還（只限首次經總會 發出機構證明信及新申請查覈之人士）。 \n\n# 首次被提名或獲委任新職位的總監及領袖 \n\n總會行政署或所屬署／地域／屬會將以電郵發出相關的電子申請表格。 \n\n# 現役總監及領袖 \n\n現役總監及領袖在獲提名續任後，所屬署／地域／屬會將發出電子委任聲明書 （表格 R02 ），獲提名的總監及領袖可於填寫表格 R02 時申領查覈費用及上載 收據證明。 \n\n# 教練員 \n\n總會行政署於收到教練員註冊及委任表格（表格 CR01 ）後，將透過電郵向被提 名人發出遞交及上載「性罪行定罪紀錄查覈：獨特的查詢密碼」信件的電子表 格，被提名人可於電子表格申領查覈費用及上載收據證明。 \n\n**10.** 有些成員因本身的職業所需，已進行查覈或曾進行查覈，是否可以獲豁免該等 成員進行查覈？ \n\n鑑於一些職業的僱主在聘任員工時，已按法定要求進行註冊／審查或要求準僱 員進行性罪行查覈或有關刑事罪行的背景審查，如童軍成員從事相關行業，並 提交由其僱主發出的證明信及工作證明，可獲豁免進行查覈。可獲豁免之人士 包括： \n\n- 香港特別行政區政府全職公務員 \n\n- 現職於正規課程的中、小學、幼稚園及幼兒中心的註冊教師 \n\n- 現職註冊社工 \n\n- 其他因工作性質需要，已按現職僱主要求，完成性罪行查覈的現職僱員 \n\n有關豁免安排可參閱總會政策通告第 02/2026 號。如上述人士未能提供相關證 明文件，便必須進行「性罪行定罪紀錄查覈」，並提交「性罪行定罪紀錄查覈： 獨特的查詢密碼」信件，以便在處理提名委任或續任時作參考。\n","04_行政及領袖訓練/ACR062026C_2026年週年註冊及統計社會服務與訓練活動統計.md":"---\nsource_file: \"ACR062026C_2026年週年註冊及統計社會服務與訓練活動統計.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2026** 年 **2** 月 **1** 日 第 **06/2026** 號通告 [行政 ] \n\n# **2026** 年週年註冊及統計 \n\n# 社會服務與訓練／活動統計 \n\n各單位於每年年底進行週年註冊時，須同時向總會提供成員參與社會 服務與童軍訓練／活動的情況。本會現提供 2026 年「社會服務與訓練／活 動統計」（表格 TA_2026）的電子表格，以利便各單位能適時記錄該等活動 資料，單位於年底時把已填妥的電子表格上載至電子申報系統（ E-Census） 便可。 \n\n單位可掃描左下方的 QR 碼下載相關電子表格。 \n\n副香港總監（管理） 盧 建 業 \n\n表格 TA_2026\n\n<!-- p.2 -->\n## TA.REV.04 \n\n## **香港童軍總會** \n\n## **社會服務與訓練／活動統計（ 2026 年 1 月 1 日至 12 月 31 日）** \n\n1. 應填報於 2026 年內主辦、協辦及參加的各項（包括面對面及網上）服務／訓練及活動。如該項目同時包含服務和活動的元素，則「服務種類」和「活動種類」均須填報。 \n\n2. 若 貴單位為主辦單位，應填報所有童軍參加者資料，包括其他童軍單位的參加者資料；若為協辦單位或該服務／訓練／活動由其他機構主辦，應填報 貴單位所有童軍參加者資料； 若由其他童軍單位主辦（包括總會），則毋需填報。 \n\n3. **「活動種類」** 代號： \n\n   - A01. 徽章／段章考覈 A02. 成員支部訓練 A08. 典禮 A09. 比賽 ( 如 : 錦標賽 ) A15. 表演 A16. 興趣班 \n\n4. **「服務種類」** 代號： S01. 維持秩序 S02. 協助程序進行 S08. 籌款 ( 如 : 步行籌款 ) S09. 收集旗袋 \n\nA04. 所有其他訓練 A05. 工作坊 A11. 日營 A12. 參觀活動 A18. 共融活動 A19. 座談會／講座 \n\n   - A06. 交流活動 A07. 同樂日／聯歡會／聯誼 A13. 會議 A14. 戶外活動 ( 如 : 遠足、旅行 ) \n\n- A03. 領袖訓練 A10. 露營／宿營 A17. 成員招募 \n\nS03. 表演 S04. 捐血活動 S10. 送暖行動 ( 如 : 探訪活動、老人服務 ) \n\nS04. 捐血活動 \n\nS05. 環保活動 ( 如 : 不留痕、清潔運動 ) \n\nS06. 共融活動 S07. 急救服務 \n\n5. **籌備工作總時數：** （所有籌備會議、場地勘察、準備及檢討等所需工作時數） x （參與籌備工作成員人數）。 \n\n6. 如活動取消，請於 \" 日期 \" 的欄目選擇 \" 取消 \" ，於 \" 籌備工作 \" 的相關欄目填報有關資料，並於 \" 參加人數 \" 及 \" 服務／活動時數 \" 的相關欄目填報 \"0\" 。 \n\n7. 請於 2027 年 1 月 15 日前將本表格上載至電子統計申報系統。 \n\n|**服務／活動名稱**|**日期**<br>**主辦**<br>**單位**|**舉行**<br>**地點**|**活動種類**|**服務種類**|**籌備工作**<br>(所有籌備會議、場地勘察、準備<br>及檢討等所需工作)|**參加**|**人數**|**服務／活動**<br>**時數**|**服務／活動**<br>**總時數**|\n|---|---|---|---|---|---|---|---|---|---|\n|||_(_ 按一|下方格從列表選項_)_||**籌備時數**<br>**參與籌備**<br>**成員人數**<br>**總時數**|**小童軍幼童軍**<br>**童軍**|**深資**<br>**童軍**<br>**樂行**<br>**童軍**<br>**領袖／**<br>**會務**<br>**委員**|||\n|**例**<br>**先鋒工程訓練營**|**_06/_** **六月**<br>**_U03._** **區**|**_P01._** **本地**|**_A10._** **露營／宿營**|**_NA_不適用**|**_70_**<br>**_5_**<br>**_350_**|**_0_**<br>**_261_**<br>**_58_**|**_7_**<br>**_10_**<br>**_72_**|**_7_**|**_2856_**|\n|**例**<br>**學校陸運會**|**取消**<br>**_U05._** **其他**|**_P01._** **本地**|**_NA_不適用**|**_S01._** **維持秩序**|**_2_**<br>**_5_**<br>**_10_**|**_0_**<br>**_0_**<br>**_0_**|**_0_**<br>**_0_**<br>**_0_**|**_0_**|**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||**請按下欄**|**目儲存格**|**以在其列表選取恰**|**當資料**|**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n||||||**_0_**||||**_0_**|\n","04_行政及領袖訓練/ACR192026C_2027年功績獎勵及感謝狀提名.md":"---\nsource_file: \"ACR192026C_2027年功績獎勵及感謝狀提名.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2026** 年 **9** 月 **1** 日 第 **19/2026** 號通告 [行政 ] \n\n# **2027** 年功績獎勵及感謝狀提名 \n\n總會每年頒發各項功績獎勵之目的是嘉許長期對童軍運動作出優良服務和傑出貢獻的制 服成員及會務委員。而感謝狀則是頒予已婚制服成員配偶、未婚制服成員家長，在特殊情況 下，感謝狀亦會頒予支持童軍運動或對童軍運動有貢獻的人士。有關「2027 年創辦人紀念日 獎勵」及「2027 年童軍獎勵」之提名詳情如下： \n\n|獎勵類別|提名截止日期|\n|---|---|\n|「2027年創辦人紀念日獎勵」<br>• 優良服務獎章<br>• 優異服務獎章<br>• 感謝狀|2026年11月30日<br>（如提名單位為區，則需於2026年10月31日前<br>送達有關地域）|\n|「2027年童軍獎勵」<br>• 功績榮譽十字章及功績榮譽獎章<br>• 金龍勳章、銀龍勳章及青龍勳章<br>• 金獅勳章、銀獅勳章及銅獅勳章|2027年5月31日<br>（如提名單位為區，則需於2027年4月30日前<br>送達有關地域）|\n\n1. 功績獎勵 \n\n   - 1.1 各項功績獎勵乃由總會全權批准，所有提名須由香港總監／副香港總監／助理香 港總監／區總監／總幹事負責。如提名人為區總監，須經由地域總監加簽認許。 \n\n   - 1.2 提名錶格上需詳列被提名人對童軍運動之良好服務及建樹，但毋需在提名錶上說 明擬推薦之獎勵。 \n\n   - 1.3 被提名人必須為持有有效委任書（暫許委任書除外）的制服成員或有效委任證的 會務委員。 \n\n2. 感謝狀 \n\n   - 2.1 感謝狀須由香港總監／副香港總監／助理香港總監／區總監提名。如提名人為區 總監，須經由地域總監加簽認許。 \n\n   - 2.2 若提名感謝狀予已婚制服成員之配偶或未婚制服成員之家長，該制服成員必須已 獲取功績獎勵或長期服務獎章。 \n\n   - 2.3 若被提名者為未婚制服成員之家長／支持童軍運動或對童軍運動有貢獻的人士， 須列出具體理由。 \n\n   - 2.4 現役制服成員及會務委員均不能被提名獲取感謝狀。 \n\n如旅長希望提名童軍旅內任何人士獲取上述各項獎勵或感謝狀，必須先向其區總監推薦。 \n\n請使用最新版本的功績獎勵提名錶〔表格 DA1(04/2020)〕及感謝狀提名錶〔表格 DA2 (Rev.08/2022)〕，提名錶可於總會網頁 http://www.scout.org.hk 下載，或向各地域總部及總會行 政署索取。所有提名錶格必須於提名截止日期前經有關單位送達總幹事。所有提名必須保密， 並須符合「香港童軍總會政策、組織及規條」規條 6.8 之規定。 \n\n倘有查詢，請與所屬單位執行幹事聯絡。 \n\n香 港 總 監 （李思行 代行）\n","04_行政及領袖訓練/AiS202025_SAHKLibrary_C.md":"---\nsource_file: \"AiS202025_SAHKLibrary_C.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 **2025** 年 **8** 月 **1** 日 領袖資源署 第 **20/2025** 號通告 電話：2835 7736 傳真：3974 1092 電郵：ais@scout.org.hk [行政] \n\n# 香港童軍總會圖書館開放時間 \n\n本通告取代 _2022_ 年 _12_ 月 _1_ 日所發出之行政通告第 _32/2022_ 號。 \n\n香港童軍總會圖書館（圖書館）及研習室的開放時間如下： \n\n|設施|開放時間|\n|---|---|\n|香港童軍總會百週年紀念大樓<br>808室香港童軍總會圖書館及<br>809室研習室|星期一至日及公眾假期<br>上午10時至下午10時正|\n\n圖書館管理員將於逢星期三（公眾假期除外）下午 6 時 30 分至 9 時正當值， 為讀者提供協助及解答一般服務、館藏及設施的查詢，如有需要亦可電郵至 library@scouting.org.hk 進行查詢。如有興趣查閱圖書館館藏，可瀏覽圖書館的網 址： http://library.scout.org.hk 。 \n\n由 2025 年 4 月 1 日起，圖書館不會再發出實體借書證，而改為發出電子借 書證。欲借閱館藏，歡迎填寫電子表格辦理電子借書證。舊有實體借書證持有人， 亦歡迎填寫電子表格辦理續證手續。電子借書證申請及續證表格： https://forms.gle/tUp21KdepPVyyNUP9 。此外，圖書館的使用守則及借閱安排詳情 亦已張貼在圖書館內以備閱覽。 \n\n如有查詢，請與助理執行幹事（領袖資源）張麒璧小姐聯絡（電話：2835 7738 或電郵： aisase@scout.org.hk）。 \n\n助理香港總監（領袖資源） 何 世 孝\n","04_行政及領袖訓練/C_AdmCir_2025.md":"---\nsource_file: \"C_AdmCir_2025.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 \n\n**2025** 年 **12** 月 **1** 日 第 **29/2025** 號通告 [行政 ] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# **_2025_** 年週年註冊及統計 \n\n## **(** 一 **)** 週年童軍旅註冊 \n\n根據總會「政策、組織及規條」（POR）規條 2.2.3－「童軍旅週年註冊」， \n\n(a) 總會只認可註冊有效的旅為總會所屬單位。 \n\n- (b) 旅註冊的有效期乃由正式註冊日期開始至下年度 1月31日止。屆時須重辦旅 註冊。而在此之後，於每年的 1月31日或之前，該旅須重新註冊，遞交有關旅 更新註冊表格，並繳交該旅成員的成員費（規條 2.11.5）。區總監須確認該旅 符合POR內所列有關旅註冊的要求。 \n\n若任何童軍旅於2026年2月1日沒有在本會有效註冊，必須停止一切童軍活動。 \n\n## **(** 二 **)** 童軍單位人數及社會服務與訓練／活動統計 \n\n本會重視及提倡童軍成員參與社區服務，致力提供有進度性及富吸引力的訓練 及活動予青少年成員。成員人數、參與社會服務與童軍訓練／活動的情況是本會重 要的表現指標，各單位就此須填報相關資料，以便本會向民政及青年事務局呈報該 等數據。 \n\n## **(** 三 **)** 表格遞交詳情 \n\n各童軍單位須於 **2026** 年 **1** 月 **15** 日或之前 透 過電子申報系統 （https://service.scout.org.hk/e-census/index.asp）〔QR碼請參閱後頁左下方〕填報及提交以 下表格： \n\n|類<br>別|童軍旅|其他單位<br>＊|\n|---|---|---|\n|週年註冊及／或人數統計|表格GR|表格E|\n|社會服務與訓練／活動統計|表格|TA(e)|\n||（或於此表格上載已預|先填妥的電子檔案_†_）|\n\n> ＊ 其他單位指各區、地域、總會各署、屬會及附屬單位 \n\n**_†_** 電子檔案詳見行政署第 _08/2025_ 號通告 \n\n本會將郵寄有關登入資料（附件L）予各童軍旅。若旅長／負責領袖於 12月12日 仍未收到有關戶口及密碼，請與行政署職員聯絡。 \n\n請於填報前細閱「填報指引」（附件 GR）（童軍旅適用）及各表格內的「填表 須知」。\n\n<!-- p.2 -->\n單位亦可於系統下載表格，填妥後交回總會行政署（地址：九龍柯士甸道童軍徑 香港童軍中心10樓1012室／圖文傳真：2302 1001）。郵寄之信封面請註明「2025年週 年統計」。 \n\n倘有查詢，請與總會行政署或所屬地域聯絡： \n\n總會行政署 （電話：2957 6304） 東九龍地域總部 （電話：2957 6466） 港島地域總部 （電話：2574 4296） 新界地域總部 （電話：2425 5999） 九龍地域總部 （電話：2957 6488） 新界東地域總部 （電話：2667 9100） \n\n香 港 總 監 \n\n（盧 建 業 代 行） \n\n電子申報系統\n","04_行政及領袖訓練/P062-26.md":"---\nsource_file: \"P062-26.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **6** 月 **1** 日 第 **62/2026** 號通告 [行政] \n\n# 儀仗隊隊員招募 \n\n# **Recruitment of Ceremonial Team Member** \n\n本會儀仗隊於 2004 年成立，致力於本會及外界不同典禮儀式中擔任儀仗工作。儀仗 隊隊員透過恆常且有系統之傳統童軍步操及隊列訓練，積極參與「童軍大會操」、「五四 升旗禮」及各地域步操及隊列比賽頒獎典禮等活動，成功建立口碑及正面形象，並培養 隊員自信心、紀律、團體合作意識。儀仗隊現正進行全年招募，恆常訓練定於逢星期五 晚上在香港童軍中心及九龍公園進行，其他詳情臚列如下： \n\n- （一）參加資格： 1. 持有有效所屬支部童軍紀錄冊之童軍、深資童軍、樂行童軍支部 成員；或 \n\n2. 持有有效領袖委任書或教練員委任證之各級領袖。 \n\n（二）費  用： 全免 \n\n（三）參加辦法： 填妥網上報名錶格（QR 碼請參閱下方） \n\n【報名前，各支部成員應先取得所屬童軍旅領袖的同意，而未滿18 歲的支部成員需同時取得家長／監護人的同意，並於報名時上載有 關文件。】 \n\n（四）服 裝： 參加者必須穿著整齊童軍制服或由負責人指定的服裝出席 \n\n- （五）其  他： 1. 接納與否，均以電郵通知。 \n\n   2. 實際訓練日子，將於接納後通知。 \n\n（六）查 詢： 若於報名後兩個月仍未收到通知，請於辦公時間內致電 2957 6410 與 活動幹事陳雪芳女士聯絡。 \n\n青少年活動總監 （黃志樂 代行） \n\n網上報名錶格\n","04_行政及領袖訓練/P068-26.md":"---\nsource_file: \"P068-26.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **6** 月 **1** 日 第 **68/2026** 號通告 [行政 ] \n\n# 海上旅程審核員委任 \n\n# **Appointment of Sea Expedition Assessor** \n\n為配合深資童軍選擇海上旅程考取探險段章，青少年活動署誠邀有志於海上活動訓練工作 及符合資格的領袖為深資童軍處理 E-A007 / 8 / 9 及 E-B005 / 6 / 7 的海上旅程考驗。委任日期 由 2026 年 8 月 15 日至 2028 年 3 月 31 日，並由即日起接受申請。有興趣申請委任且符合資格 的領袖，請填妥表格 PT/51 後，連同有關證明文件副本，親身或寄交九龍柯士甸道童軍徑香港 童軍中心 9 樓青少年活動署。 \n\n獲委任之海上旅程審核員為總會指定之海上旅程訓練及評核者，並無分地域或區。如獲邀 請，彼等可以為該單位進行相關職責中的訓練或考驗。完成審核後，審核員在成員之紀錄冊／ 訓練班證書上簽署並寫上其編號，以資確認。倘海上旅程審核員的個人之領袖委任書、有關急 救課程證書或專業證書失效，其有關審核員委任資格亦告終止。 \n\n## 各類海上旅程審核員資歷及委任 \n\n### 海上旅程審核員委任資格 \n\n委任資格： \n\n1. 現任註冊高級童軍標準艇教練員1 \n\n### 海上旅程審核員 （ 獨木舟 ） 委任資格 \n\n委任資格： \n\n1. 現任註冊高級童軍標準艇教練員1 ；或 \n\n   - 完成海上旅程審核實務工作坊；及 \n\n2. 香港童軍總會註冊獨木舟教練員；及 \n\n3. 現任註冊香港獨木舟總會 2 級獨木舟教練或以上資歷。 \n\n### 海上旅程審核員（小風帆）委任資格 \n\n委任資格： \n\n1. 現任註冊高級童軍標準艇教練員1 ；或 \n\n   - 完成海上旅程審核實務工作坊；及 \n\n2. 香港童軍總會註冊風帆教練員；及 \n\n3. 現任註冊中國香港帆船運動總會日間航行帆船教練或以上資歷。\n\n<!-- p.2 -->\n### 職責： \n\n1. 為深資童軍提供有關海上旅程訓練2 ，使該等成員有所準備及能應付深資童軍支部內 海上旅程考驗及活動； \n\n2. 協助舉辦海上旅程相關訓練課程； \n\n3. 獲總會、地域或區邀請時，舉辦下列課程： 「海上旅程工作坊」或 「海上旅程度宿工作坊」；及 \n\n4. 獲總會、地域、區或旅邀請時，為下列項目擔任審核員／評核員： 深資童軍獎章及榮譽童軍獎章探險項目。 \n\n註1 ： 高級童軍標準艇教練員委任及續任資格，請參閱於 2025 年 3 月 1 日發出之青少年活 動署第 42/2025 號通告（QR 碼請參閱下方）。 \n\n註2 ： 海上旅程訓練泛指由總會、地域或區所舉辦之青少年成員海上活動旅程訓練課程。 \n\n本署將於本會網頁上載獲委任之審核員名單，各單位如欲邀請該等人士為成員進行訓練及 評核，可自行查閱相關名單。如有查詢，請於辦公時間致電2957 6411或2957 6417與青少年活動 署職員聯絡。 \n\n青少年活動總監 \n\n陳狄安 \n\n青少年活動署 第 42/2025 號通告\n","04_行政及領袖訓練/PC032025C_常務基本訓練班.md":"---\nsource_file: \"PC032025C_常務基本訓練班.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2025** 年 **4** 月 **1** 日 第 **03/2025** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 常務基本訓練班 \n\n本通告取代 _2018_ 年 _5_ 月 _15_ 日所發出之政策通告第 _26/2018_ 號。 \n\n「常務基本訓練班」為地域／區總監職級和區長職級人士被委任前的 必修班，此政策適用於上述人士的委任、續任或調職，請各有關領袖務必 遵守。 \n\n現將「常務基本訓練班」的參加資格詳列如下，而課程內容及班期請 參閱訓練通告： \n\n1. 現任、續任、調職及候任之地域／區各職級總監及區長；或 \n\n2. 持有領袖木章及三年童軍前線／常務工作經驗之現任、續任、調職及 候任地域／區幹部級領袖；或 \n\n3. 持有領袖基本訓練班（二）／支部訓練方法訓練班（單元 2A 及單元 2B）證書及三年童軍前線／常務工作經驗，並獲地域總監或區總監推 薦之各級領袖；或 \n\n4. 持有領袖木章及五年童軍前線工作經驗之各級領袖。 \n\n副香港總監（常務） 吳 家 亮\n","04_行政及領袖訓練/PC042025C_領袖的委任資格.md":"---\nsource_file: \"PC042025C_領袖的委任資格.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2025** 年 **4** 月 **1** 日 第 **04/2025** 號通告 [政策／指引] \n\n電話：2957 6333  傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 領袖的委任資格 \n\n本通告取代 _2018_ 年 _1_ 月 _1_ 日所發出之政策通告第 _18/2018_ 號。 \n\n根據現行的總會政策，領袖完成「基本訓練」可獲取有關的領袖委任資格 及佩帶基維爾巾圈。 \n\n本會現重申領袖在任何一個支部完成「基本訓練」，在轉調其他支部時均 可直接獲發領袖委任書。根據現時的領袖木章訓練系統，「基本訓練」的定義 是指完成支部領袖木章訓練系統中的第二階段「支部訓練方法」或行政人員木 章訓練系統中的第四階段「基本在職訓練」。持有該訓練階段證書或相同資格 的領袖，皆可獲得同樣的權利。 \n\n如對本通告有任何疑問，請向行政執行幹事查詢（電話： 2957 6334）。 \n\n香 港 總 監 （盧建業 代行）\n","04_行政及領袖訓練/PC052025C_申請領袖／總監委任之必修課程.md":"---\nsource_file: \"PC052025C_申請領袖／總監委任之必修課程.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 電話：2957 6333  傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2025** 年 **4** 月 **1** 日 第 **05/2025** 號通告 [政策／指引] \n\n# 申請領袖／總監委任之必修課程 \n\n本通告取代 _2021_ 年 _10_ 月 _15_ 日所發出之政策通告第 _03/2021_ 號。 \n\n由 2025 年 4 月 1 日起，所有申請參加童軍運動的新領袖／總監必須首先完 成「領袖初級訓練班」／「童軍運動基本原則訓練班（單元 1A 及單元 1B ）」 及「【保護童軍成員免受傷害】網上自學課程」，從而對童軍運動之目的、系 統及訓練方法及本會保護童軍成員免受傷害之政策有基本認識，方可獲本會委 任。 \n\n而現任領袖／總監亦須盡快完成【保護童軍成員免受傷害】網上自學課程 並取得訓練證書。 \n\n委任提名錶［表格A01(Rev.04/2025)］將於同日生效。首次被提名的人士 於提交表格時須夾附「領袖初級訓練班」／「童軍運動基本原則訓練班（單元 1A 及單元 1B ）」及「【保護童軍成員免受傷害】網上自學課程」訓練證書副 本，以茲證明。 \n\n有關「童軍運動基本原則訓練班（單元 1A 及單元 1B ）」及「【保護童軍 成員免受傷害】網上自學課程」的資料，請參閱相關訓練通告。 \n\n<!-- Start of picture text -->\n香 港 總 監<br>（盧建業 代行）<br><!-- End of picture text -->\n","04_行政及領袖訓練/PCR_2024_1_Chi.md":"---\nsource_file: \"PCR_2024_1_Chi.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2024** 年 **1** 月 **1** 日 第 **01/2024** 號通告 [政策 ] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 持續進修政策 \n\n本通告取代 _2018_ 年 _1_ 月 _15_ 日所發出的第 _25/2018_ 號政策通告，公佈持續進 修政策，以提示本會制服成年領袖（包括各級總監、領袖）在完成「木章」訓練 後，應持續進修。 \n\n`本會是一個培訓和教育青少年的機構，我們致力設立優質訓練課程，培訓成 年領袖帶領和啟導青少年。「木章」是童軍領袖訓練標誌，顯示佩帶者接受過正式 和嚴格的童軍領袖訓練，是一位稱職的童軍領袖。我們期望成年領袖完成「木章」 訓練後，秉持不斷學習的態度，與時並進，` 進一步 `提升知識、技能、管理及領導才 等方面的素質，以促進個人成長，幫助青少年成員得到最佳的童軍歷程。` \n\n本會訓練署、青少年活動署、領袖資源署及各地域均為成年領袖設有不同種 類的進修訓練，成年領袖應積極參與，以配合執行職守時的需要。成年領袖亦可 考慮往海外進修及參與其他機構舉辦的課程，以擴闊視野。 \n\n會方委任及續任成人領袖時，會參考該名領袖的進修情況。 \n\n香 港 總 監 （盧沛霖          代行） \n\n參考連結如下： \n\n領袖持續進修 – 訓練班目的便覽： http://www.scout.org.hk/chi/others/leadertrg/ 領袖持續進修 – 本會刊物： http://www.scout.org.hk/chi/others/leaderbook/\n","04_行政及領袖訓練/T3125_Apr_C_Basic_Qualifications_for_the_Appointment_of_TTmembers.md":"---\nsource_file: \"T3125_Apr_C_Basic_Qualifications_for_the_Appointment_of_TTmembers.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 訓練署 \n\n**2025** 年 **4** 月 **1** 日 第 **31/2025** 號通告 [政策／指引] \n\n電話：2957 6477 傳真：2302 1001 電郵：trg@scout.org.hk \n\n# 香港訓練隊隊員的委任資格 \n\n本通告取代 _2024_ 年 _5_ 月 _1_ 日發出之訓練署第 _46/2024_ 號通告。 \n\n## **1.** 序言 \n\n香港訓練隊是由領袖訓練主任、助理領袖訓練主任及領袖訓練員所組成，由訓練總監領導， 負責策劃、組織及推行領袖訓練之工作。 \n\n香港訓練隊隊員之委任表示各隊員持守不同訓練職責及崗位，在領袖訓練事工發揮不同功 能，為領袖訓練作出貢獻。 \n\n## **2.** 原則 \n\n香港訓練隊隊員之培訓和委任，質素重於數量，其經驗、幹勁、潛力及知識水平是考慮其 能否勝任的重要因素。本會定期按領袖訓練的需要檢視隊員委任資格，提供客觀及高透明 度的方向及準則予隊員，以完善委任基制及傳承。 \n\n## **3.** 資格 \n\n## **3.1** 領袖訓練員 \n\n|年 齡|25 歲或以上|\n|---|---|\n|學 歷|- 大專畢業；或<br>- 香港中學會考5科合格／中學文憑考試5科達2級（均包括中、英文）；<br>或<br>- 中五程度加5 年的工作經驗。|\n|領袖經驗|持有有效委任書及擁有最近不少於連續4 年的領袖經驗。|\n|領袖訓練資歷|擁有不少於2 年訓練助務員經驗，現活躍於領袖訓練工作。|\n|訓練課程|完成訓練員基本訓練班（單元1、2 及3）。|\n|木 章|木章持有人|\n|訓練工作經驗|曾協助不少於4 個不同的木章訓練班及2 個領袖技能訓練班，並曾擔任<br>以下之崗位：<br><br>班務行政員<br><br>設備管理員<br><br>活動導師（必須帶領最少2次活動，每項活動應不少於30分鐘）<br><br>在童軍運動基本原則訓練班（單元1B）*／領袖技能訓練班擔任：<br>➢<br>導修員（必須擔任此崗位最少2次）<br>➢<br>課節講師（教授不少於3個不同的課節）<br>（透過上述活動及訓練的經驗證明其有能力履行領袖訓練員的職務）|\n|籌辦活動經驗|曾協助或舉辦不少於2 項由區／地域／總會所舉辦的大型活動。|\n|品格及<br>其他表現|- 肯承擔，富責任感，操守良好及願意肩負領袖訓練員之職務；<br>- 於訓練班中能勝任班務行政員、設備管理員、導修員及課節講師等職務；<br>- 另見第4 點。|\n\n* 或同類型訓練班： 領袖初級訓練班／基本訓練班／基本原則和領導才訓練班／ 基本原則訓練班／基本訓練班（一） \n\n第 1 頁\n\n<!-- p.2 -->\n## **3.2** 助理領袖訓練主任 \n\n|年 齡|30 歲或以上|\n|---|---|\n|學 歷|- 大專或大學畢業加3年的工作經驗；或<br>- 持有認可專業資格加3年的工作經驗；或<br>- 香港中學會考5科合格／中學文憑考試5科達2級（均包括中、英文）<br>加5 年的工作經驗。|\n|領袖訓練資歷|被提名出任助理領袖訓練主任前，最近3年連續執行領袖訓練員工作，<br>並達到領袖訓練人員基本服務要求的指標。|\n|訓練課程|完成助理領袖訓練主任訓練班或認可同等課程。|\n|訓練工作經驗|獲委任為領袖訓練員後，曾協助不少於12 個不同的木章訓練班及領袖<br>技能訓練班，並曾擔任以下之崗位：<br><br>班領導人（必須擔任此崗位最少3次）<br><br>副班領導人<br><br>助理班領導人<br><br>班務行政員<br><br>設備管理員<br><br>導修員（必須擔任此崗位最少3次）<br><br>課節講師（教授不少於5個不同的課節）<br><br>活動導師（必須帶領最少2次活動，每項活動應不少於30分鐘）<br>（透過上述活動及訓練的經驗證明其有能力履行助理領袖訓練主任的<br>職務）|\n|籌辦活動經驗|曾協助或舉辦不少於2 項由區／地域／總會所舉辦的大型活動。|\n|輔導員經驗|曾經擔任輔導員，協助最少3名領袖完成其在職輔導／木章事工計劃／<br>基本在職訓練／高級在職訓練。|\n|品格及<br>其他表現|- 肯承擔，富責任感，操守良好及願意肩負助理領袖訓練主任之職務；<br>- 除勝任領袖訓練員的工作外，也能勝任訓練班班領導人及訓練員培訓<br>的工作；<br>- 另見第4 點。|\n\n第 2 頁\n\n<!-- p.3 -->\n## **3.3** 領袖訓練主任 \n\n|年 齡|35 歲或以上|\n|---|---|\n|學 歷|-<br>大專或大學畢業加5年的工作經驗；或<br>-<br>持有認可專業資格加5 年的工作經驗。|\n|領袖訓練資歷|被提名出任領袖訓練主任前，最近3年連續執行助理領袖訓練主任工作，<br>並達到領袖訓練人員基本服務要求的指標。|\n|訓練課程|完成領袖訓練主任訓練班或認可同等課程。|\n|訓練工作經驗|獲委任為助理領袖訓練主任後，曾協助不少於15 個不同的木章訓練班<br>及領袖技能訓練班，並曾擔任以下之崗位：<br><br>班領導人（必須擔任此崗位最少5次）<br><br>副班領導人<br><br>助理班領導人<br><br>導修員（必須擔任此崗位最少5次）<br><br>課節講師（教授不少於10個不同的課節）<br><br>活動導師（必須帶領最少2次活動，每項活動應不少於30分鐘）<br>（透過上述活動及訓練的經驗證明其有能力履行領袖訓練主任的職務）|\n|籌辦活動經驗|曾協助或舉辦不少於5 項由區／地域／總會所舉辦的大型活動。|\n|輔導員經驗|曾經擔任輔導員，協助最少3名領袖完成其木章事工計劃／高級在職訓<br>練。|\n|海外活動經驗|曾參與最少2 次海外的童軍訓練或活動。|\n|品格及<br>其他表現|- 肯承擔，富責任感，操守良好及願意肩負領袖訓練主任之職務；<br>- 除勝任助理領袖訓練主任的工作外，也能對訓練工作及課程等，作出<br>批判、創新及發展之建議；<br>- 另見第4 點。|\n\n## **4.** 舉薦及委任面談 \n\n被提名人會獲邀請出席委任面談以確定其適合出任相關職位，及分享已獲相關單位之負 責總監同意的工作計劃項目。 \n\n## **5.** 推薦及委任 \n\n各級訓練隊隊員由相關訓練單位之負責總監舉薦，經訓練總監審核及委任面談確認後， 轉呈香港總監委任；或由訓練總監自行物色及呈交香港總監委任。 \n\n## **6.** 申請委任表格 \n\n「訓練隊隊員／訓練助務員舉薦書」（表格 PT/13）適用於各級訓練隊隊員之委任。 \n\n## **7.** 委任書 \n\n7.1 領袖訓練員將獲頒領袖委任書。 \n\n7.2 助理領袖訓練主任及領袖訓練主任將獲頒總監委任書。 \n\n訓 練 總 監 黃 騰 達 \n\n第 3 頁\n","04_行政及領袖訓練/T525_Feb_C_Wood-Badge-Training-Scheme.md":"---\nsource_file: \"T525_Feb_C_Wood-Badge-Training-Scheme.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 8\npages_ocr: 2\nocr_avg_score: 0.965\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 訓練署 電話：2957 6477  傳真：2302 1001 電郵：trg@scout.org.hk \n\n**2025** 年 **2** 月 **1** 日 第 **5/2025** 號通告 [政策／指引] \n\n# 木章訓練系統 \n\n本通告取代 _2018_ 年 _4_ 月 _1_ 日發出之訓練通告第 _16/2018_ 號。 \n\n木章訓練系統是一套培訓成年人成為優秀童軍領袖的訓練系統，不斷按時代轉變而 改進，以配合童軍運動的發展。現行木章訓練系統自 2018 年開始沿用至今，隨著時間轉 變，無論在內容、施訓方式和運作上均有改進的需要。訓練署於 2022 年下旬開始檢視現 行的木章訓練系統並按世界童軍組織的新木章架構作出修訂。 \n\n新修訂之支部領袖木章訓練系統將於 2025 年 4 月 1 日推出，而行政人員木章訓練系 統則暫時保留。修訂後的支部領袖木章訓練系統將包括網上課程【單元 1A】、【單元 2A】，讓領袖因應個人時間和進度完成；而面授課程【單元 1B】、【單元 2B】和【單元 3】則讓領袖親身參與體驗，保持童軍從做中學習的傳統。另外，【在職輔導】亦可於報 讀訓練班期間同步展開，以達至更靈活和高效率，期望領袖可於一年內獲頒木章。 \n\n重點臚列如下： \n\n1. 修訂支部領袖木章訓練系統，由現時六個階段改為三個階段，請參閱附件 （一）： \n\n   - a) 第 1 階段為【童軍運動基本原則】，完成訓練的參加者可符合「暫許領袖委任 書」的部份要求； \n\n   - b) 第 2 階段為【支部訓練方法】，完成訓練的參加者可佩戴基維爾巾圈，並可被 提名領取「領袖委任書」； \n\n   - c) 第 3 階段為【領導及管理】，完成訓練的參加者將獲推薦頒發木章。 \n\n2. 以新修訂的木章訓練班取代現有木章訓練班： \n\n   - a) 【童軍運動基本原則訓練班（單元 1A 及單元 1B）】取代【領袖初級訓練班】； \n\n   - b) 【支部訓練方法訓練班（單元 2A 及單元 2B）】取代【領袖基本訓練班（一）】 及【領袖基本訓練班（二）】； \n\n   - c) 【領導及管理訓練班（單元 3）】取代【領袖高級訓練班】。 \n\n3. 修訂木章訓練班主要內容： \n\n   - a) 【童軍運動基本原則訓練班（單元 1A 及單元 1B）】介紹童軍運動予各界人 士，讓參加者對童軍運動有所認識； \n\n第 1 頁\n\n<!-- p.2 -->\n- b) 【支部訓練方法訓練班（單元 2A 及單元 2B）】著重操作與體驗，以裝備領袖 帶領團集會及訓練活動； \n\n   - c) 【領導及管理訓練班（單元 3）】著重領導才能及管理技巧的理論與實踐，協助 提升領袖策劃及管理團務的能力。 \n\n4. 推出跨支部共通課程： \n\n   - 第 3 階段【領導及管理訓練班（單元 3）】為跨支部的共通課程，不同支部的領袖 將報讀同一訓練班。 \n\n5. 修訂現有木章「在職訓練」： \n\n   - a) 以第 2 階段【在職輔導】取代現有的【基本在職訓練】； \n\n   - b) 以第 3 階段【木章事工計劃】取代現有的【高級在職訓練】。 \n\n6. 修訂領袖技能訓練班之編排： \n\n   - a) 取代現有「核心」和「選修」領袖技能訓練班之編排，重新編排為「基礎」及 「進階／選修」類別； \n\n   - b) 領袖須完成一個與所屬支部相關的「基礎」領袖技能訓練班，方可完成第 2 階 段訓練（可佩戴基維爾巾圈，並可被提名領取「領袖委任書」）； \n\n   - c) 領袖須完成另一個與所屬支部相關的「基礎」或「進階／選修」技能訓練班， 方可完成第 3 階段訓練（可獲推薦頒發木章）。 \n\n7. 暫時保留行政人員木章訓練系統： \n\n   - 本修訂並不適用於行政人員木章訓練。除以【童軍運動基本原則訓練班（單元 1A 及單元 1B）】取代【領袖初級訓練班】外，行政人員木章訓練系統內其他階 段的訓練安排維持不變，參加對象為本會各會務委員，詳情請參閱附件（二）。 而旅長及專業領袖仍可選擇以「支部領袖木章訓練」或「行政人員木章訓練」其 中一個木章訓練系統完成木章訓練。 \n\n以下為推行修訂支部領袖木章訓練系統的其他資料，包括訓練內容、木章持有人參 加新木章訓練系統的安排、生效日期及新舊系統之過渡安排。 \n\n## （一）訓練系統及內容 \n\n訓練系統分為三個階段，流程請參閱附件（一）。各階段的學習重點和範圍均配合世 界童軍組織所提議的架構和訓練理念。以下為木章訓練系統的進程、內容和所需時數： \n\n## 第 **1** 階段 — 【童軍運動基本原則】 \n\n第 1 階段包括【童軍運動基本原則訓練班（單元 1A 及單元 1B）】，完成此階段訓練，可 符合「暫許領袖委任書」的部份要求。 \n\n第 2 頁\n\n<!-- p.3 -->\n## 童軍運動基本原則訓練班（單元 1A）（約 7 小時） \n\n本單元以網上自學形式進行，為對童軍運動有興趣的人士及晉身童軍運動的新領袖，提 供童軍運動基本知識和概念（包括童軍的歷史和發展，童軍運動的基本要素、訓練活動 及政策）的理論及資訊。 \n\n## 童軍運動基本原則訓練班（單元 1B）（約 4 小時） \n\n本單元以面授形式進行，為對童軍運動有興趣的人士及晉身童軍運動的新領袖，提供體 驗不同支部活動特色、童軍紀律和禮儀的機會。 \n\n## 第 **2** 階段 — 【支部訓練方法】 \n\n第 2 階段包括【支部訓練方法訓練班（單元 2A 及單元 2B）】、【在職輔導】及【基礎技能 訓練班】，在完成此階段訓練後，可佩戴基維爾巾圈，並可被提名領取「領袖委任書」。 \n\n## 支部訓練方法訓練班（單元 2A）（約 7 小時） \n\n本單元以網上自學形式進行，旨在協助參加者初步理解所屬支部青少年成員的需要、施 訓方式及訓練方法。 \n\n## 支部訓練方法訓練班（單元 2B）（約 40 小時） \n\n本單元以面授形式進行，以體驗活動為主，旨在協助參加者進一步理解所屬支部的施訓 方式、訓練方法及常用技能，從而應用於實際團集會及團務運作，有效地領導或協助團 員參與團集會及活動。 \n\n## 在職輔導（不少於 4 個月） \n\n在完成【支部訓練方法訓練班（單元 2A）】後，參加者可申請開展【在職輔導】，在所屬 童軍單位接受為期不少於 4 個月的在職輔導。在輔導員的協助下，學習實踐團集會及活 動和團務運作。【在職輔導】必須在完成【支部訓練方法訓練班（單元 2B）】後方可結 束。 \n\n## 基礎技能訓練班 \n\n必須完成一個與所屬支部相關的「基礎」領袖技能訓練班，訓練班名單請參閱附件 （三）。 \n\n## 第 **3** 階段 — 【領導及管理】 \n\n第 3 階段包括【領導及管理訓練班（單元 3）】、【木章事工計劃】及【基礎／進階／選修 技能訓練班】，在完成此階段訓練後，參加者可獲推薦頒發木章。 \n\n第 3 頁\n\n<!-- p.4 -->\n## 領導及管理訓練班（單元 3）（約 48 小時） \n\n本單元以混合形式（網上自學及面授）進行，以實務及體驗活動為主，因應支部的特色 及訓練方法，為參加者提供團務行政、領導及管理方面的培訓，使其具備一定的知識及 技巧以領導團務發展。本訓練單元旨在加強及深化參加者對童軍運動原則和方法的反思 及掌握，並給予機會，讓他們與其他領袖共同探討領導旅團的有效方法。 \n\n## 木章事工計劃（不少於 4 個月） \n\n在輔導員的指導下，參加者將運用在各單元所學習到的領導及管理技巧去完成一項自訂事工， 從而深化參加者對童軍運動理念的理解，並強化策劃及執行事工的能力。 \n\n## 基礎或進階／選修技能訓練班 \n\n必須完成一個與所屬支部相關的「基礎」或「進階／選修」領袖技能訓練班，請參閱附 件（三）。 \n\n## 持續進修 \n\n持有木章的成年成員應持續不斷地參與各項進修課程，以保持其知識和技能與時並進，配合社 會和童軍運動向前發展，協助青少年成員成長。 \n\n## （二）木章持有人參加新木章訓練系統的安排 \n\n本會鼓勵木章持有人於轉換童軍職務時，參加與新任職務相關的支部的木章訓練。 因應新木章訓練系統的第 1 階段及第 3 階段為共通單元，木章持有人在參加其他支部的 木章訓練時，只需完成相關支部的【支部訓練方法訓練班（單元 2A 及單元 2B）】和【在 職輔導】，並完成兩個相關支部的領袖技能訓練班（其中一個必須為「基礎」領袖技能訓 練班），便等同完成相關支部的木章訓練。至於現行的木章頒授政策則維持不變，即使完 成多於一個支部的木章訓練，亦只獲頒授一對木章。 \n\n## （三）生效日期 \n\n經修訂的木章訓練系統將於 2025 年 4 月 1 日起開始執行。 \n\n## （四）新舊系統過渡安排 \n\n領袖可因應現已完成的木章訓練系統階段，繼續參加新木章訓練系統的相應訓練班 \n\n及在職訓練： \n\n|現 行 階 段|過 渡 安 排|\n|---|---|\n|1. 已完成|等同完成新木章訓練系統「第1 階段」，可參加「第|\n|【領袖初級訓練班】|2 階段」【支部訓練方法訓練班（單元2A）】|\n|2. 已完成|等同完成新木章訓練系統「第2 階段」【支部訓練方|\n|【領袖基本訓練班（一）】|法訓練班（單元2A）】，可參加【支部訓練方法訓練|\n||班（單元2B）】，並可開展【在職輔導】|\n\n第 4 頁\n\n<!-- p.5 -->\n|現 行 階 段|過 渡 安 排|\n|---|---|\n|3. 已完成<br>【領袖基本訓練班（二）】|等同完成新木章訓練系統「第2 階段」【支部訓練方<br>法訓練班（單元2A及單元2B）】並可開展【在職輔<br>導】|\n|4. 已完成<br>【基本在職訓練】及一個新系統<br>下與所屬支部相關的 「基礎」領<br>袖技能訓練班|等同完成新木章訓練系統「第2 階段」，可參加「第<br>3 階段」【領導及管理訓練班（單元3）】|\n|5. 已完成<br>【領袖高級訓練班】|等同完成新木章訓練系統「第3 階段」【領導及管理<br>訓練班（單元3）】，可開展【木章事工計劃】|\n|6. 已完成<br>【領袖高級在職訓練】|等同完成新木章訓練系統「第3 階段」【木章事工<br>計劃】|\n\n如對上述政策有任何查詢，請致電 2957 6477 與訓練署職員聯絡。 \n\n訓 練 總 監 黃 騰 達 \n\n第 5 頁\n\n<!-- p.6 ocr -->\n訓練署第 **5/2025** 號通告 附件（一） \n\n第 6 頁\n\n訓署第5/2025號通告附件（一)\n\n2025年4月1日生效 | 支部領袖木章課程\n\nEffective on\n\n1 April 2025 | SectionalLeaderWoodBadgeCourses\n\n木章訓系統 WoodBadgeFramework\n\n網上\n\n童軍運動基本原則訓班（單元1A）# | Online\n| --- | --- |\n第一隋段 | FundamentalsofScoutingCourse(Module1A)#\n\nStage1 面授\n\n童軍運動基本原則訓班（單元1B）# | Face-to-face\n\nFundamentalsofScoutingCourse(Module1B)#\n\n可符合「暫許領袖委任書」的部份要求 Satisfypartialrequirementsfortheapplicationof aProvisionalScouterWarrant\n\n網上\n\n支部訓方法訓班 | Online\n| --- | --- | --- |\n第二隋段 | （單元2A）\nStage2 | Sectional TrainingMet 定；惟受委人士須符合下 列資歷，若有任何改動，必須得到訓練總監同意方可。 \n\n領袖訓練班班領導人之資歷： \n\n|訓練班名稱|班領導人之資歷|\n|---|---|\n|童軍運動基本原則訓練班<br>（單元1B）|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，須曾任領袖初級訓練班／童軍運<br>動基本原則訓練班（單元1B）之副班領導人<br>／助理班領導人|\n|行政人員基本訓練班（一）|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，須曾任行政人員基本訓練班（一）<br>之副班領導人／助理班領導人|\n|支部訓練方法訓練班<br>（單元2B）<br>行政人員基本訓練班（二）<br>見習領袖訓練班<br>常務基本訓練班|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任|\n|領導及管理訓練班（單元3）<br>行政人員高級訓練班|1. 領袖訓練主任|\n|領袖技能訓練班|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，並曾任相同的領袖技能訓練班之<br>副班領導人／助理班領導人；或<br>4. 擁有認可資格而獲訓練總監批准的人士|\n|領袖訓練員訓練班|1. 領袖訓練主任；或<br>2. 擁有認可資格而獲訓練總監批准的人士|\n\n第 1 頁\n\n<!-- p.2 -->\n## 副班領導人、助理班領導人之資歷如下： \n\n|訓練班名稱|副班領導人、助理班領導人之資歷|\n|---|---|\n|童軍運動基本原則訓練班<br>（單元1B）<br>行政人員基本訓練班（一）|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員|\n|支部訓練方法訓練班<br>（單元2B）|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，須符合下列任何一項：<br>a)曾任相同支部的基本訓練班（一）／童軍運<br>動基本原則訓練班（單元1B）之班領導人；<br>或<br>b)曾任相同支部的基本訓練班（二）／支部訓<br>練方法訓練班（單元2B）之助理班領導人／<br>導修員；或<br>c)曾任相同支部的高級訓練班／領導及管理訓<br>練班（單元3）導修員|\n|行政人員基本訓練班（二）|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，須符合下列任何一項：<br>a)曾任行政人員基本訓練班（一）之班領導人；<br>或<br>b)曾任行政人員基本訓練班（二）之助理班領<br>導人／導修員；或<br>c)曾任行政人員高級訓練班導修員|\n|見習領袖訓練班<br>常務基本訓練班|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員，須符合下列任何一項：<br>a)曾任基本訓練班（一）／童軍運動基本原則訓<br>練班（單元1B）之班領導人；或<br>b)曾任基本訓練班（二）／支部訓練方法訓練<br>班（單元2B）之助理班領導人／導修員；或<br>c)曾任高級訓練班／領導及管理訓練班（單元3）<br>導修員|\n|領導及管理訓練班<br>（單元3）<br>行政人員高級訓練班|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任|\n|領袖技能訓練班<br>領袖訓練員訓練班|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員；或<br>4. 擁有認可資格而獲訓練總監批准的人士<br>1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 擁有認可資格而獲訓練總監批准的人士|\n\n第 2 頁\n\n<!-- p.3 -->\n## 其他班職員之資歷如下： \n\n|職位|資歷|\n|---|---|\n|導修員|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員；或<br>4. 已完成訓練員基本班單元三之訓練助務員；或<br>5. 擁有認可資格而獲訓練總監批准的人士|\n|班務行政員<br>設備管理員|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員；或<br>4. 訓練助務員；或<br>5. 由班領導人推薦之人士；或<br>6. 專科訓練員|\n|課節講師<br>活動導師|1. 領袖訓練主任；或<br>2. 助理領袖訓練主任；或<br>3. 領袖訓練員；或<br>4. 經班領導人推薦，並對相關講題／活動有豐富<br>經驗的人士；或|\n|班助理|5. 專科訓練員；或<br>6. 已完成訓練員基本班單元二之訓練助務員*<br>_*_只適用於課節講師|\n\n訓練總監 黃騰達 \n\n第 3 頁\n","04_行政及領袖訓練/T725_Feb_C_List_and_Numbering_System_for_Certificates_of_Leader_Training_Courses.md":"---\nsource_file: \"T725_Feb_C_List_and_Numbering_System_for_Certificates_of_Leader_Training_Courses.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 5\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 訓練署 電話：2957 6477 傳真：2302 1001 電郵：trg@scout.org.hk \n\n**2025** 年 **2** 月 **1** 日 第 **7/2025** 號通告 [政策／指引] \n\n# 領袖訓練班及活動 名單及證書編號 \n\n本通告取代 _2024_ 年 _6_ 月 _1_ 日發出之訓練署第 _47/2024_ 號通告。 \n\n## **1.** 證書編號編排方法如下： \n\n|（A）|（B）|（C）|（D）|（E）|\n|---|---|---|---|---|\n|訓練班／活動|主辦單位|屆別|領袖木章訓練班|學員|\n|編碼|編碼||編碼|編號|\n\n- (A) 訓練班／活動編碼 \n\n訓練班／活動之名單及編碼，見【表 1】。 \n\n- (B) 主辦單位編碼 \n\n主辦單位編碼，見【表 2】。 \n\n- (C) 屆別 \n\n屆別由總會訓練署編訂，以表示該訓練班舉行之次序。 \n\n- (D) 領袖木章訓練班編碼 \n\n編碼以學員參加所屬支部／行政人員的訓練班編訂，見【表 3】。 \n\n- (E) 學員編號 \n\n學員於完成某一訓練班／活動，表現令人滿意，將給予一編號。編號以 數目字代表，次序由班領導人決定，以資識別。 \n\n- 例（ 1）： 證書簽發予新界東地域所舉辦之第 1 屆童軍支部訓練方法訓練 班（單元 2B）之第 4名學員，其證書編號將為「 W2B/D/1/SC/04」。 \n\n- 例（ 2）： 證書簽發予港島地域所舉辦之第 10 屆行動主導領導才訓練班之 第 15名學員，其證書編號將為「 SAC/H/10/15」。 \n\n## **2.** 證書簽發日期 \n\n證書簽發日期是訓練班／活動之最後一天或完成訓練班／活動各項指定作 業之日期（兩者以後者為準）。 \n\n訓練總監 黃騰達 \n\n第1頁\n\n<!-- p.2 -->\n# 【表 **1 Table 1** 】 訓練班／活動名單及編碼 **Course / Activity List with Code** \n\n# 【 **1.1** 】 領袖木章訓練班 **Wood Badge Course** \n\n# 【 **1.1a** 】 支部領袖木章訓練班 **Sectional Leader Wood Badge Course** \n\n|編碼<br>Code|中文|English|\n|---|---|---|\n|W1A|童軍運動基本原則訓練班（單元1A）|Fundamentals of Scouting Course<br>(Module 1A)|\n|W1B|童軍運動基本原則訓練班（單元1B）|Fundamentals of Scouting Course<br>(Module 1B)|\n|W2A|支部訓練方法訓練班（單元2A）|Sectional Training Methods Course<br>(Module 2A)|\n|W2B|支部訓練方法訓練班（單元2B）|Sectional Training Methods Course<br>(Module 2B)|\n|WB3|領導及管理訓練班（單元3）|Leadership and Management Course<br>(Module 3)|\n\n# 【 **1.1b** 】 行政人員木章訓練班 **Administrator Wood Badge Course** \n\n|編碼<br>Code|中文|English|\n|---|---|---|\n|WB1|基本訓練班（一）|Basic Course (I)|\n|WB2|基本訓練班（二）|Basic Course (II)|\n|WAD|高級訓練班|Advanced Course|\n\n# 【 **1.2** 】 見習領袖訓練班及常務基本訓練班 **Cadet Training Co .5 -->\n# 【表 **2 Table 2** 】 主辦單位編碼 **Organising Unit’s Code** \n\n|編碼<br>Code|中文|English|\n|---|---|---|\n|A|總會總部|Association Headquarters|\n|H|港島地域|HongKongIsland Region|\n|K|九龍地域|Kowloon Region|\n|E|東九龍地域|East Kowloon Region|\n|N|新界地域|New Territories Region|\n|D|新界東地域|New Territories East Region|\n\n# 【表 **3 Table 3** 】 領袖木章訓練班編碼 **Wood Badge Course Code** \n\n|編碼<br>Code|中文|English|\n|---|---|---|\n|GS|小童軍|Grasshopper Scout|\n|CS|幼童軍|Cub Scout|\n|SC|童軍|Scout|\n|VS|深資童軍|Venture Scout|\n|RS|樂行童軍|Rover Scout|\n|AD|行政人員|Administrator|\n\n第5頁\n","04_行政及領袖訓練/pc022025_童軍服務指引.md":"---\nsource_file: \"pc022025_童軍服務指引.pdf\"\nsource_category: \"04_行政及領袖訓練\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2025** 年 **3** 月 **1** 日 第 **02/2025** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 童軍服務指引 \n\n本通告取代 _2021_ 年 _12_ 月 _15_ 日所發出之政策通告第 _06/2021_ 號。 \n\n童軍單位經常會舉辦或收到外界邀請派遣童軍服務，為社區作貢獻。童軍服務 給予童軍成員一個貢獻社會之機會，以身體力行來體驗作為良好公民之重要責任， 履行童軍誓詞「對別人 要幫助」的承諾。除主動舉辦不同類型的服務外，各單位 可接受外界團體派遣童軍服務邀請及應童軍旅主辦機構要求派出童軍服務。以下童 軍服務指引，供各單位舉辦服務或安排童軍參與派遣服務時參照，但不適用於專業 及特別服務，如急救、陸上和水中搜救及拯溺等。如有任何疑問，請與所屬單位總 監商議。 \n\n### **1.** 服務範圍 \n\n- 1.1 服務應以能夠發揮童軍助人精神為主； \n\n- 1.2 服務不應有危險性，或在不安全的地點進行； \n\n- 1.3 不可參與任何政治活動； \n\n- 1.4 不可直接參與或以協辦形式參與外界團體籌款活動，如賣旗及售賣獎券 等，以免引起誤會，但可協助該籌款活動的其他工作； \n\n- 1.5 應事先規劃及瞭解服務內容，量力而為，不可過度承諾，如有需要，應事 先作充足的準備及／或安排合適的訓練予參與服務的童軍成員； \n\n- 1.6 接受外界團體邀請派遣童軍服務，服務以不影響本會及成員之形象為原則 及需有真正意義，避免派遣童軍作為「裝飾品」，亦不得擔任處理金錢之工 作。 \n\n### **2.** 服務對象 \n\n- 2.1 服務對象可包括︰有需要幫助的人士、童軍旅主辦機構或邀請童軍提供服 務的外界團體例如政府機構、法定機構、非牟利機構、舉辦非牟利慈善活 動之商業機構、其他舉辦非政治性活動之團體；商業機構之商品或服務必 須不損童軍形象，而團體亦必須為非政治團體； \n\n- 2.2 本會並不接受個人派遣童軍服務邀請； \n\n- 2.3 任何成員不能以個人名義舉辦童軍服務或接受外界團體邀請派遣童軍服 務，須以總會、地域、區或旅名義向外界團體提供服務； \n\n- 2.4 所有童軍旅於接納外界團體服務邀請前需先獲得區總監的同意。 \n\n### **3.** 服務時間 \n\n- 3.1 一般情況下，童軍成員的每日出勤時間不應逾 8 小時，及須於晚上 10 時前 結束；如服務在深夜或清晨時分進行，須加強配套與支援； \n\n- 3.2 長時間服務需有足夠人手替換，期間須安排用膳及休息時間； \n\n- 3.3 如需連續多日服務，童軍單位應考慮是否有能力應付及是否需要其他單位 協助。 \n\n1/2\n\n<!-- p.2 -->\n### **4.** 服裝 \n\n- 4.1 童軍參與服務時，需穿著整齊及合適之制服或有童軍元素的合適服裝； 4.2 如遇外界團體要求／提供大會服裝予參與服務的童軍穿著及／或佩戴，帶 隊領袖需安排服務童軍佩戴具童軍元素而又適合服務環境的配件，例如童 軍領巾等，以保持良好形象。 \n\n### **5.** 其他注意事項 \n\n- 5.1 童軍單位策劃和舉辦童軍服務時須恪守「保護童軍成員免受傷害」政策和 「行為守則」；如有支持童軍活動的外界團體持份者參與，活動負責人需讓 他們事先了解相關知識和要求，並回覆確認明白有關文件及資料的所有內 容； \n\n- 5.2 未滿 18 歲參加服務之童軍必須事先獲得家長／監護人同意； \n\n- 5.3 小童軍和幼童軍只可協助簡單的服務工作，例如在學校內之活動； \n\n- 5.4 所有出勤服務人員，必須為童軍成員，成員的家長可一同參與，帶隊領袖 須要備有出勤人員的紀錄； \n\n- 5.5 童軍在參與服務時，必須由持有有效委任書的領袖（即總監、領袖及教練 員）帶領，一名領袖不宜帶領超過 20 名青少年成員參與服務； \n\n- 5.6 在進行服務時，必須同時留意其他相關指引所載之措施處理，如「惡劣天 氣及空氣污染應變措施」。如遇意外，需按「童軍活動的意外通報指引」 處理； \n\n- 5.7 如在遙遠地點服務或在晚上才解散童軍，應有適當交通安排，及照顧童軍 成員之安全； \n\n- 5.8 可以接受邀請童軍提供服務的外界團體就服務提供之膳食、飲用水、交通 安排、紀念品及資助； \n\n- 5.9 直接與邀請童軍提供服務的外界團體聯絡及訂定一切細節，不應與第三者 例如其委託之公關公司聯絡。 \n\n## 副香港總監（常務） 吳 家 亮 \n\n2/2\n","05_資助計劃/DEV04-FFA_AppForm_Chi.md":"---\nsource_file: \"DEV04-FFA_AppForm_Chi.pdf\"\nsource_category: \"05_資助計劃\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\nDEV/04 (01/2024) \n\n申請編號：FFA/ \n\n/ \n\n(辨事處專用) \n\n# 香港童軍總會 童軍敬老基金 申請表 \n\n地域／總會部門： 區： 童軍旅： 活動負責人姓名： （** 先生／ 小姐／ 聯絡電話：（1） （2） 傳真： 電郵： 申請資助金額： \n\n區： 童軍旅： \n\n（** 先生／ 小姐／ 女士） 童軍職位： \n\n*請選擇適用者 \n\n## 甲、活動計劃簡介 \n\n一、 活動計劃名稱： \n\n- 二、 活動計劃目的： \n\n三、 活動計劃主題： \n\n四、 活動計劃形式： \n\n五、 服務對象： \n\n- 六、 參與人數： \n\n工作人員人數： \n\n計劃受惠長者人數： \n\n名青少年成員； 名領袖﹔其他（請註明）： \n\n名 \n\n計劃總受惠長者人次： 次（長者人數  x  服務次數） \n\n- 七、 活動時間表： 活動計劃舉行日期： \n\n|日期|地點<br>活動|\n|---|---|\n\n1\n\n<!-- p.2 -->\n乙、收支預算 \n\n|收 入<br>支 出||建議撥款金額|\n|---|---|---|\n|項目<br>金額<br>項目|金額|（此欄由評審組填寫）|\n|報名費<br>送給長者之禮物<br>(請填寫丙.支出項目明細)|||\n|其他資助 (請註明)|||\n|向長者提供之茶點<br>(請填寫丙.支出項目明細)|||\n|提供給長者之膳食|||\n|長者車資|||\n|童軍單位車資|||\n|人<br>童軍單位膳食<br>(超過四小時之服務適用)<br>(每名成員最多港幣55元)<br>HK$                 x|||\n|消耗性用品 (如清潔長者家居<br>的清潔用品)<br>(請填寫丙.支出項目明細)|||\n|其他<br>(請填寫丙.支出項目明細)|||\n|收入總額 (A):<br>支出總額 (B):|||\n|申請資助額 (B-A):|||\n|活動負責人簽署：<br>署／|地域／區總監／|旅長簽署：|\n|(姓名﹕<br>)<br>(姓名|﹕|)|\n|署／地域／區／童軍旅蓋章：|日期：||\n\n請將申請表正本親身或寄交九龍柯士甸道童軍徑香港童軍中心10樓香港童軍總會發展署。 \n\n所有申請資助的活動必須於通知審批結果日期後舉行，逾期遞交的申請將不獲受理。 申請 n## 乙部：申請人聲明書 \n\n本人已詳閱學生隊員制服資助計劃（由民政及青年事務局資助）（「此計劃」）申請指 引，並完全明白所有內容。本人謹此聲明： \n\n- (1) 本人明白及確認上述學生隊員現時並沒有接受由政府或其他機構提供與申請資助項 目相同的資助或支援服務。 \n\n- (2) 本人明白本人仍可申請由政府及其他機構所提供的資助／服務，以補足香港童軍總會 就申請資助項目所提供的資助。 \n\n- (3) 本人完全明白並同意香港童軍總會及民政及青年事務局就此計劃而向本人索取有關 資料。 \n\n- (4) 本人承諾提供正確資料及沒有隱瞞任何事項，絕不會錯誤引導香港童軍總會及民政及 青年事務局以圖獲得資助。 \n\n- (5) 本人接納及尊重香港童軍總會所訂立的評審準則，以及接受香港童軍總會的最後決 定。 \n\n申 請 人 簽 署 ： （18 歲以下之學生隊員須由其家長或監護人簽署） 姓名（正楷） ： 與學生隊員之關係 （ 如 適 用 ）： 聯 絡 電 話 ： 日 期 ：\n\n<!-- p.2 -->\n丙部：童軍旅推薦 【丙及丁部需由童軍旅填寫】 \n\n## 本童軍旅根據申請人申報及提供的資料，推薦上述申請及確信： \n\n（請在適當的 □ 內加  ） \n\n（請夾附學生隊員現獲得的政府資助證明文件副本） \n\n- (1) 學生隊員的家庭 □正領取綜合社會保障援助 \n\n   - □獲學生資助計劃全額津貼 □獲學生資助計劃半額津貼 \n\n   - □獲資助專上課程學生資助計劃 50%或以上批款 \n\n   - □獲全日制大專學生免入息審查貸款計劃 50%或以上批款 \n\n- (2) 學生隊員的家庭未獲上述資助，請填寫以下資料（如已填寫項目 _(1)_ ，則毋須填寫此部份）： 家庭全年總收入1 ：HK$_____________（須夾附全年入息證明文件） \n\n家庭成員總人數2 ：_________________人 （ □單親家庭） \n\n   - 1 家庭全年總收入包括申請人及其配偶的全年收入，與申請人家庭同住的未婚子女的全年收入的30%（如適 用），以及親友給予的津助（如適用）。 \n\n   - 2 家庭成員通常是指申請人、申請人的配偶、與申請人家庭同住的未婚子女，以及受申請人及其配偶同住及 供養的父母。如申請人屬單親家庭，請在人數旁註明。 \n\n- (3) 備註： □所屬童軍支部需穿著長褲 \n\n□其他，請說明： `_` \n\n## 丁部：童軍旅聯絡資料 \n\n旅 號 ： 旅 址 ： \n\n聯絡人姓名： 聯絡電話： \n\n電郵地址： \n\n- 簽 署 ： 姓 名 ： 職 位* ： 旅長／主辦機構負責人 \n\n<!-- Start of picture text -->\n（旅 印）<br><!-- End of picture text -->\n\n日 期 ： （ _*_ 請刪去不適用者） 回郵地址 \n\n聯絡人姓名： \n\n<!-- Start of picture text -->\n聯絡人姓名：<br><!-- End of picture text -->\n\n旅 號 ： 旅 址 ： \n\n<!-- Start of picture text -->\n旅 號 ：<br>旅 址 ：<br><!-- End of picture text -->\n","05_資助計劃/PT39.md":"---\nsource_file: \"PT39.pdf\"\nsource_category: \"05_資助計劃\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\nFORM PT/39 11/2021 \n\n# 香港童軍總會 **Scout Association of Hong Kong** 海外及內地活動津貼計劃申請表 \n\n# **Application Form for Overseas and Mainland Activities Subsidy Scheme (OMASS)** \n\n本計劃津貼現役支部成員及年青領袖參加海外或內地活動、服務或進行獎章考驗。 \n\nOMASS is open to active and serving Scout members and leaders to attend Overseas or Mainland Activities, Services or to proceed Award Assessment. \n\n請在適當□加上  號 Pleas ged between 12 and 30】 \n\n- 參加經所屬區總監批准前往海外或內地進行的獎章考驗（必須附上有關計劃書）【供現役 **_15_** 至 **_26_** 歲 深資童軍及樂行 童軍各支部成員申請】 To proceed Award Assessment overseas or in Mainland approved by respective District Commissioner【Please provide the project plan) (for active and serving Venture Scout and Rover Scout members aged between 15 and 26】 \n\n- 第 **5** 部 （只供有經濟需要的申請人填寫） **Part 5 (To be completed by applicant who have financial difficulties)** 本人現時獲得資助／家境情況： Current financial situation / financial assistance, if any, received by the applicant：  正接受綜援 Comprehensive Social Security Assistance  正接受學生資助辦事處的資助（需列明）Financial Assistance Schemes from Student Financial Assistance Agency (please specify)： \n\n- 經濟困難（需說明）Financial difficulties (please specify)： \n\n- 第 **6** 部 聲明書 **Part 6 Declaration** 申請人 **Applicant** 1. 本人謹此聲明，本申請表內填報的資料及有關文件均屬完整及真確。 I hereby declare that the information given in this Application Form and the supporting documents provided are true and correct. \n\n- 2. 本人明白及同意香港童軍總會有權在審理申請過程中或獲發津貼後全面審查本人的申請，包括要求提供有關證明文 件，以確認本人提供的資料完整及真確無誤。 I understand and agree that the Scout Association of Hong Kong has the right to conduct comprehensive checking in the course of processing of application or after the disbursement of subsidy, including requesting for relevant supporting documents, to verify that the information submitted by me is true, complete and accurate. \n\n- 簽署 Signature 日期 Date 家長／監護人（申請人為 **18** 歲以下適用） **Parent / Guardian (To be completed by applicant who aged under 18)** 簽署 Signature 姓名 Name 日期 Date 聯絡電話 Contact No. \n\n2/3\n\n<!-- p.3 -->\nFORM PT/39 11/2021 \n\n## 第 **7** 部 推薦 **Part 7 Recommendation** \n\n## 旅長／團長（申請人為青少年成員適用） \n\nGroup Scout Leader / Sectional Scout Leader (To be completed by applicant who is a youth member) \n\n本人已細閱並確認本申請表內填報的資料及有關文件均屬完整及真確，並推薦本旅成員＿＿＿＿＿＿＿＿申請上述津貼。 I have read and confirmed that the information given in this Application Form and the supporting documents provided are true and correct and I recommend to grant subsidy to our form will be used by the Association for dealing with the application for participating in this Subsidy Scheme and other related purposes.  The provision of personal data and other related information by means of this application form is voluntary.  However, we may not be able to process the application if no accurate or adequate data is provided. \n\n5. 在一般情況下，申請表將於審批完成後2年銷毀。 Application form will normally be destroyed 2 years after completion of the application examination. \n\n<!-- Start of picture text -->\n請用正楷填寫回郵地址 辦事處專用<br>Please fill in your name and correspondence address in BLOCK LETTERS  For Office Use Only<br>姓名 姓名<br>Name :  Name :  收表日期<br>地址 地址<br>Address  :  Address  :  經手人<br>備註<br><!-- End of picture text -->\n\n3/3\n","05_資助計劃/SSSF_2022C_form.md":"---\nsource_file: \"SSSF_2022C_form.pdf\"\nsource_category: \"05_資助計劃\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n(2022 年 12 月版) \n\n`（請在適當方格加上「`  `」號）` \n\n# `香港童軍總會 「孫秉樞童軍基金」申請表` \n\n(行政署填寫) 檔案編號： 收件日期： \n\n```\n甲部：申請人填寫\n```\n\n```\n（18 歲以下之童軍成員應由其家長或監護人作為申請人，而18 歲或以上之童軍成員則可自行提出申請。）\n```\n\n```\n童軍姓名：（中文）\n```\n\n```\n（英文）\n```\n\n`性別： 旅別： ／ ／ （地域） （區） （旅號） 所屬支部：`  `幼童軍`  `童軍`  `海童軍`  `空童軍`  `深資童軍`  `深資海童軍`  `深資空童軍`  `樂行童軍`  `樂行海童軍`  `樂行空童軍` \n\n```\n童軍成員編號：\n```\n\n```\n申請童軍現時獲得資助情況，並請夾附有關證明文件：\n```\n\n`□正接受綜合社會保障援助 □獲學生資助計劃全額資助 □獲學生資助計劃半額資助 □獲資助專上課程學生資助計劃` 50% `或以上批款 □獲全日制大專學生免入息審查貸款計劃` 50% `或以上批款` \n\n```\n如未獲上述資助者，請填寫以下資料：\n```\n\n`家庭全年總收入`1 `：` HK$ `（須夾附全年入息證明文件） 家庭成員總人數`2 `： 人` (  `單親家庭` ) \n\n- _1_ `家庭全年總收入：包括申請童軍之家長／監護人及其配偶的全年收入，與其家長／監護人家庭同住的未婚子女的 全年收入的` _30%_ `（如適用），以及親友給予的津助（如適用）。` \n\n- _2_ `家庭成員：通常是指申請童軍，以及申請童軍之家長／監護人、其配偶、其同住的未婚子女及同住並供養的父` `母。如申請童軍屬單親家庭，請在人數旁註明。` \n\n```\n特殊經濟困難情況：\n```\n\n`本人謹此聲明，本申請表內填報的資料及本人提交的證明文件，均屬完整及真確。本人完全明白並 同意此申請表內填報的個人及其他有關資料會供本會處理你申請「孫秉樞童軍基金」之有關用途。` 申請人簽署 ： 與童軍之關係 ： （如適用） 姓名（正楷） ： 聯絡電話 ： 日 期 ： \n\n## `乙部：所屬童軍旅旅長推薦` \n\n```\n本人□推薦／□不推薦上述申請。\n```\n\n```\n備註： □所屬童軍支部需穿著長褲\n```\n\n`□其他，請說明：` ___ 他有關的 資料，純屬自願。然而，如果沒有正確或足夠的資料，本會可能無法處理有關的申請。在一般情況下，申請表將於整個計劃完 結後` 6 `個月銷毀。` \n\n## `(六) 審批結果 (內部專用)` \n\n`審批結果： □ 批准撥款  金額：港幣` $ `______________ □ 不予撥款  原因：________________________________________________________ 備註：____________________________________________________________________` \n\n```\n資助計劃負責人簽署：\n```\n\n```\n資助計劃負責人姓名︰\n```\n\n```\n日    期：\n```\n","07_地域及屬會專用/02.md":"---\nsource_file: \"02.pdf\"\nsource_category: \"07_地域及屬會專用\"\nsource_format: \"pdf\"\npages: 2\npages_ocr: 2\nocr_avg_score: 0.928\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\nSCOUTASSOCIATION OF HONGKONG COMMISSIONERS'CLUB 香港童軍總會總俱樂部\n\n致各總俱樂部會員：\n\n使用已報失之俱樂部會員證事宜\n\n本俱樂部近日得悉有人於金陶軒使用已報失之俱樂部會員證。由於已報失之會員證已無效，報失的會員亦已獲發新證，使用已報失之會員證實達。\n\n本俱樂部現謹此聲明，如發現有人使用已報失之俱樂部會員證，將有以下安排：\n\n1）俱樂部職員或食肆承辦商職員即時收回已報失之俱樂部會員證；及\n\n2）該次之惠顧帳單必須收取加一服務費。\n\n如俱樂部發現會員蓄意使用或鑲親友使用已報失之會員證，將去信該名會員予以警告，重者可能考慮取消其會籍，敬請各會員注意。\n\n有關報失及補領會員證之程序及識別補領之會員證方法，請參閣附件 1。如有任何查詢，請致電29576455與俱樂部職員聯絡。\n\n總監俱樂部主席\n\n許招腎\n\n2017年7月17日\n\n8/F., Hong Kong Scout Centre, Scout Path, Austin Road, Kowloon, Hong Kong. | Tel:29576455Fax:30139678 | E-mail:cclub@scout.org.hk\n| --- | --- | --- |\n香港九龍柯士甸道童軍徑香港童軍中心八樓電話：29576455圓文傅真：30139678 | 電郵：cclub@scout.org.hk\n\n<!-- p.2 ocr -->\n附件1\n\n香港童軍總會總俱樂部\n\n1．報失會員證如會員遺失會員證，請致電29576455與俱樂部職員聯絡。\n\n2.補領會員證之程序\n\n俱樂部辦事處辦理補領手續。\n\nb.補領會員證的手續費為港100元正。\n\nc．會員必須出示香港身份證明文件以確其身份。\n\nd.在辦妥新的會員證後，會員必須收確收妥新證，同意舊證已無效。\n\ne．如會員未能親臨總俱樂部辦事處辦理補領手續，會員必須填妥：i）「補領會員證授權書」”，授權親友處理；或 ii）填寫「以郵寄方式通知書」\"辦理補領會員證手續’會員必須附上香港身份證明文件副本及劃線支票港100 元（劃線支票抬頭請書「香港童軍總會總俱樂部」）：\n\n以便辦理。\n\n#如需要「補領會員證授權書」或「以郵寄方式通知書」’請致電俱樂部辦事處 29576455索取。\n\n3.識別補領之會員證\n\n補的會員證左下方會印上「(2)」’表示該證為第1次補領；如會員是第2次補領會員證，便會印上「(3)」；第3次補領會員證，便會印上「(4)」’如此類推。\n\n補領之會員證樣本如下：\n\nCOMMISSIONERS'CLUB 軸監俱華部\n\n(會員英文姓名) | CHAN MAN\n| --- | --- |\n(會員編號) | 0000/0/00\n(補領發咭次數) | (2)\n","07_地域及屬會專用/Adm21_26_LKN.md":"---\nsource_file: \"Adm21_26_LKN.pdf\"\nsource_category: \"07_地域及屬會專用\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n# 李鉅能基金 \n\n行政通告第 21/26 號 \n\n2026 年 9 月 1 日 \n\n現正接受李鉅能基金 2026 年第二期申請，基金目的及申請方法詳列如下： \n\n## 1. 基金目的 \n\n- 1.1 資助童軍旅發展，將童軍運動進一步普及化，讓更多青少年參加童軍運動。 \n\n- 1.2 資助童軍成員籌辦或參與傳統的露營活動，使能將日常所接受的童軍訓練，付諸實踐， 並從中認識自我，發揮潛能。 \n\n## 2. 資助項目 \n\n- 2.1 童軍露營 \n\n- 2.2 社區服務 \n\n- 2.3 童軍旅發展 \n\n- 2.4 其他 \n\n## 3. 資助範圍 \n\n- 3.1 童軍露營 \n\n   - a. 須以童軍旅（最少兩個小隊）名義申請； \n\n   - b. 受助人必須為童軍支部或以上人士； \n\n   - c. 活動最少為兩日一夜之露營，內容必須包括運用傳統童軍技能； \n\n   - d. 申請時須接受評審； \n\n   - e. 每年每單位最多申請一次（作出申請時童軍團成員最少為 12 人、深資童軍團及樂 行童軍團成員最少為 6 人）； \n\n   - f. 最高贊助金額為活動支出 70% 或港幣 4,000 元，以較低者為準。 \n\n## 3.2 社區服務 \n\n- a. 須以童軍旅名義申請； \n\n- b. 受助人必須為童軍支部或以上人士； \n\n- c. 資助只限於活動或服務中直接用於服務對象所需之活動費用（如材料、茶點、運 輸或紀念品等）； \n\n- d. 參與服務之童軍成員，其開支應自行負擔； \n\n- e. 申請時須接受評審； \n\n- f. 每年每單位最多申請一次（作出申請時童軍團成員最少為 12 人、深資童軍團及樂 行童軍團成員最少為 6 人）； \n\n- g. 最高贊助金額為活動支出 70% 或港幣 4,000 元，以較低者為準。\n\n<!-- p.2 -->\n## 3.3 童軍旅發展 \n\n- a. 須以主辦機構／童軍旅名義申請； \n\n- b. 申請之機構／社團／童軍旅必須為港島地域轄下； \n\n- c. 申請人必須為主辦機構負責人／負責領袖； \n\n- d. 可資助童軍旅物資、童軍制服等； \n\n- e. 申請時須接受評審； \n\n- f. 最高贊助金額為活動支出 70% 或港幣 4,000 元，以較低者為準。 \n\n## 3.4 其他 \n\n- a. 須以童軍單位／主辦機構／童軍旅名義申請； \n\n- b. 資助範圍包括香港童軍總會轄下所有單位及其活動； \n\n- c. 申請時須接受評審； \n\n- d. 贊助金額不設上限，視乎活動開支而定。 \n\n## 4. 評核方式 \n\n所有申請必須經由地域基金管理委員會評選。基金管理委員會就一切有關撥款程序、 批覈事宜及資助金額保留最終決定權。 \n\n## 5. 發放款項安排 \n\n評核申請後，將個別通知申請人批覈結果。待活動完結後，申請人需將一份附有相片 之活動報告書，報告書內容包括介紹活動／服務體驗、財務報告表，連同有關發票或收條 正本交回港島地域辦事處，以便安排發還款項。 \n\n## 6. 申請方法 \n\n   - 6.1 基金每年批覈申請 **2** 次，截止日期分別為：每年 **6** 月 **30** 日及 **12** 月 **31** 日。 \n\n   - 6.2 每次申請，只能就資助範圍（ **_3.1_** 至 **_3.4_** 項）提出其中一項，同一單位不可在連續 **_3_** 年內 重複申請。 \n\n   - 6.3 申請人須填妥「李鉅能基金申請表」（表格可於港島地域總部索取，或從港島地域網站 （ _https://www.hkirscout.org.hk_ ）下載），於截止日期前，郵寄或遞交香港灣仔日善街 23 號香港童軍百週年紀念大樓 19 樓港島地域辦事處。 \n\n   - 6.4 所有申請必須在活動舉行前最少 30 天提交申請。 \n\n7. 查詢 \n\n請致電 2835 7717 與地域職員古玉月小姐聯絡。 \n\n副地域總監（行政） 鍾 震 宇\n","07_地域及屬會專用/MidWeekMember.md":"---\nsource_file: \"MidWeekMember.pdf\"\nsource_category: \"07_地域及屬會專用\"\nsource_format: \"pdf\"\npages: 1\npages_ocr: 1\nocr_avg_score: 0.931\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\n總監俱樂部 COMMISSIONERS'CLUB\n\n香港童軍總會總俱樂部 | Mid-weekMember | 特許會員\n\nSCOUT ASSOCIATION OF HONG KONG香港童軍德會特許會\n\n總俱樂部是總會特為各級領袖及成年成員而設的聯會，宗旨是為會員提供優良和舒適的場所及設施作休間、社交及聯誼之用。\n\n俱樂部在香港童軍中心8樓設有中菜，環境舒適雅緻，由名廚主理各款精美點心及粵菜。為了鑲童軍人士的親友亦能享用俱樂部的設施，俱樂部現新增一頂會籍～\n\n特許會員（Mid-weekmember）\n\n參加資格：童軍成員之親友，必支持童軍運動，亞由香港童軍總會五級總或以上人士推薦，經俱樂部執行委員會批准後， 可成為特許會員。\n\n會 | 費：港2000元\n\n迎新優惠：成功入會後，將獲贈10張港100元飲食現金券。（只適用於總俱樂部中菜廳)\n\n會籍 | 期：以兩年為期(會籍之續期由俱樂部執行委員會批覈)\n\n享用中菜廳時間：星期一至四上午11時至晚上11時，星期五上午11時至下午 4時，公假期除外。\n\n參加辨法：填妥特許會員推薦表連同入會費港2000元(劃線支票抬頭請書「香港童軍總會總俱樂部」)寄交九龍柯士甸道童軍徑香港童軍中心8樓808室總俱樂部收。（申請表格可描\n\n以下二維碼QRCode下載）\n\n查 | 詢：29576455(總俱樂部瓣事處)\n","07_地域及屬會專用/a.md":"---\nsource_file: \"a.pdf\"\nsource_category: \"07_地域及屬會專用\"\nsource_format: \"pdf\"\npages: 1\npages_ocr: 1\nocr_avg_score: 0.941\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\nSCOUT ASSOCIATION OF HONG KONG COMMISSIONERS'CLUB 香港童軍總會總俱樂部\n\n親愛的會員：\n\n有「個人資料（私）（修訂）條例，事宜\n\n衷心感謝閣下一直以來對香港童軍會俱樂部的支持。\n\n隨著上述修訂條例於2013年4月1日實施後，本俱樂部將續沿用閣下之個人資料，包括姓名、電話、傅真、電郵及郵寄地址， 與閣下保持，及用於發放本俱樂部通訊丶活動資訊丶進行研究及分析、收集意見、產品推廣、進行募及其他配合香港童軍會抱負及使命的相事項。\n\n倘若閣下不欲接收上逃資訊；請將閣下的姓名（中文及英文全寫）丶會員號及絡電話電郵至cclub@scout.org.hk，或郵寄至九龍柯士甸道童軍徑香港童軍中心8樓808室香港童軍會總俱樂部收。\n\n倘有查，請與俱樂部職員（電話：29576455）聯絡。\n\n總俱樂部主席\n\n許招賢 2013年5月31日\n\n8/f., Hong Kong Scout Centre, Scout Path, Austin Road, Kowloon, Hong Kong. | Tel:29576455Fax:30139678 | E-mail : ccluboff@scout.org.hk\n| --- | --- | --- |\n香港九龍柯士甸道童軍徑香港童軍中心八樓電話：29576455固文傅真：30139678 | 電郵：ccluboff@scout.org.hk\n","07_地域及屬會專用/deposit.md":"---\nsource_file: \"deposit.pdf\"\nsource_category: \"07_地域及屬會專用\"\nsource_format: \"pdf\"\npages: 1\npages_ocr: 1\nocr_avg_score: 0.945\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\n香港童軍總會總俱樂部\n\n由：總俱樂部主席\n致：各會員\n日期：2019年6月18日\n\n會員訂座收取按金安排\n\n總監俱樂部中菜一直致力為會員提供優質的餐飲服務， 承蒙會員的支持，中菜的業務近年穩步發展。\n\n惟近期俱樂部發現有部分會員座後沒有出現，且情況日趣重。此不單有需要訂座的會員享用不到服務，更令中菜蒙受損失。\n\n為確保服務質素，凡於俱樂部中菜惠顧壹席（12人）或以上或廂房，均繳付「言座按金」每席港500元。\n\n如有任何查詢，請致電27308668與俱樂部中菜聯絡。\n\n不便之處，敬希見。\n\n總俱樂部主席\n\n許招賢\n"};

<script>
const $ = (s) => document.querySelector(s);
/* 知識庫位置:
     - 放在同一個 repo 的 knowledge/  → 預設 "../knowledge"
     - 部署時把 knowledge/ 放在旁邊     → "./knowledge"
     - 直接讀 GitHub raw              → "?kb=https://raw.githubusercontent.com/<user>/<repo>/<branch>/knowledge"
*/
const EMBEDDED = true;   /* 單檔版:資料已內嵌,不需要 fetch */
const KB = "";
let index = null;
const cache = new Map();              // md_file -> 全文

/* ---------------- 啟動 ---------------- */
(async function init() {
  $("#key").value = localStorage.getItem("geminiKey") || "";
  $("#model").value = localStorage.getItem("geminiModel") || "gemini-2.5-flash";
  try {
    index = window.__KB_INDEX__;
    if (!index) throw new Error("內嵌資料缺失");
    renderDocs();
    const layout = (index.files || []).filter((f) => f.layout).length;
    $("#count").textContent =
      `${index.files.length} 份文件 · 約 ${Math.round(index.files.reduce((a, f) => a + f.chars, 0) / 10000)} 萬字` +
      ` · 有排版 ${layout} 份 · 轉換於 ${(index.generated_at || "").slice(0, 16)}`;
  } catch (e) {
    $("#count").textContent = "";
    $("#note").innerHTML = `初始化失敗:${e.message}`;
  }
})();

/* ---------------- 文件清單 ---------------- */
function renderDocs() {
  const q = $("#filter").value.trim().toLowerCase();
  const box = $("#docs");
  box.innerHTML = "";
  (index.files || [])
    .filter((f) => !q ||
      (f.md_file + " " + f.title + " " + f.category).toLowerCase().includes(q))
    .forEach((f) => {
      const d = document.createElement("div");
      d.className = "doc";
      const t = document.createElement("div");
      t.className = "t";
      t.textContent = f.title || f.md_file;
      const m = document.createElement("div");
      m.className = "m";
      m.textContent = `${f.category} · ${f.chars.toLocaleString()} 字` +
                      (f.pages ? ` · ${f.pages} 頁` : "");
      if (f.needs_review) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = "OCR";
        m.appendChild(document.createTextNode(" "));
        m.appendChild(s);
      }
      d.append(t, m);
      d.onclick = () => openDoc(f, d);
      box.appendChild(d);
    });
  if (!box.children.length) box.innerHTML = '<div class="hint">沒有符合的文件。</div>';
}
$("#filter").addEventListener("input", () => index && renderDocs());

async function loadDoc(f) {
  const key = String(f.md_file).replace(/\\/g, "/");
  if (cache.has(key)) return cache.get(key);
  const text = window.__KB_TEXTS__[key] || "";
  cache.set(key, text);
  return text;
}

async function openDoc(f, el) {
  document.querySelectorAll(".doc.on").forEach((x) => x.classList.remove("on"));
  if (el) el.classList.add("on");
  $("#preview").style.display = "block";
  $("#pvName").textContent = f.md_file;
  $("#pvLink").style.display = "none";
  $("#pvBody").textContent = "載入中…";
  $("#pvBody").textContent = await loadDoc(f);
}

/* ---------------- 檢索(在本機做,不外傳) ---------------- */
function tokens(text) {
  const out = new Set();
  const lower = text.toLowerCase();
  // 拉丁字/數字
  (lower.match(/[a-z0-9]{2,}/g) || []).forEach((w) => out.add(w));
  // 中文:相鄰兩字一組,對中文檢索夠用
  const cjk = lower.replace(/[^\u4e00-\u9fa5]+/g, " ").split(/\s+/).filter(Boolean);
  cjk.forEach((seg) => {
    for (let i = 0; i < seg.length - 1; i++) out.add(seg.slice(i, i + 2));
  });
  return [...out];
}

function countOcc(hay, needle) {
  return hay.split(needle).length - 1;
}

/**
 * 檢索:用 IDF 加權,讓「探索課程」這類有辨識度的詞壓過「申請表」這種到處都有的詞。
 * 全程在本機做,問句不會離開瀏覽器。
 */
async function retrieve(question, k) {
  const toks = tokens(question);
  if (!toks.length) return [];

  const docs = await Promise.all(index.files.map(async (f) => {
    const text = await loadDoc(f);
    return { f, text, low: text.toLowerCase(), head: text.slice(0, 2500).toLowerCase() };
  }));
  const N = docs.length || 1;

  // 先統計每個詞出現在幾份文件(document frequency)
  const df = Object.create(null);
  toks.forEach((t) => (df[t] = 0));
  const counted = docs.map((d) => {
    const c = Object.create(null);
    for (const t of toks) {
      const n = countOcc(d.low, t);
      c[t] = n;
      if (n) df[t]++;
    }
    return c;
  });

  docs.forEach((d, i) => {
    let score = 0;
    for (const t of toks) {
      const n = counted[i][t];
      if (!n) continue;
      const idf = Math.log((N + 1) / (df[t] + 0.5));   // 罕見詞權重高
      score += Math.min(n, 5) * idf * 1.0;             // 出現次數(有上限,避免長文件壓倒一切)
      if (d.head.includes(t)) score += idf * 1.5;      // 開頭命中 → 通常是主題
      if ((d.f.title || "").toLowerCase().includes(t)) score += idf * 2;  // 標題命中
    }
    d.score = score;
  });

  return docs
    .filter((d) => d.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, k)
    .map((d) => ({ f: d.f, sc: Math.round(d.score * 10) / 10, text: d.text }));
}

/* ---------------- 問 Gemini ---------------- */
$("#askBtn").onclick = async () => {
  const question = $("#q").value.trim();
  const box = $("#answer");
  if (!question) return;
  if (!index) { box.innerHTML = '<div class="err">知識庫未載入。</div>'; return; }

  const apiKey = $("#key").value.trim();
  const model = $("#model").value;
  const k = parseInt($("#topk").value, 10) || 4;

  box.innerHTML = '<div class="note"><span class="spinner"></span>正在檢索文件…</div>';
  try {
    const hits = await retrieve(question, k);
    if (!hits.length) {
      box.innerHTML = '<div class="body">在文件庫中找不到相關內容。試下換個關鍵字,或者直接喺左邊瀏覽文件。</div>';
      return;
    }
    if (!apiKey) {
      box.innerHTML = '<div class="note">已找到相關文件,但未填 API key,所以只做檢索:</div>' +
        hits.map((h) => `<div class="src"><b>${h.f.md_file}</b>(相關度 ${h.sc})</div>`).join("");
      return;
    }

    box.innerHTML = '<div class="note"><span class="spinner"></span>Gemini 正在閱讀 ' +
      hits.length + ' 份文件並作答…</div>';

    const ctx = hits.map((h) => {
      const marks = h.f.pages_ocr
        ? `(注意:此檔有 ${h.f.pages_ocr}/${h.f.pages} 頁經 OCR,可能有錯字)`
        : "";
      return `### 檔案:${h.f.md_file} ${marks}\n${h.text.slice(0, 16000)}`;
    }).join("\n\n---\n\n");

    const system = [
      "你是香港童軍總會的資料助理,只可以根據使用者提供的官方文件回答。",
      "規則:",
      "1. 如果文件中沒有答案,直接說「文件中未提及」,不要靠常識補充。",
      "2. 每個答案要標明出自哪個檔案(用檔名),例如「(來源:P110-26.md)」。",
      "3. 若引用的檔案標示了 OCR,而答案涉及日期、金額、通告編號、表格數字,",
      "   要加一句提醒使用者核對原文。",
      "4. 用香港繁體中文,簡潔作答,可以先給結論再列要點。",
    ].join("\n");

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: [{
            role: "user",
            parts: [{ text: `以下是官方文件內容:\n\n${ctx}\n\n問題:${question}` }],
          }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 1600 },
        }),
      }
    );

    const data = await res.json();
    if (!res.ok) {
      throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
    }
    const cand = (data.candidates || [])[0] || {};
    const text = ((cand.content && cand.content.parts) || [])
      .map((p) => p.text || "").join("").trim() || "(Gemini 沒有回傳內容)";

    box.innerHTML = "";
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    box.appendChild(body);

    const src = document.createElement("div");
    src.className = "src";
    src.innerHTML = "引用文件:" + hits.map((h) =>
      `<div><b>${h.f.md_file}</b> — ${h.f.title || ""}` +
      (h.f.needs_review ? ' <span class="tag">OCR</span>' : "") + "</div>").join("");
    box.appendChild(src);
  } catch (e) {
    box.innerHTML = '<div class="err">失敗:' + e.message +
      "\n(檢查 API key 是否有效、模型名稱是否可用、有無被瀏覽器 CORS／網絡攔截)</div>";
  }
};

/* ---------------- key 管理 ---------------- */
$("#saveKey").onclick = () => {
  localStorage.setItem("geminiKey", $("#key").value.trim());
  localStorage.setItem("geminiModel", $("#model").value);
  $("#saveKey").textContent = "已記住 ✓";
  setTimeout(() => ($("#saveKey").textContent = "記住 key"), 1500);
};
$("#clearKey").onclick = () => {
  localStorage.removeItem("geminiKey");
  $("#key").value = "";
};
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#askBtn").click();
});
</script>
