source_file: \"04_Venture Training Scheme_Bilingual_20260814.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 143\npages_ocr: 2\nocr_avg_score: 0.922\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 -->\n**V** 深 **S** 童軍訓練綱要 Venture Scout Training Scheme 資\n\n<!-- p.2 -->\n## 深資童軍支部 支部徽章 \n\n**火炬一直以來與深資童軍支部有密切的關係， 榮譽童軍獎章領袖標誌及榮譽童軍獎章都是 以火炬圖案為主。而火炬本身形狀似“V”字， 加上火炬上呈“S”狀之火焰，正是深資童軍支 部的簡寫“VS”。** \n\n**火炬同時具有薪火相傳的意義，象徵深資童 軍支部為童軍運動以至社會培育未來領袖之 目的。** \n\n**深資童軍支部特色 教育目標 自立 自務自治  明日領袖** 香港童軍總會 深資童軍訓練綱要 一九七零 : 第一版 二零一七 : 第十版 二零二六 : 第十一版\n\n<!-- p.3 -->\n序 **Preface** \n\n深資童軍支部是青少年邁向成熟的重要學習平臺。15 至20 歲的青年正 處於確立價值觀、探索人生方向的關鍵階段，適合透過更高自主度及責 任感的訓練模式，學習自我管理、策劃及領導他人。此階段的訓練有助 青年逐步建立清晰的個人目標與人生方向。 \n\n深資童軍支部以「自務自治．明日領袖」為核心理念，鼓勵成員在自務 自治的架構下，主動策劃活動、參與服務及接受挑戰，從中鍛煉組織能 力、溝通技巧、決策能力及承擔精神，為成為青年領袖作好準備。成員 在實踐中學習為決定負責，培養成熟的領導態度。 \n\n是次修訂的訓練綱要，清晰整合段章制度與進度性學習歷程，強調策劃、 行動與反思並重，協助深資童軍建立成熟的思考模式及穩健的行事態度， 並培養持續自我提升的能力。整體設計更着重學習深度與質素。 \n\n新訓練綱要亦加強深資童軍與社區的連結，透過實際服務與團隊合作， 引導成員關心社會需要，在真實情境中實踐所學，培養公民責任感與社 會承擔。讓服務不只是活動，而成為價值實踐的一部分。 \n\n本人謹向支部訓練檢討工作小組及所有參與修訂工作的領袖致謝，感謝 他們為完善深資童軍訓練制度所作出的寶貴貢獻。期望深資童軍能善用 童軍提供的學習平臺，勇於承擔、持續成長，逐步發展成為具影響力的 青年領袖。 \n\n助理香港總監( 青少年活動) 陳 狄 安 2026 年2 月 \n\n3\n\n<!-- p.4 -->\n#### 前  言 **Foreword** \n\n在整個童軍運動中，深資童軍支部將涵括15 至20 歲（即21 歲生日前 一天）的成員，在這一階段的青少年成員，往往面對各種困難。由學業 環境急速轉變，從高中至面對公開試到大專/ 大學或職場的過渡，帶來 巨大不確定性；同時，他們需從青少年逐漸蛻變為成年人，面對社會責 任、身份轉變及生活平衡等的挑戰，正正就是本綱要提供的學習需要： \n\n本綱要主要修訂如下： \n\n1. 強化「自務自治」的角色。特此修改現時的「深資童軍執行委員會 訓練班」，除了讓成員明瞭「執行委員會」、「有效會議程序」， 更有系統地「組織活動」。同時讓成員建立人際網絡，共同面對挑戰。 \n\n2. 強化「選擇」。作為青少年成員最高規格之獎章，除保存傳統「童 軍技能」的訓練外，亦於不同範疇中增加「新選項」，例如：「服 務社會」項目中新增三個選項（手語、精神健康急救、SOUL Keeper 精神健康守護者課程）及「多元技能」項目中的「新體驗」等，提 供更廣闊的選擇。 \n\n期望深資童軍成員在新修訂的訓練綱要下，善用寶貴的時間獲得最有效 的訓練，在個人發展的同時，亦能為童軍運動及社會發展出一分力。最 後，本人在此代表香港童軍總會，向為編制本訓練綱要付出努力和貢獻 的人士致謝。 \n\n總部總監（深資童軍）                    助理總部總監（深資童軍） 鄔 雲 龍 許 俊 2026 年2 月 2026 年2 月 \n\n4\n\n<!-- p.5 -->\n#### 目  錄 **Contents** \n\n|**序**<br>|3|目<br>目<br><br>|\n|---|---|---|\n|**前  言**|4|目|\n|**目  錄**|5||\n|**引  言**|8||\n|**第一章 深資童軍支部的組織及規條**|||\n|**深資童軍支部的組織及規條**|10||\n|**深資童軍制服**|14||\n|**第二章 深資童軍支部的訓練計劃**|||\n|**深資童軍支部的訓練計劃**|16||\n|**會員章**|17||\n|**深資童軍肩章**|19||\n|**深資童軍獎章**|21||\n|**榮譽童軍獎章**|22||\n|**段章設計理念**|24||\n|**活動策劃**|25||\n|**社會服務**|27||\n|**多元技能**|31||\n|**範疇一：童軍技能**|32||\n|**範疇二：康樂體育**|34||\n|**範疇三：新體驗**|36||\n|**「童軍技能」自行組隊考驗內容**|38||\n\n<!-- Start of picture text -->\n5<br><!-- End of picture text -->\n\n<!-- p.6 -->\n**戶外探險** 41 **戶外探險項目指引** 45 **甚麼是「有目的之旅程」及自選事工指引** 47 **第三章 世界童軍組織推出的徽章** \n\n|**世界童軍組織推出的徽章**|49|\n|---|---|\n|**第四章 其他獎章及徽章**||\n|**其他獎章及徽章**|50|\n|**「積極公民」獎章系列**|51|\n|**深資童軍急救章**|52|\n|**宗教章**|53|\n|**樂行童軍先修章**|57|\n|**社區參與章**|58|\n|**香港青年獎勵計劃**|60|\n|**航空活動徽章**|61|\n|**海上活動徽章**|62|\n|**第五章 徽章簽發 / 領取∕購買**||\n|**徽章簽發**<br>**第六章 典禮與儀式**|63|\n|**典禮與儀式**|64|\n\n<!-- Start of picture text -->\n6<br><!-- End of picture text -->\n\n<!-- p.7 -->\n###### **第七章 附 錄** \n\n|**全港深資童軍錦標賽**|65||\n|---|---|---|\n|**深資童軍議會**|65|目<br><br>|\n|**深資童軍發展史**|66|目<br>目|\n|**常見問題**|66||\n|**考驗／訓練班開辦指引**|67||\n|**鳴謝**|68||\n\n7\n\n<!-- p.8 -->\n#### 引  言 \n\n#### **Introduction** \n\n本書詳述深資童軍支部組織、規條及訓練課程，並詳列深資童軍支部各 個獎章的考驗範圍及應達到的水平。 \n\n本書乃本會正式訓練手冊之一，有關領袖均須遵照執行。如有任何進一 步修訂，請留意日後所發出之通告。 \n\n###### **何謂自治?** \n\n自治為透過民主選舉制度並根據童軍運動原則，以執行委員會模式自行 管理及發展團務。 \n\n###### **何謂自務?** \n\n自務為成員按照該旅團的需要自行計劃深資童軍團行事曆，積極參與訓 練、服務及各類型比賽，使之具備組織能力，能擔當成年人角色。 自治和自務兩者必須互相配合纔可全面發展成員的個性，最終目的是讓 深資童軍累積更多以童軍活動為本的管理經驗，培養領袖素質。 \n\n###### **領袖角色** \n\n領袖作為成員的楷模，須定時給予執行委員會成員及其他工作小組成員 指導。有關引導工作包括活動前的計劃建議及活動後的解說及檢討。惟 領袖需給予成員執行計劃的自由度，以發展成員之領導能力為目標。 \n\n8\n\n<!-- p.9 -->\n###### **簽發人角色** \n\n與主考人確定相關考覈完成後，簽發證書的人士。 \n\n- 會員章： 由深資童軍團長與團執行委員會商議後頒發； \n\n肩章： 由深資童軍團長安排主考人及簽發； \n\n各段章： 由深資童軍團長安排主考人及簽發，亦可由所屬區總監及 其代表（一般為助理區總監（深資童軍））協助安排。如 團長因任何原因未能安排主考人，其所屬區總監及其代表 有責任協助安排； \n\n各金帶： 經團長協助，安排區總監、地域總監、青少年活動總監或 上述人士之代表擔任主考人及簽發。如團長及區會因任何 原因未能安排主考人，其所屬地域總監及其代表（一般為 地域總部總監（深資童軍）或助理地域總部總監（深資童 軍））有責任協助安排。 \n\n###### **主考人角色** \n\n一般簽發人均可擔任為主考人。而簽發人亦可安排由相關資格的人士擔 任主考人。主考人可以是相關範疇中專業人士，並不一定為童軍領袖， 唯簽發人需要為主考人提供清晰及適當的指示以便完成考覈。 \n\n<!-- Start of picture text -->\n9<br><!-- End of picture text -->\n\n<!-- p.10 -->\n#### 第一章 深資童軍支部的組織及規條 **CHAPTER 1: Organization and Rules of Venture Scout Section** \n\n###### **目的** \n\n深資童軍支部旨在延續童軍支部之訓練，使童軍運動得以薪火相傳，並 為社會培育未來領袖。 \n\n深資童軍支部的教育目標是「自務自治 明日領袖」。深資童軍採用自務 自治方式，並透過戶外生活、自我挑戰活動及遞進式訓練，學習自學、 自立及自律、鍛煉良好體魄、培養策劃、組織及領導才能、領略與人共 事之道、增進人際關係技巧、實踐團隊精神及為踏入社會前做好準備。 \n\n###### **方法** \n\n在成人領袖的引導下，深資童軍運用執行委員會制度，以自治和自務方 式配合有進度性及富挑戰性之活動及訓練誘導成員，以達到深資童軍支 部的目的。 \n\n###### **童軍誓詞** \n\n我願以信譽為誓，竭盡所能； 對神明，對國家，盡責任； 對別人，要幫助； 對規律，必遵行。 \n\n###### **童軍規律** \n\n- （一） 童軍信用為人敬。 \n\n- （二） 童軍待人要忠誠。 \n\n- （三） 童軍友善兼親切。 \n\n- （四） 童軍相處如手足。 \n\n- （五） 童軍勇敢不怕難。 \n\n- （六） 童軍愛物更惜陰。 \n\n- （七） 童軍自重又重人。 \n\n###### **童軍銘言** \n\n準備 \n\n10\n\n<!-- p.11 -->\n###### **年齡規限** \n\n深資童軍支部的年齡規限是15 至20 歲。於年滿21 歲當日，其深資童軍身 分將自動結束。 \n\n###### **深資童軍團的最低應有標準** \n\n根據總會《政策組織及規條》： \n\n###### **人數** \n\n一已成立的深資童軍團，最少要有深資童軍六名。 \n\n###### **領袖** \n\n一深資童軍團最少要有兩名領袖，其中一名必須持有領袖委任書。此外， 其中一名領袖的性別必須與該團成員相同。如團內有男及女成員，則必 須有男及女領袖。 \n\n###### **訓練** \n\n深資童軍的活動與訓練，必須遵照總會出版的「深資童軍訓練綱要」及 所頒佈的任何有關修訂文件。 \n\n###### **團執行委員會** \n\n該委員會負責設計及推行年度活動計劃。 \n\n###### **深資童軍團內部組織及功能 內部組織** \n\n###### **1. 全體團員大會** \n\n1.1 職責 \n\n此大會為深資童軍團之最高行政機構，負責訂定及修改團章、 制定長遠團務政策、選出執行委員會委員、檢視執行委員及其 他臨時工作小組所籌劃之活動與訓練及審核團財務情況。此大 會每年最少召開一次會議。 \n\n- 1.2  組成 \n\n所有有效深資童軍成員。 \n\n- 1.3  權力 \n\n所有有效深資童軍成員可透過民主及公平的投票方法就特定議 題投票。除非有關議決違背童軍運動原則，否則所有有關團務 的投票結果均屬最後決定。 \n\n11\n\n<!-- p.12 -->\n###### **2. 執行委員會** \n\n###### 2.1 職責 \n\n執行委員會須遵照團員大會的決定負責團內的組織、活動及行政 等常務事宜。短期計劃應由執行委員會首先策動。 \n\n###### 2.2 組成 \n\n執行委員會設有主席、文書、財務及其他職位，由全體團員大會 視乎情況而定。執行委員會由所有團員選舉產生，包括主席及其 他由團員決定的委員人選。各職位可在團員大會中選出或由各委 員互選擔任。不論採用簡單多數制、內閣制、兩輪決選制、累積 投票制或比例制等選舉辦法，逐個職位投票或選出委員再決定職 位，選舉制度必須因應團的發展而訂，而選舉辦法應清晰地載於 團章。 \n\n###### 2.3 權力 \n\n全體團員大會及團章賦予執行委員會及其委員權力代表深資 童軍團處理一般行政及常務事宜。但如有議案涉及整個團利 益，相關事項必須於全體團員大會中詳細討論及投票表決。 \n\n###### **3. 臨時工作小組** \n\n###### 3.1 職責 \n\n小組主要用作推行旅團的特別活動。職責應由執行委員會決定。 3.2 組成 \n\n臨時小組成員由執行委員會委任或由團員自由加入。較多成員的 深資童軍團可通過成立這種小組，讓非執行委員會委員的深資 童軍亦可參加實際團務及活動策劃，讓各團員都有機會發揮領導 才。臨時小組主席及其他工作崗位由該組組員互選或協商產生。 \n\n###### 3.3 權力 \n\n由於臨時工作小組由執行委員會委任，故需直接向執行委員會匯 報工作並向全體團員負責。 \n\n12\n\n<!-- p.13 -->\n###### **領袖的職責及要求** \n\n###### **4. 領袖角色** \n\n- 4.1 深資童軍團領袖在全體團員大會中可擔當顧問角色，向各深資童 軍成員提供意見。 \n\n- 4.2 深資童軍團領袖皆為執行委員會的當然委員。深資童軍團長可根 據團員之成熟程度及經驗，出任執行委員會主席，或安排團內領 袖擔任執行委員會任何職位。 \n\n- 4.3 深資童軍團長作為團之最高負責人，擁有團內任何會議所通過的 議案之最終解釋權及否決權。如團內任何會議之議決違背童軍運 動原則，深資童軍團長有責任及權力否決有關投票結果並停止相 關活動，並向團員作出適當之指引。 \n\n###### **預期成果** \n\n深資童軍應積極參與或策劃各類型活動（如技能訓練、服務、比賽等）， 出任團執行委員會、工作小組成員及青少年活動署和各地域的深資童軍 議會委員，並嘗試於各類型活動中擔當領導角色。當深資童軍完成整個 支部訓練後，應可達致下列預期成果︰ \n\n1. 深造童軍技能外，啟發「多元技能」發展； \n\n2. 掌握「活動策劃」的技巧，培育「明日領袖」； \n\n3. 拓闊人際網絡，建立合作精神； \n\n4. 培養「自務自治」及「服務社會」的精神； \n\n5. 享受「戶外探險」，拓展視野，從而欣賞及尊重大自然。 \n\n當完成深資童軍訓練或年滿21 歲（以西曆生日計），深資童軍可繼續從 事童軍活動，擔任童軍領袖工作；或加入樂行童軍團。樂行童軍是第五 個訓練支部，旨在維繫關懷社會、熱心服務之青年，給予他們機會及鼓 勵，為童軍運動及社會服務。 \n\n13\n\n<!-- p.14 -->\n##### 深資童軍制服 \n\n#### **Uniform for Venture Scouts** \n\n###### **基本服飾、配件及徽章** \n\n###### **男團員** \n\n||**深資童軍**|**深資空童軍**|**深資海童軍**|\n|---|---|---|---|\n|**帽**|棗紅色軟帽<br>（連童軍帽章）|灰藍色軟帽<br>（連成員帽章）|海童軍男領袖白頂帽<br>（連深資海童軍帽章）|\n|**恤衫**|杏色，短袖，<br>兩胸袋、無摺、肩帶|淺藍色，短袖，<br>兩胸袋、無摺、肩帶|白色，短袖，<br>兩胸袋、無摺、肩帶|\n|**長褲**|草青色，兩斜袋，<br>兩後袋、有褶|深藍色，兩斜袋，<br>兩後袋、有褶|深藍色，兩斜袋，<br>兩後袋、有褶|\n|**皮帶**||棕色（連童軍徽皮帶扣|）|\n|**襪**||黑色、短襪||\n|**皮鞋**||黑色、無花紋、縛帶||\n|**領巾**||旅巾（連童軍巾圈）||\n|**領呔**|棗紅色|深藍色|黑色|\n|**徽章**|世界童軍會|員章、香港章、地域章|、區章、旅章|\n\n###### 備註： \n\n1. 上表只供參考，內容如有更改，以總會之最新公佈為準。 \n\n14\n\n<!-- p.15 -->\n###### **女團員** \n\n||**深資童軍**|**深資空童軍**|**深資海童軍**|\n|---|---|---|---|\n|**帽**|棗紅色軟帽<br>（連童軍帽章）|灰藍色軟帽<br>（連成員帽章）|海童軍女領袖白頂帽<br>（連深資海童軍帽章）|\n|**恤衫**|杏色，短袖，<br>兩胸袋、無摺、肩帶|淺藍色，短袖，<br>兩胸袋、無摺、肩帶|白色，短袖，<br>兩胸袋、無摺、肩帶|\n|**長褲**|草青色，兩斜袋，<br>兩後袋、有褶|深藍色，兩斜袋，<br>兩後袋、有褶|深藍色，兩斜袋，<br>兩後袋、有褶|\n|**半截裙**|草青色、側袋、<br>無褶、及膝|深藍色、側袋、<br>無褶、及膝|深藍色、側袋、<br>無褶、及膝|\n|**皮帶**||棕色（連童軍徽皮帶扣|）|\n|**襪**|肉色、|尼龍、無花、襪褲（配<br>或<br>黑色（配長褲）|半截裙）|\n|**皮鞋**|黑色、無<br>黑色|花紋、非綁帶、中跟（<br>或<br>、無花紋、綁帶（配長|配半截裙）<br>褲）|\n|**領巾**||旅巾（連童軍巾圈）||\n|**領呔**|棗紅色|深藍色|黑色|\n|**徽章**|世界童軍會|員章、香港章、地域章|、區章、旅章|\n\n###### 備註： \n\n1. 上表只供參考，內容如有更改，以總會之最新公佈為準。 \n\n詳細內容可參考由香港童軍總會出版的「儀容與制服手冊」 \n\n15\n\n<!-- p.16 -->\n#### 第二章 深資童軍支部的訓練計劃 \n\n#### CHAPTER 2: Venture Scout Training Programme \n\n###### 備註: \n\n<!-- Start of picture text -->\n深資童軍進度性獎章考取表<br>會員章<br>深資童軍團⻑及團執⾏委員會安排進⾏<br>深資童軍肩章<br>認識<br>技能<br>完成肩章，計劃考取深資童軍獎章及榮譽童軍獎章<br>深資童軍團⻑安排考覈<br>活動策劃 社會服務 多元技能 戶外探險<br>段章 段章 段章 段章 深資童軍獎章<br>完成任何⼀個段章，便可開始與區會指定⼈⼠商討考取該段章之⾦帶<br>區會指定⼈⼠安排考覈<br>活動策劃 社會服務 多元技能 戶外探險 榮譽童軍獎章<br>金帶 金帶 金帶 金帶<br><!-- End of picture text -->\n\n1. 深資童軍在接近完成肩章內容時，可開始計劃考取深資童軍獎章及榮譽童軍獎章， 運用「深資童軍獎章及榮譽童軍獎章考驗計劃(PT/65)」（下稱為「計劃表」），與 深資童軍團長商討整個考驗計劃。深資童軍團長應給予指引，並安排段章考覈（詳 情可參閱21 頁有關深資童軍獎章之考驗介紹）。 \n\n2. 在完成任何一個段章後，深資童軍可開始與所屬區會聯絡，商討考取榮譽童軍獎章 之計劃（詳情可參閱第22 頁有關榮譽童軍獎章之考驗介紹）。深資童軍應按實際情 況修訂及更新個人的「計劃表」，讓自己檢視實際進度及讓團長與區會知悉自己的 進度，方便跟進。 \n\n16\n\n<!-- p.17 -->\n#### 會 員 章 **Membership Badge** \n\n會員章旨在幫助新加入的深資童軍認識其所屬之深資童軍團，以促進他 與其他團員間相互關係，並為彼等所接納。 \n\n本章是由深資童軍團長與團執行委員會商議後頒發。 \n\n完成下列各項： \n\n###### **活動** \n\n1. 參加最少六次團活動，而其中一次須為戶外活動。 \n\n###### **理解** \n\n1. 明瞭童軍運動的目的及人們對深資童軍的期望。 \n\n2. 認識香港及世界童軍運動。 \n\n3. 能辨認中華人民共和國國旗和國徽；並能說明其含意。 \n\n4. 能辨認香港特別行政區區旗和區徽；並能說明其含意。 \n\n5. 明瞭設立國歌的用意，並能背唱之。 \n\n###### **禮節** \n\n1. 認識宣誓時應有之童軍禮儀，以及隊列之基本動作。 \n\n2. 認識在國歌奏唱和升掛國旗、區旗時表現應有之禮儀，以及升國旗 及童軍升旗禮的基本程序。 \n\n3. 認識升掛國旗、區旗及展示國徽、區徽時的注意事項及使用之 限制。 \n\n4. 示範國旗和區旗的升掛方法。 \n\n###### **許諾** \n\n1. 接納童軍誓詞與規律。 \n\n17\n\n<!-- p.18 -->\n###### **保護兒童 （ 於 2025 年 7 月 1 日起生效 )** \n\n1. 完成下列其中一項： \n\n   - a. 對保護兒童及青少年有基本認識，並認識保護他們免受傷害的預 防及處理方法；或 \n\n   - b. 完成「保護童軍成員免受傷害」網上自學課程。 \n\n###### **「積極公民獎章系列 - 保護兒童章—」 網上自學課程** \n\n###### **「保護童軍成員免受傷害」 網上自學課程** \n\n18\n\n<!-- p.19 -->\n#### 深 資 童 軍 肩 章 **Venture Scout Epaulettes** \n\n深資童軍肩章之設立旨在提供階梯，讓剛獲頒 會員章的深資童軍對深資童軍支部活動及童軍 技能有基本認識和體驗。 \n\n深資童軍領袖應與團執行委員會安排新加入之成員參與本章訓練，完成 後由深資童軍團長簽發。在正常情況下，新成員應可在加入後六個月內 完成本章所有項目。新成員可選擇與團內或團外之深資童軍一同參與兩 日一夜或以上之度宿活動及團集會，完成本章。區總監、地域總監或上 述人士之代表有責任協助所屬深資童軍進行有關活動。 \n\n如深資童軍在童軍支部時已完成深資童軍先修章或相關內容，深資童軍 團長可承認相關項目，予以簽發。 \n\n- **( 一) 認識（童軍支部已考獲「深資童軍先修章」的成員可以獲得豁免）** \n\n1. 說出深資童軍支部的目的、方法及預期成果。 \n\n2. 認識深資童軍制服。 \n\n3. 明瞭深資童軍獎章及榮譽童軍獎章之四個考驗組別及考驗範圍。 \n\n4. 明瞭深資童軍獎章及榮譽童軍獎章與其他機構互相關連的地方。 \n\n5. 說出執行委員會之基本功能。 \n\n6. 說出執行委員會之組織及委員的職責。 \n\n7. 明瞭執行委員會之產生方法。 \n\n8. 明瞭執行委員會中領袖的角色。 \n\n9. 認識多元化的深資童軍活動。 \n\n10. 參加最少一次深資童軍執行委員會會議。 \n\n###### **( 二) 童軍技能（童軍支部已考獲「童軍標準獎章」的成員可以獲得豁免） 露營** \n\n1. 與團內或團外之深資童軍完成一次兩日一夜之露營。 \n\n2. 準備一份適合兩日一夜小隊露營的個人及小隊物資清單。 \n\n3. 收拾一個兩日一夜露營用的背囊及個人急救藥囊。 \n\n19\n\n<!-- p.20 -->\n4. 能正確架搭、收拾及存放一個營幕。 \n\n5. 熟悉並正確地使用氣爐及摺刀，並知道有關之安全措施。 \n\n6. 設計一個兩日一夜小隊露營的食譜及單獨烹調其中一款菜式。 \n\n7. 能以火柴及天然物生火。 \n\n###### **繩結** \n\n1. 示範下列繩結並說出其用途： 平結、接繩結、八字結、雙套結、稱人結、繫木結、四方編結、十 字編結及八字編結。 \n\n###### **遠足** \n\n1. 認識戶外活動時常用的地圖種類，明白不同圖例的意義。 \n\n2. 參與一個運用指南針及地圖之戶外活動，期間需示範正置地圖及 利用指南針找出正確的前進方向。 \n\n###### **急救** \n\n1. 知道急救目的及原則。 \n\n2. 示範出血處理、傷口護理及簡單包紥的方法。 \n\n3. 示範燒傷、燙傷、抽筋及扭傷傷病者的處理方法。 \n\n20\n\n<!-- p.21 -->\n#### 深 資 童 軍 獎 章 **Venture Scout Award** \n\n深資童軍完成「深資童軍肩章」後，纔可開始考取本獎章。 \n\n擬考取「深資童軍獎章」之深資童軍，可向深資童軍團長要求代為安排 獎章內各項目的主考人，或向團長提議主考人人選，由團長作出適當安 排。如團長因任何原因未能安排主考人，所屬區總監及其代表有責任協 助安排。 \n\n深資童軍團長、區總監、地域總監、青少年活動總監或上述人士之代表， 均可擔任主考人；惟「戶外探險」項目選修項須由認許之主考人作考覈。 \n\n深資童軍在完成「活動策劃」、「社會服務」、「多元技能」及「戶外探險」 任何一個段章內之全部項目，便可於制服佩戴該項目之段章。唯建議以 「活動策劃」段章為首個完成之段章。 \n\n青少年活動總監授權總部總監（深資童軍）及助理總部總監（深資童軍） 為其代表，處理與「深資童軍訓練綱要」悉數相關事宜。地域總監及區 總監應指派並公佈其代表，處理與「深資童軍訓練綱要」有關的考驗事 宜【通常為地域總部總監（深資童軍）、助理地域總部總監（深資童軍） 及助理區總監（深資童軍）】。 \n\n「深資童軍獎章」證書由青少年活動總監或其代表簽發。在接受考驗的 深資童軍完成所有項目後，深資童軍團長應向所屬區總監或其代表提名， 再由區總監或其代表向所屬地域總監推薦，經地域總監或其代表批覈， 最後由青少年活動總監或其代表確認有關申請，並頒發獎章證書以作嘉 許。有關申請簽發「深資童軍獎章」的程序，請參閱本綱要第五章 - 徽 章簽發 / 領取 / 購買。 \n\n21\n\n<!-- p.22 -->\n#### 榮 譽 童 軍 獎 章 **Dragon Scout Award** \n\n深資童軍完成任何一個「深資童軍獎章」段章後，即可開始考取本獎章， 惟只可著手已完成段章的相對金帶。 \n\n擬開始「榮譽童軍獎章」考覈的深資童軍，應在諮詢深資童軍團長後， 與所屬區會的指定人士【通常為助理區總監（深資童軍）】聯絡，商討 考取本獎章之計劃。在得到指示後，方可展開本獎章之考覈。 \n\n擬考取「榮譽童軍獎章」之深資童軍，應與深資童軍團長或所屬區會商 討主考人的安排，其團長、區總監及其代表亦有責任協助安排主考。如 團長及區會因任何原因未能安排主考人，所屬地域總監及其代表有責任 代勞。 \n\n區總監、地域總監、青少年活動總監或上述人士之代表，均可擔任主考 人；惟「戶外探險」項目選修項須由認許之主考人作考覈。 \n\n青少年活動總監授權總部總監（深資童軍）及助理總部總監（深資童軍） 為其代表，處理與「深資童軍訓練綱要」悉數相關事宜。地域總監及區 總監應指派並公佈其代表，處理與「深資童軍訓練綱要」有關的考驗事 宜【通常為地域總部總監（深資童軍）、助理地域總部總監（深資童軍） 及助理區總監（深資童軍）】。 \n\n22\n\n<!-- p.23 -->\n深資童軍在完成「榮譽童軍獎章」內「活動策劃」、「社會服務」、「多 元技能」及「戶外探險」任何一個項目後，便可在該項目之段章下佩戴 一條金帶。 \n\n「榮譽童軍獎章」由總會根據地域及區之推薦作批覈，並由總領袖及香 港總監簽發。在接受考驗的深資童軍完成所有項目後，深資童軍團長應 向所屬區總監或其代表提名，區總監、地域總監或上述人士之代表應向 青少年活動總監推薦，最後由青少年活動總監或其代表批覈有關申請， 並於童軍大會操頒授獎章證書以作嘉許。有關申請簽發「榮譽童軍獎章」 的程序，請參閱本綱要第五章 - 徽章簽發 / 領取 / 購買。 \n\n當完成本獎章所有項目後，區總監及地域總監將會接見該深資童軍以作 勉勵及推薦。 \n\n23\n\n<!-- p.24 -->\n# 深資童軍段章設計概念 \n\n###### 活動策劃 \n\n活動策劃段章旨在培養成員的活動策劃及團隊合作 能力。段章中兩人合作砌拼圖是象徵與他人協作的 精神；而拼圖則代表每位成員在項目中都扮演著獨 特而重要的角色，強調有效溝通與協作的重要性。 \n\n###### 社會服務 \n\n社會服務段章旨在培養成員幫助他人的精神。 段章中人與人之間互相擁抱，象徵世界大同；而左 手掌與心形的結合則體現童軍對社區的奉獻和愛 心。此段章鼓勵成員積極參與社會服務，展現對社 會的責任感。 \n\n###### 多元技能 \n\n多元技能段章旨在鼓勵成員多元發展，探索和深造 包括童軍技能在內的各項技能。 段章中薪火的元素象徵探索未知領域的熱情，同時 也代表童軍傳統技能的承傳，而燈泡則寓意著擴闊 視野及探索世界。 \n\n###### 戶外探險 \n\n戶外探險段章旨在鼓勵成員通過戶外活動挑戰自 我，欣賞和尊重大自然。 段章中的指南針象徵引領與探索的精神，幫助成員 在旅途中找到方向；指針指向山峯，寓意成員勇於 挑戰。而在外框的北極星指引下，成員能在冒險中 堅持信念，辨認方向，向前邁進。 \n\n24\n\n<!-- p.25 -->\n#### 活 動 策 劃 **Project Badge** \n\n目的︰ \n\n培養深資童軍的會議管理及策劃活動能力， 以提升個人素質。 建議以此段章為首個完成段章。 \n\n###### **段章** \n\n**目標︰** \n\n**透過「深資童軍執行委員會工作坊」，使深資童軍明瞭執行委員會制度 及各項會議程序，強化活動策劃、人際關係與溝通技巧等。此外，同時 拓展人脈，擴大社交圈子，認識更多同儕。** \n\n完成下列項目： \n\n1. 完成一個由區／地域／總會認許之「深資童軍執行委員會工作坊」。 \n\n25\n\n<!-- p.26 -->\n#### 活 動 策 劃 **Project Badge** \n\n目的︰ 培養深資童軍的會議管理及策劃活動能力， 以提升個人素質。 \n\n###### **金帶** \n\n###### **目標︰** \n\n**透過「實踐一項活動策劃」，使深資童軍成員與其他青年人合作，實踐 於「深資童軍執行委員會工作坊」中所學到的會議程序、活動策劃及人 際溝通技巧等。** \n\n###### 完成下列其中一項： \n\n1. 實踐一項活動策劃；或 \n\n2. 實踐一項活動策劃，該活動需外宿最少五日四夜。 完成該選項可與香港青年獎勵計劃「團體生活科」銜接。詳細請參 閱香港青年獎勵計劃的獎勵計劃手冊 - 團體生活科或與主考人聯絡。 \n\n###### 條件︰ \n\n- 成員進行此單元考驗前必須已完成一個由區／地域／總會認許之「深資童軍執行委 員會工作坊」。 \n\n- 與其他旅團深資童軍、樂行童軍或青年人聯合於總會、地域、區、社區中心或社福 機構，組織大型活動項目。該項活動形式不一，包括但不限於聯合團集會、營商體 驗活動、籌募活動、服務計劃、與特殊需要人士舉行聯合活動或與香港女童軍總會 深資女童軍聯合推行之工作項目等。項目可請領袖或其他人士給予意見及提供支 援，但必須由青年人或深資童軍成員主導。 \n\n- 成員須於活動最少兩個月前諮詢深資童軍團長及向金帶主考人【通常為所屬區助理 區總監（深資童軍）】提出申請及得到許可，並於活動舉行前一個月呈交活動計劃 書，及在活動完結後一個月內呈交活動報告書（包括會議文件、分工、財政報告、 活動反思等）。 \n\n26\n\n<!-- p.27 -->\n#### 社 會 服 務 **Service Badge** \n\n目的︰ \n\n培養深資童軍幫助他人及服務社會的精神， 並從實際服務中瞭解他人的需要，增加對 社會歸屬感。 \n\n###### **段章** \n\n###### **目標︰ 鼓勵深資童軍學習新技能，並培養助人精神及社會歸屬感。** \n\n完成選修部分(I) 及選修部分(II) : \n\n**選修部分(I) :** 完成下列其中一項： \n\n1. 急救 \n\n   - 持有有效本會或其他根據香港法例《職業安全及健康規例》（第 509 章，附屬法例A）勞工處認可的三十小時急救課程證書；或 \n\n2. 拯溺(I) \n\n   - 持有有效中國香港拯溺總會拯溺銅章或以上程度資格。 \n\n**選修部分(II) :** \n\n完成下列其中一項： \n\n1. 消防 \n\n   - 完成由區 / 地域 / 總會認許之深資童軍消防訓練班；或 \n\n2. 拯溺(II) \n\n   - 持有有效中國香港拯溺總會泳池救生章、沙灘救生章或以上程度 資格；或 \n\n27\n\n<!-- p.28 -->\n3. 手語 \n\n   - 完成不少於二十小時之手語課程；或 \n\n4. 精神健康急救 \n\n   - 持有有效香港心理衛生會精神健康急救課程（標準版）或（關懷 青少年版）證書；或 \n\n5. SOUL Keeper 精神健康守護者課程 (Level 2) \n\n   - 完成一個認許之「SOUL Keeper 精神健康守護者課程 (Level 2)」； 或 \n\n6. 共融大使 \n\n   - 完成由區 / 地域 / 總會認許之深資童軍共融大使訓練班。 \n\n28\n\n<!-- p.29 -->\n#### 社 會 服 務 **Service Badge** \n\n目的︰ \n\n培養深資童軍幫助他人及服務社會的精神， 並從實際服務中瞭解他人的需要，增加對 社會歸屬感。 \n\n###### **金帶** \n\n**目標︰ 鼓勵深資童軍發揮所長，以己之所能，盡對社會的責任，服務社羣。** \n\n完成下列其中一項： \n\n1.  童軍及社區服務 \n\n   - a. 童軍運動基本原則訓練班（單元1A 及1B）；及 \n\n   - b. 童軍單位內進行四次或以上認許的服務，而時間總計不少於 二十六小時；及 \n\n   - c. 為非童軍單位的社區服務，進行服務四次或以上，或策劃及執行 有持續性的服務一次或以上（如適用），總計服務時間則不少於 二十六小時。 \n\n2. 志願服務 \n\n經常參與一項六個月或以上之服務，總計服務時間則不少於 五十二小時。 \n\n- 進行此項服務前須對服務對象及該服務機構有所認識。 此項目並不一定需要深資童軍具備專門技能或持有相關 專業資格之證書，惟該名深資童軍應學以致用，發揮所 長，並持續參與相關服務，發揮助人精神。服務對象可 \n\n29\n\n<!-- p.30 -->\n為青少年、老年人、病者或弱能人士等。此項服務可以 通過教會（如主日學）、志願機構（如小童羣益會）或 其他社團進行，並可與外界青少年合作。 \n\n      - 如該服務必須考獲相關證書，例如與救護、拯溺或家居 護理有關的服務；或出席由政府官方、地區組織、學校、 總會，地域或區會舉辦之升國旗儀式，並擔任旗手，則 必須按照服務機構要求於開始服務前考獲相關證書。例 如進行升國旗儀式，須完成認可《國旗及區旗禮節工作 坊》證書等。該服務需在童軍活動外進行及不可為兼職 或全職性質。深資童軍須保存一份服務紀錄，以備審核。 \n\n3. 寰宇童軍計劃註1 \n\n   - a. 完成寰宇童軍計劃「探索」課程；及 \n\n   - b. 組織行動小組完成「自願服務」。 \n\n備註： \n\n1. 深資童軍已完成寰宇童軍計劃「探索」課程，在進行樂行童軍的「服務」考驗中將 予以追認，唯「自願服務」將不獲追認。已完成寰宇童軍計劃的樂行童軍須完成「同 等服務」，詳細請參考《樂行童軍訓練綱要》。 \n\n###### 詳細內容可參考寰宇童計劃網頁 \n\n30\n\n<!-- p.31 -->\n#### 多 元 技 能 **Activity Badge** \n\n目的︰ \n\n鼓勵深資童軍探索新事物，從各式各樣的活動中發展個人興趣，促 進深資童軍陶冶性情和鍛鍊良好體魄。透過持續的童軍技能訓練， 使深資童軍在童軍技能上達至青少年成員之最高標準。 \n\n簽發條件： \n\n完成下列三個範疇中任何一個範疇可獲簽發段 章。 \n\n簽發條件： 完成下列全部三個範疇可獲簽發金帶。 \n\n31\n\n<!-- p.32 -->\n**範疇一：童軍技能** \n\n###### **目標︰ 訓練深資童軍在童軍技能上達至青少年成員之最高標準。** \n\n完成下列項目： \n\n1. 先鋒工程 ： \n\n   - a. 知識及技巧： \n\n完成一個由區／地域／總會認可的「深資童軍繩結及先鋒工程 訓練班／考驗」；及 \n\n- b. 實踐： \n\n由深資童軍成員自行組隊後向區／地域／總會申請報考並完 成任何兩項先鋒工程。 \n\n2. 營藝及原野生活知識： \n\n   - a. 營藝： \n\n完成下列其中一項： \n\n- i. 實踐： \n\n由深資童軍成員自行組隊後向區／地域／總會申請報考並 完成一次兩日一夜固定露營活動；或 \n\n      - ii. 完成一個由區／地域／總會認可的「深資童軍營藝訓練班 ／考驗」。 \n\n- b. 原野生活知識： \n\n   - 完成下列其中一項： \n\n      - i. 實踐： \n\n         - 由深資童軍成員自行組隊後向團長申請報考並完成一系列 「原野生活知識」活動；或 \n\n      - ii. 完成一個由區／地域／總會認可的「深資童軍原野烹飪訓 練班／考驗」。 \n\n32\n\n<!-- p.33 -->\n###### 3. 步操註1 ： \n\n- a. 完成「隊列訓練工作坊」；及 \n\n- b. 完成「基本禮儀及步操訓練班」或「步操基本訓練班」註2 。 \n\n備註： \n\n1. 若深資童軍於開展此項考驗前已完成項目3 之任何部分，該等資歷均視為已完成相 關項目要求。 \n\n2. 若深資童軍在過往已完成「童軍步操基本訓練班」，則可視作已完成項目3 中的「步 操基本訓練班」。 \n\n33\n\n<!-- p.34 -->\n**範疇二：康樂體育** \n\n###### **目標︰ 深資童軍在提升童軍技能外，亦需要保持身體健康。通過選擇適合自己 的康體體育活動，努力鍛鍊良好體魄，應付未來的挑戰。** \n\n###### 完成下列其中一項： \n\n###### 1. 自選兩項康樂體育活動 \n\n- a.  持續參與下列任何兩項自選活動，而每項時間總計不少於二十小 時（即兩項合共不少於四十小時）；及 \n\n- b.  對該兩項活動之規則、術語及相關安全措施有充份認識；及 \n\n- c.  認識該兩項活動容易引發的痛症及其預防方法；及 \n\n- d.  與其他旅團的深資童軍、樂行童軍、其他青年人或主考人分享參 與該二項活動後的得着。 \n\n###### 2. 自選一項康樂體育活動 \n\n- a.  持續參與下列任何一項自選活動，而時間總計不少於五十二小 時；及 \n\n- b.  對該項活動之規則、術語及相關安全措施有充份認識；及 \n\n- c.  認識該項活動容易引發的痛症及其預防方法；及 \n\n- d.  與其他旅團的深資童軍、樂行童軍、其他青年人或主考人分享 參與該項活動後的得着。 \n\n34\n\n<!-- p.35 -->\n自選康樂體育活動包括但不限於下面列出的選項︰ \n\n- 籃球、木球、高爾夫球、曲棍球、網球、手球、欖球、小型足球、 排球、水球、羽毛球、壁球、獨木舟水球、壘球、棒球、保齡球、 冰球、投球、門球、桌球、板球、草地滾球、乒乓球、足球、柔 力球、 閃避球、 田徑、游泳競賽、拯溺競賽、野外賽跑、小型 賽車、滑冰（溜冰）、滾軸溜冰、舞蹈、體操、三項鐵人、舉重、 單車（競賽性）、西洋拳、劍擊、獅藝、啦啦隊、野戰遊戲、花 式單車、器械健身、瑜伽、足毽、柔道、空手道、國術、跆拳道、 拳擊、技擊、運動攀登、潛水、水上活動（競技性）、射擊、氣 手鎗射擊、野外定向、箭術、獨木舟（非競賽性）、單車（非競 賽性）、馬術、風帆（非競賽性）、體適能訓練、越野賽、拔河等。 \n\n備註： \n\n1. 如不確定所選活動會否獲接納，應先徵詢主考人的意見。 \n\n2. 成員需要自行草擬考覈計劃，並需要徵詢主考人的意見，及於執行計劃前得到主考 人同意。 \n\n35\n\n<!-- p.36 -->\n**範疇三：新體驗** \n\n###### **目標︰** \n\n**深資童軍在提升童軍技能及保持身體健康外，亦需要提升生活技能。通 過選擇從未嘗試之活動或持續進行已嘗試之活動，鼓勵深資童軍持續成 長、探索世界、擴闊視野。** \n\n完成下列兩項不同類型從未嘗試之活動或持續進行已嘗試之活動以達至 增長知識和技能，而每項時間總計不少於二十小時。（即兩項合共不少 於四十小時。）並向旅團深資童軍、樂行童軍、其他青年人或主考人介 紹該兩項體驗成果： \n\n###### 1. 航空活動 \n\na. 包括但不限於下列選項︰ \n\n   - 飛機及直升機飛行員理論課、跳傘活動、飛行活動、各級 空勤員章課程、飛行章課程、跳傘章課程。 \n\n2. 海上活動 \n\na. 包括但不限於下列選項︰ \n\n- 獨木舟、獨木舟建造、獨木舟水球、龍舟、風帆、立劃板 、立劃板水球、滑浪風帆、徒手潛水、獨木舟救生、各級 童軍標準艇課程。 \n\n###### 3. 資訊科技 \n\na. 包括但不限於下列選項︰ \n\n- 電腦知識（例如︰人工智能應用）、網頁設計、學習可 編程的實體物件 （Programmable Physical Objects）（例 如︰Arduino & micro:bit）、編寫應用程式（App）、數 據分析、業餘無線電、3D 打印。 \n\n36\n\n<!-- p.37 -->\n###### 4. 境外交流活動 \n\n   - a. 參與一次需外宿最少五天的境外交流活動，包括但不限於下列 選項︰ \n\n      - 世界童軍大露營、國際或內地交流活動。 \n\n5. 藝術 \n\n   - a. 包括但不限於下列選項︰ \n\n      - 書法、陶藝、繪畫、雕塑、平面設計、絲網印刷、攝影、 數碼攝影、電影理論及拍攝技巧、話劇、音樂、時裝裁剪。 \n\n6. 興趣 \n\n   - a. 包括但不限於下列選項︰ \n\n      - 護養、釣魚、林務、園藝、語言、氣象、集郵、演辯、魔術、 自家烘焙、寵物急救、寵物美容、性格透視® 認可( 一級) 培訓師、MBTI® 認證施測師。 \n\n備註： \n\n1. 如不確定所選活動會否獲接納，應先徵詢主考人的意見。 \n\n2. 成員需要自行草擬考覈計劃，並需要徵詢主考人的意見，及於執行計劃前得到主考 人同意。 \n\n37\n\n<!-- p.38 -->\n#### 範疇一：「童軍技能」自行組隊考驗內容 \n\n###### **1.   先鋒工程：** \n\nb. 實踐： \n\n由深資童軍成員自行組隊後向區／地域／總會申請報考並完 成任何兩項先鋒工程。 \n\n完成下列各項： \n\n1. 須先完成一個由區／地域／總會認可的「深資童軍繩結及先鋒工程 訓練班／考驗」。 \n\n2. 聯同最少三位深資童軍完成下列任何兩項先鋒工程註1 ： \n\n   - a. 橋: 利用繩索及竹完成長度不少於5 公尺及高度不少於1.5 公尺 的橋一座。 \n\n   - b. 瞭望臺: 利用竹及繩完成高度不低於4 公尺的一座瞭望臺。 \n\n   - c. 空中滑輪索橋: 利用繩索完成長度不少於8 公尺的一座空中滑輪 索橋。 \n\n3. 於活動前呈交小隊計劃書；每人就擬建之先鋒工程，各自製一個合 比例的模型；並在活動後一個月內呈交先鋒工程活動紀錄。 \n\n備註： \n\n1. 先鋒工程項目包括但不限於童軍技能評審計劃(SAS) B 級及C 級的相關工程項目， 如不確定所選項目會否獲接納，應先徵詢主考人的意見。 \n\n2. 詳細考驗要求請參閱本訓練綱要第七章附錄的考驗指引。 \n\n童軍技能評審計劃(SAS) B 級及C 級工程項目可參考： \n\n###### B 級工程項目 \n\n###### C 級工程項目 \n\n38\n\n<!-- p.39 -->\n#### 範疇一：「童軍技能」自行組隊考驗內容( 續) \n\n###### **2. 營藝及原野生活知識** \n\na. 營藝： \n\n- i. 實踐： \n\n由深資童軍成員自行組隊後向區／地域／總會申請報考並 完成一次兩日一夜固定露營活動。 \n\n完成下列各項： \n\n1. 完成一次兩日一夜固定露營活動，營前一個月呈交小隊計劃書， 並在營後一個月內呈交個人露營紀錄；及 \n\n2. 熟習各項露營技藝及營務工作︰ \n\n   - a. 懂得營區分佈方法； \n\n   - b. 收拾一個兩日一夜固定露營用之背囊； \n\n   - c. 架搭、拆卸及收拾最少兩種不同種類的營帳，包括但不限於蒙古 包、A 字營、屋營； \n\n   - d. 運用露營活動所需的常用繩結完成下列之營地建設項目： \n\n   - e. 營門、營區圍欄、旗架及小隊旗、住宿營、貯物營、貯物架、工 作檯、紗櫃、飯桌、衣鞋架、廢物處理設施、天幕、告示板； \n\n   - f. 攜帶及貯藏食物的方法; 設計及烹調露營早、午、晚三餐之菜單， 包括食物的份量及烹調方法； \n\n   - g. 保持營地衛生整潔的方法及措施； \n\n   - h. 正確使用潛在危險工具及清理爐具； \n\n   - i. 食水處理； \n\n   - j. 廢物處理； \n\n   - k. 報到檢查、晚間檢查、晨早檢查及最後檢查的內容及其重要性； \n\n   - l. 露營節目之編排，包括策劃及執行一次童軍崇拜會及營火會。 \n\n備註： \n\n1. 主考人可以按實際情況及需要調整考驗時間表。 \n\n2. 詳細考驗要求請參閱本訓練綱要第七章附錄的考驗指引。 \n\n39\n\n<!-- p.40 -->\n#### 範疇一：「童軍技能」自行組隊考驗內容( 續) \n\n###### b. 原野生活知識： \n\n- i. 實踐： \n\n由深資童軍成員自行組隊後向團長申請報考並完成一系列 原野生活知識活動。 \n\n完成下列各項： \n\n- （甲）完成下列各項： \n\n1.  正確使用摺刀，利用天然材料製作餐具，並以之食用第2 項所列的 食物；及 \n\n2. 用不超過十支火柴及天然物品生火，並以原野烹飪方法（不用任何 炊具）烹調下列食物： \n\n   - a. 以食物作器皿的蛋，例如：洋蔥蛋及薯仔蛋； \n\n   - b. 一種家禽，例如雞、鴨、鴿； \n\n   - c. 魚； \n\n   - d. 麵粉團； \n\n   - e. 米； \n\n   - f. 水。 \n\n- （乙）完成下列其中一項： \n\n1. 運用反射爐、煙燻爐、紙烤箱或泥坑箱，以烘焙方法，製作以下其 中一種：麵包、蛋糕、餅乾、西餅、薄餅、泡芙；或 \n\n2. 以自製鋁罐酒精爐，煮熟一種肉類及烹調一種飲品，例如：湯、羹； 或 \n\n3. 製作一個天然遮蔽處，並在內度宿一晚；或 \n\n4. 用簡單工具把海水化淡或污水過濾；或 \n\n5. 以鑽木方式或運用鎂棒與火石生火。 \n\n40\n\n<!-- p.41 -->\n#### 戶 外 探 險 **Exploration Badge** \n\n**目的︰** \n\n**培養深資童軍掌握基本技能後，互相合作及自 行組隊，仔細策劃，並前往不同的陌生地方， 如郊野及海外探險，藉此挑戰自我，擴闊眼界， 欣賞及尊重大自然。** \n\n###### **段章** \n\n###### **目標︰ 通過戶外或境外活動，培育深資童軍計劃及實踐自己的旅程，值此學習 作出有效決策及承擔後果，訓練深資童軍自立。** \n\n完成下列一項： \n\n###### 1. 陸上徒步遠足旅程 \n\n• 進行一次3 日2 夜或以上之陸上徒步遠足旅程，並最少完成 40 公里的旅程。註1 \n\n條件 ︰須在陸上徒步遠足旅程考驗開始前完成認可之遠足訓練。考驗必須根 據有關指引，由總會認可之遠足審核員或高級遠足審核員負責。 。 \n\n###### 2. 單車旅程 \n\n• 進行一次3 日2 夜或以上之單車旅程，並最少完成160 公里 的旅程。註1 \n\n條件 ︰須在單車旅程考驗開始前完成認可之遠足訓練。考驗必須根據有關指 引，由總會認可之遠足審核員或高級遠足審核員負責。 \n\n###### 3. 自行駕駛境外旅程 \n\n- 進行一次3 日2 夜或以上之自行駕駛境外旅程，並最少完成 650 公里的旅程。 \n\n條件 ︰於出發前最少六個月填妥相關表格，向青少年活動署提出申請。註2 \n\n41\n\n<!-- p.42 -->\n###### 4. 使用機動化交通工具境外旅程 \n\n- 進行一次3 日2 夜或以上之使用機動化交通工具進行境外旅 程，停留點不少於三個，每個停留點逗留時間不能少於十二 小時，並最少完成800 公里的旅程。 \n\n條件 ︰於出發前最少六個月填妥相關表格，向青少年活動署提出申請。註2 \n\n###### 5. 海上旅程 \n\n- 進行一次3 日2 夜或以上之海上旅程，並最少進行40 公里 旅程。 \n\n條件 ︰須在海上旅程考驗開始前完成認可之海上旅程訓練。考驗必須根據有 關指引，由總會認可之海上旅程審核員負責。 \n\n###### 詳細內容可參考相關通告 \n\n備註： \n\n1. 如深資童軍計劃於境外進行陸上徒步遠足或單車旅程，於出發前最少六個月填妥 PT/71 表格向青少年活動署提出申請。關於上述境外旅程，遠足審核員或主考人可 運用彈性，因應山徑的難度、天氣因素或各類不可預計之因素等，可不需要完成指 定裏數/ 日數下而簽發該項目。 \n\n2. 申請自行駕駛或使用機動化交通工具境外旅程考驗的表格和詳細資訊請查看以下網 站。 \n\n42\n\n<!-- p.43 -->\n#### 戶 外 探 險 **Exploration Badge** \n\n**目的︰** \n\n**培養深資童軍掌握基本技能後，互相合作及自 行組隊，仔細策劃，並前往不同的陌生地方， 如郊野及海外探險，藉此挑戰自我，擴闊眼界， 欣賞及尊重大自然。** \n\n###### **金帶** \n\n**目標︰ 強化透過野外或境外活動，培育深資童軍計劃及實踐自己的旅程，值此 學習作出有效決策及承擔後果，訓練深資童軍自立。** \n\n完成下列一項： \n\n###### 1. 陸上徒步遠足旅程 \n\n- 進行一次4 日3 夜或以上之陸上徒步遠足旅程，並最少完成 60 公里的旅程。註1 \n\n條件 ︰須在陸上徒步旅程考驗開始前完成認可之遠足訓練。考驗必須根據有 關指引，由總會認可之高級遠足審核員負責。 \n\n###### 2. 單車旅程 \n\n- 進行一次4 日3 夜或以上之單車旅程，並最少進行240 公里 的旅程。註1 \n\n條件 ︰須在單車探險旅程考驗開始前完成認可之遠足訓練。考驗必須根據有 關指引，由總會認可之高級遠足審核員負責。 \n\n43\n\n<!-- p.44 -->\n###### 3. 自行駕駛境外旅程註2 \n\n- 進行一次4 日3 夜或以上之自行駕駛境外旅程，並最少完成 1,000 公里的旅程。 \n\n條件 ︰於出發前最少六個月填妥相關表格，向青少年活動署提出申請。註2 \n\n4. 使用機動化交通工具境外旅程註2 \n\n   - 進行一次4 日3 夜或以上之使用機動化交通工具進行境外旅 程，停留點不少於五個，每個停留點逗留時間不能少於十二 小時，並最少完成1,200 公里的旅程。 \n\n條件 ︰於出發前最少六個月填妥相關表格，向青少年活動署提出申請。註2 \n\n###### 5. 海上旅程 \n\n- 進行一次4 日3 夜或以上之海上旅程，並最少進行60 公里 的旅程。 \n\n條件 ︰須在海上旅程考驗開始前完成認可之海上旅程訓練。考驗必須根據有 關指引，由總會認可之海上旅程審核員負責。 \n\n備註： \n\n1. 如深資童軍計劃於境外進行陸上徒步遠足或單車旅程，於出發前最少六個月填妥 PT/71 表格向青少年活動署提出申請。關於上述境外旅程，遠足審核員或主考人可 運用彈性，因應山徑的難度、天氣因素或各類不可預計之因素等，可不需要完成指 定裏數/ 日數下而簽發該項目。 \n\n2. 如深資童軍於戶外探險段章中已透過自行駕駛或使用機動化交通工具境外旅程，則 不能透過相關項目考取戶外探險金帶項目。申請自行駕駛或使用機動化交通工具境 外旅程考驗的表格和詳細資訊請查看以下網站。 \n\n44\n\n<!-- p.45 -->\n#### 戶外探險項目指引 **Exploration Guidelines** \n\n###### **遠足訓練** \n\n1. 進行陸上徒步遠足或單車旅程前，深資童軍需完成由區／地域／總 會認許之遠足訓練。 \n\n2. 進行海上旅程前，深資童軍需完成認許之海上旅程訓練。 \n\n###### **旅程基本指引** \n\n所有的旅程需要盡量在陌生地方進行。人數以三至七人為一小組。若男 女深資童軍同時進行考驗，小組成員必須最少為男女性各兩人。每位應 考者必須在旅程中肩負領導及導航之責，並在旅程中完成一項自選事工。 完成旅程後，每位應考者須於一個月內遞交旅程報告書及事工報告書。 \n\n深資童軍以任何選項完成旅程，原則如一。成員須得到一個有計劃、有 意義及安全的旅程︰ \n\n###### **1. 旅程計劃** \n\n所有成員在事前必須有充足時間及機會自行策劃旅程。如計劃進行 境外遠足項目，成員於出發前最少六個月填妥相關表格，向青少年 活動署提出申請。 \n\n###### **2. 旅程內容** \n\n不論本港徒步遠足、境外或海上旅程，主要過程必須在陌生地方進 行。成員擬定在途中完成的事工或活動亦須具價值，相關成果對個 人、社會或童軍運動本身有所得益。 \n\n###### **3. 安全第一** \n\n成員必須時刻以各人之安全為首要考慮。尤其在境外或海上時，成 員更需要與主考人保持聯絡，並嚴格遵照主考人之指示。選擇境外 旅程的成員應於事前清楚瞭解當地習俗禁忌，以及於當地緊急求助 的方法。如行程已獲主考人同意，應考者須盡速將旅程計劃書及全 組參加者個人資料呈報總會國際署或內地事務署。同時，主考人亦 要掌握在途成員的動向，隨時提供支援，並預早訂定緊急應變方案。 若成員身處難以得到即時支援的地方，主考人有責任陪行，減低風 險。 \n\n45\n\n<!-- p.46 -->\n**注意事項** ( 一) 報考陸上徒步遠足或單車旅程考取戶外探險段章的深資童軍請注意 以下事項: 1. 須由遠足審核員或高級遠足審核員負責審核。 2. 所有成員必須未完成戶外探險段章探險選修項。 \n\n- ( 二) 報考陸上徒步遠足或單車旅程考取戶外探險金帶的深資童軍請注意 以下事項 ： \n\n   1. 須由高級遠足審核員負責審核。 \n\n   2. 所有成員必須未完成戶外探險金帶選修項。 \n\n- ( 三 ) 在遠足審核員或主考人同意下，可運用彈性，因應山徑的難度、天 氣因素或各類不可預計之因素等，可不需要完成指定裏數/ 日數下 而簽發該項目。 \n\n- ( 四 ) 海外及內地活動津貼計劃 \n\n   - 青少年活動署海外及內地活動津貼計劃設立目的，旨在鼓勵本會青 少年成員及年青領袖，透過參加認可之海外及內地活動，除擴闊視 野外，更鼓勵他們自我學習和啟發，培訓他們成為一個有自立能 力、樂於助人、有責任感及勇於承擔的人。深資童軍可因應情況作 出申請。 \n\n詳情請參閱行政通告第32/2021 號 \n\n46\n\n<!-- p.47 -->\n#### 甚麼是「有目的之旅程」及自選事工指引 **What is a \"Journey with Purpose\" and the Guidelines for Self-Selected Projects** \n\n1. 「有目的之旅程」（Journey with Purpose）是為了實現某種特定的 目標或意義。這戶外／境外進行的旅程可以包括學習新技能、深入 瞭解某種文化、參與志願活動，或是自我反思與成長。通過不同方 式的旅程，深資童軍能在享受旅程的同時，獲得更深刻的體驗和個 人發展。 \n\n2. 自選旅程事工項目應必須以徒步、單車、自行駕駛、機動化交通工 具或／及海上形式前往有關地點進行相關事工；或相關事工應須於 郊外／戶外／境外進行。因現時科技發達，自選事工不應單純透過 網絡資源便可完成，避免事工項目變為「為做而做」，違背進行「遠 足旅程」之原則。 \n\n3. 自選事工是以「專題研究、文化探索、服務或活動考察等」為大方向， 強調「須對個人、社會或童軍運動具意義及貢獻」的原則。例子包 括但不限於： \n\n   - 特定學習主題（專題研究） 例如：西貢東壩一帶的岩石研究、大埔谷埔一帶的紅樹林研究、 米埔一帶的生物多樣性研究或者樹木普查、大欖一帶的廟宇研 究、水質研究、珊瑚研究等。 \n\n   - 服務 \n\n      - 例如：檢查山徑標距柱狀況、檢查需要山徑維修或需清理排水道 的狀況等、向行山人士介紹及分享「山野不留痕」的原則等。 \n\n   - 活動或文化考察 例如：為幼童軍或童軍支部成員設計及實地考察一天遠足路線、 香港歷史遊蹤（如：探索及分享維多利亞城界石、麥景陶碉堡7 座碉堡）等。 \n\n47\n\n<!-- p.48 -->\n###### 計劃書及報告書的形式不限，唯需包括下列內容： \n\n###### **計劃書：** \n\n1. 目的與目標: 明確說明此次旅程的目的（如學習、服務、文化探索等） 及具體目標。 \n\n2. 行程安排: 詳細的行程，包括出發與返回時間、交通方式、活動安排及 地點。 \n\n3. 預期成果: 計劃所希望達到的結果，例如技能提升、社會貢獻、個人反 思等。 \n\n4. 參與者: 列出參與者的名稱、年齡及角色（如領隊等）。 \n\n5. 資源需求: 需要的物資、資金或其他資源的詳細說明。 \n\n6. 風險評估: 潛在風險及應對措施，確保安全。 \n\n7. 成效評估方法: 如何評估此次旅程事工的成效，包括反思與回饋的方式。 \n\n###### **報告書：** \n\n1. 摘要: 簡要回顧旅程的背景、目的及主要活動。 \n\n2. 回饋: 收集參與者的意見與感受，總結他們的學習和體驗。 \n\n3. 成果與影響: 記錄實際達成的成果及對個人、社會或童軍運動的貢獻。 \n\n4. 遇到的挑戰: 描述在旅程中面對的挑戰及解決方案。 \n\n5. 後續建議: 提出改進建議，如何在未來的旅程中提升效果。 \n\n6. 感想及反思: 分享個人感想及反思。 \n\n7. 附錄: 包括相關的照片、調查問卷、數據或其他資料支持。 \n\n48\n\n<!-- p.49 -->\n#### 第三章 世界童軍組織推出的徽章 **CHAPTER 3: Badges issued by the World Organisation of the Scout Movement** \n\n**詳情請參閱以下的網站：** \n\n和平使者章 Messengers of Peace \n\n童軍世界遺產章 Patrimonito Scout Badge \n\n寰宇童軍章 Scouts of the World Award \n\n地球部落 Earth Tribe \n\n49\n\n<!-- p.50 -->\n#### 第四章 其他獎章及徽章 **CHAPTER 4 : Other Awards and Badges** \n\n深資童軍急救章 Venture Scout First Aid Badge \n\n宗教章 Religious Badge \n\n樂行童軍先修章 Rover Scout Link Badge \n\n社區參與章 Community Involvement Badge \n\n香港青年獎勵計劃 The Hong Kong Award For Young People \n\n50\n\n<!-- p.51 -->\n#### 「積極公民」獎章系列 Active Citizenship Badge Series \n\n世界童軍組織通過不同方式推動積極公民教育，培養青少年的社會責任 感、領導能力和個人成長。香港童軍總會同時致力於培養青少年的公民 意識和社會責任感。為此，我們特別推出了「積極公民」獎章系列，透 過一系列挑戰，激勵童軍成員積極參與社會事務，發展他們的領導能力 和團隊合作能力。 \n\n詳情請參閱以下的網站： \n\n「積極公民」獎章系列 Active Citizenship Badge Series \n\n51\n\n<!-- p.52 -->\n#### 深 資 童 軍 急 救 章 **Venture Scout First Aid Badge** \n\n凡獲取本會急救證書或其他根據香港法例第 509 章職業安全及健康條例 的勞工處認可的三十小時急救課程證書者，可在證書有效期內佩戴此專 章。 \n\n52\n\n<!-- p.53 -->\n#### 宗 教 章 **Religious Badge** \n\n###### **研習及考覈** \n\n深資童軍可選擇下列其中一項宗教課程進行研習，考覈可由深資童軍 團領袖自行安排適當人士協助，如法師、牧師、神職人員、主日學導 師等。 \n\n###### **(A)  天主教** \n\n1. 認識： \n\n   - a. 擁有《聖經》及明白《聖經》之組成。 \n\n   - b. 誦念玫瑰經（二十端）。 \n\n   - c. 認識教會的年曆。 \n\n   - d. 簡述七件聖事的意義。 \n\n   - e. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - a. 參與一個善會（堂區性或教區性教友組織）的活動，並作文述 報告。 \n\n3. 服務： \n\n   - a. 明白祈禱的方法及意義，並在團集會／童軍活動中帶領祈禱。 \n\n   - b. 指導團員參與感恩祭。 \n\n   - c. 協助一位幼童軍／童軍考取宗教章（天主教課程）。 \n\n53\n\n<!-- p.54 -->\n###### **(B)  基督教** \n\n###### 1. 認識： \n\n   - a. 擁有《聖經》新舊約全書。 \n\n   - b. 誦念主禱文及使徒信經，並解釋其意義。 \n\n   - c. 唱聖詩七首（自選）。 \n\n   - d. 敘述聖經故事六則。舊約三則，包括出埃及記故事；新約三則， 包括耶穌被釘十字架的故事。 \n\n   - e. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - a. 參與教會活動，如主日崇拜、青年團契或詩班等，並作文述報告。 \n\n3. 服務： \n\n   - a. 明白十字架的意義，並領導小組研討。 \n\n   - b. 使用《聖經》，並在團集會／童軍活動中講解耶穌「道成肉身」 救贖的意義及引述有關經文。 \n\n   - c. 在團集會／童軍活動中帶領祈禱。 \n\n   - d. 協助一位幼童軍／童軍考取宗教章（基督教課程）。 \n\n###### **(C)  伊斯蘭教** \n\n###### 1. 認識： \n\n   - a. 擁有中文版的《古蘭經》及示範如何使用。 \n\n   - b. 明白伊斯蘭的意義是和平與順從。 \n\n   - c. 誦念及明白清真言「萬物非主，唯有真主，穆罕默德，是主差使」 的意義。 \n\n   - d. 說出聖訓三則。 \n\n   - e. 說出全世界穆斯林信徒的數目及香港各間清真寺的位置。 \n\n   - f. 解釋念、禮、齋、課、朝五功的意義。 \n\n   - g. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 服務： \n\n   - a. 協助一位幼童軍／童軍考取宗教章（伊斯蘭教課程）。 \n\n54\n\n<!-- p.55 -->\n###### **(D)  孔教** \n\n1. 認識： \n\n   - a. 認識並尊重中國傳統文化和儒教思想。 \n\n   - b. 誦念及明白《禮運 · 大同》和《孟子經訓》。 \n\n   - c. 說出《四書》、《五經》、《六藝》、《八德》的名目。 \n\n   - d. 唱《孔聖頌》及明白其意義。 \n\n   - e. 在《論語》中摘出章句五則，並解釋其意義。 \n\n   - f. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - a. 每年拜祭祖先、天地。 \n\n   - b. 參與孔聖誕、孟子誕辰典禮或傳統祭禮，認識和遵守有關禮儀。 \n\n   - c. 參觀傳統廟宇，與孔教團體進行交流活動，並作文述報告。 \n\n3. 服務： \n\n   - a. 協助一位幼童軍／童軍考取宗教章（孔教課程）。 \n\n###### **(E)  佛教** \n\n1. 認識： \n\n   - a. 擁有及誦念《佛經》和早晚《念誦儀規》。 \n\n   - b. 唱佛寶歌及明白其意義。 \n\n   - c. 講述佛教故事三則。 \n\n   - d. 解釋因果定義。 \n\n   - e. 認識「皈依三寶」的意義。 \n\n   - f. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - a. 參與浴佛禮及佛教活動，並作文述報告。 \n\n   - b. 曾參與「皈依三寶」的儀式。 \n\n3. 服務： \n\n   - a. 領導佛教青少年團研討佛教教理。 \n\n   - b. 協助一位幼童軍／童軍／深資童軍皈依三寶。 \n\n   - c. 協助一位幼童軍／童軍考取宗教章（佛教課程）。 \n\n55\n\n<!-- p.56 -->\n###### **(F)  道教** \n\n1. 認識： \n\n   - a. 擁有《道德經》，並解釋其中五章的意義。 \n\n   - b. 誦念《太上道祖頌》，並解釋其意義。 \n\n   - c. 認識道教「呂祖百字碑」訓詞的意義。 \n\n   - d. 說出道教「三清」的名號。 \n\n   - e. 解釋「道家三寶」、「道德經第八章之七善」、「呂純陽祖師之 九美德」的意義。 \n\n   - f. 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - a. 參觀兩間道教宮觀，並作文述報告。 \n\n3. 服務： \n\n   - a. 在團集會／童軍活動中講述道祖生平故事或其他一位仙師的故 事。 \n\n   - b. 協助一位幼童軍／童軍考取宗教章（道教課程）。 \n\n56\n\n<!-- p.57 -->\n#### 樂 行 童 軍 先 修 章 **Rover Scout Link Badge** \n\n###### **目的︰** \n\n樂行童軍先修章之設立旨在幫助適齡之深資童軍支部成員認識樂行童軍 支部活動，鼓勵他們晉升為樂行童軍。 \n\n年滿十九歲之深資童軍支部成員可考取樂行童軍先修章，完成後由其深 資童軍團長簽發。在特殊情況下，可由區、地域或總會委派指定人士簽 發。深資童軍團領袖應鼓勵及安排團內之成員認識及參與樂行童軍支部 活動。區總監或其代表有責任協助區內之深資童軍團推行先修章考覈， 尤其是沒有開辦樂行童軍團或因事未能安排有關活動之童軍旅。 \n\n樂行童軍啟導班是樂行童軍肩章內的選擇項目，定位為樂行童軍生涯的 開始。旨在透過啟導班課程讓樂行童軍對所屬支部及訓練綱要有基本的 認識，引領成員體會及明白「樂行童軍之道」；以活動形式讓他們體驗 童軍生活、學習基本童軍技能，並作為平臺讓不同背景的樂行童軍互相 交流。 \n\n###### **對象：** \n\n19 歲或以上對樂行童軍有興趣之深資童軍或外界人士。 \n\n###### **內容：** \n\n1. 完成由區 / 地域 / 總會認許之樂行童軍啟導班；或完成同等項目（內 容請參照附錄之「樂行童軍啟導班課程概要」）。 \n\n2. 參與最少2次由同一個樂行童軍團所舉辦的團活動，例如：綜合晚會、 旅團聯合活動、旅團開放日及集會。 \n\n備註： \n\n1. 完成「樂行童軍先修章」之成員於晉團及獲取會員章後將視作已完成「樂行童軍肩 章」考驗。 \n\n57\n\n<!-- p.58 -->\n#### 社 區 參 與 章 \n\n##### **Community Involvement Badge** \n\n「社區參與章」旨在培養深資童軍的助人精神，透過社區教育、發展及 服務模式，瞭解社會上的各種問題和需要，認識與生活息息相關的政策， 並以行動來參與社區事務，培養良好公民應具備的責任感，共同締造一 個和諧及互相關懷的社會。 \n\n計劃由（甲）項的專題研習班及（乙）項的實習活動組成。專題研習班 設有7 個課題，包括： \n\n( 一) 環境清潔及衞生； \n\n( 二) 肅貪倡廉； \n\n- ( 三) 撲滅罪行； \n\n- ( 四) 藥物教育； \n\n- ( 五) 平等機會； \n\n- ( 六) 愛滋病預防教育；及 \n\n- ( 七) 尊重知識產權。 \n\n###### **審核要求:** \n\n參加者必須於六個月內完成( 甲) 項及( 乙) 項內各項要求： \n\n- ( 甲) 完成上述最少一個總會認許之專題研習班，並能夠： \n\n1. 說出及解釋所選課題的相關知識，列舉應有的技巧和建立應有的態 度； \n\n2. 闡述社區參與的目的及意義、模式及方法；及 \n\n3. 述說如何有效策劃及組織「社區參與」活動。 \n\n58\n\n<!-- p.59 -->\n- ( 乙) 完成專題研習班中所選課題的實習活動，並達到下列各項要求﹕ \n\n1. 提交一份所選課題的個人紀錄冊，內容應包括該課題的資料，當中 不少於三份相關內容的剪報，並必須附有個人評論及提出可行的建 議； \n\n2. 以小組形式完成一份由班領導人指定之專題研習，並須在班內或向 外發佈及帶領討論； \n\n3. 獲班領導人同意後，以小組形式協助推行一項由香港特別行政區政 府（或政府註冊的社會服務機構）所舉辦的活動；或以小組形式自 行組織、策劃及推行一項社區服務，並向審核員呈交活動計劃書及 報告書；及 \n\n4. 參與由特區政府所推行之大型推廣運動（只適用於個別課題）。 \n\n59\n\n<!-- p.60 -->\n#### 香港青年獎勵計劃 **The Hong Kong Award For Young People** \n\n###### **簡介** \n\n香港青年獎勵計劃（前身為香港愛丁堡公爵獎勵計劃），是國際青年獎 勵計劃協會成員之一。獎勵計劃擁有一套國際既定的原則，讓年青人透 過完成章級要求，培養勇於挑戰及堅毅的精神。 \n\n詳情請參閱以下的網站： \n\n香港青年獎勵計劃 The Hong Kong Award For Young People \n\n60\n\n<!-- p.61 -->\n#### 航空活動徽章 **Air Activity Badges** \n\n「空勤員章課程」分為初級空勤員章、中級空勤員章及高級空勤員章三 個階段課程，為深資童軍成員提供全面而富趣味的航空培訓，包括航空 知識、飛行知識及模擬飛行訓練三大範疇。徽章的設計亦加入代表飛行 訓練的螺旋槳及飛行之半翼，標誌成員以此作為邁向實際飛行的起步點。 \n\n詳情請參閱以下的網站： \n\n空勤員章課程 The Aircrew Syllabus \n\n飛行章 及 跳傘章 Scout Wings \n\n& Scout Canopy Wings \n\n61\n\n<!-- p.62 -->\n#### 海上活動徽章 **Sea Activity Badges** \n\n「童軍標準艇課程（深資童軍支部課程）」分為水手長章（三級童軍標 準艇證書）、副舵手章（四級童軍標準艇證書）及舵手章（五級童軍標 準艇證書）三個階段課程，為深資童軍成員提供進階之海上活動訓練。 如由童軍支部成員晉升為深資童軍支部成員，並已考獲三級童軍標準艇 證書，在晉升為深資童軍支部成員後，可直接佩戴深資童軍水手長章。 \n\n詳情請參閱以下的網站： \n\n海上活動徽章 Sea Activity Badges \n\n62\n\n<!-- p.63 -->\n#### 第五章 徽章簽發 / 領取 / 購買 **CHAPTER 5 : Procedures and Guidelines on Issue and Collection/Purchase of Badges** \n\n詳情請參閱以下的網站： \n\n63\n\n<!-- p.64 -->\n#### 第六章 典禮與儀式 **CHAPTER 6 : Ceremonies and Rituals** \n\n詳情請參閱以下的網站： \n\n64\n\n<!-- p.65 -->\n#### 第七章 附 錄 **CHAPTER 7 : Appendices** \n\n詳情請參閱以下的網站： \n\n全港深資童軍錦標賽 Hong Kong Venture Scout Competition \n\n深資童軍議會 Venture Scout Council \n\n65\n\n<!-- p.66 -->\n深資童軍發展史 Hong Kong Venture Scout History \n\n常見問題 Frequently Asked Questions \n\n66\n\n<!-- p.67 -->\n#### 考驗/ 訓練班開辦指引 **Assessment/Course Guidelines** \n\n詳情請參閱以下的網站： \n\n67\n\n<!-- p.68 -->\n#### 鳴謝 \n\n#### **Acknowledgments** \n\n此版本之綱要能夠面世，實有賴深資童軍訓練綱要發展小組及深資童軍 訓練綱要工作小組各成員，及其他有關人士之鼎力協助，不辭勞苦地參 與編纂工作。謹此致謝。 \n\n|黎偉生|香港總監|\n|---|---|\n|陳勇<br>|副香港總監（活動與訓練）<br>|\n|吳家亮<br>|副香港總監（常務）<br>|\n|陳狄安<br>|助理香港總監（青少年活動）<br>|\n|盧沛霖<br>|支部訓練檢討委員會召集人<br>|\n|張俊彥<br>|副青少年活動總監（支部）<br>|\n|邵鈞泰|助理青少年活動總監（支部）|\n|* fe. Through a higher degree of autonomy and responsibility in training, they are prepared to learn self-management, planning, and leading others. The training at this stage helps young people gradually establish clear personal goals and their direction in life. \n\nWith \"Self-governing and Self-programming, Tomorrow's Leaders\" as its core educational goal, the Venture Scout Section encourages members to proactively plan activities, participate in service, and take on challenges within a self-governing framework. This hones their organisational and communication skills, decision-making abilities, and spirit of commitment, preparing them to become young leaders. Through practical experiences, members learn to take responsibility for their decisions and develop a mature leadership mindset. \n\nThe newly revised training scheme clearly integrates the progressive badge system as a learning system, emphasising equal importance on planning, action, and reflection. It assists Venture Scouts in building mature thinking and consistent attitudes, while cultivating the ability for continuous selfimprovement. This edition continues to place greater emphasis on the depth and quality of learning. \n\nThe new training scheme also strengthens the connection between Venture Scouts and the community. Through practical service and teamwork, it guides members to care about social needs, apply what they have learned in real-world situations, and develop a sense of civic responsibility and social commitment. This makes service not just an activity, but a part of living out one's values. \n\nI would like to express my gratitude to the Sectional Review Committee and all the leaders involved in the revision work for their valuable contributions in perfecting the Venture Scout training system. I hope Venture Scouts will make good use of the learning platform provided by Scouting, be brave in taking on responsibilities, continue to grow, and gradually develop into influential young leaders. \n\nAssistant Chief Commissioner (Programme) Dion CHEN \n\nFebruary 2026 \n\n72\n\n<!-- p.73 -->\n**Foreword** \n\nThe Venture Scout Section encompasses members aged 15 to 20 of the Scout Movement (up to the day before their 21st birthday). Youth members often face various challenges at this stage of their lives. The rapid transition in the academic environment brings immense uncertainty, from senior secondary school and public exams to tertiary education or the workplace. At the same time, they are gradually transforming from adolescents to adults, undergoing changes in social responsibility, identity, and lifestyle balance. These are exactly the educational needs addressed by this training scheme: \n\nThe main revisions of this syllabus are as follows: \n\n1. Strengthening the self-programming and self-governing method of the Venture Scout Section. The current \"Venture Scout Executive Committee Workshop\" has been specifically revised. In addition to creating a better understanding of the Unit Executive Committee, it also emphasises how to make effective decisions at meetings and to systematically organise activities in a programme. The course helps new members in particular to build networks with peers to support their future projects. \n\n2. Strengthening the element of choice. New options have been added while preserving the traditional training in Scoutcraft behind this highest award for youth members. For example, three new options have been added under the Service Badge (Sign Language, Mental Health First Aid, SOUL Keeper Course), and more ways to complete the Activity Badge under the category of \"New Experience\". \n\nIt is hoped that under the eleventh edition of the Venture Scout Training Scheme, Venture Scouts will make the best use of their time to receive the best training, contributing to the development of the Scout Movement and society, while fulfilling their personal development. Finally, on behalf of the Scout Association of Hong Kong, I would like to thank those who have put effort and contributed to the compilation of this training scheme. \n\nProgramme Branch Programme Branch Headquarters Commissioner           Assistant Headquarters Commissioner (Venture Scouts) (Venture Scouts) WU Wan-lung HUI Chun \n\nFebruary 2026 \n\nFebruary 2026 \n\n73\n\n<!-- p.74 -->\n###### **Contents** \n\n|**Preface**|**72**|\n|---|---|\n|**Foreword**|**73**|\n|**Contents**|**74**|\n|**Introduction**|**76**|\n\n###### **CHAPTER 1: Organization and Rules of Venture Scout Section** \n\n**Organization & Rules of  the Venture Scout Section 78 Uniform for Venture Scouts 83** \n\n|**CHAPTER 2:  Venture Scout Training Program**|**me**|\n|---|---|\n|**Flow Chart of Venture Scout Progressive Award**|**85**|\n|**Membership Badge**|**86**|\n|**Venture Scout Epaulettes**|**88**|\n|**Venture Scout Award**|**90**|\n|**Dragon Scout Award**|**91**|\n|**Badges Design**|**93**|\n|**Project Badge**|**94**|\n|**Service Badge**|**97**|\n|**Activity Badge**|**101**|\n|**Category I: Scoutcraft**|**102**|\n|**Category II: Physical Recreation**|**104**|\n|**Category III: New Experience**|**106**|\n|**\"Scoutcraft\" Self-organised Team Assessment Content**|**108**|\n|**Exploration Badge**|**111**|\n|**Exploration Guidelines**|**116**|\n|**Journey with Purpose**|**119**|\n\n74\n\n<!-- p.75 -->\n###### **CHAPTER 3: Badges issued by the World Organisation of the Scout Movement** \n\n|**Badges issued by the WOSM**|**121**|\n|---|---|\n|**CHAPTER 4 : Other Awards and Badges**||\n|**Other Awards and Badges**|**122**|\n|**Active Citizenship Badge Series**|**123**|\n|**Venture Scout First Aid Badge**|**124**|\n|**Religious Badge**|**125**|\n|**Rover Scout Link Badge**|**129**|\n|**Community Involvement Badge**|**131**|\n|**The Hong Kong Award For Young People**|**133**|\n|**Air Activity Badges**|**134**|\n|**Sea Activity Badges**|**135**|\n|**CHAPTER 5 : Procedures and Guidelines on**<br>**Issue and Collection/Purchase of Badges**||\n|**Procedures and Guidelines**|**136**|\n|**CHAPTER 6 : Ceremonies**||\n|**Ceremonies**|**137**|\n|**CHAPTER 7 : Appendices**||\n|**Hong Kong Venture Scout Competition**|**138**|\n|**Hong Kong Venture Scout Council**|**138**|\n|**Hong Kong Venture Scout History**|**139**|\n|**Frequently Asked Questions**|**139**|\n|**Assessment/Course Guidelines**|**140**|\n|**Acknowledgments**|**141**|\n\n75\n\n<!-- p.76 -->\n###### **Introduction** \n\nThis book sets out the organisation, rules and training scheme of the Venture Scout Section. It also details the assessment requirements and standards of various Awards. \n\nThis is an official Training Handbook of Scout Association of Hong Kong. Its contents must be closely observed by all leaders. Any further amendments will be announced by circular. \n\n###### **What is self-governing?** \n\nSelf-governing means the Venture Scout Unit and Unit affairs are selfmanaged by the Unit Executive Committee based on a democratic electoral system and the principles of Scouting. \n\n###### **What is self-programming?** \n\nSelf-programming means the Unit members devise their own calendar based on the needs of the Unit, take active participation in training, service and all kinds of competitions, so that they are recognised as capable of organising and of playing an adult role in society. \n\nSelf-governing and self-programming must be applied in coordination so as to develop the characteristics and personalities of Venture Scouts in a comprehensive way. The ultimate goal is to let Venture Scouts accumulate more Scouting-based management experience and to nurture the essential qualities of a leader. \n\n###### **Role of Leaders** \n\nLeaders are role models of Unit members. They should provide guidance for members of the Executive Committee and other working groups. Related guidance includes planning and suggestions before an activity, and debriefi ng and refl ection after the activity. However, leaders should give freedom to members to implement their plans so that they can help develop members’ leadership skills. \n\n76\n\n<!-- p.77 -->\n###### **Role of Issuing Persons of Badges** \n\nIssuing persons may sign and issue valid certificates for badges. They may enlist the help of a relevant assessor in confirming the completion of various requirements. \n\n- Membership Badge: Membership badge is awarded by the Venture Scout Leader after consulting the Unit Executive Committee. \n\n- Venture Scout Epaulettes: Venture scout epaulettes are awarded by the Venture Scout Leader and may assign an assessor to oversee the completion of requirements. \n\n- Badges: Badges are awarded by the Venture Scout Leader. Venture Scout Leaders may assign appropriate assessors to oversee requirements of badges. If the Venture Scout Leader is unable to arrange appropriate assessors, the respective District Commissioner, or their representative, usually the Assistant District Commissioner (Venture Scouts), are responsible for assisting the Venture Scouts. \n\n- Bars: Bars are awarded by District Commissioners, Regional Commissioners, the Programme Commissioner, or their representatives, and may assign appropriate assessors. Venture Scouts should seek the assistance of their Venture Scout Leader and District in arranging for appropriate assessors. If the Venture Scout Leader and District is unable to arrange appropriate assessors, the respective Regional Commissioner, or their representative, usually the Regional Headquarters Commissioner (Venture Scouts) or the Assistant Regional Headquarters Commissioner (Venture Scouts), are responsible for assisting the Venture Scouts. \n\n###### **Role of Assessors** \n\nIn general cases, the issuing person can act as an assessor. The issuing person can also arrange for a person with relevant qualifications to act as the assessor. An appropriate assessor can be a professional in the relevant field and does not necessarily have to be a Scout leader; however, the issuing person needs to provide clear instructions on award requirements to the assessor. \n\n77\n\n<!-- p.78 -->\n###### **CHAPTER 1: Organization and Rules of  the Venture Scout Section** \n\n###### **The Aim** \n\nThe aim of the Venture Scout Section is to continue the progressive training of the Scout Section in order to pass the torch to the new generation in the Scout Movement, and nurture future leaders for our society. \n\nThe educational goal of the Venture Scout Section is \"Self-governing and Self-programming, Tomorrow's Leaders\". \n\nVenture Scouts adopt a self-governing and self-programming approach. Through life outdoors, challenging themselves, and progressive training, they learn self-study, self-reliance, and selfdiscipline; forge physical fitness; foster planning, organisational, and leadership skills; embrace teamwork; enhance interpersonal skills; practise team spirit; and prepare themselves to take a constructive place in society. \n\n###### **The Method** \n\nGuided by adult leaders, Venture Scouts apply the Executive Committee system. Through self-governing and self-programming, Venture Scout Units shall have progressive and challenging activities and training to achieve the Aim of the Venture Scout Section. \n\n###### **The Scout Promise** \n\nOn my honour, I promise that I will do my best To do my duty to God and to my Country To help other people And to keep the Scout Law. \n\n###### **The Scout Law** \n\n1. A Scout is to be trusted. \n\n2. A Scout is loyal. \n\n3. A Scout is friendly and considerate. \n\n4. A Scout belongs to the worldwide family of Scouts. \n\n5. A Scout has courage in all difficulties. \n\n6. A Scout makes good use of time and is careful of possessions and property. \n\n7. A Scout has self-respect and respect for others. \n\n78\n\n<!-- p.79 -->\n**The Scout Motto** Be Prepared \n\n###### **Age Range** \n\nThe age range of the Venture Scout Section is from 15 to 20 years old. The Venture Scout membership will end upon reaching 21 years of age. \n\n**Minimum Standards of a Venture Scout Unit** According to the Association's Policy, Organisation and Rules: \n\n- Numbers: An established Venture Scout Unit shall have a minimum of six Venture Scouts. \n\n• Leaders: There shall be at least two Leaders for the Unit and at least one of them is a Warranted Leader. There shall be at least one Leader who is of the same gender as the Members; and if the Unit has both male and female Members, there shall be both male and female Leaders. \n\n- Youth Programme and Training: The programme and training of Venture Scouts shall be in accordance with the \"Venture Scout Training Scheme\" and any amendments thereto published by the Association Headquarters. \n\n- Unit Executive Committee: The Unit Executive Committee is responsible for organising the annual programme of the Unit. \n\n- **Internal Organisation of a Venture Scout Unit** 1. General Meeting \n\n   - 1.1 Responsibility \n\nThe General Meeting is the highest administration authority of a Venture Scout Unit. The General Meeting can write and amend the Unit Constitution, formulate long-term plans for the Unit, elect Executive Committee members, review the programme and training planned by the Executive Committee and other temporary working groups, and audit the financial position of the Unit. The General Meeting should be convened at least once a year. \n\n79\n\n<!-- p.80 -->\n###### 1.2 Composition \n\nAll valid Venture Scout members. \n\n###### 1.3 Authority \n\nAll valid Venture Scout members can vote for specific issues via a democratic and fair voting system. Unless the results violate the principles of Scouting, all voting related to Unit affairs will be considered final. \n\n###### 2. Executive Committee \n\n###### 2.1 Responsibility \n\nThe Unit Executive Committee is responsible for the composition, organisation, programme, training, and administration of the Unit as decided in the General Meeting. Short-term planning should be initiated by the Executive Committee in the first instance. \n\n###### 2.2 Composition: \n\nAn Executive Committee should have a Chairperson, Secretary, Treasurer and other positions as deemed appropriate, depending on the results of the General Meeting and the size of the Unit. The Executive Committee members, including the Chairperson and other members, shall be elected by the Unit members. Positions on the Executive Committee can be elected during the General Meeting or within the Executive Committee. There can be various election methods, e.g. plurality voting system, parliamentary system, two-round system, cumulative voting system, and proportional representation. Elections can be done position by position or by electing the committee members first before deciding the allocation of positions. No matter which voting system is used, it should be determined in accordance with the Unit’s situation. The election method should be clearly stated in the Unit Constitution as well. \n\n###### 2.3 Authority \n\nThe General Meeting and the Unit Constitution empower the Executive Committee and its members to handle administrative and general affairs of the Unit. However, if there exists any motion that is related or of interest to the whole membership of the Unit, all related matters must be discussed and voted on during the General Meeting. \n\n80\n\n<!-- p.81 -->\n3. Temporary working groups \n\n   - 3.1 Responsibility \n\nTemporary working groups are mainly responsible for implementing special activities of the Unit. The exact job duties shall be decided by the Executive Committee. \n\n- 3.2 Composition \n\nMembers of the temporary working groups are Unit members who join voluntarily or are appointed by the Executive Committee. Venture Scout Units with more members can let non-Executive Committee members participate in Unit affairs and activity planning through temporary working groups, so that Venture Scouts have the opportunities to develop their leadership. The Chairperson and other positions of the temporary working groups are decided by the group members through election or appointment. \n\n- 3.3 Authority \n\nSince temporary working groups are appointed by the Executive Committee, group members report directly to the Executive Committee and are responsible to all Unit members. \n\n###### **Responsibilities and Requirement of Leaders** \n\n4. Role of Leaders \n\n   - 4.1 Leaders of a Venture Scout Unit are advisors in the General Meeting and shall provide opinions for Unit members. \n\n   - 4.2 All leaders of a Venture Scout Unit are ex-officio members of the Unit Executive Committee. The Venture Scout Leader, depending on the maturity and experience of the Unit members, may choose to be the Chairman of the Unit Executive Committee, or assign any Unit leaders to take up any positions in the Executive Committee. \n\n   - 4.3 The Venture Scout Leader is the Unit person-in-charge with the highest authority. He/ she possesses the right to interpret and the power to veto motions passed during meetings within the Unit. If any decisions made during meetings within the Unit violate the principles of Scouting, the Venture Scout Leader has the responsibility and the power to veto relevant voting results and terminate the related activities. \n\n81\n\n<!-- p.82 -->\n###### **Expected Outcomes** \n\nVenture Scouts should actively participate in or organise various activities (such as skill training, service, competitions, etc.), serve as members of the Unit Executive Committee, working groups, and the Venture Scout Councils of the Regions and Association Headquarters, and try to take on leadership roles in various activities. Upon completing their Sectional training, Venture Scouts should be able to achieve the following expected outcomes: \n\n1. Advancing their Scoutcraft and inspire the development of diverse \"Activity Badge\"; \n\n2. Master \"Project\" skills and develop their leadership skills as \"Tomorrow's Leaders\"; \n\n3. Broaden personal networks and build team spirit; \n\n4. Develop the self-programming and self-governing spirit and sense of “Service Badge”; \n\n5. Enjoy \"Exploration\", broaden horizons, and thereby appreciate and respect nature. \n\nOn completion of their Venture Scout training or reaching the age of 21, a Venture Scout may continue their Scouting life by serving as an adult leader or joining a Rover Scout Crew. The Rover Scout Section is the fifth Training Section that aims to connect and provide opportunities and support to young people who care about our society and are devoted in services to serve the Scout Movement and the community. \n\n82\n\n<!-- p.83 -->\n###### **Uniform for Venture Scouts** \n\n###### **Basic Ornaments, Accessories and Badges** \n\n###### **Male** \n\n||Venture Scout|Venture Air Scout|Venture Sea Scout|\n|---|---|---|---|\n|Headgear|Maroon beret with<br>Scout Hat Badge|Greyish blue beret<br>with Scout Hat<br>Badge|Sea Scout male<br>adult white top<br>peak cap with<br>Venture Sea Scout<br>CapBadge|\n|Shirt|Beige, short<br>sleeves,<br>two front pockets,<br>two shoulder<br>straps|Light blue, short<br>sleeves, two front<br>pockets,<br>two shoulder<br>straps|White, short<br>sleeves, two front<br>pockets,<br>two shoulder<br>straps|\n|Trousers|Olive, two sides<br>and<br>two hip pockets<br>withpleats|Navy blue, two<br>sides and two hip<br>pockets<br>withpleats|Navy blue, two<br>sides and two<br>hip pockets with<br>pleats|\n|Belt|Brown|,with Scout Badge b|uckle|\n|Hosiery||Black socks||\n|Shoes|Bla|ck, plain design,lac|ed|\n|Scarf|Gr|oupscarf with Wog|gle|\n|Tie|Maroon tie|Navyblue tie|Black tie|\n|Badges|World Membe<br>Region|rship Badge, Hong<br>,District and Group|Kong Emblem,<br>Badges|\n\nRemarks: \n\n1. The above table is for reference only. The Association Headquarters will announce any amendments by issuing circular. \n\n83\n\n<!-- p.84 -->\n###### **Female** \n\n||Venture Scout|Venture Air Scout|Venture Sea Scout|\n|---|---|---|---|\n|Headgear|Maroon beret with<br>Scout Hat Badge|Greyish blue beret<br>with Scout Hat<br>Badge|Sea Scout male<br>adult white top<br>peak cap with<br>Venture Sea Scout<br>CapBadge|\n|Shirt|Beige, short<br>sleeves,<br>two front pockets,<br>two shoulder<br>straps|Light blue, short<br>sleeves, two front<br>pockets,<br>two shoulder<br>straps|White, short<br>sleeves, two front<br>pockets,<br>two shoulder<br>straps|\n|Trousers|Olive, two sides<br>and<br>two hip pockets<br>withpleats|Navy blue, two<br>sides and two hip<br>pockets with pleats|Navy blue, two<br>sides and two<br>hip pockets with<br>pleats|\n|Skirt|Olive, A-shaped<br>knee length<br>without pleats|Navy blue,<br>A-shaped knee<br>length without<br>pleats|Navy blue,<br>A-shaped knee<br>length without<br>pleats|\n|Belt|Brown|,with Scout Badge b|uckle|\n|Hosiery|Nylon stockin<br>Black|gs, plain design (w<br>or<br>socks(worn with tro|orn with skirt)<br>users)|\n|Shoes|Black, plain desi<br>Black, plain d|gn, non-laced, mid<br>skirt)<br>or<br>esign,laced(worn|heels (worn with<br>with trousers)|\n|Scarf|Gr|oupscarf with Wog|gle|\n|Tie|Maroon tie|Navyblue tie|Black tie|\n|Badges|World Membe<br>Region|rship Badge, Hong<br>,District and Group|Kong Emblem,<br>Badges|\n\nRemarks: \n\n1. The above table is for reference only. The Association Headquarters will announce any amendments by issuing circular. \n\nFor details, please refer to the \"Unifrom Handbook \". \n\n<!-- Start of picture text -->\n84<br><!-- End of picture text -->\n\n<!-- p.85 -->\n**CHAPTER 2: Venture Scout Training Programme** \n\n**Flow Chart of Venture Scout Progressive Award** \n\n<!-- Start of picture text -->\nMembership<br>Badge<br>Arranged by the Venture Scout Leader and the Unit Executive Committee<br>Venture Scout<br>Epaulettes<br>Understanding<br>Scoutcraft<br>On completion of the Venture Scout Epaulettes, Venture Scouts can make<br>assessment plans for the Venture Scout Award and the Dragon Scout Award.<br>Assessments arranged by the Venture Scout Leader<br>Project Service Activity Exploration<br>Badge Badge Badge Badge<br>Venture Scout<br>Award<br>On completion of any one badge, Venture Scouts can start discussing<br>the attainment of the corresponding Bar with the designated person of the District.<br>Assessments arranged by the designated person of the District<br>Project Service Activity Exploration  Dragon Scout<br>Bar Bar Bar Bar Award<br><!-- End of picture text -->\n\nRemarks: \n\n1. When approaching the completion of the Venture Scout Epaulettes, Venture Scouts can start making plans for achieving the Venture Scout Award and the Dragon Scout Award with their respective Venture Scout Leaders by using “Planning for Assessment of the Venture Scout Award and the Dragon Scout Award(PT/65)” (Planning Form as below). Venture Scout Leaders should provide guidance and help arrange the assessments of the Badges (Introduction of the Venture Scout Award assessments can be found on P.90). \n\n2. On completion of any one Badge, Venture Scouts can contact respective Districts and start discussing the planning for achieving the Dragon Scout Award. (Introduction of the Dragon Scout Award assessments can be found on P.91). Venture Scouts shall update their personal Planning Form based on their actual situations to review on their own and let Venture Scout Leaders and Districts know their progress and follow up. \n\n85\n\n<!-- p.86 -->\n###### **Membership Badge** \n\nThe Membership Badge aims to help newly joined Venture Scouts familiarise themselves with their Units, fostering fellowship between members and mutual acceptance. \n\nThis badge is awarded by the Venture Scout Leader after consulting the Executive Committee of the Unit. \n\nComplete the following items: \n\n###### **Activity** \n\n1. Participate in six Unit activities or meetings, one of which shall be outdoors. \n\n###### **Understanding** \n\n1. Understand the aims of the Scout Movement and what is expected of you as a Venture Scout. \n\n2. Have knowledge of the Scout Movement in Hong Kong and the world. \n\n3. Identify the National Flag and National Emblem of the People's Republic of China, and explain their meanings. \n\n4. Identify the Regional Flag and Regional Emblem of the Hong Kong Special Administrative Region, and explain their meanings. \n\n5. Understand the meaning of the National Anthem of the People’s Republic of China and be able to sing it by memory. \n\n86\n\n<!-- p.87 -->\n###### **Ceremony** \n\n1. Know how to act during the investiture ceremony and the basic movements of Chinese Foot Drill. \n\n2. Know the proper etiquette to be displayed when the National Anthem is played, and when the National Flag and Regional Flag are raised, as well as the basic procedures for National and Scout flag-raising ceremonies. \n\n3. Know the regulations for the use and the display of the National and the Regional flags as well as the National and Regional emblems. \n\n4. Demonstrate how to raise the National Flag and Regional Flag. \n\n###### **Promise** \n\n1. Accept the Scout Promise and Law. \n\n###### **Safe from Harm (Effective from 1 July 2025)** \n\n1. Complete one of the following: \n\n   - a. Possess a basic understanding of child and youth protection, including prevention and response methods; or \n\n   - b. Complete the “Safe from Harm Online Self-Learning Course”. \n\n- \"Active Citizenship Badge Series - Child Protection Badge\" \n\n- “Safe from Harm Online Self-Learning Course” \n\n87\n\n<!-- p.88 -->\n###### **Venture Scout Epaulettes** \n\nThe Venture Scout Epaulettes aims to provide a foundation for newly invested Venture Scouts to gain basic knowledge and skills of Venture Scout activities and Scoutcraft. \n\nThe Venture Scout Leader and Unit Executive Committee should arrange new members to take part in this training. Upon completion of all requirements, the Venture Scout Epaulettes will be awarded by the Venture Scout Leader. Under normal circumstances, new members should complete all items for this award within six months of joining. New members can complete this award by participating in overnight activities of two days and one night, or more, and Unit meetings with Venture Scouts from within or outside their Unit. \n\nIf a Venture Scout has already completed the Venture Scout Link Badge or related content during their time in the Scout Section, the Venture Scout Leader may issue the epaulettes directly. \n\n- **(I)  Knowledge (Members who have obtained the \"Venture Scout Link Badge\" in the Scout Section may be exempted)** \n\n1. State the aim, method, and expected outcomes of the Venture Scout Section. \n\n2. Recognise the Venture Scout uniform. \n\n3.  Understand the four sections of the Venture Scout Award and Dragon Scout Award. \n\n4.  Understand how the Venture Scout Award and Dragon Scout Award relate with other organisations. \n\n5.  State the basic functions of the Executive Committee. \n\n6.  State the organisation of the Executive Committee and the duties of its members. \n\n7.  Understand the methods for forming the Executive Committee. \n\n8.  Understand the role of leaders in the Executive Committee. \n\n9.  Recognise the diverse variety of activities available in Venture Scouting. \n\n10.  Attend at least one Unit Executive Committee meeting. \n\n88\n\n<!-- p.89 -->\n###### **(II) Scoutcraft (Members who have obtained the \"Scout Standard Award\" in the Scout Section may be exempted)** \n\n###### **Campcraft** \n\n1.  Complete a two days, one night camp with Venture Scouts. \n\n2.  Prepare a personal and team equipment list suitable for a two days, one night  Patrol camp. \n\n3.  Pack a rucksack and personal first aid kit for a two days, one night camp. \n\n4.  Pitch, strike, and store a tent correctly. \n\n5.  Be familiar with and correctly use a gas stove and a penknife, and know the relevant safety measures. \n\n6.  Design a menu for a two days, one night Patrol camp and cook one of the dishes individually. \n\n7.  Light a fire using matches and natural materials. \n\n###### **Knotting** \n\n1.  Demonstrate the following knots and state their uses: Reef Knot, Sheet Bend, Figure-of-Eight Knot, Clove Hitch, Bowline, Timber Hitch, Square Lashing, Diagonal Lashing, and Figure-ofEight Lashing. \n\n###### **Expedition** \n\n1.  Know the types of maps commonly used in outdoor activities and the meaning of map symbols. \n\n2.  Participate in an outdoor activity using a map and compass, demonstrating how to set the map and use the compass to find the correct direction of travel. \n\n###### **First Aid** \n\n1. Know the purpose and principles of first aid. \n\n2.  Demonstrate methods for handling bleeding, wound care, and simple bandaging. \n\n3.  Demonstrate the treatment for burns, scalds, cramps, and sprains. \n\n89\n\n<!-- p.90 -->\n###### **Venture Scout Award** \n\nVenture Scouts may only begin working towards this award after completing the Venture Scout Epaulettes. \n\nA Venture Scout intending to complete the Venture Scout Award may request the Venture Scout Leader to arrange assessors for each item, or suggest assessors to the Leader for consideration. If the Leader is unable to arrange an assessor for any reason, the relevant District Commissioner and their representatives are responsible for assisting the Venture Scout. \n\nThe Venture Scout Leader, District Commissioner, Regional Commissioner, Programme Commissioner, or their representatives may serve as assessors; however, the elective items in the Exploration section must be assessed by a recognised assessor. \n\nUpon completing any one of the Badges (\"Project\", \"Service\", \"Activity\", and \"Exploration\"), a Venture Scout may wear the corresponding badge on their uniform. It is highly recommended to complete the \"Project\" Badge first. \n\nThe Venture Scout Award is awarded by the Programme Commissioner or their representative. Upon completion of all Badges in the Venture Scout Award, the Venture Scout Leader should give their nomination to the respective District Commissioner or their representative for recommendation to the respective Regional Commissioner. After the approval of the Regional Commissioner or their representative, the Programme Commissioner or their representative will confirm the application and issue the Venture Scout Award. The guidelines for awarding the Venture Scout Award can be found in Chapter 5 : Procedures and Guidelines on Issue and Collection/Purchase of Badges. \n\n90\n\n<!-- p.91 -->\n###### **Dragon Scout Award** \n\nUpon completing any one of the Badges under the Venture Scout Award, a Venture Scout may begin working towards the Dragon Scout Award. They may only commence with the Bar corresponding to the completed Badge. \n\nA Venture Scout wishing to start the Dragon Scout Award should consult the Venture Scout Leader first, then contact the designated representative of their District, usually the Assistant District Commissioner (Venture Scouts), to discuss and devise the plan for the Award. Upon approval, the Venture Scout can start the Dragon Scout Award. \n\nAssessors can be the District Commissioner, Regional Commissioner, Programme Commissioner, or their representatives; however, the elective items in the \"Exploration\" section must be assessed by a recognised assessor. \n\nThe Programme Commissioner authorises the Headquarters Commissioner (Venture Scouts) and Assistant Headquarters Commissioner (Venture Scouts) to handle all matters related to assessments in the Venture Scout Training Scheme. Regional Commissioners and District Commissioners should appoint and announce their representatives to handle all matters related to assessments in the Venture Scout Training Scheme. [The representatives should normally be Regional Headquarters Commissioner (Venture Scouts), Assistant Regional Headquarters Commissioner (Venture Scouts) and Assistant District Commissioner (Venture Scouts)]. \n\nUpon completing all requirements in any section of the Dragon Scout Award (\"Project Bar\", \"Service Bar\", \"Activity Bar\", and \"Exploration Bar\"), the Venture Scout can wear the Bar under the corresponding Badges on the uniform. \n\n91\n\n<!-- p.92 -->\nThe Dragon Scout Award is awarded by the Chief Scout and Chief Commissioner based on the Headquarters’ approval of Regional and District’s recommendation. After completing all items in the Dragon Scout Award, the Venture Scout Leader should give their nomination to the respective District Commissioner or their representation for recommendation. The District Commissioner and the Regional Commissioner or their representatives should recommend the Venture Scout to the Programme Commissioner for the approval of the Dragon Scout Award. The Programme Commissioner or their representative will then approve the Dragon Scout Award application and the certificate will be presented at the Scout Rally. The guidelines for awarding the Dragon Scout Award can be found in Chapter 5 : Procedures and Guidelines on Issue and Collection/ Purchase of Badges. \n\nA Venture Scout who has finished all requirements in the Dragon Scout Award shall have interviews with the District Commissioner and Regional Commissioner in recognition of their and for their recommendation. \n\n92\n\n<!-- p.93 -->\n### DESIGN CONCEPTS FOR VENTURE SCOUT BADGES \n\n###### PROJECT \n\nThe Project Badge aims to cultivate members' abilities in project management and teamwork. The image of two people working together on a puzzle symbolizes the spirit of collaboration. The puzzle pieces represent the unique and vital role each member plays in a project, emphasizing the importance of effective communication and synergy. \n\n###### SERVICE \n\nThe Service Badge is designed to foster a spirit of altruism. The figures embracing one another symbolize universal brotherhood, while the combination of a left hand and a heart reflects a Venture Scout's dedication and love for the community. This award encourages members to actively participate in service and demonstrate social responsibility. \n\n###### ACTIVITY \n\nThe Activity Badge encourages multifaceted development and the exploration of various proficiencies, including traditional Scouting skills. The element of \"fire\" symbolizes passion for exploring the unknown and the heritage of Scouting traditions, while the \"light bulb\" signifies broadening one's horizons and discovering the world. \n\n###### EXPLORATION \n\nThe Exploration Badge encourages members to challenge themselves through outdoor activities and to appreciate and respect nature. The compass symbolizes the spirit of guidance and exploration, helping members find their way. The needle points toward a mountain peak, representing the courage to face challenges. Guided by the North Star on the outer frame, members can maintain their faith, identify their direction, and move forward during their adventures. \n\n93\n\n<!-- p.94 -->\n###### **Project Badge** \n\n###### Aim: \n\nTo develop the project management skills and enhance qualities of self-leadership in Venture Scouts. \n\n(Recommended as the first Badge to complete.) \n\n###### **Badge** \n\n###### **Objective:** \n\nThrough the Venture Scout Executive Committee Workshop, enable Venture Scouts to understand the decision-making processes of the Executive Committee system and meeting procedures, strengthening project management, interpersonal, and communication skills. At the same time, it also helps expand their personal network for future endeavours. \n\nComplete the following item: \n\n1. Complete a Venture Scout Executive Committee Workshop organised by the District, Region, or Association Headquarters. \n\n94\n\n<!-- p.95 -->\n###### **Project Badge** \n\nAim: \n\nTo develop the project management skills and enhance qualities of self-leadership in Venture Scouts. \n\n###### **Bar** \n\n###### **Objective:** \n\nThrough managing an event, Venture Scouts collaborate with other youths to practise decision-making, project management, interpersonal, and communication skills learned in the Venture Scout Executive Committee Workshop. \n\nComplete one of the following: \n\n1.  Organise and implement a large-scale event; or \n\n2.  Organise and implement a large-scale event for a residential activity for at least five days and four nights away. \n\nCompleting this option can fulfill the requirements of the Residential Project section of The Hong Kong Award for Young People (AYP). For details, please refer to the AYP Award Handbook - Residential Project, or contact the assessor. \n\nConditions: \n\n- Members must have completed a Venture Scout Executive Committee Workshop organised by the District, Region, or Association Headquarters before undertaking this item. \n\n- Collaborate with Venture Scouts from other Units, Rover Scouts, or others to organise a large-scale event. There is no restriction on the form of large-scale events. It can be a joint Unit meeting, entrepreneurial programme, fund-raising activity, service project, joint activity with disabled persons, or project held together with \n\n95\n\n<!-- p.96 -->\nRangers, etc. Venture Scouts can seek advice and assistance from leaders or other persons but the event must be youth-led. \n\n- Venture Scouts must consult their Venture Scout Leader, and apply and get approval from the respective District Commissioner or their representative, usually the Assistant District Commissioner (Venture Scouts), at least two months prior to the event, submit an event plan one month before the activity, and a report (including distribution of work, rundown, financial report etc.) should be submitted within one month after the event. \n\n96\n\n<!-- p.97 -->\n###### **Service Badge** \n\n###### Aim: \n\nTo develop the Venture Scout's spirit of helping others and serving the community, understanding the needs of others through practical service, and increasing a sense of community belonging through opportunities for responsibility. \n\n###### **Badge** \n\n###### **Objective:** \n\nEncourage Venture Scouts to learn new skills, practise helpfulness throu g h service, and build a sense of belon g in g to society. \n\nComplete Elective Part (I) and Elective Part (II): \n\nElective Part (I) - Complete one of the following: \n\n1.  First Aid: Hold a valid 30-hour First Aid Course Certificate recognised by the Association or the Labour Department; or \n\n2.  Lifesaving (I): Hold a valid Bronze Medallion or higher qualification from The Hong Kong Life Saving Society. \n\nElective Part (II) - Complete one of the following: \n\n1.  Fireman \n\n   - Complete a Venture Scout Firefighting Course organised by the District, Region, or Association Headquarters; or \n\n2.  Lifesaving (II) \n\n   - Hold a valid Pool Lifeguard Award, Beach Lifeguard Award or higher qualification from The Hong Kong Life Saving Society; or \n\n3.  Sign Language \n\n   - Complete a sign language course of no less than 20 hours; or \n\n97\n\n<!-- p.98 -->\n4. Mental Health First Aid \n\n   - Hold a valid Mental Health First Aid (Standard or Youth) Certificate issued by The Mental Health Association of Hong Kong; or \n\n5. SOUL Keeper (Level 2) \n\n   - Complete a recognised SOUL Keeper Course (Level 2); or \n\n6. Inclusion Ambassador \n\n   - Complete a Venture Scout Inclusion Ambassador Course recognised by the District, Region, or Association Headquarters. \n\n98\n\n<!-- p.99 -->\n###### **Service Badge** \n\n###### Aim: \n\nTo develop the Venture Scout's spirit of helping others and serving the community, understanding the needs of others through practical service, and increasing a sense of community belonging through opportunities for responsibility. \n\n###### **Bar** \n\n###### **Objective:** \n\nEncourage Venture Scouts to apply their strengths and fulfil their responsibilities to society through Service Badge. \n\nComplete one of the following: \n\n1. Scout and Community Service \n\n   - a. Complete a Fundamentals of Scouting Course (Module 1A & 1B); and \n\n   - b. Undertake recognised service within scout group in four or more times and no less than 26 hours; and \n\n   - c. Undertake community service where the targets are outside Scouting. Participate in four or more service sessions, or plan and execute a continuous service project (if applicable), no less than 26 hours. \n\n2.  Voluntary Service \n\nRegularly participate in service lasting 6 months or more, with a total service time of no less than 52 hours; or \n\n- Before committing to the service project, candidates should possess a certain level of knowledge about the service targets and skills needed. This item does not necessarily require the Venture Scout to possess specialised skills or hold relevant professional certificates, but the Venture Scout \n\n99\n\n<!-- p.100 -->\nshould apply what they have learned, utilise their strengths, and continuously participate in the relevant service to demonstrate a spirit of helpfulness. The service target group can be youths, the elderly, the sick, or persons with disabilities, etc. This service can be conducted through churches (e.g. Sunday school), voluntary organisations (e.g. The Boys' & Girls' Clubs Association), or other associations, and can involve collaboration with youth outside the Venture Scout Unit. \n\n   - If the service requires a relevant qualification, such as services related to first aid, lifesaving, home care, or attending flag-raising ceremonies organised by the government, district organisations, schools, the Association Headquarters, Regions, or Districts as a flag raiser, the relevant certificate must be obtained prior to commencing the service according to the requirements of the service organisation. For example, conducting a flag-raising ceremony requires the completion of a recognised National Flag and Regional Flag Etiquettes Workshop certificate. The service must be conducted outside of regular Scout activities and cannot be part-time or full-time employment. Venture Scouts must keep a service record for auditing purposes. \n\n3. Scouts of the World AwardRemark 1 \n\n   - a. Complete a Scouts of the World Award Discovery Workshop; and \n\n   - b. Organise a team and complete the Scouts of the World Award Voluntary Service. \n\nRemarks: \n\n1. Venture Scouts who have completed a Scouts of the World Award Discovery Workshop will not need to do so again as a Rover Scout. But Rover Scouts who have completed the Scouts of the World Award must complete another project as Equivalent Service for their Award; for details, please refer to the Rover Scout Training Scheme. \n\nFor details, please refer to the wetsite of Scouts of the World Award \n\n100\n\n<!-- p.101 -->\n**Activity Badge** \n\n###### Aim: \n\nTo encourage Venture Scouts to discover new experiences and develop personal interests, promoting character building and physical fitness. At the same time, training Venture Scouts to reach the highest standard for youth members in Scoutcraft. \n\n###### **Badge:** \n\nComplete any one of the following three categories. \n\n###### **Bar:** \n\nComplete all three of the following categories. \n\n101\n\n<!-- p.102 -->\n**Category I: Scoutcraft** \n\n###### **Objective:** \n\nTrain Venture Scouts to reach the highest standard for youth members in Scoutcraft. \n\nComplete the following items: \n\n1. Pioneering: \n\n   - a. Knowledge and Skills: Complete a Venture Scout Knotting and Pioneering Course organised by a District, Region, or Association Headquarters; and \n\n   - b. Practical: Form a team of 3 to 5 Venture Scouts, apply to a District, Region, or Association Headquarters for assessment and complete any two pioneering projects. \n\n2. Campcraft and Backwoods Skills: \n\n   - a. Campcraft: Complete one of the following: \n\n      - i. Practical: Form a team of Venture Scout members, apply to a Distr ict, Region, or Association Headquarters for assessment, and complete a two days, one night standing camp; or \n\n      - ii. Complete a Venture Scout Campcraft Course/ Assessment organised by a District, Region, or Association Headquarters. \n\n   - b. Backwoods Skills: Complete one of the following: \n\n      - i. Practical: Form a team of Venture Scout members, apply to the Venture Scout Leader, and complete a series of \"Backwoods Survival Skills\" activities; or \n\n      - ii. Complete a Venture Scout Backwoods Cooking Course/Assessment organised by a District, Region, or Association Headquarters. \n\n102\n\n<!-- p.103 -->\nremark 1 \n\n3. Footdrill \n\n   - a. Complete Chinese Foot Drill Workshop; and \n\n   - b. Complete \"Basic Etiquette and Foot Drill Course\" or \"Foot Drill Basic Course\".remark 2 \n\nRemarks: \n\n1. If Venture Scouts have already completed any part of item 3 before the commencement of this assessment, relevant completed parts will be retrospectively recognised. \n\n2. If Venture Scouts have already completed the “Scout Foot Drill Basic Course”, it will be regarded as having fulfilled the Foot Drill Basic Course listed in item 3b. \n\n103\n\n<!-- p.104 -->\n**Category II: Physical Recreation** \n\n###### **Objective:** \n\nIn addition to improving Scoutcraft, Venture Scouts also need to maintain robust physical health. By choosing suitable recreational and sports activities, they work hard to build a good physique to face future challenges. \n\nComplete one of the following: \n\n1. Choose two recreational and sports activities; or \n\n   - a. Participate continuously in any two activities listed below for no less than 20 hours for each (i.e. a total of no less than 40 hours for the two activities); and \n\n   - b. Have sufficient knowledge about the rules, terminology, and safety measures of the two sports selected; and \n\n   - c. Understand the injuries caused by the two selected sports and related prevention methods. \n\n   - d. Share the takeaways from participating in these two activities with Venture Scouts from other Units, Rover Scouts, other youth, or the assessor. \n\n2. Choose one recreational and sports activity \n\n   - a. Participate continuously in any one activity listed below for no less than 52 hours; and \n\n   - b. Have sufficient knowledge about the rules, terminology, and safety measures of the activity selected; and \n\n   - c. Understand the injuries caused by the activity and related prevention methods. \n\n   - d. Share the takeaways from participating in the activity with Venture Scouts from other Units, Rover Scouts, other youth, or the assessor. \n\n104\n\n<!-- p.105 -->\n- Activities includes but is not limited to the following: \n\nBasketball, Cricket, Golf, Hockey, Tennis, Handball, Rugby, Mini-soccer, Volleyball, Water Polo, Badminton, Squash, Canoe Polo, Softball, Baseball, Bowling, Ice Hockey, Netball, Gateball, Billiards/Snooker, Lawn Bowls, Table Tennis, Football (Soccer), Rouliqiu, Dodgeball, Athletics, Competitive Swimming, Competitive Lifesaving, Cross Country Running, Karting, Ice Skating, Roller Skating, Dance, Gymnastics, Triathlon, Weightlifting, Cycling (Competitive), Boxing, Fencing, Lion Dance, Cheerleading, Wargames, Artistic Cycling, Fitness Equipment Training, Yoga, Shuttlecock, Judo, Karate, Chinese Martial Arts, Taekwondo, Kickboxing, Sport Climbing, Diving, Water Sports (Competitive), Shooting, Air Pistol Shooting, Orienteering, Archery, Canoeing (Non-competitive), Cycling (Non-competitive), Equestrian, Windsurfing (Non-competitive), Physical Fitness Training, Tug of War, etc. \n\n###### Remarks: \n\n1. If it is uncertain whether the selected activity will be accepted, consult the assessor first for comment. \n\n2. Members need to draft a plan themselves, consult the assessor, and obtain their approval before implementing the plan. \n\n105\n\n<!-- p.106 -->\n**Category III: New Experience** \n\n###### **Objective:** \n\nIn addition to improving Scoutcraft and maintaining physical health, Venture Scouts also acquire life skills. By attempting activities they have never tried before or continuing their pursuits, Venture Scouts are encouraged to grow co
