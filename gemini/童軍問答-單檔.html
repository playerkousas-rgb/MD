##### `Guidance Notes on Association Property` \n\n###### `Introduction` \n\n```\nThese Guidance Notes carry the policy on the Association property andshall\napply toall properties of The ScoutAssociation of Hong Kong (includingthe Friends\nof Scouting), except those which are registered in the name of individual sponsoring\nauthorities of scout groups or units.\n```\n\n```\nThe property of The Scout Association of Hong Kong and of the Friends of\nScouting isnormally used for one or more of the following purposes:\n```\n\n- `(1) Campsite` \n\n- `(2) Training Centre` \n\n- `(3) Activity Centre` \n\n- `(4) Scout Base` \n\n- `(5) Association Headquarters` \n\n- `(6) Friends of Scouting/Regional/District Headquarters` \n\n- `(7) Baden-Powell Scout Club House` \n\n- `(8) Children and/or Youth Centre of Friends of Scouting` \n\n###### Definitions \n\n```\n\"Association\"means The Scout Association of HongKong. “Property\"in the\ncontext of these Notes, shall include all land, permanent and temporarystructure(s)\nstanding onland(including any fixturesand fittings}, anyjettystandingon\nforeshore,vehicles, boats, machinery and other things or properties dealtwithby\nthe CampsitesandProperties Committeein the ordinary course of business.\n```\n\n###### `Vesting of Property` \n\n```\nAll Association property shall be vested in the body corporate established by\nSection9(1) of The Scout Association of Hong Kong Ordinance, CAP 1005 of theLaws\nof Hong Kong,and any amendment thereof.\n```\n\n```\nThe lease, permit or any other instrumentby which the aforesaidbody\ncorporate acquires any land and/or structure(s) standing thereon, shall beinthe\nname of the “The Scout Association of HongKong”.Allsuchleases,permits,or\ninstruments requiring the seal and/or signature of the body corporateshall be so\nsealed and signed as provided in Section 11 of the Ordinance,unlesstheyare\notherwise especially assigned and specified by the Executive Committee of the\nAssociation.\n```\n\n............. /2\n\n<!-- p.53 -->\n**Annex 1 Annex 1 To Technical Note** To **Technical** Note \n\n###### `- 2 -` \n\n###### `Policy on Association Property` \n\n```\nTheseNotes andany amendmentsthereto shallnotbe valid untiladoptedby the\nCampsites & Properties Committee.\n```\n\n```\nTheCampsitesand Properties Committee may however formulate and issue any\nSupplementaryNotes to supplement these Notes.\n```\n\n###### `Finance` \n\n```\nAll funds reserved for the maintenance, repairs and administrativeexpenses\nor development of any Association property shall be subject to the controlbythe\nExecutive Committeeof the Association, or a functionalcommittee appointedby itas\nthe case may be. If the responsibility for day-to-daymanagement of the propertyis\ndelegatedtoaregion/district such funds shallfurtherbe subjectto the control by\nthe executive committee of that region/district or by its sub-committeeunder\ndelegation of authority.\n```\n\n```\nRules 49(1) and 66(i) laid down in the Policy, Organisation and Rules ofThe\nScout Associationof Hong Kong (1st Edition, September 1987) asappliedtoScout\nGroups applies in thesame way to Scout Districts,ScoutRegionsandmustbe\nobserved.\n```\n\n###### `Fund Raising` \n\n```\nFund Raising activities for any Association property by a committee, agroup\nofindividuals,oran individualmay be initiatedif and when the Rules 26, 47 and 64\nlaiddown in the Policy, Organisationand Rules of the ScoutAssociationofHongKong\n(1stEdition, September 1987) are satisfied.\n```\n\n```\nAny funds received from any such fund raising activity can only be usedfor\nthe sole and sheer purpose of the fund raisingproject unless it is rectifiedby the\nrelevantexecutive committee concerned.\n```\n\n###### `Equipment` \n\n```\nTheequipmentandotherinstallationsrequiredin anypropertymaybeprovided\nbyacommittee,agroupofindividuals,oranindividual.\n```\n\n```\nRules 49 and 66 laid down in the Policy, Organisation and Rules of theScout\nAssociation of Hong Kong (1st Edition, September 1987) as applied toScoutGroups\nappliesin the sameway to Scout Districts,ScoutRegions andmustbe observed.\n```\n\n………… /3\n\n<!-- p.54 -->\n**Annex 1** Annex 1 **To Technical Note** To Technical Note \n\n- 3 - \n\n###### `Management` \n\n```\nThe overallmanagement of allAssociationproperty shallbe the responsibility\nof the Campsites and Properties Committee, subject to such instructionsasmaybe\ngiven bythe Association's Executive Committee.The Campsites and Properties\nCommittee may delegate the authority on the management ofanypropertyto the\nexecutivecommitteeor a sub-committeeof abranch,regionor district,but the Guide\nto Property Developmentand Project Management issued by the Association Headquarters\nmust be observed.\n```\n\n###### `Custody of Instruments` \n\n```\nAll leases,permits, or any other instruments relatingtoanyAssociation\nproperty shallbe deliveredto Association Headquartersfor safe custody.\n```\n\n```\nAssociation Headquarters may arrange for a copy of any such instrument tobe\nmade available to the executive committee or sub-committee of the branch, regionor\ndistrict concerned as applicable.\n```\n\n```\nWhereanysuch instrument is superseded oramended,thenew or amended\ninstrumentshall be retained by Association Headquarters and a copymademaybe\navailable to the executive committee or sub-committee of the branch, region or\ndistrict concernedas applicable.\n```\n\n###### `Annual Administrative Expanses, Maintenance and Repairs` \n\n```\nThe responsibility for payment of annual administrative expenses, maintenance\n& repairs for any Associationproperty shallbe the responsibility of the branch,\nregion or district concernedas applicable.Annual budget for such purposes shall be\nmade by the respectivebranch, region or district,if required.\n```\n\n###### `Schedules of Maintenance` \n\n```\nThe Campsites and Properties Committee may, with the assistance of the\nexecutive committee or sub-committee on the management of the specifiedAssociation\nproperty, be responsible for preparinga schedule of maintenance for suchproperty.\nAnysuch schedule shall be for a period of not less than three years nor exceeding\nfive years. Within each such period all structures, facilities, andequipmentin\neachpropertymaybe jointly or otherwise inspected at least once ayearbythe\nAssociation’smaintenance contractor and/oran individual or a group ofindividuals\nassigned by the Campsites &Properties Committee.During the inspectionanentry\nshall bemade of any item requiring remedial action or replacement, and alistof\nsuch itemsshall be submitted without unduly delay to theCampsites & Properties\nCommittee with a copy to the executive committeeor sub-committeeconcernedas\napplicable.\n```\n\n............. /4\n\n<!-- p.55 -->\n**Annex 1 Annex 1 To Technical Note** To **Technical Note** \n\n###### `- 4 -` \n\n###### `Damage from Natural Disasters` \n\n```\nDamage to any Association property arising from a natural disaster shall be\nmade good by the respectivebranch, region or district concerned.\n```\n\n###### `Development` \n\n```\nWhere the existing structure(s}, facilities and equipmentof anyAssociation\nproperty are to be expanded, added to, or re-developed, or wherenewstructures,\nfacilities and equipment are to be provided, the costs shallbe paid bythe\nrespectivebranch, region or district concerned.\n```\n\n###### `Insurance` \n\n```\nEach Association property shall be adequately insured against damage byfire\nandthe premium for such insurance shall be paid by the branch, regionordistrict\nconcerned.\n```\n\n```\nEach Associationpropertylocated in an exposed area shallbeadequately\ninsured against damage by typhoon, landslide, or rain-stormand the premium forsuch\ninsurance shallbe paid by the branch, region or district concerned.\n```\n\n##### `Funds` \n\n```\nAtrust fund, endowment fund, or maintenance fundmay be establishedtohelp\nmeet the expenses of any Association property.The size and purposeofanysuch\ntrust fund, endowment fund, or maintenance fund and its manner of operation shallbe\nsubject to the approval of the Association'sExecutive Committee.\n```\n\n##### `Notes` \n\n`1. The Guidance Notes herein are for guidance purposes only and can be amended at any time with retrospective effect by the Campsites & Properties Committee of the Association.` \n\n`2. For the avoidance of doubts, it is further provided that these Guidance Notes are subject to the Rules contained in the Policy, Organisation and Rules of the Scout Association of Hong Kong and anything herein which contravenes the said Rules is null and void to all intents and purposes.` \n\n```\n(E:GUIDANCE.CP2.FEB1991)\n```\n\n<!-- p.56 -->\n**Estate Branch Form EB006 Annex 2 To Technical Note** \n\n###### **Estate Branch Form EB006** \n\n###### `香 港 童 軍 總 會` 工程計劃編號： **/ /** `工程需求及籌劃備忘` \n\n|**1.**`一般資料`||\n|---|---|\n|`物業名稱`||\n|`物業地址`||\n|`地契類別`|`□` `私人協約方式批地`Private Treaty Grant<br>`□` `私人遊樂場地契約`Private Recreational Lease<br>`□` `租約`Tenancy Agreement<br>`□` `短期租約`Short Term Tenancy Agreement<br>`□` `樓契／地契`Assignment|\n|`契約用途限制`||\n|`契約期限`|`為期`<br>`年 至`<br> `年`<br> `月`|\n|**2.**`工程需要性`||\n|`因由`|`□` `因應總會在政策上的轉變或決定（附上相關會議記錄／認可文件，詳見附件`<br>`）`|\n||`□` `需符合法例規定 （附上相關法例條文，詳見附件`<br>`）`<br>`附註目前不合例的情況：`|\n||`□ 使用率報告`(`最近三年`)`，詳見附件`<br>`□` `其他：`|\n|`擬籌劃工程`|`位置／範疇：`|\n||`圖則／概念示意圖／相片，詳見附件`|\n||`曾考慮之方案及利弊，詳見附件`|\n|`土地用途／契約檢視`|`擬籌劃工程`<br>`□` `符合契約用途限制及不需向政府有關當局或業權人申請批准`<br>`□` `符合契約用途限制但需向政府有關當局或業權人預先申請批准`(`批准函件見附見`<br>)|\n||`□` `不符合契約用途限制`<br>`有關契約條款／相關條例章節 ：`<br>`涉及部門：`|\n||`需要進行之程序包括：`<br>`□` `按規劃大綱圖作出申請／ □申請改變土地用途／ □申請入則／ □申請有關營運牌照`|\n||`□` `其他：`|\n|**3.**`工程推展`||\n|`工程顧問`|`□` `不需要`|\n||`□`  `需要，顧問類別：`|\n||`理據：`|\n||`招標模式：`|\n||`□`Opening Tendering`公開招標 ／ □`Selective Tendering`揀選招標`|\n||`□`Prequalified Tendering `規範招標 ／ □`Single Tendering `單一招標`|\n\n1 of 2 (Annex 2)\n\n<!-- p.57 -->\n|`工程推展時間表`|`招標模式：`<br>`□`Opening Tendering`公開招標 ／ □`S<br>`□`Prequalified Tendering `規範招標 ／ □`<br><br>|elective Tendering`揀選招標`<br> Si 20|`年 `<br>`月 （共 `<br> `日）`|\n|(c)`擬定完成`<br>`招標分析報告`|20|`年`<br>`月`||\n|(d)`擬定工程期`|20|`年`<br>`月 至`20|`年 `<br>`月 或`|\n||20|`年 `<br>`月 至`20|`年 `<br>`月`(`第二選擇之工程期`)|\n\nForm EB001 [Version: June 2016] \n\n2 of 2 (Annex 3)\n\n<!-- p.61 -->\n**Annex 3 To Technical Note** \n\n##### `香 港 童 軍 總 會 發展及改善工程計劃` **-** `申請撥款流程` \n\n<!-- Start of picture text -->\n童軍單位  呈交工程計劃申請  安排工程<br>( 表格  EB001)  [4  月 ]<br>[ 6  月底 ]<br>產業署  查覈申請資料  通知產業委員會及<br>[7  月 ]  有關單位批款<br>[4  月 ]<br>發展及工程小組委員會  評審小組<br>審核工程計劃<br>[8  月 ]<br>初步評審及<br>徵詢委員意見<br>[9  月 ]<br>總結評審結果<br>[10  月 ]<br>產業委員會  確認整體工程計劃<br>[11  月 ]<br>助理香港總監（產業）  落實並向司庫推薦 獲知工程批款<br>整體工程計劃  [3  月 ]<br>[ 翌年  1  月 ]<br>司庫  考慮批款<br>[2  月 ]<br><!-- End of picture text -->\n\nForm EB001_Timetable (Version: February 2012)\n\n<!-- p.62 -->\n**Annex 3 To Technical Note** \n\n##### `香 港 童 軍 總 會` \n\n##### `發展及改善工程計劃` **-** `申請撥款程序` \n\n###### `童軍單位` \n\n1. `童軍單位負責人於每年` 6 `月底或之前，呈交予產業署有關申請表格（` EB001 `）及所需資 料。` \n\n2. `有關單位需預留充足時間由有關單位之營地／產業／管理等委員會及` / `或地域總監審閱 有關工程項目的申請及資料。` \n\n###### `產業署` \n\n3. `產業署瞭解所建議之工程項目後，於` 7 `月完成查覈工作。` \n\n###### `發展及工程小組委員會` \n\n4. `於` 8 `月初，由助理香港總監（產業）指派之工程計劃評審小組進行審核。若評審小組認 為有需要向有關單位索取進一步的資料，便由產業署跟進。` \n\n5. `於` 9 `月完成工程計劃初步評審，並把初步評審結果通知發展及工程小組委員會各委員， 以便各委員就評審結果給予其意見。發展及工程小組委員會於` 10 `月的會議上，各委員 就評審結果及有關意見作出討論，總結評審結果。` \n\n6. `將工程計劃呈交予產業委員會確認。` \n\n###### `產業委員會` \n\n7. `產業委員會於` 11 `月的會議上，確認有關年度之整體工程計劃，並推薦予助理香港總監 （產業）考慮。` \n\n###### `助理香港總監（產業）` \n\n8. `助理香港總監（產業）於` 12 `月落實整體工程計劃之預算案，於翌年` 1 `月初呈予司庫考 慮。經財務委員會及總會執行委員會分別於` 2 `月及` 3 `月通過批款。` \n\n9. `司庫於` 3 `月通知助理香港總監（產業）有關工程計劃之撥款結果。` \n\n###### `產業署` \n\n10. `產業署於` 4 `月通知各有關童軍單位及產業委員會各委員，有關工程計劃之撥款結果。` \n\n###### `童軍單位` \n\n11. `童軍單位負責人於` 4 `月按撥款數額進行有關工程。` \n\nForm EB001_Note (Version: February 2012)\n\n<!-- p.63 -->\n**Annex 3 To Technical Note** \n\n##### `香 港 童 軍 總 會` \n\n##### `發展及改善工程計劃` **-** `申請須知` \n\n###### `一般事宜` \n\n1. `申請表格（` EB001 `）須由童軍單位負責人填寫。` \n\n2. `一份撥款申請表格內，只申報一項工程計劃。` \n\n3. `附上充足資料，包括背景資料、工程預計時間表、估價明細表及支出流動預算、相片、 圖則、申請理由及優先次序等。` \n\n4. `如工程項目涉及專業人士，如結構、機電、測量或園林設計等方面，專業人士之服務費 需包括於有關申請內。` \n\n5. `每項工程計劃之所涉及之經常性開支由有關童軍單位負擔。` \n\n6. `任何在申請獲批准前所進行之項目，均不予以考慮。` \n\n7. `如產業署認為撥款申請表格或所需資料不齊全，會要求有關童軍單位補充所需資料。` \n\n###### `聘請顧問、製備招標文件及進行招標` \n\n1. `童軍單位負責聘請顧問、製備招標文件、進行招標及評標，童軍單位負責人須向產業署 呈交所需的書面報告。` \n\n2. `獲批准的撥款只應用以獲批准的工程項目。` \n\n3. `當開標後，如標價高於獲批准的撥款，童軍單位負責人須通知產業署，產業署報告予助 理香港總監（產業）並徵詢其批示。` \n\n4. `因任何情況而需要更改獲批准的工程項目，童軍單位負責人須呈交文件予助理香港總監 （產業）審閱，如理由充分，方會被考慮。` \n\n5. `童軍單位負責人須按照工程預計時間表及支出流動預算進行工程項目，如有差異，須向 助理香港總監（產業）解釋有關事宜。` \n\nForm EB001_Note (Version: February 2012)\n\n<!-- p.64 -->\n**Guidelines for Adopting Screening Criteria and / or Marking Scheme for Tender Evaluation** \n\n**Annex 4 To Technical Note** \n\n- **(I) Guidelines for Adopting Screening Criteria for Tender Evaluation** \n\n   - A. Screening exercise may be adopted for ensuring that the tenderer complies with the necessary minimum requirements before his tender is considered further to avoid abortive assessment work. The procuring scout unit shall develop the criteria to meet the specific needs for its contract. The followings are examples of screening criteria commonly adopted – \n\n      - _minimum qualification requirements_ (The tenderer’s status / qualifications (e.g. building contractor registered with Buildings Department, Authorized Person, etc.) \n\n      - _minimum resource / technical capability_ (e.g. minimum number of specific professionals / experts required, availability of certain construction plants, etc.) \n\n      - _minimum past performance standard_ (e.g. have worked on contracts of value exceeding HK$200M, have worked for four number of specific type of project, etc.) \n\n   - B. It should be observed that the screening criteria once adopted shall be taken as mandatory requirements and that if a tenderer fails to comply with any one of the criteria, his tender shall not be considered further. The procuring scout unit shall therefore exercise great care in preparing the criteria which shall contain no ambiguities. \n\n- **(II) Guidelines for Adopting a Marking Scheme for Tender Evaluation** \n\n   - A. The use of a marking scheme in tender evaluation and an outline of the evaluation criteria shall form part of the tender documents. Any other requirements which will be applied in deciding on the suitability of tenders must also be indicated in the tender documents. Procuring scout units should take into account the basic SAHK procurement principle of transparency when determining the details of the marking scheme and assessment criteria to be included in the tender document. Procuring scout units should normally provide as much information as possible (including descriptions of each assessment criterion and their individual technical marks assigned, the individual and/or overall passing marks set for technical assessment, formula to \n\n[Revision: June 2016] \n\n1 of 3 (Annex 4)\n\n<!-- p.65 -->\n**Annex 4 To Technical Note** \n\nbe used to calculate the technical/price scores, and the technical to price assessment weighting, etc.) in the tender document to facilitate tenderers’ preparation of competitive and quality tender submissions. \n\n- B. Since the use of a marking scheme invariably involves a technical evaluation conducted separately from the tendered sum comparison, a two-envelope approach should be adopted when requiring the tenderers to submit their tenders, i.e. technical and price information should be submitted in separate envelopes. Under the two-envelope approach, procuring scout units shall ask the tenderers to enclose all the information and documents required for price assessment (viz. for the calculation of price score) in sealed envelope(s) with the clear indication that it contains the price information; and to enclose all the other information including those required for technical assessment in separate sealed envelope(s) with the clear indication that it contains the technical information. Procuring scout units should not open the envelopes containing the price information until the completion of technical assessment. \n\n- C. When determining the relative weightings for technical and price assessments, procuring scout units should normally adopt a 30%-40% weighting for technical score, as against a weighting of 60%-70% for price score. Procuring scout units should note that a higher technical weighting would not necessarily ensure a higher quality of the service / product to be delivered by the successful supplier. The setting of relevant mandatory requirements and passing marks under the marking scheme would instead guarantee that only those capable contractors with quality proposals would be awarded with the contracts. For consultancy services, a 70%-80% weighting for technical score, as against a weighting of 20%-30%, could be adopted to reflect the need for able consultants firm. Procuring scout units proposing a weighting higher than the above recommended value for technical score should provide full justification in their submissions to relevant tender boards. \n\n- D. Tender assessment panels should apply pre-determined weighting given to the overall technical assessment and the price proposal. In normal circumstances, the contractor with the highest overall score (i.e. the sum of price and technical scores) should be recommended. Where none of the offers received meets all the mandatory requirements, procuring scout units should recommend cancellation of the tender exercise. \n\n[Revision: June 2016] \n\n2 of 3 (Annex 4)\n\n<!-- p.66 -->\n**Annex 4 To Technical Note** \n\n- E. The following method should be adopted for calculating the overall score in tender evaluation – \n\nPrice to technical weighting = 60 : 40 \n\nthe lowest tender price \n\nthe technical score \n\n60 x among those conforming tenders + 40 x \n\nthe tender price \n\nthe highest technical score \n\namong those conforming tenders \n\n|Tender|Tender Price<br>($M)|Technical Score|The Overall Score|\n|---|---|---|---|\n|A|120<br>(lowest tender price)|65|60 x (120 / 120) + 40 x(65 / 80)<br>= 92.50|\n|B|125|75|60 x (120 / 125) + 40 x(75 / 80)<br>= 95.10|\n|C|130|80<br>(highest technical score)|60 x (120 / 130) + 40 x(80 / 80)<br>= 95.38|\n\nTherefore, C is the winning tender. \n\n[Revision: June 2016] \n\n3 of 3 (Annex 4)\n\n<!-- p.67 -->\n**Annex 5 To Technical Note** \n\n**Guidelines for Drawing up Tender Specifications** \n\n### **Guidelines for Drawing up Tender Specifications** \n\n- A. A tender specification is a statement of needs to be satisfied by purchase of external resources, including goods and services. It defines the purchaser’s requirements and consequently, what the supplier / contractor is expected to provide. As a rule, tender specifications should meet the basic SAHK procurement principles of transparency, openness and fairness. Tender specifications shall not be prepared, adopted or applied with a view to or with the effect of creating obstacles to trades or to competition amongst the potential tenderers. \n\n- B. When inviting tenders under whichever type of procedures, the procuring scout units shall word tender specifications in easily comprehensible general terms based on the functional and performance characteristics of the products required, and not around the technical data of a certain model of the goods or equipment to be purchased. There shall be no requirement for or reference to a particular trade mark or name, patent, design or type, specific origin, producer or service provider, unless there is no sufficiently precise or intelligible way of describing the procurement requirements and words such as “or equivalent” should be included in the tender documents. Where standards are referred to, the procuring scout units shall use, where practicable, international standards. \n\n- C. When preparing specifications for technical equipment, the procuring scout units shall distinguish mandatory, desirable and optional features and indicate these in the specifications, particularly when these features are to be taken into account in the tender evaluation. Some guidelines for drawing up tender specifications are provided hereunder for general reference. \n\n- D. Tender specifications should have regard to the following – \n\n   - (a) specifications and conditions form the basis for seeking suppliers’ / contractors’ response and should be easily comprehensible; \n\n   - (b) they form the framework for evaluating the suitability of offers received from tenderers; \n\n   - (c) they should be comprehensive and should contain sufficient information for the tenderers to determine the nature, scope and estimated quantity or value of goods or services required, their characteristics, standards to be met, performance under specified \n\n(Version: February 2012) \n\n1 of 5 (Annex 5)\n\n<!-- p.68 -->\n**Annex 5 To Technical Note** \n\nconditions and other relevant information in order to obtain conforming and competitive bids; and \n\n   - (d) consideration should be given, as far as possible and where economically rational, to avoiding single-use disposal items and purchasing products – \n\n      - with improved recyclability, high recycled content, reduced packing and greater durability; \n\n      - with greater energy efficiency; \n\n      - utilising clean technology and/or clean fuels; \n\n      - which result in reduced water consumption; \n\n      - which emit fewer irritating or toxic substances during installation or use; or \n\n      - which result in smaller production of toxic substances, or of less toxic substance, upon disposal. \n\n- E. Specifications should be framed in terms that encourage open and fair competition by providing potential tenderers an equal opportunity to develop solutions capable of satisfying the procuring scout units’ requirements. It is important that specifications should not include any feature which could be perceived as discriminatory because it is specific to a brand of product, other than for the procurement of proprietary products. \n\n- F. In general, there are four categories of specifications – \n\n   - (a) Functional Specifications \n\n      - These outline the proposed function or role to be performed by the product in helping the end-user to achieve the desired capability. They focus on what is to be achieved rather than how it is to be done. \n\n   - (b) Performance Specifications \n\nThese detail the required performance characteristics and performance parameters by specifying details of operating input or output required, but not the method to achieve them or how the product should be manufactured. For example, the performance specifications for wire may require it to withstand a given temperature, have a designated resistance to abrasion and have a given conductive capability. No mention needs to be made of the material to be used or how the wire is \n\n(Version: February 2012) \n\n2 of 5 (Annex 5)\n\n<!-- p.69 -->\n**Annex 5 To Technical Note** \n\nto be manufactured. \n\n   - (c) Material Specifications \n\n      - These state the physical characteristics of the specific materials to be used. \n\n   - (d) Technical Specifications These provide a physical description of the items required, such as size, capacity, tolerances and strength. Technical specifications may include detailed plans, designs and technical drawings. \n\n- G. The use of material and / or technical specifications is unavoidable in some supply tenders, particularly where compatibility with existing equipment is required. However, the use of such specifications at the outset might limit the provision of innovative solutions or new technologies or products which suppliers / contractors might be able to offer, and restrict competition. In preparing tender specifications, the procuring scout units should use functional and performance specifications, supplementing them by a material or technical specification only if absolutely necessary. Where dimensions or other measurable characteristics are critical to performance, a permitted range rather than a fixed dimension should be used wherever possible. \n\n- H. Whilst specifications need to be comprehensive, it is important to guard against over-prescribing requirements. Over-prescription reduces the scope for innovative responses and may exclude altogether some suppliers who would be capable of meeting the performance levels required. It may also require products to be custom designed at additional cost rather than making use of goods available in the market. In drawing up specifications, particularly for critical or high-value products, procuring scout units should follow the following steps – \n\n   - (a) research the market for likely sources of supply and other relevant information on current product features and technological trends. This might occasionally involve the team of purchaser and end-user discussing with suppliers how particular functional and performance requirements can be best met; \n\n   - (b) use functional and performance characteristics in the specifications, with a distinction drawn between mandatory and desirable features. Mandatory requirement is defined as a feature which is so essential to the acceptability of the product that the procuring scout unit would not \n\n(Version: February 2012) \n\n3 of 5 (Annex 5)\n\n<!-- p.70 -->\n**Annex 5 To Technical Note** \n\nwish to proceed to purchase the product if the feature could not be provided; \n\n   - (c) where procuring scout units consider it appropriate to allow tenderers to make alternative proposals which could better meet their requirements, they should include in the tender documents a standard clause that alternative proposals will be considered by SAHK and may be offered; and \n\n   - (d) determine the evaluation criteria before inviting tenders and include an outline of the evaluation criteria in the tender documents to assist tenderers in preparing their tenders. Where procuring scout units consider it necessary to evaluate the technical and price aspects of tenders separately, including the use of a marking scheme, they should follow guidelines set out in **Annex 4** and adopt a two-envelope approach where appropriate. \n\n- I. Apart from product specifications, procuring scout units, in drawing up the terms and conditions for inclusion in tender documents, should have special regard to the following – \n\n   - (a) Duration of contract \n\n      - Market conditions should be taken into account in determining the length of the contract. Where market developments are characterized by the presence of a large number of suppliers and rapid technological improvements, it may be appropriate to make short-term contracts, or to include break clauses, to give flexibility to take advantage of favorable trends and avoid being committed to products that may become obsolete quickly. On the other hand, when the barriers to exit from the market are high for a supplier, such as the requirement to invest substantially in capital assets, the procuring scout unit should consider letting a long-term contract in order to generate more interest among potential suppliers and to enable them to offer more competitive prices. \n\n   - (b) Services after sales / completion of works Sometimes, after-sale services and maintenance will be required for purchases (e.g. computer hardwares) and capital works (e.g. airconditioning facilities). Where these services are needed, they should be included in the specifications. \n\n(Version: February 2012) \n\n4 of 5 (Annex 5)\n\n<!-- p.71 -->\n**Annex 5 To Technical Note** \n\n- (c) Price adjustment \n\n   - A price adjustment clause may be used where material costs or other major determinants of market prices are prone to rapid and substantial fluctuation. For contracts of a duration of one year or less, it is usually not necessary to provide for a price adjustment. \n\n- (d) Payment schedule \n\n   - Where applicable, milestone payments related to performance targets should be used. A contract may be divided into several stages and payment be made after the completion of a particular stage. \n\n- (e) Operation and Maintenance Manuals Provisions of operation and maintenance manuals shall be included in the specifications where these are necessary. \n\n- (f) As-built records \n\nFor capital works projects, provision of as-built drawings and records must be included in the specifications of works tenders and / or consultancy agreements. \n\n(Version: February 2012) \n\n5 of 5 (Annex 5)\n\n<!-- p.72 -->\n**Annex 6** \n\n**Scout Association of Hong Kong Estate Branch** \n\n**To Technical Note** \n\n15 August 2007 \n\nTel ： 2957 6388 Fax ： 2302 1006 \n\nEstate Circular No.01/2007 \n\n#### **An Outline of Terms and Conditions on Scout Properties** \n\nScout properties refer generally to those land and premises held by the Scout Association of Hong Kong. The property documents, mainly in the form of land grant and tenancy agreement issued by Government, tenancy agreement by Housing Authority, and deed of assignment etc, should all be executed by the Association. The subject unit and╱or the respective management body should thoroughly understand and undertake to obey all the terms and conditions before the Association completes the signatory. In fact, the terms and conditions of every property vary from each other.  Generally speaking, they can be summed up in the following aspects: \n\n- (1) The property document clearly designates the lease term and period, and property boundaries annotated with a plan indicating the area, partitioning, users’ constraints on specific locations and permitted uses; \n\n- (2) Rentals are usually charged at a concessionary or nominal rate while the rates, repair & maintenance charges, capital improvements, and other expenses and fees related to the property shall be borne by the respective unit; \n\n- (3) Without the prior consent from the Association, the Government and respective authorities, the property or any part thereof cannot be used or permitted or suffered to be used for any purpose other than the approved usage. For example, the property cannot be used as sleeping quarters or domestic premises, or to allow any person to remain in the premises overnight without prior consent; \n\n- (4) The property or any part thereof cannot be assigned, underlet or disposed of its possession; \n\n- (5) The property should be maintained in a good and tenantable condition including its land, building structure, building services, e.g. ventilation, fire services, waterworks and electrical installations, security system, drainage, road, car parking spaces, slope, retaining wall, pier etc. For property with sea, foreshore and waterworks in the proximity, the statutory requirements on pollution prevention shall be observed and fulfilled; \n\n- (6) During the lease term, the subject unit should hold relevant licences in connection with the activity carried out in the property and fulfil Buildings Ordinance, Regulations and other statutory requirements etc, e.g. Hotel and Guesthouse Accommodation Ordinance and Deed of Mutual Covenant. Related insurance coverage should be adequately provided; \n\n- (7) The subject unit shall observe carefully the constraints drawn up in the property title document on the development of the property. For any development plan proposed involving demolition, construction, addition and╱or alteration of buildings and structures, prior consent should be sought from the Association, the Government and respective authorities. Also Buildings Ordinance, Regulations and other statutory requirements etc should be complied with; \n\n- (8) Except with prior consent, the land and slope etc adjoining the property cannot be cut away, removed or set back.  For trees and other landscape, their treatment should follow strict regulations; \n\n- (9) On the termination or expiration of the lease or tenancy, the subject unit should deliver up vacant possession of the property together with completed reinstatement of the building structures, fixtures and fittings etc back to the original state of accommodation; and \n\n- (10) If the unit breaches the terms and condition or it is due to other reasons, the Government and respective authorities have full power to terminate the lease or tenancy and resume, re-enter upon and retake possession of all or any part of the property with no compensation. \n\nWhen handling the affairs regarding the property, the subject unit or the respective management body should have the obligation to comply and fulfil all the requirements as stipulated in the property title document and relevant legislation. When there are any uncertainties, it is necessary to consult the respective Estate╱ Management Committee of the Region╱Campsite etc. Whenever appropriate, advice from the Association, legal practitioner and╱or relevant professional has to be sought to secure the benefits of the Association. \n\nLI Yuk-shing Assistant Chief Commissioner (Estate)\n\n<!-- p.73 -->\n**Annex 6 To Technical Note** \n\n香 港 童 軍 總 會 **產** 業 署 電話：2957 6388 傳真：2302 1006 \n\n產業通告第 01/2007 號 2007 年 8 月 15 日 \n\n##### 童軍物業條款之概要 \n\n童軍物業泛指一切由香港童軍總會持有的土地、樓宇及處所。物業的契約大致分為： 政府批地契約及租約、房屋署租約、及屋契等，全部均須由總會簽署。在簽署之前，有 關童軍單位及／或其管理機關須確切明白及承諾遵守有關物業的所有條款。實際上每個 物業的性質獨特而其條款細節亦各有不同，但一般而言，該些條款大致歸納為以下範疇： \n\n- (1) 每份契約均特定物業的年期及限期、及物業的範圍和準許用途。一般附夾一 份圖則詳列有關面積、間隔及特定範圍於使用時的限制等； \n\n- (2) 租金通常以特惠或象徵式收取，而有關差餉、維修保養、大型改善及其他與 物業相關的支出及費用，須由有關單位承擔； \n\n- (3) 除非獲本會、政府及有關管理當局的批准，物業之指定用途不容更改。例如 未獲批准時，物業不可用作宿舍、住宅或留宿； \n\n- (4) 物業之任何部分不得轉讓、分租或放棄使用； \n\n- (5) 物業須保持良好及達至合理使用之水平，包括其土地、樓宇結構、屋宇設備 如通風、消防、水務、電力等裝置、保安設施、渠道、道路、停車場、斜坡、 護土牆、碼頭等。如物業鄰近海灘及水務設施，須特別注意及遵守有關防止 污染之法定要求； \n\n- (6) 於使用期間，有關單位須備妥物業的各項營運所需之牌照及符合有關建築物 條例、規例及其他法定要求等，如旅館業條例及大廈公契等。而物業相關的 保險亦須完備； \n\n- (7) 有關單位須特別注意契約上訂明有關物業在發展上的限制。當建議之發展計 劃涉及拆卸、興建、加建及╱或改動任何樓宇建築，事前須獲本會、政府及 有關管理當局的批准，同時所有工程須符合現行的建築物條例、規例及其他 法定要求等； \n\n- (8) 除獲特別批准外，物業之土地及斜坡等不得開墾，而樹木之處理亦受嚴格的 規範； \n\n- (9) 在契約終止或期滿時，有關單位須把物業完全騰空及還原各項樓宇結構、固 定裝置及裝設等；及 \n\n- (10) 如有關單位違反物業之規定或有其他的原因，政府及有關管理當局有權終止 有關契約及收回物業或其部分而無須作出賠償。 \n\n有關童軍單位及／或其管理機關在處理有關其物業的事務時，須切實履行契約中的各 項規定及相關法例。如遇有任何疑問，須向所屬地域／營地之產業／管理委員會等徵詢 意見，有需要時亦須徵詢總會、法律顧問及／或專業人士的意見，以保障本會的利益。 \n\n助理香港總監（產業） 李 玉 勝\n\n<!-- p.74 -->\n**Annex 7 To Technical Note** \n\n###### **RESTRICTED (TENDER)** \n\n###### **CONFLICT OF INTEREST DECLARATION FORM (A)** \n\n###### **[For “WITHOUT conflict of interest”]** \n\n###### **Declaration and Undertakings by Officers Involved in Preparing Tender Documentation including Tender Specifications and Assessing Tenders** \n\n###### **Project No.** \n\n**Project Title:** \n\n#### **Section IA – “WITHOUT conflict of interest” Declaration:** \n\nI hereby declare that there is no conflict of interest, whether actual, potential or perceived, between my official duties to the Scout Association of Hong Kong (hereinafter referred to as “Association”) in relation to the captioned tender exercise, including without limitation those in relation to the preparation of the tender documentation including tender specifications and the assessment of tenders, and my financial, professional, commercial, personal or other interests. \n\n2. I undertake to – \n\n- (a) hold in strict confidence all tender information that I have access to through my official duties to the Association in relation to the captioned tender exercise, including without limitation those in relation to the preparation of the tender documentation including tender specifications and the assessment of tenders. Tender information includes details of tenders received and any other sensitive, restricted or confidential information relating to a tender; \n\n- (b) refrain from making any unauthorized disclosure or taking advantage of any tender information referred to in paragraph 2(a) above whether or not for personal gain; \n\n- (c) declare any actual or perceived conflict of interest with my official duties to the Association in relation to the captioned tender exercise, including without limitation those in relation to the preparation of the tender documentation including tender specifications and the assessment of tenders immediately when I become aware of any such conflict; and \n\n- (d) take steps to avoid any conflict of interest with any prospective tenderer or tenderer by not putting myself in a position of obligation towards any of them; for example, by not accepting any favour or lavish or excessive entertainment, and not over-socialising with any of them. \n\n3. The undertakings in paragraphs 2(a) and (b) above shall not apply : \n\n- (a) if and when the disclosure and information therein referred to becomes a matter of public knowledge (other than by reason of a breach of paragraphs 2(a) and (b) above); or \n\n- (b) to any communications or disclosures caused or permitted by me to colleagues in the Association who are or are expected to be involved in the course of their official duties in the captioned tender exercise or parts thereof. \n\n4. I understand that I may be subject to disciplinary action should I make a false declaration or fail\n\n<!-- p.75 -->\nto observe any of my above undertakings. \n\n**Signed : Name (block letter)  : Rank : Date :** \n\n#### **Section IIA – Confirmation of receipt of “WITHOUT conflict of interest”** **~~declaration:~~** \n\nIt is noted that there is no conflict of interest as declared by the above officer. \n\n**Signed : Name (block letter) : Rank :** ACSE( ) **Date :**\n\n<!-- p.76 -->\n**Annex 7 To Technical Note** \n\n###### **RESTRICTED (TENDER)** \n\n###### **CONFLICT OF INTEREST DECLARATION FORM (B)** \n\n**[For “WITH conflict of interest”]** \n\n###### **Declaration and Undertakings by Officers Involved in Preparing Tender Documentation including Tender Specifications and Assessing Tenders** \n\n**Project No.** \n\n**Project Title:** \n\n#### **Section IB – “WITH conflict of interest” Declaration:** \n\nI hereby declare that there is a conflict of interest (whether actual, potential or perceived) arising between my official duties and my private interests in the preparation of tender documentation including tender specifications and the assessment of tenders for the above Agreement, with details as given below:- \n\n2. Notwithstanding the conflict of interest as declared above, I undertake to – \n\n- (a) hold in strict confidence all tender information that I have access to through my official duties to the Scout Association of Hong Kong (hereinafter referred to as “Association”) in relation to the captioned tender exercise, including without limitation those in relation to the preparation of the tender documentation including tender specifications and the assessment of tenders. Tender information includes details of tenders received and any other sensitive, restricted or confidential information relating to a tender; \n\n- (b) refrain from making any unauthorized disclosure or taking advantage of any tender information referred to in paragraph 2(a) above whether or not for personal gain; \n\n- (c) declare any actual or perceived conflict of interest with my official duties to the Association in relation to the captioned tender exercise, including without limitation those in relation to the preparation of the tender documentation including tender specifications and the assessment of tenders immediately when I become aware of any such conflict; and \n\n- (d) take steps to avoid any conflict of interest with any prospective tenderer or tenderer by not putting myself in a position of obligation towards any of them; for example, by not accepting any favour or lavish or excessive entertainment, and not over-socialising with any of them. \n\n3. The undertakings in paragraphs 2(a) and (b) above shall not apply : \n\n- (a) if and when the disclosure and information therein referred to becomes a matter of public knowledge (other than by reason of a breach of paragraphs 2(a) and (b) above); or \n\n- (b) to any communications or disclosures caused or permitted by me to colleagues in the Association who are or are expected to be involved in the course of their official duties in the\n\n<!-- p.77 -->\ncaptioned tender exercise or parts thereof. \n\n4. I understand that I may be subject to disciplinary action should I make a false declaration or fail to observe any of my above undertakings. \n\n<!-- Start of picture text -->\nSigned  :<br>Name (block letter)  :<br>Rank  :<br>Date  :<br><!-- End of picture text -->\n\n#### **Section IIB – Confirmation of receipt of “WITH conflict of interest”** **~~declaration:~~** \n\nIt is noted that a conflict of interest (whether actual, potential or perceived) exists as declared by the above officer and *the officer has been instructed to cease any further involvement in the tendering exercise of the captioned Agreement with immediate effect. / *the following remedial action has been taken:- / *no remedial action has been taken as it is considered that the above officer’s official duties will not be affected due to the following reasons:- \n\n* Delete as appropriate \n\n**Signed : Name (block letter) : Rank :** CSE **Date :**\n\n<!-- p.78 -->\n**Annex 8 To Technical Note** \n\n###### **Declaration Form by Contractor** **on their Compliance with the Ethical Commitments Requirements** \n\n**(This form is to be submitted by the Contractor upon submission of tender, commencement of the Contract and thereafter at quarterly intervals)** \n\nTo: *Employer’s Representative (SAHK) / Consultants for the Contract \n\nContract No.: ……………… \n\nTitle: …………………………………………………………….. \n\nWe confirm that we have complied with the following provisions and have ensured that our directors, employees, agents and sub-contractors are aware of the following provisions: \n\n- (a) Prohibiting our directors, employees, agents and sub-contractors who are involved in this Contract from offering, soliciting or accepting any advantage as defined in section 2 of the Prevention of Bribery Ordinance, Cap 201 when conducting business in connection with this Contract; \n\n- (b) Requiring our directors, employees, agents and sub-contractors who are involved in this Contract to declare in writing to us any conflict or potential conflict between their personal/financial interests and their duties in connection with this Contract. In the event that a conflict or potential conflict is disclosed, we will take such reasonable measures as are necessary to mitigate as far as possible or remove the conflict or potential conflict so disclosed; \n\n- (c) Prohibiting our directors and employees who are involved in this Contract from engaging in any work or employment other than in the performance of this Contract, with or without remuneration, which could create or potentially give rise to a conflict between their personal/financial interests and their duties in connection with this Contract and requiring our sub-contractors to do the same; \n\n- (d) Taking all measures as necessary to protect any confidential/privileged information or data entrusted to us by or on behalf of the Employer from being divulged to a third party other than those allowed in this Contract. \n\n(Name of the Contractor) …………….. (Name of the Signatory) .……………. (Position of the Signatory) .……………. (Date) .……………. \n\n* Delete as appropriate\n\n<!-- p.79 -->\n**Annex 8 To Technical Note** \n\n###### **Sample Declaration Form by Consultants** **on Compliance with the Conflict of Interest Avoidance and Debarring Requirements** \n\n###### **(This form is to be submitted by the Consultants upon submission of tender, commencement of the Services and thereafter at quarterly intervals)** \n\nTo: Employer’s Representative (SAHK) \n\nAgreement No.: ……………… Title: …………………………. \n\nWe confirm and declare that we have taken action to ensure that our associated companies, associates or associated persons, sub-consultants, employees and agents are aware of the provisions therein stipulated including the following: \n\n- (a) our associated companies, associates or associated persons or any of our sub-consultants shall not, during the term of this Agreement and for [ 6 ] months thereafter, undertake any services, tasks or jobs or do anything whatsoever for or on behalf of third party (other than in the proper performance of this Agreement), which touches, concerns or affects the Services or which may reasonably be seen to touch, concern or affect the Services, except with the prior written approval of the Employer’s Representative; \n\n- (b) our associated companies, associates or associated persons, and any of our sub-consultants shall not, \n\n   - (i) undertake or compete for the role of a contractor or supplier or otherwise be involved as a shareholder of the contractor or supplier, in a subsequent procurement of any services and/or goods arising out of or relating to this Agreement; \n\n   - (ii) undertake any services for a contractor (including acting as a sub-contractor) or supplier in respect of a contract between that contractor or supplier and the Employer for which we are providing a service arising out of or relating to this Agreement; \n\n   - (iii) undertake any services for, including without limitation provision of advice to, a bidder bidding for a contract arising out of or relating to this Agreement, \n\nexcept with the prior written approval of the Employer;\n\n<!-- p.80 -->\n- (c) we are under an obligation to render advice or recommendations pursuant to this Agreement to the Employer on an impartial basis without giving favour to any particular product, services or equipment in which we have a commercial interest. We also have an obligation to notify the Employer immediately and in writing and keep the Employer notified of any actual, apparent, potential or perceived conflict we or our associated companies, associates or associated persons or any of our sub-consultants may have in, or any association or connection we or the aforesaid persons may have with, any of the services, products or equipment proposed or recommended by us under this Agreement. Each and every one of our directors, employees, agents and sub-consultants who are involved in this Agreement have given a binding undertaking to observe the aforesaid; \n\n- (d) our directors, employees, agents and sub-consultants who are involved in the Agreement are required to declare in writing to us and keep us informed regularly any actual, apparent, or potential or perceived conflict between their personal/financial interests and their duties in connection with this Agreement, including all or any facts which may reasonably be considered to give rise to a situation which the financial interests of such persons, conflict or compete, or may conflict or compete, with our duties to the Employer under this Agreement. In the event that such conflict is disclosed in a declaration, we are under an obligation to forthwith take such reasonable measures as are necessary to mitigate as far as possible or remove the conflict so disclosed; and \n\n- (e) our directors and employees who are involved in the Agreement are prohibited from engaging in any work or employment other than in the performance of this Agreement, with or without remuneration, which could create or potentially give rise to any actual, apparent, potential or perceived conflict between their personal/financial interests and their duties in connection with the Agreement. Our agents and subconsultants are required to impose similar restriction on their directors and employees by way of a contractual provision. \n\n(Name of the Consultants)   …………….. (Name of the Signatory) .……………. (Position of the Signatory)  .……………. (Date) .…………….\n\n<!-- p.81 -->\n**Annex 8 To Technical Note** \n\n###### **Declaration Form by Consultants** **on their Compliance with the Ethical Commitments Requirements** \n\n**(This form is to be submitted by the Consultants upon submission of tender, commencement of the Services and thereafter at quarterly intervals)** \n\nTo: Employer’s Representative (SAHK) \n\nAgreement No.: ……………… \n\nTitle: …………………………………………………………………. \n\n(1) We confirm that we have complied with the following provisions and have ensured that our directors, employees, agents and sub-consultants are aware of the following provisions: \n\n- (a) Prohibiting our directors, employees, agents and sub-consultants who are involved in this Agreement from offering, soliciting or accepting any advantage as defined in section 2 of the Prevention of Bribery Ordinance, Cap 201 when conducting business in connection with this Agreement; \n\n- (b) Taking all measures as necessary to protect any confidential/ privileged information or data entrusted to us by or on behalf of the Employer from being divulged to a third party other than those allowed in this Agreement. \n\n(2) We further confirm that we have ensured that our accountants, insurers and legal advisers are aware of the provisions requiring us taking all measures as necessary to protect any confidential/privileged information or data entrusted to us by or on behalf of the Employer form being divulged to a third party other than those allowed in this Agreement. \n\n(Name of the Consultants)   …………….. (Name of the Signatory) .……………. (Position of the Signatory)  .……………. (Date) .…………….\n\n<!-- p.82 -->\n**Annex 9 To Technical Note** \n\n**Guidelines for Tender and Contract Negotiations** \n\n### **Guidelines for Tender and Contract Negotiations** \n\nPersons authorized to conduct negotiations with tenderers and contractors shall observe the following guidelines when preparing for and conducting negotiations with tenderers and contractors – \n\n- (a) Be clear about what is intended to be achieved from the negotiation. For example, this can be a reduction of tender price, a change to the payment terms, removal of a counter-proposal (e.g. restriction of liability) from the tenderer or adjustment to the price for additional requirements of items or service. \n\n- (b) Draw up a checklist of the items to be discussed. The tenderers and contractors participating in the negotiations may be given a copy of this checklist so that they know what to discuss and bring the right people to the meeting. \n\n- (c) Determine what the baseline for negotiation should be and seek prior clearance as necessary. \n\n- (d) Consider what fall back positions SAHK would need to adopt in case the negotiation fell through and plan ahead, for example, by considering the need to extend the existing contract period, cancel the tender exercise, re-tender the contract, etc. \n\n- (e) Keep the negotiation team small and limit the number of staff to those who are absolutely essential. There is no need to match the other party in numbers. \n\n- (i) Hold a pre-meeting so that members of SAHK negotiating team familiarize themselves with the ground rules and the relative strengths and weaknesses of the parties to the negotiation. \n\n- (j) Do not reveal to tenderers and contractors participating in negotiations SAHK’s baseline unless a deadlock persists after repeated rounds of negotiations and the negotiating team is satisfied that its disclosure is necessary. \n\n- (k) Do not give tenderers and contractors participating in negotiations conditional treatment based on linking past or future procurements, except for those already indicated in the tender document. \n\n- (l) Do not reveal to tenderers and contractors participating in negotiations information about other tenderers’ prices or technical proposals. \n\n(Version: February 2012) \n\n1 of 1 (Annex 9)\n\n<!-- p.83 -->\n**Annex 10 To Technical Note** \n\n**Standard Tender Report Format** \n\n### **Standard Tender Report Format** \n\n(Note: Responsible Commissioner/Professional Scouter may provide additional information in the tender report having regard to individual circumstances of their tenders and / or delete those part(s) in this tender report format which is / are not applicable to their tenders.) \n\n#### **RESTRICTED (TENDER)** \n\n#### **MEMO** \n\nFrom : Budget Holder / Head of Procuring Scout Unit / Project in-charge / Tender Assessment Panel \n\nTo: Chairman , Tender Board \n\nContract Title: \n\nTender /Contract No: \n\n- A. Type, Duration and Estimate of Contract \n\nExample: This is a 3 -year service contract at an estimated value of HK$ million including provision of HK$ for price fluctuation adjustment. \n\n- B. Brief Description of Contract \n\n   - (a) Give a brief description of the scope of works and location of the project. \n\n   - (b) State the importance and sensitivity of the contract and any special tendering and contract requirements which have affected the tender recommendation, if applicable. \n\n   - (c) Highlight the major changes in tender requirements and specifications as compared with the previous tender exercise, if applicable, and provided reasons for such changes. \n\n   - (d) Provide details of any observations / comments made by the tender board in the previous tender exercise, if applicable, and state how such observations / comments have been addressed. \n\n[Revision: June 2016] \n\n1 of 5 (Annex 10)\n\n<!-- p.84 -->\n**Annex 10 To Technical Note** \n\n- C. Authority to Invite Tenders \n\n   - (a) For prequalified or single tendering, provide a summary of reasons and quote the approving authority. \n\n   - (b) For selective tendering, quote the shortlist and the approval by appropriate authority. \n\n- D. Details of Invitation \n\n   - (a) Date(s) and mode(s) (e.g. mail, internet and newspaper, etc.) of tender invitation. \n\n   - (b) The number of invitations issued. \n\n   - (c) Closing date (original and extended, where applicable) for receipt of tenders. \n\n   - (d) Date of expiry of validity, and the reasons for and date of expiry of extended validity, if any. \n\n   - (e) Expiry date of patent, if there is a patent. \n\n   - (f) Reasons for delay in submitting the tender recommendation, if applicable. \n\n- E. Details of Tenders \n\n   - (a) State the number of tenders received and withdrawn, if any. If only one or very few tenders have been received, state whether pre-tender market research has been conducted and state the estimated number of potential suppliers or contractors. \n\n   - (b) List the tenderers in the form of a comparative statement showing the tender sums quoted by each of the respective tenderers, starting with the lowest for procurement tender, discrepancies in tenders, etc. This may be supplemented by an enclosure if necessary. If there are corrections to the tender sums, provide details and attach copies of tenderers' letters confirming their willingness to abide by the rates inserted in the tender and corrected extensions / tender sum for re-measurement contract or to abide by the tender sum inserted in the Form of Tender for lump sum contract, as the case may be. List the tenders according to the corrected tender sums alongside the original tender sums. \n\n   - (c) If the tender sums are very close and there are considerable differences in \n\n[Revision: June 2016] \n\n2 of 5 (Annex 10)\n\n<!-- p.85 -->\n**Annex 10 To Technical Note** \n\nthe pricing of individual items or when tenders warranting closer examination are considered “front-loaded”, state the outcome of discounted cash flow analysis and the effects of net present values of the tender sums on the position of the recommended tenderers. If there are reasons for not conducting the present value calculation, state these reasons. \n\n   - (d) Identify items that are obviously and substantially over or under-priced or not priced at all and where changes in the quantity of work required under such items would materially affect the final contract price. \n\n- F. Tender Evaluation \n\n   - (a) State the composition of the Tender Assessment Panel. \n\n   - (b) State the evaluation criteria under the terms of tender, and provide details of the approved marking scheme, if applicable. \n\n   - (c) Provide details of each of the tender evaluation. Give details on noncompliance with tender requirements and specifications. This may supplement by an enclosure, if necessary. \n\n   - (d) Confirm that post-tender closing contacts /clarifications with tenderer(s), if any, were conducted in accordance with the relevant tender terms and procedures in the Technical Note on Tendering and Management of Capital Works Projects. \n\n   - (e) Provide details and results of any negotiations with tenderer(s) if prior approval to conduct tender negotiations has been obtained from the appropriate authority. \n\n   - (f) State any deviations from the Guidance Notes on Finance Matters and the procedures in the Technical Note on Tendering and Management of Capital Works Projects, with justifications \n\n- G. Recommendation \n\n   - (a) State the recommendation on the tender to be accepted. \n\n   - (b) Provide detailed reasons for not recommending acceptance of the lowest conforming tender, or the tender of the highest overall scorer when a marking scheme is used for tender assessment. \n\n   - (c) Confirm that the tender recommended for acceptance complies with the tender terms, conditions and specifications. If not, state where the tender \n\n[Revision: June 2016] \n\n3 of 5 (Annex 10)\n\n<!-- p.86 -->\n**Annex 10 To Technical Note** \n\nfails to comply and justify why the recommended tender is still considered suitable. \n\n   - (d) Confirm that the recommended tenderer is suitable to perform the contract, making reference to the performance track records where available. If the recommendation is a controversial one, e.g. if a recommendation is made against the advice of consultants or if the lowest conforming tender or highest overall scorer as appropriate is not recommended for acceptance, Budget Holder may wish to comment on the suitability of other tenderers whose tenders are nearest to the one being recommended so that the Tender Board may be able to decide on the acceptance. \n\n   - (e) State any other special circumstances or important assumptions / considerations governing the recommendation. Also state any complaint(s) received relevant to the tender exercise and how such complaint (s) has / have been handled. \n\n   - (f) State whether the recommended tenderer is considered financially capable to perform the contract. State also if the tenderer is required to pay a contract deposit or performance bond. \n\n   - (g) If tenders are invited from contractors on approved list(s) of concerned department(s) of the Government of HKSAR, confirm that the recommended tenderer is not suspended from tendering. \n\n   - (h) For cancellation of tender exercise (i.e. not recommending acceptance of any of the received tenders), state the reasons, the way forward and where applicable the legal advice obtained. \n\n- H. Comparison with the Pre-tender Estimate and Similar Contracts \n\n   - (a) State the following sums and compare the recommended tender sum with the sum allowed for the contract and the pre-tender estimate. Explain the reasons for difference of +/-10% and above, where applicable – \n\n      - Recommended tender sum \n\n      - Sum approved for this contract (month / year of approval ) \n\n      - Pre -tender estimate (month / year of preparation) \n\n   - (b) Explain the basis on which the pre-tender estimate is drawn up. \n\n   - (c) Compare the recommended tender sum / rates with the pre-tender estimate and those in similar contracts (month / year of award), and explain \n\n[Revision: June 2016] \n\n4 of 5 (Annex 10)\n\n<!-- p.87 -->\n**Annex 10 To Technical Note** \n\nthe difference, where applicable. If a price comparison cannot be made, this should be stated and explained. \n\n   - (d) Compare the recommended tender sum with the second and third lowest tenders / highest combined scorers. \n\n   - (e) Confirm with analysis that the recommended tender sum is fair and reasonable, and explain why it is considered realistic to accept the tender if its tender sum / rate(s) is significantly higher or lower than the pre-tender estimate or the sum approved for the contract. \n\n- I. Availability of Funds \n\nConfirm that funds are available. If the tender sum is greater than the sum approved for the contract, state whether additional fund has been sought and when it will be available. \n\n- J. Declaration of Interest \n\n   - (a) Confirm whether officers involved in preparing tender documentation (including tender specifications and marking schemes) and assessing tenders have declared their interest, and state ,where conflict of interest (actual, potential or perceived) has been identified, what remedial action has been made. \n\n   - (b) Confirm whether the recommended tenderer has declared in respect of conflict of interest. \n\n- K. Name and Telephone Number of Contact Officer \n\nNominate a representative of the procuring scout unit to answer questions from the Tender Board or attend Board meetings for this item, if necessary. The telephone numbers of the nominated representative should be provided. \n\n( ) \n\nSigned by Budget HolderNotes \n\n###### Notes \n\n1. _Where tender assessment is conducted by consultants, the tender report shall be signed by the consultants and countersigned by Budget Holder._ \n\n2. _Where the project is funded by the capital works budget of Estate Branch, the tender report shall be signed by the head of the procuring scout unit._ \n\n3. _Where Budget Holder for the project is the Chief Commissioner, the tender report shall be signed by the Project In-charge._ \n\n4. _Tender Assessment Panel members need not to sign the tender report._ \n\n[Revision: June 2016] \n\n5 of 5 (Annex 10)\n\n<!-- p.88 -->\n**Annex 11 To Technical Note** \n\n**Estate Branch Form EB003** \n\n#### `香 港 童 軍 總 會` \n\n###### `工程視察紀錄表` \n\n|`單位名稱`|`工程負責人`<br>**(**`姓名及職位`**)**|\n|---|---|\n|`工程名稱`||\n|工程編號||\n|`出席人士`**(**`姓名及職位`**)**|`視察日期`|\n|`工程顧問：`||\n|`承建商：`||\n|`香港童軍總會： `||\n\n|`視察詳情`*****|\n|---|\n|`進度：`|\n|`預計及實際工期比較：`|\n\n```\n施工質素：\n其他：\n```\n\n|`
