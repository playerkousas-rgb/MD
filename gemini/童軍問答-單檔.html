小組|81|\n|規條5.21|總會屬會|82|\n|規條5.22|總會附屬單位|83|\n\n<!-- p.4 -->\n## 目 錄（續） \n\n|||頁  數|\n|---|---|---|\n|第六章|通用規條||\n|規條6.1|行為操守|84|\n|規條6.2|財務管治|85|\n|規條6.3|宗教政策|86|\n|規條6.4|政治活動|87|\n|規條6.5|對會方的政策發表意見|88|\n|規條6.6|通 訊|89|\n|規條6.7|童軍儀式|90|\n|規條6.8|勳章及獎勵|91-94|\n|規條6.9|童軍旗|95-96|\n|規條6.10|<br>童軍半禮、敬禮及握手|97|\n|規條6.11|<br>喪 禮|98|\n|規條6.12|<br>銓釋及修訂|99|\n|規條6.13|兩種語文本的「政策、組織及規條」的釋疑|100|\n\n<!-- p.5 -->\n```\n引 言\n```\n\n`香港童軍總會乃根據香港法律第` 1005 `章「香港童軍總會條例」而設立（有關條例原 本為` 1927 `年第` 22 `號［第` 268 `章，` 1950 `年編正版）－` 1939 `年第` 33 `號，` 1950 `年第` 22 `號，` 1975 `年第` 19 `號，` 1977 `年第` 28 `號，［第` 1005 `章，` 1977 `年編正版］），該條例賦予童軍 總會權力由會務委員會制定會章。該會章批准制訂各項規條以管理總會事務，此即現時 的「香港童軍總會政策、組織及規條」或通稱「` POR `」。` \n\n`香港童軍總會於` 1977 `年在加拿大滿地可舉辦的第` 26 `屆世界童軍會議中，被世界童 軍組織接納為正式會員。在此之前仍隸屬於 「（英國）童軍總會」，亦被稱為「（英國） 童軍總會香港分會」。當時英國母會實施的「政策、組織及規條」亦適用於香港。直至` 1978 `年，總會獲正式命名為「香港童軍總會」；總會亦自行編訂「政策、組織及規條」 的初版（內容包括有關總會在政策、組織、活動、訓練及規條的新改革）以取代原先英 國母會的「政策、組織及規條」。` \n\n`事隔九年，先前在` 1978 `年編訂的「政策、組織及規條」，經修改後，被` 1987 `年的 版本所取代，該版本在` 1993 `年又再作出些微修訂。至於` 2003 `年所暫編的「政策、組織 及規條」新草稿並未獲接納通過；而一個新的「政策、組織及規條」檢討專責小組在` 2006 `年` 1 `月` 15 `日成立［註一］，以期將` 1987 `年的版本更新。及後，在` 2007 `年` 11 `月` 3 `日， 該檢討專責小組增加四位委員［註二］；經過四年的努力，更新的「政策、組織及規條」 草稿終於完成並呈交予總會會務委員會的執行委員會。有關新草稿在` 2010 `年` 3 `月` 11 `日 獲得總會執行委員會一致通過及正式採納。` \n\n`這新一輯` 2010 `年版本的「政策、組織及規條」，如先前所有的版本一樣，繼續為蓬 勃發展之香港童軍運動提供管理的方針、指引及規則。香港童軍總會亦會繼續堅守童軍 運動的基本原則及價值觀，包括遵守童軍誓詞和規律，持渝不變。` \n\n2010 `年` 4 `月` 15 `日` \n\n- `［註一］：「政策、組織及規條」檢討專責小組成員` \n\n   1. `鮑紹雄先生` SBS `（` 2004 `年` 1 `月` 1 `日獲委任為香港總監）` \n\n   2. `李家山先生` CSMSM 3. `王德良先生` 4. `柯保羅先生` \n\n   5. `陳樹鍈先生` SBS JP 6. `康寶森先生` 7. `周湛燊博士` OBE LLD JP 8. `王津先生` MBE JP \n\n- `［註二］：「政策、組織及規條」檢討專責小組增加的四位成員` \n\n   1. `陳傑柱先生` PMSM `（` 2007 `年` 11 `月` 3 `日獲委任為香港總監）` \n\n   2. `王建明先生` \n\n   3. `盧立偉先生` 4. `麥偉明博士`\n\n<!-- p.6 -->\n第一章   政策、目的、使命、銘言、方法及會籍 \n\n法團組織 \n\n香港童軍總會（下稱「總會」）是根據香港特別行政區法律第 1005 章「香 港童軍總會條例」而設立（有關條例源自 1927 年的「條例」第 22 號）， 乃惟一在香港特別行政區內獲得世界童軍會議承認的會員。 \n\n1\n\n<!-- p.7 -->\n規條 **1.1** 目的、使命、銘言、及方法 \n\n規條 **1.1.1** 總會的目的，旨在促進青少年身心精神的陶冶與啟發，使能成為良好公 民，有助於社會。 \n\n- 規條 **1.1.2** 總會的使命乃致力於青少年的教育工作。透過富挑戰性及有進度性的訓練 和活動，促進青少年德、智、體、羣、美五育的發展。 \n\n- 規條 **1.1.3** 總會的銘言為「準備」。 \n\n- 規條 **1.1.4** 在成年人引導下，我們採用以下的童軍訓練方法，以達成總會的目的： \n\n   1.  教導青少年成員在日常生活中謹守「童軍誓詞和規律」 \n\n   2.  安排青少年參與歡愉和有進度性的活動 \n\n   3.  引導青少年成員從實踐中學習 \n\n   4.  採取小隊及小組的合作方式 \n\n   5.  培訓青少年成為有抉擇能力、有責任感及勇於承擔的人 \n\n   6.  激勵青少年自我學習和啟發，並樂於接受新增的責任與挑戰 \n\n2\n\n<!-- p.8 -->\n規條 **1.2** 誓詞及規律 規條 **1.2.1** 童軍誓詞及規律 \n\n童軍誓詞 我願以信譽為誓，竭盡所能； 對神明，對國家，盡責任； 對別人，要幫助； 對規律，必遵行。 \n\n- 童軍規律 1.  童軍信用為人敬。 \n\n2.  童軍待人要忠誠。 \n\n3.  童軍友善兼親切。 \n\n4.  童軍相處如手足。 \n\n5.  童軍勇敢不怕難。 \n\n6.  童軍愛物更惜陰。 \n\n7.  童軍自重又重人。 \n\n除幼童軍及小童軍另有其誓詞及規律（規條 1.2.2 及 1.2.3）外，上述童軍 誓詞及規律適用於其他所有童軍成員。 \n\n### 規條 **1.2.2** 幼童軍誓詞及規律 \n\n幼童軍誓詞 我願盡所能，對神明，對國家，盡責任； 對別人，要幫助； 對規律，必遵行。 幼童軍規律 幼童軍，盡所能， 先顧別人才顧己， 日行一善富精神。 \n\n規條 **1.2.3** 小童軍誓詞及規律 \n\n小童軍誓詞 我願參加小童軍， 愛神愛人愛國家。 小童軍規律 小童軍日行一善。 \n\n3\n\n<!-- p.9 -->\n## 規條 **1.3** 會籍 \n\n規條 **1.3.1** 成員資格 \n\n總會公開招收成員，歡迎任何願意接受童軍誓詞與規律及恪守總會原則的人 士參加，並無種族、宗教、階級和性別之分，成員全部均為自願加入。除香 港總監批准外，該等人士應該是香港居民，以及通常於香港居住、讀書或工 作。 \n\n- 規條 **1.3.2** 年齡限制 \n\n   - (a) 總會成員的最低年齡為四歲；最高年齡則不受限制。惟總會在若干職位 的委任，則設有最高及最低的年齡規限。 \n\n   - (b) 若該成員的會籍乃因接受總會之委任而獲得者，當該成員到達其委任的 最高年齡規限時，則其成員資格亦會因其委任屆滿而終止。 \n\n規條 **1.3.3** \n\n- 入會辦法 \n\n總會會籍可循下述途徑獲得： \n\n- (a) 青少年成員（小童軍、幼童軍、童軍、深資童軍及樂行童軍）－ 依循總會的宣誓儀式宣誓並繳交成員費； \n\n- (b) 總領袖、副總領袖、贊助人及副贊助人－ 經由總會邀請出任； \n\n- (c) 總監、領袖及教練員－ \n\n在委任時依循總會的宣誓儀式宣誓並繳交成員費； \n\n   - (d) 會務委員（包括總會、地域、屬會、區及旅的會務委員會或附屬委員會 會長、副會長、名譽會長、主席、副主席、司庫、祕書、顧問及委員等， 非持有總監或童軍領袖委任書或教練員或童軍成員委任書的人士）－ 經由總會委任後，並繳交成員費； \n\n   - (e) 名譽總監－ \n\n      - 經由總會委任後，並繳交成員費。名譽總監乃名譽上的委任並無實職， 由香港總監推薦經名譽總監委任委員會同意後而頒授予個別屆齡退役並 在退休前對童軍運動有超卓貢獻的總監。名譽總監委任委員會可在其認 為適當的情況下撤銷此委任。 \n\n   - (f)  總會聘請的專業領袖及受薪職員－ \n\n      - 於到職時或之後依循總會的宣誓儀式宣誓。 \n\n   - (g) 由規條 1.3.3(b)至規條 1.3.3(f)而獲得總會會籍的成員，整體皆被稱為成 年成員。 \n\n- 規條 **1.3.4** \n\n成員權利 \n\n經依循總會的宣誓儀式宣誓的成員可以： \n\n   - (a) 穿著總會認可的制服；及 \n\n   - (b) 佩戴世界童軍會員章及總會其他認可的童軍徽章。 \n\n- 規條 **1.3.5** 附屬成員入會辦法 \n\n凡根據總會訂定的程序及條件，在香港成立的屬會或附屬單位（包括童軍 知友社及其屬下單位、領袖訓練學院、香港童軍貝登堡聯誼會、總監俱樂 部、在香港成立的外國童軍單位及其他童軍屬會或附屬單位），其成員均 為總會附屬成員。 \n\n( 2023 年  5 月) \n\n4\n\n<!-- p.10 -->\n規條 **1.3.6** 終止會籍 \n\n- (a) 除本「政策、組織及規條」或有關屬會會章所載各種情況外，如經總 會執行委員會議決，可終止任何成員及附屬成員的會籍。而總會執行 委員會無須對所作出的決定作任何解釋。 \n\n- (b) 當總會遵照本「政策、組織及規條」的規定，主動地終止某成員或附 屬成員的會籍時，總會將會在可能範圍內，盡快用掛號郵遞把有關書 面通知寄給該成員或附屬成員在總會紀錄上之最新地址。 \n\n### 規條 **1.3.7** 暫停會籍 \n\n- (a) 當預計有需要終止某成年成員的會籍，而實際情況仍需要作進一步調 查時，或在有其他急切原因下，下列人士可有權暫停其屬下成員的會 籍： \n\n   - (i) 區總監與地域總監協商後，可暫停其屬下旅內成年成員的會籍； \n\n   - (ii)   總會各署總監或各地域總監可暫停其部門內或其地域與屬下童軍 區內成年成員的會籍； \n\n   - (iii)  香港總監可暫停助理香港總監、副香港總監及其他成年成員的會 籍。 \n\n- (b) 總會在可能範圍內，盡快用掛號郵遞把有關書面通知寄給該成員在總 會紀錄上之最新地址。 \n\n- (c) 在暫停會籍期間，該成員須立即交還其委任書或委任證予總會存檔。 任何所持的職位亦將當作出缺處理。 \n\n- (d) 被暫停會籍的成員將會被禁止參與一切與總會或與總會名義有關的活 動，亦將不會獲準穿著童軍制服和配戴童軍徽章。 \n\n- (e) 當有關方面根據規條  1.3.7(a)需要對上述成年成員作出暫停會籍的安 排時，須在可能範圍內盡快提交詳細書面報告，並會知有關人士。 \n\n- (f)  香港總監將會考慮有關暫停會籍事件，並會在暫停會籍後三十天內， 決定是否讓有關成員恢復其會籍、將其會籍終止或延長暫停其會籍的 \n\n- 時間。 \n\n- (g) 總會將會在七天內，將香港總監對有關暫停會籍事件的決定，以總會 紀錄上之最新地址，用掛號郵遞方式，通知上述成員。 \n\n### 規條 **1.3.8** 終止或暫停會籍的上訴 \n\n- (a) 當總會根據規條 1.3.6(b)或 1.3.7 的規定，主動地終止或暫停任何助理 香港總監或副香港總監會籍時，該總監可在有關書面通知發出日期後 的三十天內，以書面向總會會長提出上訴。根據規條 5.6.2，總會會長 的決定將為最終的定案。 \n\n- (b) 當總會根據規條 1.3.6(b)或 1.3.7 的規定，主動地終止或暫停其他任何 成年成員會籍時，該成員可在有關書面通知發出日期後的三十天內， 以書面向香港總監提出上訴。香港總監的決定將為最終的定案。 \n\n( 2015 `年` 1 `月` ) \n\n5\n\n<!-- p.11 -->\n## 第二章 童軍旅 \n\n## 規條 **2.1** 童軍旅 \n\n規條 **2.1.1** 童軍旅的類別 \n\n童軍旅（亦指旅）為青少年成員可加入總會的基本單位，可分為兩個類別﹕ \n\n- (a) 公開旅 –  不隸屬任何機構；或 \n\n- (b) 團體旅 –  由下列或其他獲總會認可的機構向總會註冊主辦，並具有與 主辦機構協議訂定的招收成員政策﹕ \n\n   - (i) 教育機構； \n\n   - (ii) 青少年中心或社區中心； \n\n   - (iii) 宗教團體； \n\n   - (iv) 工商業機構； \n\n   - (v) 居民及社區組織； \n\n   - (vi) 醫院及公共機構； \n\n   - (vii) 政府部門或機構； \n\n   - (viii) 非政府組織；及 \n\n   - (ix) 總會屬會。 \n\n- (c) 所有旅，不管其是否有主辦機構，必須遵守本「政策、組織及規條」所 訂各項規條。團體旅的主辦機構，亦需要遵守規條 2.1.2 所列明的各項 規條。 \n\n- (d) 各旅可採取限制性或公開招收成員的政策。 \n\n### 規條 **2.1.2** 團體旅 \n\n- 團體旅的主辦機構，須清楚明瞭與總會訂定協議內的各項細則及詳細說明。 (a) 團體旅的主辦機構須在總會同意下，委任一名人士作為該主辦機構的 「代表」。 \n\n- (b) 主辦機構的責任 \n\n   - 主辦機構須允諾承擔以下責任﹕ \n\n   - (i) 接受總會在本「政策、組織及規條」內列明的政策，包括規條 2.3 所訂定的旅及該旅各支部的最低標準； \n\n   - (ii) 積極鼓勵該旅的發展，並給予旅長支持，使他在旅內能履行其職 責； \n\n   - (iii) 準備一份主辦機構與該旅皆同意遵守有關器材使用及產業的協 議。此協議如有任何修訂皆需要每年由旅長或旅負責領袖呈交予 所屬區總監以作紀錄； \n\n   - (iv) 為該旅提供適當的場地作旅部及集會之用； \n\n   - (v) 確保該旅的領袖之延續性； \n\n   - (vi) 推薦及提名適合人士，依據規條 2.5 的規定擔任為該旅的領袖； \n\n   - (vii) 向該旅提供財政上的支持或確保該旅能獲得足夠經費完成各項訓 練與活動；及 \n\n   - (viii) 如主辦機構屬宗教團體，則須同時協助其旅的領袖，對該旅之中 屬於該宗教的青少年成員在靈性上的發展。 \n\n6\n\n<!-- p.12 -->\n### (c) 主辦機構的權利 \n\n主辦機構代表可出席旅務委員會。區總監在未曾作出對該旅有影響的 決定前，須先與該代表商討，尤其是有關下列各事項： \n\n      - (i) 該旅註冊（規條 2.2.2）； \n\n      - (ii) 該旅某一支部的停辦或被停止活動； \n\n      - (iii)  該旅與其他旅合併事宜（規條 2.1.4）； \n\n      - (iv) 青少年成員上訴有關其被開除會籍事宜（規條 2.4.3  及 2.4.4）； \n\n      - (v) 在主辦機構與總會訂定開辦團體旅的協議書範圍內，有關該旅的 領袖及教練員之委任（規條 2.1.3 及規條 2.5）； \n\n      - (vi) 除區總監認為屬緊急事件而未有足夠時間事前諮詢主辦機構外， 一切有關該旅領袖被暫停會籍事宜。 \n\n- 規條 **2.1.3** 總會與主辦機構訂定開辦團體旅的協議書 \n\n   - (a) 當總會批准有關團體旅註冊時，區總監須擬定一份總會與主辦機構的正 式協議書（清楚列明主辦機構與總會的責任及權利），以便雙方在該團 體旅正式註冊前簽署。 \n\n   - (b) 如主辦機構與總會協議採納非公開招收成員的政策，協議書內須清楚列 明。 \n\n   - (c) 協議書的內容，雙方須每五年或在雙方同意下，提早作一次全面檢討及 修訂。但如遇有更換旅長或主辦機構的管理模式有所改變，或人事方面 有重大變動時，亦須同時作出檢討及修訂。 \n\n- 規條 **2.1.4** 團體旅的合併 團體旅的合併事宜應獲有關主辦機構及總會同 意方可進行。 \n\n7\n\n<!-- p.13 -->\n## 規條 **2.2** 童軍旅的註冊 \n\n規條 **2.2.1** 旅的開辦乃由區總監向地域總監作出建議，並由地域總監批准。在未獲得 區總監的書面同意前，不應展開任何開辦旅的行動及步驟。 \n\n- 規條 **2.2.2** 申請童軍旅註冊 \n\n   - (a) 旅申請註冊時，須由下列人士／機構經區總監轉遞交地域總監辦理： (i) 如屬公開旅，由其候任旅長負責申請及遞交； \n\n      - (ii) 如屬團體旅，由申請開辦旅的主辦機構授權人申請及遞交。 \n\n   - (b) 區總監於接獲旅註冊申請時，須衡量下列各點： (i) 須注意該旅能否符合本「政策、組織及規條」的要求，適當地運 作； \n\n      - (ii)   有適當的童軍領袖； \n\n      - (iii)  能為該旅提供適當的場地作旅部及集會之用； \n\n      - (iv)  為該旅提供財政上的支持或確保該旅能獲得足夠經費的支持；及 (v) 其候任旅長將履行下列職務﹕ \n\n         - 恪守總會的政策、規條及運作程序； \n\n         - 履行本會明文規定有關宗教、政治及保護兒童的政策； \n\n         - 推行一套根據總會訓練政策擬訂的訓練及活動計劃； \n\n         - 遵行所有總會擬定有關團體旅適用的協議條款。 \n\n   - (c) 如申請註冊的旅完全符合規條 2.2.2(b)的要求，以及區總監認為必要的 其他要求，區總監將會向地域總監推薦批准該旅的註冊申請。 \n\n   - (d) 當地域總監認為有關註冊對區內童軍運動的發展有所裨益時，將會批准 及簽認該申請書。 \n\n   - (e) 如區總監或地域總監決定拒絕推薦該旅的註冊申請，則必須向香港總監 提交一份詳細的書面報告以供考慮。香港總監的決定將為最終的定案。 總會將會以書面通知未能成功的申請者。 \n\n   - (f)  如旅的註冊申請被批准，總會將發出「童軍旅註冊證書」，經由地域總 監及區總監頒予該旅的候任旅長。倘屬團體旅，總會將會在雙方完成簽 署「開辦團體旅協議書」後，把「童軍旅註冊證書」發給主辦機構。 \n\n規條 **2.2.3** 童軍旅週年註冊 \n\n   - (a) 總會只認可註冊有效的旅為總會所屬單位。 \n\n   - (b) 旅註冊的有效期乃由正式註冊日期開始至下年度一月三十一日止。屆時 須重辦旅註冊。而在此之後，於每年的一月三十一日或之前，該旅須重 新註冊，遞交有關旅更新註冊表格，並繳交該旅成員的成員費（規條 2.11.5）。區總監須確認該旅符合本「政策、組織及規條」內所列有關 旅註冊的要求。 \n\n- 規條 **2.2.4** 更改童軍旅註冊及支部的增加／取消 \n\n   - (a) 如某一旅需要更改原來註冊或與另一旅合併，必須將有關詳細資料，經 區總監及地域總監遞交總會處理。 \n\n   - (b) 如旅的組織架構因開拓新支部或結束某支部而有所改變，該旅不必因此 而更改其旅註冊，惟此等改變須獲區總監的批准，方可實施。而區總監 在未作出決定前，應先諮詢地域總監及該旅主辦機構（如適用）的意見。 \n\n8\n\n<!-- p.14 -->\n該旅如被允許作上述架構的改變，無須就此事向總會作特別報告，只須 於年底填報更新註冊表格時（規條 2.2.3）提供其架構改變的資料。 \n\n- (c) 如該旅不被允許改變架構，區總監須盡快作一詳細書面報告並經地域總 監遞交香港總監。 \n\n### 規條 **2.2.5** 暫停童軍旅註冊 \n\n- (a) 區總監可在獲得地域總監批准後暫停旅的註冊。 \n\n- (b) 當旅被暫停註冊時，其所有活動（旅務委員會會議除外）將會暫停。該 旅的全部領袖亦暫時停止職務，一如規條 1.3.7 內列明個別成員被暫時 停止職務。在此期間，該旅所有成員均不得穿著童軍制服或佩戴童軍徽 章。如暫停該旅註冊指令包括該旅旅務委員會在內，則必須清楚列明， 並由區執行委員會負責暫時管理該旅的資產及財政。 \n\n- (c) 被暫停註冊的旅，在特殊情況下方可停止其旅務委員會的活動，此項決 定必須事前得到地域總監的批准。 \n\n- (d) 區總監如需要暫停某旅的註冊，必須經地域總監向香港總監作一詳細報 告，並會知有關主辦機構。 \n\n- (e) 暫停旅註冊乃暫時性的措施，須盡早作一全面調查。地域總監可委派一 調查委員會進行調查。各有關人士均須有平等機會對該事件表達其個人 意見。如引致暫停旅註冊的原因為本「政策、組織及規條」內所提及的 糾紛，地域總監亦可依據本「政策、組織及規條」所列明的方法解決紛 爭而無須組織調查委員會處理。暫停旅註冊令亦可因而撤銷。 \n\n- (f)  當區總監撤銷暫停旅註冊令時，該旅可恢復所有活動。 \n\n### 規條 **2.2.6** 撤銷童軍旅註冊 \n\n- (a) 在下述情況，旅註冊可被總會撤銷： \n\n   - (i) 根據規條 2.2.5(e)所定，地域總監委派一調查委員會進行調查後，撤 銷其註冊； \n\n   - (ii) 在規條 2.2.3(b)中所規定的時間內，沒有重新註冊而被撤銷； \n\n- (b) 當某一旅註冊被撤銷後，此童軍單位再不復存在，區總監須依據香港總 監的指示（規條 2.11.8(b)），採取適當行動，處理該旅終止時的物品及 資產。如有需要，區總監亦須安排轉介有關成員往另一旅。 \n\n### 規條 **2.2.7** \n\n### 暫停或結束童軍旅內某支部 \n\n- (a) 在獲得地域總監的批准後，區總監可以暫停旅內任何一支部集會／活 動。 \n\n- (b) 暫停支部集會／活動僅屬暫時的措施，地域總監須如規條 2.2.5(e)內列 明，盡早作一全面的調查。 \n\n- (c) 區總監可於暫停支部集會／活動前，先諮詢有關主辦機構的代表。除非 區總監認為事情緊急，未有充分時間作出諮詢。 \n\n- (d) 區總監經地域總監批准後，可決定立即終止該旅內任何支部，惟事前仍 須諮詢有關主辦機構。 \n\n- (e) 如有需要，區總監須安排轉介有關支部成員往另一旅。 \n\n9\n\n<!-- p.15 -->\n童軍旅名稱及編號 \n\n規條 **2.2.8** \n\n- (a) 當總會為旅辦理註冊時，亦會為其安排旅名稱及編號。 \n\n- (b) 除先前已在總會註冊外，所有旅編號均不可以包含有童軍區名稱。 \n\n( 2022 `年` 9 `月` ) \n\n10\n\n<!-- p.16 -->\n## 規條 **2.3** 童軍旅的架構及組織 \n\n規條 **2.3.1** 旅是由旅長在以下人士的支持下領導︰ (a)   該旅的領袖及教練員； \n\n   - (b) 旅務委員（如有）。 \n\n- 規條 **2.3.2** 一個旅可由以下最少一個或多個支部組成： \n\n   - (a) 小童軍團 \n\n   - (b) 幼童軍團 (c)   童軍團 \n\n   - (d) 深資童軍團 (e)   樂行童軍團 \n\n- 規條 **2.3.3** 小童軍團 \n\n   - (a) 一小童軍團，最多不能超過三十六名團員。 \n\n   - (b) 小童軍可以穿著總會指定的簡單童軍服飾。 \n\n   - (c)  年齡規限：四歲至七歲。 \n\n   - (d) 下列為一小童軍團的最低應有標準： \n\n      - (i) 人 數：一已成立的小童軍團，最少要有小童軍六名。 \n\n      - (ii) 領 袖：一小童軍團最少要有兩名領袖，其中一名必須持有領袖委 任書。此外，其中一名領袖的性別必須與該團成員相同。如團內有 男及女成員，則必須有男及女領袖，惟區總監可因應特殊情況批准 個別小童軍團豁免必須有男領袖的規定。 \n\n   - (e)  區總監須從旁協助，使小童軍團達到及超越上述標準。如小童軍團連續 兩年未達此標準，在地域總監批准下，區總監可暫停該團的集會／活動 或解散有關小童軍團。 \n\n### 規條 **2.3.4** 幼童軍團 \n\n- (a) 一幼童軍團不應超過八個小隊，每一小隊包括有小隊長、副小隊長各一 名及其他五名隊員。 \n\n- (b) 小隊長乃由幼童軍團長從隊員中委出。副小隊長是小隊長的副手，幼童 軍團長委任副小隊長前應先徵詢小隊長意見。 \n\n- (c) 小隊長會議是由幼童軍團各領袖及各小隊長組成，如認為有需要時，可 加入副小隊長。 \n\n- (d) 幼童軍須穿著總會指定的幼童軍制服。 \n\n- (e)  年齡規限：六歲至十一歲。 \n\n- (f) 下列各項為一幼童軍團的最低應有標準： \n\n   - (i) 人 數：一已成立的幼童軍團，最少要有幼童軍十二名。 \n\n   - (ii)   領 袖：一幼童軍團最少要有兩名領袖，其中一名必須持有領袖委 任書。此外，其中一名領袖的性別必須與該團成員相同。如團內有 男及女成員，則必須有男及女領袖。 \n\n( 2025 年 8 月) \n\n11\n\n<!-- p.17 -->\n- (iii)  青少年活動與訓練：幼童軍的活動與訓練，必須遵照總會出版的「幼 童軍訓練綱要」及所頒佈的任何有關修訂文件，並確保每年最少舉 行一次為期一天的全團遠足旅行。 \n\n   - (iv)  進 度：每年最少有四份一團員考獲較高一級的幼童軍進度性獎 章。 \n\n- (g) 區總監須從旁協助，使幼童軍團達到及超越上述標準。如幼童軍團連續 兩年未達此標準，在地域總監批准下，區總監可暫停該團的集會／活動 或解散有關幼童軍團。 \n\n### 規條 **2.3.5** 童軍團 \n\n- (a) 一童軍團不應超過八個小隊，每一小隊包括有小隊長、副小隊長各一名 及其他七名隊員。 \n\n- (b) 小隊長乃由童軍團長經與小隊長會議諮商後委出。副小隊長乃由小隊長 經童軍團長及小隊長會議同意後委出。童軍團長經與小隊長會議諮商 後，可委任一團隊長。 \n\n- (c) 小隊長會議是由各小隊長組成，如該團設有團隊長，則由團隊長主持會 議。團中各領袖可以顧問身分出席會議。小隊長會議的任務為安排團活 動、團內部管理及團經費支銷。 \n\n- (d) 小隊會議由小隊長召開，乃集合隊中各成員，一起討論小隊事務的會議。 \n\n- (e) 童軍須穿著總會指定的童軍、海童軍或空童軍制服。 \n\n- (f)  年齡規限：十一歲至十五歲。 \n\n- (g) 下列各項為一童軍團的最低應有標準： \n\n   - (i) 人 數：一已成立的童軍團，最少要有童軍十二名。 \n\n   - (ii) 領 袖：一童軍團最少要有兩名領袖，其中一名必須持有領袖委任 書。此外，其中一名領袖的性別必須與該團成員相同。如團內有男 及女成員，則必須有男及女領袖。 \n\n   - (iii)  青少年活動與訓練：童軍的活動與訓練，必須遵照總會出版的「童 軍訓練綱要」所頒佈的任何有關修訂文件，並確保每一童軍每年最 少有一次參與小隊或全團露營的機會。 \n\n   - (iv)  進 度：每年最少有四份一團員考獲較高一級的童軍進度性獎章。 \n\n- (h) 區總監須從旁協助，使童軍團達到及超越上述標準。如童軍團連續兩年 未達此標準，在地域總監批准下，區總監可暫停該團的集會／活動或解 散有關童軍團。 \n\n### 規條 **2.3.6** 深資童軍團 \n\n- (a) 一深資童軍團由深資童軍所組成，並由團執行委員會管理。 \n\n- (b) 深資童軍團的團執行委員會乃由所有團員選舉產生，包括主席及其他由 團員自行決定的委員人選。所有深資童軍團領袖皆為委員會的當然委 員。該委員會負責團內的架構、組織、活動及行政等事宜。深資童軍團 長可選擇出任執行委員會主席。如委員會主席不是由團長兼任時，則主 席職位 將由全體深資童軍互選一人擔任。 \n\n( 2025 年 8 月) \n\n12\n\n<!-- p.18 -->\n- (c) 深資童軍須穿著總會指定的深資童軍、深資海童軍或深資空童軍制服。 \n\n- (d)  年齡規限：十五歲至二十歲。 \n\n- (e) 下列各項為一深資童軍團的最低應有標準： \n\n   - (i) 人 數：一已成立的深資童軍團，最少要有深資童軍六名。 \n\n   - (ii)   領 袖：一深資童軍團最少要有兩名領袖，其中一名必須持有領 袖委任書。此外，其中一名領袖的性別必須與該團成員相同。如 團內有男及女成員，則必須有男及女領袖。 \n\n   - (iii)  青少年活動與訓練：深資童軍的活動與訓練，必須遵照總會出版的 「深資童軍訓練綱要」及所頒佈的任何有關修訂文件。 \n\n   - (iv)  團執行委員會：該委員會負責設計及推行年度活動計劃。 \n\n- (f)  區總監須從旁協助，使深資童軍團達到及超越上述標準。如深資童軍團 連續兩年未達此標，在地域總監批准下，區總監可暫停該團的集會／活 動或解散有關深資童軍團。 \n\n### 規條 **2.3.7** 樂行童軍團 \n\n- (a) 一樂行童軍團為樂行童軍所組成，並由團管理委員會管理。 \n\n- (b) 樂行童軍團的團管理委員會乃由所有團員選舉產生，包括主席及由團員 自行決定的其他委員人選。該委員會負責團內的架構、組織、活動及行 政等事宜。 \n\n- (c) 樂行童軍須穿著總會指定的樂行童軍、樂行海童軍或樂行空童軍制服。 \n\n- (d) 年齡規限：十八歲至二十五歲。 \n\n- (e) 下列各項為一樂行童軍團的最低應有標準： \n\n   - (i) 人 數：一已成立的樂行童軍團，最少要有樂行童軍六名。 \n\n   - (ii) 領  袖：一樂行童軍團最少要有兩名領袖，其中一名必須持有領袖 委任書。此外，其中一名領袖的性別必須與該團成員相同。如團 內有男及女成員，則必須有男及女領袖。 \n\n   - (iii)  青少年活動與訓練：樂行童軍的活動與訓練，必須遵照總會出版的 「樂行童軍訓練綱要」及所頒佈的任何有關修訂文件。 \n\n   - (iv)  團管理委員會：該委員會負責設計及推行年度活動計劃。 \n\n- (f)  區總監須從旁協助，使樂行童軍團達到及超越上述標準。如樂行童軍團 連續兩年未達此標準，在地域總監批准下，區總監可暫停該團的集會／ 活動或解散有關樂行童軍團。 \n\n規條 **2.3.8** 為迎合個別個案的特殊情況及／或個別團員發展的需求，並適隨各團員的個 別進展，在不違反規條2.3.3(c)有關小童軍入團最低年限的規定下，區總監可 在特殊情況下批准個別兒童、青年或有關支部的青少年成員加入或留在該支 部（視屬何種情況而定）而不受上述有關支部之年齡限制。 \n\n( 2025 年 8 月) \n\n13\n\n<!-- p.19 -->\n規條 **2.4** 青少年成員 \n\n規條 **2.4.1** 在加入旅時並按照規條1.3.3規定，青少年成員即成為總會成員，而該等成 員在同一時間只可以在總會一個童軍旅擁有一個青少年成員的身份。在青 少年成員退出該旅時，亦會同時喪失其會籍。旅長有招收會員的決定權， 但若該旅為團體旅，則招收會員的方法應依從總會與其主辦機構所訂立的 協議書內列明的政策進行。旅長通常會將招收會員的事宜交託予各支部負 責領袖。 \n\n### 規條 **2.4.2** 轉旅 \n\n當一成員因遷居而須離開其所屬旅，在該成員的請求下，旅長須為該成員 準備一封轉旅函件，以便其呈交予將會加入的新旅。若成員遷離本港，則 旅長須將該成員的資料送交總會國際總監辦理，以期該成員在遷居他國後 能繼續參與童軍活動。 \n\n### 規條 **2.4.3** 開除會籍 \n\n在旅長同意下，支部團長可開除青少年成員的會籍。有關開除會籍的書面 通知，須盡快寄給該成員在本會紀錄上之最新地址。書面通知內應註明開 除其會籍的理由及其上訴的權利（規條 2.4.4）。如該旅為一團體旅，則在 未開除該成員會籍前，必須諮詢其主辦機構的意見。 \n\n### 規條 **2.4.4** 開除會籍的上訴 \n\n根據規條 2.4.3 被開除會籍的青少年成員，由開除會籍書面通知發出日期的 三十天內，均有向地域總監提出上訴的權利（如有需要，可由父母協助）。 地域總監可委派一特別委員會進行聆訊。被開除會籍者須被邀出席聆訊， 以便有合理的機會對該事件表達個人意見。若被開除會籍者為一團體旅成 員，則按照規條 2.1.2 (c)，事前必須諮詢其主辦機構的代表。主辦機構的代 表亦有權出席聆訊，並有表達意見的機會。 \n\n( 2018 `年` 1 `月` ) \n\n14\n\n<!-- p.20 -->\n## 規條 **2.5** 童軍旅領袖及教練員的委任 \n\n### 規條 **2.5.1** 委任書及暫許委任書 \n\n   - (a) 領袖委任書只發給已完成由香港總監規定的某階段木章訓練課程之領 袖。 \n\n   - (b) 未完成該階段木章訓練課程的領袖，可獲簽發暫許委任書。暫許委任書 的持有人須於其暫許委任書屆滿前完成該階段木章訓練課程，纔可獲頒 領袖委任書。 \n\n- 規條 **2.5.2** 旅長的委任 \n\n   - (a) 區總監乃負責推薦旅長委任的人士。區總監在未推薦人選前，應適當諮 詢其主辦機構的代表及／或旅領袖會議。 \n\n   - (b) 候任人須符合下列條件，區總監方可進行有關推薦委任： \n\n      - (i) 申請人的年齡符合其申請職銜的年齡規限（規條 2.6）； \n\n      - (ii) 申請人具適當的品格及可被信賴交託予照顧青少年人的責任； \n\n      - (iii) 申請人有足夠資格承擔其申請職銜的各項工作（規條 2.6）； \n\n      - (iv) 申請人明白及接納本「政策、組織及規條」所訂定的目的及方法； \n\n   - (c) 申請人明白及接納其進修有關領袖必修課程的需要（規條 2.5.5）。 \n\n   - (d) 候任人須填寫及簽署有關推薦委任表格。 \n\n   - (e) 如地域總監支持該項申請，須在該推薦委任表格內適當的位置上簽署 後，送交香港總監，以便其簽發委任書或暫許委任書給予該領袖。 \n\n   - (f)  當一個旅的旅長職位懸空而又未能委任一名旅長時，區總監須任命該旅 一名領袖為該旅的負責領袖，以履行旅長之一切責任及工作。在作出此 暫時性委任前，區總監須諮詢主辦機構、旅務委員會主席及／或旅領袖 會議。 \n\n### 規條 **2.5.3** 副旅長、團長及副團長的委任 \n\n- (a) 如有關旅內最少有三個支部，或超過八十名青少年成員，通常會獲得區 總監批准委任一名副旅長。 \n\n- (b) 申請委任副旅長、團長或副團長，必須如規條 2.5.2(b)至 2.5.2.(e)內列明 的程序進行，並由旅長及區總監負責推薦委任。 \n\n### 規條 **2.5.4** 頒發領袖委任書／暫許委任書 \n\n區會收到巳簽妥的領袖委任書／暫許領袖委任書後，最理想由區總監盡快 頒發，否則可由副區總監或由其支部的助理區總監盡快頒發予該等人士。 接受委任書／暫許委任書時，領袖須作宣誓或覆誓。 \n\n- 規條 **2.5.5** 參加領袖訓練的義務 \n\n   - (a) 持有總會委任書／暫許委任書的領袖，均有責任完成進修木章訓練課 程。 \n\n   - (b) 總會規定領袖須於一合理的指定時間內，完成進修木章訓練課程或某階 段木章訓練課程。若一領袖未能於該指定期間內完成其課程，則其委任 書／暫許委任書或被撤銷。 \n\n( 2012 `年` 5 `月` ) \n\n15\n\n<!-- p.21 -->\n規條 **2.5.6** 領袖委任書及暫許委任書之覆核 \n\n   - (a) 除規條 1.3.6（終止會籍）及規條 2.5.5（領袖必修訓練課程）所列的條 例外，旅的領袖委任書有效期乃由簽發年份起計至最多不超過四年，屆 時區總監須對此等委任作覆核。至於旅的領袖暫許委任書有效期，則由 簽發年份起計至最多不超過兩年，屆時區總監須對此等委任作覆核。 \n\n   - (b) 當領袖委任書或暫許委任書有效期滿，可由區總監推薦續發。 \n\n   - (c) 惟有關總監推薦續發暫許委任書時，須附有該暫許委任書持有人的合理 書面解釋為何其仍未完成該階段木章訓練課程。 \n\n   - (d) 區總監或地域總監可於任何認為適當的時間對任何旅內領袖的委任／ 暫許委任作覆核。 \n\n   - (e) 所有此類覆核均須作詳細紀錄存於區總部，並具副本於地域總部存案。 \n\n   - (f)  當任何委任書未獲準續發時，有關領袖、其旅長及區總監將會收到總會 的書面通知。 \n\n- 規條 **2.5.7** 終止職務 \n\n   - (a) 當一領袖的職務被終止時，其委任書／暫許委任書將自動終止及作廢。 (b) 根據本「政策、組織及規條」的規定，如一名領袖的委任被終止時，他 必須交還其經撤銷的委任書／暫許委任書予總會。 \n\n- 規條 **2.5.8** 領袖委任書／暫許委任書的撤銷 \n\n   - 在下列任何一種情況，香港總監可主動或根據區總監或地域總監的建議， 暫停或撤銷有關人士的領袖委任書／暫許委任書： \n\n   - (a)   持有人請辭其職位； \n\n   - (b) 持有人默許有關撤銷其委任／暫許委任之決定； \n\n   - (c)   持有人不符合其職銜的年齡及資格規定； \n\n   - (d) 在欠缺充分的理由下，持有人未能完成其領袖必修訓練課程； \n\n   - (e)   根據規條 2.5.6，經有關人士覆核後，不再獲續發委任書／暫許委任書； \n\n   - (f) 持有人停止、未有或未能履行其任內的職務； \n\n   - (g) 持有人的行為表現出該人已不再接納總會目的、使命、方法、童軍誓 詞及規律內的童軍運動基本原則； \n\n   - (h) 持有人被根據規條 1.3.7 暫停會籍後，香港總監確認終止其委任； \n\n   - (i) 根據香港總監的指示而放棄其委任。 \n\n- 規條 **2.5.9** 領袖委任的限制 \n\n   - (a) 任何領袖均不應在同一旅內持有多過一個的委任，除非該位領袖能兼顧 此等委任內的各項相關職務。任何人士如欲持有多於一項委任，必須先 獲得有關總監的批准。 \n\n   - (b) 除獲得香港總監的明確批准外，任何領袖皆不可持有超過三項有委任書 的委任。 \n\n   - (c) 旅長及副旅長不得在其旅內持有任何其他有委任書的委任。 \n\n   - (d) 深資童軍不得持有任何有委任書的委任。 \n\n( 2014 `年` 7 `月` ) \n\n16\n\n<!-- p.22 -->\n### 規條 **2.5.10** 教練員的委任 \n\n旅長可委任教練員。如被委任者為一深資童軍或樂行童軍，則須獲其所屬 團長同意。該委任須由旅長每年作覆核及可獲重新委任。教練員不會獲發 領袖委任書，但會獲發委任證。 \n\n- 規條 **2.5.11** 教練員委任證的撤銷 在下列各情況下，旅長可撤銷教練員的委任： \n\n   - (a) 持有人請辭其委任； \n\n   - (b) 持有人默許被撤銷其委任； \n\n   - (c) 委任的限期屆滿而不再獲續任； \n\n   - (d) 持有人沒有或未能履行其任內的職務； \n\n   - (e) 持有人的行為表現出該人已不再接納總會目的、使命、方法、童軍誓詞 及規律內的童軍運動基本原則； \n\n   - (f)  根據香港總監的指示。 \n\n17\n\n<!-- p.23 -->\n規條 **2.6** 童軍旅內各領袖及教練員的委任資格及職責 規條 **2.6.1** 旅長、副旅長及旅負責領袖 \n\n### 旅 長 \n\n- **(a)** 年齡規限：最低年齡為三十歲，並須於六十五歲生日當日退休。 \n\n- **(b)** 職 責：旅長向區總監負責，其職責如下： \n\n   - (i) 該旅的發展及延續； \n\n   - (ii) 達到該旅各支部的最低應有標準； \n\n   - (iii) 根據總會訂定的訓練與青少年活動計劃，為該旅各支部的青少年 提供有關之活動與訓練； \n\n   - (iv) 與區總監及區職員保持緊密聯繫； \n\n   - (v) 擔任旅領袖會議主席的職位（規條 2.9），並培養旅內各領袖的互 相合作及團隊精神； \n\n   - (vi) 推薦適當人選擔任旅主席（規條 2.7）； \n\n   - (vii) 負責有關旅內各青少年成員的招募事宜； \n\n   - (viii) 與該旅所在的社區建立及保持良好關係。如屬團體旅，則須與主 辦機構及／或其代表保持良好關係；及 \n\n   - (ix) 執行所有在本章內列明與旅長有關的事宜。 \n\n### 副旅長 \n\n   - **(a)** 年齡規限：最低年齡為二十五歲，並須於六十五歲生日當日退休。 **(b)** 職 責－根據規條  2.5.3(a)，可委任一名副旅長以協助旅長執行其職 務。其職責由旅長決定。旅長於訂定其職責時，須以能啟發其領導才為主。 \n\n   - 旅負責領袖 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲（規條 2.5.2(e)），並須於六十五歲生 日當日退休。 \n\n   - **(b)** 職 責－其職責與旅長相同。 \n\n- 規條 **2.6.2** 小童軍團長 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：在旅長督導下及在小童軍副團長及教練員的協助下，小童軍團 長負責小童軍團內的活動事宜。 \n\n- 規條 **2.6.3** 小童軍副團長 \n\n   - **(a)** 年齡規限：最低年齡為十八歲，並須於六十五歲生日當日退休。 **(b)** 職 責－小童軍副團長的職責由小童軍團長決定。小童軍團長於訂定其 職責時，須以能啟發其領導才為主。 \n\n- 規條 **2.6.4** 幼童軍團長 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 **(b)** 職 責：在旅長督導下及在幼童軍副團長及教練員的協助下，幼童軍團 長負責幼童軍團內的青少年活動與訓練事宜。 \n\n18\n\n<!-- p.24 -->\n- 規條 **2.6.5** 幼童軍副團長 \n\n   - **(a)** 年齡規限：最低年齡為十八歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：幼童軍副團長的職責由幼童軍團長決定。幼童軍團長於訂定其 職責時，須以能啟發其領導才為主。 \n\n- 規條 **2.6.6** 童軍團長 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：在旅長督導下及在童軍副團長及教練員的協助下，童軍團長與 小隊長議會各成員合作負責童軍團內的青少年活動與訓練事宜。 \n\n- 規條 **2.6.7** 童軍副團長 \n\n   - **(a)** 年齡規限：最低年齡為十八歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：童軍副團長的職責由童軍團長決定。童軍團長於訂定其職責 時，須以能啟發其領導才為主。 \n\n- 規條 **2.6.8** 深資童軍團長 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職   責：在旅長督導下及在深資童軍副團長及教練員的協助下，深資童 軍團長與團執行委員會合作負責深資童軍團內的青少年活動與訓練事 宜。 \n\n- 規條 **2.6.9** 深資童軍副團長 \n\n   - **(a)** 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：深資童軍副團長的職責由其深資童軍團長決定。深資童軍團長 於訂定其職責時，須以能啟發其領導才為主。 \n\n- 規條 **2.6.10** 樂行童軍團長 \n\n   - **(a)** 年齡規限：最低年齡為二十六歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：在旅長督導下及在樂行童軍副團長及教練員的協助下，樂行童 軍團長與團管理委員會合作負責樂行童軍團內的青少年活動與訓練事 宜。 \n\n- 規條 **2.6.11** 樂行童軍副團長 \n\n   - **(a)** 年齡規限：最低年齡為二十六歲，並須於六十五歲生日當日退休。 \n\n   - **(b)** 職 責：樂行童軍副團長的職責由樂行童軍團長決定。樂行童軍團長於 訂定其職責時，須以能啟發其領導才為主。 \n\n   - **(c)** 樂行童軍副團長不可同時為樂行童軍團員。 \n\n- 規條 **2.6.12** 教練員 \n\n   - **(a)** 年齡規限：最低年齡為十八歲，並須於七十歲生日當日退休。 \n\n   - **(b)** 職 責：委任教練員時須註明他們所負責擔任某方面的訓練或教導某些 \n\n      - 專門性的專章。他們不需要如持有領袖委任書的領袖般參與管理旅團的 職務。 \n\n( 2016 `年` 9 `月` ) \n\n19\n\n<!-- p.25 -->\n## 規條 **2.7** 旅務委員的委任 \n\n規條 **2.7.1** 旅務委員須循以下方式委任﹕ \n\n- **(a)** 旅會長及旅主席 \n\n   - 旅可設有旅會長及旅主席的職位，有關委任須由旅長提名，並由旅務委 員會的週年會議中確認產生。 \n\n- **(b)** 旅祕書及旅司庫 \n\n旅祕書與旅司庫由旅長提名，並在旅務委員會的週年會議中委任。 \n\n- **(c)** 其他旅務委員 \n\n如有需要，經旅長同意後，可由旅務委員會選出其他旅務委員。 \n\n- 規條 **2.7.2** 旅務委員委任的限制 \n\n旅會長、旅主席、旅祕書及旅司庫等職位皆不可合併，亦不可由旅內任何 一名持有委任書的領袖出任。 \n\n- 規條 **2.7.3** 年齡規限 \n\n被委任為旅務委員的最低年齡為十八歲，不設上限。 \n\n- 規條 **2.7.4** 旅務委員的委任紀錄 由委任日期起三十天內，旅長須提交該旅務委員的有關資料給總會。而有 關資料副本亦須送交區總監及地域總監。 \n\n- 規條 **2.7.5** 終止旅務委員的委任 \n\n旅務委員的委任，在以下任何情況下可被終止： \n\n- (a) 該旅務委員請辭其職位； \n\n- (b) 該旅務委員默許旅務委員會終止其委任； \n\n- (c) 委任的期限屆滿； \n\n(d) 該旅務委員被根據規條 1.3.7 暫停會籍後，香港總監確認終止其委任。 \n\n- (e) 根據香港總監的指示。 \n\n( 2025 `年` 11 `月` ) \n\n20\n\n<!-- p.26 -->\n## 規條 **2.8** 旅務委員的職責 \n\n規條 **2.8.1** 旅會長 \n\n旅會長須主持旅的週年會議及鼓勵該旅的發展，並確保該旅財政收支平 衡。旅會長的職位屬榮譽委任，被委任者在旅內並不負有行政管理的責任。 該旅可選擇不委任旅會長一職，旅會長的職務將由旅主席兼任。 \n\n- 規條 **2.8.2** 旅主席 \n\n旅主席須與旅長在旅管理上緊密合作，並須盡量提供所需的最佳訓練及青 少年活動環境及設施。若不設旅會長或在旅會長缺席時，旅主席須擔任旅 務委員會週年會議的主席。 \n\n- 規條 **2.8.3** 旅祕書 \n\n旅祕書的責任是﹕ \n\n- (a) 擔任旅務委員會的祕書； \n\n- (b) 保存由旅長或旅主席指示下的旅務行政及訓練紀錄。 \n\n### 規條 **2.8.4** 旅司庫 \n\n旅司庫的責任是﹕ \n\n- (a) 向旅務委員會提供所有涉及財政事項的意見； \n\n- (b) 經諮詢旅長後，向旅務委員會提交週年財政預算請求通過； \n\n- (c) 在每次旅務委員會會議中，提供一份財務報告，精確列明該旅的財政現 況； \n\n- (d) 向各應繳交成員費的成員收取會員費，並於獲得指示時，將全部款項交 予總會； \n\n- (e) 代表該旅及其支部收集款項，並保存賬目紀錄； \n\n- (f)  支付該旅所批准的開支； \n\n- (g) 以該旅名義開設一個或多個有需要的銀行戶口； \n\n- (h) 確保該旅及其支部的撥款或捐贈正確地被運用； \n\n- (i)  監察該旅各項資產與設備的管理，並確保其存有適當的詳細清冊及保險 安排。 \n\n21\n\n<!-- p.27 -->\n## 規條 **2.9** 旅領袖會議 \n\n規條 **2.9.1** 旅領袖會議由旅長負責主持，可視乎需要而召開，但須至少三個月舉行一 次。其目的為： \n\n- (a) 檢討旅內各支部的青少年活動與訓練，及其他活動的進展及成效； \n\n- (b) 檢討旅內各青少年成員的培養及發展； \n\n- (c) 策劃及協調旅內的青少年活動與訓練，及其他活動； \n\n- (d) 鼓勵及支持旅內各領袖的訓練及發展； \n\n- (e) 策劃、協調及支持童軍區、地域及總會的事務； \n\n- (f)  計劃旅內各項訓練與活動的財政需求。 \n\n- (g) 當該旅未設有旅務委員會時，承擔所有在規條 2.10.5 及 2.10.6 內列明的 責任。 \n\n### 規條 **2.9.2** 旅領袖會議的成員 \n\n所有在該旅持有委任書或暫許委任書的領袖、深資童軍團的團執行委員會 主席及樂行童軍團的團管理委員會主席均為會議的成員。教練員只能以觀 察員身分參加旅領袖會議。 \n\n22\n\n<!-- p.28 -->\n## 規條 **2.10** 旅務委員會 \n\n### 規條 **2.10.1** 旅務委員會 \n\n- (a) 旅應組織旅務委員會。旅務委員會的職能，是支持和促進該旅的童軍事 工。 \n\n- (b) 旅務委員會每年須於六月三十日或之前，舉行由旅會長／旅主席主持的 週年會議，以： \n\n   - (i) 接納 旅的週年報告及經審核的財務報告； \n\n   - (ii) 確認旅會長（如該旅選擇設有旅會長一職）及／或旅主席的委任； \n\n   - (iii) 委任旅祕書及旅司庫； \n\n   - (iv) 根據規條 2.10.4 ，選出旅務委員會成員； \n\n   - (v) 委任一名旅核數人員； \n\n   - (vi) 追認該旅本年度的財政預算； \n\n   - (vii) 審批其他事項。 \n\n### 規條 **2.10.2** 旅務委員會會議 \n\n旅務委員會須至少每六個月舉行一次會議，以協助旅長履行其責任： \n\n- (a) 在旅內提升童軍運動的質素； \n\n- (b) 安排財政支持及籌募經費； \n\n- (c) 管理該旅的財政及資產； \n\n- (d) 與旅長商議旅務委員的提名； \n\n- (e) 審閱及認許該旅的週年報告及經審核的財務報告，以備在該旅的週年會 議中正式提交。 \n\n- (f)  計劃領袖的招募； \n\n- (g) 處理旅的行政事宜。 \n\n### 規條 **2.10.3** 終止成為旅務委員會成員 \n\n旅務委員會的成員身分，可在下列任何情況下被終止： \n\n- (a) 成員請辭其職位； \n\n- (b) 委員會解散； \n\n- (c) 總會根據旅務委員會的建議而終止其成員身分； \n\n- (d) 有關委任期滿。 \n\n( 2025 `年` 11 `月` ) \n\n23\n\n<!-- p.29 -->\n規條 **2.10.4** 旅務委員會的成員 \n\n旅務委員會包括： \n\n   - (a) 旅會長（如有） \n\n   - (b) 旅主席 \n\n   - (c) 旅 長 \n\n   - (d) 副旅長（如有） \n\n   - (e) 支部團長及副團長 \n\n   - (f)  旅祕書 \n\n   - (g) 旅司庫 \n\n   - (h) 主辦機構代表（如有） \n\n   - (i)  區總監或其代表（如有） \n\n   - (j)  旅務委員（包括旅顧問）（如有） \n\n- 規條 **2.10.5** 旅務委員會會議程序 \n\n   - (a) 所有議決採用少數服從多數制，如票數相同，主席並不擁有決定票，而 該動議視作不通過論。 \n\n   - (b) 在旅務委員會會會議中，只有符合規條 2.10.4 的委員纔有投票權。 \n\n   - (c) 旅務委員會須先表決旅務委員會會議之法定人數。 \n\n   - (d) 如有委任旅會長一職，旅會長只須主持旅的週年會議。 \n\n   - (e) 旅祕書須負責準備旅務委員會的會議紀錄。有關會議紀錄亦須由該旅存 案。 \n\n- 規條 **2.10.6** 如一旅未有組織旅務委員會，旅領袖會議須承擔以下的責任： \n\n   - (a) 批准該旅的週年報告，包括經審核的財務報告； \n\n   - (b) 批准該旅來年度的財政預算； \n\n   - (c) 委任一名領袖負責履行旅司庫的職務； \n\n   - (d) 委任一名領袖負責履行旅祕書的職務； \n\n   - (e) 委任一名核數人員； \n\n   - (f)  商討有關財政資源與籌款安排事宜；及 \n\n   - (g) 處理旅的財政及資產事宜。 \n\n( 2012 `年` 5 `月` ) \n\n24\n\n<!-- p.30 -->\n## 規條 **2.11** 童軍旅財務 \n\n- 規條 **2.11.1** (a) 所有旅必須遵照總會發出的指引，保存一份完整的賬冊及財務報告，並 依本「政策、組織及規條」所規定，提交區總監審核。 \n\n   - (b) 賬冊及財務報告須最少保存由最後入賬紀錄日期起計七年的時間。 \n\n### 規條 **2.11.2** 提交經審核的財務報告 \n\n- (a) 總會的財政年度為每年的四月一日至翌年三月三十一日。所有旅必須 於每年的六月三十日前提交一份經審核及在其週年會議中通過的財務 報告（截至三月三十一日止）予區總監。報告內容須包括以下各項資 料： \n\n   - (i) 除區總監另定外，截至三月三十一日止的各項資產詳情，如屬非設 備類別的資產，則須列明受託人的資料； \n\n   - (ii)   永久託管資產，例如旅所受永久託管而不可變賣或轉讓的業權，亦 須分列詳述； \n\n   - (iii)  債務詳情； \n\n   - (iv)  財政年度內的收入項目，須按其性質分類列出。如屬永久託管資 產，亦須另項說明； \n\n   - (v) 財政年度內所支出的項目，須按其性質分類列出。如屬永久託管資 產，亦須另項說明。 \n\n- (b) 旅核數人員是由旅務委員會在週年會議中委任，並須由獨立及能勝任 的人士出任，若具備專業會計資格尤佳。 \n\n- (c) 當某一旅沒有組織旅務委員會，則規條2.11.2 (a)及2.11.2 (b)所述的職 能，須由旅領袖會議執行。 \n\n- (d) 區總監可在任何時間，要求其屬下旅提交經審核之財務報告。 \n\n### 規條 **2.11.3** 童軍旅各支部資金的管理 \n\n- (a) 旅內各支部須各自管理及適當記錄其團員所繳付的團費及其他收費，以 及旅所發給該支部的撥款。 \n\n- (b) 由支部成員繳付的團費及其他收費，須在可行情況下，盡快將收到款項 存入該旅的銀行戶口。旅司庫須將有關收支記錄在適當的賬目紀錄內。 \n\n- (c) 在旅務委員會授權下，每一支部可保存一現金賬戶。如支部設有現金賬 戶，有關支部領袖須負責將連同現金結餘及有關支持單據，在不少於每 三個月一次的定期，或在有關方面要求時，提交該現金收支紀錄予以查 閱。 \n\n- (d) 由支部管理的資金，須在該旅的賬目內列出並包括在該旅之週年財務報 告內。 \n\n( 2025 `年` 11 `月` ) \n\n25\n\n<!-- p.31 -->\n- 規條 **2.11.4** 童軍旅銀行賬戶 \n\n   - (a) 所有旅須以該旅或主辦機構的名義開設銀行戶口。在旅務委員會或旅領 袖會議授權下，該戶口須以不少於兩人聯名簽署去管理。 \n\n   - (b) 以旅或／及旅務委員會名義所收取的所有款項須盡快存入該旅的銀行 戶口。 \n\n   - (c) 任何支部、旅及旅務委員會均不能將任何款項存入任何人士的私人銀行 戶口。 \n\n   - (d) 旅須將所有銀行戶口結算表（截至三月三十一日止或在其他年結日子） 副本，連同週年財務報告呈交予區總監。 \n\n- 規條 **2.11.5** 繳付成員費 \n\n   - (a) 為了配合總會對世界童軍運動的責任，總會可能要求各成員（包括旅的 成員）繳付成員費。 \n\n   - (b) 成員費之數額由總會決定。 \n\n   - (c) 各旅或許需要收取成員費，並根據有關行政指引，將成員費遞交給總會。 \n\n   - (d) 在特殊情況下，旅可經區總監及地域／署總監向香港總監申請豁免部分 或全部成員的會費。香港總監可無條件或附加條件豁免收取部分或全部 會費。 \n\n### 規條 **2.11.6** 童軍旅的籌募活動 \n\n- (a) 所有旅應有足夠資金進行他們自己的訓練及活動項目。如認為有需要， 旅可籌辦籌募活動以作為有關未來開支的準備。 \n\n- (b) 以童軍運動的名義進行籌募活動時，須依據總會發出的財務管理指引進 行。 \n\n- (c) 籌募活動主要是成年人為了支持童軍運動的發展而透過旅務委員會舉 行的大型活動，青少年成員在不影響其活動及訓練下，可參與籌募活動。 \n\n- (d) 籌募活動計劃須在合理時間內事先遞交予區總監。在得到區總監的書面 同意後，纔可舉行籌募活動。有關旅的籌募活動必須遵守下列規定進行： (i) 籌募活動的方法是要令活動能脗合總會的目的、使命及總會的良 好聲譽與紀錄去舉行； \n\n   - (ii)   有關活動不應與總會其他籌募活動時間衝突； \n\n   - (iii)  所籌得的款項是完全用於支持該旅的童軍工作。如已獲批准與其 他慈善團體聯合舉辦，則分配給該旅的款項應全部運用於該旅的 工作上。 \n\n   - (iv)  在與其他慈善團體聯合舉辦籌募時，如對其籌募活動的性質或目 的有任何懷疑時，須諮詢總會。 \n\n   - (v) 籌募活動的總開支不應超出籌募所得總收入的適當比例；及 \n\n   - (vi)  須適當考慮政府當局所發出有關非牟利團體舉辦 籌募活動的指 引。 \n\n- (e) 在舉辦籌募活動後的三十天內，須向區總監提交一份有關活動的收支賬 目報告。 \n\n- (f)  如欲以旅名義申請外間資助，須先取得有關負責總監的推薦，並須由總 會代為遞交申請。 \n\n26\n\n<!-- p.32 -->\n### 規條 **2.11.7** 資產、設備及資金 \n\n- (a) 旅須有適當的地點及設備去進行他們的訓練活動。 \n\n- (b) 旅長及旅祕書除須確定有關旅所擁有的資產及設備（包括房產、車輛、 船隻及其他有關資產及設施）之業權及租約皆遵照法例要求外，亦須確 保有關資產與設備的情況、測試及其他各方面的要求及手續皆已履行並 採取應有的行動。 \n\n- (c) 所有資產及設備皆須以旅或代表人的名義註冊。如採用代表人名義註 冊，則須以合法的文件註明該人是該旅的代表，有關資產及設備乃屬該 旅所擁有，而不屬於私人擁有。 \n\n- (d) 旅長及旅司庫須正確存錄旅所擁有或租用的資產及設備之詳細紀錄。 \n\n- (e) 所有旅的資金只能用於拓展童軍運動及改善該旅全體成員的利益上。在 嚴格遵守香港法律第 29 章信託人條例規定範圍下，旅亦可依據總會有 關的財務指引運用資金仿似信託基金般作投資。 \n\n- (f)  如屬團體旅，則須於總會與主辦機構訂立的協議書，分出那些資產及設 備屬於主辦機構、那些資產及設備屬於總會。在協議書內所列為屬於該 旅所擁有的資產及設備須依本規條管理。 \n\n### 規條 **2.11.8** 資產的處理 \n\n- (a) 旅合併下的資產處理： \n\n   - 如兩個或以上的旅合併，各行將退位的旅長、旅祕書及旅司庫須確保： \n\n   - (i) 預備一份以合併當日為準及合乎規條 2.11.2 的財務報告，連同該旅 所有資產、所有賬冊及單據移交予旅合併後產生的新旅長或新旅司 庫。如有需要，合併的新旅司庫可要求區總監委任一核數人員審核 有關賬項； \n\n   - (ii)   簽署所有需要的契約，將所有業權轉交該新旅。 \n\n- **(b)** 旅結束時的資產處理： \n\n   - 在撤銷旅註冊時， \n\n   - (i) 旅長及旅司庫須預備一份以結束當日為準及合乎規條 2.11.2  的財 務報告，連同該旅所有資產、賬冊及單據，在旅結束後盡快移交給 區總監； \n\n   - (ii)   當區總監滿意該份財務報告上所列明該旅在結束當日的財政狀況 時，他須把財務報告的副本遞送給地域總監； \n\n   - (iii)  由香港總監指示如何處理該旅的資產； \n\n   - (iv)  在收到上述指示前，有關區執行委員會須採取所有必須的措施，以 確保該旅的全部資產及契約得以保存。 \n\n### 規條 **2.11.9** 文件的保存 \n\n旅長須確保所有有關業權及設備的文件及其他法律上及官式的文件有安全 的保管及讓區總監可隨時查閱。旅祕書須將該等文件存案及清楚它們的擺 放位置。 \n\n27\n\n<!-- p.33 -->\n規條 **2.12** 意外及保險 \n\n規條 **2.12.1** 意 外 \n\n- (a) 任何人士，無論是否屬於總會成員，因進行童軍活動，或與任何童軍產 業有關而引至個人受傷（因而需要接受醫生、牙醫或留院）或死亡，或 在童軍運動的意外中而引致第三者有財物損失時，均須立刻通知區總監 及地域總監。 \n\n- (b) 地域總監接到消息後，須立刻知會總會。區總監在諮詢地域總監後，應 發出有關指令及填寫表格以處理有可能之保險索償。 \n\n- (c) 不能對任何傷亡或引致第三者有財物損毀的事情作出任何承諾，須先向 總會尋求指示。 \n\n- (d) 上述的規定須連同總會有關保險範圍的指引及指令（可在總會獲取）一 併閱讀。 \n\n### 規條 **2.12.2** 保險範圍 \n\n- (a) 總會有週年保險政策，包括以下及其他保險項目： \n\n   - (i) 產業全保； \n\n   - (ii)   公眾責任保險； \n\n   - (iii)  團體個人意外保險；及 \n\n   - (iv)  董事及重要職員責任保險。 個別旅須考慮總會的保險範圍是否足 夠，如有需要可自行額外增購加 保。 \n\n- (b) 各旅均須遵守總會發出有關活動之安全守則、指引及指令，以確保有效 地包括在總會所提供的保險內。 \n\n- (c) 各旅皆須繼續維持總會有效的會籍註冊，以確保其成員包括在總會所提 供的保險內。 \n\n28\n\n<!-- p.34 -->\n規條 **2.13** 童軍旅內部的糾紛 \n\n規條 **2.13.1** 以下程序須在非正式的解決方法失敗後運用： \n\n- (a) 有關旅領袖之間的糾紛須交由區總監處理。區總監應在諮詢該旅旅長及 該旅主辦機構或其代表（如適用）的意見後，居間調停。 \n\n- (b) 任何旅的領袖與主辦機構或與旅務委員會的糾紛須由區總監及區執行 委員會處理。 \n\n- (c) 如區總監及／或區執行委員會未能解決有關糾紛，須交由地域總監處 理。 \n\n- (d) 糾紛中所有有關人士均須有合理機會表達意見及獲得聆聽。 \n\n29\n\n<!-- p.35 -->\n```\n第三章 童軍區會\n```\n\n規條 **3.1** 童軍區 \n\n童軍區（亦指區）是總會在香港特別行政區某指定的區域內設立之前線組 織，目的是領導、監督、指引及支持區內童軍旅。 \n\n30\n\n<!-- p.36 -->\n## 規條 **3.2** 童軍區的設立 \n\n- 規條 **3.2.1** (a) 區的設立乃經地域總監推薦，並由香港總監批准。當香港總監批准後， 總會將透過地域總監發出一張「成立證書」給候任區總監。 \n\n   - (b) 任何有關變更，包括區的合併及區分界的改變，皆屬於總會的事務範圍。 \n\n- 規條 **3.2.2** 暫停童軍區運作 \n\n   - (a) 在考慮撤銷一個區的期間，經香港總監的批准後，地域總監可暫停該區 之運作。 \n\n   - (b) 當一個區被暫停運作時，區內的旅將不受影響，但區總部所有活動將會 暫停；除非香港總監另有指示外，在該區的所有總監、區幹部及區務委 員的委任，亦均會自動暫停。 \n\n   - (c) 在區被暫停的期間，地域總監須接管該區的管理權責。 \n\n- 規條 **3.2.3** 撤銷童軍區 \n\n   - (a) 香港總監可撤銷任何已設立的區，並建議總領袖撤去該區內所有總監的 委任。香港總監亦會同時撤銷該區內所有區幹部及區務委員的委任。 \n\n   - (b) 當某一個區被撤銷後，此區不再存在，地域總監須依據香港總監的指示， 採取適當行動，處理該區終止時的財政及其他資產。地域總監亦須為該 區各旅提供行政管理的支援。 \n\n31\n\n<!-- p.37 -->\n規條 **3.3** 童軍區的架構及組織 規條 **3.3.1** 區是由區總監在以下人士的支持下領導︰ (a) 區幹部； (b) 區務委員會；及 \n\n   - (c) 區執行委員會。 \n\n- 規條 **3.3.2** 區幹部 區幹部應視乎工作量及真正的需要按以下的編制 組成︰ \n\n   - (a) 不可多於兩名副區總監。如有兩名副區總監，其中一名須負責領袖訓練 的職務； \n\n   - (b) 如該區只得一名副區總監，則可有一名助理區總監（領袖訓練）； \n\n   - (c) 除規條 3.3.3 另有規定外，各支部可有一名助理區總監； \n\n   - (d) 該區的所有旅長（或旅負責領袖）； \n\n   - (e) 各支部區長； \n\n   - (f)  區物資管理員； \n\n   - (g) 區專章祕書； \n\n   - (h) 區領袖； \n\n   - (i)  助理區領袖。 \n\n規條 **3.3.3** 如該區內少於五個旅有某一支部，則該支部不應設立助理區總監。 \n\n32\n\n<!-- p.38 -->\n## 規條 **3.4** 童軍區內總監及領袖的委任 \n\n規條 **3.4.1** 委任書及暫許委任書 \n\n   - (a)  委任書只發給已完成香港總監規定的某階段木章訓練課程之領袖或總 監。委任書的有效期乃由簽發年份起計至最多不超過四年。 \n\n   - (b)  未完成該階段木章訓練課程之領袖，可獲簽發暫許委任書。暫許委任 書的有效期，則由簽發年份起計至最多不超過兩年。暫許委任書的持 有人須在其暫許委任期屆滿前完成該階段木章訓練課程，纔可獲頒發 領袖委任書。 \n\n- 規條 **3.4.2** 區總監的委任 \n\n   - (a) 區總監（總監職級五級）須由地域總監提名委任。 \n\n   - (b) 被提名委任為區總監的候任人必須填寫及簽署有關提名錶格。 \n\n   - (c) 地域總監須簽署有關提名錶格並送交負責的副香港總監認可。 \n\n   - (d) 如有關提名獲得負責的副香港總監之認可，他將會把提名錶格送交香港 總監。倘若香港總監認為適合，他將會推薦予總領袖以簽發委任書給被 提名的候任人。委任書將送交地域總監頒發。區總監在接受委任書時， 須作宣誓或覆誓。 \n\n   - (e) 當區總監委任書有效期滿，可由地域總監推薦續發。 \n\n   - (f)  地域總監或香港總監可於任何認為適當的時間，對區總監委任書作覆 核。 \n\n   - (g) 在下列任何一種情況，根據地域總監或香港總監的建議，可暫停或撤銷 區總監的委任書︰ \n\n      - (i) 持有人請辭其職位； \n\n      - (ii) 持有人默許有關撤銷其委任之決定； \n\n      - (iii) 持有人不符合其職位的年齡及資格規定； \n\n      - (iv) 在欠缺充分的理由下，持有人未能完成其領袖必修訓練課程； \n\n      - (v) 根據規條 3.4.2(e)至規條 3.4.2(f)，經有關人士覆核後，不再獲續發 委任書； \n\n      - (vi) 持有人停止、未有或未能履行其任內的職務； \n\n      - (vii) 持有人的行為表現出該人已不再接納總會目的、使命、方法、童 軍誓詞及規律內的童軍運動基本原則； \n\n      - (viii) 持有人被根據規條 1.3.7 暫停會籍後，香港總監確認終止其委任； \n\n      - (ix) 根據香港總監的指示而放棄其委任。 \n\n   - (h) 根據本「政策、組織及規條」的規定，如區總監的委任被終止時，他須 交還其經撤銷的委任書予總會。 \n\n   - (i)  當區總監的職位懸空時，地域總監可委任一名副區總監或助理區總監， 或任何其他總監代理其職務。 \n\n( 2014 `年` 7 `月` ) \n\n33\n\n<!-- p.39 -->\n規條 **3.4.3** 副區總監的委任 \n\n   - (a) 區總監負責提名委任其副區總監（總監職級六級）。 \n\n   - (b) 一個區可委任兩名副區總監。區總監在地域總監的認許下，要清楚界 定每一副區總監的職責（規條 3.5.2(d)）。 \n\n   - (c) 規條 3.4.2  亦適用於副區總監的委任。區總監在地域總監的認許下，負 責提名委任及覆核委任其副區總監。 \n\n- 規條 **3.4.4** 助理區總監的委任 \n\n   - (a) 區總監負責提名委任其助理區總監（總監職級七級）。 \n\n   - (b) 規條 3.4.2  亦適用於助理區總監的委任。區總監在地域總監的認許下， 負責提名委任及覆核委任其助理區總監。 \n\n- 規條 **3.4.5** 區長、區物資管理員、區專章祕書、區領袖及助理區領袖的委任 (a) 區總監負責提名委任其區長、區物資管理員、區專章祕書、區領袖及助 理區領袖。 \n\n   - (b) 規條 3.4.2  亦適用於區長、區物資管理員、區專章祕書、區領袖及助理 區領袖的委任。區總監在地域總監的認許下，負責提名委任及覆核委任 其區長、區物資管理員、區專章祕書、區領袖及助理區領袖。 \n\n規條 **3.4.6** 區幹部委任的限制 \n\n- (a) 任何區幹部均不應在同一區內持有多過一個的委任（旅內的委任除外）， 除非該名區幹部能兼顧此等委任內的各項相關職務。任何人士如欲持有 多於一項委任，必須先獲得有關總監的批准方可進行辦理。 \n\n- (b) 除獲得香港總監的明確批准外，任何區幹部皆不可持有超過三項有委任 書的委任。 \n\n34\n\n<!-- p.40 -->\n## 規條 **3.5** 童軍區內總監及領袖的委任資格和職責 \n\n規條 **3.5.1** 區總監 \n\n   - (a) 年齡規限：最低年齡為三十歲，並須於六十五歲生日當日退休。 \n\n   - (b) 資 歷：區總監須為「木章」持有人，具有童軍旅經驗及總會規定的其 他相關資歷，如：童軍經驗、教育程度、工作經驗等。 \n\n   - (c) 職 責：區總監向地域總監負責，並在區幹部的協助下，於其區內： (i) 推廣總會的抱負、使命、價值觀及目的； \n\n      - (ii) 根據總會的目的、使命及童軍方法，為青少年成員及領袖提供適 當的活動與訓練，並鼓勵他們積極參與； \n\n      - (iii) 維護及執行總會的政策、規則及規條； \n\n      - (iv) 有關各總監、領袖和區務委員的招募、發展及工作表現之評核； \n\n      - (v) 籌設區務委員會及區執行委員會，並致力令其有效地發揮功能； \n\n      - (vi) 確保區幹部定期探訪各旅，以維持及改進其童軍質素； \n\n      - (vii) 確保各成員的和諧合作和調解他們之間的糾紛； \n\n      - (viii) 確保所有童軍活動的安全，並嚴格遵守所有有關進行童軍活動時 需要遵守的安全措施和規定； \n\n      - (ix) 與各旅的主辦機構維持良好之合作關係及確保總會的利益； \n\n      - (x) 與區內跟童軍運動有關的團體，保持良好關係； \n\n      - (xi) 根據規條 3.6.1(a)，提名區會長及區主席； \n\n      - (xii) 代表該區出席地域會務委員會； \n\n      - (xiii) 以當然委員的身分出席區內所有委員會及小組委員會的會議； \n\n      - (xiv)   評估有關新旅的註冊申請，並作適當之推薦； \n\n      - (xv) 尋求足夠的資金及其他資源以支持區內童軍運動的發展； \n\n      - (xvi)   填報「週年人數統計表」，及在有需要時繳交該區的成員費予總 會； \n\n      - (xvii)  適當推薦區內的成員接受獎勵；及 \n\n      - (xviii) 執行地域總監委派的一般任務及／或特定任務。 \n\n- 規條 **3.5.2** 副區總監 \n\n   - (a) 年齡規限：最低年齡為二十五歲，並須於六十五歲生日當日退休。 \n\n   - (b) 資 歷：副區總監須為「木章」持有人，具有童軍旅經驗及總會規定的 其他相關資歷，如：童軍經驗、教育程度、工作經驗等。 \n\n   - (c) 職 責：副區總監直接向區總監負責，以協助區總監履行其職責和任 務，包括而並不限於以下的任務︰ \n\n      - (i)   主持新或現任領袖和區務委員之訓練； \n\n      - (ii)  開辦新旅和保留現有成員； \n\n      - (iii) 確保所有支部的優質水準； \n\n      - (iv) 協調各支部的青少年成員之活動與訓練，及其他活動； \n\n      - (v)  執行其他行政任務，包括呈交「財務報告」及「週年人數統計表」 等。 \n\n   - (d) 當一個區有兩名副區總監時，其中一名須負責青少年成員的活動及訓練 事務；而另外一名則負責其他的職責。 \n\n35\n\n<!-- p.41 -->\n規條 **3.5.3** 助理區總監 \n\n(a) 年齡規限： \n\n助理區總監（樂行童軍）的年齡規限︰ 最低年齡為二十六歲，並須於六十五歲生日當日退休。 助理區總監（領袖訓練）、助理區總監（小童軍）、助理區總監（幼童 軍）、助理區總監（童軍）與助理區總監（深資童軍）的年齡規限︰ 最低年齡為二十五歲，並須於六十五歲生日當日退休。 \n\n- (b) 資 歷： 助理區總監須為「木章」持有人，具有童軍旅經驗及總會規定的其他相 關資歷，如：童軍經驗、教育程度、工作經驗等。 \n\n- (c) 職 責： 助理區總監協助區總監處理支部青少年成員活動及領袖訓 練事務。 \n\n- (d) 如區內只得一名副區總監，則可委任一名助理區總監（領袖訓練），負 責主持新或現任領袖和區務委員之訓練； \n\n- (e) 每個支部可委任一名助理區總監（如區內最少有五個旅有該支部）。若 有關助理區總監持有該支部的木章則更為理想。他們直接或透過相關 的副區總監向區總監負責下列職責︰ \n\n   - (i) 協助區總監監察區內該支部的運作，包括對領袖的個人支持和鼓 勵； \n\n   - (ii)   協助開設新支部及招募、保留現有成員； \n\n(iii) 探訪旅的支部和向他們提供在運作上及標準上的意見； \n\n- (iv)  安排組織區支部活動； \n\n- (v)   確保召開區支部領袖會議； \n\n- (vi)  執行區總監所委派的其他任務。 \n\n規條 **3.5.4** 區 長 \n\n- **(a)** 年齡規限： \n\n樂行童軍區長的年齡規限︰ \n\n最低年齡為二十六歲，並須於六十五歲生日當日退休。 小童軍區長、幼童軍區長、童軍區長和深資童軍區長的年齡規限︰ 最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n**(b)** 職 責：區長協助有關助理區總監處理該支部上的事務。 \n\n- 規條 **3.5.5** 區領袖、助理區領袖、區物資管理員及區專章祕書 (a) 年齡規限： \n\n區領袖的年齡規限︰ \n\n最低年齡為二十一歲，並須於六十五歲生日當日退休。 助理區領袖、區物資管理員、區專章祕書的年齡規限︰ 最低年齡為十八歲，並須於六十五歲生日當日退休。 \n\n(b) 職 責：區領袖、助理區領袖、區物資管理員及區專章祕書負責某特定 或一般性的職務；他們的職責是由區總監在地域總監認許下所訂定。 \n\n( 2021 年10月) \n\n36\n\n<!-- p.42 -->\n規條 **3.6** 區務委員的委任 \n\n規條 **3.6.1** 區務委員須循以下方式委任： \n\n- (a) 區會長及區主席 \n\n區會長及區主席是區總監提名，地域總監認許，並由區務委員會在週年 會議上確認其委任。 \n\n- (b) 區名譽會長 \n\n區名譽會長乃名譽上的委任，是經區總監與區會長商議後提名，並由區 務委員會在週年會議上確認其委任。 \n\n- (c) 區副會長 \n\n區副會長是經區總監與區會長商議後提名，由區務委員會在週年會議上 選出以協助區會長，並於需要時暫代區會長。 \n\n- (d) 區副主席 \n\n區副主席是經區總監與區主席商議後提名，由區務委員會在週年會議 上選出以協助區主席。每區不可有多過五名區副主席。 \n\n- (e) 區祕書及區司庫 \n\n區祕書及區司庫是經區總監提名，由區務委員會在週年會議上選出。 其他區務委員 其他區務委員是由區務委員會於週年會議上選出，而聘任委員是由區 執行委員會邀請，並經週年會議確認。 \n\n   - (f)  其他區務委員 \n\n- 規條 **3.6.2** 區務委員委任的限制 \n\n區會長、區副會長、區主席、區副主席、區祕書及區司庫等職位皆不可彼 此合併，亦不可由區內任何一名持有委任書的領袖出任。 \n\n規條 **3.6.3** 年齡規限 \n\n被委任為區務委員的最低年齡為十八歲，不設上限。 \n\n規條 **3.6.4** 區務委員的委任紀錄 由委任日期起三十天內，區總監須提交該區務委員的有關資料給總會。 規條 **3.6.5** 終止區務委員的委任 \n\n區務委員的委任，在以下任何情況下可被終止︰ \n\n- (a) 該區務委員請辭其職位； \n\n- (b) 該區務委員默許區執行委員會終止其委任； \n\n- (c) 委任的期限屆滿； \n\n- (d) 由於該區被撤銷，區務委員會或區執行委員會隨而解散； \n\n- (e) 該區務委員被根據規條 1.3.7 暫停會籍後，香港總監確認終止其委任； \n\n- (f)  根據香港總監的指示。 \n\n37\n\n<!-- p.43 -->\n## 規條 **3.7** 區務委員之職責 \n\n- 規條 **3.7.1** 區會長、區名譽會長及區副會長 \n\n   - (a) 區會長負責鼓勵該區的發展，並確保該區財政收支平衡。區會長的職位 屬榮譽委任，在區內並不負有行政管理的責任。 \n\n   - (b) 區名譽會長及區副會長應協助區會長履行其責任。 \n\n   - (c) 在區會長缺席時，可由區副會長代表履行其職責。 \n\n- 規條 **3.7.2** 區主席及區副主席 \n\n   - (a) 區主席的職責是： \n\n      - (i) 擔任區執行委員會的主席； \n\n      - (ii) 擔任地域會務委員會的當然委員； \n\n      - (iii)  與區總監緊密合作，鼓勵區內童軍運動的良好發展； \n\n      - (iv) 與區各旅務委員會主席及主辦機構代表保持聯絡；及 \n\n      - (v) 以當然委員的身分出席區內所有小組委員會及臨時小組之會議。 \n\n   - (b) 在區會長及區副會長缺席時，區主席可擔任區務委員會的主席。 \n\n   - (c) 區副主席協助區主席履行其責任。 \n\n- 規條 **3.7.3** 區祕書 \n\n區祕書的職責是﹕ \n\n   - (a) 擔任區務委員會及區執行委員會的祕書； \n\n   - (b) 協調區會屬下各小組委員會及臨時小組的工作； \n\n   - (c) 發放總會、地域及區內的有關資料及指示到各旅及有關人士。 \n\n- 規條 **3.7.4** 區司庫 \n\n   - 區司庫的職責是﹕ \n\n   - (a) 向區務委員會及區執行委員會提供所有涉及財政事項的意見； \n\n   - (b) 經諮詢區總監後，制定週年財政預算在週年會議請求通過； \n\n   - (c) 在每次區執行委員會會議及區務委員會週年會議中，提供一份財務報 告，精確列明該區的財政現況； \n\n   - (d) 代表該區收集款項，並保存賬目紀錄； \n\n   - (e) 支付該區所批准的開支； \n\n   - (f)  以該區名義開設一個或多個有需要的銀行戶口； \n\n   - (g) 確保該區的撥款或捐贈能正確地運用； \n\n   - (h) 在所有籌募事項中，與地域、區及區內旅保持緊密合作； \n\n   - (i)  監察該區各項資產與設備的管理，並確保其存有適當的詳細清冊及保險 安排。 \n\n38\n\n<!-- p.44 -->\n規條 **3.8** 區幹部會議 \n\n區幹部會議由區總監負責主持，可視乎需要而召開，但須至少每四個月舉 行一次。其目的為： \n\n- (a)  檢討區內訓練及青少年活動的標準和成效； \n\n- (b)  安排定期探訪各旅，以評估其是否達到所需標準並給予領袖協助和鼓 勵； \n\n- (c)  策劃及協調區內的青少年活動； \n\n- (d)  為區內各領袖提供或安排訓練和發展的機會； \n\n- (e)  策劃及協調該區的其他事務； \n\n- (f) 協調及支持總會、地域及其他區所籌辦的活動； \n\n- (g)  計劃及監管區內各項訓練與活動的財政需求及開支。 \n\n39\n\n<!-- p.45 -->\n規條 **3.9** 區務委員會及區執行委員會 \n\n規條 **3.9.1** 區務委員會 \n\n- (a) 區務委員會的職能，是在該區內支援和促進童軍運動的發展。 \n\n- (b) 區務委員會每年須於六月三十日或之前，舉行由區會長主持的週年會 議，以： \n\n   - (i) 接納區執行委員會的週年報告及經審核的財務報告，並將報告的一份 副本，送交 地域總監； \n\n   - (ii) 確認區總監對區會長、區名譽會長及區主席的提名； \n\n   - (iii) 選出區副會長、區副主席、區祕書及區司庫； \n\n   - (iv) 根據規條 3.9.4 ，委任區執行委員會委員； \n\n   - (v) 委任一名區核數人員； \n\n   - (vi) 追認由區執行委員會批准的本年度區財政預算； \n\n(vii) 考慮和審批與該區有關的其他事項。 \n\n- 規條 **3.9.2** 區務委員會的成員 區務委員會包括： \n\n   - (a) 區會長； \n\n   - (b) 區總監； \n\n   - (c)   區名譽會長及區副會長； \n\n   - (d) 區主席及區副主席； \n\n   - (e) 各副區總監； \n\n   - (f) 各助理區總監； \n\n   - (g)   區祕書及區司庫； \n\n   - (h) 各區領袖； \n\n   - (i) 其他區務委員（包括區顧問）； \n\n   - (j)   區及其旅領袖、教練員及旅務委員； \n\n   - (k)   深資童軍團執行委員會主席；及 \n\n   - (l)  樂行童軍團管理委員會主席。 \n\n規條 **3.9.3** 區執行委員會 \n\n區執行委員會是為支持區總監履行其職責和為區內各旅提供支援而設。區 執行委員會須最少每四個月召開一次會議，以： \n\n- (a) 在區內推動童軍運動的發展； \n\n- (b) 取得其他團體及社區的合作和支持； \n\n- (c) 為該區取得財政支持及籌募經費； \n\n- (d) 管理該區的財政及資產； \n\n- (e) 與區總監商議小組委員會和臨時小組的委員； \n\n- (f)   審閱及認許該區的週年報告與及經審核的財務報告，以備區務委員會 在週年會議中批覈； \n\n- (g) 批覈該區的週年財政預算； \n\n- (h) 計劃領袖的招募；及 \n\n- (i)   處理區內的其他行政事宜。 \n\n( 2025 `年` 11 `月` ) \n\n40\n\n<!-- p.46 -->\n規條 **3.9.4** 區執行委員會的成員 \n\n區執行委員會由以下人士組成： \n\n- (a)  當然委員 \n\n   - (i) 地域總監 \n\n   - (ii)   負責區事務的副地域總監 \n\n   - (iii)  區總監 \n\n   - (iv)  區主席 \n\n   - (v) 區副主席 \n\n   - (vi)  副區總監 \n\n   - (vii) 助理區總監 \n\n   - (viii)區祕書 \n\n   - (ix)  區司庫 \n\n- (b)  選任委員 \n\n區務委員會可在週年會議中選出不超過十二名選任委員，但確實的數 目要視乎區務委員會的議決及地域總監的批准。其中半數須由區總監 提名。 \n\n(c)  聘任委員 區務委員會可在區執行委員會內加入聘任委員，其中可包括地區團體 及該區內機構的代表。聘任委員不可超過選任委員的數目。 \n\n- 規條 **3.9.5** 小組委員會及臨時小組的成員 \n\n小組委員會和臨時小組是因特定目的由區執行委員會成立，成員由區執行 委員會委派。區總監和區主席是所有小組委員會及臨時小組的當然委員。 \n\n- 規條 **3.9.6** 童軍區會議的程序 \n\n   - (a)  在區務委員會的會議上，只有在規條 3.9.2 上所列明的成員纔有投票權。 \n\n   - (b)  在區執行委員會的會議上，只有在規條 3.9.4(a)及規條 3.9.4(b)上所列明 的成員纔有投票權。 \n\n(c)  適用於旅會議的規條 2.10.5 的規定，亦同時適用於區。 \n\n41\n\n<!-- p.47 -->\n## 規條 **3.10** \n\n## 童軍區財務 \n\n- 規條 **3.10.1** (a)  所有區必須保存完整的賬冊及財務報告，在地域總監要求時，須提交 有關資料以供審核。 \n\n   - (b)  賬冊及及財務報告應最少保存由最後入賬紀錄日期起計七年的時間。 \n\n   - (c)  當向第三者作出任何財務上的承擔或協議時，簽約者須明確地向對方 表明其並非以個人身分，而是代表該區。 \n\n- 規條 **3.10.2** 提交經審核的財務報告 \n\n   - (a)   總會的財政年度為每年的四月一日至翌年三月三十一日。所有區必須 於每年的六月三十日前提交一份經審核及在其週年會議中通過的財務 報告（截至三月三十一日止）予地域總監。報告內容須包括以下各項 資料： \n\n      - (i) 各項資產詳情，如屬於非設備類別的資產，則須列明受託人的資 料； \n\n      - (ii)  永久託管資產，例如區所受永久託管而不可變賣或轉讓的業權， 亦須分列詳述； \n\n      - (iii) 債務詳情； \n\n      - (iv) 財政年度內的收入報表，須按其性質分類列出。如屬永久託管資 產，亦須另項說明； \n\n      - (v)  財政年度內所支出的項目，須按其性質分類列出。如屬永久託管 資產，亦須另項說明。 \n\n   - (b) 區核數人員是由區務委員會在週年會議中委任，並須是獨立，且具備 專業資格的會計師。 \n\n   - (c) 地域總監可在任何時間，要求其屬下區提交經審核之財務報告。 \n\n- 規條 **3.10.3** 童軍區銀行賬戶 \n\n   - (a)  所有區須以區的名義，用以下格式：「香港童軍總會－XXX 區 」，開 設銀行戶口。該戶口須以不少於兩名經區執行委員會授權的人士聯名 簽署去管理。其中一名簽署人應為區司庫。 \n\n   - (b)  以區、區務委員會或區執行委員會名義所收取的所有款項須盡快存入 該區的銀行戶口。 \n\n   - (c)  任何區、區務委員會或區執行委員會均不能將任何款項存入任何人士 的私人銀行戶口。 \n\n   - (d)  區須將銀行戶口結算表（截至三月三十一日止或在其他年結日子）副 本，呈交予地域總監。如該區擁有一個以上的銀行戶口，則所有銀行 戶口結算表（截至三月三十一日止或在其他年結日子）副本均須同時 提交。 \n\n- 規條 **3.10.4** 繳付成員費 \n\n   - (a) 為了配合總會對世界童軍運動的責任，總會可能要求各成員（包括旅的 成員）繳付成員費。 \n\n   - (b) 成員費之數額由總會決定。 \n\n   - (c) 如有需要，所有該區的總監、區領袖、教練員及區務委員均須依照總會 有關行政指引繳付成員費予總會。 \n\n( 2025 `年` 11 `月` ) 42\n\n<!-- p.48 -->\n- 規條 **3.10.5** 童軍區的籌募活動 所有區的籌募活動須依照總會發出的財務管理指引及規 條 2.11.6（此規條適 用於旅亦同時適用於區）所訂定的原則進行，及須取得地域總監的預先批准。 \n\n- 規條 **3.10.6** 資產、設備及資金 \n\n適用於旅的規條 2.11.7 的規定，亦同時適用於區；有關負責人則為區總監、 區祕書及區司庫。 \n\n- 規條 **3.10.7** 資產的處理 \n\n   - (a) 童軍區合併及結束時的資產處理： \n\n      - 適用於旅的規條 2.11.8(a)  及 2.11.8(b) 的規定，亦同時適用於區；有關 負責人則為區總監、區祕書及區司庫。 \n\n   - (b) 除合併或結束外終止童軍區的資產處理： 如一個區被分拆為兩個或以上的區，又或被分為數部份分別合併入其 他區時： \n\n      - (i) 該區的資產將會按分拆後各部份的童軍人數的比例來分配； \n\n      - (ii)   已分配的資產須再轉入將來接管該舊區部份的區； \n\n      - (iii)  這過程須在該區所隸屬的地域總監監察下進行，但如情況太複雜或 牽涉到一個以上的地域時，須尋求香港總監的指示； \n\n      - (iv)  直至區的資產處理完成之前，地域總監須採取所有必須的步驟以保 存該區的資產及有關該區權益的文件。 \n\n### 規條 **3.10.8** 文件的保存 \n\n適用於旅的規條 2.11.9 的規定，亦同時適用於區；有關負責人則為區總監、 區祕書。 \n\n43\n\n<!-- p.49 -->\n- 規條 **3.11** 意外及保險 \n\n- 規條 **3.11.1** 適用於旅的規條 2.12 之規定，亦同時適用於區；區總監須就未包括在總會 所購買的保險範圍內之風險負責購買足夠的保險。 \n\n- 規條 **3.11.2** 如需處理涉及投保、申報傷亡或索償的事項時，須由負責該節目或活動的 總監或領袖，或其他成年人在區總監之監察下處理。區總監須諮詢地域總 監或總會尋求指示。 \n\n44\n\n<!-- p.50 -->\n規條 **3.12** 區內部糾紛 規條 **3.12.1** 以下程序須在非正式的解決方法失敗後運用： \n\n- (a) 有關區內的總監與總監之間或牽涉到區內任何總監的糾紛須交由地域 總監處理。 \n\n- (b) 其他成年成員之間的糾紛須由區總監處理。 \n\n- (c) 如區總監未能解決糾紛，或其本人牽涉入糾紛之中，區總監須把事件交 由地域總監處理。 \n\n- (d) 如地域總監未能解決有關糾紛，須交由香港總監處理。香港總監的決定 將為最終的定案。 \n\n- (e) 糾紛中所有有關人士均須有合理機會表達意見及獲得聆聽。 \n\n45\n\n<!-- p.51 -->\n## `第四章 童軍地域` \n\n## `規條` **4.1** `童軍地域` \n\n```\n童軍地域（亦指地域）是總會在香港特別行政區某指定的區域內，根據地\n理位置而劃分設立的架構組織，目的是領導、監督、指引及支持地域內童\n軍旅。\n```\n\n46\n\n<!-- p.52 -->\n`規條` **4.2** `童軍地域的設立` \n\n- (a) `地域的設立乃經負責的副香港總監推薦，並由香港總監批准。當香港總 監批准後，總會將發出一張「成立證書」給候任地域總監。` \n\n- (b) `任何有關變更，包括地域的合併及地域分界的改變，皆屬於總會的事務` \n\n   - `範圍。` \n\n47\n\n<!-- p.53 -->\n- `規條` **4.3** `童軍地域的架構及組織 規條` **4.3.1** `地域是由地域總監在以下人士的支持下領導︰` (a) `地域幹部；` (b) `地域會務委員會；及` \n\n   - (c) `地域執行委員會。` \n\n- `規條` **4.3.2** `地域幹部 地域幹部應視乎工作量及真正的需要按以下編制組成：` (a) `副地域總監（不可多於三名）；` \n\n   - (b) `助理地域總監（一名或多名）；` \n\n   - (c) `地域內各區總監；` \n\n   - (d) `地域總部總監（一名或多名）；` \n\n   - (e) `助理地域總部總監（一名或多名）；` \n\n   - (f) `地域領袖；及` \n\n   - (g) `助理地域領袖。` \n\n48\n\n<!-- p.54 -->\n- `規條` **4.4** `童軍地域內總監及領袖的委任` \n\n- `規條` **4.4.1** `委任書及暫許委任書` \n\n   - (a) `委任書只發給已完成香港總監規定的某階段木章訓練課程之領袖或總 監。` \n\n   - (b) `儘管有規條` 4.5.2(b) `及規條` 4.5.3(b) `規定，在獲得香港總監的明確批准 後，未完成該階段木章訓練課程之領袖或總監，可獲簽發暫許委任書。 暫許委任書的持有人須在其暫許委任期屆滿前完成該階段木章訓練課 程，纔可獲頒發領袖委任書。` \n\n- `規條` **4.4.2** `地域總監的委任` (a) `地域總監須由負責的副香港總監提名，經香港總監認可後，推薦予總領 袖以簽發委任書。地域總監在接受委任書時，須作宣誓或覆誓。` \n\n   - (b) `地域總監委任書的有效期乃由簽發年份起計至最多不超過四年，屆時香 港總監須對此委任作覆核。` \n\n   - (c) `當地域總監委任書有效期滿，可由香港總監推薦續發。` \n\n   - (d) `香港總監可於任何認為適當的時間，對地域總監委任書作覆核。` \n\n   - (e) `在下列任何一種情況，根據香港總監的建議，可暫停或撤銷地域總監的 委任書︰` \n\n      - (i) `持有人請辭其職位；` \n\n      - (ii) `持有人默許有關通知撤銷其委任之決定；` \n\n      - (iii) `持有人不符合其職位的年齡及資格規定；` \n\n      - (iv) `在欠缺充分的理由下，持有人未能完成其領袖必修訓練課程；` \n\n      - (v) `根據` 4.4.2(b) `至` 4.4.2(d) `，經有關人士覆核後，不再獲續發委任書；` \n\n      - (vi) `持有人停止、未有或未能履行其任內的職務；` \n\n      - (vii) `持有人的行為表現出該人已不再接納本會目的、使命、方法、童 軍誓詞及規律內的童軍運動基本原則；` \n\n      - (viii) `持有人被根據規條` 1.3.7 `暫停會籍後，香港總監確認終止其委任；` (ix) `根據香港總監的指示而放棄其委任。` \n\n   - (f) `根據本「政策、組織及規條」的規定，如地域總監的委任被終止時，他 須交還其經註銷的委任書予總會。` \n\n   - (g) `當地域總監的職位懸空時，香港總監可根據負責的副香港總監的推薦， 委任一名副地域總監或助理地域總監，或任何其他總監代理其職務。` \n\n- `規條` **4.4.3** `其他總監的委任` (a) `地域總監負責提名委任其副地域總監（總監職級四級）、助理地域總 監（總監職級五級）、地域總部總監（總監職級六級）及助理地域總 部總監（總監職級七級）。` \n\n   - (b) `副地域總監、助理地域總監、地域總部總監及助理地域總部總監的委 任書有效期乃由簽發年份起計至最多不超過四年，屆時地域總監須對 此委任作覆核。至於暫許委任書有效期，則由簽發年份起計至最多不 超過兩年，屆時地域總監須對此等委任作覆核。` \n\n( 2014 `年` 7 `月` ) \n\n49\n\n<!-- p.55 -->\n- (c) `規條` 4.4.2 `亦適用於副地域總監、助理地域總監、地域總部總監及助理 地域總部總監的委任。地域總監在負責的副香港總監的認許下，負責 提名委任及覆核委任其副地域總監、助理地域總監、地域總部總監及 助理地域總部總監。` \n\n`規條` **4.4.4** `地域領袖及助理地域領袖的委任` \n\n   - (a) `副地域總監負責提名委任其地域領袖及助理地域領袖。` \n\n   - (b) `規條` 4.4.2 `及` 4.4.3(b) `亦適用於地域領袖及助理地域領袖的委任。地域總 監在負責的副香港總監的認許下，負責提名委任及覆核委任其副地域總 監、助理地域總監、地域總部總監及助理地域總部總監。` \n\n- `規條` **4.4.5** `領袖委任的限制` (a) `任何地域幹部均不應在同一地域內持有多過一個的委任，除非該名地域 幹部能兼顧此等委任內的各項相關職務。任何人士如欲持有多於一項委 任，必須先獲得有關總監的批准方可進行辦理。` \n\n   - (b) `除獲得香港總監的明確批准外，任何地域幹部皆不可持有超過三項有委 任書的委任。` \n\n50\n\n<!-- p.56 -->\n## `規條` **4.5** `童軍地域內各總監及領袖委任的資格及職責` \n\n- `規條` **4.5.1** `地域總監` \n\n   - (a) `年齡規限：最低年齡為三十歲，並須於六十五歲生日當日退休。` \n\n   - (b) `資 歷：地域總監須為「木章」持有人，具有總會規定的其他相關資歷， 如：童軍經驗、教育程度、工作經驗等。` \n\n   - (c) `職 責：地域總監透過負責的副香港總監向香港總監負責，並在地域幹 部的協助下，於其地域內：` \n\n      - (i) `推廣總會的抱負、使命、價值觀及目的；` \n\n      - (ii) `根據總會的目的、使命及童軍方法，為青少年成員及領袖提供適當 的活動與訓練，並鼓勵他們積極參與；` \n\n      - (iii) `維護及執行總會的政策、規則及規條；` \n\n      - (iv) `執行香港總監的指示及總會執行委員會的決定；` \n\n      - (v) `有關各總監、領袖及地域會務委員的招募、發展及工作表現之評核；` \n\n      - (vi) `籌設地域會務委員會及地域執行委員會，並致力令其有效地發揮功 能；` \n\n      - (vii) `確保地域幹部定期探訪各旅，以維持及改進其童軍質素；` \n\n      - (viii) `確保各成員的和諧合作及調解他們之間的糾紛；` \n\n      - (ix) `與地域內跟童軍運動有關的團體保持良好的關係，及確保總會的利 益獲得認可及有適當的保障；` \n\n      - (x) `確保所有童軍活動的安全，並嚴格遵守所有有關進行童軍活動時需 要遵守的安全措施及規定；` \n\n      - (xi) `根據規條` 4.6.1(a) `，提名地域會長及地域主席；` \n\n      - (xii) `以當然委員的身分出席總會執行委員會、總會會務委員會、香港總 監諮議會及地域內所有委員會及小組委員會的會議；` \n\n      - (xiii) `尋求足夠的資金及其他資源以支持地域內童軍運動的發展；` \n\n      - (xiv) `填報「週年人數統計表」，及在有需要時繳交該地域的成員費予總 會；` \n\n      - (xv) `適當推薦地域內的成員接受獎勵；及` \n\n      - (xvi) `執行負責的副香港總監或香港總監委派的一般任務及／或特定任 務。` \n\n- `規條` **4.5.2** `副地域總監` \n\n   - (a) `年齡規限：最低年齡為三十歲，並須於六十五歲生日當日退休。` \n\n   - (b) `資 歷：副地域總監須為「木章」持有人，具有總會規定的其他相關資 歷，如：童軍經驗、教育程度、工作經驗等。` \n\n   - (c) `職 責：在該等委任之時，有關職務範圍應由地域總監界定及得香港總 監的認許。` \n\n- `規條` **4.5.3** `助理地域總監、地域總部總監及助理地域總部總監` \n\n   - (a) `年齡規限：最低年齡為二十五歲，並須於六十五歲生日當日退休。` \n\n   - (b) `資 歷：助理地域總監、地域總部總監及助理地域總部總監須為「木章」 持有人，具有總會規定的其他相關資歷，如：童軍經驗、教育程度、工 作經驗等。` \n\n   - (c) `職 責：在該等委任之時，有關職務範圍應由地域總監界定。` \n\n51\n\n<!-- p.57 -->\n`規條` **4.5.4** `地域領袖及助理地域領袖` \n\n- (a) `年齡規限：` \n\n```\n地域領袖的年齡規限：\n```\n\n```\n最低年齡為二十一歲，並須於六十五歲生日當日退休。\n```\n\n- `助理地域領袖的年齡規限：` \n\n```\n最低年齡為十八歲，並須於六十五歲生日當日退休。\n```\n\n- (b) `香港總監可根據地域總監的推薦委任地域領袖及助理地域領袖。在該等 委任之時，有關職務範圍應由地域總監界定。` \n\n52\n\n<!-- p.58 -->\n## `規條` **4.6** `地域會務委員的委任` \n\n`規條` **4.6.1** `地域會務委員須循以下方式委任﹕` \n\n- (a) `地域會長` \n\n```\n地域會長是由地域總監提名，香港總監委任，並由地域會務委員會在\n週年會議上確認其委任，惟其總任期在任何一段連續性期間內，不能\n超過十年。\n```\n\n- (b) `地域主席` \n\n```\n地域主席是由地域總監與地域會長商議後提名，香港總監委任，並由\n地域會務委員會在週年會議上確認其委任，惟其總任期在任何一段連\n續性期間內，不能超過十年。\n```\n\n   - (c) `地域名譽會長、地域副會長及地域副主席` \n\n      - `地域名譽會長乃名譽上的委任，經地域總監與地域會長及地域主席商 議 後提名，由地域會務委員會在週年會議上確認其委任。副會長及 副主席 分別每年經地域總監與地域會長及地域主席商議後提名，由 地域會務委員會在週年會議上選出。每地域不可有多過五名地域副主 席。` \n\n   - (d) `地域祕書及地域司庫` \n\n      - `地域祕書及地域司庫是經地域總監提名，由地域會務委員會在週年會 議上選出。` \n\n   - (e) `其他地域會務委員` \n\n      - `其他地域會務委員是由地域會務委員會在週年會議上選出，而聘任委 員是由地域執行委員會邀請，並經週年會議確認。` \n\n- `規條` **4.6.2** `地域會務委員委任的限制` \n\n```\n地域會長、地域副會長、地域主席、地域副主席、地域祕書及地域司庫等\n職位皆不可彼此合併，亦不可由地域內任何一名持有委任書的領袖出任。\n```\n\n- `規條` **4.6.3** `年齡規限 被委任為地域會務委員的最低年齡為十八歲，不設上限。` \n\n- `規條` **4.6.4** `地域會務委員的委任紀錄 由委任日期起三十天內，地域總監須提交該地域會務委員的有關資料給總 會。` \n\n`規條` **4.6.5** `終止地域會務委員的委任 地域會務委員的委任，在以下任何情況下可被終止︰` \n\n- (a) `該地域會務委員請辭其職位；` \n\n- (b) `該地域會務委員默許地域執行委員會終止其委任；` \n\n- (c) `委任的期限屆滿；` \n\n- (d) `該地域會務委員被根據規條` 1.3.7 `暫停會籍後，香港總監確認終止其委 任。` \n\n- (e) `根據香港總監的指示。` \n\n( 2022 `年 9月` ) \n\n53\n\n<!-- p.59 -->\n## `規條` **4.7** `地域會務委員之職責` \n\n`規條` **4.7.1** `地域會長、地域名譽會長及地域副會長` \n\n   - (a) `地域會長負責鼓勵該地域的發展，並確保該地域財政收支平衡。地域會 長的職位屬榮譽性質，在地域內並不負有行政管理的責任。` \n\n   - (b) `地域名譽會長及地域副會長應協助地域會長履行其責任。在地域會長缺 席時，可由地域副會長代表履行其職責。` \n\n- `規條` **4.7.2** `地域主席及地域副主席` \n\n   - (a) `地域主席的職責是：` \n\n      - (i) `擔任地域執行委員會的主席；` \n\n      - (ii) `擔任總會會務委員會的當然委員；` \n\n      - (iii) `與地域總監緊密合作，鼓勵地域內童軍運動的良好發展；` \n\n      - (iv) `以當然委員的身分出席地域內所有小組委員會及臨時小組之會議。` \n\n   - (b) `地域副主席以協助地域主席履行其責任。在地域主席缺席時，可由地域 副主席代表履行其職責。` \n\n- `規條` **4.7.3** `地域祕書` \n\n```\n地域祕書的職責是﹕\n```\n\n- (a) `擔任地域會務委員會及地域執行委員會的祕書；` \n\n- (b) `協調地域屬下各小組委員會及臨時小組的工作；` \n\n- (c) `發放總會、地域會務委員會及地域執行委員會的有關資料及指示到所有 有關人士。` \n\n`規條` **4.7.4** `地域司庫` \n\n```\n地域司庫的職責是：\n```\n\n- (a) `向地域會務委員會及地域執行委員會提供所有涉及財政事項的意見；` \n\n- (b) `經諮詢地域總監後，制定週年財政預算在週年會議請求通過；` \n\n- (c) `在每次地域執行委員會會議及地域會務委員會週年會議中，提供一份財 務報告，精確列明該地域的財政現況；` \n\n- (d) `代表地域收集款項，並保存賬目紀錄。` \n\n- (e) `支付該地域所批准的開支；` \n\n- (f) `以地域名義開設一個或多個有需要的銀行戶口；` \n\n- (g) `確保該地域的撥款或捐贈能正確地運用；` \n\n- (h) `在所有籌募事項中，與地域及地域內的區保持緊密合作；` \n\n- (i) `監察地域各項資產與設備的管理，並確保其存有適當的詳細清冊及保險 安排。` \n\n- (j) `如地域及／或地域內的區有參與任何信託基金或投資計劃，須確保有關 信託基金或投資計劃的規例皆獲得總會認可。` \n\n54\n\n<!-- p.60 -->\n`規條` **4.8** `地域幹部會議` \n\n```\n地域幹部會議由地域總監負責主持，可視乎需要而召開，但須至少每三個\n月舉行一次。其目的為：\n```\n\n- (a) `檢討地域內訓練及青少年活動的進展、標準及成效；` \n\n- (b) `策劃及協調地域內的領袖與青少年之活動與訓練，及其他發展活動；` \n\n- (c) `策劃及協調一些有需要的地域活動與青少年活動，以充實各區及旅的童 軍活動；` \n\n- (d) `策劃、協調及支持總會、其他地域及地域內各區所籌辦的活動；` \n\n- (e) `計劃及監管地域內各項訓練與活動的財政需求及開支；` \n\n- (f) `協助地域總監有效地推行地域內的工作。` \n\n55\n\n<!-- p.61 -->\n## `規條` **4.9** `地域會務委員會及地域執行委員會` \n\n`規條` **4.9.1** `地域會務委員會` \n\n   - (a) 地域會務委員會的職能，是在該地域內支援和促進童軍運動的發展。 \n\n   - (b) 地域會務委員會每年須於六月三十日或之前，舉行由地域會長主持的週年 會議，以： \n\n      - (i) 接納地域執行委員會的週年報告及經審核的財務報告，並將報告的一 份副本，送交總會； \n\n      - (ii) 確認地域總監對地域會長、地域名譽會長及地域主席的提名； \n\n      - (iii) 選出地域副會長、地域副主席、地域祕書及地域司庫 ; \n\n      - (iv) 根據規條 4.9.4 ，委任地域執行委員會委員； \n\n      - (v) 委任一名地域核數師； \n\n      - (vi) 追認由地域執行委員會批准的本年度地域財政預算； \n\n      - (vii) 考慮及審批與該地域有關的其他事項。 \n\n- `規條` **4.9.2** `地域會務委員會的成員 地域會務委員會包括：` \n\n   - (a) `當然委員` \n\n      - (i) `地域會長` \n\n      - (ii) `地域總監` \n\n      - (iii) `地域名譽會長及地域副會長` \n\n      - (iv) `地域主席及地域副主席` \n\n      - (v) `副地域總監` \n\n      - (vi) `助理地域總監及地域其他總監` \n\n      - (vii) `地域祕書` \n\n      - (viii) `地域司庫` \n\n      - (ix) `地域內各區總監` \n\n      - (x) `其他地域會務委員（包括地域顧問）` \n\n      - (xi) `附屬於地域內各領袖訓練主任及助理領袖訓練主任` \n\n      - (xii) `地域內各區會長及區主席` \n\n      - (xiii) `地域執行幹事` \n\n   - (b) 選任委員 \n\n```\n地域會務委員會可在週年會議中選舉出不超過十二名選任委員，但確\n實的數目要視乎地域會務委員會的議決及香港總監的批准。其中不少\n於半 數須由地域總監提名。\n```\n\n- (c) `聘任委員` \n\n```\n地域會務委員會可在地域執行委員會內加入聘任委員，其中可包括地區\n團體及該地域內機構的代表。聘任委員不可超過選任委員的數目。\n```\n\n`規條` **4.9.3** \n\n### `地域執行委員會` \n\n```\n地域執行委員會是為支持地域總監履行其職責及為地域內各區提供支援而\n設。地域執行委員會須最少每四個月召開一次會議，以：\n```\n\n- (a) `在地域內推動童軍運動的發展；` \n\n- (b) `取得其他團體及社區的合作及支持，並協調各區的工作；` \n\n- (c) `為該地域取得財政支持及籌募經費；` \n\n( 2025 `年` 11 `月` ) \n\n56\n\n<!-- p.62 -->\n- (d) `管理該地域的財政及資產；` \n\n   - (e) `與地域總監商議小組委員會及臨時小組的委員；` \n\n   - (f) `與地域總監商議後，提名每年地域會務委員會人選；` \n\n   - (g) `審閱及認許該地域的週年報告與經審核的財務報告，以備地域會務委 員會在週年會議中批覈。` \n\n   - (h) `批覈該地域的週年財政預算；` (i) `處理地域內的其他行政事宜。` \n\n- `規條` **4.9.4** `地域執行委員會的成員` \n\n**(a)** `當然委員` \n\n- (i) `香港總監` \n\n- (ii) `負責的副香港總監` \n\n- (iii) `地域總監` \n\n- (iv) `地域主席` \n\n- (v) `地域副主席` \n\n- (vi) `副地域總監` \n\n- (vii) `助理地域總監` \n\n(viii) `地域祕書` \n\n- (ix) `地域司庫` \n\n- (x) `地域內各區總監` \n\n- (xi) `地域小組委員會主席` \n\n- (xii) `地域內各區主席` \n\n(xiii) `地域執行幹事` \n\n- (b) `選任委員` \n\n```\n地域會務委員會可在週年會議中選出不超過十二名選任委員，但確實\n的數目要視乎地域會務委員會的議決及香港總監的批准。其中不少於\n半數須由地域總監提名。\n```\n\n- (c) `聘任委員` \n\n```\n地域會務委員會可在地域執行委員會內加入聘任委員，其中可包括地\n區團體及該地域內機構的代表。聘任委員不可超過選任委員的數目。\n```\n\n- `規條` **4.9.5** `小組委員會及臨時小組的成員` \n\n```\n小組委員會和臨時小組是因特定目的由地域執行委員會成立，成員由地域\n執行委員會委派。地域總監和地域主席是所有小組委員會及臨時小組的當\n然委員。\n```\n\n`規條` **4.9.6** `童軍地域會議的程序` (a) `在地域會務委員會的會議上，只有在規條` 4.9.2(a) `及` 4.9.2(b) `上所列明 的成員纔有投票權。` \n\n(b) `在地域執行委員會的會議上，只有在規條` 4.9.4(a) `及` 4.9.4(b) `上所列明 的成員纔有投票權。` \n\n(c) `適用於旅會議的規條` 2.10.5 `之規定，亦同時適用於地域。` \n\n( 2022 `年` 9 `月` ) \n\n57\n\n<!-- p.63 -->\n`規條` **4.10** `童軍地域財務` \n\n- `規條` **4.10.1** (a) `所有地域必須保存完整的賬冊及財務報告，在總會要求時，須提交有關 資料以供審核。` \n\n   - (b) `賬冊及及財務報告應最少保存由最後入賬紀錄日期起計七年的時間。` \n\n   - (c) `當向第三者作出任何財務上的承擔或協議時，簽約者須明確地向對方表 明其並非以個人身分，而是代表該地域。` \n\n- `規條` **4.10.2** `提交經審核的財務報告` \n\n   - (a) 總會的財政年度為每年的四月一日至翌年三月三十一日。所有地域必須 於每年的六月三十日前提交一份經審核及在其週年會議中通過的財務 報告（截至三月三十一日止）予總會。報告內容須包括以下各項資 料： \n\n      - (i) `各項資產詳情，如屬於非設備類別的資產，則須列明受託人的資料；` (ii) `永久託管資產，例如地域所受永久託管而不可變賣或轉讓的業權， 亦須分列詳述；` \n\n      - (iii) `債務詳情；` \n\n      - (iv) `財政年度內的收入報表，須按其性質分類列出。如屬永久託管資產， 亦須另項說明；` \n\n      - (v) `財政年度內所支出的項目，須按其性質分類列出。如屬永久託管資 產，亦須另項說明。` \n\n   - (b)  地域核數師是由地域會務委員會在週年會議中委任，並須是獨立，且 具備專業資格的會計師。 \n\n   - (c)  香港總監可在任何時間，要求地域提交經審核之財務報告。 \n\n`規條` **4.10.3** `地域銀行賬戶、繳付成員費、童軍地域的籌募活動、資產、設備及資金、 資產的處理及文件的保存` \n\n`適用於區的規條` 3.10.3 `至` 3.10.8 `，亦同時適用於地域；有關負責人則為地 域總監、地域司庫及地域祕書。` \n\n( 2025 `年` 11 `月` ) \n\n58\n\n<!-- p.64 -->\n`規條` **4.11** `意外及保險` \n\n- `規條` **4.11.1** `適用於旅的規條` 2.12 `之規定，亦同時適用於地域；地域總監須就未包括在 總會所購買的保險範圍內之風險負責購買足夠的保險。` \n\n- `規條` **4.11.2** `如需處理涉及投保、申報傷亡或索償的事項時，須由負責該節目或活動的 總監或領袖，或其他成年人在地域總監之監察下處理。地域總監須諮詢總 會尋求指示。` \n\n59\n\n<!-- p.65 -->\n`規條` **4.12** `地域內部的糾紛` \n\n`規條` **4.12.1** `以下程序須在非正式的解決方法失敗後運用：` \n\n- (a) `有關地域內的總監與總監之間或牽涉到地域內任何總監的糾紛須交由 負責的副香港總監處理。` \n\n- (b) `其他成年成員之間的糾紛須由地域總監處理。` \n\n- (c) `如地域總監未能解決糾紛，或其本人牽涉入糾紛之中，地域總監須把事 件交由負責的副香港總監處理。` \n\n- (d) `如負責的副香港總監未能解決有關糾紛，須交由香港總監處理。香港總 監的決定將為最終的定案。` \n\n- (e) `糾紛中所有有關人士均須有合理機會表達意見及獲得聆聽。` \n\n60\n\n<!-- p.66 -->\n## `第五章 總會總部` \n\n- 規條 **5.1** \n\n## 童軍總領袖及副總領袖 \n\n- (a) 童軍總領袖一職由總會會務委員會邀請香港特別行政區行政長官擔 任。 \n\n- (b) 總會會務委員會在總領袖之推薦下，可委任一名副總領袖。 \n\n- (c) 總領袖之職責如下： \n\n   - (i)   扶植及鼓勵香港童軍運動；及 \n\n   - (ii)  簽署各級總監委任書。 \n\n61\n\n<!-- p.67 -->\n規條 **5.2** 贊助人及副贊助人 \n\n- (a) 總會贊助人及副贊助人是由總會會務委員會於週年大會中委任。 \n\n- (b) 贊助人及副贊助人負責協助總領袖扶植及鼓勵香港童軍運動。 \n\n62\n\n<!-- p.68 -->\n規條 **5.3** 會長、名譽會長及副會長 \n\n規條 **5.3.1** 會 長 \n\n總會會長須由會務委員會在週年會議時推選，任期一年，得連選連任， 惟其總任期在任何一段連續性期間內，不能超過十年。 \n\n規條 **5.3.2** 名譽會長 \n\n總會名譽會長是每年由總會會務委員會委任，得連選連任。 \n\n規條 **5.3.3** 副會長 \n\n總會副會長須由會務委員會在週年會議時推選，任期一年，得連選連 任，惟每一副會長之總任期，在任何一段連續性期間內，不能超過十年。 \n\n63\n\n<!-- p.69 -->\n規條 **5.4** 香港總監 規條 **5.4.1** 香港總監之委任須根據一選拔委員會之推薦，並經由總會執行委員會呈 交會長認許，而由總領袖委任。 \n\n規條 **5.4.2** 選拔委員會的成員由香港總監、副香港總監及助理香港總監組成。總幹 事為選拔委員會之祕書，但沒有投票權。選拔委員會可自行制定適合的 選拔規條及程序。 \n\n- 規條 **5.4.3** 香港總監的任期為四年一任，任期屆滿時，可繼續被選拔委任第二個四 年任期，惟其連續任期不能超過八年。 \n\n- 規條 **5.4.4** (a) 香港總監為香港童軍運動的總執行人，負責總會會務管理，並監督 專業領袖及受薪職員，及總會會務委員會與總會執行委員會決議的 執行。 \n\n   - (b) 香港總監負責童軍領袖與會務委員的委任，及各單位、旅的註冊、 區及地域的設立，並有責任督促香港童軍運動所有成員的良好形象 及品格。 \n\n   - (c) 香港總監可轉授其權限或職責予任何一名總監，代其行使這些權限 或執行這些職責。 \n\n64\n\n<!-- p.70 -->\n## 規條 **5.5** 總會執行委員會主席、副主席、總會祕書及總會司庫 \n\n- 規條 **5.5.1** 總會執行委員會主席 \n\n總會執行委員會主席是由總會會務委員會在週年會議中選出，任期一 年，得連選連任，惟其任期不得超過連續十年。 \n\n規條 **5.5.2** 總會執行委員會副主席 總會會務委員會在週年會議中選出一名或以上總會 執行委員會副主 席，任期一年，得連選連任，惟其任期不得超過連續十年。 \n\n- 規條 **5.5.3** 總會祕書 \n\n   - (a) 總會祕書是由總會會務委員會於週年會議中選出，任期一年，得連 選連任，惟其任期不得超過連續十年。 \n\n   - (b) 總會祕書的職位不可與總會司庫的職位合併，並且不可由持有委任 書的領袖出任。 \n\n- 規條 **5.5.4** 總會司庫 \n\n   - (a) 總會司庫是由總會會務委員會在週年會議中選出，任期一年，得連 選連任，惟其任期不得超過連續十年。 \n\n   - (b) 總會司庫的職位不可與總會祕書的職位合併，並且不可由持有委任 書的領袖出任。 \n\n65\n\n<!-- p.71 -->\n規條 **5.6** 副香港總監及助理香港總監 \n\n- 規條 **5.6.1** 副香港總監及助理香港總監可由總領袖根據香港總監的推薦而委任，代 理及／或協助香港總監，其職務範圍是由香港總監於委任時訂定並可隨 時修訂。 \n\n- 規條 **5.6.2** 香港總監有權隨時暫停或終止任何副香港總監及／或各助理香港總監 的委任，惟該副香港總監或助理香港總監可對香港總監的決定向總會會 長提出上訴，而總會會長的決定乃最終的裁決。 \n\n66\n\n<!-- p.72 -->\n規條 **5.7** 副署總監、助理署總監、總部總監、助理總部總監、總部領 袖、助理總部領袖及專科會員 \n\n- 規條 **5.7.1** (a) 總領袖可根據副香港總監或助理香港總監的推薦及香港總監的認 許，委任副署總監（總監職級四級）及助理署總監（總監職級五級）， 代理及／或協助副香港總監或助理香港總監，其職務範圍是由副香 港總監及／或助理香港總監於委任時訂定並可隨時修訂。 \n\n   - (b) 總領袖可根據副香港總監或助理香港總監的推薦及香港總監的認 許，委任總部總監（總監職級六級）及助理總部總監（總監職級七 級）以承擔委任時所指定的一般性或特定之職責；其職責範圍是由 副香港總監及／或助理香港總監於委任時訂定並可隨時修訂。 \n\n- 規條 **5.7.2** 香港總監可根據副香港總監或助理香港總監的推薦，委任總部領袖及助 理總部領袖以承擔委任時所指定的一般性或特定之職責；其職責範圍是 由副香港總監及／或助理香港總監於委任時訂定並可隨時修訂。 \n\n在香港總監的批准下，副香港總監可委任具有專業知識或技能的成年 規條 **5.7.3** 人士為專科會員以承擔委任時所指定之特定職責。 \n\n( 2022 `年` 9 `月` ) \n\n67\n\n<!-- p.73 -->\n- 規條 **5.8** 領袖訓練主任、助理領袖訓練主任、領袖訓練員及 專科訓練員 \n\n- 規條 **5.8.1** 總領袖可根據香港總監的推薦，委任領袖訓練主任（總監職級五級）、 助理領袖訓練主任（總監職級六級），而領袖訓練員則可由香港總監在 徵詢負責訓練的總監之意見後作出委任。有關領袖訓練主任、助理領袖 訓練主任及領袖訓練員須承擔委任時所指定的領袖訓練有關的職責。 \n\n- 規條 **5.8.2** 香港總監可委任具有專業知識、技能或資歷的人士為專科訓練員以承擔 委任時所指定跟訓練有關之特定職責。 \n\n( 2012 `年` 5 `月` ) \n\n68\n\n<!-- p.74 -->\n規條 **5.9** 總會總部各級總監、訓練隊員、領袖的委任資格 規條 **5.9.1** 總會總部各級總監的委任資格： \n\n- (a) 香港總監 \n\n年齡規限：最低年齡為四十歲，並須於六十五歲生日當日退休。 資 歷：香港總監須為「木章」持有人，具有總會規定的其他相關 資歷，如：童軍經驗、教育程度、工作經驗等。 \n\n(b) 副香港總監、助理香港總監、副署總監及助理署總監 年齡規限：最低年齡為三十歲，並須於六十五歲生日當日退休。 資 歷：副香港總監、助理香港總監、副署總監及助理署總監須為 「木章」持有人，具有總會規定的其他相關資歷，如：童軍經驗、 教育程度、工作經驗等。 \n\n- (c) 總部總監及助理總部總監 \n\n年齡規限：最低年齡為二十五歲，並須於六十五歲生日當日退休。 資 歷：總部總監及助理總部總監須為「木章」持有人，具有 總會 規定的其他相關資歷，如：童軍經驗、教育程度、工作經驗等。 \n\n規條 **5.9.2** (a) 總部領袖的年齡規限： \n\n最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n- (b) 助理總部領袖的年齡規限︰ \n\n最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n- 規條 **5.9.3** (a) 訓練員的年齡規限： \n\n最低年齡為二十五歲，並須於六十五歲生日當日退休（除非獲香港 總監批准延長）。 \n\n- (b) 助理領袖訓練主任的年齡規限： \n\n最低年齡為三十歲，並須於六十五歲生日當日退休（除非獲香港總 監批准延長）。 \n\n(c) 領袖訓練主任的年齡規限： 最低年齡為三十五歲，並須於六十五歲生日當日退休（除非獲香港 總監批准延長）。 \n\n69\n\n<!-- p.75 -->\n## 規條 **5.10** 總會總部各級總監及領袖的委任 \n\n- 規條 **5.10.1** 委任書及暫許委任書 \n\n   - (a)  委任書只發給已完成香港總監規定的某階段木章訓練課程之領袖 或總監。 \n\n   - (b) 儘管有規條 5.9.1(b)及規條 5.9.1(c)的規定，在獲得香港總監的明確 批准後，未完成該階段木章訓練課程之領袖或總監，可獲簽發暫許 委任書。暫許委任書的持有人須在其暫許委任期屆滿前完成該階段 木章訓練課程，纔可獲頒發領袖委任書。 \n\n- 規條 **5.10.2** (a) (i) 總監委任書或暫許委任書由香港總監推薦，總領袖簽發。 \n\n      - (ii)  領袖委任書或暫許委任書由香港總監根據副香港總監或助理香 港總監的推薦而簽發。 \n\n      - (iii)當接受委任書或暫許委任書時，該總監或領袖須作宣誓或覆誓。 \n\n   - (b)  除規條 5.6.2、規條 5.10.2(g)及規條 5.10.2(i)另有規定外，總會總部 各級總監委任書的有效期乃由簽發年份起計至最多不超過四年，屆 時香港總監或其代表須對此委任作覆核。 \n\n   - (c)  除規條 5.6.2、規條 5.10.2(g)及規條 5.10.2(i)另有規定外，暫許總會 總部各級總監委任書的有效期乃由簽發年份起計至最多不超過兩 年，屆時香港總監或其代表須對此委任作覆核。 \n\n   - (d)  除規條 5.10.2(g)及規條 5.10.2(i)另有規定外，總會總部各級領袖委 任書的有效期乃由簽發年份起計至最多不超過四年，屆時負責總監 須對此委任作覆核。 \n\n   - (e)  除規條 5.10.2(g)及規條 5.10.2(i)另有規定外，暫許總會總部各級領 袖委任書的有效期乃由簽發年份起計至最多不超過兩年，屆時負責 總監須對此委任作覆核。 \n\n   - (f) 當總監及領袖的委任書或暫許委任書有效期滿，可由負責總監推薦 續發。惟有關總監推薦續發暫許委任書時，須附有該暫許委任書持 有人的合理書面解釋為何其仍未完成該階段木章訓練課程。 \n\n   - (g)  香港總監或其代表可於任何適當的時間對委任書或暫許委任書作 覆核。香港總監亦可根據規條 5.10.2(i)，暫停及／或撤銷有關委任 書或暫許委任書。 \n\n   - (h)  根據本「政策、組織及規條」的規定，如任何總監或領袖的委任被 終止時，他須交還其經撤銷的委任書予總會。 \n\n   - (i)   下列任何一種情況下，香港總監可根據有關副香港總監或助理香港 總監的建議，暫停或撤銷其屬下副署總監、助理署總監、總部總 監、助理總部總監、總部領袖或助理總部領袖的委任書或暫許委任 書： \n\n      - (i) 持有人請辭其職位； \n\n      - (ii) 持有人默許有關撤銷其委任之決定； \n\n      - (iii) 持有人不符合其職位的年齡及資格規定； \n\n      - (iv) 在欠缺充分的理由下，持有人未能完成其領袖必修訓練課程； \n\n      - (v) 根據 5.10.2(b)至 5.10.2(g)，經有關人士覆核後，不再獲續發委 任書； \n\n( 2014 `年` 7 `月` ) \n\n70\n\n<!-- p.76 -->\n- (vi)    持有人停止、未有或未能履行其任內的職務； \n\n   - (vii) 持有人的行為表現出該人已不再接納總會目的、使命、方法、 童軍誓詞及規律內的童軍運動基本原則； \n\n   - (viii) 持有人被根據規條 1.3.7 暫停會籍後，香港總監確認終止其委 任； \n\n   - (ix)  根據香港總監的指示而放棄其委任。 \n\n- (j)   除副香港總監或助理 香港總監外，任何根 據規條 5.10.2(g) 或 5.10.2(i) 被暫停或撤銷委任書或暫許委任書的總會總部各級總監 或領袖皆可就該停職或撤職向香港總監提出申訴。香港總監會由香 港總監諮議會內指派一特別委員會決斷有關申訴，而該特別委員會 的決定乃最終的裁決。 \n\n( 2014 `年` 7 `月` ) \n\n71\n\n<!-- p.77 -->\n規條 **5.11** 領袖訓練主任、助理領袖訓練主任及訓練員的委任 規條 **5.11.1** (a) \n\n- (a) 經負責領袖訓練的總監提名，領袖訓練主任、助理領袖訓練主任及 訓練員可獲頒發委任書。 \n\n- (b) 規條 5.10.2(g) 至(j)亦適用於領袖訓練主任、助理領袖訓練主任及領 袖訓練員的委任覆核。 \n\n( 2014 `年` 7 `月` ) \n\n72\n\n<!-- p.78 -->\n規條 **5.12** 總幹事及其他職員 規條 **5.12.1** \n\n香港總監可委任一名總幹事、一名或多名副總幹事，以及其他專業領袖 與受薪職員以協助香港總監執行其職務及處理總會的事務，以確保會務 運作順利。總幹事是向香港總監負責，專責督導總會與各屬會的職員。 他亦須履行香港總監交付的其他職務。 \n\n73\n\n<!-- p.79 -->\n規條 **5.13** 香港總監諮議會 \n\n- 規條 **5.13.1** (a) 香港總監諮議會負責向香港總監提供意見及協助香港總監執行及 履行其職務。香港總監諮議會由香港總監主持會議，並由以下人士 組成： \n\n      - (i) 副香港總監 (ii) 助理香港總監 (iii)  總幹事 \n\n   - (b) 香港總監可邀請其他總監或會務委員出席香港總監諮議會的會議。 \n\n規條 **5.13.2** 香港總監是香港總監諮議會的主席。 \n\n74\n\n<!-- p.80 -->\n規條 **5.14** 總會總部 \n\n總會總部乃總會負責指揮及管理的行政中心，設有不同的署或部門，為 所有成員提供必需的服務、履行總會政策與規條，並在香港特別行政區 內推動及拓展童軍運動。 \n\n75\n\n<!-- p.81 -->\n規條 **5.15** 總會會務委員會 \n\n規條 **5.15.1** 總會會務委員會為總會的最高權力機構，以拓展香港童軍運動，並須包 括以下成員： \n\n**(a)** 當然委員 (i)    總領袖及副總領袖 (ii)   贊助人及副贊助人 (iii)  會   長 (iv)  香港總監 (v)   名譽會長及副會長 (vi)  主席及副主席 (vii) 副香港總監及助理香港總監 (viii)總會祕書及總會司庫 (ix)  副地域總監及副署總監 (x)   財務委員會主席 (xi)  地域會長及屬會會長 (xii) 地域主席及屬會主席 **(b)** 選任委員 \n\n總會會務委員會可在週年大會中選出不超過二十名總會成員為選 任委員，任期一年，連選得連任。 \n\n**(c)** 聘任委員 總會會務委員會可在週年大會中聘任不超過二十名人士為聘任委 員，最少其中一名為三十歲以下人士，任期一年，連選得連任。 如香港女童軍總會的香港總監答允，她應是聘任委員之一。 \n\n( 2023 `年 7月` ) \n\n76\n\n<!-- p.82 -->\n## 規條 **5.16** 總會會務委員會週年會議 \n\n規條 **5.16.1** 總會會務委員會須於每年七月或盡快在該期間後，由會長或於其缺席時 由指定的副會長主持週年會議，以履行： \n\n   - (a) 接納本會年報及經審核的財務報告； \n\n   - (b) 選出及聘任來屆的有職守人士及委員； \n\n   - (c) 根據規條 5.17.2 委任總會執行委員會成員； \n\n   - (d) 追認由總會執行委員會批准的本年度總會財政預算； \n\n   - (e) 委任一名核數師；及 \n\n   - (f)  處理由主席或不少於四分之一的出席委員所同意的臨時動議（見總 會會章第六節 3(a)條）。 \n\n- 規條 **5.16.2** 除在總會會章第十一節所列明之修改總會會章的特別會議外，總會祕 書須 在召開會議十四日前，用書面通知各委員出席，但任何委員如未 能接獲 該通知書，不能藉此提出在該會議已通過之事項為無效。 \n\n- 規條 **5.16.3** 總會會務委員會舉行任何會議，其法定人數為二十名親自出席之委 員。 \n\n- 規條 **5.16.4** 總會會務委員會特別會議，可由會長、香港總監或總會執行委員會主席 召開，或由不少於八名委員以書面請求時在三個月內召開。 \n\n- 規條 **5.16.5** 所有親自出席之委員均有個人表決權，如在表決時遇有贊成與反對雙方 票數相等時，主席將無額外投決定性一票之權利，而該議案亦作為不通 過論。 \n\n- 規條 **5.16.6** 在總會會務委員會的特別會議上，只能處理在會議通告內所載的事項。 \n\n( 2022 `年 7月` ) \n\n77\n\n<!-- p.83 -->\n規條 **5.17** 總會執行委員會 \n\n規條 **5.17.1** 在會務委員會各個會議與會議期間內，有關主要政策之決議，與香港總 監之協調、財政及資源之管制，及財政支援之職權，應賦予總會執行委 員會處理權力，總會執行委員會須最少每三個月召開會議一次。 \n\n- 規條 **5.17.2** 總會執行委員會包括下列成員： \n\n   - (a) 當然委員 \n\n      - (i) 香港總監 \n\n      - (ii)   主席及副主席 \n\n      - (iii)  副香港總監及助理香港總監 \n\n      - (iv)  總會祕書 \n\n      - (v) 總會司庫 \n\n      - (vi)  財務委員會主席 \n\n   - (b) 選任委員 \n\n      - 總會會務委員會在週年會議中，從其委員中推選不超過二十名人士 出任，最少其中一名為三十歲以下人士。專業領袖或受薪職員均不 可出任為選任委員。 \n\n- 規條 **5.17.3** 在每次總會會務委員會會議舉行後之第一次總會執行委員會會議獲授 權採納該會務委員會會議紀錄。 \n\n- 規條 **5.17.4** 每次總會執行委員會會議的法定人數為其委員的三分之一，並須親自 出席。 \n\n- 規條 **5.17.5** 總會執行委員會會議時，親自出席之委員均有個人表決權，如在表決 遇有贊成與反對雙方票數相等時，主席將無額外投決定性一票的權 利，而該議案亦作為不通過論。 \n\n- 規條 **5.17.6** 在總會會務委員會休會期間，任何選任委員出缺時，總會執行委員會 可增聘委員填補，直至來屆的週年會議。 \n\n- 規條 **5.17.7** 總會執行委員會可邀請總會任何成員及／或其他組織、團體及／或政 府的代表以觀察員身份出席會議。總會執行委員會亦可邀請其他總會 成員列席其會議。 \n\n( 2023 `年 7月` ) \n\n78\n\n<!-- p.84 -->\n- 規條 **5.18** 財務委員會、獎勵委員會及其他委員會 \n\n規條 **5.18.1** 總會執行委員會可授權財務委員會處理總會財政及資源之管制及財政 支援職務。 \n\n- 規條 **5.18.2** 財務委員會之委員人選及職務大綱，應由總會執行委員會訂定，惟總會 執行委員會主席及司庫為財務委員會之成員。 \n\n規條 **5.18.3** 財務委員會主席每年由總會執行委員會委任。 \n\n規條 **5.18.4** 總會執行委員會可授權由會長出任為主席之獎勵委員會處理頒授獎勵 事宜。獎勵委員會成員如下： \n\n- (a) 當然委員 \n\n   - (i) 會長 \n\n   - (ii)   香港總監 \n\n   - (iii)  總會執行委員會主席 \n\n- (b) 委員 \n\n不超過四名由總會執行委員會委任的成員，任期一年，得連選連任。 \n\n規條 **5.18.5** 總會執行委員會可設立及委任其他委員會，在特定任務範圍內提供意 見。總會執行委員會在設立該等委員會時，應界定其職務範圍、規條及 程序。 \n\n79\n\n<!-- p.85 -->\n## 規條 **5.19** 香港童軍基金管理委員會 \n\n規條 **5.19.1** 香港童軍基金管理委員會除負責管理所有由香港童軍中心及該委員會 經營的投資所產生之收益外，亦負責管理及投資總會執行委員會交託的 任何資金，以達致總會的最大利益。 \n\n規條 **5.19.2** 香港童軍基金管理委員會須包括以下成員： \n\n- (a) 當然委員 \n\n   - (i) 香港總監 \n\n   - (ii)   總會執行委員會主席 \n\n   - (iii)  總會司庫 \n\n   - (iv)  財務委員會主席 \n\n   - (v) 總幹事 \n\n- (b) 選任委員 總會執行委員會選出選任委員，任期一年，得連選連任， 其中須包括： \n\n   - (i) 主席 \n\n   - (ii) 副主席 \n\n(iii) 另不多於六名成員（不須為總會會務委員會的成員） \n\n( 2012 `年` 9 `月` ) \n\n80\n\n<!-- p.86 -->\n規條 **5.20** 諮詢委員會、委員會及專責小組 \n\n在香港總監的批准下，副香港總監或助理香港總監可設立及委任諮詢委 員會、委員會及專責小組，在特定任務範圍內提供意見。副香港總監或 助理香港總監除可委任總監及領袖為成員外，並可委任會務委員及顧問 為該等諮詢委員會、委員會、專責小組的成員。 \n\n81\n\n<!-- p.87 -->\n- 規條 **5.21** 總會屬會 \n\n- 規條 **5.21.1** 總會可設立、批准或承認其部分編制單位或任何相關組織為屬會。 \n\n- 規條 **5.21.2** 總會須保存所有屬會的紀錄。 \n\n- 規條 **5.21.3** 所有屬會的會章、會籍、規條及則例及有關的修訂，均須經總會執行委 員會批准。 \n\n- 規條 **5.21.4** 總會執行委員會可確立、更改或修訂任何屬會的會章、會籍、規條及則 例。 \n\n- 規條 **5.21.5** 總會屬會包括（但不限於）： \n\n   - (a) 童軍知友社； \n\n   - (b) 香港童軍貝登堡聯誼會； \n\n   - (c) 總監俱樂部； \n\n   - (d) 貝登堡國際有限公司； \n\n   - (e) 童軍物品供應社； \n\n   - (f) 香港童軍百週年會所。 \n\n- 規條 **5.21.6** 總會屬會的會長及主席的提名須由香港總監批覈。 \n\n( 2025 年5 月) \n\n82\n\n<!-- p.88 -->\n規條 **5.22** 總會附屬單位 \n\n規條 **5.22.1** 總會可設立、批准或承認某些團體為附屬單位。 \n\n規條 **5.22.2** \n\n- (a)  總會的附屬單位包括總會承認之在香港特別行政區內的外國童軍 單位。 \n\n- (b)  外國童軍單位是指在總會同意下在香港為其國民或會員進行童軍 活動並已經在其母會註冊的世界童軍組織會員國居港單位。 \n\n83\n\n<!-- p.89 -->\n## 第六章 通用規條 \n\n規條 **6.1** 行為操守 規條 **6.1.1** 本會根據童軍誓詞與規律所包含的童軍價值觀制定了「行為守則」，作 為本會成員與其他童軍成員相處時，以及以童軍名義參加非童軍活動時 的行為表現準則。 \n\n規條 **6.1.2** 為提供一個安全的童軍活動環境予我們的成員、保護他們在參與童軍運 動期間免受任何傷害，本會制定了「保護童軍成員免受傷害政策」。成 年成員須承諾以保護童軍成員於童軍運動中免受傷害為職責。 \n\n( 2021 年 10 月) \n\n84\n\n<!-- p.90 -->\n## 規條 **6.2** 財務管治 \n\n- 規條 **6.2.1** 經本會成員、政府或公眾所籌獲的資金，只可用於達致本會的目的之 用。 \n\n- 規條 **6.2.2** 本會的任何收入或資產，均不可直接或間接以股權、股息、紅利或其他 方式支付、轉讓或分送予本會成員。 \n\n- 規條 **6.2.3** 所有總會會務委員會及執行委員會成員均不可接受以金錢或金錢等值所 支付的酬金或其他利益。 \n\n- 規條 **6.2.4** (a) 所有總會會務委員會及執行委員會成員均須接受及遵守本會的申報利 益政策。 \n\n   - (b) 若會務委員會及執行委員會成員在一項與本會訂立的交易、安排或合 約、或建議的交易、安排或合約中有，直接或間接，實質的利益關 係，則該成員須向會務委員會及執行委員會申報其利益關係的性質及 範疇。 \n\n   - (c) 若會務委員會及執行委員會成員在一項本會訂立的交易、安排或合 約、或建議的交易、安排或合約有實質的利益關係，該成員不可就是 項事務作出投票。 \n\n( 2023 年 7 月) \n\n85\n\n<!-- p.91 -->\n規條 **6.3** 宗教政策 \n\n- 規條 **6.3.1** (a) 總會承認所有宗教，並期望每一位童軍隸屬於某宗教，明暸其對所信 奉宗教的責任。 \n\n   - (b) 總會每一位成員皆須接納及尊重他人的宗教信仰。 \n\n- 規條 **6.3.2** 若旅由不同宗教信仰的成員組成，領袖應鼓勵各成員出席其所屬宗教的聚 會。露營期間舉行的崇拜會應以最簡單的形式進行，並須讓童軍成員 完全 自由參與。 \n\n規條 **6.3.3** 可舉辦童軍崇拜會敬拜神明，以加深童軍成員對童軍誓詞及規律重要性的 理解。惟此類崇拜會只可視為額外的宗教活動，而不能代替成員所信奉宗 教的常規崇拜聚會。 \n\n( 2026 年 9 月) \n\n86\n\n<!-- p.92 -->\n規條 **6.4** 政治活動 \n\n童軍運動不與任何政治團體聯繫。童軍成員在身穿童軍制服時、或以成員 身分，均不可參與任何政治團體集會或活動。 \n\n( 2023 年 7 月) \n\n87\n\n<!-- p.93 -->\n規條 **6.5** 對會方的政策發表意見 \n\n成員除非事前得到香港總監批准，均不能在令人認為他是在代表香港童軍 總會發言的情況下，就會方政策或對任何事情發表意見。 \n\n( 2023 年 7 月) \n\n88\n\n<!-- p.94 -->\n規條 **6.6** \n\n通 訊 \n\n成員除非事前獲得香港總監批准，不可就童軍運動的任何事情，或以成員 身分，與任何本地或海外的政府首長或國家元首、政府部門、領事館或法 律機關、或外國童軍會、或世界童軍祕書處、委員會或會議通訊。 \n\n( 2023 年 7 月) \n\n89\n\n<!-- p.95 -->\n規條 **6.7** 童軍儀式 \n\n於一般童軍活動中，只可進行經批准或載明於本「政策、組織及規條」或 總會典禮儀式手冊內的儀式。 \n\n( 2023 年 7 月) \n\n90\n\n<!-- p.96 -->\n規條 **6.8** 勳章及獎勵 \n\n規條 **6.8.1** 除規條 6.8.6 另有規定外，童軍勳章及獎勵是由總會全權決定頒予成員， 及於特別情況下，頒予對香港童軍運動有傑出貢獻的人士。除非本「政 策、組織及規條」另有陳述，否則所有童軍勳章及獎勵的提名須由以下 人士負責︰ \n\n- (a) 香港總監 \n\n- (b) 副香港總監 \n\n- (c) 助理香港總監 \n\n- (d) 區總監 \n\n- (e) 總幹事 \n\n惟上述人士不能自我提名任何勳章及獎勵。 \n\n規條 **6.8.2** 勳章及獎勵提名錶格可於總會及地域總部索取。 規條 **6.8.3** 英勇獎勵 \n\n英勇嘉獎狀、英勇銅十字章、英勇銀十字章及英勇金十字章乃頒予成員， 以表揚個人或團體方面不同程度的英勇表現。英勇金十字章是英勇獎勵的 最高獎章。所有英勇獎勵皆須由獎勵委員會批准及授予。 \n\n規條 **6.8.4** 功績榮譽獎勵 優良服務獎章、優異服務獎章、功績榮譽獎章及功績榮譽十字章，乃頒予 成年成員，以表揚其長期對童軍運動不同程度的功績服務。功績榮譽十字 章為成年成員最高的功績獎勵。所有功績榮譽獎勵（除優良服務獎章、優 異服務奬章外）皆須由獎勵委員會批准及授予。優良服務獎章及優異服務 獎章則由香港總監批准及授予。 \n\n- 規條 **6.8.5** 卓越服務獎勵 \n\n   - (a) 銅獅勳章、銀獅勳章及金獅勳章，乃頒予領袖及總監，以表揚其持續 對童軍運動有卓越服務。金獅勳章為成年制服成員最高的卓越服務獎 勵。 \n\n   - (b) 青龍勳章、銀龍勳章及金龍勳章，乃頒予會務委員，以表揚其持續對 童軍運動有卓越服務。金龍勳章為會務委員最高的卓越服務獎勵。 \n\n- 規條 **6.8.6** 總領袖可根據獎勵委員會的推薦，批准頒發銅獅勳章、青龍勳章、銀獅勳 章、銀龍勳章、金獅勳章及金龍勳章。 \n\n- 規條 **6.8.7** 特別活動紀念及特殊貢獻徽章 \n\n   - 此等徽章由香港總監全權批准頒發。 \n\n- 規條 **6.8.8** 香港總監嘉許及香港總監高級嘉許 \n\n   - (a) 香港總監嘉許乃授予領袖及總監，以表揚其在某特別活動或任務中有 傑出的表現。此獎項由香港總監全權批准頒發。 \n\n   - (b) 香港總監高級嘉許乃授予總監，以表揚其在獲得香港總監嘉許後對童 軍運動之發展有超卓的表現。此獎項由香港總監全權批准頒發。 \n\n(2023 年 7 月) \n\n91\n\n<!-- p.97 -->\n規條 **6.8.9** 香港總監感謝章 此獎項乃頒予會務委員，以表揚其忠誠的服務。此獎項由香港總監全權批 準頒發。 \n\n### 規條 **6.8.10** 長期服務獎勵 \n\n- (a) 服務段章 \n\n每一服務段章（最多為四段）是頒予於服務實職不少於三年的成年成 員。旅長亦可提名其童軍旅教練員、領袖（除他本人外）及會務委員 獲取此獎勵。 \n\n- (b) 長期服務獎章 \n\n   - 此章乃頒予服務實職年資達十五年的成年成員；此後，每服務滿十年， 可在獎章勳帶上多加一顆星。 \n\n- (c) 儘管有規條 6.8.1 的規定，凡具備資格領取服務段章或長期服務獎章的 成年成員均可向總會申請有關的獎勵；此外，所有區總監、地域總 監及署總監亦獲授權力，代表總會批准服務段章。 \n\n### 規條 **6.8.11** \n\n### 勳 條 \n\n穿制服時，若不佩戴英勇獎勵、功績榮譽獎勵、特殊貢獻及特別活動紀念 徽章、長期服務獎章或卓越服務獎勵等勳章時，可佩戴個別獎勵的特定綬 帶的顏色勳條代替。 \n\n### 規條 **6.8.12** 佩戴方法 \n\n- (a) 金獅勳章、金龍勳章、銀獅勳章、銀龍勳章、銅獅勳章及青龍勳章皆 繫於特定顏色的綬帶掛在頸上。英勇獎勵、其他功績榮譽獎勵、特 別活動紀念及特殊貢獻徽章及長期服務獎章皆佩戴於胸前右邊袋蓋 之上，排列次序如下（由佩戴者之左至右）︰英勇獎勵、功績榮譽 獎勵、特別活動紀念及特殊貢獻徽章、長期服務獎勵。 \n\n- (b) 若佩戴者獲頒多於一個英勇獎勵，只應佩戴最高的英勇獎章。若佩戴 者獲頒多於一項功績榮譽獎勵，只應佩戴最高之功績獎章。若佩戴者 獲頒多於一個卓越服務獎勵，只應佩戴最高的卓越服務獎章。 \n\n- (c) 在某些場合如佩戴勳條而非勳章的話，可佩戴所有獲頒的獎勵及勳章 的勳條，並應佩戴於制服右胸袋袋蓋上方。 \n\n- (d) 繫於一條黃色、紫色及綠色笛繩上的香港總監高級嘉許是佩戴於左邊 肩章之下。繫於一條黃色笛繩上的香港總監嘉許是佩戴於左邊肩章之 下。 \n\n- (e) 香港總監感謝章可佩戴於西服上衣的右邊翻領，而繫於一條紫色繩上 的香港總監感謝章只可佩戴於制服上，掛於頸項，繩末端扣在左胸袋。 \n\n- (f)  若佩戴者獲頒香港總監嘉許及香港總監高級嘉許，只應佩戴香港總監 高級嘉許的笛繩。 \n\n- (g) 服務段章第一段是橫縫於短袖恤衫的左袖摺縫上。第二、三、四段 則應縫於之前獲取的服務段章之上。於長袖恤衫佩戴的位置同上。 \n\n- (h) 頒予旅或童軍單位的英勇獎勵，應繫於旅旗頂上。 \n\n- (i)  除卓越服務獎勵外，當穿著童軍領袖晚禮服及晚宴外衣時，只應佩戴 小型襟章以代替正式勳章。 \n\n(2023 年 7 月) \n\n92\n\n<!-- p.98 -->\n規條 **6.8.13** \n\n### 其他獎勵及勳章 \n\n- (a) 所有列於「可佩戴於童軍制服之獎勵及勳章名單」表一之香港特別行 政區政府頒授，以及所有列於該表的其他認可獎勵及勳章，均可佩戴 於制服左胸袋袋蓋上方。 \n\n- (b) 所有由世界童軍組織或由其任何成員組織頒授的獎勵及勳章（包括勳 條及布章），在提交頒授證明並獲得香港總監批准後，可佩戴於制服 右胸袋袋蓋上方和總會所頒授的獎勵及勳章的右方。 \n\n- (c)   所有其他獎勵及勳章皆須在獲得香港總監批准後，方可佩戴於制服 上。 \n\n勳章及獎勵 \n\n銅獅勳章／銀獅勳章／金獅勳章 \n\n青龍勳章／銀龍勳章／金龍勳章 \n\n功績榮譽獎章／功績榮譽十字章 \n\n( 2024 年 11 月) \n\n93\n\n<!-- p.99 -->\n優良服務獎章／優異服務獎章 \n\n英勇銅十字章／英勇銀十字章／英勇金十字章 \n\n香港總監感謝章／香港總監嘉許／香港總監高級嘉許 \n\n服務段章／長期服務獎章 \n\n( 2023 年7月) \n\n94\n\n<!-- p.100 -->\n## 規條 **6.9** 童軍旗 \n\n規條 **6.9.1** 童軍旅團使用的旗幟須依照總會規定的標準大小，最好掛在頂有童軍徽 的旗杆上。除獲香港總監批准外，旗幟的尺寸均為3呎（91.5釐米）乘4呎 （122釐米）。 \n\n規條 **6.9.2** 各童軍旅團所用的旗幟顏色規定如下： \n\n- (a) 小童軍團 ： \n\n底色為橙色，童軍徽及銘言「準備」以綠色展示於旗上，並可加上 小童軍團名稱及主辦機構名稱的簡寫。 \n\n- (b) 幼童軍團： \n\n底色為黃色，童軍徽及銘言「準備」以綠色展示於旗上，並可加上 幼童軍團名稱及主辦機構名稱的簡寫。 \n\n- (c) 童軍團： \n\n底色為綠色，童軍徽及銘言「準備」以黃色展示於旗上，並可加上 童軍團名稱及主辦機構名稱的簡寫。 \n\n- (d) 深資童軍團： \n\n底色為白色（旗幟的2/3）及啡色（旗幟的1/3），上白下啡；童軍徽 及銘言「準備」以黑色展示於白底色部份；並可加上深資童軍團名 稱及主辦機構名稱的簡寫於啡色部份。 \n\n- (e) 樂行童軍團： \n\n底色為藍色，童軍徽及銘言「準備」以金色展示於旗上，並可加上 樂行童軍團名稱及主辦機構名稱的簡寫。 \n\n- (f) 童軍旅： \n\n可以綠色或旅巾的其中一種顏色作底色，童軍徽及銘言「準備」可 以用相襯的顏色展示於旗上，並可加上旅名稱及主辦機構名稱的簡 寫。 \n\n- (g) 海童軍旅： \n\n底色為藍色，童軍徽及銘言「準備」以白色展示於旗上，並可加上 旅名稱及主辦機構名稱的簡寫。 \n\n- (h) 空童軍旅： \n\n底色為淺藍色，童軍徽及銘言「準備」以黃色展示於旗上，並可加 上旅名稱及主辦機構名稱的簡寫。 \n\n規條 **6.9.3** \n\n總會、地域、區所用之旗幟應依照總會規定的標準大小。除獲香港總監 批准外，旗幟的尺寸為4呎半（137釐米）乘6呎（183釐米）或3呎（91.5 釐米）乘4呎（122釐米）。底色為任何單色，童軍徽及銘言「準備」則 可以用任何相襯的顏色展示於旗上，並可加上單位名稱。 \n\n( 2023 年7月) \n\n95\n\n<!-- p.101 -->\n規條 **6.9.4** 童軍單位所用的旗幟之設計式樣及顏色規格，可向總會索取。 \n\n( 2023 年7月) \n\n96\n\n<!-- p.102 -->\n## 規條 **6.10** 童軍半禮、敬禮及握手 \n\n規條 **6.10.1** 在宣誓或覆誓童軍誓詞、幼童軍誓詞、小童軍誓詞時及在 非穿著童軍制服時作為敬禮，應行童軍半禮（如左圖所 示）。 \n\n規條 **6.10.2** 穿著制服的童軍成員在下列情況下必須進行童軍敬禮（如 左圖所示）： \n\n- (a) 向其他各級穿著制服的童軍人士敬禮。 \n\n- (b) 在升國旗、奏國歌、向持旗者及在喪禮上敬禮。 \n\n規條 **6.10.3** 儘管有規條 6.10.2 的規定，在檢閱儀式及升國旗或童軍旗時，各童軍隊 伍必須立正，並只須由領袖代表敬禮。 \n\n規條 **6.10.4** 除因宗教或文化上的禁忌外，所有童軍皆以左手互相握手。 \n\n( 2023 年 7 月) \n\n97\n\n<!-- p.103 -->\n規條 **6.11** 喪 禮 \n\n為表示哀悼或在參加喪禮時，成年成員可在制服上佩戴闊 10 釐米的黑 布，青少年成員可佩戴闊 5 釐米的黑布，戴於在左臂上。 \n\n( 2023 年 7 月) \n\n98\n\n<!-- p.104 -->\n規條 **6.12** 銓釋及修訂 規條 **6.12.1** 銓 釋 本「政策、組織及規條」內的用字及措辭之銓釋權屬於總會執行委員會。 \n\n規條 **6.12.2** 修 訂 本「政策、組織及規條」的內容可由總會執行委員會以簡單多數制的方法 進行修訂。 \n\n( 2023 年 7 月) \n\n99\n\n<!-- p.105 -->\n- 規條 **6.13** 兩種語文本的「政策、組織及規條」的釋疑 規條 **6.13.1** 本「政策、組織及規條」的中文本和英文本同等真確，銓釋「政策、組織 及規條」須以此為依據。 \n\n- 規條 **6.13.2** 本「政策、組織及規條」的兩種真確本所載規條，均推定為具有同等意義。 \n\n- 規條 **6.13.3** 凡「政策、組織及規條」的兩種真確本在比較之下，出現意義分歧而不能 解決，則須交由總會執行委員會作銓釋及作所需的修訂。 \n\n( 2023 年 7 月) \n\n100\n","02_支部訓練綱要/(Chi)Cub Scout Section Training Scheme_20260809.md":"---\nsource_file: \"(Chi)Cub Scout Section Training Scheme_20260809.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 85\npages_ocr: 4\nocr_avg_score: 0.923\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\n0\n\n香 | 港\n\nHONGKONG\n\n幼童軍訓要\n\n港\n\n香港童軍總會 SCOUT ASSOCIATION OF HONG KONG 一九九七年：第一版二零二六年：第十版\n\n<!-- p.2 -->\n# 序 \n\n幼童軍支部在童軍運動中承擔承前啟後的重要角色。6 至 11 歲的兒童正值學習能力迅速發展、價值 觀逐步形成的階段，適合透過有系統而富趣味的活動，培養良好的學習態度、生活習慣及初步的責 任感。此階段亦是建立羣體意識及自我規範能力的重要時期。 \n\n童軍運動強調從做中學習。幼童軍支部以「多元活動．探索求知」為核心理念，透過寓學習於遊戲 的方式，引導幼童軍主動探索周遭世界，在活動中學習童軍技能、生活知識及與人相處之道，並逐 步建立合作精神、關懷他人及服務社會的意識。學習內容既重視趣味性，亦兼顧教育意義與價值培 育。 \n\n本次修訂的訓練綱要，引入一套嶄新的進度性獎章及活動徽章制度，讓訓練內容更具層次與方向。 幼童軍可按個人能力與興趣，循序漸進地參與不同範疇的學習與體驗，從而建立持續學習與自我提 升的動力。訓練綱要同時鼓勵多嘗試、多體驗，避免單一發展取向。 \n\n新訓練綱要亦特別加強幼童軍支部與童軍支部之間的銜接，透過核心技能培養、態度建立及小組合 作模式，協助幼童軍逐步適應更高自主度及責任感的學習階段，為進入童軍支部作好準備。讓成員 在轉換支部時能自然過渡，保持學習連貫性。 \n\n本人謹向支部訓練檢討工作小組及各位參與修訂工作的領袖致以衷心謝意，感謝他們為幼童軍支部 未來發展所作出的努力與貢獻。期望幼童軍在領袖的悉心引導下，保持好奇、勇於探索，在多元而 愉快的童軍生活中成長，奠定穩固而正面的成長基礎。 \n\n青少年活動總監 陳狄安 \n\n2026 年 2 月 \n\n1\n\n<!-- p.3 -->\n# 前言 \n\n自一九九七年十二月第一版《幼童軍手冊》推行以來，幼童軍訓練框架沿用至今已屆二十八年。面 對社會瞬息萬變，這二十多年間，社會各個層面均經歷了深刻轉變，兒童的成長環境、學習模式及 發展需要亦隨之演變。為使幼童軍訓練能與時並進，更有效地配合現今幼童軍支部所屬年齡層成員 的身心發展需要，我們有必要對現行幼童軍訓練綱要內容作出全面修訂。 \n\n本次修訂乃由「支部訓練檢討委員會」推動，並在修訂過程中與各地域進行深入探討，同時徵詢 「青年事務諮議會」的寶貴意見。在廣納各方建議的基礎上，新修訂的訓練框架重申幼童軍支部的 核心特色為「多元活動 · 探索求知」，並繼續以幼童軍規律與誓詞為本，設計既具系統性又富趣味的 進度性訓練，讓成員在愉快的學習環境中培養良好品格、生活技能及團隊精神，從而達致幼童軍支 部的培育目標。 \n\n新版《幼童軍訓練綱要》正是基於上述訓練理念與支部發展方向而制定，期望透過多元而有意義的 活動，引導幼童軍主動探索、樂於學習，建立自信與責任感，為日後在童軍運動中的持續成長奠定 穩固基礎。 \n\n最後，本人謹代表香港童軍總會，衷心感謝所有參與修訂及編制《幼童軍手冊》及《幼童軍訓練綱 要》的人士，感謝他們不辭勞苦、善用寶貴時間，提供專業意見並參與資料輯錄及校對工作，使新 訓練綱要得以順利完成。 \n\n總部總監（幼童軍） 助理總部總監（幼童軍） 林  煒 李海權 \n\n2026 年 2 月 \n\n2\n\n<!-- p.4 -->\n# 目錄 \n\n|內容|頁碼|\n|---|---|\n|序**PREFACE**|1|\n|前言**FOREWORD**|2|\n|目錄**CONTENTS**|3|\n|引言**INTRODUCTION**|4|\n|第一章 – 幼童軍支部的組織及規條<br>**CHAPTER 1: ORGANIZATION AND RULES OF CUB SCOUT SECTION**|5|\n|第二章 – 幼童軍支部的訓練計劃||\n|-<br>進度性獎章考驗程序FLOW CHART OF PROGRESSIVE BADGES|8|\n|-<br>會員章|13|\n|-<br>幼童軍體驗章|14|\n|-<br>幼童軍歷奇章|16|\n|-<br>幼童軍高級歷奇章|18|\n|-<br>金紫荊獎章|20|\n|-<br>乙部「興趣範疇」課程內容|23|\n|第三章 – 活動徽章及其他徽章|25|\n|第四章 –各級徽章評核及簽發程序|71|\n|第五章 –典禮與儀式|73|\n|附錄||\n|-<br>附錄一：會員章 – 保護童軍成員免受傷害|76|\n|-<br>附錄二：幼童軍郊野守則|77|\n|-<br>附錄三：童軍支部「童軍探索獎章」與幼童軍支部各級徽章豁免考驗<br>安排|79|\n|-<br>附錄四：幼童軍活動指引|80|\n|-<br>附錄五：森林故事|81|\n|-<br>附錄六：香港總監挑戰盾|83|\n|鳴謝|84|\n\n3\n\n<!-- p.5 -->\n# 引言 \n\n《幼童軍訓練綱要》為幼童軍支部訓練正式手冊，綱要內詳述幼童軍的訓練課程、支部各個獎章的 考驗範圍及應達到的水平。 \n\n綱要重新規劃會員章及四個進度性獎章的內容，進度性獎章分別為「幼童軍體驗章」、「幼童軍歷 奇章」、「幼童軍高級歷奇章」及「金紫荊獎章」。其課程內容以七個學習範疇劃分，包括「童軍 技能」、「關己愛人」、「國家與社區」、「童軍家庭」、「多元創藝」、「科學與大自然」及 「運動與愛好」。七個學習範疇貫穿四個進度性獎章，讓成員在整個幼童軍年齡中溫故知新。 \n\n七個學習範疇中「童軍技能」、「關己愛人」、「國家與社區」及「童軍家庭」屬「核心範疇」， 完成每項「核心範疇」，則可獲發該階段指定的「核心範疇」章；「多元創藝」、「科學與大自然」 及「運動與愛好」屬「興趣範疇」，「興趣範疇」著重多元化，成員及領袖可從該範疇列表中，選 取合適的活動徽章進行。。 \n\n綱要日後如有任何更新或修訂，青少年活動署將會通過香港童軍總會網頁公佈，俾眾週知。 \n\n4\n\n<!-- p.6 -->\n# 第一章 – 幼童軍支部的組織及規條 \n\n(一) 目的 \n\n幼童軍支部旨在促進幼童軍年齡的少年身心與精神的陶冶及啟發，乃是第一個支部開始有進度 性訓練，亦是貫徹整個童軍運動五個支部連續性訓練計劃的一部分。 幼童軍支部成員正處於好奇心旺盛、喜愛探索、以體驗式學習為主的成長階段，學習多透過實 際參與、遊戲及模仿而進行。有見及此，幼童軍支部的教育目標訂為「多元活動・探索求知」， 透過提供多元而富啟發性的活動，培養成員主動探索及樂於學習的精神。 透過團集會活動、小組學習及訓練，幼童軍學習基本的童軍及生活技能，鍛煉強健體魄，並逐 步學懂自律及照顧自己；同時，透過團體遊戲和羣體活動，體驗團隊合作精神，學習關懷別人 及培養責任感；此外，藉着多元活動，成員得以發掘不同興趣，學習新技能，從而發展潛能及 培養創造力。 \n\n(二) 方法 \n\n幼童軍在成年人領導下，以幼童軍規律與誓詞為本，給與歡愉而富吸引力的進度性訓練，以達 成支部目的。 \n\n(三) 幼童軍誓詞 \n\n我願盡所能； 對神明，對國家，盡責任； 對別人，要幫助； 對規律，必遵行。 \n\n(四) 幼童軍規律 幼童軍，盡所能， 先顧別人才顧己， 日行一善富精神。 \n\n(五) 童軍銘言 準備 \n\n(六) 年齡規限 幼童軍支部的年齡規限是由 6 歲至 11 歲。 於年滿 12 歲當日，其幼童軍身分將自動結束。 \n\n(七) 幼童軍團的最低應有標準 \n\n1. 人數 \n\n一已成立的幼童軍團，最少要有幼童軍十二名。 \n\n2. 領袖 \n\n   - 一幼童軍團最少要有兩名領袖，其中一名必須持有領袖委任書。此外，其中一名領袖的性別 必須與該團成員相同。如團內有男及女成員，則必須有男及女領袖。 \n\n3. 訓練 幼童軍的活動與訓練，必須遵照總會出版的「幼童軍訓練綱要」及所頒佈的任何有關修訂文 件，並確保每年最少舉行一次為期一天的全團遠足旅行。 \n\n4. 進度 每年最少有四份一團員考獲較高一級的幼童軍進度性獎章。 \n\n5\n\n<!-- p.7 -->\n- (八) 幼童軍團內部組織及功能 \n\n   1. 團長 \n\n      - a. 年齡規限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n   2. 副團長 \n\na. 年齡規限：最低年齡為十八歲，並須於六十五歲生日當日退休。 \n\n- (九) 領袖的職責及要求 \n\n   1. 團長 \n\n      - a. 職責：在旅長督導下及在幼童軍副團長及教練員的協助下，幼童軍團長負責幼童軍團內 的青少年活動與訓練事宜。 \n\n   2. 副團長 \n\n      - a. 職責：幼童軍副團長的職責由幼童軍團長決定。幼童軍團長於訂定其職責時，須以能啟 發其領導才為主。 \n\n#### (十) 預期成果 \n\n期望成員在參與多元而精彩的活動與訓練過程中，獲得啟發與成長，邁向成為有責任感、關心 社會的良好公民。 \n\n#### (十一) 制服 \n\n#### 男團員 \n\n|帽|綠色、黃間條、鴨舌帽(連帽章)|\n|---|---|\n|恤衫|杏色、短袖、兩胸袋、無褶、肩帶|\n|短褲|草青色、兩斜袋、兩後袋、有褶|\n|皮帶|棕色(連童軍徽皮帶扣)|\n|長襪|深草青色、直坑紋、襪頭摺下|\n|皮鞋|黑色、無花紋、縛帶、低筒、平底|\n|領巾|旅巾(連顏色巾圈)|\n\n6\n\n<!-- p.8 -->\n|女團員||\n|---|---|\n|帽|綠色、圓形、有邊、後面蝴蝶結(連帽章)|\n|恤衫|杏色、短袖、兩胸袋、無褶、肩帶|\n|短褲|草青色、側袋、弓字褶|\n|皮帶|棕色(連童軍徽皮帶扣)|\n|長襪|深草青色、直坑紋、襪頭摺下|\n|皮鞋|黑色、無花紋、縛帶、低筒、平底|\n|領巾|旅巾(連顏色巾圈)|\n\n#### 制服標誌及徽章佩戴 \n\n如成員於過渡期或之前已考獲舊制的幼童軍活動徽章，可同時並列於左袖並釘左下方位置，直至晉 升童軍團。 \n\n7\n\n<!-- p.9 -->\n# 第二章 – 幼童軍支部的訓練計劃 進度性獎章考驗程序 \n\n## 內容大綱 \n\n幼童軍訓練綱要共設七個學習範疇，包括「童軍技能」、「關己愛人」、「國家與社區」、「童軍 家庭」、「多元創藝」、「科學與大自然」及「運動與愛好」。 \n\n「童軍技能」、「關己愛人」、「國家與社區」及「童軍家庭」屬「核心範疇」，完成每項「核心 範疇」，則可獲發該階段指定的「核心範疇」章；「多元創藝」、「科學與大自然」及「運動與愛 好」屬「興趣範疇」，「興趣範疇」著重多元化，成員及領袖可從該範疇列表中，選取合適的活動 徽章進行。七個學習範疇貫穿四個進度性獎章，目的讓成員在整個幼童軍生涯中溫故知新。 \n\n#### 童軍技能 \n\n培養幼童軍掌握基本童軍技能，包括結繩、地圖閱讀、遠足、露營等方面，讓他們在冒險與探索中 建立自信與責任感，並學會處理實際生活中的挑戰。 \n\n#### 關己愛人 \n\n培養幼童軍具備身心健康的生活態度、安全意識與基本急救知識，同時發展同理心與助人精神，學 習在家庭、團隊及社區中履行責任、主動服務，成為有關愛心和責任感的小公民。 \n\n#### 國家與社區 \n\n讓幼童軍瞭解國家歷史、文化及社會架構，並認識社區中的不同角色和服務，學習成為負責任的公 民，積極參與社區活動，培養對國家及社區的歸屬感與承擔精神。 \n\n#### 童軍家庭 \n\n讓幼童軍認識自己所屬的童軍單位，明白童軍精神與其價值。同時認識森林故事，瞭解其象徵意義 和儀式之由來，深化童軍文化的認同感；並鼓勵成員在團隊中建立友愛互助的關係，學習遵守誓詞 與規律，從中培養責任感、紀律及團隊精神，成為童軍家庭中積極一員。 \n\n#### 多元創藝 \n\n啟發幼童軍的創造力與藝術潛能，透過繪畫、音樂、戲劇、手工藝等多元媒介表達自我，培養審美 能力與創意思維，鼓勵自由表達與欣賞多元文化。 \n\n#### 科學與大自然 \n\n引導幼童軍透過觀察、實驗與探索，認識大自然及基本科學原理，培養動手能力及批判思維，並學 會尊重和保護環境，建立愛護地球的責任感。 \n\n#### 運動與愛好 \n\n鼓勵幼童軍參與多元化的體育活動與個人興趣發展，促進身心健康，增強體能與協調能力，同時從 中發掘個人潛能和興趣，培養堅毅、紀律與正向生活態度。 \n\n8\n\n<!-- p.10 -->\n## 流程 \n\n進度性獎章考驗的所有項目必須在完成會員章後開始，並於十二歲生日前完成。各進度性獎章應按 階段完成，即成員應由「幼童軍歷奇章」開始進行考驗，完成整階段後方開始考取下一階段，惟成 員亦可選擇在完成每階段的「核心範疇」，開始考取下一階段的進度性獎章。 \n\n如成員在八歲或以後方始加入幼童軍支部，當考獲會員章及完成「幼童軍體驗章」、「幼童軍歷奇 章」及/或「幼童軍高級歷奇章」內「核心範疇」，可開始進行「幼童軍高級歷奇章」及/或「金紫荊 獎章」考驗。 \n\n<!-- Start of picture text -->\n會員章<br>．初步接觸童軍運動<br>．建議約 2  至 3  個月完成<br>金紫荊獎章<br>．服務與領導<br>・建議約 15 至 18 個月完成<br>幼童軍高級歷奇章<br>．技能深化<br>・建議約 15 至 18 個月完成<br>幼童軍歷奇章<br>．實踐與行動<br>・ 建議約 15 至 18 個月完成<br>幼童軍體驗章<br>．體驗與認識<br>・建議約12至15個月完成<br><!-- End of picture text -->\n\n9\n\n<!-- p.11 ocr -->\n10\n\n幼童軍支部\n\n多元活動·探索求知\n\n小童軍音團/ | 會員章\n| --- | --- |\n新成員加入 | 入團後，建2-3個月內完成。\n\n幼童軍體章第一個進度性章適合年滿6而考獲會員章之成員完成小童軍支部「小草章」的成員，晉升幼童軍團後可獲頒發約12-15個月完成\n\n幼童軍歷奇章第二個進度性章適合已考獲「幼童軍體章」或年滿7.5而考獲會員章，及完成「幼童軍體章」內「核心」指定內容之成員約15-18個月完成\n\n幼童軍高級歷奇章 | 光\n\n第三個進度性章適合已考獲「幼童軍歷奇章」或年滿9而考獲會員章，及完成「幼童軍體驗章」及「幼童軍歷奇章」內「核心」指定內容之成員約15-18個月完成\n\n金紫荊章支部最高榮響章適合已考獲「幼童軍高級歷奇章」或年滿10而考獲會員章，及完成「幼童軍體章」、「幼童軍歷奇章」及「幼童軍高級歷奇章」內「核心」指定內容之成員約15-18個月完成\n\n晉升童軍團\n\n核心 | 興趣\n\n嚼*\n\n童軍家庭 | 國家與社區 | 關己愛人 | 童軍技能 | 科學與大自然 | 多元創藝 | 運動與愛好\n\n*在每個段選其中兩個，每個完成一個活動徽章\n\n<!-- p.12 ocr -->\n11\n\n核心\n\n國家與社區 | 關己愛人 | 童軍家庭 | 童軍技能\n\n運動與愛好 | 多元創藝 | 科學與大自然\n\n興趣\n\n11\n\n<!-- p.13 -->\n## 幼童軍進度性獎章 — 內容概覽 \n\n|||幼童軍體驗章<br>#|幼童軍歷奇章|幼童軍高級歷奇章|金紫荊獎章|\n|---|---|---|---|---|---|\n||(1)<br>童軍<br>技能|1.1.1 感官自然探索<br>1.1.2 揹包自理*<br>1.1.3 天氣觀察*|2.1.1 追蹤<br>2.1.2 繩結*<br>2.1.3 郊野守則*|3.1.1 繩結*<br>3.1.2 認識地圖及指南針*<br>3.1.3 遠足*<br>3.1.4 度假營或露營|4.1.1 生火及原野烹飪<br>4.1.2 繩結及紮作<br>4.1.3 露營<br>4.1.4 認識地圖及指南針<br>4.1.5遠足|\n|核<br>心<br>|(2)<br>關己<br>愛人|1.2.1 生活規律<br>1.2.2 小幫手任務<br>1.2.3 健康點心盒|2.2.1 保持身體健康<br>#<br>2.2.2 儀容整潔<br>#<br>2.2.3 認識家居安全<br>#<br>2.2.4 日行一善*<br>2.2.5 護理和救傷及保護<br>自己|3.2.1 保持身體良好狀態<br>3.2.2 護理傷者*<br>3.2.3 特別行善*<br>3.2.4 保護自己*<br>3.2.5 安全知識|4.2.1 急救知識<br>4.2.2 特別行善<br>4.2.3 協助團長及領袖<br>4.2.4 認識情緒<br>4.2.5 關愛社羣|\n|範<br>疇|(3)<br>國家與<br>社區|1.3.1 我的社區地圖<br>1.3.2 社區體驗<br>1.3.3 中國節日與由來|2.3.1 香港與國家關係*<br>2.3.2 國旗、國徽、國<br>歌、區旗、區徽*<br>2.3.3 升旗與國歌的禮儀*<br>2.3.4 認識中式隊列*<br>2.3.5 認識社區<br>#|3.3.1 國民身份的基本認<br>識*<br>3.3.2 社區設施<br>3.3.3 學校與旅團<br>3.3.4 宗教地點與博物館<br>3.3.5 中華文化<br>3.3.6中式隊列*|4.3.1 國家與守法責任<br>4.3.2 社區緊急服務設施<br>4.3.3 童軍區會與總部<br>4.3.4 香港古蹟與文物<br>4.3.5 中式隊列|\n||(4)<br>童軍<br>家庭|1.4.1 認識小隊合作<br>1.4.2 旅巾與徽章小觀察*<br>1.4.3 團呼動作與隊形*|2.4.1 認識童軍家庭*<br>2.4.2 森林故事*<br>2.4.3 誓詞和規律|3.4.1 認識童軍家庭*<br>3.4.2 森林舞蹈*<br>3.4.3 誓詞和規律|4.4.1 認識童軍家庭<br>4.4.2 誓詞和規律|\n|興<br>趣<br>範<br>疇|(5)<br>多元<br>創藝<br>(6)<br>科學與<br>大自然<br>(7)<br>運動與<br>愛好||選擇其中兩個範疇<br>每個範疇完成一個活動<br>徽章|選擇其中兩個範疇<br>每個範疇完成一個活動<br>徽章|選擇其中兩個範疇<br>每個範疇完成一個活動<br>徽章|\n\n- *號項目是為中途加入的幼童軍而設的必修基礎課程，所有幼童軍必須先完成該項內容，方可以開展該年齡 組別的進度性獎章考驗。 \n\n> # 如成員於小童軍階段時已獲得「小草蜢章」，「幼童軍歷奇章」帶有#號之內容可獲豁免，由幼童軍團長直接 簽核。 \n\n12\n\n<!-- p.14 -->\n# 會員章 \n\n即世界童軍會員章。 旨在幫助新加入的成員對幼童軍活動有基本的認識，建議在入團 後兩至三個月內完成。 \n\n完成下列各項： \n\na. 瞭解童軍運動的起源 i. 知道貝登堡勳爵的生平。 ii. 知道貝登堡勳爵在白浪島與青少年的第一次實驗露營。 b. 認識童軍家庭 i. 香港童軍運動共有 5 個支部。 ii. 分辨旅團領袖的肩章。 c. 誓詞、規律和銘言 i. 說出幼童軍誓詞和規律。 ii. 在日常生活中實踐誓詞和規律。 d. 認識幼童軍徽章 i. 認識幼童軍進度性獎章。 ii. 認識幼童軍活動徽章。 e. 森林故事 i. 知道毛吉利加入狼羣的故事。 ii. 知道森林故事中其他人物（動物）的名稱。 f. 口號和手號 認識下列口號及手號，並能迅速地作出相應動作。 i. 立正 (Alert) ii. 休息 (At Ease) iii. 集隊 (Fall In) iv. 解散 (Fall Out, Dismiss) v. 幼童軍團 (Pack) g. 禮儀 i. 敬禮：認識下列各種敬禮方式、何時使用及正確的方法及手勢。 a. 全禮 b. 半禮 c. 握手禮 d. 注目禮 ii. 團呼：懂得團呼的正確方法及口號，參與團呼及排練。 iii. 展旗：知道展旗的意義、程序及參與幼童軍團展旗儀式。 iv. 宣誓：知道宣誓的意義，參與宣誓儀式的排練。 v. 制服：知道幼童軍制服的正確式樣及各種徽章的正確縫製位置。 h. 認識所屬旅團 知道自己童軍旅的旅號、所屬區、地域及主辦機構。 i. 保護童軍成員免受傷害 認識基本措施去保護自己及夥伴免受傷害。 (相關內容詳見附件一) \n\n13\n\n<!-- p.15 -->\n# 幼童軍體驗章 \n\n此為幼童軍支部第一個進度性獎章，適合年滿六歲而考獲會員章 之成員。 \n\n如成員於小童軍階段已獲得「小草蜢章」，可以在完成會員章後 直接獲得此章。 \n\n*號項目是為中途加入的幼童軍而設的必修基礎課程，所有幼童 軍必須先完成該內容，之後纔可以開展該年齡組別的進度性獎章 課程。 \n\n完成下列各項： \n\n#### （1） 童軍技能 \n\n- 1.1.1 感官自然探索 \n\n   - a. 在校園或公園以視覺及聽覺完成一次「感官探索之旅」（看見3 樣事物及聽見2 種聲 音） \n\n   - b. 說出一項在自然環境中應遵守的安全行為，以及一項不應做的危險行為（如不奔跑、 不攀爬、與成人同行） \n\n- 1.1.2 揹包自理* \n\n   - a. 認識活動日應自備的3 樣個人物品（如水、手巾、帽）及其用途 \n\n   - b. 於活動前後自行檢點及收拾物品，保持整潔 \n\n   - c. 說出一項保護個人物品的小貼士（如貼姓名、分類收納） \n\n- 1.1.3 天氣觀察* \n\n   - a. 辨識當日天氣（晴、雨、多雲、炎熱、清涼）並選擇合適衣物／配件，說出理由 \n\n   - b. 繪畫「我的活動日穿著圖」 \n\n   - c. 說出天氣轉變時的一項備用安排（如備傘、補水、穿外套） \n\n#### （2） 關己愛人 \n\n- 1.2.1 生活規律 \n\n- a. 製作「一天日程表」，內容包括起牀、上學、活動、休息及睡覺 \n\n- b. 說出兩個令自己更有精神的好習慣，如早睡及喫早餐等 \n\n- c. 一週後簡短分享實踐情況 \n\n- 1.2.2 小幫手任務 \n\n- a. 連續一週在家／學校完成3 次簡單幫手任務，如整理書包、分類回收或遞送物資等 \n\n- 說出在幫手時需注意的一項安全或禮貌，例如：先徵求同意、留意自身安全，或說「謝謝」 1.2.3 健康點心盒 \n\n- a. 設計及準備一次適合活動日用的點心盒，包括飲用水及至少一項健康食物 \n\n- b. 說出選擇該食物的原因，如補充能量或補充水分等 \n\n- c. 明白準備食物前清潔手部與用具的重要性 \n\n#### （3） 國家與社區 \n\n1.3.1 我的社區地圖 \n\n- a. 在地圖上標示家、學校／旅部及公園三個地點 \n\n- b. 說出一條常用路線或交通方式 \n\n- c. 分享一項在社區行走的應有的禮貌或及安全注意事項（如安靜排隊、在走廊慢行） \n\n- 1.3.2 社區體驗 \n\n- a. 參觀一個社區設施（如公園、圖書館、運動場或回收點） \n\n- b. 說出一項愛護公共設施的做法（如垃圾入桶及按規則使用） \n\n14\n\n<!-- p.16 -->\n#### 1.3.3 中國節日與由來 \n\n- a. 選一個中國傳統或本地節慶（如中秋、端午、新春或重陽等），以圖畫或手作紀錄其食 物或習俗一項 \n\n- b. 分享家庭在該節日的一個做法或回憶 \n\n說出在慶祝時需要注意的一項安全或禮儀，例如：注意人羣安全、不推擠，或保持禮貌、不 喧嘩 \n\n- （4） 童軍家庭 \n\n   - 1.4.1 認識小隊合作 \n\n   - a. 進行兩個合作小遊戲，能說出一條「我們的遊戲約定」（如輪流、聆聽、互助） b. 在遊戲後讚賞或鼓勵隊友各一次 \n\n   - c. 分享一次與同伴解決小分歧的方法 \n\n   - 1.4.2 旅巾與徽章小觀察* \n\n   - a. 觀察並指出領袖或成員身上兩個不同標誌或裝備 \n\n   - b. 提出一條關於童軍活動的問題，並記錄得到的回答 \n\n   - c. 繪畫自己最想嘗試的一項童軍活動圖畫 \n\n   - 1.4.3 團呼動作與隊形* \n\n   - a. 在領袖帶領下練習團呼、口號與手號時應有的反應及動作 \n\n   - b. 能在領袖口令下快速完成集合及其相關動作 \n\n15\n\n<!-- p.17 -->\n# 幼童軍歷奇章 \n\n此為幼童軍支部第二個進度性獎章，適合已考獲「幼童軍體驗 章」或年滿七歲半而考獲會員章，及完成「幼童軍體驗章」內 「核心範疇」指定內容之幼童軍成員。 \n\n*號項目是為中途加入的幼童軍而設的必修基礎課程，所有幼童 軍必須先完成該內容，之後纔可以開展該年齡組別的進度性獎章 課程。 \n\n如成員於小童軍階段時已獲得「小草蜢章」，「幼童軍歷奇章」帶 有#號之內容可獲豁免，由幼童軍團長直接簽核。 \n\n完成下列各項： \n\n#### 甲、核心範疇 \n\n（1） 童軍技能（初級） \n\n- 2.1.1 追蹤 \n\n   - c. 認識追蹤符號 \n\n   - d. 跟隨一些追蹤符號作一次追蹤活動 \n\ne. 繪製一個追蹤符號的圖表或利用天然物資製作一個追蹤符號的模型 2.1.2 繩結* \n\n完成後可獲取 童軍技能章（初級） \n\na. 認識以下結繩方法及其用途 \n\n- i. 反手結 \n\n- ii. 平結 \n\n2.1.3 郊野守則* \n\n- a. 認識及遵守幼童軍郊野守則 \n\n- b. 實踐童軍活動的郊野守則 \n\n- c. 宣揚遵守郊野守則的重要性 \n\n- d. 到郊野公園去進行一次活動 \n\n- e. 認識郊野公園的設施 \n\n#### （2） 關己愛人（初級） \n\n2.2.1 保持身體健康# \n\na. 懂得作息時間 \n\nb. 適當的運動 \n\n2.2.2 儀容整潔# \n\n- a. 懂得個人衛生的重要性。例如洗潄、沐浴等 \n\n- b. 懂得穿著整齊及清潔的衣服/制服 \n\n完成後可獲取 關己愛人章（初級） \n\n- c. 懂得將污衣放入污衣籃及清洗 \n\n2.2.3 認識家居安全# \n\n- a. 懂得在外出時，緊記將門窗關閉 \n\nb. 懂得在外出時，檢查爐火是否已關閉 \n\n- 2.2.4 日行一善* \n\n完成「家務章」或完成以下內容 \n\n- a. 佈置飯桌及懂得進膳時之禮儀 \n\n- b. 協助收晾衣服 \n\n- c. 整理睡牀 \n\n- d. 清潔及整理一間房間 \n\n16\n\n<!-- p.18 -->\n#### 2.2.5 護理和救傷及保護自己 \n\n- a. 懂得簡單的護理和救傷常識，包括清理和包紮小傷口 \n\n#### （3） 國家與社區（初級） \n\n- 2.3.1 香港與國家關係* \n\na. 認識香港是中國的一部分及地理位置 \n\n- 2.3.2 國旗、國徽、國歌、區旗、區徽* \n\n   - a. 認識國家的國旗、國徽及國歌、區旗、區徽 \n\n- 2.3.3 升旗與國歌的禮儀* \n\n   - a. 認識升旗儀式和學習當國歌奏起時表現莊嚴和尊重的態度 \n\n完成後可獲取 國家與社區章（初級） \n\n- b. 出席一次升國旗儀式 \n\n1 \n\n- 2.3.4 認識中式隊列* \n\n   - a. 認識及體驗中式隊列的基本動作，包括立正、敬禮、集合及解散 \n\n- 2.3.5 認識社區# \n\n   - a. 認識居住社區名稱及地理位置 \n\n#### （4） 童軍家庭（初級） \n\n2.4.1 認識童軍家庭* \n\n   - a. 簡介各支部所接納的成員之不同及相同的地方 \n\n   - b. 參與一次所屬童軍旅或童軍區舉辦之活動 \n\n- 2.4.2 森林故事* \n\n   - a. 說出毛吉利加入狼羣後在森林生活的故事 \n\n   - b. 知道團呼的意義 \n\n完成後可獲取 童軍家庭章（初級） \n\n- 2.4.3 誓詞和規律 \n\n   - a. 知道幼童軍誓詞和規律的意義 \n\n   - b. 向領袖闡述他／她在日常生活中所實踐誓詞和規律的逸事 \n\n#### 乙、興趣範疇 \n\n成員可於（5）多元創藝、（6）科學與大自然及（7）運動與愛好中選擇其中兩個範疇，每個範疇必 須完成至少一個活動徽章。 \n\n註1：有關隊列內容，請參閱青少年活動署所發出之「隊列和升掛國旗及區旗指引（2024 年 6 月版 本）」，網址為 https://www.scout.org.hk/uploads/tc/circulars/16450/guidelines-of-chinese-foot-drill-andnational-flag-and-regional-flag-raising.pdf \n\n17\n\n<!-- p.19 -->\n# 幼童軍高級歷奇章 \n\n此為幼童軍支部第三個進度性獎章，適合已考獲「幼童軍歷奇 章」或年滿九歲而考獲會員章，及完成「幼童軍體驗章」及「幼 童軍歷奇章」內「核心範疇」指定內容之幼童軍成員。 \n\n*號項目是為中途加入的幼童軍而設的必修基礎課程，所有幼童 軍必須先完成該內容，之後纔可以開展該年齡組別的進度性獎章 課程。 \n\n完成下列各項： \n\n甲、核心範疇 \n\n（1） 童軍技能（中級） \n\n3.1.1 繩結* \n\n- a. 認識以下結繩方法及其用途 \n\ni. 接繩結 ii. 繫木結 iii. 雙套結 iv. 稱人結 \n\n完成後可獲取 童軍技能章（中級） \n\nv. 曳木結 \n\nvi. 收繩 \n\n3.1.2 認識地圖及指南針* \n\n- a. 認識十個圖例，並在地圖中找出那些圖例 \n\n- b. 認識比例 \n\n- c. 在地圖上找出一些圖例，然後在畫冊上繪出（或貼上照片）那圖例代表的東西 d. 利用指南針說出某些建築物或特定物件的位置 \n\n- e. 利用指南針指出十六個方位 \n\n3.1.3 遠足* \n\n   - a. 瞭解遠足前要做的準備工作 \n\n   - b. 在領袖或其他成年人陪同下完成一段不少於三公里自然教育徑或家樂徑 \n\n- 3.1.4 度假營或露營 \n\n- （必須在露營或度假營中選取一項或兩項均參與） \n\n   - a. 認識收拾背囊的方法，並自行收拾一個度宿的背囊 \n\nb. 參與一次不少於兩日一夜度假營或露營 \n\n   - c. 能遵守營地的規則，並能在活動中注意安全 \n\n- （2） 關己愛人（中級） \n\n3.2.1 保持身體良好狀態 \n\na. 認識有益的食物 \n\nb. 懂得在日常生活中能照顧自己 \n\n3.2.2 護理傷者* \n\n- a. 知道如何處理：流鼻血、割傷或擦傷、燒傷或燙傷 \n\nb. 懂得在受傷時尋求成年人幫助 \n\n完成後可獲取 關己愛人章（中級） \n\n3.2.3 特別行善* \n\n- a. 協助領袖處理團務 \n\n- b. 參與一次義工活動，例如：賣旗活動、探訪服務或協
