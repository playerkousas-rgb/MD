助攤位活動 \n\n18\n\n<!-- p.20 -->\n- 3.2.4 保護自己* \n\n   - a. 完成「保護兒童章」 \n\n- 3.2.5 安全知識 \n\n   - a. 完成下列其中一個活動徽章 \n\n      - i. 水上安全章 ii. 道路安全章 \n\n#### （3） 國家與社區（中級） \n\n- 3.3.1 國民身份的基本認識* \n\n   - a. 認識何謂？「國民身份認同」 \n\n- 3.3.2 社區設施 \n\n   - a. 認識十種居住社區之周邊設施及交通設施 \n\n- 3.3.3 學校與旅團 \n\n   - a. 認識學校及旅團的地理位置及周邊設施 \n\n完成後可獲取 國家與社區章（中級） \n\n3.3.4 宗教地點與博物館 \n\n- a. 認識區內的宗教建築物及／或博物館 \n\n3.3.5 中華文化 \n\n   - a. 認識一項中華文化，例如：二十四節氣、飲食文化、傳統習俗等等 \n\n- 3.3.6 中式隊列*1 \n\n   - a. 懂得中式隊列基本動作，包括：立正、敬禮、集合及解散 \n\n   - b. 懂得升國旗時應有的禮儀及儀式 \n\n#### （4） 童軍家庭（中級） \n\n3.4.1 認識童軍家庭* \n\n- a. 明瞭幼童軍團內隊長及副隊長職責及工作 \n\n- b. 參與一次童軍區或地域所舉辦之活動 \n\n3.4.2 森林舞蹈* \n\n- a. 重溫森林故事 \n\n- b. 跳一隻森林舞蹈 \n\n完成後可獲取 童軍家庭章（中級） \n\n3.4.3 誓詞和規律 \n\n- a. 知道童軍銘言及其意義 \n\n- b. 製作一本紀錄冊，紀錄一週內做過的事如何實踐誓詞和規律 \n\n#### 乙、興趣範疇 \n\n成員可於（5）多元創藝、（6）科學與大自然及（7）運動與愛好中選擇其中兩個範疇，每個範疇必 須完成至少一個活動徽章。 \n\n如幼童軍在較早階段已經考取部份指定活動徽章，則須考取其他活動徽章或三級制章中更高的級 別。 \n\n註 1 ：有關隊列內容，請參閱青少年活動署所發出之「隊列和升掛國旗及區旗指引（ 2024 年 6 月版 本）」，網址為 https://www.scout.org.hk/uploads/tc/circulars/16450/guidelines-of-chinese-foot-drilland-national-flag-and-regional-flag-raising.pdf \n\n19\n\n<!-- p.21 -->\n# 金 紫 荊 獎 章 \n\n此乃幼童軍支部的最高榮譽獎章，適合已考獲「幼童軍高級歷奇 章」或年滿十歲而考獲會員章，及完成「幼童軍體驗章」、「幼童 軍歷奇章」及「幼童軍高級歷奇章」內「核心範疇」指定內容之 幼童軍成員 。 \n\n為確保幼童軍能完整接受基本訓練，凡進行此章之幼童軍，必須 於完成最後一項課程內容時年齡達十歲半或以上，方可向所屬童 軍區及地域遞交「金紫荊獎章及證書申請表」，以供審批。 \n\n凡已達十二歲而仍在小學階段者，可繼續其幼童軍成員身份參與「金紫荊獎章」課程相關之活 動，直至相關學年之新學年度開始前一日，惟必須符合以下條件： \n\n1. 進行「金紫荊獎章」課程時，(i)成員已考獲「幼童軍高級歷奇章」或；(ii)年滿十歲而考獲會 員章，及完成「幼童軍歷奇章」及「幼童軍高級歷奇章」內「核心範疇」指定內容； \n\n2. 該幼童軍成員完成金紫荊獎章考驗時，必須仍就讀於小學（即尚未小學畢業）； \n\n3. 在遞交新「金紫荊獎章及證書申請表（PT/XX）」時，必須同時附上學校發出的證明文件副 本，證明仍就讀於小學。 \n\n請注意：上述安排僅適用於幼童軍成員參與金紫荊獎章考驗，敬請留意。 \n\n完成下列各項： \n\n#### 甲、核心範疇 \n\n- （1） 童軍技能（高級） \n\n   - 4.1.1 生火及原野烹飪 \n\n      - a. 示範如何利用天然物資及炭搭一個炭架 \n\n      - b. 嘗試在安全情況下自行生火，可使用火機及炭精助燃 \n\n      - c. 在不利用炊具的情況下將水煮沸，製作一份熱飲 \n\n      - d. 運用以下三款不同原野烹飪方式烹調食物： \n\n      - i. 用鐵網和竹枝，燒烤一些肉類 \n\n      - ii. 用錫紙包好一些簡單食物，放在爐火上燒烤或爐下煨 \n\n      - iii. 用蔬果作器皿（如：橙、洋蔥、番茄），把中心挖空，放進雞蛋，直接放在鐵網上 或爐邊烤熟 \n\n   - 4.1.2 繩結及紮作 \n\n      - a. 認識其方法及其用途 i. 8 字編結 \n\n      - ii. 四方編結 iii. 十字編結 \n\n      - b. 利用上述所學繩結，以小組合作形式完成下列其中兩項小型紮作： \n\n- i. 旗杆架 ii. 衣鞋架 iii. 戰車架 \n\niv. 羅馬炮架 \n\n完成後可獲取 童軍技能章（高級） \n\n4.1.3 露營 \n\n完成「露營章」或完成以下內容 \n\n- a. 進行不少於一晚的露營，並在露營中完成以下項目： i. 收拾一個週末露營的裝備 \n\nii. 協助架搭及拆卸一個營幕 \n\niii. 在營地中怎樣處理及保養一個已搭建之營幕 \n\n20\n\n<!-- p.22 -->\n- iv. 在營地協助烹調、分發及善後一次膳食 \n\n- v. 懂得露營的基本衞生常識及安全守則 \n\n- vi. 協助清理露營後的場地 \n\n4.1.4 認識地圖及指南針 \n\n完成「探險章」或完成以下內容 \n\n   - a. 明瞭地圖或街道圖上的主要圖例，並能指出旅團及居所的位置 \n\n   - b. 能夠形容出由地圖所指的一條5 公里長的路上會見到的事物 \n\n   - c. 懂得利用地圖及西維氏 (Silva-type) 指南針正置地圖、指出前進方向或地標的方位 \n\n- 4.1.5 遠足 \n\n完成「探險章」或完成以下內容 \n\n- a. 懂得收拾一套戶外活動用的裝備 \n\n- b. 和領袖一起計劃及進行一次不少於六公里之遠足活動 \n\n#### （2） 關己愛人（高級） \n\n4.2.1 急救知識 \n\n   - a. 完成「急救章」 \n\n- 4.2.2 特別行善 \n\n   - a. 在小隊或團中進行一次善行 \n\n   - b. 統籌及主持一項活動 \n\n4.2.3 協助團長及領袖 \n\n完成後可獲取 關己愛人章（高級） \n\n   - a. 在團中協助團長或領袖處理團務最少八星期及總時數不少於八小時之持續服務。服務完 成後，幼童軍需要作不少於三分鐘之短講以作分享 \n\n- 4.2.4 認識情緒 \n\n   - a. 認識自己基本的情緒 \n\n   - b. 知道如何抒發自己的情緒 \n\n   - c. 懂得如何在自身及他人情緒未能完全抒發時向成年人求助 \n\n- 4.2.5 關愛社羣 \n\n   - a. 完成下列其中一個活動徽章 \n\n   - i. 共融章 \n\n   - ii. 愛護動物章 \n\n#### （3） 國家與社區（高級） \n\n4.3.1 國家與守法責任 \n\n- a. 認識「國家概念」、「守法觀念」、「權利與義務」和「責任感」 \n\n4.3.2 社區緊急服務設施 \n\n完成後可獲取 \n\n國家與社區章（高級） \n\n- a. 認識居住社區之緊急救援服務位置（例如：警署、醫院、救護站、消防局等等） \n\n- 4.3.3 童軍區會與總部 \n\n- a. 認識童軍區會及地域總部之地理位置及前往方法 \n\n- 4.3.4 香港古蹟與文物 \n\n完成「香港歷史章」或完成以下內容 \n\n- a. 認識香港的古蹟及文物 \n\n4.3.5 中式隊列 1 \n\n- a. 與其他成員組成升旗隊，懂得如何在配合國歌下升國旗 \n\n21\n\n<!-- p.23 -->\n#### （4） 童軍家庭（高級） \n\n- 4.4.1 認識童軍家庭 \n\n- a. 認識童軍總會轄下五個地域 \n\n- b. 參加一次地域或總會所舉辦之活動 \n\n- c. 認識世界童軍運動及香港童軍運動的起源 \n\n- d. 認識童軍團# \n\n   - i. 認識童軍團的活動 \n\n   - ii. 認識童軍制服 \n\niii. 認識童軍支部的小隊制度 \n\niv. 認識童軍支部的獎章制度 \n\n   - #完成「童軍先修章」之成員，此部份可獲豁免 \n\n- 4.4.2 誓詞和規律 \n\n完成後可獲取 童軍家庭章（高級） \n\n- a. 製作一本紀錄冊，紀錄一個月內做過的事如何實踐誓詞和規律 \n\n- b. 向其他成員分享他／她在日常生活中所實踐誓詞和規律的兩件事件 \n\n#### 乙、興趣範疇 \n\n成員可於（5）多元創藝、（6）科學與大自然及（7）運動與愛好中選擇其中兩個範疇，每個範疇必 須完成至少一個活動徽章。 \n\n如幼童軍在較早階段已經考取部分指定活動徽章，則須考取其他活動徽章或三級制章中更高的級別。 \n\n註1：有關隊列內容，請參閱青少年活動署所發出之「隊列和升掛國旗及區旗指引（2024 年 6 月版 本）」，網址為 https://www.scout.org.hk/uploads/tc/circulars/16450/guidelines-of-chinese-foot-drill-andnational-flag-and-regional-flag-raising.pdf \n\n22\n\n<!-- p.24 -->\n# 乙部「興趣範疇」課程內容 \n\n以下列表為建議成員於不同階段期間可進行的活動徽章，團長可因應成員情況及/或興趣，安排相應 活動徽章評核，如幼童軍在較早階段已經考取部分指定活動徽章，則須考取其他活動徽章或三級制 章中更高的級別。 \n\n||幼童軍歷奇章|幼童軍高級歷奇章|金紫荊獎章|\n|---|---|---|---|\n|多元創藝|藝術章<br>娛樂章<br>寫作章<br>音樂章 (三級制度章)<br>語言章|藝術章<br>娛樂章<br>寫作章<br>音樂章 (三級制度章)<br>手藝章*<br>攝影章<br>資訊科技章<br>語言章|藝術章<br>娛樂章<br>寫作章<br>音樂章 (三級制度章)<br>手藝章*<br>攝影章<br>資訊科技章<br>語言章<br>媒體製作章|\n|科學與<br>大自然|園藝章<br>科學章|園藝章<br>科學章|園藝章<br>科學章|\n||走塑達人章|天象章<br>氣象章<br>走塑達人章<br>自然守護者章|天象章<br>氣象章<br>走塑達人章<br>自然守護者章<br>日光善用者章|\n|運動與愛好|運動章<br>體適能章|運動章<br>體適能章|運動章<br>體適能章|\n||游泳章|游泳章|游泳章|\n||蒐集章|射箭章|射箭章|\n||閱讀章|田徑章<br>單車章<br>獨木舟章<br>公園定向章<br>蒐集章<br>閱讀章<br>烹飪章<br>寵物章|田徑章<br>單車章<br>獨木舟章<br>公園定向章<br>水手章<br>風帆章<br>蒐集章<br>閱讀章<br>烹飪章<br>寵物章<br>世界友誼章|\n\n23\n\n<!-- p.25 ocr -->\n# 幼童軍活動徽章 \n\n24\n\n幼童軍活動徽章\n\n核心\n\n國家與社區 | 關己愛人 | 童軍家庭 | 童軍技能\n\nBP\n\n運動與愛好 | 多元創藝 | 科學與大自然\n\n興趣\n\n24\n\n<!-- p.26 -->\n# 幼童軍活動徽章目錄 \n\n#### 甲、核心範疇 \n\n#### 童軍技能 （綠色） \n\n|1. 露營章|Camper|27|\n|---|---|---|\n|2. 探險章|Explorer|28|\n\n#### 關己愛人 （紅色） \n\n|3.|愛護動物章|Animal Care|29|\n|---|---|---|---|\n|4.|共融章|DisabilityAwareness|30|\n|5.|急救章|First Aid|31|\n|6.|家務章|Home Help|32|\n|7.|道路安全章|Road Safety|33|\n|8.|水上安全章|Water Safety|34|\n|9.|「積極公民」獎章系列 –|Active Citizenship Badge Series –|35|\n||防騙先鋒章、禁毒章、<br>保護兒童章、社區應急先鋒<br>章、環保先鋒章、機電先鋒章|Anti-Deception, Anti-Drug, Child Protection,<br>Community Emergency Responder,<br>Green Pioneer Badge,||\n|||Electrical & Mechanical(E&M)Pioneer||\n\n#### 國家與社區 （黃色） \n\n|10. 香港歷史章|HongKongHistorian|36|\n|---|---|---|\n|11. 「積極公民」獎章系列 –|Active Citizenship Badge Series –|37|\n|國家安全大使章|National SecurityAmbassador||\n\n#### 乙．興趣範疇 \n\n#### 多元創藝 （藍色） \n\n|12. 藝術章|Artist|38|\n|---|---|---|\n|13. 手藝章|Craftsman|39|\n|14. 娛樂章|Entertainer|40|\n|15. 資訊科技章|Information Technology|41|\n|16. 語言章|Linguist|42|\n|17. 媒體製作章|Media Maker|43|\n|18. 音樂章 (三級制度)|Musician|44|\n|19. 攝影章|Photographer|46|\n|20. 寫作章|Writer|47|\n\n#### 科學與大自然 （青色） \n\n|21. 天象章|Astronomer|48|\n|---|---|---|\n|22. 園藝章|Planting|49|\n|23. 科學章|Scientist|50|\n|24. 氣象章|Weatherman|51|\n|25. 地球部落計劃 –|Earth Tribe Programme –|52|\n|走塑達人章、自然守護者章、|Plastic Tide Turners, Champions for Nature,||\n|日光善用者章|Scouts Go Solar||\n\n25\n\n<!-- p.27 -->\n#### 運動與愛好 （橙色） \n\n|26. 射箭章 (三級制度)|Archery|53|\n|---|---|---|\n|27. 田徑章 (三級制度)|Athlete|54|\n|28. 閱讀章|Book Reader|55|\n|29. 獨木舟章 (三級制度)|Canoe|56|\n|30. 蒐集章|Collector|57|\n|31. 烹飪章|Cook|58|\n|32. 單車章|Cyclist|59|\n|33. 公園定向章 (三級制度)|Park Orienteering|60|\n|34. 寵物章|Pets|61|\n|35. 體適能章 (三級制度)|Physical Fitness|62|\n|36. 風帆章|Sailing|63|\n|37. 水手章|Seamanship|64|\n|38. 運動章|Sportsman|65|\n|39. 游泳章 (三級制度章)|Swimmer|66|\n|40. 世界友誼章|World Friendship|67|\n|其他徽章|||\n|41. 宗教章|Religious|68|\n|42. 童軍先修章|Scout Link Badge|70|\n\n26\n\n<!-- p.28 -->\n# 甲、核心範疇 童軍技能 \n\n# 露營章 \n\n目的： \n\n透過露營的體驗，讓幼童軍學習自理能力，認識露營的知識及合 作精神。 \n\n要求： \n\n1. 進行不少於一晚的戶外露營； \n\n2. 準備露營的裝備； \n\n3. 協助架搭及拆卸一個營幕； \n\n4. 懂得在營地中處理及保養一個已架搭之營幕； \n\n5. 架設一個簡單的營地紮作； 6. 在營地協助烹調、分發及善後一次家常膳食； \n\n7. 懂得露營的基本衞生常識及安全守則； \n\n8. 協助清理露營後的場地。 \n\n27\n\n<!-- p.29 -->\n# 探險章 \n\n目的： \n\n讓幼童軍學習基本閱讀地圖的技巧，同時瞭解野外旅程前的準備 及需關注事項，並明瞭戶外基本求生技能。 \n\n要求： \n\n1. 明瞭地圖或街道圖上的主要圖例，並能指出旅團及居所的位置。 \n\n2. 製作一個合比例之 100 米高小模型，該模型應能顯示相距 20 米的等高線。 \n\n3. 明瞭上述第 1、2 點，以便能夠形容出由地圖所指的一條5,000 米長的路上會見到的事物。 \n\n4. 懂得利用地圖及西維氏 (Silva-type) 指南針正置地圖、指出前進方向或地標的方位。 \n\n5. 明瞭一日遠足行程前所需要之準備工作，包括旅程費用、適當之服裝、鞋襪、救傷用品及食物 等。 \n\n6. 策劃及參加一次不少於六公里之幼童軍遠足活動。 \n\n28\n\n<!-- p.30 -->\n# 甲、核心範疇 關己愛人 \n\n# 愛護動物章 \n\n目的： \n\n提升幼童軍對愛護動物的意識，提倡善待動物、瞭解動物的需要 及學習尊重生命。 \n\n要求： \n\n1. 向領袖講述動物的需要及如何選擇合適的寵物。 \n\n2. 明瞭飼養寵物的責任。 \n\n3. 認識一種寵物的生命週期、生活習性、常見疾病、棲息地及生存的基本需要。 \n\n29\n\n<!-- p.31 -->\n# 共融章 \n\n目的： \n\n讓幼童軍學習認識及如何接納和關懷社會上的弱能人士，與其融 洽共處並理解他們的特質及需求。 \n\n要求： \n\n1. 認識何謂多元共融 \n\n2. 認識特能童軍活動 \n\n3. 瞭解以下其中兩類特殊需要人士的特質︰ \n\n   - a..身體 \n\n   - b. 教育 \n\n   - c. 文化 \n\n   - d. 種族 \n\n4. 與上述第 3 項所提到的特殊需要人士進行一次聯合活動或進行一次服務，並作簡單記錄。 \n\n30\n\n<!-- p.32 -->\n# 急救章 \n\n目的： \n\n讓幼童軍明白急救的目的及原則、求助的程序、並知曉日常生活 中導致意外的因素，及簡單處理方法。 \n\n要求： \n\n1. 明瞭急救的原則，能講出日常生活中和戶外活動時的危險因素，以及進行急救前的首要工作，如 向成年人求助及報警。 \n\n2. 認識輕微／嚴重出血及有異物傷口的處理方法，示範進行傷口處理前的程序。 \n\n3. 認識燒傷與燙傷的成因、預防方法及知曉其簡單處理方法。 \n\n4. 認識昏厥的徵狀及知曉其簡單處理方法。 \n\n5. 認識扭傷的徵狀及知曉其簡單處理方法。 \n\n6. 完成「幼童軍急救章手冊」內第一至第五課的討論及溫習項目。 \n\n7. 能列舉出個人藥囊的各項應用物品。 \n\n8. 示範三角繃帶的兩種紮法︰大手掛及三角手掛。 \n\n#### 注意事項： \n\n- ❖ 需確保幼童軍正確使用急救用品。 \n\n- ❖ 請參閱本會出版的《幼童軍急救章手冊》。 \n\n31\n\n<!-- p.33 -->\n# 家務章 \n\n#### 目的： 鼓勵幼童軍分擔家務並能展示基本技能。 \n\n要求： \n\n完成以下各項： \n\n1. 煎煙肉或香腸，煮蛋和煮飯。 \n\n2. 佈置飯桌及懂得進膳時之禮貌（此項可與第一項同時進行）。 \n\n3. 洗碗碟並知道怎樣處理用過之鍋鑊、刀叉、筷子、玻璃器皿等。 4. 洗及熨旅巾。 \n\n5. 在制服上縫上一個徽章或鈕扣。 \n\n6. 整理睡牀。 \n\n7. 清潔門窗、銀器或銅器。 \n\n8. 清潔及整理一個房間。 \n\n32\n\n<!-- p.34 -->\n# 道路安全章 \n\n目的： \n\n讓幼童軍明 暸 交通安全的基本常識，使他們清楚瞭解使用道路時 的正確態度，加強他們的責任感及自律性。 \n\n要求： \n\n完成以下各項： \n\n1. 明瞭交通意外常見成因。 \n\n2. 懂得選擇可以安全橫過馬路的地點，及使用「過馬路守則」。 \n\n3. 能畫出至少十種在馬路上常見的交通標誌，並能解釋其意思。 \n\n4. 明瞭如何安全地騎單車。 \n\n5. 明瞭作為車輛乘客如何實踐道路安全及違例的後果。 \n\n6. 認識在自己居住的社區中不同的道路設施。 \n\n7. 懂得在發生交通意外時，如何作出求救。 \n\n8. 製作一張海報宣傳道路安全或蒐集一份有關不安全使用道路的剪報（電子版可以嗎？）。 \n\n33\n\n<!-- p.35 -->\n# 水上安全章 \n\n目的： \n\n提升幼童軍的安全意識，使他們遇上水上意外時懂得如何協助。 \n\n要求： \n\n完成以下各項： \n\n1. 認識水上安全知識及守則。 \n\n2. 明瞭向成年人求助的重要性。 \n\n3. 明瞭及能在安全情況下完成下列各項︰ \n\n   - a.. 手援 — 利用下列物品拯救近岸之溺者︰ \n\n      - (i) 竹竿或木棒等棒類物品。 \n\n      - (ii) 兩件緊縛在一起之衣物。 \n\n   - b..拋物 — 站在岸上將下列物件拋與一離岸 6 米之溺者︰ \n\n      - (i) 任何無負重之繩索。 \n\n      - (ii) 水泡或其他浮物。 \n\n34\n\n<!-- p.36 -->\n# 「積極公民」獎章系列 – 防騙先鋒章、禁毒章、保護兒童章、 社區應急先鋒章、環保先鋒章、機電先鋒章 \n\n目的： \n\n此獎章系列旨在透過實踐公民責任、參與社會服務計劃、發展領導能力等活動，培養青少年成為 具有良好道德、知識和技能的積極公民，能夠積極服務社會，為社會的進步和發展作出貢獻。 \n\n<!-- Start of picture text -->\n防騙先鋒章 禁毒章<br>社區應急先鋒章 環保先鋒章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n保護兒童章<br>機電先鋒章<br><!-- End of picture text -->\n\n有關獎章要求，請參閱「香港童軍總會 — 「積極公民」獎章網站。 \n\n<!-- Start of picture text -->\n「積極公民」獎章網站<br><!-- End of picture text -->\n\n35\n\n<!-- p.37 -->\n# 核心範疇 國家與社區 \n\n# 香港歷史章 \n\n目的： \n\n鼓勵幼童軍探索香港歷史，讓他們瞭解本地的人和事。 \n\n要求： \n\n完成以下各項： \n\n1. 在與領袖商討後以下列任何一個主題製作一本剪貼簿或一個互聯網站︰ \n\n   - a..一名本港歷史名人的事蹟。 \n\n   - b..一個香港的古舊建築。 \n\n   - c..一件香港歷史大事。 \n\n   - d..其他經領袖同意且對本港具相當歷史意義的題目。 \n\n2. 選取三個香港的法定古蹟，並為此等古蹟各設計一幅海報以介紹其背景及參觀方法。 \n\n3. 參觀其中一間由政府部門、公營機構、教育機構、非牟利組織或私營機構所管理的博物館（事 前需取得團長同意），並進行匯報。 \n\n4. 向團員介紹一條香港街道或一個香港地區名稱的命名背景和典故。 \n\n36\n\n<!-- p.38 -->\n# 「積極公民」獎章系列 – 國家安全大使章 \n\n目的： \n\n此獎章系列旨在透過實踐公民責任、參與社會服務計劃、發展領導能力等活動，培養青少年成為 具有良好道德、知識和技能的積極公民，能夠積極服務社會，為社會的進步和發展作出貢獻。 \n\n國家安全大使章 \n\n有關獎章要求，請參閱「香港童軍總會 — 「積極公民」獎章網站。 \n\n「積極公民」獎章網站 \n\n37\n\n<!-- p.39 -->\n# 乙、興趣範疇 多元創藝 \n\n# 藝術章 \n\n目的： \n\n鼓勵幼童軍展現創意及發展多元化的美術技巧。 \n\n要求： \n\n完成下列其中三項： \n\n1. 參觀美術館，並利用圖畫、相片、文字或其他媒體，紀錄並介紹參觀後之感想。 \n\n2. 繪畫一幅靜物或風景畫。 \n\n3. 設計並製作一張賀卡。 \n\n4. 為幼童軍活動繪畫一張宣傳海報。 \n\n5. 設計並製作一本書的封面及裝飾。 \n\n6. 用黏土設計並製作一個模型。 \n\n7. 為你感興趣的一組主題相片，設計及製作一塊展示板。 \n\n8. 其他（取得領袖同意後，以其他藝術媒介製作一件藝術作品。） \n\n38\n\n<!-- p.40 -->\n# 手藝章 \n\n目的： \n\n讓幼童軍認識如何運用及保養家居中常見的工具。 \n\n要求： \n\n完成以下各項： \n\n1. 瞭解並示範如何安全使用和保養工具，包括鎚子、鋸子、螺絲批、板手、鉗子、拉尺、砂紙 等。 \n\n2. 在領袖或成年人監督下，使用上述工具，協助設計和製造一件在家庭或團部有用的物品。 3. 該物品能夠展示幼童軍可以進行： \n\n   - 量度的方法 \n\n   - 釘及螺絲釘的使用 \n\n   - 膠水及黏合劑的使用 \n\n   - 砂紙打磨 \n\n   - 不同的著色方法等 \n\n4. 介紹此物品的用途與保養方法。 \n\n注意事項：需注意幼童軍是否正確使用工具及相關保護衣物。 \n\n39\n\n<!-- p.41 -->\n# 娛樂章 \n\n目的： \n\n讓幼童軍協助策劃及表演節目，發揮創意，學習基本的藝術表達 與美感，並從中培養與人溝通及合作的能力。 \n\n要求： \n\n完成下列其中三項： \n\n1. 協助編排並表演一個默劇或戲劇。 \n\n2. 製作自己的布偶或木偶，並利用它們表演木偶戲或皮影戲。 \n\n3. 協助策劃並表演一系列（三個以上）的雜技或魔術。 \n\n4. 用一種樂器演奏一首歌曲。 \n\n5. 編排並表演一段自己選擇音樂的舞蹈。 \n\n6. 表演土風舞或傳統舞蹈。 \n\n7. 演唱兩首歌。 \n\n8. 製作簡單的節奏樂器，並在音樂表演中使用它們。 \n\n9. 向觀眾講一個最少達五分鐘的故事。 10. 其他（取得領袖同意後，以其他演藝形式表演一項最少三分鐘的節目。） \n\n40\n\n<!-- p.42 -->\n# 資訊科技章 \n\n目的： \n\n`讓幼童軍掌握基本資訊科技知識與技能，並初步認識人工智能 （` AI `）的應用與影響，從小培養創意、分析與負責任的數碼公民 態度` 。 \n\n要求： \n\n完成以下各項： \n\n1. `能識別常見資訊科技設備，能附以一個簡圖` 說 `明，包括：` \n\n   - `a. 電腦、平板、手機等常見裝置` \n\n   - `b. 輸入與輸出設備（如：鍵盤、滑鼠、螢幕、印表機）` \n\n   - `c. 雲端與實體儲存裝置` \n\n2. `認識不同檔案格式（如` .jpg, .mp4, .docx `）及格式化的基本概念` \n\n3. `明瞭雲端儲存的簡單運作原理，以及其好處和壞處。` \n\n4. `利用軟件，完成下列其中兩項：` \n\n   - `a. 製作一件多媒體作品；或` \n\n   - `b. 用中文或英文，為旅團編寫一則A4 尺寸的通告或告示，當中應包括文字及圖案；或` \n\n   - `c. 製作最少 5 張投影片，介紹自己或旅團。` \n\n5. `能簡單` 說 `出人工智能（AI）的概念及使用時的注意事項，包括： AI 的基本原理是如何運作、日 常生活中常見的 AI 應用（如語音助理、推薦系統等）以及 使用 AI 所提供的資料時，應再三` 查 `證其準確性等等。` \n\n6. `利用AI，完成下列其中一項：` \n\n   - `a. 使用圖像生成工具，創作一張以「我的未來世界」為主題的圖畫；或` \n\n   - `b. 使用簡單的 AI 對話機器人，與領袖討論一個問題，例如：「環境保育的重要性」` \n\n7. `明瞭尊重知識` 產 `權及誠實使用電腦的重要性。` \n\n41\n\n<!-- p.43 -->\n# 語言章 \n\n#### 目的： \n\n#### 培養幼童軍非母語表達能力。 \n\n要求： \n\n- 除了母語之外，運用任何一種語言去完成下列各項︰ \n\n1. 正確指出鄰近一帶之商店、警署、郵局、教堂、油站、酒店的所在地點。 \n\n2. 回答居所／學校／旅部附近之公共交通服務情況的簡單問題。 \n\n3. 解釋「單程路」、「路不通行」、交通燈號及單程票等意思。 \n\n4. 說出一星期七天和一年十二個月的名稱，並懂得日期的說法。 \n\n5. 指出鄰近的公眾免費上網地點及說明如何連線。 \n\n42\n\n<!-- p.44 -->\n# 媒體製作章 \n\n目的： \n\n讓幼童軍利用不同媒體，發揮創意與技術，培養幼童軍於數碼媒 體設計、視覺效果、多媒體製作、故事敘述等能力。 \n\n要求： \n\n完成下列其中兩項： \n\n1. 利用圖像或影像處理軟件，為幼童軍團設計一項宣傳品，例如：海報、宣傳單張、橫額等。 \n\n2. 製作一個簡易網站，介紹自己日常生活，並經領袖同意後發佈。 \n\n3. 為一個主題，例如旅行、童軍活動等，利用相片、圖畫與文字製作一本電子書。 \n\n4. 錄製一個三分鐘的音頻故事，故事中須搭配音樂與聲效演出。 \n\n5. 製作一個三分鐘的主題短片，並以對白或旁白加以說明。 \n\n6. 利用軟件或拍攝，製作一個一分鐘的動畫短片。 \n\n43\n\n<!-- p.45 -->\n# 音樂章 \n\n（三級制度章） \n\n目的： 培養幼童軍對音樂的興趣，並能展示音樂技能。 \n\n<!-- Start of picture text -->\n初級  中級 高級<br><!-- End of picture text -->\n\n要求： 初級 \n\n完成以下各項： \n\n1. 技能 \n\n   - a. 聆聽一段短曲後，然後唱出來。 \n\n   - b. 以拍掌方式拍打另一首曲子之節奏。 \n\n2. 表演 \n\n   - 在童軍活動、團體表演或音樂會等表演場合，選擇運用樂器演奏樂曲或唱出歌曲。 \n\n3. 知識 \n\n   - a. 展示一段增進音樂技巧的音樂練習。 \n\n   - b. 選擇以下一項： \n\n      - 介紹演奏所運用的樂器，及為何喜歡此樂器；或 \n\n      - 介紹所演唱的歌曲，及為何喜歡並選擇這歌曲。 \n\n4. 興趣 介紹最喜歡的音樂類別或曲目。 \n\n#### 中級 \n\n完成以下各項： \n\n1. 技能 \n\n達到英國皇家音樂學院考試委員會（ABRSM）一級或相似標準的樂器或聲樂水平。 \n\n2. 表演 在童軍活動、團體表演或音樂會等表演場合，選擇運用樂器演奏或唱出，兩種不同風格的樂曲或 歌曲。 \n\n3. 知識 \n\n   - a. 展示兩段增進音樂技巧的音樂練習。 \n\n   - b. 選擇以下一項： \n\n      - 介紹演奏時所運用的樂器，及為何喜歡此樂器；或 \n\n      - 介紹所演唱的歌曲，及為何喜歡並選擇這歌曲。 \n\n   - c. 介紹兩首與演奏時所運用的樂器相關之音樂作品。 \n\n4. 興趣 \n\n   - a. 介紹最喜歡的音樂類別或曲目 \n\n   - b. 介紹最常聆聽的音樂。 \n\n#### 高級 \n\n44\n\n<!-- p.46 -->\n完成以下各項： \n\n1. 技能 \n\n達到英國皇家音樂學院考試委員會（ABRSM）三級或相似標準的樂器或聲樂水平。 \n\n2. 表演 \n\n在童軍活動、團體表演或音樂會等表演場合，選擇運用樂器演奏或唱出，兩種不同風格的樂曲或 歌曲；當中一首應為獨奏樂曲，另一首必須與他人一起合奏。 \n\n3. 知識 \n\n   - a. 展示三段增進音樂技巧的音樂練習。 \n\n   - b. 選擇以下一項： \n\n      - 介紹演奏時所運用的樂器，及為何喜歡此樂器；或 \n\n      - 介紹所演唱的歌曲，及為何喜歡並選擇這歌曲。 \n\n   - c. 介紹三首與演奏時所運用的樂器相關之音樂作品。 \n\n   - d. 介紹三位喜歡的音樂家。 \n\n4. 興趣 \n\n   - a. 介紹最喜歡的音樂類別或曲目 \n\n   - b. 介紹最常聆聽的音樂。 \n\n   - c. 介紹喜歡的音樂與表演時選擇的音樂之間的異同。 \n\n45\n\n<!-- p.47 -->\n# 攝影章 \n\n目的： \n\n讓幼童軍學習攝影基本原則及技巧，培養對攝影的興趣。 \n\n要求： \n\n完成以下各項： \n\n1. 瞭解相機之各主要部分，包括：鏡頭、觀景器、閃燈、記憶咭、電池等，並懂得安裝及移除記憶 咭及電池。 \n\n2. 展示如何使用數碼相機或智能手機相機。包括： \n\n   - a. 展示如何更改拍攝模式、更改設置； \n\n   - b. 使用變焦功能； \n\n   - c. 將相片傳輸到其他設備。 \n\n3. 介紹如何保養相機與鏡頭。 \n\n4. 拍攝一套12 張的相片，以紀錄一次旅行或活動；並以剪貼簿、電腦簡報、相冊或其他方式，向 他人展示並分享有關相片。 \n\n46\n\n<!-- p.48 -->\n目的： 培養幼童軍寫作興趣。 \n\n要求： \n\n# 寫作章 \n\n完成下列其中三項： \n\n1. 創作一首至少六行的詩，並和領袖討論詩句的構造與意義。 \n\n2. 與領袖討論一個故事想法，並創作一個指定字數的短篇故事。 \n\n3. 對於喜歡的書籍、戲劇或其他文學作品，在閱讀或欣賞後，撰寫一篇指定字數的評論文章。 \n\n4. 為學校刊物、信仰刊物、社區刊物、報紙或童軍雜誌，投稿撰寫一篇指定字數*的文章。 \n\n5. 就某個主題，寫下一篇指定字數的日記。 \n\n6. 撰寫一個持續五分鐘的戲劇或戲劇片段。 \n\n7. 採訪領袖或其他人士。 將訪問的問題和受訪者的回答寫下來，紀錄這次訪談。 \n\n8. 寫一封指定字數的信件郵寄給筆友（真實或想象中的）。內容描述幼童軍中曾參與最有意義或最 有趣的事，並能正確地在信封寫上收信人、發信人及地址。 \n\n9. 發出一封指定字數的電郵寄給親友，邀請他們參加團部的活動，或向他們表達某特別事件的謝 意。 \n\n#### 指定字數： \n\n|幼童軍歷奇章|不少於50字|\n|---|---|\n|幼童軍高級歷奇章|不少於150字|\n|金紫荊獎章|不少於250字|\n\n47\n\n<!-- p.49 -->\n# 乙、興趣範疇 科學與大自然 \n\n# 天象章 \n\n目的： \n\n幼童軍通過認識香港常見的天象，及學習相關觀測的安全事項， 引發其對夜空探索的興趣，及明瞭星空保育的重要性。 \n\n要求： \n\n完成以下各項： \n\n1. 認識黃道十二星座的名稱及主要特徵。 \n\n2. 認識月相、日食和月食。 \n\n3. 認識太陽系中各個行星的名稱及主要特徵。 \n\n4. 明瞭觀星禮儀及光污染對觀星的影響。 \n\n5. 製作針孔投影儀安全觀測太陽。 \n\n6. 完成以下其中一項︰ \n\n   - a. 參加一次晚間戶外觀星活動，觀看月球或光亮的星星，例如：金星、木星、北斗七星、夏季 大三角和冬季大三角等； \n\n   - b. 參觀香港太空館。 \n\n#### 注意事項： \n\n- ❖ 於太陽觀測時，請注意保護眼睛。 \n\n48\n\n<!-- p.50 -->\n# 園藝章 \n\n#### 目的： \n\n讓幼童軍瞭解植物的特性及栽培過程，培養他們對園藝的興趣。 \n\n要求： \n\n完成以下各項： \n\n1. 介紹四種香港常見之植物，包括其特徵、生長時節及所在地方。 \n\n2. 用不少於一個月的時間栽種一株植物，記錄其由種子開始的生長、栽種過程及介紹其特性等， 包括： \n\n   - a..詳列每星期該植物生長、形態、萌芽等的情況； \n\n   - b. 瞭解栽培該植物的注意事項（包括︰土壤、氣候、濕氣、溫度及時節等）； \n\n   - c. 繁殖及栽種方法； \n\n   - d. 控制或培養植物之生長。 \n\n3. 知道栽種第 2 項植物所需的用具及明瞭應怎樣適當地使用和保養它們。 \n\n49\n\n<!-- p.51 -->\n# 科學章 \n\n#### 目的： \n\n#### 培養幼童軍對科學探究的興趣及求證精神。 \n\n要求： \n\n完成以下各項： \n\n1. 示範任何兩個自選的科學實驗，並向領袖解釋實驗及其結論。（該兩項實驗可以是幼童軍感興 趣的，並應以他們自行發現為據）。 \n\n2. 完成下列其中兩項實驗︰ \n\n   - a..製作一件模型，裝上燈泡、電池、開關掣。 \n\n   - b. 以尼龍布及紙各製作一隻風箏，設計實驗以比較其性能，包括在空中停留的時間、飛行距離、 飛行路線的控制及打圈的情況，並與領袖討論其結果。 \n\n   - c..證明白光由多種顏色組合而成。 \n\n   - d. 製作一個顯微鏡或潛望鏡並詳述其原理。 \n\n   - e. 製作任何需要的用具，並在一星期內每天在同一時間記錄風向、風速、 視野、雨量、溫度、雲及氣溫並與領袖討論所發現的現象。 \n\n   - f.  找出若植物缺乏水和光便會怎樣，並與領袖討論所發現的現象。 \n\n   - g..從任何一種飽和的化學溶液中，析出結晶體。 \n\n   - h. 設計一項實驗以證明金屬受熱會膨脹。 \n\n   - i.  準備隱形墨水，顯示其性能並詳述其原理。 \n\n   - j.  證明聲音的傳播。 \n\n50\n\n<!-- p.52 -->\n# 氣象章 \n\n#### 目的： \n\n認識天氣變化對日常生活的影響並需注意的事項。 \n\n要求： \n\n完成以下各項： \n\n1. 懂得利用大眾傳播媒介或電子工具獲取天氣資訊。 \n\n2. 認識不同天氣要素，包括氣溫、風、降雨及紫外線指數等，並能說出戶外活動時能如何因應以 上四個要素的變化作出準備。 \n\n3. 懂得天氣警告發出後（包括雷暴警告、暴雨警告、熱帶氣旋警告等）的相關注意事項。 \n\n4. 認識雲的形成；能夠辨認四種雲類：層雲、積雲、卷雲、積雨雲。 \n\n5. 認識「二十四節氣」的基本概念，並能說出最少六個節氣（例如春分、夏至、秋分、 冬至、清 明、大暑、驚蟄等）的特點（例如大自然變化及中外習俗等）。 \n\n6. 進行為期最少五天的天氣觀測，記錄個人對天氣狀況的感覺，並與當時的天氣資訊以作對比。 \n\n7. 完成以下其中兩項： \n\n   - a..製作海報或進行實驗描述「水循環」； \n\n   - b. 製作一個測風儀（風向或風速）的模型； \n\n   - c. 透過網上資源學習一個簡單氣象知識，並進行匯報。 \n\n51\n\n<!-- p.53 -->\n# 地球部落計劃 – 走塑達人章、自然守護者章、 日光善用者章 \n\n目的： \n\n地球部落是一個對環境議題充滿熱情的全球青少年社區，並積極參與全球公民來維護和保護我們 的地球。地球部落引導青少年進行教育之旅、培養必要的意識、能力和領導技能，在他們的社區 創造環境變化。 \n\n通過一系列令人興奮的地球部落挑戰，青少年瞭解如何與自然聯繫，成為可持續發展的擁護者， 並參與及採取環境保護行動。 \n\n地球部落章 \n\n走塑達人章 \n\n自然守護者章 \n\n日光善用者章 \n\n有關獎章要求，請參閱「地球部落」網站。 \n\n52\n\n<!-- p.54 -->\n# 乙、興趣範疇 運動與愛好 \n\n# 射箭章 \n\n目的： \n\n讓幼童軍初步理解及學習射箭知識，以啟發及培養其興趣。 \n\n初級 \n\n中級 \n\n高級 \n\n要求： \n\n此章包含知識、訓練和實射三部分。完成以下各項： \n\n1. 知識（擬考取較高一級時，無須再考） \n\n- a.  認識弓之主要部份的名稱； \n\n- b.  認識常用之射箭輔助工具的名稱； \n\n- c.  懂得五色十環靶面之計分方法。 \n\n2. 訓練（擬考取較高一級時，仍須重新完成下列四點） \n\n- a.  明白並能遵守射箭的安全規則； \n\n- b.  示範正確的射箭基本姿勢； \n\n- c.  懂得記錄積分； \n\n- d.  不少於 8 小時訓練。 \n\n3. 實射 \n\n53\n\n<!-- p.55 -->\n# 田徑章 \n\n#### 目的： \n\n<!-- Start of picture text -->\n鼓勵幼童軍參與田徑活動，瞭解相關安全知識，並能展示基本技能。<br>初級  中級 高級<br><!-- End of picture text -->\n\n要求： \n\n必須完成所有四個項目。完成初級需獲得 22 分；中級需獲得 28 分；高級需獲得 34 分。 \n\n54\n\n<!-- p.56 -->\n# 閱讀章 \n\n目的： 培養幼童軍閱讀動機及習慣，認識如何使用工具書和知曉怎樣在 圖書館尋找書籍（包括電子書籍）。 \n\n要求： \n\n完成以下各項： \n\n1. 列出最近閱讀過之書本名單及作者姓名，對領袖講述其中三本書之內容。 該三本書應由幼童軍自己選出，其中最少包括一本故事書及一本寫實的書籍。此三本書深淺程度 應視乎該幼童軍之年齡及能力等而定。 \n\n2. 知曉如何保護及儲存書籍。 \n\n3. 知曉如何運用中英文字典及地圖集或街道圖。 \n\n4. 向領袖解釋圖書館內的書籍（實體書或電子書）如何分類及陳列，並示範如何在圖書館內或網上 目錄中找出一本小說。 \n\n55\n\n<!-- p.57 -->\n# 獨木舟章 \n\n目的： \n\n鼓勵幼童軍參與獨木舟活動並能展示基本技能。 \n\n<!-- Start of picture text -->\n初級  中級 高級<br><!-- End of picture text -->\n\n要求： \n\n初級 完成以下各項： \n\n1. 通過本會之遊泳測試。 2. 考獲中國香港獨木舟總會少年獨木舟海馬章或同等資歷。 \n\n中級 完成以下各項： \n\n1. 通過本會之遊泳測試。 \n\n2. 考獲香港獨木舟總會少年獨木舟海豹章或同等資歷。 \n\n高級 \n\n完成以下各項： \n\n1. 通過本會之遊泳測試。 \n\n2. 考獲香港獨木舟總會少年獨木舟海象章或同等資歷。 \n\n備註： \n\n- ❖ 上述各級星章之課程均以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n56\n\n<!-- p.58 -->\n# 蒐集章 \n\n目的： \n\n讓幼童軍透過 蒐集過程，思考蒐集物件的意義，學習儲存、分類 與保養的技巧。 \n\n要求： \n\n完成以下各項： \n\n1. 在領袖同意下選定一種物件並與領袖討論蒐集這種物件的計劃。幼童軍應向領袖申述選擇這種物 件的理由和如何蒐集及保存這些物件。 \n\n2. 以最少四個月時間去搜集上述物件，並有系統地整理。如該幼童軍已開始蒐集該項物件，則應在 完成第 1 項後繼續蒐集該項物件達四個月。 \n\n57\n\n<!-- p.59 -->\n# 烹飪章 \n\n目的： \n\n培養幼童軍對烹飪的興趣，瞭解煮食計劃、正確技巧及健康地進 行飲食。 \n\n要求： \n\n#### 完成以下各項： \n\n1. 與領袖討論兩種不同烹飪方法的優缺點，並討論均衡飲食習慣的重要。 \n\n2. 預備一份足夠兩人食用的膳食，包括計劃餐單、烹調、餐桌安排、上菜與及清理餐桌。餐單可 以是中式或西式的，菜式必先與領袖商討及獲得主考同意。 \n\n   - a. 中式︰ 兩餸一湯及白飯。菜式應盡量包括蔬菜及肉類（素食者例外）；可以利用電飯鍋煮 白飯。 \n\n   - b. 西式︰包括餐湯、主菜及甜品。主菜必須包括肉類及伴以蔬菜，也可以是西式飯類或意大利 粉。 \n\n3. 預備一些熱飲品及小食，作為下午茶或輕便午餐。 \n\n4. 知道及能向領袖解釋廚房及煮食的安全措施及衞生守則。 \n\n#### 注意事項： \n\n- ❖ 不論中式或西式餐單，所有菜式均不可純以市面可購買的預製食品直接完成，但可將該等預 製食品作為部分烹調食材，配合其他材料自行製作。 \n\n- ❖ 如使用利器需注意使用及清潔時之安全。 \n\n- ❖ 請參閱「使用爐具安全指引」。 \n\n58\n\n<!-- p.60 -->\n# 單車章 \n\n目的： \n\n讓幼童軍瞭解騎單車前的準備事項， 掌握騎單車的基本知識 以策 安全， 並能展示基本技能。 \n\n要求： \n\n完成以下各項： \n\n1. 擁有或時常使用一輛大小適合之單車。 \n\n2. 能正確地上車及下車。 \n\n3. 能保持單車整潔及上油，並能替輪胎打氣。 \n\n4. 明瞭保持單車性能良好的重要性並履行之。 \n\n5. 明瞭停放單車時上鎖的重要性。 \n\n6. 知曉及協助修補輪胎。 \n\n7. 在領袖觀察下，駕單車完成一指定之短路程，以顯示能正確運用刊載於交通規則內之手號和守 則（該路程在可能範圍內，應包括有一個十字路口，行人橫過馬路處，右轉及迴旋處）。 \n\n#### 注意事項： \n\n- ❖ 幼童軍考取此章前應已懂得騎乘雙輪的單車。 \n\n- ❖ 幼童軍騎單車時必須戴上合適的個人保護裝備。 \n\n59\n\n<!-- p.61 -->\n# 公園定向章 \n\n目的： \n\n通過認識公園定向活動，提高幼童軍對定向運動之認識及興趣，並能展示基本技能。 \n\n初級 中級 高級 \n\n要求： \n\n必需依次序完成初級、中級及高級章內各個項目。 \n\n#### 初級 \n\n在完成公園定向訓練課程及參與一次相關的體驗活動後，能： \n\n- a. 認識甚麼是公園定向及其簡單歷史。 \n\n- b. 知曉越野式及奪分式定向之玩法。 \n\n- c. 明瞭公園定向地圖顏色定義。 \n\n- d. 認識公園定向地圖基本圖例。 \n\n- e. 懂得公園定向活動安全守則。 \n\n中級 \n\n在完成公園定向初級章後，能： a. 明瞭公園定向比賽程序。 b. 示範正置公園定向地圖的方法。 \n\n- c. 示範拇指輔行法。 \n\n- d. 參與一次公園定向同樂日或比賽。 \n\n#### 高級 \n\n在完成公園定向中級章後，能： \n\n- a. 認識甚麼是地圖比例及其表示方式。 \n\n- b. 知曉公園定向地圖等高線之概念。 \n\n- c. 明瞭國際控制點提示符號表之主要用途。 d. 描述一段不少於 100 米的公園定向地圖所見事物。 \n\n- e. 完成最少二次公園定向比賽。 \n\n- 註：中級 d 項與高級 e 項不能是同一事工。 \n\n60\n\n<!-- p.62 -->\n# 寵物章 \n\n目的： 透過瞭解寵物的需要，以及親自照料寵物，培養幼童軍的責任 感。 \n\n要求： \n\n完成以下各項： \n\n1. 飼養一寵物，記錄三個月內其生活習慣及生長過程（包括特徵及變化），並附上照片或圖片。 2. 知曉其原產地、所需的特別照顧、辨別及處理普通病症之方法。 \n\n61\n\n<!-- p.63 -->\n# 體適能章 \n\n目的： \n\n幼童軍通過體適能測試以瞭解自己的身體狀況從而建立良好生活品質及保持健康的身體。 \n\n<!-- Start of picture text -->\n初級  中級 高級<br><!-- End of picture text -->\n\n要求： \n\n完成以下各項： \n\n1. 皮摺量度（測量人體內的脂肪百分比）。 \n\n2. 曲膝仰臥起坐。 \n\n3. 坐地前伸。 \n\n4. 6／9 分鐘耐力跑 或 15 米漸進式心肺耐力跑。 \n\n5. 手握力或仰臥引體上升。 \n\n註： 此活動徽章之課程以教育局頒佈的最新「學校體適能獎勵計劃」內容為依歸。計劃內容可於 「學校體適能獎勵計劃」網頁內找到。（ https://spfas.hkuhealth.com/ ）如幼童軍考獲校內舉辦之 「學校體適能獎勵計劃」（金、銀、銅獎章）測試，即等同及豁免本章相同級別（高級、中級、初 級）之考驗。 \n\n62\n\n<!-- p.64 -->\n# 風帆章 \n\n目的： \n\n讓幼童軍初步理解滑浪風帆原理及知識，並通過相關實習，培養 對滑浪風帆的興趣，並能展示基本技能。 \n\n要求： \n\n1. 通過本會之遊泳測試。 \n\n2. 完成下列其中一項： \n\n   - a..考獲香港滑浪風帆會兒童滑浪風帆體驗證書或同等資歷。 \n\n   - b. 考獲中國香港帆船運動總會少年帆船課程第一級證書或同等資歷。 \n\n備註： \n\n- ❖ 此章之課程以該項運動之所屬總會所頒佈的最新課程為依歸。 \n\n63\n\n<!-- p.65 -->\n# 水手章 \n\n目的： 讓幼童軍初步理解海上知識，並通過相關實習，培養對水上活動 的興趣，並能展示基本技能。 \n\n要求： \n\n#### 完成以下各項： \n\n1. 通過本會之遊泳測試。 \n\n2. 理論及實習︰ \n\n   - a..認識本會轄下海上活動中心所使用的訊號旗及明瞭其用途。 b..明瞭本會轄下海上活動中心之「海上活動中心守則」及「水上安全守則」。 \n\n   - c..知曉如何獲取天氣預告及明瞭其用途。 \n\n   - d..明瞭風、潮汐、水流對進行海上活動的影響。 \n\n   - e. 指出童軍標準艇所需裝備及各部分名稱。 \n\n   - f.  船上拋擲救生繩至距離 8 公尺外之物體。 \n\n   - g. 以單槳單獨搖動一小艇至一件距離 10 公尺的物體，並把它拾起。 \n\n   - h. 示範下列各種繩結及明瞭其用途︰ \n\n      - (i) 8 字結  Figure-of-Eight Knot \n\n      - (ii) 接繩結  Sheet Bend \n\n      - (iii) 雙接繩結 Double Sheet Bend \n\n      - (iv) 錨結 Anchor Hitch \n\n      - (v) 稱人結 Bowline \n\n      - (vi) 繫木結 Round-Turn and Two Half Hitches \n\n      - (vii) 雙套結 Clove Hitch \n\n      - (viii) 普通繩端結 Common (Ordinary) Whipping \n\n64\n\n<!-- p.66 -->\n# 運動章 \n\n目的： \n\n鼓勵幼童軍主動認識運動技能及安全守則，以培養他們平日做運 動的興趣及習慣。 \n\n要求： \n\n完成以下各項： \n\n1. 認識兩種運動的基本資料，包括其玩法、基本規則、所需裝備及相關安全事項。 \n\n2. 對上列其中一項有專門技能及知識，並經常參加該項活動。 \n\n3. 知曉如何保養第 2 項所選之運動其所需用具及服裝。 \n\n4. 在所有幼童軍的遊戲及活動中表現出良好的體育精神。 \n\n5. 明瞭運動後保持個人清潔及更衣的重要性，並認識運動時保護身體各部位（例如足部）的重要 性。 \n\n65\n\n<!-- p.67 -->\n# 游泳章 \n\n目的： 考覈幼童軍的游泳技能。 \n\n<!-- Start of picture text -->\n初級  中級 高級<br><!-- End of picture text -->\n\n要求： \n\n#### 初級 \n\n完成以下各項： \n\n1. 從池畔跳水或用其他方式跳入水中。 \n\n2. 呼吸練習。 \n\n3. 俯浮滑進。 \n\n4. 仰浮滑進。 \n\n5. 俯浮划水 10 米。 \n\n6. 仰浮划水 10 米。 \n\n7. 拯溺式背泳 10 米。 \n\n8. 用胸泳或捷泳或背泳遊 25 米。 \n\n中級 \n\n完成以下各項： \n\n1.     用一種泳式，從池之淺水處向深水處遊 25 米，再踏水 1 分鐘。 \n\n2.     潛水大約 1.25 米深，身體不能觸到水底或池。 \n\n3.     冬菇式浮水。以任何前泳式橫越，在半途翻身以任何背泳式游完全程。 \n\n4.     插（潛或滑）水至一個最遠的距離。 \n\n5.     以正確比賽姿態開始，用胸泳或蝶泳遊 25 米。 \n\n#### 高級 \n\n完成以下各項： \n\n1. 保持身體垂直，踏水 3 分鐘。 \n\n2. 游泳 200 米，途中潛水一次，並潛泳最少 5 米。 \n\n3. 不需用扶梯、別人的協助等從泳池深水一端爬上池畔。 \n\n4. 以良好站立姿態跳起，騰空及插入水中。 \n\n66\n\n<!-- p.68 -->\n# 世界友誼章 \n\n#### 目的： 讓幼童軍對世界童軍有更多認識。 \n\n要求： \n\n完成以下各項： \n\n1. 以不少於四個月的時間，完成一剪貼簿，內容關於世界童軍組織內其中一個國家╱地區童軍組 織的民族生活方式、食物特色及風俗習慣等。 \n\n2. 略知聯合國的組織、歷史、旗幟及其意義。 \n\n3. 能向領袖列舉十個香港以外屬世界童軍組織的國家╱地區童軍組織，並知道其中三個國家╱地 區旗幟的意義。 \n\n4. 曾與外國童軍通訊最少兩次。 \n\n67\n\n<!-- p.69 -->\n# 其他獎章 \n\n目的： 培養幼童軍靈性的發展。 \n\n要求： \n\n# 宗教章 \n\n以下其中一項課程進行研習。 \n\n基督教課程 \n\n1. 背誦主禱文。 \n\n2. 唱聖詩三首。 \n\n3. 能敘述聖經故事兩則，其一為耶穌降生故事。 \n\n4. 背誦並略加解釋自選金句三則。 5. 在幼童軍度假營中負責一次謝飯禱告；或為一位有病未能出席團集會的幼童軍禱告。 \n\n孔教課程 \n\n1. 尊重中國傳統文化和儒教思想。 \n\n2. 能念誦《禮運‧ 大同》篇。 \n\n3. 能唱《孔聖頌》。 \n\n4. 能在團集會 / 小隊露營講述孔子生平故事兩則。 5. 每年拜祭祖先、天地。 \n\n6. 參與傳統祭禮時，認識並遵守有關禮儀。 \n\n7. 曾參觀孔教團體和傳統廟宇。 \n\n#### 佛教課程 \n\n1. 能唱佛寶歌。 \n\n2. 能誦佛號。 \n\n3. 能講述悉達太子降生故事。 \n\n4. 能背誦五戒文。 \n\n5. 能參加浴佛禮。 \n\n6. 備有佛像圖或佛章。 7. 遇見佛教法師時能合什行禮及作尊稱。 \n\n#### 天主教課程 \n\n1. 擁有一本《聖經》或《福音》，並明白如何使用。 \n\n2. 明白《若望福音》第十三章 34 至 35 節。 \n\n3. 舉例說明自己曾經實踐《瑪竇福音》第二十五章 35 至 40 節。 \n\n4. 能劃十字聖號及誦念天主經。 \n\n5. 明白在聖堂之正確態度。 \n\n6. 說出教宗及教區主教的姓名。 \n\n7. 明白教友對主日的本份及曾經參與最少一次彌撒。 \n\n8. 能詠唱聖歌一首。 \n\n伊斯蘭教課程 \n\n68\n\n<!-- p.70 -->\n1. 擁有一本《古蘭經》（中文譯本）及明白如何使用。 \n\n2. 背誦及明白清真言︰「萬物非主，唯有真主，穆罕默德，是主差使」。 \n\n3. 明白伊斯蘭的意義是和平、順從。 \n\n4. 明白念、禮、齋、課、朝五功的意義。 \n\n5. 說出全世界穆斯林信徒的數目。 \n\n6. 說出香港各間清真寺的位置。 \n\n#### 道教課程 \n\n1. 能誦《太上道祖頌》。 \n\n2. 擁有一本《道德經》。 \n\n3. 能誦《道德經》首章。 \n\n4. 能辨認「太上道祖」像。 \n\n5. 認識「道家三寶」。 \n\n6. 能解釋「七善」的意義。 \n\n7. 曾參觀一間道教宮觀。 \n\n69\n\n<!-- p.71 -->\n# 童軍先修章 \n\n簡介： \n\n童軍先修章之設立旨在強化幼童軍支部及童軍支部的連接，幫助 適齡之幼童軍支部成員認識童軍支部活動，吸引年長的幼童軍成 員多參與幼童軍時從未體驗過的童軍活動，並藉此鼓勵他們晉升 為童軍。 \n\n年滿十歲半之幼童軍支部成員可考取童軍先修章，完成後由其幼童軍團長簽發。在特殊情況下，可 由區、地域或總會委派指定人士簽發。幼童軍團領袖應鼓勵及安排團內之成員認識及參與童軍支部 活動。區總監或其代表有責任協助區內之幼童軍團推行先修章考覈，尤其是沒有開辦童軍團或因事 未能安排有關活動之童軍旅。 \n\n完成以下各項： \n\n1. 認知 \n\n完成下列各項： \n\n   - a. 認識童軍支部的目的及方法。 \n\n   - b. 認識童軍制服。 \n\n   - c. 認識童軍支部的小隊制度。 \n\n   - d. 認識童軍團的獎章制度。 \n\n2. 參與 \n\n在幼童軍團長及童軍團長同意下，由一位童軍團的團隊長／隊長帶領下，.一同參與不少於兩 次童軍團的集會。 \n\n3. 新體驗 \n\n在幼童軍團長及童軍團長同意下，由一位童軍團的團隊長／隊長帶領下，參與一項於幼童軍時 從未體驗過的童軍活動。 \n\n獲得童軍先修章之成員，可直接豁免金紫荊獎章內童軍家庭 4.4.1 d 項。 \n\n佩戴期限 \n\n幼童軍成員考獲童軍先修章後，即可佩戴於制服上，直至成為童軍後一年。 \n\n70\n\n<!-- p.72 -->\n# 第四章 –各級徽章評核及簽發程序 \n\n#### 各級徽章評核 \n\n幼童軍支部所有徽章均由幼童軍團長，或由總會、地域或童軍區訓練班班領導人委任合適人士協助 教授或考驗，幼童軍團長或班領導人有最終決定及簽發權，請見下圖表： \n\n<!-- Start of picture text -->\n在幼童軍團<br>幼童軍 申請報考 或 已擁有相關課程資歷證明<br>安排備有相關課程知識及 檢視證明是否達到本會課程要求<br>幼童軍團長<br>資歷人士協助 否 是<br>備有課程相關知識<br>教授及考驗<br>及資歷人士<br>幼童軍團長 簽發相關證書及更新幼童軍紀錄冊<br>在總會／地域／童軍區舉辦的訓練班<br>幼童軍 參加有關幼童軍活動徽章訓練班 或 參加其他項目/活動訓練班<br>總會／地域／童軍區訓練班<br>安排備有相關課程知識及資歷人士協助<br>班領導人<br>備有課程相關知識<br>教授及考驗<br>及資歷人士<br>總會／地域／童軍區訓練班<br>簽發幼童軍活動徽章證書 頒發訓練班證書或通知所屬單位成績<br>班領導人<br>幼童軍團長 簽發/更新幼童軍紀錄冊內相關課程項目<br><!-- End of picture text -->\n\n由於部份徽章內容涉及專業知識及安全防護規定，當幼童軍團長或班領導人安排教授及考驗時，建 議尋求備有相關知識及資歷之人士協助。有關本會之教練 / 審核員名單，可瀏覽本會網頁 http://www.scout.org.hk。 \n\n在籌劃徽章教授及考驗時，幼童軍團長或班領導人必須盡早作出周詳計劃及準備，並且恪守本會活 動安全指引之規定進行，詳情請瀏覽本會網頁 http://www.scout.org.hk。 \n\n#### 各級徽章簽發 \n\n|徽章名稱|簽發單位|簽發人士|\n|---|---|---|\n|1.會員章<br>1. 幼童軍體驗章／<br>2. 幼童軍歷奇章／<br>2. 幼童軍高級歷奇章|幼童軍團|幼童軍團長|\n|2.金紫荊奬章|總會|青少年活動總監|\n|3.童軍先修章|幼童軍團|幼童軍團長|\n|4.幼童軍活動徽章|幼童軍團 或<br>總會／地域／童軍區訓練班|幼童軍團長 或<br>總會／地域／童軍區訓練班<br>班領導人|\n\n71\n\n<!-- p.73 -->\n|徽章名稱|簽發單位<br>簽發人士|\n|---|---|\n|5.積極公民獎章|幼童軍團 或<br>總會／地域／童軍區<br>幼童軍團長 或<br>區總監／助理區總監（幼童軍）或<br>副地域總監／助理地域總監（支部）<br>／地域總部總監（幼童軍）／<br>助理地域總部總監（幼童軍）或<br>青少年活動總監／副青少年活動總監<br>／助理青少年活動總監（支部）／<br>總部總監（幼童軍）／<br>助理總部總監（幼童軍）|\n|6.地球部落計劃獎章|總會<br>青少年活動總監|\n|徽章名稱|各級徽章領取／購買方法<br>領取／購買方法|\n|1.會員章||\n|2.隊長／副隊長章|在童軍物品供應社發售，購買時無須出示任何文件。|\n|3.服務年星||\n|4.幼童軍體驗章／<br>2. 幼童軍歷奇章／<br>2. 幼童軍高級歷奇章|在童軍物品供應社發售，購買時須出示由幼童軍團長簽署及蓋上旅／<br>幼童軍團印章之「幼童軍進度性獎章證書」正本。<br>註|\n|5.金紫荊奬章|由青少年活動署送贈。童軍物品供應社代為派發，領取時須出示由地<br>域發出之恭賀信正本及有效幼童軍紀錄冊。|\n|6.童軍先修章|在童軍物品供應社發售，購買時須出示由幼童軍團長簽署及蓋上旅／<br>幼童軍團印章之「童軍先修章證書」正本。<br>註|\n||在童軍物品供應社發售，購買時須出示由幼童軍團長／班領導人簽署|\n|7.幼童軍活動徽章|及蓋上總部／地域／童軍區／旅／幼童軍團印章之「幼童軍活動徽章<br>證書」正本。<br>註|\n|8.積極公民獎章／<br>2. 地球部落計劃獎章|在童軍物品供應社發售，購買時須出示由青少年活動署發出之購買證<br>明電郵。<br>註|\n\n註：每張證書／獲獎證明最多可購買徽章 2 枚，童軍物品供應社職員會於證書／獲獎證明背面蓋印 章證明已出售布章予該證書持有人。 \n\n有關幼童軍支部各級徽章簽發方法指引，請參閱附件；另外，證書列印格式可以在本會網頁 http://www.scout.org.hk 下載。 \n\n72\n\n<!-- p.74 -->\n# 第五章 –典禮與儀式 \n\n全世界童軍成員都採用相同的禮儀，每個禮儀都有特定的意義，應在適當的場閤中使用。 有關步操詳盡資料，可參閱《步操手冊》。 \n\n#### 童軍敬禮 \n\n敬禮儀式 — 全禮。 \n\n手號：舉起右手掌心向前，拇指按尾指，中間的食指，中指及無名指靠緊豎直。行禮時，必須用右 手和立正。這是一個表示友善的招呼和尊重的禮儀。 \n\n動作：保持立正姿勢，將右手保持伸直向身體右邊最遠處平伸至膊頭平，然後做出童軍手號，接著 摺曲手肘，直至食指至右眼球對上 2 釐米位置，手掌心向前，要注意手指、手腕及前臂成一直線， 身體其餘各部份仍保持立正向前姿勢。 \n\n童軍敬禮中伸直的三隻手指提醒成員在誓詞中對神明、對國家盡責任和幫助別人的誓詞，拇指按尾 指表示扶助弱小。 \n\n#### 童軍半禮 \n\n童軍半禮和童軍敬禮的手號相同，分別在於手的位置放在肩膊高，手指向上。 童軍半禮只在宣誓和覆誓時應用。 \n\n#### 握手禮 \n\n童軍成員以左手握手。 \n\n起源：貝登堡在南非當兵時，他看見很多部落土人的酋長右手持矛、左手持盾。當他向你表示友好 和信任時，他們會放下左手的盾和你握手，對自己是毫無防禦的。我們和其他人用左手握手 也是這個意思。 \n\n#### 注目禮 \n\n注目禮是用目光和微笑向其他童軍成員表示友善。 \n\n#### 團呼 \n\n意義：團呼是幼童軍向亞基拿致敬的儀式。每次團集會開始和完結時，幼童軍 都會向團長做一個團呼，以表示對團長招呼和感謝的意思。 \n\n動作：亞基拿（團長）站定（面向旗桿）並大聲喊叫︰「Pack Pack Pack」。 \n\n全體幼童軍們回應︰「Pack」一聲，然後齊跑向發令之亞基拿。以他為中心， 拖手圍成一圓圈，立正。當中值日小隊長位置應面向亞基拿，其它成員依各小 隊順序排列成一個圓圈，各人面向圓心。 \n\n完成後亞基拿雙手齊肩平放，然後放下時，全體幼童軍蹲下，裝成一隻隻小狼的樣子，齊聲高呼︰ 「Akela, we'll do our best!」（亞基拿，我們要努力！） 然後立正；（此時，未宣誓的成員只需退後一 步立正）。 \n\n值日小隊長呼叫︰「Cubs! Do your best!」（你們要努力！） 這時全體幼童軍跟著隊長一起向亞基拿敬禮，齊聲高呼「We WILL do our best!」（我們一定要努力！） \n\n亞基拿會回禮，然後和值日小隊長握手，表示多謝他領導團呼後，整個儀式便結束了。 \n\n73\n\n<!-- p.75 -->\n#### 展旗 \n\n在團呼後，幼童軍團便會開始展旗儀式。 \n\n展旗禮所用的旗幟視乎場合而定，一般的團集會用的是幼童軍團團旗，全旅集會用旅旗。 \n\n展旗時，全體幼童軍及領袖面向旗幟，值日小隊長走近旗桿，然後拉鬆一條預先縛好的繩子，讓旗 幟自由地隨風飄揚。 \n\n在旗幟展開後，值日小隊長會向旗幟行敬禮，所有領袖也同時向旗幟行敬禮，其他幼童軍則只需立 正、注視旗幟便可。 \n\n#### 降旗 \n\n在團集會完結時，幼童軍亦會進行團呼，之後大家會面向旗幟，由值日小隊長走近旗桿，徐徐把旗 降下，降旗後不必再行敬禮。 \n\n#### 口號及集隊 \n\n\"Pack\" — 這口號是要所有幼童軍留心領袖的命令。所有幼童軍要立即全神貫注地留意領袖下一部分 的指令。 \n\n立正 **(ALERT)** — 雙手握拳、緊貼大腿兩側；雙腿緊貼一起，腳跟緊貼，腳尖向外分開與中線成 30 度，膝和腰不要彎，挺起胸膛、目光向前，精神奕奕。 \n\n\"Pack ALERT\" — 意思是要幼童軍們全體立正。如果，當時是在休息的姿勢，應立即提起左腳緊貼右 腳腳跟，雙手同時要伸直緊貼大腿，成為立正姿勢。 \n\n稍息 **(At EASE)** — 兩腿分立至肩膊的寬度，雙手貼在身後中央的位置，用左手握著右手。 \n\n\"Pack At EASE\" — 在聽到這個口號後，左腿向左移動，成稍息位置，注意右腿不要同時移動。同時 提起雙手放在腰部，右掌疊於左掌手，注意手和腳要同時移動。 \n\n#### **Pack, Fall IN —** 集隊 \n\n留意領袖的手號，雙手握拳向前直伸。 \n\n是要幼童軍們列成縱隊。小隊長會站在隊的最前方，隊副長則會站在最後，其他隊員需要依照領袖 或小隊長安排的位置排列，留意對齊前方及右面的其他隊員位置站好。站立時要立正，直至全體隊 員站好，領袖把手放下，幼童軍們自動成為稍息的站立姿勢。 \n\n**Pack, Fall OUT —** 解散 \n\n從立正的姿勢，向右轉然後解散。 \n\n**Pack, DISMISS —** 散會 \n\n從立正的姿勢，向右轉、敬禮，待領袖回禮後，全體便可散去。 \n\n74\n\n<!-- p.76 -->\n#### 許諾（宣誓禮） \n\n宣誓禮是成員參加幼童軍運動的一個非常重要的儀式。在這個儀式當中，新加入的成員將會許諾成 為一個幼童軍，成為世界童軍成員的一份子，並且願意承擔作為一個童軍成員的責任。 \n\n新成員會在團員及團長面前，親口許下這個承諾。亞基拿可以邀請成員的家長，也會邀請旅長或主 辦機構的負責人（例如成員的校長）來參加這個儀式。 \n\n在成員正式參與這個儀式之前，亞基拿會教導成員這個儀式的一切步驟，也許要經過多次的練習， 以確保這個儀式能夠順利進行。 \n\n#### 宣誓儀式 \n\n小隊長會帶領新成員到亞基拿面前，告訴亞基拿新成員已準備好做一個幼童軍。 亞基拿 ︰ 「你願意成為幼童軍嗎？」 \n\n新成員 ︰ 「亞基拿，我願意。」 \n\n亞基拿 ︰ 「你知道甚麼是幼童軍規律嗎？」 \n\n新成員 ︰ 「我知道。幼童軍，盡所能，先顧別人才顧己，日行一善富精神。」 \n\n亞基拿 ︰「你現在準備好宣誓嗎？」 \n\n新成員 ︰「亞基拿，我已經準備好。」 \n\n亞基拿 ︰「Pack，請舉起你們的右手，一齊行半禮。」 \n\n這時，所有已經宣誓的童軍人士都一起行半禮。 \n\n亞基拿會帶領新成員一句一句地背誦幼童軍誓詞。背誦誓詞後， \n\n亞基拿︰「我相信你會盡你所能，堅守你的許諾。你現在已成為世界童軍的一份子了。」 亞基拿為新成員佩上會員章，旅長亦會為新成員佩上旅巾。新成員向亞基拿敬禮後，向後轉，再向 全體隊員敬禮，然後回到隊伍中立正站好。 \n\n如果有其他新隊員也在同一天宣誓者，在其他新隊員宣誓後，整個宣誓儀式便完結了。 \n\n75\n\n<!-- p.77 -->\n# 附錄一：會員章 – 保護童軍成員免受傷害 \n\n認識基本措施去保護自己及夥伴免受傷害。 \n\n內容建議： \n\n- ➢ 認識個人界線及尊重他人的身體界線 \n\n- ➢ 學習辨識潛在危險情境（如：獨自與陌生人相處） \n\n- ➢ 明白夥伴之間應有的尊重與安全行為 \n\n- ➢ 若發現自己或夥伴有遇到困擾，要勇於說出並尋求協助 \n\n#### 教育活動例子： \n\n- ➢ 「界線在哪裡？」貼紙活動：領袖可準備一張人體輪廓圖，讓幼童軍用不同顏色貼紙標示「自己 不喜歡別人觸碰的地方」及「可接受的互動」，並分享理由，學習尊重自己與他人的身體界線。 \n\n- ➢ 安全情境小劇場：分組演出幾個日常情境（如：獨自在升降機遇見陌生人、朋友推撞打鬧過頭 等），並討論哪些行為安全、哪些需要說「不」、如何求助等。 \n\n- ➢ 危機判斷遊戲「我會怎樣做？」：以卡牌或口頭情境形式出題，例如：「放學後有陌生人說媽媽 叫他來接你」或「有人說想要跟你單獨說個祕密」，讓幼童軍輪流說出處理方法。 \n\n- ➢ 「我是好隊友」任務挑戰：安排一系列需要夥伴合作、尊重與安全互動的任務（如雙人背靠背運 球、眼罩引導行走等），體驗良好夥伴互動及互相照顧的重要性。 \n\n- ➢ 「說出來不怕」故事分享時間：領袖或安排隊員輪流講述曾經遇到困擾或看到不公平對待的經驗 （可使用虛構例子），並討論「向誰求助」及「說出來的勇氣」。 \n\n- ➢ 「安全大使」徽章工作坊：透過完成指定任務（例如：說出3 個求助對象、識別2 個危險情境、 模擬求助說話等）獲得自製「安全大使」徽章，提升參與及責任感。 \n\n- ➢ 尊重界線海報設計比賽：分組設計「尊重自己和別人的界線」主題海報，例如標語：「朋友之間 要說得清楚」、「不想被碰，就可以說不」，鼓勵表達與尊重。 \n\n- ➢ 「安全與不安全」分類卡遊戲：提供各種互動情境卡（例如：朋友搶你東西、別人要你保守祕密、 老師讚賞你表現），讓幼童軍判斷哪些是「安全」或「不安全」，並說出原因。 \n\n- ➢ 「保護我和你」規則書創作：小隊共創一本屬於自己的「安全守則小冊子」，列出自己對安全、 界線、互動的理解與建議，最後由各隊分享作品。 \n\n- ➢ 小任務卡片-安全任務一週挑戰：發給每位幼童軍「每日小任務卡」，如「今天我勇敢地說了不」、 「我幫助了一位同學處理衝突」、「我主動關心了一位朋友」，鼓勵日常實踐。 \n\n76\n\n<!-- p.78 -->\n# 附錄二：幼童軍支部郊野守則 \n\n為嚮應聯合國倡議的可持續發展目標中的氣候行動（Climate Action），並配合世界童軍組織所推動 的世界童軍環境教育計劃，本會自2014 年開始推動不留痕郊野活動守則，成員透過學習及身體力行， 維護美好的大自然環境。 \n\n由2019 年起，幼童軍支部已修訂為以下之新郊野守則內容，使各成員及領袖在郊野進行活動時，能 更明瞭自然環境保育的重要性。郊野守則如下： \n\n1. 行前做好準備 Know Before You Go 2. 選擇適當路徑 Choose The Right Path 3. 妥善處理廢物 Trash Your Trash 4. 保持原有風貌 Leave What You Find 5. 小心使用火種 Be Careful With Fire 6. 尊重野生動物 Respect Wildlife 7. 友善對待他人 Be Kind To Other Visitors \n\n闡釋如下： \n\n#### 1. 行前做好準備 Know Before You Go \n\n- 事前做好計劃，減少對環境造成的影響，並確保活動能安全進行。 \n\n      - 預先蒐集旅程目的地的最新資訊，並帶備地圖，減低迷路風險。 \n\n- 認識本地郊野公園的守則，能更有效地保護郊野環境。 \n\n   - 參考漁農自然護理署《良好的處理方法》。 \n\n- 視乎天氣選擇適當衣物，保持身體乾爽、溫暖或免被曬傷。 \n\n- 經常帶備急救包，以應不時之需。 \n\n#### 2. 選擇適當路徑 Choose The Right Path \n\n- 遠足時盡量使用主要路徑或現有山徑，不要抄捷徑。 \n\n   - 開拓新路徑會對植物造成傷害及導致水土流失。 \n\n   - - 受傷的植物或許永遠不會再生長出來。 \n\n- 如需在郊野度宿，應使用政府指定露營地點。 \n\n   - 紮營時，應避開小樹及花朵，減少對環境造成破壞。 \n\n#### 3. 妥善處理廢物 Trash Your Trash \n\n- 自己帶來的垃圾，自己帶走（Pack it in, pack it out）。 \n\n      - 即使是「可被降解的」果皮或食物碎屑，亦不可隨處丟棄。 \n\n- 幫忙拾起地上的垃圾（即使是別人留下的）。 \n\n   - 亂拋垃圾不但破壞景觀，且會滋生蚊蟲及細菌。 \n\n77\n\n<!-- p.79 -->\n#### 4. 保持原有風貌 Leave What You Find \n\n- 盡可能維持造訪地點的原來樣貌，不帶走不屬於自己的物品。 \n\n- 假如每人都任意摘下一朵花，或拿走一塊石頭，其他遊人將沒法欣賞郊野的原貌。 \n\n- • 只帶走照片，僅留下足印。 \n\n   - 拍照不會破壞環境，是留下美好事物的最佳方式。 \n\n#### 5. 小心使用火種 Be Careful With Fire \n\n- 事前先確認活動地點的生火規定，並使用指定的生火地點。 - 如須使用柴、炭生火，亦應減少明火時間。 \n\n- - 使用現成木炭比即場採集柴枝為佳；如須在地採集，則應選已倒在地上的枯木。 \n\n- 盡量以輕便爐具代替柴火煮食。 \n\n- 用火後必須確認火種完全熄滅纔可離開。 \n\n   - 不加約束的火種往往對自然環境造成嚴重而持久的破壞。 \n\n   - 任何情況下，不可留下無人看管的火苗。 \n\n- 不可燃燒垃圾或廚餘。 \n\n   - 燃燒垃圾不但破壞環境，還有可能觸犯法例。 \n\n#### 6. 尊重野生動物 Respect Wildlife \n\n- 觀賞野生動物時，應保持一定距離。 \n\n   - 郊野是不同野生動物的家園，我們不應主動接近、騷擾或跟隨牠們。 \n\n- 不要餵飼野生動物或留下廚餘。 \n\n   - 野生動物會因依賴人類餵飼而失去覓食本能。 \n\n   - 在郊野公園範圍內餵飼野生動物會觸犯法例。 \n\n- 管理好同行的寵物。 \n\n   - 把寵物帶到郊野時，必須用帶子牽着，並帶備膠袋包走排泄物，以免對野生動物造 成騷擾。 \n\n#### 7. 友善對待他人 Be Kind To Other Visitors \n\n- 遇上其他遊人時，應表現出良好禮儀，如友善地問好。 \n\n- 收聽音樂或廣播時，應使用耳機。 \n\n- 說話時盡量將音量收細，避免影響其他遊人。 \n\n   - 靜下來時，更易享受大自然的聲音。 \n\n- 尊重當地居民的私隱及財產，不要亂闖私人土地。 \n\n78\n\n<!-- p.80 -->\n# 附錄三：童軍支部「童軍探索獎章」與幼童軍支部各級徽章 豁免考驗安排 \n\n為讓幼童軍支部成員晉升童軍支部後，毋須重複進行已接受的訓練，以及配合新《童軍訓練綱要》 及新「金紫荊獎章」課程之推行，由即日起，所有現役之童軍支部成員如採用新考覈制度，其在幼 童軍階段完成的指定考驗項目，於晉升童軍支部後可獲童軍團長豁免考驗「童軍探索獎章」內相關 項目，可獲豁免的內容如下表列。 \n\n|幼童軍支部<br>已完成的幼童軍金紫荊獎章<br>各個範疇課程|童軍支部<br>可獲豁免的「童軍探索獎章」考驗<br>（新《童軍訓練綱要》）|\n|---|---|\n|核心範疇 - 童軍技能||\n|3.1.3 露營 或 露營章|A. 戶外挑戰 - 1. 營藝 a-d|\n|3.1.4 認識地圖及指南針 或 探險章|A. 戶外挑戰 - 2. 歷險 a|\n|3.1.5 遠足 或 探險章|A. 戶外挑戰 - 2. 歷險 b-c|\n|3.1.5 遠足 或 探險章|A. 戶外挑戰 - 4. 戶外活動 a|\n|核心範疇 - 關己愛人||\n|3.2.1 急救知識 或 急救章|D.社會責任 - 1. 服務他人 a|\n|核心範疇 - 國家與社區||\n|3.3.2 社區緊急服務設施|D.社會責任 - 2. 社區認識|\n|核心範疇 - 童軍家庭||\n|3.4.2 誓詞和規律|C. 領袖修養 - 2. 靈性發展 a|\n|興趣範疇 - 運動與愛好||\n|公園定向章|A. 戶外挑戰 - 4. 戶外活動 b ii|\n|游泳章、水手章、獨木舟章、滑浪風帆章<br>（其中一個）|A. 戶外挑戰 - 5. 海上活動|\n|運動章、體適能章、田徑章、射箭章、游泳<br>章、水手章、獨木舟章、滑浪風帆章<br>（其中一個）|B. 身心創藝 - 1. 身心健康|\n|興趣範疇 - 科學與大自然||\n|氣象章|D.社會責任 - 4. 氣象|\n\n童軍支部成員須向所屬童軍團長提交有關證明以便核實，而童軍團長擁有最終決定權，並有權要求 該等成員進行示範，以確認其技能水平。 \n\n79\n\n<!-- p.81 -->\n# 附錄四：幼童軍活動指引 \n\n通告編號 日期 通告名稱 政策通告第06/2025 號 01/06/2025 保護童軍成員免受傷害政策 政策通告第02/2022 號 1/8/2022 《青少年活動政策》 行政通告第07/2025 號 1/4/2025 「公眾責任保險」及「團體人身意外保險」 活動指引第03/2018 號 1/1/2018 安全使用酒精／火酒作為燃料 活動指引第04/2018 號 1/1/2018 惡劣天氣及空氣污染應變措施 活動指引第05/2018 號 1/1/2018 戶外活動安全要則及須知 活動指引第07/2018 號 1/1/2018 童軍海上活動安全指引 活動指引第08/2018 號 1/1/2018 預防禽流感 活動指引第09/2018 號 1/1/2018 預防流行性感冒 活動指引第10/2018 號 15/8/2018 預防蚊患措施 活動指引第01/2020 號 8/1/2020 預防肺炎及呼吸道傳染病 活動指引第02/2020 號 24/1/2020 預防肺炎及呼吸道傳染病（二） 活動指引第02/2021 號 15/10/2021 童軍活動的意外通報指引 青少年活動通告第19/2015 號 15/2/2015 海上活動中心旗號修訂 \n\n80\n\n<!-- p.82 -->\n# 附錄五：森林故事 \n\n### 《森林故事》簡介 \n\n《森林故事》是英國作家吉百齡 (Rudyard Kipling) 先生所作。童軍運動創始人貝登堡勳爵選用這故 事作為幼童軍團活動的背景，是以適應八至十一歲兒童的個性和富幻想的心理，藉故事中人物毛 吉利的事蹟，教導幼童軍學習勇敢、機智、不怕困難、能面對挑戰的精神。 \n\n### 人物介紹 \n\n#### 亞基拿 (Akela) \n\n狼羣的領袖。牠在森林裏組織一個有紀律，有 秩序的狼社會，並訂立森嚴的規律來約束狼羣 的行為。 \n\n#### 毛吉利 (Mowgli) \n\n樵夫的孩子，因為小時候被施亞汗襲擊，被遺 棄在森林中，由母狼撫養成長。母狼叫他毛吉 利，意思是「小青蛙」。毛吉利是一個勇敢的小 狼。 \n\n#### 駱石 (Raksha) \n\n母狼。牠收養了毛吉利，並且把他當作親生兒 子，是一位慈祥的母親。 \n\n白勞 (Baloo) \n\n棕熊，是毛吉利的導師，教授毛吉利森林的規 律。 \n\n白基拿 (Bagheera) \n\n黑豹，是毛吉利的導師，教授毛吉利森林的求 生技能。牠也是毛吉利的好朋友，常常幫助毛 吉利解決困難。 \n\n施亞汗 (Shere Khan) \n\n牠是殘忍的大老虎。牠有銳利的牙齒和爪。施 亞汗是森林自由世界的大敵人，因為牠殺死農 人的牛隻，這樣獵人便會到森林來獵殺野獸， 破壞了森林的安寧。 \n\n81\n\n<!-- p.83 -->\n哈蒂 (Hathi) \n\n仁慈而強壯的大象。牠是森林的統治者，牠警 告施亞汗，如果殺死一個人，將會為森林帶來 災難。 \n\n施露 (Chil) \n\n鳶鳥。牠有銳利的眼睛，是一個很好的獵人。 牠看見賓迪洛（猴子們）擄去毛吉利，把這消 息帶給白基拿及白勞，好使他們能拯救毛吉 利。 \n\n卡 (Kaa) \n\n大蟒蛇，牠本性善良，行動緩慢。牠幫助白勞 及白基拿拯救被猴子擄去的毛吉利。 \n\n賓迪洛 (Bandar-log) 一羣擾攘不停的猴子，牠們不會工作，只顧玩 耍，牠們也不守森林規律。 \n\n### 故事內容 \n\n請參閱幼童軍天地，或閱讀原著。 \n\n82\n\n<!-- p.84 -->\n# 附錄六：香港總監挑戰盾 \n\n### 簡介 \n\n「香港總監挑戰盾」為全港性幼童軍支部之錦標賽，自1970 年創立以來，透過歡愉而富挑戰性的比 賽項目，讓各幼童軍團得以交流和切磋。 \n\n### 歷屆總冠軍隊伍 \n\n|年份|旅團|\n|---|---|\n|2026年|港島第10旅|\n|2024年|港島第1旅|\n|2018年|沙田南第59旅|\n|2015年|港島第229旅|\n|2012年|港島第15旅|\n|2010年|港島第99旅|\n|2008年|港島第15旅|\n|2006年|港島第15旅|\n|2004年|港島第15旅|\n|2002年|港島第15旅|\n|2000年|港島第15旅|\n|1998年|港島第99旅|\n|1996年|港島第15旅|\n|1994年|港島第99旅|\n|1992年|港島第15旅|\n|1990年|港島第99旅|\n|1988年|港島第99旅|\n|1986年|港島第17旅|\n|1983年|港島第16旅|\n|1981年|九龍第17旅|\n|1979年|九龍第212旅|\n|1978年|東九龍第232旅|\n|1977年|十八鄉第16旅|\n|1975年|十八鄉第5旅|\n|1974年|港島第146旅|\n|1973年|九龍第224旅|\n|1972年|九龍第120旅|\n|1971年|十八鄉第19旅|\n|1970年|荃灣東第20旅|\n\n83\n\n<!-- p.85 -->\n# 鳴謝 \n\n此新修訂之幼童軍訓練綱要得以面世，實有賴以下人士之鼎力幫助，謹此向他們致謝。 \n\n黎偉生博士, IMSM 香港總監 \n\n陳勇先生 副香港總監（活動與訓練） 吳家亮先生 副香港總監（常務） 陳狄安先生, MH 助理香港總監（青少年活動） 盧沛霖先生 支部訓練檢討委員會主席 張俊彥先生 副青少年活動總監（支部） 邵鈞泰先生 助理青少年活動總監（支部） \n\n支部訓練檢討 **–** 幼童軍支部小組 \n\n林  煒先生 （主席） 青少年活動署總部總監（幼童軍） 李海權先生 （副主席） 青少年活動署助理總部總監（幼童軍） 李寶瓊女士 九龍地域地域總部總監（幼童軍） 陳木談先生 東九龍地域地域總部總監（幼童軍） 李文艷女士 新界地域地域總部總監（幼童軍） 黃志升先生 港島地域地域總部總監（幼童軍） 翁智恆先生 新界東地域地域總部總監（幼童軍） 許  俊先生 青少年活動署助理總部總監（深資童軍） 蘇駿賢先生 銀禧區助理區總監（幼童軍） 曾芷晴女士 青少年活動署助理總部領袖 李梓健先生 第一屆青年事務諮議會委員 翻譯工作 蘇駿賢先生 銀禧區助理區總監（幼童軍） 任子淳女士 青少年活動署助理總部領袖 設計工作 李海權先生 青少年活動署助理總部總監（幼童軍） \n\n84\n","02_支部訓練綱要/01 小童軍活動指引(第三版).md":"---\nsource_file: \"01 小童軍活動指引(第三版).pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 40\npages_ocr: 2\nocr_avg_score: 0.961\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\nHONG KONG | 小童軍\n| --- | --- |\n香 | 港\n\n活動指引\n\n<!-- p.2 -->\n# `小童軍活動指引` \n\n```\n香港童軍總會\n```\n\n1987 `年：第一版` 2009 `年：第二版` 2026 `年：第三版` \n\n```\nP.1\n```\n\n<!-- p.3 -->\n```\n序\n```\n\n`小童軍支部是童軍運動的起點。` 4 `至` 7 `歲的兒童正處於建立自我概念、情緒表達 及基本社交能力的關鍵時期，透過合適而有系統的引導，有助他們在安全、關愛而具 啟發性的環境中逐步成長，為日後的學習與羣體生活奠下穩固基礎。此階段的學習着 重過程與體驗，讓兒童在被接納與鼓勵中建立安全感與學習動機。` \n\n```\n童軍運動一向重視全人發展。小童軍支部以「認識自己．快樂同行」為教育目\n標，着重讓兒童從生活體驗中認識自身需要與能力，學習表達情緒、照顧自己，並在\n與同伴互動中建立自信、信任與正面的自我形象，感受羣體生活的樂趣。透過持續而\n溫和的引導，協助兒童建立對自己及他人的尊重與關懷。\n```\n\n```\n是次修訂的小童軍活動指引，特別因應現今兒童的成長需要及學習特性，重新\n整理訓練內容與進度安排，強調體驗為本、參與為先。透過遊戲、探索及模仿等方\n式，讓小童軍在沒有考驗壓力的情況下自然學習，在愉快氣氛中獲得全面發展，培養\n兒童對學習的正面態度，並建立持續參與的興趣。\n```\n\n```\n新活動指引同時重視家庭與童軍團之間的協作角色，鼓勵領袖與家長保持良好\n溝通，互相配合，共同營造一致而正面的學習環境，讓童軍精神自然融入小童軍的日\n常生活。透過家校與童軍的協作，讓學習在不同生活層面中得到鞏固與延伸。\n```\n\n```\n本人謹此衷心感謝支部訓練檢討工作小組及各位參與修訂工作的領袖，為小童\n軍支部的發展付出寶貴時間與心力，使新活動指引得以順利完成。期望小童軍能在愉\n快而充實的童軍生活中，逐步建立自信、好奇心與基本生活能力，為升上幼童軍支部\n作好準備。\n```\n\n`助理香港總監察` ( `青少年活動署` ) \n\n`陳狄安` 2026 `年` 2 `月` \n\n```\nP.2\n```\n\n<!-- p.4 -->\n## `前言` \n\n`《小童軍活動指引》最初訂於` 1987 `年，並分別於` 1996 `年再版及` 2009 `年推出第 二版沿用至今，內容豐富且涵蓋廣泛。及後，青少年活動署為落實香港童軍總會短中 長期策略計劃（` 2019-2029 `）方向及修訂建議，於` 2026 `年` 2 `月推出《小童軍活動指 引》第三版。為更有效配合小童軍支部成員所屬年齡層的發展需要，故需將《小童軍 活動指引》再進一步進行修訂。` \n\n`小童軍支部一直在成年人的指導下，透過有趣味及啟發性的活動幫助兒童成長。隨 著` 2021 `年` 9 `月，小童軍支部推行小童軍先導計劃，在經過約一年半的試驗時間後，支 部落實於` 2023 `年` 5 `月起將小童軍支部年齡提早一年開始，由` 5 `歲改為由足` 4 `歲起。小 童軍之訓練框架須要作出修訂，以配合改變。本次修訂主要圍繞小童軍支部的教育目 標「認識自己 快樂同行」，為小童軍學習引入新元素和體驗。本次主要修訂包括：` \n\n1. `配合小童軍年齡發展的需要，重新構思合適年齡階段的學習內容。` 4 `歲至` 5 `歲的小 童軍，主要透過探索、參與、表達及模仿等機會達至全面發展；` 6 `至` 7 `歲的小童軍， 透過不同的體驗活動，發掘自己的興趣，進一步認識自己。` \n\n2. `整理七大範疇的活動體驗，包括戶外、健康、認識自己與助人、科學、創新、社區 及童軍家庭，鼓勵小童軍從多元角度探索自我，為個人的全面發展種下苗子。` \n\n3. `新增小草蜢獎章，以傳統的徽章制度鼓勵小童軍主動學習，於七大範疇內，每項完 成兩項體驗，即可獲發獎章。` \n\n4. `強化小童軍與幼童軍之銜接：將部分幼童軍學習歷程融入小童軍支部，讓小童軍支 部成員能夠更容易地晉升至幼童軍支部，持續參加童軍活動。` \n\n```\n《小童軍活動指引》第三版內容更著重體驗活動，配合原有的從遊戲中學習理念，\n能促進小童軍德、智、體、羣、美、靈的全面發展。完成小童軍支部後，小童軍成員\n應如小草蜢般具備堅毅的個性，在生活上充滿活力與適應力。\n```\n\n```\n在此，本人僅代表香港童軍總會再一次感謝曾為此《小童軍活動指引》的草擬以至\n為整個小童軍支部作出貢獻的各界人士。\n```\n\n`總部總監（小童軍） 刁振邦` 2026 `年` 2 `月` \n\n```\nP.3\n```\n\n<!-- p.5 -->\n## `目錄` \n\n`序` 2 `前言` 3 `目錄` 4 `引言` 5 `第一章 小童軍支部的組織及規條` 6-9 (1) `目的` (2) `方法` (3) `童軍誓詞` (4) `童軍規律` (5) `口號` (6) `童軍銘言` (7) `主題曲` (8) `年齡規限` (9) `小童軍團的最低應有標準` 1. `人數` 2. `領袖` 3. `訓練` 4. `進度` (10) `領袖的職責及要求` (11) `預期成果` (12) `制服 第二章 小童軍支部的訓練計劃` 10-13 `第三章 典禮與儀式` 14-21 `第四章 快樂傘` 22-23 `附錄` 24-37 ( `一` ) `快樂傘遊戲` ( `二` ) `認識如何保護自己免受傷害教材` ( `三` ) `小草蜢獎章七個活動範疇體驗活動詳細內容建議` ( `四` ) `小草蜢獎章範疇體驗證書及小草蜢獎章證書式樣` \n\n`鳴謝` 38 \n\n```\nP.4\n```\n\n<!-- p.6 -->\n```\n引言\n```\n\n`為讓小童軍團前線領袖能迅速瞭解小童軍支部的務實操作與訓練，青少 年活動署製作了「小童軍活動指引」` ( `第三版` ) `，讓領袖們輕鬆上手。無論是 編排集會或安排體驗活動，都能事半功倍` ! \n\n`「小童軍活動指引」` ( `第三版` ) `共分成四個章節，深入淺出地介紹「小童 軍支部組織及規條」、「小童軍支部訓練計劃」、「典禮與儀式」及「快 樂傘」。此外，本指引的附錄部分收錄了快樂傘遊戲、認識如何保護自己 免受傷害教材及小草蜢獎章七個活動範疇體驗活動詳細內容建議，希望本 指引能有效幫助各領袖帶領小童軍活動。` \n\n`最後，本「小童軍活動指引」` ( `第三版` ) `的附錄內容僅作參考，童軍旅 可因應成員的情況運用或調適內容，我們相信每一位團長的決定皆從的孩 子角度出發。為小童軍提供適切的活動，幫助他們快樂健康地成長。` \n\n```\nP.5\n```\n\n<!-- p.7 -->\n## `第一章 小童軍支部的組織及規條` \n\n## (1) `目的` \n\n```\n小童軍支部旨在提供各項適合小童軍身心發展的活動，通過生活學習體\n驗，快樂健康地成長。\n```\n\n- `小童軍正處於自我形成和社交基礎建立的關鍵期，最有效的方向是用遊 戲化、合作性和具儀式感的活動，讓他們在遊玩的過程中認識自己、與 同伴快樂相處。` \n\n```\n小童軍支部的教育目標是「認識自己快樂同行」。小童軍在家庭、學校\n以外及課餘時間，通過遊戲、生活學習體驗及羣體活動，學識照顧自\n己、主動參與、對事物抱有好奇心及求知慾、發掘不同興趣、體驗羣體\n生活及快樂健康地成長。\n```\n\n## (2) `方法` \n\n```\n在成年人的指導下，透過有趣味性及啟發性的活動，如遊戲、唱歌、故\n事及創作性活動，助兒童的成長。\n```\n\n- `小童軍支部活動設計關注點包括：` \n\n1. `兼顧小童軍體能、智能、語言、情緒及羣體性的整體發展。` \n\n2. `按照小童軍的發展需要及能力。` \n\n3. `依據小童軍的經驗及興趣。` \n\n4. `激發小童軍對事物的好奇心及求知慾，提高人際互動，全方位學 習，鼓勵獨立思考的能力。` \n\n5. `以遊戲方式發揮各種活動所具有的價值及功能。` \n\n6. `給小童軍有自我表達、自由創作及享受活動樂趣的機會。` \n\n## (3) `童軍誓詞` \n\n```\n「我願參加小童軍愛神愛人愛國家」\n```\n\n`（配合` 4 `至` 8 `歲的小朋友的認知能力，使他們明白成為小童軍的責任。 由於小童軍尚未能理解盡責任的意義，因此改為「愛」以宣揚愛念； 「愛神」是針對總會的宗教政策而制定的；「愛人」表示和他人和睦相 處、合作；「愛國家」是指我們居住的地方，做個好市民。）` \n\n```\nP.6\n```\n\n<!-- p.8 -->\n## (4) `童軍規律—「小童軍日行一善」` \n\n- (5) `口號—「小童軍向前進」` \n\n- (6) `童軍銘言—「前進」` \n\n`主題曲（曲調：` “ London Bridge is falling down ” `） 小小童軍向前進 ，向前進，向前進， 小小童軍向前進，前進不停。` \n\nGreeny,  Greeny,  Marchin' On Marchin' On, Marchin' On Greeny,  Greeny,  Marchin' On Marchin' On Together \n\n- (7) `年齡規限` \n\n   - 4 `歲至` 7 `歲，於年滿` 8 `歲當日，其小童軍身分將自動結束。` \n\n- (8) `小童軍團的最低應有標準` \n\n   1. `建議人數：一已成立的小童軍團，最少要有小童軍六名，最多不能超 過三十六名團員。` \n\n   2. `領袖人數比例：每團最少有兩名領袖，其中一位必須持有有效領袖委 任書，領袖與小童軍之比例最好為` 1 `：` 6 `或以下，另亦建議邀請其他 人士協助活動進行，如家長義工、童軍團或以上之團員、專業人士 等。如進行戶外活動，建議以親子形式進行，以令小童軍獲得最佳的 照顧；而如團內有男及女成員，則必須有男及女領袖，惟區總監可因 應特殊情況批准個別小童軍團豁免必須有男領袖的規定。` \n\n   3. `訓練：不設考驗制度，透過遊戲、舞蹈、戲劇、唱歌、律動、故事及 美勞創作等項目，以啟發小童軍從活動中學習「德、智、體、羣、 美、靈」之平衡發展。` \n\n   4. `進度：以` 22 `個月完成進步獎章後，接續以約` 18 `個月完成小草蜢獎 章。` \n\n```\nP.7\n```\n\n<!-- p.9 -->\n## (9) `領袖的職責及要求` \n\n1. `團長：` \n\n   - (a) `年齡規限 ： 最低年齡為二十一歲，並須於六十五歲生日當日退 休。` \n\n   - (b) `職 責：在旅長督導下及在小童軍副團長及教練員的協助下，小童 軍團長負責小童軍團內的活動事宜。` \n\n2. `副團長` \n\n   - (a) `年齡規限 ： 最低年齡為十八歲，並須於六十五歲生日當日退休。` (b) `職 責：小童軍副團長的職責由小童軍團長決定。小童軍團長於訂 定其職責時，須以能啟發其領導才為主。` \n\n## (10) `預期成果` \n\n- `完成小童軍階段後，小朋友對童軍活動有初步認識，並得到以下的成 果。` \n\n1. `透過多元體驗活動，認識自己，讓德、智、體、羣、美、靈全面發 展；` \n\n2. `認識團隊合作、守規律、禮貌和自我介紹等社交技巧；` \n\n3. `表現自信、責任感和愛心，並從活動中快樂成長。` \n\n## (11) `服裝` \n\n- `小童軍不需穿著制服，成員的基本服飾、配件及徽章可依如下：` \n\n|1.|`帽（非必需）`|`可採用單色闊邊漁夫帽或鴨咀帽。`|\n|---|---|---|\n|2.|`衫`|`單色`polo`恤或圓領`T`恤。`|\n|3.|`褲`|`單色長褲或短褲。`|\n|4.|`旅巾`|`已宣誓之小童軍支部成員須佩戴旅巾，如穿著`polo<br>`恤，旅巾須在衣領外。`|\n|5.|`巾圈`|`採用幼童軍支部巾圈。`|\n|6.|`背心／風衣`<br>`（非必需）`|`可穿著簡單背心或風衣，同時佩戴小童軍團員章於左`<br>`胸前。`|\n|7.|`鞋`|`皮鞋或運動鞋。`|\n\n```\nP.8\n```\n\n<!-- p.10 -->\n|8.|`可佩戴之`<br>`徽章及位置`||\n|---|---|---|\n|||`必需佩戴之徽章及位置：`<br>♦<br>`小童軍團員章－左胸前。`<br>♦<br>`小草蜢獎章及進步獎章－左手袖（個別位置詳`<br>`見上圖）。`<br>`非必需佩戴之徽章及位置：`<br>♦<br>`旅章、區章－右手袖（由上而下依次為旅章及`<br>`區章）。`<br>♦<br>`優異旅團布章－右手袖底部（需遵從該章的有`<br>`效時間佩戴）。`<br>♦ `已批准佩戴之活動紀念章－右胸上方（需遵從該`<br>`章的有效時間佩戴）。`|\n|9.|`備註`|♦ `如穿著學校運動上衣，則可將小童軍團員章、小`<br>`草蜢獎章及進步獎章佩戴於旅巾上。`|\n|||♦ `除上列之徽章外，不可佩戴其他徽章於小童軍服`<br>`裝上。`<br>♦ `除幼童軍支部巾圈外，小童軍成員不可使用其他`<br>`支部之制服配件，如皮帶、帽等。`<br>`團員章`<br>`小草蜢章`<br>`進步獎章(依位置)`<br>`藍色        綠色`<br>`紅色  啡色`|\n\n```\nP.9\n```\n\n<!-- p.11 -->\n## `第二章 小童軍支部的訓練計劃` \n\n## `獎章完成程序` \n\n## `團員章` \n\n## `進步獎章` \n\n## `小草蜢獎章` \n\n## (1) `團員章` \n\n`團員章為白色底，上有藍色中英文字，配橙色圍邊，直徑` 5 `釐米。中 間設計元素來自童軍徽，以小童軍只需佩戴領巾為意念，配用橙及藍 色領巾及巾圈。中間箭頭比喻小童軍的臉兒，左右箭頭則組成一條領 巾，活像一個手舞足蹈、跳動活潑的可愛小孩，充份表現小童軍正享 受快樂無憂和多姿多采的活動。` \n\n`兒童在參加小童軍團` 4 `次集會，並完成以下各項，便可正式加入小童 軍團成為小童軍，佩戴團員章。` \n\n1. `學懂了小童軍最基本常識，包括唱小童軍主題歌、揚動快樂 傘、整理領巾` \n\n2. `說出小童軍誓詞、規律和口號` \n\n3. `認識如何保護自己免受傷害` \n\n```\nP.10\n```\n\n<!-- p.12 -->\n## (2) `進步獎章` \n\n`共有` 4 `個獎章級別，按小童軍加入小童軍團的時間頒發，並於` 22 `個 月完成。` \n\n|`獎章`<br>`級別`|`獎章特徵`|`獎章式樣`|`頒發時段`|\n|---|---|---|---|\n|`第`1<br>`步`|`紅色`2 `釐米正方`<br>`形的布章，印有`<br>`白色左足印`||`在小童軍加入小童軍團`<br>`活動`5`至`6`個月頒發`|\n|`第`2<br>`步`|`啡色`2 `釐米正方`<br>`形的布章，印有`<br>`白色右足印`||`在小童軍加入小童軍團`<br>`活動`11`至`12`個月頒發`|\n|`第`3<br>`步`|`藍色`2 `釐米正方`<br>`形的布章，印有`<br>`白色左足印`||`在小童軍加入小童軍團`<br>`活動`16`至`18`個月頒發`|\n|`第`4<br>`步`|`綠色`2 `釐米正方`<br>`形的布章，印有`<br>`白色右足印`||`在小童軍加入小童軍團`<br>`活動滿`22`個月後頒發`|\n\n##  `頒發原則` \n\n```\n小童軍支部並無考驗機制，所有進步獎章是以參與團活動為原則，只\n要小童軍主動參與團集會和活動，並達到規定的時間，便可獲取。小\n童軍團長按照小童軍的參與情況，即可頒發相關的進步獎章，無需任\n何手續和考驗程序。\n```\n\n## ❖ `頒發獎章` \n\n```\n沒有指定的頒發進步獎章儀式，小童軍團長可利用團集會內適當的時\n間頒發。頒發時，團長應勉勵小童軍繼續參加童軍活動。\n```\n\n## ❖ `購買獎章` \n\n```\n團長可直接到童軍物品供應社購買各級進步獎章，並無任何簽發程\n序。\n```\n\n```\nP.11\n```\n\n<!-- p.13 -->\n##  `佩戴位置` \n\n```\n進步獎章應佩戴在上衣的左衣袖上。以正方形排列：左下方為紅色進\n步獎、右下方為啡色進步獎、左上方為藍色進步獎、右上方為綠色進\n步獎，紅色及啡色進步獎要相連成一行，藍色及綠色進步獎章要相連\n成一行，以示一步一步前進。\n```\n\n## (3) `小草蜢獎章` \n\n`完成` 4 `個進步章或年齡達` 6 `歲時可以參與小草蜢歷險，通過參與七大 範疇的體驗項目，收集體驗證書換取小草蜢獎章。整個小草蜢歷險應 以` 12 `至` 18 `個月完成，並不早於` 7 `歲時頒發小草蜢獎章。` \n\n## `七大範疇及項目` : \n\n|`範疇`|`項目`|\n|---|---|\n|`我愛戶外`|`探索公園、觀察自然、宿營、原野烹飪、天`<br>`氣、遠足`|\n|`我愛運動與健康`|`運動體驗、個人興趣、健康飲食`|\n|`認識自己、幫助他人`|`照顧自己、做家務、照顧動物、個人安全、`<br>`救傷、我的家`|\n|`我愛科學與大自然`|`天象、電子產品的使用及認識網絡安全、科`<br>`學活動、環保`|\n|`我愛創新`|`藝術活動、音樂、勞作、攝影及攝錄`|\n|`我愛國家與社區`|`中華文化活動體驗、參觀社區設施、認識節`<br>`日、認識升旗禮`|\n|`我愛童軍大家庭`|`認識童軍活動、親子活動、服務`|\n\n```\nP.12\n```\n\n<!-- p.14 -->\n##  `頒發原則` \n\n- `小童軍支部並無考驗機制，由小童軍團長按照小童軍參與活動的投入 度，每範疇中完成至少體驗` 2 `項活動可獲頒發該範疇的電子體驗證 書，完成全部七個的體驗活動，即可獲小草蜢獎章。獲小草蜢獎章 後，小童軍仍可按興趣體驗其他項目。（證書式樣可參閱附錄四）` \n\n## ❖ `頒發獎章` \n\n- `沒有特定的頒發小草蜢獎章儀式，小童軍團長可利用團集會內適當的 時間進行頒發。頒發時，團長應勉勵小童軍繼續參加童軍活動。` \n\n## ❖ `購買獎章` \n\n- `在童軍物品供應社發售，購買時須出示由小童軍團長簽署及蓋上旅／ 小童軍團印章之「小草蜢獎章證書」正本。每張小草蜢獎章證書最多 可購買徽章` 2 `枚，童軍物品供應社職員會於證書背面蓋印章證明已出 售布章予該證書持有人。` \n\n## ❖ `佩戴位置` \n\n```\n小草蜢獎章應佩戴在上衣的左手袖上。\n```\n\n## ❖ `支部銜接` \n\n- `完成小草蜢獎章後持有小草蜢獎章證書的小童軍成員，晉升幼童軍 團，於獲得會員章後可獲頒發幼童軍體驗章。` \n\n```\nP.13\n```\n\n<!-- p.15 -->\n## `第三章 典禮與儀式` \n\n## `團集會儀式` \n\n- `小童軍團的團集會儀式並無既定形式，以簡短、認真為原則。可參考以 下方式：` \n\n- ⮚ `開始儀式` \n\n1. `預備` \n\n```\n快樂傘平鋪在地上，小童軍站\n在附近。\n```\n\n2. `快樂傘儀式` \n\n- A. `團長高呼：「小童軍」，全團回 答：「向前進」。並由領導帶領 小童軍走向快樂傘，離傘一步， 繞傘站立。` \n\n- B. `團長再呼一聲：「小童軍」，全 團開左腳向快樂傘踏前一步和回 應：「向前進」。` \n\n```\nP.14\n```\n\n<!-- p.16 -->\n- C. `領袖和小童軍同時俯身用雙手掌 心向下拿起快樂傘` \n\n- D. `唱和做以下的歌曲和動作：` \n\n```\n歌詞：小小童軍向前進，向前進，\n向前進；小小童軍向前進，前進不\n停。\n```\n\n```\n（動作：雙手拿傘，掌心向下，順\n時鐘方向走和上下揚動快樂傘。）\n```\n\n```\n歌詞：小小童軍向前進，向前進，\n向前進；小小童軍向前進，前進不\n停。\n```\n\n- `（動作：雙手拿傘，掌心向下，逆 時鐘方向走和上下揚動快樂傘。）` \n\n```\n歌詞：小小童軍向前進；\n```\n\n```\n（動作：雙手拿傘，掌心向下，左\n右踏步、上下揚動快樂傘，並靠攏\n走向快樂傘中心。）\n```\n\n```\n歌詞：向前進，向前進。\n```\n\n```\n（動作：雙手拿傘，掌心向下，\n左右踏步、上下揚動快樂傘，並\n從快樂傘中心散開返回原位。）\n```\n\n```\nP.15\n```\n\n<!-- p.17 -->\n```\n歌詞：小小童軍向前進；\n```\n\n```\n（動作：原地踏步）\n```\n\n```\n歌詞：前進不停。\n```\n\n```\n（動作：雙手舉高，行前一\n步，同時將傘用手按在地\n上，使快樂傘形成蘑菰形\n狀，領袖和小童軍背坐在快\n樂傘旁邊。）\n```\n\n## 3. `宣佈` \n\n```\n團長命令全團起立和解說集\n會安排。\n```\n\n## 4. `解散` \n\n```\n團長宣佈儀式結束和散隊。\n```\n\n```\nP.16\n```\n\n<!-- p.18 -->\n##  `結束儀式` \n\n## 1. `預備` \n\n```\n快樂傘平鋪在地上，小童軍站在\n附近。\n```\n\n## 2. `快樂傘儀式` \n\n```\n團長高呼：「小童軍」，全團回\n答：「向前進」，同時走向快樂\n傘，繞傘站立。\n```\n\n```\n團長帶領全團齊唱（不用揚動快\n樂傘）：「小小童軍向前進，向\n前進，向前進；小小童軍向前\n進，前進不停。」\n```\n\n## 3. `宣佈` \n\n```\n團長宣佈下次集會安排。\n```\n\n## 4. `祈禱` \n\n```\n團長請全團為所屬宗教低頭默\n禱。\n```\n\n## 5. `解散` \n\n```\n團長宣佈團集會結束和解散。\n```\n\n```\nP.17\n```\n\n<!-- p.19 -->\n## ⮚ `宣誓儀式` \n\n## 1. `預備宣誓桌` \n\n- `長桌一張、小童軍團支部旗` \n\n- `、旅巾、巾圈、團員章` * `、童軍之父貝登堡擺設 （選擇性）` \n\n- `物資如右圖擺放` \n\n- `非使用橙色小童軍活動服之` \n\n- `旅團需準備` \n\n## 2. `集合` \n\n- `團長和副團長召集全團進行快 樂傘儀式。` \n\n- `團長宣佈為新團員舉行宣誓儀 式。` \n\n- `旅長站在宣誓桌後。` \n\n## 3. `召喚` \n\n- `由團長召喚即將宣誓的團員， 準備宣誓的新團員在團長呼名 後，離開快樂傘圈走到旅長面 前。` \n\n`為減少宣誓者的緊張情緒，不 宜單獨宣誓，最好以` 3 `至` 4 `位 為一組進行宣誓。` \n\n```\nP.18\n```\n\n<!-- p.20 -->\n## 3. `承諾` \n\n`團長問：「` XXX `、` XXX `、` XXX `，你們願意參加小童軍嗎？」 宣誓者答：「我願意。」 團長問：「你們知道小童軍日行一善嗎？」 宣誓者答：「我知道。」` \n\n## 4. `宣誓` \n\n```\n團長說：「請你們用左手按\n在旗上，全體團員右手舉起\n三指，跟我行一個宣誓\n禮。」\n```\n\n```\n團長續說：「現在請你們跟\n我一句一句唸出小童軍誓詞\n吧！」\n```\n\n`除未宣誓的新團員外，全團 跟隨團長行宣誓禮。 團長引導宣誓者分段唸出小 童軍誓詞：「我願參加小童 軍` ‧ `愛神` ‧ `愛人` ‧ `愛國家」。` \n\n```\n宣誓後，全團跟隨團長放下\n右手。\n```\n\n```\nP.19\n```\n\n<!-- p.21 -->\n## 5. `佩戴程序` \n\n```\n旅長為新團員佩戴團員章\n（如需要）及旅巾並說：\n「我現在為你佩戴旅巾，你\n已經是本旅的小童軍了。」\n```\n\n`團長為新團員佩戴團員章` * `並 說：「小童軍向前進，希望 你努力學習，一步一步向前 進。」` \n\n## 6. `禮成` \n\n```\n旅長和其他領袖與新團員握手致賀後，並說：「小童軍向前\n進，希望你努力學習，一步一步向前進。」\n```\n\n```\n旅長請完成宣誓的團員轉身，向各團員敬禮。\n```\n\n```\n旅長宣佈儀式結束。\n```\n\n```\nP.20\n```\n\n<!-- p.22 -->\n## ⮚ `晉團儀式` \n\n- `小童軍和幼童軍團長召集兩團成員，分別圍著快樂傘和排成活動 圈各自站立一方。` \n\n- `兩團的團長站在兩團的中央，背向團員而面向對方。` \n\n- `兩團的副團長站在快樂傘和活動圈團隊以外，排成直線；旅長站 在兩團中央的一方。` \n\n- `儀式開始時，旅長命令全體立正和宣佈晉團儀式開始。` \n\n- `小童軍團長向後轉宣讀晉團小童軍姓名，晉團者走到團長面前， 團長向將晉升幼童軍團的團員道別和向全團說出該等團員在團內 最值得回憶的事情後，然後帶領晉團者走到中央的分界線。` \n\n- `兩團的團長互相敬禮，小童軍團長向幼童軍團長介紹晉團者。` \n\n- `幼童軍團長握手歡迎晉團者。` \n\n- `幼童軍團長請各小隊隊長走到團長面前並向各隊長介紹晉團者， 然後分配晉團者到指定小隊。` \n\n- `隊長帶領晉團者返回小隊。` \n\n- `最後，旅長帶領全體歡呼以示祝賀。` \n\n- `當新團員考取幼童軍會員章後，團長再為新團員舉行覆誓儀式。` \n\n```\nP.21\n```\n\n<!-- p.23 -->\n## `第四章 快樂傘` \n\n## `快樂傘的由來` \n\n```\n始創者（日本人）到美國參觀之際，在洛杉磯一個小鎮看見了降落傘遊\n戲，深深地被吸引著，他希望讓幼兒也能玩這種遊戲，但此種降落傘在\n日本到處都尋找不到，連舊貨都無法找到。\n```\n\n`在一次機會中，得知神戶「千歲幼稚園」附近，有許多手藝很了得的製 鞋匠，於是試驗性地造了` 20 `幅，並設計出許多用降落傘的遊戲，同時 將它以（` Parachute `）降落傘和（` Balloon `）氣球合併，取名為` PARABALLOON `。` \n\n```\n快樂傘在兒童體育與團體活動中流行，其後被世界各地童軍團廣泛採用，\n成為合作遊戲的重要工具。香港童軍總會小童軍支部亦引入並使用快樂\n傘為小童軍的特色團集會活動。\n```\n\n## `快樂傘的特性` \n\n```\n快樂傘是最適用於小童軍的體育遊戲、運動表演及戶外活動的器材，它\n不但輕便、易於收拾，且富色彩，亦是一種絶對安全的遊戲器材。\n```\n\n```\n快樂傘之設計可以︰\n```\n\n- `在狹小的運動場裡，同時讓很多小童軍一起玩；透過集體遊戲，使 小童軍體會合作的重要及促進良好的人際關係。` \n\n- `培養運動時必須具備的時間感、韻律感、速度感、物體的重量感及 距離感等運動知覺。` \n\n```\n培養對物體的手持法、搬運方法及遵守規則等態度。\n訓練小童軍對語言掌握的好機會。\n```\n\n```\n訓練小童軍的大肌肉、小肌肉及體力的發展。\n```\n\n```\n進行快樂傘遊戲時應注意的事項\n```\n\n```\n小童軍身心狀態服飾檢查\n天氣器材檢查\n場地檢查節奏的控制\n資源－人力、物資、場地等\n```\n\n```\nP.22\n```\n\n<!-- p.24 -->\n## `快樂傘的大小與人數比例` \n\n|`直` `徑`|`兒` `童`|`成` `人`|`兒童和成人`|\n|---|---|---|---|\n|7`公尺`|20`－`30`人`|10`－`20`人`|10`－`15`人`|\n|8`公尺`|30`－`40`人`|20`－`30`人`|15`－`20`人`|\n|9`公尺`|40`－`50`人`|30`－`40`人`|20`－`25`人`|\n\n```\n快樂傘是小童軍團中不可缺少的設備，它除了用於開會及散會儀式外，\n亦可於不少遊戲活動中使用。\n```\n\n## `快樂傘遊戲的分類` \n\n- `律動表演遊戲` \n\n- `利用球類遊戲` \n\n- `以快樂傘做體操` \n\n- `以快樂傘做遊戲工具` \n\n## `快樂傘的持握方法` \n\n```\n小童軍站立於快樂傘邊緣，面向快樂傘，雙手手掌心朝下，大姆指在傘\n下並將傘的邊緣置於手掌虎口，再將手掌合攏抓起傘。快樂傘要提起或\n置於地上時，應以單腿跪姿進行。\n```\n\n## `快樂傘的摺疊方法` \n\n1. `抓住中心位置` \n\n2. `摺疊週邊` \n\n3. `從中心位置捲向週邊` \n\n## `快樂傘其他用途` \n\n```\n在未有集會期間，快樂傘可掛在旅部牆上用作裝飾或掛在室內頂上形成\n一個帳幕，增加氣氛。\n```\n\n```\nP.23\n```\n\n<!-- p.25 -->\n```\n附錄\n```\n\n## **(** `一` **)** `快樂傘遊戲` \n\n## 1. `磨菇形` \n\n   - `這個形狀可用於很多玩意上，如發現小童軍玩耍時有困難，可由領 袖跪下以配合小童軍高度。將傘平放在地上，小童軍手執傘邊，抬 手將傘慢慢由地下升起高舉過頭上，空氣自然注入傘內形成磨菇形 狀，之後將傘放回地上，此動作可重覆多次，用以帶出歡樂氣氛。` \n\n2. `尋寶` \n\n   - `這個遊戲的先決條件是要小童軍能分辨自己的鞋子。遊戲開始時， 先將小童軍的其中一隻鞋放進傘中央，當領袖將傘升起時，所有小 童軍便走進傘中尋回自己的鞋及穿回，而同時將傘放下形成一個網 狀，以考驗小童軍的速度。 進行此遊戲時，領袖須注意小童軍的安全，可先由部份小童軍進行 遊戲，約` 5 `人，以減低小童軍的受傷機會。` \n\n3. `大風吹` \n\n   - `首先由小童軍一邊拿着傘邊搖動快樂傘，一邊留心聆聽領袖的指示， 如︰「今天有戴眼鏡的小童軍走。」有戴眼鏡的小童軍便要在傘內 走過對面。領袖發出的指令可與小童軍的身體特徵、居住地方、生 活習慣等有關。` \n\n4. `鶴立雞羣` \n\n   - `這個遊戲需要在傘內進行，以形成一個營幕的氣氛。首先由一個人 站在傘內中央為營柱，通常是由領袖來做，然後所有小童軍進入傘 內沿著傘邊坐下，傘邊用物件固定或由小童軍自己坐著。領袖可與 小童軍於傘內唱歌、說故事等。` \n\n5. `同心合力` \n\n   - `小童軍在傘內順序躺下，雙腳向上伸令傘搖動，形成一個有規律的 動作，另一小童軍站在傘外並在傘上傳球，考驗小童軍的合作性。` \n\n```\nP.24\n```\n\n<!-- p.26 -->\n- **(** `二` **)** `認識如何保護自己免受傷害` **(Safe from Harm)** `教材` \n\n```\n內容：認識如何保護自己免受傷害\n```\n\n```\n學習目標：\n```\n\n1. `認識身體是自己的，沒有人可以在未經允許下觸碰` \n\n2. `辨識不恰當身體接觸` \n\n3. `學習說「不」及尋求可信任的大人幫助` \n\n4. `認識可以求助的對象（如：父母、老師、童軍領袖）` \n\n5. `用遊戲、圖畫書、角色扮演等方式學習基本自我保護意識` \n\n- `教育活動例子：` \n\n1. `好觸摸／壞觸摸分類遊戲： 準備圖片卡（如擁抱、握手、打人、摸私 密部位 等），讓小童軍分辨屬於「好的身體接觸」或「壞的身體接 觸」，並說明原 因。` \n\n2. `我說不！角色扮演： 小組練習如何用堅定語氣說「不」，模擬有人想 拿走玩 具、不當觸碰身體等情境，學習如何回應和尋求幫助。` \n\n3. `身體地圖遊戲紅黃綠： 發放一張人體輪廓圖，讓小童軍用顏色標記哪 些部位 是「私密部位」，哪些部位是「安全區域」。紅色為不可讓別 人隨便觸碰， 黃色為經同意後可以觸碰，綠色為可以觸碰。` \n\n4. `信任圈圖卡活動： 利用圈圖示建立「可以幫助我的人」清單，如爸爸 媽媽、 老師、童軍領袖、警察等，幫助小童軍認識安全求助對象。` \n\n5. `安全故事時間： 透過故事書（如《不可以碰我》或《身體的界線》） 進行講 解，引導小童軍思考遇到可疑情況應怎樣應對。` \n\n6. `「安全密語」遊戲： 與小童軍預設一組「安全密語」或手勢，萬一他 們在公 眾場所遇到危險，可用這個密語告訴可信任的大人或領袖。 P.25`\n\n<!-- p.27 -->\n7. `「小童軍的勇敢徽章」手作 ：讓小童軍完成一系列任務（說出不恰當 的身體 接觸、記得求助對象等）後，製作「勇敢小童軍徽章」，增加 認同感與學習 動機。` \n\n8. `手偶互動劇場： 利用手偶模擬生活中的互動情境（如：陌生人搭訕、 朋友之 間的身體界線），讓小童軍參與對話與解決方法。` \n\n9. `安全標語創作時間： 小組創作簡單安全口號（如：「我的身體我做 主！」、 「不舒服就說不！」），加深印象並鼓勵表達。` \n\n```\nP.26\n```\n\n<!-- p.28 -->\n**(** `三` **)** `小草蜢獎章七個活動範疇體驗活動詳細內容建議` **(** `童軍旅可自行決定` **)** \n\n- `活動之性質為體驗而非考覈` \n\n   **1.** `我愛戶外` \n\n   - i. `運用感觀探索公園` \n\n   - `對照蛙類叫聲辨認公園蛙類品種` \n\n   - `觸摸不同樹皮，說出感受` \n\n   - `找出自己喜歡的氣味，說出感受（花香、下雨後的氣味、剪草後的味` \n\n   - `道` ... `）` \n\n   - `為公園雀鳥記錄花紋` \n\n   - `拍攝一隻蝴蝶，說出牠正在做什麼` \n\n   - `波浪型擺動手臂，嘗試吸引松鼠走近（推薦地點：香港公園）` \n\n   - `找出自己有興趣、想分享的植物` / `生物` \n\nii. `觀察自然` - `自然科學家` \n\n- `到公園選一種動` / `植物` , `觀察牠的行為（捕食、清潔身體）／生長階段` \n\n- `（開花結果），說出觀察結果` \n\n- `童軍旅選取一個地點（學校／公園）作短期觀察，讓團員拍攝紀錄生` \n\n- `物，最後一同檢視觀察結果。` \n\n- `提問舉偶：有新物種記錄嗎？有雀鳥／昆蟲是每一個團員都能找到` \n\n- `嗎？有覺得可愛的昆蟲嗎？` \n\n- `與成人或家長一起使用` iNaturalist `開設專案，請` AI/ `專家幫忙辨認物種` \n\n```\nP.27\n```\n\n<!-- p.29 -->\n## iii. `宿營` / `露營` \n\n- `參與營火會或營燈會，跟隨領袖歌舞投入其中` \n\n- `參與煮食環節` \n\n- `在家以外住宿一晚，說出感受` \n\n- `體驗低結構歷奇活動` \n\n- `體驗高結構歷奇活動` \n\niv. `原野烹飪` \n\n- `幫忙執拾柴枝` \n\n- `能與爐火保持安全距離` \n\n- `參與煮食環節` \n\n```\nP.28\n```\n\n<!-- p.30 -->\n## v. `遠足` \n\n- `嘗試走訪家樂徑或短途遠足，運用感觀探索，說出當中的發現及 感受。` \n\n```\n旅程中可嘗試：\n```\n\n- A. `與大自然捉迷藏，找出有什麼昆蟲運用保護色與大自然融為一` \n\n- `體。` \n\n- B. `在木質告示板／涼亭尋找睡眠中的壁虎` / `蜥蝪` \n\n- C. `在溪流中尋找仰泳的昆蟲` / `在水上行走的昆蟲` \n\n- D. `數一數旅程中發現的菇菌有多少種顏色` \n\n   - E. `跟隨帶路蟲（金班虎甲）引領，看看可以走多遠` \n\n   - F. `在枯葉堆上來來回回踩踏` \n\n   - G. `尋找野生動物的足跡` \n\n   - H. `發掘有趣的事情` \n\n- `嘗試走訪自然教育徑，看看解說牌上的說明，說出當中的發現及新知 識。` \n\n- `「郊野不留痕」使用可重用水樽，食物盒或可重用物品裝載食品，不 遺留垃圾。` \n\nvi. `天氣` \n\n- `運用日照做出藍曬作品，感受太陽熱力` \n\n- `製作用風推動的手工，到戶外感受風的樂趣` \n\n- `創作一個新的天氣告示，分享當中的設計理念` \n\n- `瞭解熱帶氣旋帶來的危險，參與防災練習` \n\n```\nP.29\n```\n\n<!-- p.31 -->\n- `找出自己有興趣、想分享的天氣` \n\nvii. `利用大自然創作` \n\n- `在沙灘上堆沙、畫沙畫` \n\n- `運用樹枝、枯葉等自然物資製作小船` \n\n- `運用枯葉／花瓣／果實／種子／貝殼…創作一幅畫` \n\n- `把石頭疊起製作高塔` \n\n## **2.** `我愛運動與健康` \n\n- i. `運動體驗` \n\n- `參與一項未曾參與過的運動` \n\n- `參與一項與律動有關之體能活動` \n\n- `建立恆常運動習慣，紀錄` 4 `星期的運動情況，並於每天進行不少於` 60 `分鐘中等至劇烈程度之體能活動` \n\n## ii. `個人興趣` \n\n- `持續參與一項運動不少於` 12 `星期` \n\n- `展示不少於一張照片，向小童軍介紹自己喜歡的體能活動` \n\niii. `健康飲食` \n\n- `認識食物金字塔` \n\n- `認識均衡飲食，分辨哪些食物可以多喫，哪些食物應少喫。` \n\n- `紀錄一星期的飲食情況進行反思` \n\n```\nP.30\n```\n\n<!-- p.32 -->\n## **3.** `認識自己、幫助他人` \n\n## i. `照顧自己` \n\n- `紀錄一星期刷牙的情況（早晚刷牙洗面）` \n\n- `能自己正確穿著外套、褲子、襪子、鞋子（分辨衣物的底面、前後、` \n\n- `左右）` \n\n- `簡單地整理自己的枕頭和被舖` \n\n- `能自己以餐具進食` \n\n- `認識情緒` \n\n## ii. `做家務` \n\n```\n在集會中示範\n```\n\n- `褶及收拾衫褲、正確懸掛衣服在衣架上` \n\n- `洗碗碟` \n\n- `扭乾毛巾及抺枱` \n\n- `整齊收拾玩具` \n\n## iii. `照顧動物` \n\n- `探訪愛護動物協會或性質相符的機構` \n\n- `紀錄一天動物的活動情況` \n\n- `飼養家居動物不少於三個月，並分享照顧該動物的心得` \n\n```\nP.31\n```\n\n<!-- p.33 -->\n## iv. `個人安全` \n\n- `指出家中的潛在危險` \n\n- `分辨交通燈號` \n\n- `參觀交通安全隊／交通安全公園` \n\n- `認識急救用具包括膠布、消毒藥水、繃帶、紗布及綿花及其用途` \n\nv. `我的家` \n\n- `說出同住家人的名字` \n\n- `說出父親／母親的聯絡電話號碼` \n\n- `說出自己的住址` \n\n- `說出一個從集會地點回家的方法` \n\n**4.** `我愛科學與大自然` \n\n- i. `天象` \n\n- `簡單分辨不同天氣，並說明四季的特性` \n\n- `體驗及觀察不同季節的景色，並作出簡單紀錄（如拍照紀錄機葉的變` \n\n- `化）` \n\n- `指出雲、太陽、星星及月亮` \n\n- `安全地觀察太陽` \n\n```\nP.32\n```\n\n<!-- p.34 -->\n## ii. `電子產品的使用及網絡安全` \n\n- `正確使用互聯網及電子產品，避免沉迷` \n\n- - `網上騙案` - `設置密碼的方法` - `認識個人資料，保障自己` - `說出載有個人資料的物件` iii. `科學活動` - `說出一件發生在日常生活中與科學有關的事` - `與成人一起進行一項與科學有關的實驗` - `體驗一項與飛行有關的實驗` iv. `環保` - `培養將垃圾分類的習慣` - `認識可回收與不可回收的物件` - `舉出生活上環保的事例` - `參觀環保回收站「綠在區區」，並體驗一次環保回收行動` \n\n```\nP.33\n```\n\n<!-- p.35 -->\n## **5.** `我愛創新` \n\n- i. `藝術活動` - `參觀一個展覽` / `看一套舞臺劇` - `參與一項公開表演` \n\nii. `音樂` \n\n- `演奏一種樂器` \n\n- `唱出三首童軍營火歌` \n\niii. `勞作` \n\n- `製作一件玩具與其他小童軍一起玩` \n\n- `參加一次填色比賽` \n\n- `根據說明書組裝一款模型` \n\niv. `攝影及攝錄` \n\n- `為小童軍團拍攝一張大合照` \n\n- `擬定一個主題，並拍攝不少於` 15 `秒的短片` \n\n- `參與拍攝工作，成為一名小演員` \n\n```\nP.34\n```\n\n<!-- p.36 -->\n## **6.** `我愛國家與社區` \n\ni. `中華文化活動體驗` \n\n- `參觀文化博物館` / `廟宇` / `鄉村` \n\n- `參與製作與中華文化相關的手藝` \n\n- `參與中華文化日及活動` \n\nii. `認識社區設施` \n\n- `說出家居附近的社區設施` \n\n- `參觀其中一個社區設施` \n\niii. `認識節日` \n\n- `分辨中國節日與西方節日` \n\n- `參與一個與節日有關的活動` \n\n- `認識一個節日的特色食品與節慶活動` \n\niv. `認識升旗禮` \n\n- `能唱出義勇軍進行曲` \n\n- `明白升旗時的應有禮儀（端正站立，保持安靜，面向國旗行注目禮）` \n\n- `分辨國旗、區旗與區徽` \n\n```\nP.35\n```\n\n<!-- p.37 -->\n## **7.** `我愛童軍大家庭` \n\ni. `認識童軍運動` \n\n- `認識各童軍支部` \n\n- `認識童軍運動創辦人` \n\n- `前往一個童軍營地，並認識營地的設施` \n\nii. `親子活動` \n\n- `邀請家長參加三次小童軍集會活動` \n\niii. `服務（完成以下其中一項）` \n\n- `清潔郊野` \n\n- `義工探訪／表演` \n\n- `在校內擔任服務生超過` 3 `個月` \n\n- `參與公開賣旗活動` \n\n```\nP.36\n```\n\n<!-- p.38 -->\n## **(** `四` **)** `小草蜢獎章範疇體驗證書及小草蜢獎章證書式樣` \n\n<!-- Start of picture text -->\n1.  我愛戶外範疇證書 2. 我愛運動與健康範圍證書<br>3. 認識自己、幫助他人範疇證書 我愛科學與大自然範疇證書<br>5. 我愛創新範疇證書 6. 我愛國家與社區範疇證書<br>7. 我愛童軍大家庭範疇證書 8. 小草蜢獎章證書<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\nP.37<br><!-- End of picture text -->\n\n<!-- p.39 -->\n## `鳴謝` \n\n```\n此新修訂之小童軍活動指引得以面世，實有賴以下人士之鼎力幫助，謹此\n向他們致謝。\n```\n\n|`黎偉生`|`香港總監`|\n|---|---|\n|`陳勇`|`副香港總監（活動與訓練）`|\n|`吳家亮`|`副香港總監（常務）`|\n|`陳狄安`|`助理香港總監`(`青少年活動`)|\n|`盧沛霖`|`支部訓練檢討委員會召集人`|\n|`張俊彥`|`副青少年活動總監（支部）`|\n|`邵鈞泰`|`助理青少年活動總監（支部）`|\n\n`支部訓練檢討` – `小童軍支部小組` \n\n|`刁振邦`<br>|`青少年活動署總部總監（小童軍）`|\n|---|---|\n|`吳翠珊`|`九龍地域總部總監（小童軍）`|\n|`樊煉豪`|`東九龍地域總部總監（小童軍）`|\n|`何雪茹`|`新界地域總部總監（小童軍）`|\n|`莫梓言`|`新界東地域助理地域總部總監（小童軍）`|\n|`梁佩珊`|`港島地域總部總監（小童軍）`|\n|`黃泳珊`|`港島第`175`旅小童軍團長`|\n|`黎家浩`|`青少年活動署總部領袖`|\n|`張立衡`|`第一屆青年事務諮議會委員`|\n|`周亮傑`|`第一屆青年事務諮議會委員`|\n\n```\n繪圖\n```\n\n|`方嘉樂`<br>`沙田`|`東第`6`旅小童軍團長`|\n|---|---|\n|`鄺嘉俊`<br>`港島`|`第`16`旅童軍副團長`|\n|`典禮與儀式示範`||\n\n`港島第` 175 `旅小童軍` B `團` \n\n```\nP.38\n```\n\n<!-- p.40 ocr -->\n```\nP.39\n```\n\n香 | 港\n\nHONG KONG\n","02_支部訓練綱要/03_Scout Training Scheme_Chi_20260606.md":"---\nsource_file: \"03_Scout Training Scheme_Chi_20260606.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 214\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n童軍訓練綱要 **SCOUT TRAINING SCHEME** 香港童軍總會 Scout Association of Hong Kong\n\n<!-- p.2 -->\n童軍訓練綱要 出 版          ：香港童軍總會 一九七九年 ：第一版 First Edition ：1979 二零二六年二月 ：第四版 Fourth Edition ：February 2026\n\n<!-- p.3 -->\n# 序 **Preface** \n\n童軍支部是青少年由依賴走向自立的重要成長階段。11 至15 歲的青少 年開始建立自我身份，並在羣體中學習承擔角色與責任，適合透過具挑戰性 的訓練與實踐活動，培養自信、毅力、判斷力及領導潛能。此階段的學習有 助青少年建立面對困難與挑戰的正向態度。 \n\n童軍支部以「擁抱挑戰．建立團隊」為發展主軸，透過小隊制度、戶外 訓練及服務學習，讓童軍在實踐中學會策劃、合作與解難，並體會團隊精神、 責任感及承擔的重要性，逐步建立成熟的處事態度。小隊制度更讓青少年在 真實情境中學習民主參與與共同決策。 \n\n本次修訂的訓練綱要，進一步優化進度性獎章制度，並引入多個嶄新專 科徽章，涵蓋科技、社會及生活相關範疇，讓童軍能按興趣及能力深入發展 不同專長，回應時代轉變及青少年多元發展的需要，體現童軍運動與時並進 的精神，同時保留童軍運動一貫重視戶外及服務學習的核心元素。 \n\n新訓練綱要同時着重培養童軍的反思能力，引導他們從活動經驗中總結 所學，建立自律、自省及持續進步的態度，為面對學業、羣體生活及未來挑 戰作好準備。透過反思歷程，讓學習成果得以深化並轉化為生活能力。 \n\n本人亦藉此機會感謝支部訓練檢討工作小組及相關領袖的專業意見與投 入，讓童軍支部訓練綱要得以優化完善。期望童軍在領袖的指導與支持下， 勇於嘗試、樂於承擔，在童軍生活中不斷成長，為升上深資童軍支部及未來 發展奠定堅實基礎。 \n\n助理香港總監（青少年活動） \n\n陳狄安 \n\n二零二六年二月 \n\n2 | 序\n\n<!-- p.4 -->\n# 前  言 **Foreword** \n\n自上一版《童軍訓練綱要》推行以來，社會環境、科技發展及青少年的 學習模式均出現顯著轉變，童軍支部成員的成長需要亦隨之演變。為確保童 軍訓練能持續與時並進，更有效地回應現今童軍支部所屬年齡層成員在品格 培育、能力發展及團隊生活方面的需要，香港童軍總會對《童軍訓練綱要》 進行全面檢視及修訂。 \n\n是次修訂由「支部訓練檢討委員會」推動，並與各地域代表作深入討 論，同時廣泛徵詢總會及地域資深總監、相關活動小組及青年事務諮議會的 意見，並就修訂重點進行公開諮詢。在整個檢討過程中，我們重申童軍支部 的核心使命，並確立以「擁抱挑戰，建立團隊」作為支部訓練的方針，期望 成員在不斷面對挑戰的過程中，學會與他人合作、彼此信任，從團隊生活中 培養責任感、領導能力及服務精神。 \n\n新版《童軍訓練綱要》正是基於上述訓練理念而制定，並以多元而具彈 性的訓練架構，促進成員在戶外活動、身心發展、領袖修養、社會責任、國 際視野及探索新知等方面的均衡成長。我們深信，童軍支部成員在完成支部 訓練後，能成為具備良好品格、團隊精神及應對未來挑戰能力的青年，為童 軍運動的持續發展奠定穩固基礎，並為社會作出正面的貢獻。 \n\n最後，謹代表香港童軍總會，向所有參與檢討、修訂及編制《童軍訓練 綱要》的人士（包括：童軍組各委員、地域代表、區代表及前線領袖）致以 衷心謝意。感謝他們在整個修訂過程中投入心力，抽出寶貴時間提供建議， 並參與內容修訂、資料整合及校對工作，促成《童軍訓練綱要》修訂版的順 利完成。 \n\n青少年活動署 青少年活動署 \n\n總部總監（童軍） 助理總部總監（童軍） \n\n馮偉雄 \n\n<!-- Start of picture text -->\n二零二六年二月<br><!-- End of picture text -->\n\n楊仲賢 \n\n二零二六年二月 \n\n前言 | 3\n\n<!-- p.5 -->\n# 目  錄 \n\n# **Contents** \n\n|序 PREFACE  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .|. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 2|\n|---|---|\n|前  言 FOREWORD . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .|. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 3|\n|目  錄 CONTENTS . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .  . . . . . . . 199|\n|童軍小隊隊徽及小隊章 PATROL ANIMAL IMAGES AND BADGES . . . . . . . 200|\n|活動資料 PROGRAMME MATERIALS  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 203|\n|郊野守則 THE COUNTRY CODE  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 205|\n|全港嘉爾頓錦標賽 HONG KONG CARLTON TROPHY COMPETITION . . . . . 206<br>童軍支部「童軍探索獎章」與幼童軍支部各級徽章豁免考驗安排<br>EXEMPTIONS OF ASSESSMENTS IN SCOUT PATHFINDER AWARD OF|\n|SCOUT SECTION FROM THE ACHIEVEMENTS OF CUB SCOUT SECTION . . 208|\n|童軍訓練綱要 網頁版 SCOUT TRAINING SCHEME ONLINE VERSION  . . . . 210<br>鳴  謝 ACKNOWLEDGEMENTS  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 211|\n\n8 | 目錄\n\n<!-- p.10 -->\n# 引  言 **Introduction** \n\n本綱要乃本會童軍支部訓練的正式手冊，書內詳述童軍考取各進度性獎 章及其他專科徽章所需學習之各種知識與技能和應達到之水準。各有關領袖 均應遵照其內容。綱要內各中文詞彙皆有定義，各童軍領袖應採用之。綱要 日後如有任何修訂，將會通過香港童軍總會的活動通告公佈，並上載至本會 及本支部的網頁內。 \n\n各童軍領袖在使用本綱要時應要在確保水準與維持吸引力之間作出平 衡。在童軍進行考驗前，必須確保其有足夠之訓練。在調節本綱要所列明之 要求前，應加以慎重考慮。在特別情況下（例如特能童軍訓練）團長可按其 實際需要作出適當調整。此外，在進行歷險或其他有危險性之訓練與考驗時， 負責領袖必須嚴格遵守本會「政策、組織及規條」及總會對有關活動之安全 守則及要求。 \n\n引言 | 9\n\n<!-- p.11 -->\n# 第一章 童軍支部的組織及規條 **CHAPTER 1: Organization and Rules of Scout Section** \n\n### 目的 \n\n童軍支部訓練之目的旨在促進十一歲至十五歲之少年人身心精神之陶冶與啟 發，以貫徹整個童軍運動連續性訓練。 \n\n童軍支部的教育目標是「擁抱挑戰 建立團隊」。著重戶外活動與訓練及鍛煉 領導才能；童軍團以小隊為單位，由童軍領袖及各隊長策劃團集會活動。童 軍學習不同的童軍及生活技能、體驗羣體活動、鍛煉強健體魄、挑戰自我， 增強自信毅力、培養領導才能，並實踐所學。 \n\n### 方法 \n\n在成年人領導下，以童軍規律與誓詞為本，給予歡愉富吸引力而有價值之有 進度性訓練，並在團內實行小隊制度，以達成童軍支部目的。 \n\n### 童軍誓詞 \n\n我願以信譽為誓 竭盡所能 對神明 對國家 盡責任 對別人 要幫助 對規律 必遵行 \n\n### 童軍規律 \n\n- （一） 童軍信用為人敬。 \n\n- （二） 童軍待人要忠誠。 \n\n- （三） 童軍友善兼親切。 \n\n- （四） 童軍相處如手足。 \n\n- （五） 童軍勇敢不怕難。 \n\n- （六） 童軍愛物更惜陰。 \n\n- （七） 童軍自重又重人。 \n\n### 童軍銘言 \n\n準備 \n\n### 年齡規限 \n\n童軍支部的年齡規限是由十一歲至十五歲。於年滿十六歲當日，其童軍身分 將自動結束。 \n\n### 童軍團的最低應有標準 \n\n( 一) 人 數：一已成立的童軍團，最少要有童軍十二名。 \n\n10 | 童軍支部\n\n<!-- p.12 -->\n- ( 二) 領 袖：一童軍團最少需有兩名領袖，而其中一名必須持有領袖委任書。 如團內有男及女成員，則必須有男及女領袖。 \n\n- ( 三) 青 少 年 活 動 與 訓 練：童軍的活動與訓練，必須遵照總會出版的「童 軍訓練綱要」所頒佈的任何有關修訂文件，並 確保每一童軍每年最少有一次參與小隊或全團 露營的機會。 \n\n- ( 四) 進 度：每年最少有四份一團員考獲較高一級的童軍進度性獎章。 \n\n### 童軍團內部組織及功能 \n\n- ( 一) 一童軍團不應超過八個小隊，每一小隊包括有小隊長、副小隊長各一名 及其他七名隊員。 \n\n- ( 二) 小隊長乃由童軍團長經與小隊長會議諮商後委出。副小隊長乃由小隊長 經童軍團長及小隊長會議同意後委出。童軍團長經與小隊長會議諮後， 可委任一團隊長。 \n\n- ( 三) 小隊長會議是由各小隊長組成，如該團設有團隊長，則由團隊長主持會 議。團中各領袖可以顧問身分出席會議。小隊長會議的任務為安排團活 動、團內部管理及團經費支銷。 \n\n- (四) 小隊會議由小隊長召開，乃集合隊中各成員，一起討論小隊事務的會議。 \n\n### 領袖的職責及要求 \n\n- ( 一) 童軍團長 THE SCOUT LEADER \n\n- ( 甲) 年 齡 規 限：最低年齡為二十一歲，並須於六十五歲生日當日退休。 \n\n- ( 乙) 職 責：在旅長督導下及在童軍副團長及教練員的協助下，童軍團長與 小隊長議會各成員合作負責童軍團內的青少年活動與訓練事宜。 \n\n- ( 二) 童軍副團長 THE ASSISTANT SCOUT LEADER \n\n- ( 甲) 年 齡 規 限：最低年齡為十八歲，並須於六十五歲生日當日退休。 \n\n- ( 乙) 職 責﹕童軍副團長的職責由童軍團長決定。童軍團長於訂定其職責時， 須以能啟發其領導才為主。 \n\n### 預期成果 \n\n童軍支部的訓練旨在促進成員在態度、童軍技能、知識及靈性方面的均衡發 展，使其在德、智、體、羣、美各方面得到全面成長。完成童軍支部後，成員應: （一）理解並實踐童軍誓詞及規律的精神，在日常生活中以誠信、服務及責 任感為原則； \n\n- （二）掌握童軍活動所需的基本知識與技能，並具備策劃、組織及領導的能 力； \n\n- （三）以創意思維及批判思考解決問題，並透過團隊合作表現出良好的溝通 與協作精神； \n\n- （四）具備關懷社羣及環境的態度，樂於服務他人，尊重不同文化、性別、 宗教及家庭背景，實踐共融和平等的精神。 \n\n經歷童軍支部訓練後，成員亦應培養積極的人生觀，勇於面對挑戰及自我反 思，建立持續學習與成長的習慣，成為具責任感、同理心及公民意識的公民， 有助於社會。 \n\n童軍支部 | 11\n\n<!-- p.13 -->\n# 童軍制服 **Uniform for Scouts** \n\n<!-- Start of picture text -->\n金屬帽章<br>綠色軟帽<br>服務年星<br>香港章<br> 宗教章 或 公教章 杏色短袖恤衫<br>金紫荊獎章標誌 及 皮巾圈 或<br>深資童軍先修章 小隊活動巾圈 會員章 或<br>童軍探索獎章 或 和平使者章<br>童軍標準獎章 或<br>童軍高級獎章 或<br>總領袖獎章 旅巾 隊長章 或<br>副隊長章 或<br>團隊長章<br>服務獎章<br>皮帶<br>領導才獎章<br>青草色弓字摺裙褲<br>青草色短褲<br>青草色長襪<br>黑色皮鞋<br>香港青年獎勵計劃章<br>旅章<br>航空活動徽章<br>海上活動徽章<br>區章<br>社區參與章<br>地域章<br>教導組專科徽章<br>世界童軍組織 徽章系列<br>或 服務組專科徽章<br>「積極公民」獎章系列<br>技能組專科徽章<br>         小隊章<br>（團隊長除外）<br>興趣組專科徽章<br>優異旅團章<br>右袖 左袖<br><!-- End of picture text -->\n\n12 | 童軍支部\n\n<!-- p.14 -->\n# 海童軍制服 **Uniform for Sea Scouts** \n\n<!-- Start of picture text -->\n白頂無舌硬帽<br>服務年星<br>香港章<br>白色短袖恤衫<br> 宗教章 或 公教章<br>金紫荊獎章標誌 及<br>皮巾圈 或<br>深資童軍先修章<br>小隊活動巾圈 會員章 或<br>童軍探索獎章 或 和平使者章<br>童軍標準獎章 或<br>童軍高級獎章 或<br>隊長章 或<br>總領袖獎章 旅巾<br>副隊長章 或<br>團隊長章<br>服務獎章<br>皮帶<br>領導才獎章<br>深藍色弓字摺裙褲<br>深藍色短褲<br>深藍色長襪<br>黑色皮鞋<br>香港青年獎勵計劃章<br>旅章<br>航空活動徽章<br>海上活動徽章<br>區章<br>社區參與章<br>地域章<br>教導組專科徽章<br>世界童軍組織 徽章系列<br>或 服務組專科徽章<br>「積極公民」獎章系列<br>技能組專科徽章<br>         小隊章<br>（團隊長除外）<br>興趣組專科徽章<br>優異旅團章<br>右袖 左袖<br><!-- End of picture text -->\n\n童軍支部 | 13\n\n<!-- p.15 -->\n<!-- Start of picture text -->\n空童軍制服<br>Uniform for Air Scouts<br>金屬帽章<br>灰藍色軟帽<br>服務年星<br>淺藍色短袖 香港章<br> 宗教章 或 公教章 恤衫<br>金紫荊獎章標誌 及 皮巾圈 或<br>深資童軍先修章 小隊活動巾圈 會員章 或<br>童軍探索獎章 或 和平使者章<br>童軍標準獎章 或<br>童軍高級獎章 或<br>總領袖獎章 旅巾 隊長章 或<br>副隊長章 或<br>團隊長章<br>服務獎章 皮帶<br>領導才獎章<br>深藍色弓字摺裙褲<br>深藍色短褲<br>深藍色長襪<br>黑色皮鞋<br>香港青年獎勵計劃章<br>旅章<br>航空活動徽章<br>海上活動徽章<br>區章<br>社區參與章<br>地域章<br>世界童軍組織 徽章系列 教導組專科徽章<br>或<br>服務組專科徽章<br>「積極公民」獎章系列<br>技能組專科徽章<br>         小隊章<br>（團隊長除外）<br>興趣組專科徽章<br>優異旅團章<br>右袖 左袖<br><!-- End of picture text -->\n\n14 | 童軍支部\n\n<!-- p.16 -->\n# 童軍專科徽章肩帶 **Scout Proficiency Badges Sash** \n\n##### 1. 名稱 \n\n   - 「童軍專科徽章肩帶」，簡稱「專章帶」，英文為“Proficiency Badges Sash” 是為考獲多於十二枚專科徽章的童軍而設的。 \n\n2. 目的 \n\n在童軍制服上增添佩戴專科徽章的位置，以表揚有上進心的童軍所獲取 的成就。並鼓勵童軍多學習各方面的技能，考取更多專章，以充實個人 學識和技能。 \n\n3. 式樣 \n\n   - 3.1 顏色：綠底紅邊 \n\n   - 3.2 尺碼：本肩帶全寬為十三釐米，兩紅邊各寬四分三釐米，長度則以 個別佩戴者第六段所述佩戴方法； \n\n   - 3.3 質料：斜布 \n\n4. 佩戴規則 \n\n   - 4.1 已考獲專科徽章達十二枚並同時已考獲童軍標準獎章時，便可將最 多十六枚專科徽章佩戴在專章帶上；當考獲超過十六枚時，可將第 十七枚及以後的專科徽章佩戴在制服的衣袖上。 \n\n   - 4.2 專章帶只可在穿著整齊制服時佩戴。 \n\n   - 4.3 童軍成員亦可選擇不使用專章帶，維持將原有專章佩戴在衣袖上。 \n\n5. 專科徽章放置方法 \n\n   - 5.1 請參閱附圖（一），有關阿拉伯數字代表佩戴的次序。 \n\n   - 5.2 佩戴應先按專科徽章組別而定，教導組在最高，然後依次為服務組、 技能組及興趣組，每四個一組依次排列。如果某一組別專科徽章不足 四枚又或不足四之倍數時，則可與上一組之專科徽章合排，以每四個 為一組。 每組間的距離可按個人身高及旅巾位置而作適當調整，但所 有專科徽章只可佩戴於專章帶之前面位置。 \n\n   - 5.3 除上述之四組專科徽章外，其它徽章例如香港青年獎勵計劃獎章、 世界童軍組織徽章系列、「積極公民」獎章系列徽章、社區參與章、 海上及航空活動等徽章皆不得佩戴在專章帶上。 \n\n童軍支部 | 15\n\n<!-- p.17 -->\n6. 佩戴方法 \n\n   - 6.1 由左肩至右腰。 \n\n   - 6.2 專章帶放於制服左肩帶之上，將左膊之恤衫肩帶穿入專章帶下之布 耳內。 \n\n   - 6.3 專章帶兩端在右褲袋口下方重疊扣緊。 \n\n   - 6.4 旅巾放在專章帶外。 \n\n   - 6.5 專章放置方向請參閱附圖（二）。 \n\n#### 附圖（一） 專科徽章佩戴位置 \n\n#### 附圖（二） 箭頭所示為專章頂部 顯示專章放置方向 \n\n<!-- Start of picture text -->\n教導組<br>服務組<br>技能組<br>興趣組<br><!-- End of picture text -->\n\n16 | 童軍支部\n\n<!-- p.18 -->\n# 第二章 童軍支部的訓練計劃 **CHAPTER 2: The Training Scheme of Scout Section** \n\n### 童軍訓練 Scout Training Programme \n\n童軍訓練是採取進度性的訓練程序，以童軍進度性獎章貫穿，訓練內容 根據其年齡及成員年資而遞升，使成員能接受合適程度的訓練，循序漸進地 學習。同時，童軍訓練配上專科徽章制度，給予成員機會按興趣而選擇不同 挑戰和考驗，發展個人專長。進度性獎章及專科徽章兩者互相緊扣，使成員 可在不同領域按其能力和興趣發展。 \n\n<!-- Start of picture text -->\n童軍支部獎章歷程<br><!-- End of picture text -->\n\n進度性獎章包括「童軍探索獎章」、「童軍標準獎章」、「童軍高級獎章」 及「總領袖獎章」。童軍活動之基本技能，如露營、烹飪及探險等及其他興 趣項目，已含括在童軍探索獎章及童軍標準獎章之內。童軍高級獎章則對成 員技能知識要求更高，並加入自立及服務他人等項目。總領袖獎章是童軍支 部最高之獎章，加入了教授隊員技能及策劃活動元素，目的是考驗成員活動 策劃、增強責任心及培養領導才。 \n\n<!-- Start of picture text -->\n六大訓練範疇<br>戶外 身心<br>挑戰 創藝<br>探索 訓練 領袖<br>新知 範疇 修養<br>國際 社會<br>視野 責任<br><!-- End of picture text -->\n\n童軍支部 | 17\n\n<!-- p.19 -->\n童軍訓練旨在培養每一位成員在完成六大訓練範疇的學習後，能具備全 面而均衡的能力與素質：在「戶外挑戰」中掌握穩固的傳統童軍技能與於戶 外環境自理能力；在「身心創藝」中建立健康的身心與創意思維；在「領袖 修養」中展現責任感、判斷力與領導才；在「社會責任」中實踐關懷他人與 服務社羣的精神；在「國際視野」中拓闊眼界、理解多元文化；並在「探索 新知」中保持好奇心與追求新技能和新知識的態度。我們期望成員在完成訓 練後，成為能應對挑戰、積極參與社會、具備國際視野與終身學習精神的青 年。 \n\n進度性獎章及專科徽章制度的設計，均以六大核心範疇作為整體訓練方 向。進度性獎章透過分階段的考驗，引導成員在不同學習階段逐步接觸及深 化六大核心範疇的相關內容，確保成員在完成童軍支部訓練時，能全面涵蓋 各核心範疇的學習經驗。專科徽章制度則作為進度性訓練的延伸，讓成員可 按個人興趣及能力，在相關核心範疇中作進一步探索與實踐，深化知識與技 能，並將所學應用於團隊活動及服務之中。兩者相互配合，構成一個具系統 性而具彈性的訓練架構，以支援成員在六大核心範疇下的持續成長。 \n\n戶外挑戰項目中設有「戶外活動」、「海上活動」及「航空活動」三個 選修項目，成員可根據其興趣選擇選修項目，惟在各進度性獎章所選擇的項 目均需相同，以確保成員能夠在同一項目有進度性地學習。而海童軍及空童 軍則分別指定選修海上活動及航空活動。 \n\n社會責任項目中設有「社區認識」、「生態環境」、「氣象」及「危機 及保護」四個選修項目。成員可按個人興趣及能力，在不同進度性獎章階段 選擇進行其中之考驗。於童軍探索獎章及童軍標準獎章階段，成員可於三個 選修項目中選擇其中一項完成；於童軍高級獎章及總領袖獎章階段，則須於 四個選修項目中選擇其中兩項完成，惟所選項目不得重複。成員於完成所有 進度性獎章後，必須涵蓋所有選修項目，以確保獲得全面性的訓練，並促進 成員對社會及環境責任的整體理解與實踐。 \n\n專科徽章方面，主要分為「興趣組」、「技能組」及「服務組」。獎章 的分類根據其性質而設。興趣組專科徽章主要讓成員體驗新事物、培養良好 嗜好；技能組專科徽章則提供機會予成員擴闊及鞏固知識，提升專門技能； 而服務組專科徽章著重培養成員的服務精神及社會責任感。除此之外，部分 專章設有「教導組」，讓成員在考獲專科徽章三個月後，教授其他成員，協 助其獲得該獎章，使成員不僅深化所學，運用有效方法指導他人，培養領導 才。 \n\n18 | 童軍支部\n\n<!-- p.20 -->\n除特別指定外，會員章、各進度性獎章、興趣組專科徽章及部分其他獎 章及徽章皆由童軍團長安排主考進行考驗。除總領袖獎章外，各進度性獎章 於完成考驗後，童軍團長可簽發有關的獎章證書及購買獎章，並安排頒發證 書，成員可即時佩戴獎章於制服上。總領袖獎章則需於完成考驗後經由團長 及區會推薦給地域及總會，由總會通知獎章之批覈結果，再由所屬地域通知 領取總領袖獎章證書之安排。其他獎章及專章則可於考驗合格後由童軍團長 按照本團的傳統頒發及恭賀獲獎者。 \n\n任何成員，在準備晉升為深資童軍前三個月內，可開始考取深資童軍支 部的會員章。 \n\n童軍支部 | 19\n\n<!-- p.21 -->\n# 進度性獎章考驗程序 **Flow Chart of Progressive Badges** \n\n所有項目必須在完成會員章後開始，並於十六歲生日前完成。至於，進 度性獎章則應按階段完成，即成員應由童軍探索獎章開始進行考驗，完成整 階段後方開始考取下一階段。惟成員亦可選擇在完成某一個核心項目的分項 後，開始下一階段的相同核心項目的分項，例如完成童軍探索獎章內，戶外 挑戰核心的整個營藝分項後，可選擇開始童軍標準獎章內，戶外挑戰核心的 營藝分項。 \n\n如成員在十三歲或以後方始加入童軍支部，可選擇只完成童軍探索獎章 及童軍標準獎章之戶外挑戰部分，然後直接開始進行童軍高級獎章考驗。 \n\n<!-- Start of picture text -->\n童軍支部獎章歷程<br><!-- End of picture text -->\n\n20 | 童軍支部\n\n<!-- p.22 -->\n# 童軍專科徽章制度 **The Scout Proficiency Badge Scheme** \n\n童軍專科徽章設立的目的，是鼓勵童軍成員善用餘暇，吸收知識。童軍 成員加入童軍團獲取會員章後，便可以開始考取各個專科徽章。 \n\n童軍專科徽章分為四組：興趣組、技能組、服務組及教導組，配合不同 年齡之童軍成員的身心發展及能力而設計的。 \n\n興趣組專科徽章主要是為了讓童軍成員認識新事物培養良好嗜好而設。 興趣組專科徽章主要為體驗性質，目的希望童軍成員可於短時間內掌握該科 目的考驗內容。興趣組的科目，都是經常接觸的嗜好活動，並且是部分童軍 早已認識的技能和知識。此組專科徽章之底色為綠色。 \n\n技能組專科徽章目的是為擴闊及鞏固童軍成員的知識，幫助他們學習專門 技能。同時，技能組專科徽章希望增進童軍成員的信心，亦期望童軍成員能夠 從中獲得參加童軍運動的樂趣。此組專科徽章之底色為藍色。 \n\n服務組專科徽章是為鼓勵童軍成員發揮童軍運動「日行一善」的精神， 加強童軍的社會服務意識，促使童軍學習幫助他人、救急扶危，從而服務人 羣。此組專科徽章不單注重相關理論，更要求童軍熟諳該科目的知識和技能， 達到相當程度的水平，並能熟練地運用這些技能，服務他人。此組專科徽章 之底色為紅色。 \n\n教導組專科徽章要求童軍成員深化對每一項技能的認識，並能夠運用有效 方法，教導其他童軍成員有關專科徽章的內容。教導組專科徽章之底色，以各 組別專科徽章原屬底色為主，並加上金邊。 \n\n興趣組專科徽章可由童軍團長安排考驗，亦可由總會、地域、區會的獲 授權代表委任合適人士擔任主考；技能組、服務組及教導組專科徽章，須經 童軍團長批准其考驗申請後，由總會、地域或區會的獲授權代表委任合適人 士進行考驗。 \n\n至於下列各海上活動相關的專科徽章（包括技能組、服務組及教導組）， 因屬專門技術性，故只能由總會所委出之主考負責考驗，惟如持有已被本會認 可之證書，則可由區專章祕書直接簽發該等徽章： \n\n獨木舟 領港 艇長 獨木舟水球 風帆 \n\n童軍專科徽章制度 | 21\n\n<!-- p.23 -->\n會員章 \n\n# 會 員 章 **Membership Badge** \n\n適合年滿十一歲之童軍成員。 \n\n完成下列各項： \n\n1. 與你的小隊長商議有關加入童軍團之安排。 \n\n2. 加入一小隊及從小隊活動中認識隊中其他成員。 \n\n3. 最少參加六次團集會／活動，其中一次應在戶外舉行。 \n\n4. 對世界及香港童軍運動之發展有普遍的認識。 \n\n5. 明瞭及接納童軍誓詞、規律和銘言。 \n\n6. 認識你在宣誓時應有之童軍禮儀，以及中式隊列之基本動作。 \n\n7. 能辨認中華人民共和國國旗和國徽；並能說明其含意。 \n\n8. 能辨認香港特別行政區區旗和區徽；並能說明其含意。 \n\n9. 認識在國歌奏唱和升掛國旗、區旗時應有之禮儀，以及升國旗的基本程序。 \n\n10. 明瞭設立國歌的用意，並能背唱之。 \n\n11. 認識常見兒童侵害情況、預防方法及處理方法。 \n\n22 | 會員章\n\n<!-- p.24 -->\n會員章 \n\n# 會員章 - 保護童軍成員免受傷害 **Membership Badge - Safe from Harm** \n\n內容：認識常見兒童侵害情況、預防方法及處理方法。 \n\n##### 學習目標： \n\n- ( 一) 認識兒童及青少年常見的侵害情況（包括肢體、性、情緒及網絡欺凌） ( 二) 探討侵犯與同儕玩笑的界線 \n\n- ( 三) 學習如何應對和保護自己免受不當接觸或語言侵害 \n\n( 四) 認識保密與保護的分別：甚麼情況下應向可信大人揭露事件 \n\n( 五) 小隊討論、模擬情境處理、分組活動提升實踐能力 \n\n##### 教育活動例子： \n\n- 情境討論工作坊「這樣算過界嗎？」：提供不同生活情境（如：不當玩笑、 取笑身體特徵、被強迫拍照、被要求保守祕密等），由小隊討論每個情 境是否構成侵犯，並說出處理建議。 \n\n- 互動遊戲「侵犯 or 玩笑？」快速判斷賽：利用投影片或卡牌呈現不同語 句或行為，童軍需迅速判斷為「可接受」、「不舒服但可處理」或「明 顯侵犯」，加強判別意識與反應速度。 \n\n- 角色扮演劇場「我會怎樣處理？」：小隊分組設定一個實際案例，例如： 網絡欺凌、語言侮辱、身體界線被侵犯，並模擬對話及回應行動（如說 不、尋求協助、安慰被害者等）。 \n\n- 「保密 vs 保護」判斷遊戲：討論常見祕密情境（如朋友說自己被欺凌、 朋友叫你保守不當行為祕密等），判斷哪些應該保密，哪些情況應找可 信大人處理。 \n\n- 網絡安全小任務偵查網騙陷阱：分析虛構的社交媒體對話或交友軟體截 圖，找出潛在危險訊號，例如：過度關心、請求裸照、要求見面等，學 習如何應對與回絕。 \n\n- 「你可以這樣說」表達練習：訓練童軍用清晰、堅定及合適的語氣說 「不」或表達自己感受，例如：「這樣說話我不舒服」、「我不想你再 這樣碰我」。 \n\n會員章 | 23\n\n<!-- p.25 -->\n##### 會員章 \n\n- 侵犯風險分析任務—校園安全地圖：小隊繪製校園或社區活動空間地圖， 標記可能的高風險區域與安全支援點（如：廁所、樓梯角落、社工室）， 並提出改善建議。 \n\n- 心理界線探索活動—「我接受／我不接受」清單：每人填寫一份個人界 線清單，例如哪些玩笑可接受、什麼語氣讓自己不舒服，然後在小隊內 互相交流，加強互相理解與尊重。 \n\n- 法律與支援知識小挑戰—以問答或分站形式學習：什麼是性騷擾？在哪 裡可尋求支援？如何向社工、老師或警察尋求協助？強化基本法律與求 助知識。 \n\n- 反欺凌承諾行動—「我守護 我說出」：全隊完成「童軍反欺凌承諾卡」， 寫下自己願意做到的事，例如「我不取笑任何人」、「我會關心有困擾 的同伴」、「我會尋求幫助」等，公開張貼以凝聚隊伍文化。 \n\n##### 參考資料，請掃描以下QR Code： \n\n1. 保護童軍成員免受傷害政策 2. Safe from harm in Scouting 3. Safe from harm in Scouting 4. 家計會資源庫/ 性教育資源/ (YouTube) 網上資源 \n\n##### 5. 護苗基金– 護苗資訊 \n\n24 | 會員章\n\n<!-- p.26 -->\n童軍探索獎章 \n\n## 童 軍 探 索 獎 章 **Scout Pathfinder Award** \n\n適合年滿十一歲而考獲會員章之童軍成員。 \n\n於選修項目中，海童軍必須選擇「海上活動」； 空童軍必須選擇「航空活動」。 \n\n完成下列各項： \n\n### **A. 戶外挑戰** \n\n- 1 . 營藝 \n\n   - a. 參與一次露營活動 \n\n      - ． 參與一次小隊、團或旅的露營活動，學習與小隊隊員相處及 分工合作 \n\n   - b. 學習收拾一個露營用的背囊 \n\n      - ． 指出露營所需的個人物資及數量 \n\n      - ． 運用收拾背囊的原則，收拾一個露營用背囊 \n\n   - c. 安全使用有潛在危險之工具 \n\n      - ． 例如：營燈、爐具、手鎚及小刀等 \n\n      - ． 指出使用有關工具時應採取之安全措施 \n\nd. 保養露營物品 \n\n- ． 清潔、整理及存放個人及小隊露營物品 \n\n#### 2 . 歷險 \n\n##### a. 認識地圖及習用圖例 \n\n   - ． 分辨地圖的種類及用途 \n\n   - ． 指出地圖內標示的十種習用圖例 \n\n- b. 收拾一個一日郊野旅程用的背囊 \n\n   - ． 指出一日郊野旅程所需的個人物資及數量 \n\n   - ． 運用收拾背囊的原則，收拾一個郊野旅程用背囊 \n\n- c. 參與一次郊野旅程 \n\n   - ． 與小隊隊員進行 \n\n      - (i) 一日或不少於五公里徒步或 (ii) 不少於十公里單車／獨木舟／風帆／船艇之郊野旅程 \n\n進度性獎章 | 25\n\n<!-- p.27 -->\n童軍探索獎章 \n\n#### 3 . 先鋒工程 \n\n- a. 示範及指出以下所列繩結之結法及用途 \n\n   - ． 平結、八字結、雙套結、半結、反手結、稱人結、接繩結、 繫木結、縮繩結及曳木結 \n\n- b. 認識如何保養繩索 \n\n   - ． 示範收繩的方法及技巧 \n\n   - ． 指出妥善收藏繩索的重要性 \n\n##### 完成下列項目其中一項： \n\n- 註：成員只需在戶外活動／海上活動／航空活動選取其中一項為主要考覈項 目，而各進度性獎章的選項均須相同。惟海童軍必須選擇「海上活動」； 空童軍必須選擇「航空活動」。 \n\n- 4 . \n\n#### 戶外活動 ( 選修項目) \n\n   - a. 明瞭戶外活動安全指引及郊野守則 \n\n   - b. 參與下列其中一項戶外活動： \n\n      - I. 追蹤符號應用之活動 \n\n      - II. 公園定向活動 III. 使用密碼通訊之活動 \n\n- 5 . 海上活動 ( 選修項目) \n\n   - a. 明瞭海上活動安全守則 \n\n   - b. 通過本會之遊泳測試 \n\n- 6 . 航空活動 ( 選修項目) \n\n   - a. 明瞭旅客在機場及航機內一般航空安全守則 \n\n   - b. 完成下列其中一項： \n\n      - I. 參與一個與航空有關的戶外活動 \n\n      - II. 說出現代飛機〈包括定翼機、直昇機和軍用機〉的各主要部分及 名稱 \n\n      - III. 懂得基本航機辨認方法及能辨認初級航空章課程內的四種飛行器 \n\n### **B. 身心創藝** \n\n- 1 . 身心健康 \n\n   - a. 參與一次以運動或體能競技為主題的小隊活動 \n\n- 2 . 科學、科技、工程、藝術、數學及創意 \n\n   - a. 認識小隊歡呼，並於活動中吶喊以增強小隊士氣 \n\n26 | 進度性獎章\n\n<!-- p.28 -->\n童軍探索獎章 \n\n### **C. 領袖修養** \n\n- 1 . 領導才 \n\n   - a. 參與一次小隊會議及指出召開小隊會議的目的 \n\n- 2 . 靈性發展 \n\n   - a. 分享在日常生活中運用童軍誓詞、規律及銘言的例子 \n\nb. 參與一次默禱儀式 \n\n### **D. 社會責任** \n\n- 1 . 服務他人 \n\n   - a. 示範處理流鼻血、燒傷、燙傷、抽筋、扭傷、割傷及刺傷等意外事 件的方法 \n\n      - ． 指出意外事件的成因及處理的先後次序 \n\n   - b. 完成不少於四小時服務 \n\n      - ． 參與由總會、地域、童軍區或童軍旅認許之服務，其中可包括 日常學校內進行的恆常服務 \n\n      - ． 簡單記錄有關服務內容，例如：服務機構、對象、時間及地 點 \n\n##### 完成下列項目其中一項： \n\n- 註：成員只需在社區認識／生態環境／氣象選取其中一項為主要考覈項目， 而童軍探索獎章與其他進度性獎章的選項不須相同。 \n\n- 2 . 社區認識（選修項目） \n\n   - a. 介紹社區設施 \n\n      - ． 向小隊隊員介紹居所或旅部附近的社區設施，例如：警署、 醫院、消防局、民政事務處及公共交通工具等 \n\n- 3 . 生態環境（選修項目） \n\n   - a. 與小隊隊員參觀一個以自然生境或生態為主題的展覽或地方 \n\n      - ． 例如：米埔自然保護區、西貢海下灣海岸公園、濕地公園、有 機農場或自然教育徑等 \n\n- 4 . 氣象（選修項目） \n\n   - a. 認識天氣與氣候之別及香港的氣候，並列舉天氣及氣候對戶外活動 的影響 \n\n      - ． 就各種天氣要素，例如：氣溫、氣壓、風速風向、濕度及降 水等，指出不同的天氣情況對各種童軍活動的影響 \n\n進度性獎章 | 27\n\n<!-- p.29 -->\n童軍標準獎章 \n\n## 童 軍 標 準 獎 章 \n\n## **Scout Standard Award** \n\n適合： ( 1 ) 已完成童軍探索獎章*，或 \n\n- ( 2 ) 年滿十三歲而考獲會員章，並完成童軍探索獎章 內「戶外挑戰」項目之童軍成員。 \n\n於選修項目中，海童軍必須選擇「海上活動」；空童軍必須選擇「航空活動」。 \n\n- 如成員希望在考覈童軍標準獎章的同時完成相關的香港青年獎勵計劃銅章 級的內容，請在年滿十三歲及已完成童軍探索獎章後開展童軍標準獎章的考 核。 \n\n完成下列各項： \n\n### **A. 戶外挑戰** \n\n#### 1 . 營藝 \n\n- a. 協助、參與及記錄一次至少兩日一夜露營活動，並擔當其中一項小 隊的崗位 \n\n   - ． 例如：隊長、副隊長、急救員、主廚、物資管理員等 \n\n- b. 物資準備及管理 \n\n   - ． 準備一份適合至少兩日一夜露營活動的個人及小隊物資清單 \n\n   - ． 收拾一個適合至少兩日一夜露營用的背囊 \n\n- c. 架搭、收拾及存放營幕 \n\n   - ． 認識不同營幕的種類，例如：屋營、蒙古營 \n\n   - ． 示範架搭、收拾及妥善存放一個營幕 \n\n- d. 在露營活動中與小隊隊員合作完成不少於四項營地建設 \n\n   - ． 例如：營區圍欄、旗架、營門、衣鞋架、廢物處理設施等 \n\n- e. 示範利用天然物品及火柴或打火石在戶外生火 \n\n   - ． 指出火的形成元素 \n\n   - ． 指出可作為燃料的天然物品 \n\n   - ． 示範搭建一個柴架及進行生火 \n\n   - ． 能夠將器皿內的水加熱至沸騰 \n\n- f. 認識及體驗在戶外烹調 \n\n   - ． 按食物營養概念設計一個適合至少兩日一夜露營的食譜及單 獨烹調其中一款菜式 \n\n   - ． 處理膳後工作 \n\n28 | 進度性獎章\n\n<!-- p.30 -->\n童軍標準獎章 \n\n#### 2 . \n\n#### 歷險 \n\n##### a. 認識比例及距離 \n\n   - ． 指出兩種地圖所使用的比例 \n\n   - ． 指出比例與距離的關係 \n\n   - ． 示範換算實際距離與地圖距離 \n\n- b. 示範正置地圖 \n\n   - ． 指出正置地圖的方法及目的 \n\n   - ． 在郊野中利用地形、地貌與地徵及指南針示範正置地圖的方法 \n\n- c. 利用指南針及地圖尋找自己的位置 \n\n   - ． 認識指南針的各部分及保養指南針的方式 \n\n   - ． 認識圖北、磁北、正北及坐標系統 \n\n   - ． 示範利用指南針及地圖尋找自己的位置 \n\n   - ． 示範以四位及六位方格座標標示自己的位置 \n\n- d. 明瞭遠足安全守則及於郊野旅程中的求救方法 \n\n- e. 參與及記錄一次郊野旅程 \n\n   - ． 與小隊一同完成 \n\n      - (i) 一日或不少於十公里徒步或 \n\n      - (ii) 不少於十五公里單車／獨木舟／風帆／船艇之郊野旅程 \n\n#### 3 . 先鋒工程 \n\na. 示範及指出以下所列編結之結法及用途 \n\n   - ． 四方編結、十字編結、八字編結、圓周編結及展立編結 \n\n- b. 指出及遵守先鋒工程的安全守則 \n\n- c. 運用結、索及編結進行一項先鋒工程活動 \n\n   - ． 例如：羅馬炮彈架、童軍棍發彈器（Scout Staff Ballista）、彈跳 火箭筒（Bouncing Bazooka）、導向飛彈發射器 （Guided Missile Launcher） 或小隊擺動橋 （Patrol Swing Bridge）等 \n\n##### 完成下列項目其中一項： \n\n- 註：成員只需在戶外活動／海上活動／航空活動選取其中一項為主要考覈項 目，而各進度性獎章的選項均須相同。惟海童軍必須選擇「海上活動」； 空童軍必須選擇「航空活動」。 \n\n#### 4 . 戶外活動 ( 選修項目) \n\n- a. 完成童軍探索獎章戶外活動部分 \n\n- b. 考獲一個從未在過往獎章獲得與戶外活動有關之專科徽章 \n\n      - ． 例如：公園定向（興趣組）、自然（興趣組）、地質（興趣組） 或步操（興趣組）等 \n\n- c. 完成下列其中一項從未在過往獎章參與之戶外活動： \n\n   - I. 參與一次城市追蹤活動 \n\nII. 參與一次使用密碼、旗號或相類似形式之通訊活動 \n\n進度性獎章 | 29\n\n<!-- p.31 -->\n童軍標準獎章 \n\n#### 5 . 海上活動 ( 選修項目) \n\n   - a. 完成童軍探索獎章海上活動部分 \n\n   - b. 考獲艇工章 \n\n   - c. 於本會海上活動中心，參與一次童軍標準艇以外之海上活動 \n\n- 6 . 航空活動 ( 選修項目) \n\n   - a. 完成童軍探索獎章航空活動部分 \n\n   - b. 考獲初級航空活動章 \n\n   - c. 完成下列其中一項： \n\n      - I. 明瞭風如何影響飛行活動 \n\nII. 認識與飛行安全相關的航空法例 \n\n### **B. 身心創藝** \n\n- 1 . 身心健康 \n\n   - a. 考獲一個從未在過往獎章獲得與體適能有關之專科徽章 \n\n- ． 例如：運動（興趣組）、單車（興趣組）、射箭（興趣組）、 游泳（興趣組）或獨木舟（興趣組）等 \n\n- 2 . 科學、科技、工程、藝術、數學及創意 \n\n   - a. 參與一次營火會或營燈會活動 \n\n   - b. 完成下列其中一項： \n\n      - I. 考獲一個從未在過往獎章獲得與科學、科技、工程、藝術或數學 有關之專科徽章 \n\n         - ． 例如：天象（技能組）、樹木護理（技能組）、立體打印（技 能組）、電腦（興趣組）、模型製作（興趣組）、機械（技 能組）、音樂（興趣組）、藝術（興趣組）、數據分析（技 能組）或編程（技能組）等 \n\n      - II. 與小隊隊員一同欣賞一個藝術表演節目 \n\n         - ． 例如：話劇、魔術、唱歌、樂器演奏、舞蹈或木偶／布偶戲 等 \n\n      - III. 與小隊隊員一同參觀一個藝術品展覽 \n\n         - ． 例如：畫展、花卉展、盆景藝術展或瓷器展等 \n\n      - IV. 表演一首所屬小隊的小隊歌 \n\n      - V. 與小隊隊員一同參觀一個科技展覽 \n\nVI. 製作一個以電池驅動的電子小工具，並指出其用途及運作原理 \n\n30 | 進度性獎章\n\n<!-- p.32 -->\n童軍標準獎章 \n\n### **C. 領袖修養** \n\n- 1 . 領導才 \n\n   - a. 參與一次小隊戶內或戶外活動 \n\n- 2 . 靈性發展 \n\n   - a. 參與一次童軍崇拜會 \n\n   - b. 完成下列其中一項： \n\n      - I. 向小隊隊員介紹一個宗教，包括其歷史背景及習慣等 \n\n      - II. 向小隊隊員分享一個信念 \n\n         - ． 例如：人生觀、價值觀、世界觀及世界大同等 \n\n### **D. 社會責任** \n\n#### 1 . 服務他人 \n\n- a. 示範在意外發生時，如何迅速進行基本檢查及召喚緊急服務 ． 並認識急救的原則及緊急事故的處理方法 \n\n- b. 收拾一個適合至少兩日一夜露營用的個人急救藥囊 \n\n   - ． 並認識如何應用藥囊內之各項用品 \n\n- c. 參與共不少於十小時服務（為期不少於十個星期） \n\n   - ． 參與由總會、地域、童軍區或旅團認許之服務，其中可包括 日常學校內進行的恆常服務 \n\n   - ． 簡單記錄有關服務內容，例如：服務機構、對象、時間及地 點 \n\n- d. 擔任一次與中式隊列或升國旗儀式相關之崗位，例如：隊列隊伍成 員、升旗手、護旗手或司令員等 \n\n##### 完成下列項目其中一項： \n\n註：成員只需在社區認識／生態環境／氣象選取其中一項為主要考覈項目， 而童軍標準獎章與其他進度性獎章的選項不須相同。 \n\n#### 2 . 社區認識（選修項目） \n\n- a. 完成下列其中一項： \n\n   - I. 參與或觀賞一個本地的文化習俗或傳統節慶活動 \n\n      - ． 例如：舞龍、舞獅、飄色巡遊、賽龍舟、舞火龍、神功戲、祈 福許願或粵劇等 \n\nII. 以任何形式向小隊隊員分享一個近期的本地時事議題 \n\n進度性獎章 | 31\n\n<!-- p.33 -->\n童軍標準獎章 \n\n#### 3 . 生態環境（選修項目） \n\n   - a. 完成下列其中一項： \n\n      - I. 以任何形式向小隊隊員介紹生物鏈、生物網及物種生態循環 \n\n      - II. 與小隊隊員參觀一個體現生物鏈、生物網或物種生態循環的生態 環境 \n\n         - ． 例如：樹林、河流、濕地、巖岸或海洋等 \n\n- 4 . 氣象（選修項目） \n\n   - a. 完成下列其中一項： \n\n      - I. 以任何形式向小隊隊員介紹風速及風向的量度方法及基本原理 II. 以任何形式向小隊隊員介紹雲的形成過程（例如：水循環及抬升 過程）及十種基本雲層的種類及特徵 \n\n### **E. 國際視野** \n\n- 1 . 以任何形式向小隊隊員介紹一種外地的活動或文化 \n\n   - ． 例如：歌曲、遊戲、活動或語言等 \n\n### **F. 探索新知** \n\n**1** . **以童軍身份參與一次與其他旅團或團體的交流活動** \n\n32 | 進度性獎章\n\n<!-- p.34 -->\n童軍高級獎章 \n\n## 童 軍 高 級 獎 章 **Scout Advanced Award** \n\n適合: \n\n- ( 1 ) 已完成童軍標準獎章*，或 \n\n- ( 2 ) 年滿十四歲而考獲會員章，完成童軍探索獎章及 童軍標準獎章內「戶外挑戰」項目之童軍成 員。 \n\n於選修項目中，海童軍必須選擇「海上活動」；空童軍必須選擇「航空活動」。 \n\n- 如成員希望在考覈童軍高級獎章的同時完成相關的香港青年獎勵計劃銅章 級的內容，成員必須在年滿十四歲及已完成童軍標準獎章後開展童軍高級獎 章的考覈。 \n\n##### 完成下列各項： \n\n### **A. 戶外挑戰** \n\n#### 1 . 營藝 \n\n- a. 協助策劃及參與一次至少兩日一夜的露營活動，並在活動中負責其中 一個範疇的工作 \n\n   - ． 安排露營膳食，包括設計食譜、採購及烹調食材 \n\n   - ． 管理營地衛生，包括執行及安排營地衛生工作 \n\n   - ． 管理露營物資，包括準備及借還物資 \n\n- b. 在露營活動中與小隊隊員合作完成不少於六項營地建設 \n\n   - ． 例如：飯桌、工作檯、貯物架、天幕、告示板、濾水器、紗 櫃及氣死蟻裝置等 \n\n- c. 進行一次原野烹飪活動（即利用天然物品及火柴生火並烹調食物） ． 例如：雞、魚、薯仔蛋、洋蔥蛋及麵包條等 \n\n- d. 明瞭保護及清理營地的要求 \n\n#### 2 . 歷險 \n\n- a. 完成童軍標準獎章歷險部分 \n\n- b. 認識等高線與地形的關係 \n\n   - ． 並能從等高線中識辨不同地形，例如：山咀、山脊、山谷、山 丘及懸崖等 \n\n進度性獎章 | 33\n\n<!-- p.35 -->\n##### 童軍高級獎章 \n\n- c. 示範在野外迷失及沒有指南針的情況下辨別方向的技巧 \n\n   - ． 使用例如：太陽、星座、樹木生長情況等來辨別方向 \n\n- d. 明瞭各類型的山野危機及其成因，並熟習緊急事故處理方法 \n\n- e. 明瞭「不留痕」 （Leave No Trace） \n\n- f. 完成以下其中一項： \n\nI. 與小隊隊員共同策劃及完成一次兩日一夜及不少於十五公里遠足 或不少於二十公里單車／獨木舟／風帆／船艇之郊野旅程 \n\n   - ． 計劃書內容應最少包括路程目的、擬定露營地點及停泊處（如 有需要）、旅程表及路線圖（需包括後備及緊急路線）、天氣 預報、個人物資及小隊物資、安全及緊急措施及個人資料等 \n\n   - ． 記錄是次郊野旅程，其內容應最少包括旅程表及路線圖（需 包括後備及緊急路線）、行程紀錄及小隊及個人物資 \n\n- ． 以上之郊野旅程前須進行一次野外訓練（一日）及一次實習 旅程（一日） \n\n- II. 進行一次一日的訓練旅程及與小隊隊員共同策劃及完成一次兩日 一夜（最少共十二小時之活動時間）遠足／單車／獨木舟／風帆 ／船艇之郊野旅程 \n\n   - ． 計劃書內容應最少包括：路程目的、擬定露營地點及停泊處（如 有需要）、旅程表及路線圖（需包括後備及緊急路線）、天氣 預報、個人物資及小隊物資、安全及緊急措施及個人資料等 \n\n   - ． 記錄是次郊野旅程，其內容應最少包括旅程表及路線圖（需包 括後備及緊急路線）、行程紀錄及小隊及個人物資 \n\n- III. 參與策劃、進行及紀錄一次由黃昏至黎明之遠足旅程 \n\n   - ． 計劃書內容應最少包括路線圖（需包括後備及緊急路線）、 遠足路程表、天氣預報及個人及小隊物資等 \n\n   - ． 記錄一次郊野旅程，其內容應最少包括路線圖（需包括後備 及緊急路線）、遠足路程表、行程紀錄及小隊及個人物資 \n\n#### 3 . 先鋒工程 \n\n- a. 示範及指出所列繩結之結法及用途 \n\n   - ． 包括雙接繩結、漁翁結、三套結、勾口結、吊板結及普通繩 端結 \n\n- b. 選擇、使用及保養適合先鋒工程之工具 \n\n   - ． 例如：繩、竹、棍、滑輪、鎚及釘等 \n\n- c. 運用不少於兩種編結製作兩項簡單先鋒工程 \n\n   - ． 例如：摩天風向計(Skylon Weathercock)、吊燈架(Skylite) 或十 分鐘高臺(Ten-minute Tower) 等 \n\n34 | 進度性獎章\n\n<!-- p.36 -->\n童軍高級獎章 \n\n##### 完成下列項目其中一項： \n\n- 註：成員只需在戶外活動／海上活動／航空活動選取其中一項為主要考覈項 目，而各進度性獎章的選項均須相同。惟海童軍必須選擇「海上活動」； 空童軍必須選擇「航空活動」。 \n\n- 4 . 戶外活動 ( 選修項目) \n\n   - a. 完成童軍標準獎章戶外活動部分 \n\nb. 考獲以下其中一個指定技能組專科徽章 \n\n． 露營、探險、先鋒工程或原野烹飪專科徽章 \n\n#### 5 . 海上活動 ( 選修項目) \n\n   - a. 完成童軍標準獎章海上活動部分 \n\n   - b. 考獲水手章 \n\n   - c. 考獲與海上活動有關之專科徽章 \n\n- 6 . 航空活動 ( 選修項目) \n\n   - a. 完成童軍標準獎章航空活動部分 \n\n   - b. 考獲中級航空活動章 \n\n   - c. 認識簡單的航空氣象，如雷暴、積水及濃霧對飛機構成的危險，並 能講述在不同情況下可能形成的天氣 \n\n### **B. 身心創藝** \n\n- 1 . 身心健康 \n\n   - a. 完成下列其中一項： \n\n      - I. 考獲一個從未在過往獎章獲得與體適能有關之專科徽章 \n\n         - ． 例如：運動（興趣組）、獨木舟（興趣組）、龍舟（興趣組）、 騎術（興趣組）、划艇（興趣組）、風帆（興趣組）、滑浪 風帆（興趣組）、射箭（技能組）、野外定向（技能組）、 技擊（技能組）、射擊（技能組）或徒手潛水（技能組）等 \n\n         - ． 學習或練習上述專科徽章之技能的時間最少需要十三小時， 且持續地在不少於三個月（即十三個星期）進行 \n\n      - II. 訂立、執行及記錄一個為期最少十三小時，且持續地不少於三個 月（即十三個星期）的體能訓練，並簡單記錄每個星期的進度 \n\n      - III. 介紹人體生長和發育過程及不良嗜好對健康的影響 \n\n         - ． 不良嗜好，例如：酗酒、吸煙、吸食有機溶劑或濫用藥物等 \n\n      - IV. 以任何形式宣傳一個有關健康生活的主題 \n\n         - ． 例如：預防愛滋病、預防傳染病或防止濫用藥物等 \n\n         - ． 並出席相關的講座或參觀相關的展覽 \n\n      - V. 考獲「積極公民」獎章系列 – 禁毒章 \n\n進度性獎章 | 35\n\n<!-- p.37 -->\n童軍高級獎章 \n\n#### 2 . 科學、科技、工程、藝術、數學及創意 \n\n- a. 考獲一個從未在過往獎章獲得與科學、科技、工程、藝術或數學有 關之專科徽章 \n\n   - ． 例如：天象（技能組）、樹木護理（技能組）、立體打印（技 能組）、電腦（興趣組）、模型製作（興趣組）、機械（技 能組）、音樂（興趣組）、藝術（興趣組）、數據分析（技 能組）或編程（技能組）等 \n\n- b. 完成下列其中一項： \n\nI. 表演一個節目 \n\n- ． 於小隊、團或旅活動中表演一個節目，例如：話劇、魔術、唱 歌、樂器演奏、舞蹈或木偶／布偶戲等 \n\nII. 製作一件藝術品 ． 為小隊、團或旅的活動製作一件藝術品，例如：畫、玻璃畫、 皮革製品、蠟製裝飾品、雕刻品、繩結裝飾品、糖果或蛋糕等 III. 創作及表演一首小隊歌 \n\n- ． 為小隊創作及表演一首小隊歌 \n\nIV. 製作一個模型 ． 利用適當材料製作一個符合比例的模型，例如：營地、先鋒 工程、飛機或船隻等模型 \n\nV. 利用資訊科技宣傳小隊、團或旅活動 \n\n． 以建立網站、建立社交網站宣傳頁、撰寫網誌、拍攝數碼短 片或製作電子海報等形式製作宣傳品 \n\n- VI. 製作一個電動機械動物或昆蟲或相類似之電動機械模型 ． 指出其製作概念、製作材料及運作原理 \n\n### **C. 領袖修養** \n\n- 1 . 領導才 \n\na. 執行小隊長會議之議決案 \n\n   - ． 出席或列席最少一次小隊長會議及負責執行其中一項議決案 \n\n   - b. 計劃及執行一次戶內或戶外小隊活動 \n\n- 2 . 靈性發展 \n\n   - a. 擔任及履行一小隊或旅團職務不少於六個月 \n\n   - b. 完成下列其中一項： \n\n      - I. 參與一個宗教／靈性發展活動 ． 例如：「對神明‧ 盡責任」日 \n\n      - II. 向小隊隊員分享個人宗教信仰 ． 包括宗教信念和習慣，及與童軍運動的關係 \n\n36 | 進度性獎章\n\n<!-- p.38 -->\n童軍高級獎章 \n\n### **D. 社會責任** \n\n#### 1 . 服務他人 \n\n- a. 收拾一個適合至少兩日一夜露營用的小隊急救藥囊 \n\n   - ． 指出藥囊內各項用品之用途及使用方法 \n\n- b. 示範如何處理創傷、出血、中暑、熱衰竭、體溫過低、異物入眼、 耳或鼻及昆蟲及動物咬傷之情況 \n\n- c. 協助策劃及持續地參與共不少於十六小時服務（為期不少於十六個星 期） \n\n   - ． 協助策劃及參與由旅團、童軍區、地域或總會認許之服務， 其中可包括日常學校內進行的恆常服務 \n\n   - ． 當中有不少於四小時的服務時數必須以童軍身份參與，而其 他的服務時數可以童軍或非童軍身份參與 \n\n   - ． 簡單紀錄有關服務內容，例如：服務機構、對象、時間及地 點 \n\n##### 完成下列項目其中兩項： \n\n- 註：成員只需在社區認識／生態環境／氣象／危機及保護選取其中兩項為主 要考覈項目，而童軍高級獎章的選項須與總領袖獎章的選項不同。 \n\n- 2 . 社區認識（選修項目） \n\na. 完成下列其中一項： \n\n- I. 考獲一個從未在過往獎章獲得與社區認識有關的專科徽章或獎章 \n\n   - ． 例如：公民（服務組）、多元共融（服務組）、公共衛生（服 務組
