stance, Government in granting premises for use of event may consider displaying names of sponsors within the premises not acceptable. Commercial advertisements will normally not be allowed. \n\n###### **12.3 Outside Funding Sources** \n\nApplications for outside funding in the name of Scout Unit shall be submitted through Association Headquarters with the recommendation of the immediate supervising Commissioner of the Budget Holder concerned. \n\n###### **12.4 Control over Payments** \n\n- (a) Any payments from donation or fund raised must be within the purposes and context of the donation and fund raising. \n\n- (b) All payments must follow the procedures in Section Seven of this Guidance Notes. Budget Holder and/or fund raising committee/task force should ensure payments would not exceed a predetermined/budgeted amount. \n\nSection Twelve - Donations/Sponsorship & Fund Raising \n\nOctober 2020\n\n<!-- p.35 -->\nPage 35 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION THIRTEEN** \n\n###### **INVESTMENT** \n\nIn the context of this Section, fixed deposit in banks and/or investment through Hong Kong Scout Foundation of the Association (“Scout Foundation”) only requires the agreement of the Executive Committee concerned and no investment committee is necessary.  For Branches, their investments should be through Scout Foundation.  In accordance with the Global Support Assessment Tool (GSAT), Scout Unit should maintain sufficient cashflow, or equivalent amount of investments that can be immediately freed for use without losing the capital, to operate for at least 2 years. \n\n###### **13.1 Authorization of Investment Account** \n\n- (a) Except otherwise agreed by Chief Commissioner and Association Treasurer in writing, all investment account with the investment bank/security trading company should be opened in the name of ‘Scout Association of Hong Kong – **name of Scout Unit** ’. Opening or closing of an investment account requires the prior approval of the Executive Committee concerned, which should be properly recorded. \n\n- (b) In order to reduce the risk of financial loss as a result of unauthorized/inappropriate investment activities, all investment activities should be covered by a valid trading agreement.  The trading agreement should at least cover method of placing instruction and name of authorized signatories (and trader(s) if entailed by the agreement and so delegated by Scout Unit).  Unit-in-charge concerned should ensure that changes in authorized signatories and trader(s) are updated and communicated to the relevant bank/securities trading company on a timely basis. \n\n- (c) Each investment account should be operated by at least two authorized signatories. \n\n- (d) Records of specimen signatures of these authorized persons should be kept in a lockable place. \n\n###### **13.2 Investment Committee** \n\n- (a) Scout Unit, through its Executive Committee, should establish an investment committee for handling investment decisions.  This committee is responsible for the investment of funds and shall report to the Executive Committee at regular meeting. \n\n- (b) Executive Committee should establish formal terms of reference for the investment committee setting out the objective, the authority, its roles and responsibilities. \n\n- (c) Investment committee will assess the investment environment from time to time and issue investment directions for the actual implementation by authorized staff appointed. \n\n- (d) Investment committee should establish policies as guidance on investment activities. These should cover areas such as: \n\n   - Scope of investment \n\n   - Investment selection criteria \n\nSection Thirteen - Investment \n\nOctober 2020\n\n<!-- p.36 -->\nPage 36 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- Setting/defining acceptable risk levels \n\n- Trading limits with investment banks \n\n- Approval and documentation requirements \n\n- Responsible personnel, etc. \n\n###### **13.3 Investment Decisions** \n\n   - (a) All investment activities should be carried out according to the current investment policies/guidelines of respective Scout Units. \n\n   - (b) If deviations from established investment guidelines are due to changes in investment objectives which render the existing guidelines obsolete, investment committee should update the investment policies/guidelines and ensure they are in line with current investment objectives _._ Major changes should be reported to the Executive Committee concerned. \n\n   - (c) Minutes should be prepared by the investment committee to document the rationales for the investment decisions (can be in summary form) for record. \n\n- **13.4 Investment Account Reconciliation** \n\n   - (a) Investment account reconciliation should be prepared monthly for each investment account.  The preparing person should sign and date on the reconciliation statement. \n\n   - (b) The reconciliation should be reviewed, checked and verified by the Unit-in-charge concerned who should counter sign and date on it to evidence the review. \n\n   - (c) Any outstanding items shown on the statement should be followed up promptly, with deadline(s) set by the Treasurer concerned. \n\n###### **13.5  Reporting of Investment** \n\nInvestments and their gains/losses shall be separately shown in the financial statements. \n\nSection Thirteen - Investment \n\nOctober 2020\n\n<!-- p.37 -->\nPage 37 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION FOURTEEN** \n\n###### **INCOME RECOGNITION AND ACCOUNTS RECEIVABLE** \n\n###### **14.1 Principle of Income Recognition** \n\n- (a) Main source of income (including Programme/Training/Activity Fees, Camp Fee, Room Booking Fees, etc.) is accounted for on an accrual basis. \n\n- (b) Revenue from the sales of goods is recognized on the transfer of risks and rewards of ownership, which in general coincides with the time when the goods are delivered to customers and the title has passed. \n\n- (c) Interest income (if it carries a significant effect on the financial statements, say 5% of total income for District and 1% for other Scout Units) is recognized on a time proportion basis, taking into account the principal amounts outstanding and the interest rates applicable. \n\n- (d) Donations, Lay Members’ subscriptions and annual contributions are recognized when received. \n\n- (e) Miscellaneous income is recognized when received, unless it carries a significant effect on the financial statements, say 5% of total income for District and 1% for other Scout Units, then it is accounted for on an accruals basis at the end of each financial year. \n\n###### **14.2 Accounts Receivable** \n\n- (a) The Association adopts the principle that **NO CREDIT** will be given to service users, i.e. users should **pay before services are rendered** . \n\n- (b) Each Scout Unit should set its own detailed procedures to ensure payment has been settled by service user before service is rendered. \n\n- (c) In exceptional case, credit can only be given at the discretion of Budget Holder whose approval should be in writing with justifications clearly documented. Written approval must be obtained before the credit is given.  Unit-in-charge is required to follow up for settling, within 1 month, the outstanding payment. \n\n- (d) In case the outstanding amount is not settled within 1 month, an Ageing Summary (Sample at Annex 14-1) should be prepared every month and brought to the attention of the Treasurer concerned and/or immediate supervisor of Unit-in-charge.  A reminder should be issued by Scout Unit concerned to the service user for immediate settlement. \n\n- (e) If the outstanding amount remains not settled within 3 months, Budget Holder should report to the finance committee concerned or the Executive Committee concerned if \n\nSection Fourteen - Income Recognition & Accounts Receivable \n\nOctober 2020\n\n<!-- p.38 -->\nPage 38 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nno finance committee is established in Scout Unit concerned. \n\n- (f) If the outstanding amount remains not settled within 6 months, Budget Holder should report to the Executive Committee concerned and recommend any further action such as legal proceedings, written off, etc. to be taken. \n\n- (g) In all cases, all outstanding amounts should be accounted for in the financial statements of the financial year concerned. \n\nSection Fourteen - Income Recognition & Accounts Receivable \n\nOctober 2020\n\n<!-- p.39 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n**Annex 3-1** \n\n#### **SCOUT ASSOCIATION OF HONG KONG Name of Scout unit** \n\n#### **Register of Official Receipt Books/Forms** \n\n||Receipt|**RECE**<br>Number|**IVED**<br>Custo|dian||**ISSUED**<br>Recipient|Date|**COMPLETED OR**<br>**OBSOLETE FORMS**<br>Custodian|**REMARKS**|\n|---|---|---|---|---|---|---|---|---|---|\n|Date|From|To|Name/Rank|Signature|Date|Name/Rank<br>Signature|Returned|Name/Rank<br>Signature||\n\nOctober 2020\n\n<!-- p.40 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n**Annex 3-2** \n\n#### **SCOUT ASSOCIATION OF HONG KONG Name of Scout Unit** \n\n#### **Income Collection Summary** \n\n|<br>|Date<br>: <br>Serial No<br>: <br>||\n|---|---|---|\n|**Receipt No.**<br>**Account**|**Particulars**|**Amount**<br>**HK$**|\n||**TOTAL**||\n|**Bank A/C**|**Amount (HK$)**<br>**Ban**|**k-in Date**|\n|**TOTAL**|||\n|Name|Position<br>Signature|Date|\n|Prepared by:<br>Reviewed by:|Unit-in-charge||\n\nOctober 2020\n\n<!-- p.41 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n**Annex 5-1** \n\n#### **SCOUT ASSOCIATION OF HONG KONG Name of Scout Unit** \n\n#### **Register of Cheque Books** \n\n#### **[Name of Bank] [Bank Account No.] (e.g. SOCIATION OF HONG KONG Name of Scout Unit** \n\n**Ageing Summary as at Reporting Date:** \n\n|||||**Outstanding**|**Payment (HK$)**|||\n|---|---|---|---|---|---|---|---|\n|**Name**|**Description**|**Event/Due**<br>**date**<br>**TOTAL**|**Exceeding**<br>**1 month**|**Exceeding**<br>**3 months****(1)**|**Exceeding**<br>**6 months****(2)**|**Total**<br>**Amount**|**Remarks**|\n\n_Note 1: Outstanding payment over 3 months should be brought up to finance committee concerned for attention. Note 2: Outstanding payment over 6 months should be brought up to the Executive Committee concerned for any further action._ \n\n||Name|Position|Signature|Date|\n|---|---|---|---|---|\n|Prepared by:||Unit-in-charge|||\n|Reviewed by:||Immediate supervisor of<br>Unit-in-charge|||\n\ncc. Treasurer concerned \n\nOctober 2020\n","03_政策及安全指引/IT01-23_HK-Scouts-App-Launch-and-Installation_Chi.md":"---\nsource_file: \"IT01-23_HK-Scouts-App-Launch-and-Installation_Chi.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 資訊科技署 電話：2957 6433 傳真：2302 1001 電郵：it@scout.org.hk \n\n第 **01/2023** 號通告 **2023** 年 **6** 月 **1** 日 \n\n# 「香港童軍」流動應用程式 \n\n香港童軍總會首個流動應用程式「香港童軍」App 現已推出，提供一站式童軍資訊 及多項個人化功能，為童軍成員及其他人士帶來新的用戶體驗。現時的版本包含以下各 項： \n\n   - **(I)** 主要內容 \n\n      - (a) 童軍動向：最新消息、活動與訓練、公佈、政策及指引、行政及分享訊息 \n\n      - (b) 活動與訓練：方便篩選、搜尋、收藏訊息，亦可設定提示通知以便在截止前 報名 \n\n      - (c) 分享：區會及以上童軍單位分享刊物、趣聞、活動相片、影片連結等 \n\n      - (d) 單位資料：開放／集會時間、聯絡方法、網站、FB 及 IG，一按即致電／電郵 功能 \n\n      - (e) 常用資訊：青少年成員支部、木章及領袖訓練、政策、指引及表格等 \n\n   - **(II)** 主要功能 \n\n      - (a) 我的關注：收取所關注發布單位、訊息類別或發布對象的 App 推送通知 \n\n      - (b) 我的收藏：將感興趣或常用的資訊標示為我的收藏，可進一步篩選及搜尋 \n\n      - (c) 我的行事曆：已關注及收藏活動／訓練的舉行日期一目瞭然，可以添加資料 入手機／平板日曆內 \n\n      - (d) 用戶介面：按個人需要在系統設定中選擇正常／黑暗模式、中文／英文顯示 及字體大小 \n\n2. 歡迎按手機／平板作業系統下載及安裝「香港童軍」App 獲取童軍資訊： \n\n<!-- Start of picture text -->\niOS 手機／平板 Android 手機／平板 其他手機／平板<br>作業系統 作業系統 作業系統<br>（經 App Store 下載及安裝） （經 Google Play 下載及安裝） （直接下載及安裝 APK 程式檔）<br>如對「香港童軍」App 的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957 App 的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957  的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957 2957<br>；電郵：it@scout.org.hk）。it@scout.org.hk）。）。<br>助理香港總監 (資訊科技及支援)<br>岑 偉 建<br><!-- End of picture text -->\n\n3. 如對「香港童軍」App 的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957 App 的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957  的安裝或使用有任何疑問，請與資訊科技署聯絡（電話：2957 2957 6345；電郵：it@scout.org.hk）。it@scout.org.hk）。）。\n","03_政策及安全指引/P005-24.md":"---\nsource_file: \"P005-24.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 13\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 \n\n**2024** 年 **1** 月 **1** 日 第 **5/2024** 號通告 [政策／指引] \n\n電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n# 青少年成員遠足訓練課程及考驗修訂 **Amendment of Youth Expedition Training Scheme and Assessment** \n\n此通告取代 2022 年 1 月 1 日發出之青少年活動通告第 19/2022 號。 \n\n為配合本會遠足技能證書課程內容及香港青年獎勵計劃野外鍛鍊科要求的改動，及 調整「進階遠足訓練班」的定位，本署決定對成員之遠足訓練課程進行修訂。有關詳情 臚列如下： \n\n第一部分： 有關「進階遠足訓練班」之內容修訂 \n\n1. 修改戶外旅程次數要求。 \n\n2. 為已以徒步遠足形式完成以下任何一項的成員提供豁免戶外旅程次 數的安排： \n\n- 深資童軍獎章 － 探險段章 或 \n\n- 樂行童軍獎章 － 探險項目 或  遠足技能證書 或  香港青年獎勵計劃銀章級野外鍛鍊科。 \n\n- 3. 為成員提供對應香港青年獎勵計劃野外鍛鍊科直接金章級訓練的要 求。 \n\n第二部份： 計劃生效日期 由 2024 年 1 月 1 日起，「進階遠足訓練班」須按修訂的開辦指引進行。 \n\n第三部份： 各類訓練班的開辦指引 \n\n1. 「基本遠足訓練班」開辦指引，見附件 1。 2. 「深資／樂行童軍地圖閱讀訓練班」開辦指引，見附件 2。 3. 「深資／樂行童軍遠足訓練班」開辦指引，見附件 3。 4. 「進階遠足訓練班」開辦指引，見附件 4。 \n\n青少年活動總監 羅紹衡\n\n<!-- p.2 -->\n【附件 1】 青少年活動署第 5/2024 號通告 \n\n(1/1/2024) \n\n## 香港童軍總會 青少年活動署 \n\n## 「基本遠足訓練班」開辦指引 \n\n（一）訓練班名稱： 基本遠足訓練班 Basic Expedition Course （二）舉辦單位： 總會青少年活動署、各地域及童軍區 （三）覈准及簽發開班證書： 1. 總會－ 青少年活動總監；或 副青少年活動總監 2. 地域及童軍區－ 地域總監；或 副地域總監（活動與訓練） （四）學員人數： 每小隊 4 至 7 名成員。 （五）參加資格： 1. 年滿 14 歲之童軍支部成員； 2. 參加者如需同時進行香港青年獎勵計劃銅章級野外鍛鍊科之基 本訓練及評核旅程，則必須持有本會簽發之香港青年獎勵計劃紀 錄簿。 （六）班領導人資格： 班領導人須為本會各級遠足審核員及香港青年獎勵計劃野外鍛鍊科 遠足導師。 （七）班職員出席要求： 1. 導師與小隊比例應為 1 比 1。 2. 學員進行戶外訓練期間，班領導人（或各級遠足審核員）、小隊 導師及最少 1 名持有有效急救證書之領袖必須出席。 （八）訓練班內容： 請參閱「基本遠足訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） （九）訓練班證書： 1. 完成訓練班之學員由舉辦單位發出訓練班證書及相關專科徽章 證書，證書由舉辦單位自行編印。如訓練班取錄跨區／地域之學 員，應將其考驗結果副本送呈有關之區會存案。 2. 班領導人須於證書上填上其審核員編號，並為進行香港青年獎勵 計劃銅章級野外鍛鍊科基本訓練及評核旅程之學員簽署紀錄簿。 備註： 訓練班編號無須向總會申請，證書編號並無特定模式，可由舉辦單 位自行編配。 \n\n1/3\n\n<!-- p.3 -->\n「基本遠足訓練班」課程大綱 \n\n### 學習時數：不少於 41.5 小時 \n\n||項目|內容|建議時間／次數|\n|---|---|---|---|\n|1.|簡介|課程簡介及審核程序|30分鐘|\n|2.|團隊精神|2.1團隊的功能<br>2.2何謂團隊精神|60分鐘|\n|3.|坐標系統|3.1四位坐標與六位坐標表示法<br>3.2坐標與面積的關係|30分鐘|\n|4.|地圖閱讀|4.1地圖認識及保養<br>4.2比例及距離<br>4.3習用圖例<br>4.4等高線及地形的認識：<br>山咀、山脊、山谷、山丘、懸崖<br>4.5方向及北的認識<br>4.6指南針的介紹<br>4.7指南針應用|150分鐘|\n|5.|導航技巧|5.1正置地圖<br>5.2地圖、實地特徵校對<br>5.3根據原定計劃進行旅程|60分鐘|\n|6.|裝備認識|6.1選擇適當之衣服及鞋襪<br>6.2個人及小隊裝備介紹<br>6.3背囊執拾及防水方法|60分鐘|\n|7.|策劃與報告|7.1旅程目的<br>7.2遠足策劃與計劃書<br>7.3路程表簡介及填寫方法<br>7.4遠足報告書|60分鐘|\n|8.|事工計劃|事工策劃及製作|30分鐘|\n|9.|露營技巧|9.1架設及拆卸營幕的方法和注意事項<br>9.2營地及個人清潔衛生<br>9.3香港營舍及營地的認識|90分鐘|\n|10.|食物與炊事|10.1選擇合適的食物及設計菜單<br>10.2選擇後備及緊急食糧<br>10.3包裝及攜帶食糧<br>10.4使用簡單爐具及處理燃料的程序及安全措施|60分鐘|\n|11.|登山安全及<br>緊急事故處理|11.1遠足安全守則<br>11.2意外事件處理方法<br>11.3求救方法|60分鐘|\n\n2/3\n\n<!-- p.4 -->\n|12.急救|12.1急救裝備<br>12.2輕微擦傷及割傷的傷口清理及簡單的包紮方法<br>12.3止血方法<br>12.4水泡、剌傷、輕微燒傷及燙傷的處理方法<br>12.5異物入眼、耳或鼻的處理<br>12.6昆蟲及動物咬傷|60分鐘|\n|---|---|---|\n|13.天氣認識|13.1香港氣候概況<br>13.2各種天氣現象對遠足活動的影響|30分鐘|\n|14.戶外活動守則|14.1說明香港郊野公園的「郊區守則」<br>14.2講解旅程中妥善處理廢物的方法|30分鐘|\n|15.戶外訓練一<br>（地圖閱讀技巧）|地圖閱讀技巧教授與實習<br>（共兩日，每日不少於6小時）|12小時|\n|16.戶外訓練二<br>（遠足旅程）|遠足旅程訓練與實習<br>（兩日一夜旅程，旅程距離不少於20公里）|兩日一夜|\n\n註：上述建議時間可根據實際需要作出調整，惟戶外訓練旅程次數須滿足課程大綱的最低要求。 \n\n3/3\n\n<!-- p.5 -->\n【附件 2】 青少年活動署第 5/2024 號通告 (1/1/2024) \n\n## 香港童軍總會 青少年活動署 \n\n## 「深資／樂行童軍地圖閱讀訓練班」開辦指引 \n\n（一）訓練班名稱： 深資童軍地圖閱讀訓練班 Venture Scout Map Reading Course 樂行童軍地圖閱讀訓練班 Rover Scout Map Reading Course \n\n- （二）舉辦單位： 總會青少年活動署、各地域及童軍區 \n\n（三）覈准及簽發開班證書： 1. 總會－ 青少年活動總監；或 副青少年活動總監 2. 地域及童軍區－ 地域總監；或 副地域總監（活動與訓練） （四）學員人數： 每小隊 4 至 7 名成員 \n\n- （五）參加資格： 深資童軍 或 樂行童軍成員 （六）班領導人資格： 班領導人須為本會遠足審核員或高級遠足審核員 \n\n- （七）班職員出席要求： 1. 導師與小隊比例應為 1 比 1。 \n\n      2. 學員進行戶外訓練期間，班領導人（或遠足審核員或高級遠足審 核員）、小隊導師及最少 1 名持有有效急救證書之領袖必須出席。 \n\n- （八）訓練班內容： 請參閱「深資／樂行童軍地圖閱讀訓練班」課程大綱。 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （九）訓練班證書： \n\n   - （九）訓練班證書： 1. 完成訓練班之學員由舉辦單位發出訓練班證書。證書由舉辦單位 自行編印； \n\n   - 2. 班領導人須於證書上填上其審核員編號。 \n\n   - 備註： 訓練班編號無須向總會申請，證書編號並無特定模式，可由舉辦單 位自行編配。 \n\n1/3\n\n<!-- p.6 -->\n## 「深資／樂行童軍地圖閱讀訓練班」課程大綱 \n\n學習時數：不少於 26.5 小時 \n\n||項目|內容|建議時間|\n|---|---|---|---|\n|1.|地圖認識|1.1何謂地圖及地圖閱讀的定義<br>1.2地圖的種類<br>1.3圖邊資料的認識<br>1.4地圖的習用圖例<br>1.5覆摺地圖及保養方法|60分鐘|\n|2.|比例及距離|2.1比例表示法<br>2.2在地圖上量度距離的方法|15分鐘|\n|3.|坐標系統|3.1座標的組成與面積的關係<br>3.2<br> 四位、六位及八位坐標表示法<br>3.3讀圖尺（Romer）的使用|45分鐘|\n|4.|指南針、方向<br>及北的認識|4.1常用的指南針種類介紹及保養.<br>4.2方位表示法<br>4.3磁北、方格北、正北的定義<br>4.4磁向偏差|30分鐘|\n|5.|等高線及地勢|5.1何謂等高線<br>5.2等高線所表示的地貌<br>5.3兩地間彼此可見性的測試法|45分鐘|\n|6.|地圖及指南針<br>運用|6.1在地圖上使用指南針量度方位<br>6.2網格方位和實地方位的轉換<br>6.3利用三點相交法確證位置|45分鐘|\n|7.|行進速度及<br>行程計劃|7.1計算行程時間的方法<br>7.2路程表的意義及編寫方法|45分鐘|\n|8.|全球定位系統<br>及衛星導航|全球定位系統原理、發展及應用|30分鐘|\n|9.|定位技巧|實地、地圖相互校對方法|45分鐘|\n|10.|不使用指南針<br>找尋方向|利用太陽、月亮、星宿、手錶、日規等找尋方向|30分鐘|\n\n2/3\n\n<!-- p.7 -->\n|11.戶外旅程一|11.1編寫路程表<br>11.2利用步距量度距離<br>11.3辨認地圖的習用圖例<br>11.4兩地間彼此可見性的測試法<br>11.5利用地貌校對地圖<br>11.6使用指南針校對地圖<br>11.7使用指南針量度磁方位<br>11.8實地量度前視方位<br>11.9地圖上網格方位轉變為磁方位<br>11.10磁方位轉變為地圖上網格方位<br>11.11利用三點相交法確證位置<br>（共兩日，每日不少於4小時）|12小時|\n|---|---|---|\n|12.戶外旅程二|12.1覆修<br>12.2筆試及實地考驗|8小時|\n\n註：上述建議時間可根據實際需要作出調整，惟戶外訓練旅程次數須滿足課程大綱的最低要求。 \n\n3/3\n\n<!-- p.8 -->\n【附件 3】 青少年活動署第 5/2024 號通告 (1/1/2024) \n\n香港童軍總會 青少年活動署 \n\n## 「深資／樂行童軍遠足訓練班」開辦指引 \n\n（一）訓練班名稱： 深資童軍遠足訓練班 Venture Scout Expedition Course 樂行童軍遠足訓練班 Rover Scout Expedition Course （二）舉辦單位： 總會青少年活動署、各地域及童軍區 （三）覈准及簽發開班證書： 1. 總會－ 青少年活動總監；或 副青少年活動總監 2. 地域及童軍區－ 地域總監；或 副地域總監（活動與訓練） \n\n- （四）學員人數： 每小隊 4 至 7 名成員 （五）參加資格： 1. 深資童軍 或 樂行童軍成員。 2. 持有「深資童軍地圖閱讀訓練班」或「深資童軍地圖閱讀考驗」 證書；或 持有「樂行童軍地圖閱讀訓練班」或「樂行童軍地圖閱讀考驗」 證書；及 \n\n- 3. 參加者如需同時進行香港青年獎勵計劃銀章級野外鍛鍊科之基 本訓練，則必須持有本會簽發之香港青年獎勵計劃紀錄簿。 \n\n- （六）班領導人資格： 班領導人須為本會遠足審核員或高級遠足審核員（如有學員同時進 行香港青年獎勵計劃銀章級野外鍛鍊科之基本訓練，則班領導人必 須同時為銀章級野外鍛鍊科遠足導師）。 \n\n- （七）班職員出席要求： 1. 導師與小隊比例應為 1 比 1。 2. 學員進行戶外訓練期間，班領導人（或遠足審核員或高級遠足審 核員）、小隊導師及最少 1 名持有有效急救證書之領袖必須出席。 \n\n- （八）訓練班內容及時數： 請參閱「深資／樂行童軍遠足訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （九）訓練班證書： 1. 完成訓練班之學員由舉辦單位發出訓練班證書。證書由舉辦單位 自行編印； \n\n- 2. 班領導人須於證書上填上其審核員編號，並為進行香港青年獎勵 計劃銀章級野外鍛鍊科基本訓練之學員簽署紀錄簿。 \n\n- 備註： 訓練班編號無須向總會申請，證書編號並無特定模式，可由舉辦單 位自行編配。 \n\n1/3\n\n<!-- p.9 -->\n## 「深資／樂行童軍遠足訓練班」課程大綱 \n\n學習時數：不少於 43.5 小時 \n\n|項目||內容|建議時間|\n|---|---|---|---|\n|1.團隊精神|1.1<br>1.2|團隊的功能<br> 團隊精神的建立|45分鐘|\n|2.裝備|2.1<br>2.2<br>2.3<br>2.4<br>2.5<br>2.6|個人及小組基本遠足裝備<br> 背囊的選擇、執拾和保養<br> 個人睡具的選擇和保養<br> 遠足營幕的選擇和保養<br> 炊具及爐具的選擇、使用安全守則和保養<br> 遠足的衣著及鞋靴的選擇和保養|60分鐘|\n|3.遠足策劃|3.1<br>3.2<br>3.3|遠足的定義、價值及目的<br> 策劃遠足旅程需注意的事項<br> 設計路線要考慮的因素|60分鐘|\n|4.遠足事工|4.1<br>4.2<br>4.3<br>4.4<br>4.5|遠足事工的重要性和主題選擇<br> 事工策劃時的準備工作<br> 事工計劃書的編寫<br> 事工進行時注意的事項<br> 事工報告書的選擇及編製方法|45分鐘|\n|5.露營技能|5.1<br>5.2<br>5.3<br>5.4<br>5.5<br>5.6|遠足營地選擇<br> 架設及拆卸營幕的方法和注意事項<br> 惡劣天氣的露營技巧<br> 營地及個人清潔衛生<br> 香港營舍及營地的認識<br> 簡單結繩法|45分鐘|\n|6.食物與炊事|6.1<br>6.2<br>6.3<br>6.4|選擇遠足食物的要點<br> 擬定食譜及炊事的準備<br> 利用天然物品生火<br> 後備食糧及緊急食糧|45分鐘|\n|7.急救|7.1<br>7.2<br>7.3<br>7.4|急救裝備<br> 輕微擦傷及割傷的傷口清理及簡單的包紮方法<br> 止血方法<br> 水泡、刺傷、輕微燒傷及燙傷的處理方法|45分鐘|\n|8.遠足中常見意<br>外之急救|8.1<br>8.2|扭傷及抽筋的認知及處理方法<br> 中暑、熱衰竭及體溫過低的認知及處理方法|45分鐘|\n|9.野外危機及|9.1|各類型的野外危機||\n|緊急事件處理|9.2<br>9.3|意外發生時的處理方法<br> 各種求救方法|60分鐘|\n\n2/3\n\n<!-- p.10 -->\n|10.登山技巧|10.1個人登山步行方法<br>10.2保持體能的原則<br>10.3足部護理方法<br>10.4小組行進時注意事項|45分鐘|\n|---|---|---|\n|11.天氣認識|11.1香港氣候概況<br>11.2天文臺天氣報告的認識<br>11.3雲層認識<br>11.4利用一般自然現象預測天氣<br>11.5各種氣候現象對遠足活動的影響|45分鐘|\n|12.遠足計劃書及<br>報告書製作|12.1書面報告編製方法<br>12.2計劃書及報告書的內容|60分鐘|\n|13.郊野公園守則|13.1說明香港郊野公園的「郊區守則」<br>13.2講解旅程中妥善處理廢物的方法|30分鐘|\n|14.海外遠足|14.1海外遠足目的<br>14.2海外遠足形式<br>14.3籌備工作和進行活動時的注意事項<br>14.4其他注意事項|60分鐘|\n|15.戶外旅程一|兩日一夜遠足旅程，旅程距離約20公里<br>（主要教授內容包括：裝備及營藝）|兩日一夜|\n|16.戶外旅程二|兩日一夜遠足旅程，旅程距離約20公里<br>（主要教授內容包括：緊急事件處理、事工）|兩日一夜|\n\n註：上述建議時間可根據實際需要作出調整，惟戶外旅程次數須滿足課程大綱的最低要求。 \n\n3/3\n\n<!-- p.11 -->\n【附件 4】 青少年活動署第 5/2024 號通告 (1/1/2024) \n\n## 香港童軍總會 青少年活動署 \n\n## 「進階遠足訓練班」開辦指引 \n\n- （一）訓練班名稱： 進階遠足訓練班 Enrichment Expedition Course \n\n- （二）舉辦單位： 總會青少年活動署 （三）覈准及簽發開班證書：青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班編號： 由總會青少年活動署自行編配。 （五）學員人數： 每小隊 4 至 7 名成員 （六）參加資格： 1. 年滿 16 歲之深資童軍 或 樂行童軍成員； 2. 參加者如需同時進行香港青年獎勵計劃金章級野外鍛鍊科之基 本訓練及實習旅程，則必須持有本會簽發之香港青年獎勵計劃紀 錄簿。 \n\n- （七）班領導人資格： 班領導人須為本會高級遠足審核員及香港青年獎勵計劃金章級野外 鍛鍊科遠足導師。 \n\n- （八）班職員出席要求： 1. 導師與小隊比例應為 1 比 1。 2. 學員進行戶外訓練期間，班領導人（或高級遠足審核員）、小隊 導師及最少 1 名持有有效急救證書之領袖必須出席。 \n\n- （九）訓練班內容： 請參閱「進階遠足訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）訓練班證書： 1. 完成訓練班之學員由青少年活動署發出訓練班證書。證書由青少 年活動署編印； \n\n- 2. 班領導人須於證書上填上其審核員編號，並為進行香港青年獎勵 計劃金章級野外鍛鍊科基本訓練及實習旅程之學員簽署紀錄簿。 \n\n- （十一）豁免安排： 參加者如已以徒步遠足形式完成下列任何一項，可豁免戶外旅程一 及四：  深資童軍獎章 － 探險段章 或  樂行童軍獎章 － 探險項目 或  遠足技能證書 或  香港青年獎勵計劃銀章級野外鍛鍊科。 \n\n1/3\n\n<!-- p.12 -->\n## 「進階遠足訓練班」課程大綱 \n\n學習時數：不少於 72 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1.簡介|課程簡介、審核程序及不同類型遠足活動介紹|45分鐘|\n|2.團隊精神|2.1團隊的功能<br>2.2團隊精神的建立|60分鐘|\n|3.坐標系統|3.1投影法簡介<br>3.2極區方格網（UPS）<br>3.3統一橫墨卡託方格網（UTM）與經緯度之互換|60分鐘|\n|4.導行技巧|4.1導行技巧簡介<br>4.2在有限視野環境下導行之注意事項|30分鐘|\n|5.裝備|5.1裝備保養及於野外之緊急維修方法<br>5.2於極端天氣環境下的裝備<br>5.3輕便裝備介紹|30分鐘|\n|6.策劃與報告|6.1完整的旅程目的計劃<br>6.2能獨立地設計路線<br>6.3縱切面圖或路徑資料的描述|45分鐘|\n|7.露營技能<br>|臨時或緊急庇護所|30分鐘|\n|8.食物與炊事|8.1在惡劣天氣下烹調食物之處理方法<br>8.2輕便炊事|45分鐘|\n|9.登山安全及<br>緊急事故處理|9.1如何減低山野危機的發生機會<br>9.2各類型的山野危機的處理方法<br>9.3運動創傷及預防（如肩部擦傷等）<br>9.4極端天氣帶來的危機及預防方法（如暴曬及暴寒等）|60分鐘|\n|10.急救|10.1脫臼及骨折的認知及處理方法<br>10.2休克的處理<br>10.3拯救窒息者<br>10.4緊急搬運傷者的方法|60分鐘|\n|11.愛護大自然|「不留痕」原則及技巧|30分鐘|\n|12.戶外旅程一|一日遠足旅程<br>（主要覆修技能：地圖閱讀）<br>旅程距離約5公里|8小時|\n|13.戶外旅程二|兩日一夜遠足覆修旅程<br>（主要覆修技能：行進技巧、露營技能）<br>旅程距離約20公里|兩日一夜|\n\n2/3\n\n<!-- p.13 -->\n|14.|戶外旅程三|兩日一夜遠足覆修旅程||\n|---|---|---|---|\n|||（主要覆修技能：緊急事故處理、事工）<br>旅程距離約20公里|兩日一夜|\n|15.|戶外旅程四|三日兩夜遠足實習旅程||\n|||（主要覆修技能：旅程計劃、事工）<br>旅程距離約40公里|三日兩夜|\n\n- 註：上述建議時間可根據實際需要作出調整，惟戶外訓練旅程次數須滿足課程大綱的最低要求。 \n\n3/3\n","03_政策及安全指引/P007-23.md":"---\nsource_file: \"P007-23.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 17\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青 少 年 活 動 署 .青少年活動通告第 7/2023 號 電話：2957 6411 / 2957 6417 傳真：3011 3183 2023 年 1 月 1 日 \n\n# 童軍支部各級徽章簽發及領取／購買方法 **Procedures and Guidelines on Issue and Collection/Purchase of Badges in Scout Section** \n\n此通告取代 2012 年 8 月 15 日發出之活動通告 83/2012 號及 2015 年 7 月 15 日發出之青少 年活動通告第 89/2015 號，主要改動為更新各級徽章簽發方法指引。 \n\n本通告現重申童軍支部各級徽章之簽發及領取／購買方法，以供各童軍領袖及有關單位遵 照，詳情如下： \n\n### 獲授權簽發各級徽章單位及人士對照表 \n\n||徽章名稱|簽發單位|簽發人士|\n|---|---|---|---|\n|1.|童軍探索獎章／<br> 童軍標準獎章／<br> 童軍高級獎章|童軍團|童軍團長|\n|2.|領導才獎章／<br> 服務獎章|||\n|3.<br>|總領袖獎章<br>|總會<br>|香港總監<br>|\n|4.<br>|興趣組專科徽章<br>|童軍團<br>|童軍團長<br>|\n|5.<br>6.|宗教章<br> 深資童軍先修章|童軍區|區總監；<br>助理區總監（童軍）；或<br>區專章祕書。|\n|||地域|副地域總監；<br>助理地域總監（青少年活動）／（支部訓練）*；<br>地域總部總監（童軍）；或<br>助理地域總部總監（童軍）。|\n|||青少年活動署|副青少年活動總監；<br>助理青少年活動總監（支部）；<br>總部總監（童軍）；或<br>助理總部總監（童軍）。|\n|7.<br>8.<br>9.|社區參與章<br> 維護自然世界章<br> 世界童軍環境章|童軍區|區總監；<br>助理區總監（童軍）；或<br>區專章祕書。|\n|10.|技能組／<br> 服務組／<br> 教導組專科徽章|地域|副地域總監；<br>助理地域總監（青少年活動）／（支部訓練）*；<br>地域總部總監（童軍）；或<br>助理地域總部總監（童軍）。|\n|||青少年活動署|副青少年活動總監；<br>助理青少年活動總監（支部）；<br>總部總監（童軍）；或<br>助理總部總監（童軍）。|\n\n1/3\n\n<!-- p.2 -->\n|11.航空活動徽章<br> （初級航空活動章、<br> 中級航空活動章 及<br>|童軍區|區總監；<br>助理區總監（童軍）；或<br>區專章祕書。|\n|---|---|---|\n|高級航空活動章）<br>|地域|副地域總監；<br>助理地域總監（青少年活動）／（支部訓練）*；<br>地域總部總監（航空活動）；<br>助理地域總部總監（航空活動）；或<br>地域航空活動代表【只限於該地域沒有有關總監<br>之委任】。|\n||青少年活動署|副青少年活動總監；<br>助理青少年活動總監（支部）；<br>總部總監（航空活動）；或<br>助理總部總監（航空活動）。|\n|12.海上活動徽章<br> （艇工章、<br> 水手章 及<br>|童軍區|區總監；<br>助理區總監（童軍）；或<br>區專章祕書。|\n|水手長章）|地域|副地域總監；<br>助理地域總監（青少年活動）／（支部訓練）*；<br>地域總部總監（海上活動）；或<br>助理地域總部總監（海上活動）。|\n||青少年活動署|副青少年活動總監；<br>助理青少年活動總監（支部）；<br>總部總監（海上活動）；或<br>助理總部總監（海上活動）。|\n\n- 如個別地域同時設有助理地域總監（青少年活動）及（支部訓練）職位，則由負責 \n\n- （支部訓練）一職之總監簽署。 \n\n2/3\n\n<!-- p.3 -->\n各級徽章領取／購買方法 \n\n|徽章名稱|領取／購買方法|\n|---|---|\n|1.會員章<br>2.團隊長章／<br>2.隊長章／<br>2. 副隊長章<br>|在童軍物品供應社發售，購買時毋須出示任何文件。|\n|3.服務年星<br>4.小隊章||\n|5.童軍探索獎章／<br>5.童軍標準獎章／<br>5.童軍高級獎章|在童軍物品供應社發售，購買時須出示由童軍團長簽署及蓋上<br>旅／童軍團印之「童軍進度性獎章證書」正本。<br>註|\n|6.領導才獎章／<br>服務獎章|在童軍物品供應社發售，購買時須出示由童軍團長簽署及蓋上<br>旅／童軍團印之「童軍獎章證書」正本。<br>註|\n|7.小隊活動巾圈|在童軍物品供應社發售，購買時須出示有效童軍紀錄冊及童軍<br>標準獎章或以上之「童軍進度性獎章證書」正本。|\n|8.總領袖獎章|由青少年活動署送贈，童軍物品供應社代為派發，領取時須出<br>示由青少年活動署發出之恭賀信正本及有效童軍紀錄冊。|\n|9.興趣組／<br>技能組／<br>服務組／<br>教導組專科徽章|在童軍物品供應社發售，購買時須出示由獲授權人士簽署及蓋<br>上獲授權單位印章之相關證書正本。<br>註|\n|10.宗教章||\n|11.社區參與章||\n|12.維護自然世界章||\n|13.世界童軍環境章||\n|14.深資童軍先修章||\n|15.航空活動徽章<br> （初級航空活動章、<br>  中級航空活動章 及<br>  高級航空活動章）||\n|16.海上活動徽章<br> （艇工章、<br>…水手章 及<br>水手長章）||\n|17.拯溺布章|在童軍物品供應社發售，購買時須出示由香港拯溺總會發出之<br>有效拯溺銅章或以上級別之證書正本及有效童軍紀錄冊。<br>註|\n|18.金紫荊獎章標誌|在童軍物品供應社發售，購買時須出示金紫荊獎章證書副本，<br>每次可購買獎章標誌3 枚。|\n|19.香港青年獎勵計劃獎章<br>19.（銅／銀章）|由青少年活動署送贈，童軍物品供應社代為派發，領取時須出<br>示由地域發出之恭賀信正本及有效童軍紀錄冊。<br>註|\n\n註：每張證書／獲獎證明最多可購買徽章 2 枚，童軍物品供應社職員會於證書／獲獎證明背面 蓋印證明已出售布章予該證書持有人。 \n\n有關童軍支部各級徽章簽發方法指引，請參閱附件一。 \n\n青少年活動總監 羅紹衡 \n\n3/3\n\n<!-- p.4 -->\n【附件一】 （1/1/2023） \n\n## 香港童軍總會 青少年活動署 \n\n## 童軍支部各級徽章簽發方法指引 \n\n1. 童軍進度性獎章證書的簽發 a) 童軍進度性獎章（童軍探索獎章／童軍標準獎章／童軍高級獎章）由童軍團長簽發。 b) 當童軍成員完成考驗後，由童軍團長填妥「童軍探索獎章證書」、「童軍標準獎章證 書」或「童軍高級獎章證書」，並於證書上簽署及蓋上旅／童軍團印確認（如圖一至 圖三）。 \n\n<!-- Start of picture text -->\n陳大文<br>CHAN Tai-man<br>隸屬 港島第八八八旅<br>of  888 th  Hong Kong Group<br>陳大文<br>CHAN Tai-man<br>如有需要，簽發單位可自<br>行為證書加上編號，惟編港島第八八八旅<br>號必須填寫於證書左下方888 th  Hong Kong Group<br>童軍團長<br>1/1/2008  簽署<br>HKIR/888/2008/001  童軍團長姓名<br>1/1/2023<br>童軍團長<br>HKIR/888/SPA/001  簽署<br><!-- End of picture text -->\n\n圖一：「童軍探索獎章證書」式樣 \n\n1/14\n\n<!-- p.5 -->\n<!-- Start of picture text -->\n陳大文<br>CHAN Tai-man<br>港島第八八八旅<br>888 th  Hong Kong Group<br>1/1/2023<br>童軍團長<br>HKIR/888/SSA/001  簽署<br><!-- End of picture text -->\n\n圖二：「童軍標準獎章證書」式樣 \n\n2/14\n\n<!-- p.6 -->\n<!-- Start of picture text -->\n陳大文<br>CHAN Tai-man<br>港島第八八八旅<br>888 th  Hong Kong Group<br>1/1/2023<br>童軍團長<br>HKIR/888/SSA/001  簽署<br><!-- End of picture text -->\n\n圖三：「童軍高級獎章證書」式樣 \n\n3/14\n\n<!-- p.7 -->\n### 2. 服務獎章及領導才獎章的簽發 \n\n- a) 服務獎章及領導才獎章由童軍團長簽發。 \n\n- b) 當童軍成員完成考驗並取得合格後，由童軍團長填妥「童軍獎章證書」，並於證書上 簽署及蓋上旅／童軍團印確認（如圖四）。 \n\n<!-- Start of picture text -->\n陳大文<br>CHAN Tai-man<br>港島第八八八旅<br>888 th  Hong Kong Group<br>服務獎章<br>Service Flash<br>童軍團長<br>1/1/2023  簽署<br>童軍團長姓名<br>HKIR/888/2008/003<br>如有需要，簽發單位可自行 旅／童軍團印<br>為證書加上編號，惟編號必<br>須填寫於證書左下角。<br><!-- End of picture text -->\n\n圖四：「童軍獎章證書」式樣 \n\n4/14\n\n<!-- p.8 -->\n3. 童軍專科徽章的簽發 \n\n   - a) 童軍專科徽章（興趣組）由青少年活動署、地域、童軍區或童軍團獲授權人士簽發。 \n\n   - b) 童軍專科徽章（技能組／服務組／教導組）由青少年活動署、地域或童軍區獲授權 人士簽發， 童軍團長不可為童軍成員簽發上述徽章 。 \n\n   - c) 當童軍成員完成考驗後，由有關單位獲授權人士填妥「童軍專科徽章證書」，並於證 書上簽署及蓋上獲授權單位印章確認（如圖五）。 \n\n 權單位蓋印<br>為證書加上編號，惟編號必<br>須填寫於證書左下角。<br><!-- End of picture text -->\n\n圖九：「維護自然世界章證書」式樣 \n\n9/14\n\n<!-- p.13 -->\n8. 世界童軍環境章的簽發 \n\n   - a) 世界童軍環境章由青少年活動署、地域或童軍區獲授權人士簽發。 \n\n   - b) 當童軍成員完成考驗後，由有關單位獲授權人士填妥「世界童軍環境章證書」，並於 證書上簽署及蓋上獲授權單位印章確認（如圖十）。 \n\n<!-- Start of picture text -->\n本證書為跨支部證書， 童軍支部<br>本欄須清楚填寫獲頒徽 Scout Section<br>章成員所屬支部。<br>陳大文  Chan Tai Man<br>港島第八八八旅  888 th  Hong Kong Group<br>獲授權單位蓋印。<br>獲授權人士簽署<br>Signature of Authorized Person<br>獲授權人士姓名及職位<br>Name and Post of Authorized Person<br>01/01/2012<br>由青少年活動署編配之證<br>WSEEC/A/SC/001/01  書編號。<br><!-- End of picture text -->\n\n圖十：「世界童軍環境章證書」式樣 \n\n10/14\n\n<!-- p.14 -->\n9. 航空活動徽章的簽發 \n\n   - a) 航空活動徽章（初級航空活動章、中級航空活動章及高級航空活動章）由青少年活 動署、地域或童軍區獲授權人士簽發。 \n\n   - b) 當童軍成員完成考驗後，由有關單位獲授權人士填妥「航空活動徽章證書」，並於證 書上簽署及蓋上獲授權單位印章確認（如圖十一）。 \n\n   - c) 總會及地域應妥善保存考驗紀錄以便查閱，亦應定時向童軍區匯報區內各級航空活 動徽章之考驗結果。 \n\n<!-- Start of picture text -->\n本證書為跨支部證書，<br>陳大文<br>本欄須清楚填寫獲頒徽<br>CHAN Tai-man<br>章成員所屬支部<br>港島第八八八旅童軍團<br>888 th  Hong Kong Group Scout Troop<br>高級航空活動章<br>Advanced Air Activity Badge<br>獲授權人士<br>1/1/2023  簽署<br>AHQ/AA/46/201  獲授權人士姓名<br>及職位<br>如有需要，簽發單位可自行<br>獲授權單位蓋印<br>為證書加上編號，惟編號必<br>須填寫於證書左下角。<br><!-- End of picture text -->\n\n圖十一：「航空活動徽章證書」式樣 \n\n11/14\n\n<!-- p.15 -->\n10. 海上活動徽章的簽發 \n\n   - a) 海上活動徽章（艇工章、水手章及水手長章）由青少年活動署、地域或童軍區獲授 權人士簽發。 \n\n   - b) 當童軍成員考獲一級、二級或三級童軍標準艇證書後，由有關單位獲授權人士填妥 「海上活動徽章證書」，並於證書上簽署及蓋上獲授權單位印章確認（如圖十二）。 \n\n   - c) 總會及地域應妥善保存考驗紀錄以便查閱，亦應定時向童軍區匯報區內各級海上活 動徽章之考驗結果。 \n\n<!-- Start of picture text -->\n本證書為跨支部證書，本<br>欄須清楚填寫獲頒徽章<br>成員所屬支部<br>本證書為跨支部證書， 陳大文<br>本欄須清楚填寫獲頒徽 CHAN Tai-man<br>章成員所屬支部<br>港島第八八八旅童軍團<br>888 th  Hong Kong Group Scout Troop<br>艇工章<br>Oarsman Badge<br>獲授權人士<br>1/1/2023  簽署<br>獲授權人士姓名<br>AHQ/SA/46/204<br>及職位<br>如有需要，簽發單位可自行 獲授權單位蓋印<br>為證書加上編號，惟編號必<br>須填寫於證書左下角。<br><!-- End of picture text -->\n\n圖十二：「海上活動徽章證書」式樣 \n\n12/14\n\n<!-- p.16 -->\n11. 隊長委任狀 \n\n   - a) 童軍團長可按需要，自行決定是否簽發此證書。 \n\n   - b) 購買證書時，無須出示任何文件。 \n\n   - c) 證書簽發式樣如下（如圖十三）。 \n\n<!-- Start of picture text -->\n陳大文<br>CHAN Tai-man<br>港島第八八八旅<br>888 th  Hong Kong Group<br>釣魚郎小隊隊長<br>Patrol Leader of Kingfisher Patrol<br>1/1/2023  童軍團長簽名<br>Signature of Scout Leader<br>童軍團長姓名<br>Name of Scout Leader<br>旅／童軍團印<br>圖十三：「隊長委任狀」式樣<br><!-- End of picture text -->\n\n13/14\n\n<!-- p.17 -->\n12. 香港青年獎勵計劃獎章的簽發 \n\n   - 香港青年獎勵計劃獎章並無簽發程序，各童軍成員可攜同由所屬地域發出之恭賀信正本 及有效童軍紀錄冊往童軍物品供應社領取獎章 2 枚。 \n\n13. 拯溺布章的簽發 \n\n拯溺布章並無簽發程序，各童軍成員可攜同由香港拯溺總會發出的有效拯溺銅章或以上 級別之證書正本及有效童軍紀錄冊往童軍物品供應社購買布章 2 枚。 \n\n14. 有關跨區或跨地域的證書簽發 主辦或負責安排考驗之單位（總會／地域／童軍區）應負責為其訓練活動中考驗合格之 童軍成員直接簽發有關徽章／獎章證書，包括跨區或跨地域參與之童軍成員，主辦或負 責安排考驗之單位同時應將其考驗結果副本送呈有關之童軍區存案。 \n\n14/14\n","03_政策及安全指引/P008-26-.md":"---\nsource_file: \"P008-26-.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 6\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **1** 月 **1** 日 第 **08/2026** 號通告 [政策／指引] \n\n# 地球部落領袖工作坊／導師訓練班開辦指引 **Guidelines of Earth Tribe Leader Workshop/ Trainer Course** \n\n為讓各單位對開辦地球部落領袖工作坊／導師訓練班之準則有確切瞭解，本通告現列 明各類工作坊／導師訓練班之開辦指引（見附件）。上述指引於 2026 年 1 月 1 日起生效， 獲準開辦之單位在舉行工作坊／導師訓練班時必須依據有關指引作出安排。 \n\n青少年活動總監 陳狄安\n\n<!-- p.2 -->\n【附件 1】 青少年活動署第 08/2026 號通告 (1/1/2026) \n\n# 香港童軍總會 青少年活動署 \n\n# 地球部落領袖工作坊開辦指引 \n\n|（一）工作坊名稱|：1. 地球部落領袖工作坊 **–**走塑達人挑戰或<br>Earth Tribe Leader Workshop – Plastic Tide Turners<br>Challenge or<br>2. 地球部落領袖工作坊 **–**自然守護者挑戰或<br>Earth Tribe Leader Workshop – Champions for Nature<br>Challenge or<br>3. 地球部落領袖工作坊 **–**日光善用者挑戰<br>Earth Tribe Leader Workshop – Scouts Go Solar<br>Challenge|\n|---|---|\n|（二）舉辦單位|： 總會、各地域及童軍區|\n|（三）覈准|： 青少年活動總監；或<br>副青少年活動總監|\n|（四）工作坊屆別|： 由總會青少年活動署統一發出屆別，各單位必須於舉行<br>前最少1 個月通知本署，並將工作坊通告、訓練班時間<br>表及班職員名單（需提供地球部落導師編號）以電郵方<br>式遞交至本署，以便安排編配相關屆別。|\n|（五）學員人數|：6至18人|\n|（六）參加資格|： 持有有效領袖委任書之各級領袖|\n|（七）班職員資格|：1. 班領導人必須為本會委任之地球部落導師，並曾任地<br>球部落領袖工作坊副班領導人或助理班領導人；<br>2. 副班領導人及助理班領導人必須為本會委任之地球<br>部落導師。|\n|（八）班職員出席要求|： 建議導師與學員比例為1比10，惟可按需要自行調整。|\n|（九）學習時數|： 學習時數不少於225分鐘|\n|（十）證書及成績總表|：1. 完成工作坊之學員由班領導人發出工作坊證書。證書<br>由舉辦單位編印，證書編號必須按照總會青少年活動<br>署編配之模式列印。<br>2. 成績總表由總會青少年活動署制訂，於通知相關工作<br>坊屆別時與通知書一併發放。班領導人必須於工作坊<br>完成後一個月內，將成績總表送交本署存案。|\n|（十一）工作坊內容|： 請參閱「地球部落領袖工作坊」課程大綱<br>（內容如有更改，以總會青少年活動署公佈最新之通告<br>為準。）|\n\n<!-- p.3 -->\n「地球部落領袖工作坊」課程大綱 \n\n學習時數：不少於 225 分鐘 \n\n||教授項目|內容<br>註**1**|建議時間|\n|---|---|---|---|\n|1.|認識地球部落計劃及|1. 認識地球部落的計劃內容學習|45分鐘|\n||走塑達人挑戰或<br>自然守護者挑戰或<br>日光善用者挑戰<br>註2|2. 認識走塑達人挑戰或自然守護者挑<br>戰或日光善用者挑戰的學習進程<br>註2||\n|2.|地球部落活動體驗|體驗走塑達人挑戰或自然守護者挑戰或<br>日光善用者挑戰之學習活動<br>註2|180分鐘|\n\n註 1：應以活動教學方法進行 註 2：配合該次工作坊的主題\n\n<!-- p.4 -->\n【附件 2】 青少年活動署第 08/2026 號通告 (1/1/2026) \n\n# 香港童軍總會 青少年活動署 \n\n# 地球部落導師訓練班開辦指引 \n\n|（一）訓練班名稱|：|1.<br>地球部落導師訓練班 **–**走塑達人挑戰或|\n|---|---|---|\n|||Earth Tribe Trainer Course – Plastic Tide Turners<br>Challenge or<br>2.<br>地球部落導師訓練班 **–**自然守護者挑戰或<br>Earth Tribe Trainer Course – Champions for Nature<br>Challenge or<br>3.<br>地球部落導師訓練班 **–**日光善用者挑戰<br>Earth Tribe Trainer Course – Scouts Go Solar Challenge|\n|（二）舉辦單位|：|青少年活動署|\n|（三）覈准|：|青少年活動總監；或<br>副青少年活動總監|\n|（四）訓練班屆別|：|由青少年活動署自行編配|\n|（五）學員人數|：|6至18人|\n|（六）參加資格|：|1. 持有有效領袖委任書之各級領袖；及<br>2. 持有相關地球部落領袖工作坊證書。|\n|（七）班職員資格|：|1. 班領導人必須為本會委任之地球部落導師，並曾任地<br>球部落導師訓練班副班領導人或助理班領導人；<br>2. 副班領導人及助理班領導人必須為本會委任之地球<br>部落導師。|\n|（八）班職員出席要求|：|建議導師與學員比例為1比10，惟可按需要自行調整。|\n|（九）訓練時數|：|1. 學習時數不少於150分鐘；及<br>2. 實習時數不少於360分鐘。|\n|（十）證書|：|完成訓練班之學員由青少年活動署發出訓練班證書。證<br>書由青少年活動署編印。|\n|（十一）訓練班內容|：|請參閱「地球部落導師訓練班」課程大綱<br>（內容如有更改，以總會青少年活動署公佈最新之通告<br>為準。）|\n\n<!-- p.5 -->\n# 「地球部落導師訓練班」課程大綱 \n\n學習時數：不少於 150 分鐘 \n\n||教授項目|內容|建議時間|\n|---|---|---|---|\n|1.|認識可持續發展目標|1. 認識可持續發展目標與Scouts for|60分鐘|\n||(SDGs)與童軍運動之|SDGSs之相互關係||\n||配合|2. 認識Scouts for SDGSs 之各個倡議||\n|2.|地球部落導師的角色|1. 明瞭地球部落導師的職責|60分鐘|\n||及教學法|2. 明瞭如何撰寫學習活動教案||\n|3.|如何開辦地球部落領|1. 明瞭開辦程序|30分鐘|\n||袖工作坊|2. 設計地球部落領袖工作坊之原則||\n\n實習時數：不少於 360 分鐘 \n\n|教授項目|內容|建議時間|\n|---|---|---|\n|1. 學習活動實習|1. 編寫一個教案，以帶領地球部落挑戰|360分鐘|\n||的學習活動教案。||\n||2. 以最少約30 分鐘時間，帶領一個地||\n||球部落挑戰的學習活動||\n\n<!-- p.6 -->\n【附件 3】 青少年活動署通告第 08/2026 號 (1/1/2026) \n\n## 各類地球部落領袖工作坊／導師訓練班證書編號 \n\n### 證書編號編排方法如下： \n\n|(A)|**(B)**|**(C)**|**(D)**|\n|---|---|---|---|\n|工作坊／訓練班編碼|主辦單位編碼|屆別|學員編號|\n\n### **(A)** 工作坊／訓練班編碼 \n\n|編碼|中文名稱|英文名稱|\n|---|---|---|\n|ETW-PTT|地球部落領袖工作坊 **–**<br>走塑達人挑戰|Earth Tribe Leader Workshop –<br>Plastic Tide Turners Challenge|\n|ETW-CFN|地球部落領袖工作坊 **–**<br>自然守護者挑戰|Earth Tribe Leader Workshop –<br>Champions for Nature Challenge|\n|ETW-SGS|地球部落領袖工作坊 **–**<br>日光善用者挑戰|Earth Tribe Leader Workshop –<br>Scouts Go Solar Challenge|\n|ETT-PTT|地球部落導師訓練班 **–**<br>走塑達人挑戰|Earth Tribe Trainer Course –<br>Plastic Tide Turners Challenge|\n|ETT-CFN|地球部落導師訓練班 **–**<br>自然守護者挑戰|Earth Tribe Trainer Course –<br>Champions for Nature Challenge|\n|ETT-SGS|地球部落導師訓練班 **–**<br>日光善用者挑戰|Earth Tribe Trainer Course –<br>Scouts Go Solar Challenge|\n\n### **(B)** 主辦單位編碼 \n\n|編碼|中文名稱|\n|---|---|\n|A|總會及銀禧區|\n|H|港島地域及其轄下各童軍區|\n|K|九龍地域及其轄下各童軍區|\n|E|東九龍地域及其轄下各童軍區|\n|N|新界地域及其轄下各童軍區|\n|D|新界東地域及其轄下各童軍區|\n\n### **(C)** 屆別 \n\n屆別由青少年活動署編訂，以表示該工作坊／訓練班舉行之次序。 \n\n### **(D)** 學員編號 \n\n學員於完成某一工作坊／訓練班，表現令人滿意，將給予一編號。編號以數目字代表， 次序由班領導人決定，以資識別。 \n\n例：證書簽發予東九龍地域所舉辦之第 6 屆地球部落領袖工作坊 **–** 日光善用者挑戰 之第 4 名學員，其證書編號將為「ETW-SGS/E/006/04」。\n","03_政策及安全指引/P010-26.md":"---\nsource_file: \"P010-26.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **1** 月 **1** 日 第 **10/2026** 號通告 [政策／指引] \n\n# 海童軍水手長笛子簽發及佩戴指引 **Guidelines on Issuing and Wearing the Sea Scout Boatswain's Call** \n\n訓練內容︰ \n\n示範下列水手長笛號及明瞭其意義： \n\n“The Still”、“Carry On”、“Pipe the Side” 及 “General Call”。 \n\n## 證書樣式︰ \n\n海童軍水手長笛子訓練使用海上活動徽章證書。 \n\n## 佩戴資格︰ \n\n1. 現役海童軍、深資海童軍及樂行海童軍成員；及 \n\n2. 持有由完成海童軍領袖工作坊之海童軍團長、深資海童軍團長、樂行海童軍團長或海童軍 旅旅長簽發的海童軍水手長笛子訓練證書。 \n\n3. 海童軍水手長笛子可佩戴直至其青少年成員身分完結為止。 \n\n4. 在 2026 年 3 月 31 日或之前透過考獲三級童軍標準艇證書而獲得佩戴海童軍水手長笛子資 格的海童軍、深資海童軍及樂行海童軍，可以繼續佩戴直至其青少年成員身分完結為止。 \n\n5. 此指引生效日期為 2026 年 4 月 1 日。 \n\n青少年活動總監 \n\n陳狄安\n","03_政策及安全指引/P011-26.md":"---\nsource_file: \"P011-26.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **1** 月 **1** 日 第 **11/2026** 號通告 [政策／指引] \n\n# 海童軍傳統禮儀及步操安排 **Arrangement for Sea Scout Traditional Ceremonies and Drills** \n\n以下海童軍基本禮儀及步操，只適用於海童軍團集會、海童軍大會、海童軍領袖大會及 其他獲批准之海童軍活動，一般訓練班、工作坊、大型童軍活動等，在沒有指示下，應使用 標準的基本禮儀及步操。 \n\n## 海童軍敬禮 \n\n傳統上海童軍敬禮會參照海軍的敬禮方式，手心向下，手背微微向外，但仍會作童軍的 三指敬禮。原因是水手在軍艦上工作時會弄髒雙手，為了避免讓長官看到骯髒的手心，故將 之隱藏，久而久之便成為海軍傳統。而海童軍敬禮時會採取「直上直落」方式。 \n\n## 海童軍步操 \n\n海童軍的原地動作亦與一般童軍稍微不一樣，會使用「拍腳」 的方式。原因是在艦上 的水手採取輪班制，當值日的海軍在甲板上集合時，甲板下仍有水手在休息。如使用一般步 操大力踏地的方式，會影響正在休息的人。 \n\n海童軍集隊及模擬船上集會 (Land Ship Ceremony) \n\n值日隊長會以海童軍水手長笛子奏出 “GENERAL CALL”，然後大叫”Troop fall in” 或 “Ship’s company fall in”，所有小隊會分成左右兩邊面對列隊，有別於步操手冊內的集隊手號。 \n\n<!-- Start of picture text -->\n青少年活動總監<br><!-- End of picture text -->\n\n陳狄安 \n\n參考資料︰ 《 香港童軍 》 月刊第 476 期第 4-5 頁, SCOUTS ON THE WATER P.51-54\n","03_政策及安全指引/P012-25.md":"---\nsource_file: \"P012-25.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 7\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n**2025** 年 **1** 月 **1** 日 第 **12/2025** 號通告 [政策／指引] \n\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n# 不留痕體驗工作坊／訓練班開辦指引 **Guidelines of Leave No Trace Training Workshop/Course** \n\n此通告取代 2022 年 1 月 1 日發出之青少年活動通告第 17/2022 號。 \n\n為配合美國不留㾗中心教練名的更改，現重新以新名稱發出以下指引，並於 2025 年 4 月 1 日起生效。 \n\n為讓各單位對開辦不留痕體驗工作坊／訓練班之準則有確切瞭解，本通告現 列明「不留痕體驗工作坊／訓練班」之開辦指引（見附件）。獲準開辦之單位在舉 行時必須依據有關指引作出安排。 \n\n<!-- Start of picture text -->\n青少年活動總監<br>陳狄安<br><!-- End of picture text -->\n\n<!-- p.2 -->\n【附件 1】 青少年活動署第 12/2025 號通告 (1/1/2025) \n\n# 香港童軍總會 青少年活動署 \n\n# 不留痕體驗工作坊開辦指引 \n\n（一）訓練班名稱： 不留痕體驗工作坊 Leave No Trace Awareness Workshop \n\n- （二）舉辦單位： 總會、各地域、童軍區及童軍旅 \n\n（三）覈准： 青少年活動總監；或 副青少年活動總監 \n\n（四）工作坊屆別： \n\n由總會青少年活動署統一發出屆別，各單位必須於舉行前 最少 1 個月通知本署，並將活動通告（如沒有通告請提交 活動內容）及班領導人或導師名單以電郵方式遞交至本 署，以便安排編配相關屆別。 \n\n（五）學員人數： \n\n6 至 40 人 \n\n（六）參加資格： \n\n幼童軍、童軍、深資童軍、樂行童軍支部成員、領袖及會 務委員 \n\n- （七）班領導人或導師資格： \n\n持有有效不留痕一級導師或以上委任 \n\n- （八）班職員出席要求： \n\n建議導師與學員比例為 1 比 10，惟可按需要自行調整。 \n\n- （九）訓練時數： \n\n不少於 90 分鐘 \n\n- （十）證書及成績總表： \n\n1. 香港童軍不留痕體驗工作坊證書，將於批准開辦後，前 往青少年活動署領取。 \n\n2. 完成工作坊之學員由班領導人／導師發出工作坊證 書。證書由舉辦單位編印，證書編號必須按照總會青少 年活動署編配之模式列印。 \n\n3. 成績總表由總會青少年活動署制訂，於通知相關工作 坊屆別時與通知書一併發放。班領導人／導師必須於 訓練班完成後一個月內，將成績總表送交本署存案。 \n\n1/3\n\n<!-- p.3 -->\n總會 ：AW/A/00_/0_ 港島地域 ：AW/H/00_/0_ 九龍地域 ：AW/K/00_/0_ 東九龍地域 ：AW/E/00_/0_ 新界地域 ：AW/N/00_/0_ 新界東地域 ：AW/D/00_/0_ \n\n<!-- Start of picture text -->\n不留痕體驗工作坊證書英文編碼<br>訓練班屆別<br>AW/A/001/01<br>主辦單位代號 學員編號<br><!-- End of picture text -->\n\n（十一）工作坊內容： \n\n請參閱「不留痕體驗工作坊」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為 準。） \n\n2/3\n\n<!-- p.4 -->\n# 「不留痕體驗工作坊」課程大綱 \n\n學習時數：不少於 90 分鐘 \n\n|項目|內容*|建議時間|\n|---|---|---|\n|1. 認識不留痕|1.1 什麼是不留痕|30分鐘|\n||1.2 不留痕的發展||\n|2. 童軍郊野守則|2.1 明瞭童軍郊野守則|60分鐘|\n||2.2 如何實踐郊野守則內容||\n\n*應以活動教學及於戶外進行。 \n\n3/3\n\n<!-- p.5 -->\n【附件 2】 青少年活動署第 12/2025 號通告 (1/1/2025) \n\n# 香港童軍總會 青少年活動署 \n\n# 不留痕一級導師訓練班開辦指引 \n\n（一）訓練班名稱： 不留痕一級導師訓練班 \n\nLeave No Trace Level 1 Trainer Course \n\n- （二）舉辦單位： 總會青少年活動署及各地域 \n\n- （三）覈准開班人士： 青少年活動總監；或 副青少年活動總監 \n\n（四）訓練班屆別： 由總會青少年活動署統一發出訓練班屆別，各單必須於開班前最 少1個月通知青少年活動署，並將訓練班通告、訓練班時間表及班 職員名單以電郵方式遞交至本署，以便安排編配相關訓練班屆 別。 \n\n- （五）學員人數： 12 至 24 人 \n\n- （六）參加資格： \n\n   1. 持有有效樂行童軍紀錄冊之樂行童軍支部成員；或 2. 持有有效領袖委任書或教練員委任證之各級領袖 \n\n- （七）班職員資格： \n\n   1. 班領導人必須為本會委任之不留痕二級導師，並曾任不留痕 一級導師訓練班副班領導人或助理班領導人； \n\n   2. 副班領導人、助理班領導人及導師應為本會委任之不留痕一 級導師或二級導師。 \n\n- （八）班職員出席要求： \n\n   1. 班職員與學員比例為 1 比 6 2. 學員進行戶外訓練期間，班領導人、導師及最少 1 名持有有 效急救證書之領袖必須出席。 \n\n- （九）訓練時數： \n\n   1. 學習時數不少於 6 小時；及 2. 實習時數不少於 14 小時（最少安排一個兩日一夜露營實習）。 \n\n- （十）證書及成績總表： \n\n1. 完成訓練班之學員由班領導人發出訓練班證書。證書由舉辦 單位編印，證書編號必須按照總會青少年活動署編配之模式 列印。 \n\n2. 美國 Leave No Trace Level 1Trainer 證書：班領導人於訓練班 完成後一個月內，透過申報連結，上載所需資料。經核實有 關資料後，班領導人將收到電子證書，簽署後便可發給學員。 \n\n3. 成績總表由總會青少年活動署制訂，於通知相關訓練班屆別 時與通知書一併發放。班領導人必須於訓練班完成後一個月 內，將成績總表送交本署存案。 \n\n1/3\n\n<!-- p.6 -->\n不留痕導師訓練班證書英文編碼 訓練班屆別 總會 ：TC/A/00_/0_ 港島地域 ：TC/H/00_/0_ 九龍地域 ：TC/K/00_/0_ 東九龍地域 ：TC/E/00_/0_ TC/A/001/01 新界地域 ：TC/N/00_/0_ 新界東地域 ：TC/D/00_/0_ 主辦單位代號 學員編號 \n\n（十一）訓練班內容： 請參閱「不留痕一級導師訓練班」課程大綱 （內容如有更改，以青少年活動署最新公佈之通告為準。） \n\n2/3\n\n<!-- p.7 -->\n# 「不留痕一級導師訓練班」課程大綱 \n\n## 學習時數：不少於 6 小時 \n\n||教授項目|內容|建議時間|\n|---|---|---|---|\n|1.|認識不留痕|1.1 認識不留痕發展歷史<br>1.2 介紹不留痕七大原則|60分鐘|\n|2.|教授不留痕的方法|2.1 講解教授方法<br>2.2 示範教授不留痕七大原則的方法|120分鐘|\n|3.|如何開辦不留痕體驗工作坊|3.1 明瞭開辦程序<br>3.2 編寫一個不留痕體驗工作坊的程序表|60分鐘|\n|4.|膳食及渡宿安排|4.1 如何撰寫膳食清單|120分鐘|\n|||4.2 準備及處理食物要點||\n\n## 實習時數：不少於 14 小時* \n\n||實習項目|內容*|建議時間|\n|---|---|---|---|\n|1.|遠足|1.1 示範及體驗不留痕的行進方法|240分鐘|\n|2.|物資及食物處理|2.1 實踐以不留痕方式露營時物資及食物處理方法|240分鐘|\n|3.|廢物處理|3.1 示範環保清洗煮食用具及餐具方式的要點<br>3.2 體驗不同清洗方法|60分鐘|\n|||3.3 示範Pack It In Pack It Out方式||\n|4.|戶外食物貯存|4.1 製作及懸掛熊袋(Bear Bag)|60分鐘|\n|5.|教學實習|5.1 編寫一個教案，以教授其中一個不留痕原則|240分鐘|\n|||5.2 以約15分鐘時間，教授其中一個不留痕原則||\n\n*以兩日一夜戶外露營形式，並以活動教學方法進行。 \n\n3/3\n","03_政策及安全指引/P013-23.md":"---\nsource_file: \"P013-23.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 8\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青 少 年 活 動 署 青少年活動通告第 13/2023 號 電話：2957 6411 / 2957 6417 傳真：3011 3183 2023 年 2 月 1 日 \n\n# `支部成員徽章佩戴指引` **Guidelines of Wearing Scout Badges on Uniform (Youth Members)** \n\n為配合支部成員獎章系統的未來發展及其後陸續推行一系列由世界童軍組織設立的 獎章計劃，本署已重新檢視支部成員現有之徽章佩戴方法。經各方討論後，將會透過調整 徽章大小、佩戴位置及規則，以增加制服上可使用空間，並統一各支部徽章佩戴位置，從 而樹立整齊有序、優秀的形象。 \n\n現將新指引的徽章佩戴基本原則、主要修訂、生效日期及過渡安排臚列如下： \n\n基本原則： 1. 左袋  會員章／和平使者章（結合世界童軍會員章）、隊長章 2. 右袋  支部進度性獎章及最高獎章、服務獎章、領導才獎章 3. 左袋上方  香港章、服務年星 4. 右袋袋蓋  工蜂章 5. 右袋上方  宗教章／公教章（只可選擇佩戴其中一款）、紀念章、支部最高獎章標誌、 先修章、英勇獎勵、APR Award for Outstanding Scouts 6. 左袖  幼童軍支部活動徽章、童軍支部專科徽章、深資童軍支部段章及金帶、海上 活動徽章、航空活動徽章、香港青年獎勵計劃獎章、急救章、拯溺布章、社 區參與章、ATAS 標誌 7. 右袖  旅章、區章、地域章、世界童軍組織推出的獎章、童軍小隊章、優異旅團章 主要修訂： 1. 香港章統一佩戴在左胸袋上方位置。 2. 和平使者章（結合世界童軍會員章）佩戴在左胸袋。 3. 各支部進度性獎章統一佩戴在右胸袋。 4. 世界童軍組織推出的獎章統一佩戴在右袖。 5. 隊長章統一佩戴在左胸袋。 6. 改動深資童軍支部急救章設計及改為只需佩戴於左袖。 有關新徽章佩戴的詳細指引請參閱附件一。\n\n<!-- p.2 -->\n生效日期及過渡安排： \n\n1. 由 2023 年 4 月 1 日起生效，設 1 年過渡期。 \n\n2. 由 2023 年 4 月 1 日起，新加入或晉團之成員須按新指引佩戴。 \n\n3. 由 2023 年 4 月 1 日起，考獲的獎章／徽章，須按新指引佩戴。 \n\n4. 所有成員須於 2024 年 4 月 1 日起，按新指引佩戴所有獎章／徽章。 \n\n5. 現役各支部成員可於 2024 年 4 月 1 日或之前，到青少年活動署出示有效會員證 及相關證書／文件，免費換取新尺寸的獎章／徽章*，以作更換。有關換領詳情， 請留意稍後發出之通告。 \n\n   - （*可換取的獎章／徽章包括：樂行童軍獎章、貝登堡獎章、深資童軍急救章、 社區參與章及寰宇童軍章。） \n\n6. 維護世界自然章可佩戴至考獲自然守護者挑戰章，或 2024 年 3 月 31 日止。 \n\n7. 世界童軍環境章可佩戴至考獲任何一個地球部落章，或 2024 年 3 月 31 日止。 有關相關安排之常見問題請參閱附件二。 \n\n與上述修訂有關的訓練綱要、通告文件及網頁資訊將陸續配合更新。 \n\n青少年活動總監 羅紹衡\n\n<!-- p.3 -->\n【附件一】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n本附件列明新指引主要修訂的詳細改動並配以圖示： \n\n## **1.** 香港章 \n\n<!-- Start of picture text -->\n原有位置<br> 幼童軍、童軍、深資童軍：佩戴在左胸袋上方三釐米中央位置。<br> 樂行童軍：佩戴在右胸袋中央位置。<br>新安排<br> 統一佩戴在左胸袋上方三釐米中央位<br>置。<br><!-- End of picture text -->\n\n## **2.** 和平使者章（結合世界童軍會員章） \n\n<!-- Start of picture text -->\n原有位置<br> 佩戴在右胸袋袋蓋上方位置。<br>新安排<br> 佩戴在左胸袋中央位置（即會員章位<br>置），如有和平使者章，不需要佩戴會員<br>章。<br> 獲取後可佩戴至晉升支部前，晉升支部<br>後需從新參與相關活動以再獲取佩戴資<br>格。<br><!-- End of picture text -->\n\nP. 1/4\n\n<!-- p.4 -->\n【附件一】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n## **3.** 幼童軍之金紫荊獎章、家庭章及隊長章 \n\n<!-- Start of picture text -->\n原有位置<br> 金紫荊獎章 ：佩戴在右胸袋袋蓋上方中央位置。<br> 家庭章 ：佩戴在右袖中間位置。<br> 隊長章 ：佩戴在右袖縫線上方三釐米中央位置。<br>新安排<br>金紫荊獎章<br> 金紫荊獎章已被確立為幼童軍進度性<br>獎章中的支部最高獎章，因此與其他支<br>部一致，佩戴在右胸袋中央位置。<br>家庭章<br> 由於家庭章內容已大致涵蓋於會員章<br>及進度性獎章內容中，故此章將會被取<br>消。<br>隊長章<br> 與童軍支部一致，佩戴在左胸袋會員章<br>下方位置。<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n4. 樂行童軍之進度性獎章<br>原有位置<br> 進度性獎章 ：佩戴在左袖下方中央位置。<br>新安排<br> 與其他支部一致，佩戴在右胸袋中央位<br>置。<br> 獎章尺寸縮小為直徑五釐米。<br><!-- End of picture text -->\n\nP. 2/4\n\n<!-- p.5 -->\n【附件一】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n## **5.** 深資童軍及樂行童軍之急救章及拯溺布章 \n\n- 原有位置 急救章  深資童軍：在左、右袖上方中央位置（旅章下方）各佩戴一枚急救章。徽章上方寫有 “VENTURE”，下方寫有 “SCOUTS” 字樣。 \n\n- 樂行童軍：在右袖上方中央位置。徽章上方印有會徽，下方寫有 “FIRST AID” 字樣。 拯溺布章  佩戴在左袖上方中央位置。 新安排 急救章  統一佩戴在左袖上方、香港青年獎勵計 劃獎章下方位置。 \n\n- 統一使用現時樂行童軍急救章的設計。 拯溺布章  統一佩戴在左袖上方中央位置。 \n\n- 假若同時佩戴香港青年獎勵計劃獎章， 拯溺布章在其下方位置。 \n\n- 假若同時佩戴急救章： 深資童軍：急救章在上，拯溺布章在下。 樂行童軍：急救章在前，拯溺布章在後。 \n\n## **6.** 社區參與章（童軍／深資童軍／樂行童軍） \n\n<!-- Start of picture text -->\n原有位置<br> 佩戴在右袖上，地域及區章下方中央位置。<br>新安排<br> 統一佩戴在左袖，拯溺布章或急救章的<br>下方位置。<br> 獎章尺寸縮小為直徑四釐米。<br><!-- End of picture text -->\n\nP. 3/4\n\n<!-- p.6 -->\n【附件一】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n## **7.** 世界童軍組織推出的獎章 \n\n- 原有位置  幼童軍／童軍／深資童軍世界童軍環境章：佩戴在左袖上。  幼童軍及童軍維護自然世界章：佩戴在左袖上。  深資童軍及樂行童軍寰宇童軍章：佩戴在左胸袋袋蓋上方三釐米中央位置。 新安排  統一佩戴在右袖上，在地域章及區章下 方位置，最多平行佩戴四枚。 \n\n- 獎章尺寸縮小為直徑四釐米。  佩戴次序為按考獲的時序排列，最早考 獲的放前方，由前至後排列。 \n\n- 如考獲超過四個世界童軍組織推出的 獎章，成員須自行選擇同時佩戴最多四 個。（目前本會已推行之世界童軍組織 相關獎章為「深資童軍及樂行童軍寰宇 童軍章」及「童軍世界遺產章」，其他 獎章之推行內容及式樣設計將於稍後 發出之通告公佈，適時陸續更新。） \n\n## **8.** 英勇獎勵及 **APR Award for Outstanding Scouts** 佩戴方法 \n\n- 新安排  配戴在右胸袋袋蓋上方位置。  假若已佩戴宗教章／公教章，則佩戴在 其下方位置。 \n\n- 假若同時持有英勇獎勵及 APR Award for Outstanding Scouts，則英勇獎勵靠左 佩戴，APR Award for Outstanding Scouts 靠右佩戴。 \n\nP. 4/4\n\n<!-- p.7 -->\n【附件二】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n常見問題 \n\n### 【所有支部成員適用】 \n\n1. 和平使者章以往佩戴期為 12 個月，現在是否改變了？ \n\n世界童軍組織經常鼓勵各童軍成員參與有意義為社區服務的活動，總會也明白到很多單位 每年都舉辦不同形式的服務社區活動，所以現在成員可以佩戴和平使者章直至晉升至下一 個支部，當成員晉升至下一個支部後，他們需要重新參與有關活動，以獲取佩戴資格。 \n\n2. 在新指引下，所有青少年成員之香港章需統一佩戴在左胸袋上方嗎？ \n\n是的。本會期望統一各個支部成員在制服上佩戴徽章的位置，從而樹立整齊有序、優秀的 形象。 \n\n3. 在新指引下，各支部進度性獎章統一佩戴在右胸袋嗎？ \n\n是的。以往不同支部佩戴進度性獎章及最高支部獎章的位置不同，現統一佩戴在右胸袋， 從而樹立整齊有序、優秀的形象。 \n\n4. 我什麼時候需要開始改變佩戴徽章／獎章位置？ \n\n根據以下幾項基本原則，部分成員或旅團可按照各自的情況，在符合要求的前題下有限度 選擇改變佩戴徽章／獎章位置的時間： \n\n- (a) 新指引由 2023 年 4 月 1 日起生效，設 1 年過渡期。 \n\n- (b) 由 2023 年 4 月 1 日起，新加入或晉團之成員須按新指引佩戴。 \n\n- (c) 由 2023 年 4 月 1 日起，考獲的獎章／徽章，須按新指引佩戴。 \n\n- (d) 所有支部成員須於 2024 年 4 月 1 日起，按新指引佩戴所有獎章／徽章。 \n\n- (e) 現役各支部成員可於 2024 年 4 月 1 日或之前，到青少年活動署出示有效會員證及相 關證書／文件，免費換取新尺寸的獎章／徽章*，以作更換。有關換領詳情，請留意 稍後發出之通告。（*可換取的獎章／徽章包括：樂行童軍獎章、貝登堡獎章、深資 童軍急救章、社區參與章及寰宇童軍章。） \n\n- (f) 維護世界自然章可佩戴至考獲自然守護者挑戰章，或 2024 年 3 月 31 日止。 \n\n- (g) 世界童軍環境章可佩戴至考獲任何一個地球部落章，或 2024 年 3 月 31 日止。 \n\n但必須留意同一制服上，應該以相同的標準佩戴所有徽章，舉例如果你已考取新的世界童 軍組織獎章，並佩戴在右袖上，制服上其他所有徽章，也需要根據新佩戴方法改動，以達 致整齊之原則。 \n\n5. 在考獲自然守護者挑戰章後，是否不可再佩戴維護世界自然章及世界童軍環境章？ \n\n是的。在考獲自然守護者挑戰章後，將不可再佩戴維護世界自然章及世界童軍環境章。 \n\nP. 1/2\n\n<!-- p.8 -->\n【附件二】 青少年活動通告第 13/2023 號 (1/2/2023) \n\n### 【小童軍支部適用】 \n\n1. 新指引下，小童軍支部的徽章佩戴有沒有改變？ \n\n沒有，新指引沒有修訂小童軍支部徽章的佩戴方法。 \n\n### 【幼童軍支部適用】 \n\n1. 幼童軍家庭章是否被取消？ \n\n是的。由於家庭章內容已大致涵蓋於會員章及進度性獎章內容中，故取消此章佩戴在制服 上的安排。詳細內容請參閱青少年活動署有關通告。 \n\n2. 幼童軍可否在制服上同時佩戴金紫荊獎章及幼童軍進度性獎章？ \n\n由於金紫荊獎章之定位，現確立為幼童軍進度性獎章之一，亦是支部最高獎章。因此幼童 軍在考獲金紫荊獎章後，只能於右袋位置佩戴金紫荊獎章。詳細內容請參閱青少年活動署 有關通告。 \n\n3. 假如左胸袋位置不足夠同時佩戴和平使者章（結合世界童軍會員章）及隊長章，該怎麼辦？ \n\n若左胸袋位置不足夠，則只佩戴會員章及隊長章。 \n\n### 【童軍支部適用】 \n\n1. 假如左胸袋位置不足夠同時佩戴和平使者章（結合世界童軍會員章）及隊長章，該怎麼辦？ \n\n若左胸袋位置不足夠，則只佩戴會員章及隊長章。 \n\n### 【深資童軍支部適用】 \n\n1. 當我成為領袖後，於青少年成員時期所考獲的寰宇童軍章可否佩戴於領袖制服上？如可， 應佩戴在什麼位置？是否需要換取新尺寸獎章？ \n\n是的。成為領袖後，在右袖現有位置佩戴更新尺寸的寰宇童軍章，直至領袖制服徽章佩戴 檢討後，再按要求作更新。 \n\n2. 我已考獲拯溺布章及急救章，可否同時佩戴？方法如何？ \n\n拯溺布章及急救章可同時佩戴於左袖，急救章在上，拯溺布章在下。 \n\n### 【樂行童軍支部適用】 \n\n1. 當我成為領袖後，於青少年成員時期所考獲的寰宇童軍章可否佩戴於領袖制服上？如可， 應佩戴在什麼位置？是否需要換取新尺寸獎章？ \n\n是的。成為領袖後，在右袖現有位置佩戴更新尺寸的寰宇童軍章，直至領袖制服徽章佩戴 檢討後，再按要求作更新。 \n\n2. 我已考獲拯溺布章及急救章，可否同時佩戴？方法如何？ \n\n拯溺布章及急救章可同時佩戴於左袖，急救章在前，拯溺布章在後。 \n\nP. 2/2\n","03_政策及安全指引/P060-24.md":"---\nsource_file: \"P060-24.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 \n\n**2024** 年 **6** 月 **1** 日 第 **60/2024** 號通告 [政策／指引] \n\n電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n# 隊列和升掛國旗及區旗指引 **Guidelines of Chinese Foot Drill and National Flag and Regional Flag Raising** \n\n本署已制訂《 隊列和升掛國旗及區旗指引 》【QR 碼請參閱下方】，為成員及領袖提供 隊列訓練基本認識，說明童軍採用隊列動作進行升掛國旗及區旗時的方式，並配合傳統童 軍步操禮節。 \n\n青少年活動總監 羅紹衡 \n\n隊列和升掛國旗及區旗指引\n","03_政策及安全指引/P063-25.md":"---\nsource_file: \"P063-25.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 30\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2025** 年 **4** 月 **1** 日 第 **63/2025** 號通告 [政策／指引] \n\n# 各類步操訓練班／工作坊開辦指引 **Guidelines of Foot Drill Training Course / Workshop** \n\n為讓各單位對開辦相關步操訓練班／工作坊之準則有確切瞭解，本通告現列明各類 步操訓練班／工作坊之開辦指引（見附件）。上述指引於 2025 年 4 月 1 日起生效，獲準 開辦之單位在舉行時必須依據有關指引作出安排。 \n\n青少年活動總監 陳狄安\n\n<!-- p.2 -->\n【附件 1】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n# 各類步操訓練班／工作坊證書編號 \n\n### 證書編號編排方法如下： \n\n|**(A)**|**(B)**|**(C)**|**(D)**|\n|---|---|---|---|\n|訓練班／工作坊編碼|主辦單位編碼|屆別|學員編號|\n\n### **(A)** 訓練班／工作坊編碼 \n\n|編碼|中文名稱|英文名稱|\n|---|---|---|\n|FBC|步操基本訓練班|Foot Drill Basic Course|\n|SFBC|童軍步操基本訓練班|Scout Foot Drill Basic Course|\n|FIC|步操中級訓練班|Foot Drill Intermediate Course|\n|FINC|步操教練員訓練班|Foot Drill Instructor Course|\n|FFC|基本禮儀及步操訓練班|Ceremonial and Foot Drill Fundamental<br>Course|\n|CSC|旗操及棍操訓練班|Colour and Staff Drill Course|\n|NFW|國旗及區旗禮節工作坊|National Flag and Regional Flag<br>Etiquettes Workshop|\n|CFD|隊列訓練工作坊|Chinese Foot Drill Workshop|\n|PEOW|會操及護送人員禮節工作坊|Parade and Escorting Officers’<br>Etiquettes Workshop|\n|FAC|步操教具訓練班|Foot Drill TeachingAid Course|\n|FIRC|步操教練員覆修訓練班|Foot Drill Instructor Refresher Course|\n|CFINC|步操教練員隊列訓練班|Chinese Foot Drill Course for Foot Drill<br>Instructor|\n\n### **(B)** 主辦單位編碼 \n\n|編碼|中文名稱|\n|---|---|\n|A|總會及銀禧區|\n|H|港島地域及其轄下各童軍區|\n|K|九龍地域及其轄下各童軍區|\n|E|東九龍地域及其轄下各童軍區|\n|N|新界地域及其轄下各童軍區|\n|D|新界東地域及其轄下各童軍區|\n\n### **(C)** 屆別 \n\n由總會青少年活動署編訂，以表示該訓練班／工作坊舉行之次序。 \n\n### **(D)** 學員編號 \n\n學員於完成某一訓練班，表現令人滿意，將給予一編號。編號以數目字代表，次 序由班領導人決定，以資識別。 \n\n- 例（1）： 證書簽發予青少年活動署所舉辦之第 15 屆國旗及區旗禮節工作坊之 第 1 名學員，其證書編號將為「NFW/A/015/01」。 \n\n- 例（2）： 證書簽發予港島地域所舉辦之第 16 屆國旗及區旗禮節工作坊之第 10 名學員，其證書編號將為「NFW/H/016/10」。 \n\n- 例（3）： 證書簽發予荃灣區所舉辦之第 17 屆國旗及區旗禮節工作坊之第 23 名 學員，其證書編號將為「NFW/N/017/23」。\n\n<!-- p.3 -->\n【附件 2】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「步操基本訓練班」開辦指引 \n\n- （一）訓練班名稱 ： 步操基本訓練班 Foot Drill Basic Course \n\n- （二）舉辦單位 ： 總會青少年活動署、各地域及童軍區 （三）覈准開班人士 ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 ： 由總會青少年活動署統一發出訓練班屆別，各單位必須於發出通告 前最少 1 個月通知青少年活動署，並將訓練班通告、訓練班時間表 及班職員名單（需提供步操教練員編號）以電郵方式遞交至本署， 以便安排編配相關訓練班屆別。 \n\n- （五）學員人數 ： 12 至 50 人 （六）參加資格 ： 1. 持有有效所屬支部紀錄冊之深資童軍及樂行童軍支部成員；或 2. 持有有效領袖委任書或教練員委任證之各級領袖。 \n\n- （七）班職員資格 ： 1. 班領導人必須為本會委任之高級步操教練員或步操教練員；及 2. 導師必須為本會委任之高級步操教練員、步操教練員或助理步 操教練員。 \n\n- （八）班職員出席要求 ： 1. 班職員與學員比例為 1 比 8 2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）訓練班內容 ： 請參閱「步操基本訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書及成績總表 ： 1. 完成訓練班之學員由班領導人發出訓練班證書。證書由舉辦單 位編印，證書編號必須按照總會青少年活動署編配之模式列 印。 \n\n- 2. 成績總表由總會青少年活動署制訂，於通知相關訓練班屆別時 與通知書一併發放。班領導人必須於訓練班完成後一個月內， 將成績總表送交本署存案。 \n\n1/3\n\n<!-- p.4 -->\n## 「步操基本訓練班」課程大綱 \n\n學習時數：不少於 27 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1. 童軍步操之目的及步<br>操輔助訓練工具|1.<br>接納童軍步操之目的`。`<br>2.<br>列舉童軍步操訓練之輔助訓練工具`。`|15分鐘|\n|2. 童軍致敬|說明童軍致敬及其注意事項。|15分鐘|\n|3. 制服及儀表|1.<br>解釋穿著正確及整齊制服在童軍活動和訓練的重<br>要性。<br>2.<br>示範檢查及整理制服的動作。|20分鐘|\n|4. 童軍步操訓練詞彙及<br>口令|1.<br>陳述童軍步操訓練中所用的常用詞彙及口令。<br>2.<br>知悉童軍步操與隊列訓練在動作、節奏、排列上之<br>異同。|30分鐘|\n|5. 童軍集隊手號|辨別童軍集隊手號的所需的隊形及相關間距。|40分鐘|\n|6. 三排及兩排轉換|1.<br>描述三排轉兩排及兩排轉三排的動作要訣及其打<br>數。<br>2.<br>陳述三排轉兩排及兩排轉三排在會操上的使用。|60分鐘|\n|7. 童軍步操動作實習|示範下列童軍步操動作及其打數︰<br> 抽膝踏步、彈前腳；<br> 立正、稍息、休息；<br> 原地向左、向右及向後轉；<br> 原地向左、向右斜轉；<br> 原地向前敬禮；<br> 橫移；<br> 快步開步及停步；<br> 快步行進間向左、向右及向後轉；<br> 快步行進間轉彎；<br> 快步行進間換步；<br> 快步行進間向左、向右及向前敬禮；<br> 快步行進間向左、向右注目禮；<br> 原地踏步（快步）及停步；<br> 原地踏步（快步）轉為快步操；<br> 快步操轉為原地踏步（快步）；<br> 原地踏步（快步）換步；<br> 集隊成三排及空行；<br> 報數及排列；<br> 睇齊；<br> 原地開闊排及收窄排；<br> 快步行進間開闊排及收窄排；|1,350分鐘|\n\n2/3\n\n<!-- p.5 -->\n|| 解散（暫時性）及解散；||\n|---|---|---|\n|| 三排轉兩排及兩排轉三排。||\n|8.結業會操實習|1.<br>列舉結業會操不同的崗位及其工作。|90分鐘|\n||2.<br>示範結業會操第二號。||\n\n3/3\n\n<!-- p.6 -->\n【附件 3】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「童軍步操基本訓練班」開辦指引 \n\n- （一）訓練班名稱 ： 童軍步操基本訓練班 Scout Foot Drill Basic Course \n\n- （二）舉辦單位 ： 總會青少年活動署、各地域及童軍區 （三）覈准開班人士 ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 ： 由總會青少年活動署統一發出訓練班屆別，各單位必須於發出通告 前最少 1 個月通知青少年活動署，並將訓練班通告、訓練班時間表 及班職員名單（需提供步操教練員編號）以電郵方式遞交至本署， 以便安排編配相關訓練班屆別。 \n\n- （五）學員人數 ： 12 至 50 人 \n\n- （六）參加資格 ： 持有有效所屬支部紀錄冊之童軍支部成員 \n\n- （七）班職員資格 ： 1. 班領導人必須為本會委任之高級步操教練員或步操教練員；及 2. 導師必須為本會委任之高級步操教練員、步操教練員或助理步 操教練員。 \n\n- （八）班職員出席要求 ： 1. 班職員與學員比例為 1 比 8 2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）訓練班內容 ： 請參閱「童軍步操基本訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書及成績總表 ： 1. 完成訓練班之學員由班領導人發出訓練班證書。證書由舉辦單 位編印，證書編號必須按照總會青少年活動署編配之模式列 印。 \n\n- 2. 成績總表由總會青少年活動署制訂，於通知相關訓練班屆別時 與通知書一併發放。班領導人必須於訓練班完成後一個月內， 將成績總表送交本署存案。 \n\n1/3\n\n<!-- p.7 -->\n## 「童軍步操基本訓練班」課程大綱 \n\n學習時數：不少於 27 小時 \n\n||項目|內容|建議時
