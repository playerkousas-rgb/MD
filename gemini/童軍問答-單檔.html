ntinuously, explore the world, and broaden their horizons. \n\nFrom the following, complete two different types of either new activities or further existing activities and show improvement, with a total time of no less than 20 hours for each (i.e., a total of no less than 40 hours for the two activities). Also, introduce the outcomes of these two experiences to Venture Scouts from the Unit, Rover Scouts, other youth, or the Assessor: \n\n###### 1.  Air Activities \n\n   - Includes but is not limited to: Aircraft and Helicopter Pilot Theory, Parachuting, Flight Activities, all levels of the Aircrew Badge Syllabus, Scout Wings. \n\n2. Sea Activities \n\n   - Includes but is not limited to: Canoeing, Canoe Building, Canoe Polo, Dragon Boating, Sailing, Stand Up Paddleboarding (SUP), SUP Polo, Windsurfing, Snorkeling, Canoe Lifesaving, all levels of the Scout Standard Boat Syllabus. \n\n3. Information Technology \n\n   - Includes but is not limited to: Computing (e.g., applications of Artificial Intelligence), Web Design, Programmable Physical Objects (e.g., Arduino & micro:bit), Application Programming, Data Analysis, Amateur Radio, 3D Printing. \n\n4. Overseas Exchange Activities \n\n   - Participate in an overseas exchange activity requiring at least five day residential stay, including but not limited to: World Scout Jamboree, International or Mainland Exchange Activities. \n\n106\n\n<!-- p.107 -->\n###### 5. Arts \n\n   - Includes but is not limited to: Calligraphy, Pottery, Painting, Sculpture, Graphic Design, Screen Printing, Film Photography, Digital Photography, Film Theory and Shooting Techniques, Drama, Music, Fashion and Textiles. \n\n6. Interests \n\n   - Includes but is not limited to: Nursing, Fishing, Forestry, Gardening, Languages, Meteorology, Stamp Collecting, Debating, Magic, Home Baking, Pet First Aid, Pet Grooming, Certified Personality Dimensions® Facilitator (Level 1), MBTI® Certification. \n\nRemarks: \n\n1. If it is uncertain whether the selected activity will be accepted, consult the assessor first for comment. \n\n2. Members need to draft a plan themselves, consult the assessor, and obtain their approval before implementing the plan. \n\n107\n\n<!-- p.108 -->\n**Category I: \"Scoutcraft\" Self-organised Team Assessment Content** \n\n###### **1.  Pioneering:** \n\nb. Practical: Form a team of  Venture Scouts, apply to a District, Region, or Association Headquarters, and complete any two pioneering projects. \n\nComplete the following items: \n\n1. Complete a Venture Scout Knotting and Pioneering Course organised by a District, Region, or Association Headquarters before assessment. \n\n2. With at least 3 other Venture Scouts to complete any two of the following pioneering projects: \n\n   - (a) Bridge: Construct a bridge not less than 5 metres long and not less than 1.5 metres high using ropes and bamboo. \n\n   - (b) Tower: Construct a tower not less than 4 metres high using bamboo and ropes. \n\n   - (c) Aerial Runway: Construct an aerial runway not less than 8 metres long using ropes. \n\n3. Submit a plan as a team before the activity; each individual must make a proportional model of the pioneering project; and submit a report within one month after the event. \n\nRemarks: \n\n1. Pioneering projects include but are not limited to those listed under Scoutcraft Accreditation Scheme (SAS) Category B and Category C. If it is uncertain whether the selected project will be accepted, consult the assessor first for comment. \n\n2. For detailed assessment requirements, please refer to the chapter 7 appendices of this training scheme. \n\n- Scoutcraft Accreditation Scheme (SAS) Category B and Category C projects list: Category B Projects Category C Projects \n\n108\n\n<!-- p.109 -->\n###### **Category I: \"Scoutcraft\" Self-organised Team Assessment Content (Continued)** \n\n###### **2.  Campcraft and Backwoods Survival Skills** \n\n   - a. Campcraft: \n\n      - i. Practical: Form a team of Venture Scout members, apply to a District, Region, or Association Headquarters, and complete a two days, one night standing camp \n\n- Complete the following items: \n\n1. Complete a two days, one night standing camp, submit a team plan one month prior to the camp, and submit a personal camp report within one month after completing the camp; and \n\n2. Be familiar with various campcraft skills and camp duties: \n\n   - (a)  Layout of a campsite; \n\n   - (b)  Pack a rucksack for a two days, one night standing camp; \n\n   - (c) Pitch, strike, and pack away at least two different types of tents, including but not limited to dome tents, A-frame tents, and cabin tents; \n\n   - (d) Use common knots required for camping activities and complete the following camp gadgets: camp gate, fencing, flagpole and Patrol flag, sleeping tent, store tent, storage rack, work table, meat safe, dining table, clothes and shoe rack, waste disposal unit, tarp shelter, notice board; \n\n   - (e) Methods for transporting and storing food; design and cook a camp menu for breakfast, lunch, and dinner, including recipes; \n\n   - (f) Methods and measures for keeping the campsite hygienic and tidy; \n\n   - (g)  Safely use tools and clean stoves; \n\n   - (h)  Water treatment; \n\n   - (i)  Waste disposal; \n\n   - (j) The content and importance of arrival inspection, evening inspection, morning inspection, and final inspection; \n\n   - (k)  Arrangement of camp programme, including planning and leading a Scouts’ Own and a campfire. \n\nRemarks: \n\n1. The assessor may adjust the assessment timetable according to actual situations and needs. \n\n2. For detailed assessment requirements, please refer to the chapter 7 appendices of this training scheme. \n\n109\n\n<!-- p.110 -->\n###### **Category I: \"Scoutcraft\" Self-organised Team Assessment Content (Continued)** \n\n###### **b. Backwoods Survival Skills:** \n\n      - i. Practical: Form a team of Venture Scout members and apply to the Venture Scout Leader to complete a series of backwoods activities. \n\n- Complete (A) and (B): \n\n- (A)  Complete the following items: \n\n1. Correctly use a penknife to make utensils from natural materials, and use them to consume the food under item 2; and \n\n2. Use natural materials and no more than ten matches to light a fire and backwoods cooking (without using any cooking utensils) to cook the following: \n\n   - (a) An egg, e.g., onion egg, potato egg, orange egg \n\n   - (b) Poultry, e.g., chicken, duck, pigeon \n\n   - (c) Fish \n\n   - (d) Dough, e.g. twist bread \n\n   - (e) Rice \n\n   - (f)  Boil water \n\n- (B)  Complete one of the following items: \n\n1. Using a reflector oven, smoker, cardboard oven, or mud oven to bake one of the following: bread, cake, biscuits, pastries, pizza, puffs; or \n\n2. Use a homemade beverage-can stove to cook a type of meat and a beverage, e.g., soup, broth; or \n\n3. Build a natural shelter and sleep in it for one night; or \n\n4. Use simple tools to desalinate seawater or filter wastewater; or \n\n5. Light a fire using friction or a fire striker. \n\n110\n\n<!-- p.111 -->\n###### **Exploration Badge** \n\n###### Aim: \n\nTo encourage Venture Scouts, after mastering basic expedition skills, to collaborate, form teams, plan thoroughly, and venture to unfamiliar places in nature and overseas. They are expected to challenge themselves, broaden their horizons, and appreciate and respect nature. \n\n###### **Badge** \n\n###### **Objective:** \n\nThrough outdoor or overseas expeditions, encourage Venture Scouts to plan and lead their own journeys, learning to take responsibility and make effective decisions, and become self-reliant. \n\nComplete one of the following: \n\n1. Hiking Expedition \n\n   - Conduct a “3 days and 2 nights” or longer of hiking expedition journey, completing a minimun distance of 40 kilometers.Remark 1 \n\nCondition: Before starting the hiking expedition journey, Venture Scouts must complete recognised expedition training. The assessment must be conducted by Senior Expedition Assessors or Expedition Assessors, recognised by the Association. \n\n2. Cycling Expedition \n\n   - Conduct a “3 days and 2 nights” or longer of cycling expedition journey, completing a minimun distance of 160 kilometers.Remark 1 \n\nCondition: Before starting the cycling expedition journey, Venture Scouts must complete recognised expedition training. The assessment must be conducted by Senior Expedition Assessors or Expedition Assessors, recognised by the Association. \n\n111\n\n<!-- p.112 -->\n3. Overseas Expedition by Driving \n\n   - Conduct a “3 days and 2 nights” or longer of overseas expedition journey by driving, completing a minimun distance of 650 kilometers. \n\n- Condition: Complete the relevant form and submit an application to the Programme Branch at least six months before departure.Remark 2 \n\n4. Overseas Expedition by Mechanical Transport \n\n   - Conduct a “3 days and 2 nights” or longer of overseas expedition journey by mechanical transport, there must be no less than three stops, and the duration of stay at each stop cannot be less than 12 hours with completing a minimun distance of 1,000 kilometers. \n\n- Condition: Complete the relevant form and submit an application to the Programme Branch at least six months before departure.Remark 2 \n\n5. Sea Expedition \n\n   - Conduct a “3 days and 2 nights” or longer of sea expedition journey, completing a minimun distance of 40 kilometers. \n\nCondition: Before starting the sea expedition journey, Venture Scouts must complete recognised sea expedition training. \n\nFor details, please refer to the relevant circulars. \n\nRemarks: \n\n1. If Venture Scout plan to conduct the hiking or cycling expedition in overseas, they must submit PT/71 form to the Programme Branch at least six months prior to departure. Regarding above overseas expeditions, the Expedition Assessor or assessor may exercise flexibility depending on the difficulty of the trail, weather conditions, or other unforeseeable factors, and may sign off on the item without requiring the completion of the specified distance/ number of days. \n\n2. For the relevant form and detailed information for Overseas Expedition by Driving or by Mechanical Transport, please check the website below. \n\n112\n\n<!-- p.113 -->\n###### **Exploration Badge** \n\n###### Aim: \n\nTo encourage Venture Scouts, after mastering basic expedition skills, to collaborate, form teams, plan thoroughly, and venture to unfamiliar places in nature and overseas. They are expected to challenge themselves, broaden their horizons, and appreciate and respect nature. \n\n###### **Bar** \n\n###### **Objective:** \n\nThrough further outdoor or overseas expeditions, encourage Venture Scouts to continue to plan and lead their own journeys, learning to take responsibility and make effective decisions, and become selfreliant. \n\nComplete one of the following: \n\n1. Hiking Expedition \n\n   - Conduct a “4 days and 3 nights” or longer of hiking expedition journey, completing a minimun distance of 60 kilometers.Remark 1 \n\nCondition: Before starting the hiking expedition journey, Venture Scouts must complete recognised expedition training. The assessment must be conducted by Senior Expedition Assessors recognised by the Association. \n\n2. Cycling Expedition \n\n   - Conduct a “4 days and 3 nights” or longer of cycling expedition journey, completing a minimun distance of 240 kilometers.Remark 1 \n\nCondition: Before starting the cycling expedition journey, Venture Scouts must complete recognised expedition training. The assessment must be conducted by Senior Expedition Assessors recognised by the Association. \n\n113\n\n<!-- p.114 -->\n3. Overseas Expedition by Driving \n\n   - Conduct a “4 days and 3 nights” or longer of overseas expedition journey by driving, completing a minimun distance of 1,000 kilometers. \n\n- Condition: Complete the relevant form and submit an application to the Programme Branch at least six months before departure.Remark 2 \n\n4. Overseas Expedition by Mechanical Transport \n\n   - Conduct a “4 days and 3 nights” or longer of overseas expedition journey by mechanical transport, there must be no less than five stops, and the duration of stay at each stop cannot be less than 12 hours with completing a minimun distance of 1,200 kilometers. \n\nCondition: Complete the relevant form and submit an application to the Programme Branch at least six months before departure.Remark 2 \n\n5. Sea Expedition \n\n   - Conduct a “4 days and 3 nights” or longer of sea expedition journey, completing a minimun distance of 60 kilometers. \n\nCondition: Before starting the sea expedition journey, Venture Scouts must complete recognised sea expedition training. \n\nFor details, please refer to the relevant circulars. \n\n114\n\n<!-- p.115 -->\n###### Remarks: \n\n1. If Venture Scout plan to conduct the hiking or cycling expedition in overseas, they must submit PT/71 form to the Programme Branch at least six months prior to departure. Regarding above overseas expeditions, the Expedition Assessor or assessor may exercise flexibility depending on the difficulty of the trail, weather conditions, or other unforeseeable factors, and may sign off on the item without requiring the completion of the specified distance/ number of days. \n\n2. If a Venture Scout selected the \"Overseas Expedition by Driving\" or \"Overseas Expedition by Mechanical Transport\" for their Exploration Badge, they cannot use this item for the Exploration Bar. For the relevant form and detailed information for Overseas Expedition by Driving or by Mechanical Transport, please check the website below. \n\n115\n\n<!-- p.116 -->\n###### **Exploration Guidelines** \n\n###### **Expedition Training** \n\n1. Before starting the hiking expedition journey, Venture Scouts must complete recognised expedition training. \n\n2. Before starting the sea expedition journey, Venture Scouts must complete recognised sea expedition training. \n\n###### **Basic Guidelines for Expeditions** \n\nThe expedition should be carried out in an unfamiliar place. The group should consist of 3 to 7 persons. For mixed group, there must be at least 2 of each gender. Each candidate must take a leading role and navigate during the expedition journey and complete 1 project of their own choice. Each candidate must submit an expedition logbook and a project logbook within 1 month after completing the expedition. \n\nThe guidelines remain the same for Venture Scouts choosing other elective modules. Participants should have a well-planned, meaningful and safe journey. \n\n###### **1. Preparation** \n\nAll participants should have sufficient time and opportunities to plan their expedition. Candidates choosing overseas expedition, it is required to complete the relevant form and submit an application to the Programme Branch at least six months before departure. \n\n###### **2. Journey with Purpose** \n\nThe major part of the expedition should be carried out in an unfamiliar place, be it local expedition on foot, overseas expedition or sea expedition. The projects decided by participants to be completed during the expedition should be meaningful and benefi cial to individuals, the society or the Scout Movement. \n\n###### **3. Safety First** \n\nEveryone’s safety is the first priority. Members must maintain communication with the assessor and strictly follow instructions, even more so when overseas or at sea. Teams choosing overseas expeditions should clearly understand local customs and taboos beforehand, as well as methods for seeking local emergency help. Once the itinerary is approved by the assessor, candidates must \n\n116\n\n<!-- p.117 -->\npromptly submit the expedition plan and the personal details of all team members to the International Branch or Mainland Affairs Branch of the Association. At the same time, the assessor must keep track of the team's travels, provide support at all times, and prepare contingency plans in advance. If members are in a place where it is difficult to receive immediate assistance, the assessor has the responsibility to accompany the team to reduce risks. \n\n###### **Point to Note** \n\n- (I) Venture Scouts applying for the hiking or cycling expedition for their Expedition Badge should note the following: \n\n   1.  The expedition must be assessed by a recognised Expedition Assessor or Senior Expedition Assessor; and \n\n   2. Candidates must not have completed  the Exploration Badge. \n\n- (II) Venture Scouts applying for the hiking or cycling expedition for the Expedition Bar should note the following: \n\n   1. The expedition must be assessed by a recognised Senior Expedition Assessor; and \n\n   2. Upon agreement of the Expedition Assessor, the assessment can be altered to two linked expeditions of 2 nights each. The connection on arrangements should be shown on expedition planning. Candidates should complete the two linked expeditions within 6 months with the same group members if possible.; and \n\n   3. Candidates must not have completed  the Exploration Bar. \n\n- (III) At the discretion of the Expedition Assessor or other stipulated assessor, flexibility can be applied regarding the required distance based on factors such as difficulty of the route, weather, or various unforeseeable circumstances, allowing the item to be completed without reaching the specified distance. \n\n117\n\n<!-- p.118 -->\n- (IV) Overseas and Mainland Activities Subsidy Scheme: The Overseas and Mainland Activities Subsidy Scheme was established with the aim to encourage our youth members and young leaders to broaden their horizons through the participation of overseas and mainland activities. Through these activities, they are encouraged to have self-learning and reflection, so as to be independent, helpful, responsible and engaged people.Venture Scouts may apply for funding. \n\nFor details, please refer to the relevant Circular. \n\n118\n\n<!-- p.119 -->\n###### **What is a \"Journey with Purpose\" and the Guidelines for Self-Selected Projects** \n\n1. An expedition is a “journey with a purpose”, meaning it is designed to achieve a goal or have specific meaning to the team. This journey, conducted outdoors or overseas, can involve learning and applying new skills, gaining a deep understanding of a culture, performing volunteer service, or engaging in selfreflection and growth. While enjoying different types of journeys, Venture Scouts gain profound experiences and personal development. \n\n2.  Expedition projects must be conducted along the journey, whether on foot, bicycle, driving, mechanical transport, or by sea. This can involve travelling to reach relevant locations to carry out the project, as the outdoors and overseas are exciting places for exploration. While many projects can be completed online, expedition projects should not be completed merely through online resources, nor done simply for the sake of fulfilling a requirement. \n\n3. Expedition projects can take the broad direction of field research, exploring cultures, service, or preparing for future activities, etc., emphasising the principle that they \"must be meaningful and beneficial to individuals, society, or the Scout Movement. Examples are not limited to: \n\n   - Field Research For example: Research on the rocks around the East Dam of High Island Reservoir in Sai Kung, research on the mangroves around Kuk Po in Tai Po, research on biodiversity or tree surveys around Mai Po, research on temples around Tai Lam, water quality studies, coral research, etc. \n\n   - Service For example: Inspecting the condition of distance posts on trails, checking for trails that need maintenance or drains that need clearing, introducing and sharing \"Leave No Trace\" principles with hikers, etc. \n\n   - Activity Preparation or Cultural Exploration For example: Designing and reconnoitering a one-day hiking route for Cub Scouts or Scouts, Hong Kong historical trail exploration (e.g., exploring and sharing findings on the City of Victoria Boundary Stones, the seven MacIntosh Forts), etc. \n\n119\n\n<!-- p.120 -->\nPlan and log book Format are no fixed format, but they should include the following content: \n\n###### **Plan book:** \n\n1. Aim and Objectives: Clearly state the general purpose of the journey (e.g., learning, service, cultural exploration, etc.) and specific objectives. \n\n2.  Itinerary: Route information, including departure and return times, modes of transportation, activity plans, and locations. \n\n3.  Expected Outcomes: The results expected to be achieved by the expedition and project, such as improving skills, community involvement, personal growth, etc. \n\n4.  Participants: List the names, ages, and roles (e.g., leader, etc.) of the participants. \n\n5.  Equipment and Finances: Detailed description of required equipment, funds, or other resources. \n\n6.  Risk Assessment: Potential risks and safety precautions. \n\n7.  Method of Evaluation: Outline ways for evaluating the methods for completing the expedition project, including methods for incorporating feedback and reflections. \n\n###### **Log book:** \n\n1.  Summary: Briefly review the background, aim, and main activities of the expedition. \n\n2.  Feedback: Collect opinions and reflections from participants, summarising their learning and experiences. \n\n3. Outcomes and Impact: Record the impact made on individuals, society, or the Scout Movement. \n\n4.  Overcoming Challenges: Describe the challenges faced during the journey and how they were handled. \n\n5.  Recommendations: Suggest improvements and how to better conduct future expeditions. \n\n6.  Reflections: Share personal thoughts and reflections. \n\n7.  Appendix: Include relevant photos, questionnaires, data, or other supporting materials. \n\n120\n\n<!-- p.121 -->\n###### **CHAPTER 3: Badges issued by the World Organisation of the Scout Movement** \n\n**For details, please refer to the following websites:** \n\nMessengers of Peace \n\nPatrimonito Scout Badge \n\nScouts of the World Award \n\nEarth Tribe \n\n121\n\n<!-- p.122 -->\n###### **CHAPTER 4 : Other Awards and Badges** \n\nVenture Scout First Aid Badge \n\nReligious Badge \n\nRover Scout Link Badge \n\nCommunity Involvement Badge \n\nThe Hong Kong Award For Young People \n\n122\n\n<!-- p.123 -->\n###### **Active Citizenship Badge Series** \n\nThe Scout Association of Hong Kong focuses on enhancing civic awareness and social responsibility among youth. To this end, the Association introduced the “Active Citizenship Badge Series” in May 2024, which encourages youth members to actively participate in social affairs, developing their leadership skills and teamwork through various challenges. \n\nFor details, please refer to the following website: \n\nActive Citizenship Badge Series \n\n123\n\n<!-- p.124 -->\n###### **Venture Scout First Aid Badge** \n\nA Venture Scout may wear this badge by holding a valid First Aid Certificate issued by Scout Association of Hong Kong or certificates of other 30-hour first aid courses recognised by the Labour Department under the Occupational Safety and Health Ordinance (Cap. 509, Sub. Leg. A). \n\n124\n\n<!-- p.125 -->\n###### **Religious Badge** \n\n###### **Religious Badge** \n\nVenture Scouts may choose one of the following syllabuses for study. The assessment can be arranged by the Venture Scout Leader with the assistance of an appropriate person, such as a priest, pastor, the clergy, Sunday school teacher, etc. \n\n###### **(A) Catholicism** \n\n1. Knowledge: \n\n   - a. Own and understand the composition of the Bible. \n\n   - b. Recite the 20 mysteries of the Rosary. \n\n   - c. Understand the Liturgical Calendar. \n\n   - d. Explain briefly the meaning of the Seven Sacraments. \n\n   - e. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n2.  Participation: \n\n   - a. Participate in the activities of a parish or lay association and give a written report. \n\n3. Service: \n\n   - a. Understand the methods and meaning of prayer, and lead a prayer during a Unit meeting or activity. \n\n   - b. Guide a fellow Venture Scout in participating in the Eucharist. \n\n   - c. Assist a Cub Scout or Scout in obtaining their Religious Badge (Catholic). \n\n125\n\n<!-- p.126 -->\n###### **(B) Protestantism** \n\n1. Knowledge: \n\n   - a. Own a Bible with the Old Testament and New Testament. \n\n   - b. Recite the Lord's Prayer and the Apostles' Creed, and explain their meanings. \n\n   - c. Sing 7 hymns of their own choosing. \n\n   - d. Narrate 6 Bible stories: three from the Old Testament, including the story of the Exodus; three from the New Testament, including the crucifixion of Jesus. \n\n   - e. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n2.  Participation: \n\n   - a. Participate in church activities, such as Sunday worship, youth fellowship, or choir, etc., and give a written report. \n\n3. Service: \n\n   - a. Understand the meaning of the cross and lead a discussion group. \n\n   - b. Use the Bible and relevant scriptures to explain the meaning of the incarnation and redemption during a Unit meeting or activity. \n\n   - c. Lead a prayer during a Unit meeting or activity. \n\n   - d. Assist a Cub Scout or Scout in obtaining the Religious Badge (Protestant). \n\n###### **(C) Islam** \n\n1. Knowledge: \n\n   - a. Own a translated Quran and demonstrate how to use it. \n\n   - b. Understand that the meaning of Islam is peace and submission. \n\n   - c. Recite and understand the meaning of the Shahada: \"There is no god but God; Muhammad is the messenger of God.\". \n\n   - d. Recite three Hadiths. \n\n   - e. State the number of Muslims worldwide and the locations of various mosques in Hong Kong. \n\n   - f. Explain the meaning of the Five Pillars: Shahada, Salat, Sawm, Zakat, and Hajj. \n\n   - g. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n###### 2.  Service: \n\n- a. Assist a Cub Scout or Scout in obtaining the Religious Badge (Islam). \n\n126\n\n<!-- p.127 -->\n###### **(D) Confucianism** \n\n1.  Knowledge: \n\n   - a. Understand and respect traditional Chinese culture and Confucian teachings. \n\n   - b. Recite and understand the Li Yun Da Tong ( 禮運大同篇 ) and Mencius ( 孟子經訓 ). \n\n   - c. State the Four Books, Five Classics, Six Arts, and Eight Virtues. \n\n   - d. Sing the \"Ode to Confucius\" and understand its meaning. \n\n   - e. Quote five passages from the Analects and explain their meanings. \n\n   - f. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n2. Participation: \n\n   - a. Offer sacrifices to ancestors, Heaven, and Earth annually. \n\n   - b. Participate in ceremonies for the birthdays of Confucius or Mencius, or traditional sacrificial rites, and understand and observe the rituals. \n\n   - c. Visit a traditional temple, conduct exchange activities with Confucian organisations, and give a written report. \n\n3. Service: \n\n   - a. Assist a Cub Scout or Scout in obtaining the Religious Badge (Confucianism). \n\n###### **(E) Buddhism** \n\n1.  Knowledge: \n\n   - a. Own and recite Buddhist Sutras and the Morning and Evening Chanting rituals. \n\n   - b. Sing the Triple Gem song and understand its meaning. \n\n   - c. Tell three Buddhist stories. \n\n   - d. Explain the definition of Karma. \n\n   - e. Understand the meaning of Taking Refuge in the Triple Gem. \n\n   - f. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n2. Participation: \n\n   - a. Participate in the Buddha Bathing Ceremony and Buddhist activities, and give a written report. \n\n   - b. Have participated in the ceremony of Taking Refuge in the Triple Gem. \n\n(cont'd next page) \n\n127\n\n<!-- p.128 -->\n###### **(E) Buddhism (Cont'd)** \n\n3.  Service: \n\n   - a. Lead a Buddhist youth group in discussing the teachings of Buddha. \n\n   - b. Assist a Cub Scout, Scout, or Venture Scout in Taking Refuge in the Triple Gem. \n\n   - c. Assist a Cub Scout or Scout in obtaining the Religious Badge (Buddhism). \n\n###### **(F) Taoism** \n\n1.  Knowledge: \n\n   - a. Possess the Tao Te Ching and explain the meaning of five of its chapters. \n\n   - b. Recite the Ode to the Supreme Patriarch of Tao and explain its meaning. \n\n   - c. Understand the meaning of the Taoist Hundred Character Tablet of Lu of Taoism. \n\n   - d. State the titles of the Three Pure Ones of Taoism. \n\n   - e. Explain the meanings of the Three Treasures of Taoism, the Seven Virtues of Chapter 8 of the Tao Te Ching, and the Nine Virtues of Patriarch Lu Chunyang. \n\n   - f. Explain the meaning of \"Duty to God\" in the Scout Promise. \n\n2. Participation: \n\n   - a. Visit two Taoist temples and give a written report. \n\n3.  Service: \n\n   - a. Tell the life story of Laozi or another immortal during a Unit meeting or activity. \n\n   - b. Assist a Cub Scout or Scout in obtaining the Religious Badge (Taoism). \n\n128\n\n<!-- p.129 -->\n###### **Rover Scout Link Badge** \n\n###### **Aim:** \n\nThe establishment of the Rover Scout Link Badge aims to help Venture Scout members of appropriate age understand Rover Scout Section activities and encourage them to advance to become Rover Scouts. \n\nVenture Scouts aged 19 or above can undertake the Rover Scout Link Badge, which is awarded by their Venture Scout Leader. If the Leader is unable, the badge can be awarded by a designated personnel appointed by the District, Region, or Association Headquarters. Venture Scout Leaders should encourage and arrange for members of their Unit to understand and participate in Rover Scout Section activities. The District Commissioner or their representative is responsible for assisting Venture Scout Units in the District carry out activities for the Link Badge, especially for Scout Groups that have not established a Rover Scout Crew or cannot arrange relevant activities due to other reasons. \n\nThe Rover Scout Introductory Course is an option within the Rover Scout Epaulettes, positioned as the beginning of a Rover Scout's journey. It aims to give Rover Scouts a basic understanding of the Section and training scheme, guiding members to experience and understand their Rover journey. It allows them to experience Scout activities, learn basic Scoutcraft, and serves as a way for Rover Scouts from different backgrounds to interact with each other. \n\n129\n\n<!-- p.130 -->\n###### **Objective:** \n\nVenture Scouts or other individuals aged 19 or above with interest in Rover Scouting. \n\n###### **Content:** \n\n1.  Complete a Rover Scout Introductory Course recognised by a District, Region, or Association Headquarters; or complete an equivalent item (for content, please refer to the \"Rover Scout Introductory Course Overview\" in the appendix). \n\n2. Participate in at least 2 activities organised by the same Rover Scout Crew, such as a variety night, joint activity, Crew open day, or meeting. \n\n- Note 1: Members who have completed the Rover Scout Link Badge may be issued the Rover Scout Epaulettes directly upon joining the Crew and obtaining the Membership Badge. \n\n130\n\n<!-- p.131 -->\n###### **Community Involvement Badge** \n\nThe Community Involvement Badge aims to develop the civic awareness of Venture Scouts by community education and involvement in service projects. Venture Scouts learn to recognise the needs and problems in the society, understand the policies related to daily life, and get involved practically in community affairs. It is hoped that Venture Scouts will develop further civic responsibility, contributing to a better society. \n\nThe Community Involvement Badge consists of two parts: (A) Thematic Workshop and (B) Practical Application. \n\nThe Thematic Workshops centre on the following 7 themes: \n\n- (1) Environmental Hygiene and Cleanliness \n\n- (2) Anti-corruption \n\n- (3) Fight Against Crime \n\n- (4) Drug Education \n\n- (5) Equal Opportunities \n\n- (6) AIDS Prevention Education \n\n- (7) Respect for Intellectual Property Rights \n\n131\n\n<!-- p.132 -->\n###### **Assessment Requirements:** \n\nParticipants must complete Part (A) and Part (B) within six months: \n\n###### (A) \n\nComplete at least one thematic study course recognised by the Association, and be able to: \n\n1.  State and explain knowledge related to the chosen theme, and list the appropriate skills and attitude; and \n\n2.  Explain the aims, meanings, methods and modes of community involvement, and \n\n3.  Describe effective ways of planning and organising community involvement activities. \n\n###### (B) \n\nComplete a practical application from the selected workshop topic, and meet the following requirements: \n\n1.  Submit a logbook of the chosen theme that contains at least 3 related newspaper clippings, followed by personal comments and feasible recommendations, \n\n2.  Complete a thematic study assigned by the Course Leader as a group, and present and lead a discussion on the study with the course or the public; \n\n3. Work as a team to assist in implementing an activity organised by the HKSAR Government with the consent of the Course Leader, or organise and implement a Service Badge project, submitting plans and reports to the assessor, and \n\n4.  Participate in large-scale promotional campaigns implemented by the HKSAR Government (applicable to specific topics only). \n\n132\n\n<!-- p.133 -->\n###### **The Hong Kong Award For Young People** \n\n###### **Introduction** \n\nThe Hong Kong Award for Young People (formerly the Duke of Edinburgh's Award in Hong Kong) is a member of The Duke of Edinburgh's International Award Association. The Award Scheme is internationally recognised and encourages young people to challenge themselves and show improvement while completing the levels of the Award. \n\nFor details, please refer to the following website: \n\nThe Hong Kong Award For Young People \n\n133\n\n<!-- p.134 -->\n###### **Air Activity Badges** \n\nThe \"Aircrew Syllabus\" is divided into three stages: Basic Aircrew Badge, Intermediate Aircrew Badge, and Advanced Aircrew Badge. It provides Venture Scouts with comprehensive and interesting aviation training across three major domains: aviation knowledge, flight knowledge, and flight simulation training. The badge design also incorporates a propeller, representing flight training, and halfwings representing flight, symbolising Venture Scouts preparing to experience actual flying. \n\nFor details, please refer to the following websites: \n\nThe Aircrew Syllabus \n\nScout Wings & Scout Canopy Wings \n\n134\n\n<!-- p.135 -->\n###### **Sea Activity Badges** \n\nThe Scout Standard Boat Syllabus (Venture Scout Section) is a threestage syllabus: Boatswain (Level 3 Scout Standard Boat Certificate), Coxswain’s Mate (Level 4 Scout Standard Boat Certificate) and Coxswain (Level 5 Scout Standard Boat Certificate), providing advanced sea activity training for Venture Scouts. If a Venture Scout has already attained a Level 3 Scout Standard Boat Certificate when they were in the Scout Section, they can wear the Venture Scout Boatswain Badge directly upon moving up to the Venture Scout Section. \n\nFor details, please refer to the following website: \n\nSea Activity Badges \n\n135\n\n<!-- p.136 -->\n###### **CHAPTER 5 : Procedures and Guidelines on Issue and Collection/Purchase of Badges** \n\nFor details, please refer to the following websites: \n\n136\n\n<!-- p.137 -->\n###### **CHAPTER 6 : Ceremonies** \n\nFor details, please refer to the following websites: \n\n137\n\n<!-- p.138 -->\n###### **CHAPTER 7 : Appendices** \n\nFor details, please refer to the following website: \n\nHong Kong Venture Scout Competition \n\nHong Kong Venture Scout Council \n\n138\n\n<!-- p.139 -->\nHong Kong Venture Scout History \n\nFrequently Asked Questions \n\n139\n\n<!-- p.140 -->\n###### **Assessment/Course Guidelines** \n\nFor details, please refer to the following website: \n\n140\n\n<!-- p.141 -->\n###### **Acknowledgments** \n\nThe publication of this edition of the training scheme relied on the full assistance and tireless efforts of all members of the Venture Scout Training Scheme Development Group, the Venture Scout Training Scheme Working Group, and other individuals involved in the compilation work. We would like to express our deepest gratitude. \n\n|Wilson LAI|Chief Commissioner|\n|---|---|\n|Derek CHAN|Deputy Chief Commissioner (Programme &<br>Training)|\n|Jason NG|Deputy Chief Commissioner (Operations)|\n|Dion CHEN|Assistant Chief Commissioner (Programme)|\n|LO Pui-lam|Convenor of the Sectional Training<br>Review Committee|\n|William CHEUNG|Deputy Programme Commissioner (Sections)|\n|Ivan SHIU|Assistant Programme Commissioner (Sections)|\n|**Sectional Review**<br>**Chairman:**<br>WU Wan-lung|**- Venture Scout Board**<br>Headquarters Commissioner (Venture Scouts),<br>Programme Branch|\n|**Vice-Chairman:**<br>HUI Chun|Assistant Headquarters Commissioner (Venture<br>Scouts), Programme Branch|\n|**Members:**<br>CHUNG Tsz-kin|Regional Headquarters Commissioner (Venture<br>Scouts), East Kowloon Region|\n|TANG Wai-keung|Regional Headquarters Commissioner (Venture<br>Scouts), Kowloon Region|\n|YUEN Kwan-yeung|Regional Headquarters Commissioner (Venture<br>Scouts), New Territories Region|\n|TANG Man-hin|Regional Headquarters Commissioner (Venture<br>Scouts), New Territories East Region|\n|NIP Ka-wai|Regional Scouter, Hong Kong Island Region|\n\n141\n\n<!-- p.142 -->\n|WONG Sing-chun|Headquarters Scouter, Programme Branch|\n|---|---|\n|LAI Sam|Chairman, 13th Hong Kong Venture Scout Council|\n|KOO Cheuk-man|Member, 13th Hong Kong Venture Scout Council|\n|SHIU Cheuk-man|Member, 13th Hong Kong Venture Scout Council|\n|CHOY Pui-ching|Member, 1st Youth Affairs Advisory Council|\n|LEE Ming-chun|Member, 1st Youth Affairs Advisory Council|\n|**Special Thanks**||\n|LAI Pak-fai|Regional Headquarters Commissioner (Venture<br>Scouts), Hong Kong Island Region|\n|LAI Keith|Headquarters Scouter|\n|WONG Hiu-fung|Member, Venture Scout Board|\n|PANG Lok-yee|Secretary, Venture Scout Board|\n|MIU Sze-yu|Chairman, 14th Hong Kong Venture Scout Council)|\n|POON Wai-hon|Chairman, 1st Youth Affairs Advisory Council|\n|MENG Victor Deyou|Vice-Chairman, 1st Youth Affairs Advisory Council)|\n||All Members, 1st Youth Affairs Advisory Council|\n||All Members, 13th Hong Kong Venture Scout<br>Council|\n||All Members, 14th Hong Kong Venture Scout<br>Council|\n\n|**Badges and Cov**|**er Design**|\n|---|---|\n|FONG Man-chung|Assistant Rover Scout Leader, 15th Hong Kong<br>Group|\n|**Typesetting**||\n|HUANG Hei-yuen|Assistant Headquarters Scouter, Programme<br>Branch|\n\n###### **Translation** \n\n|TANG Chor Xi|Venture Scout, 36th HongKongGroup|\n|---|---|\n|William Thomas<br>BevanJAMES|Venture Scout, 30th Silver Jubilee Group|\n\n142\n\n<!-- p.143 ocr -->\n香 ~~港~~ 童軍總會 Scout Association of Hong Kong \n\n資\n\nVENTURE!\n\nVENTURE!\n\nVENTURE\n\nVENTUREL\n\n香港童軍總會 Scout Association of Hong Kong\n","02_支部訓練綱要/05 Rover Section Training Scheme - Chi (v 20260519) no ISBN.md":"---\nsource_file: \"05 Rover Section Training Scheme - Chi (v 20260519) no ISBN.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 60\npages_ocr: 3\nocr_avg_score: 0.916\npipeline: pymupdf-layout\nocr_engine: rapidocr\n---\n\n<!-- p.1 ocr -->\n1\n\nRouer | Srout | BumRID | Stheme\n\n樂行童軍訓要\n\nsamuia Sublimitp 港\n\n<!-- p.2 -->\n# 樂行童軍訓練綱要 ROVER SCOUT TRAINING SCHEME \n\n香港童軍總會 Scout Association of Hong Kong \n\n一九八二年 ： 第一版 \n\n**First Edition** ： **1982** 二零二六年二月 ： 第五版 \n\n**Fifth Edition** ： **February 2026** \n\n2\n\n<!-- p.3 -->\n序 \n\n樂行童軍支部是童軍運動中培育成年初期青年的重要支部。18 至 25 歲的青年正逐步投 身社會，童軍訓練在此階段着重引導成員把童軍精神轉化為實際行動，回應社會、國 家以至世界的需要。此階段的學習着重將價值觀落實於真實生活之中。 \n\n樂行童軍支部以「服務為本．國際視野」為教育目標，透過服務、國際交流及多元挑 戰，培養成員的公民意識、全球視野及持續自我提升的能力，讓學習不侷限於本地經 驗，而能放眼世界、關懷不同社羣。鼓勵成員理解全球議題，培養跨文化敏感度。 \n\n本次修訂的訓練綱要，進一步強化準領袖培訓與進度性獎章制度，鼓勵成員自行策劃 及推行具影響力的服務與行動，實踐承擔、領導與服務精神。讓成員在行動中發揮影 響力，回饋社會。 \n\n新訓練綱要同時重視個人發展與社會參與之間的平衡，協助樂行童軍在追求專業、興 趣與理想的同時，持續關心社羣、回饋社會，建立長遠而正面的公民身份。讓童軍精 神成為一生受用的價值基礎。 \n\n本人謹此感謝支部訓練檢討工作小組及各位參與修訂工作的領袖，為樂行童軍支部訓 練綱要的完善與落實提供寶貴意見與支持。期望樂行童軍能在童軍旅程中不斷反思與 成長，成為具承擔、具視野、具行動力的良好及有為公民。 \n\n助理香港總監（青少年活動） 陳狄安 \n\n二零二六年二月 \n\n3\n\n<!-- p.4 -->\n## 前言 \n\n自二零一五年四月一日第四版《樂行童軍訓練綱要》推行以來，至今已屆十年。面對 社會瞬息萬變，這十年間，社會各個層面均經歷了深刻轉變，成員的需要亦有所變化。 為使能與時並進，更有效地配合現今樂行童軍支部所屬年齡層成員的發展需要，我們 必須修訂《樂行童軍訓練綱要》。 \n\n本次修訂是經「支部訓練檢討委員會」推動和建議；並與各地域進行了深入探討；同 時徵詢了「樂行童軍議會」及「青年事務諮議會」的寶貴意見，及為修訂重點進行了 公開諮詢。在此基礎上，樂行童軍組重申樂行童軍支部的銘言為「服務」，並繼續將樂 行童軍支部定位為「準領袖」的培訓平臺。同時，我們致力於促進成員的身心發展與 健康，拓展他們的國際視野，重視培育他們勇於挑戰和堅毅不屈的精神。 \n\n新版的《樂行童軍訓練綱要》正是基於上述各項支部訓練重點而制定，並以「服務為 本．國際視野」為教育目標。我們堅信，成員在完成「貝登堡獎章」的考驗後，定能 成長為具備卓越素質和廣闊國際視野的領袖，為童軍運動的發展注入新的活力，並為 社會作出更大的貢獻。 \n\n最後，我謹代表香港童軍總會，感謝所有為修訂和編制《樂行童軍訓練綱要》而付出 努力和貢獻的人士。 \n\n青少年活動署 總部總監（樂行童軍） 吳文俊 \n\n二零二六年二月 \n\n4\n\n<!-- p.5 -->\n## 目錄 \n\n||頁碼|\n|---|---|\n|封面|1-2|\n|序|3|\n|前言|4|\n|目錄|5-6|\n|引言|7|\n|第一章：樂行童軍支部的組織及規條|8-12|\n|(一)<br>目的||\n|(二)<br>方法||\n|(三)<br>童軍誓詞||\n|(四)<br>童軍規律||\n|(五)<br>童軍銘言||\n|(六)<br>年齡規限||\n|(七)<br>樂行童軍團的最低應有標準||\n|(八)<br>樂行童軍團內部組織及功能||\n|(九)<br>領袖的職責及要求||\n|(十)<br>預期成果||\n|(十一) 制服||\n|第二章：樂行童軍支部的訓練計劃|13|\n|進度性獎章考驗程序|14|\n|會員章|15-17|\n|樂行童軍肩章|18|\n|樂行童軍獎章及貝登堡獎章考驗項目|19|\n|準領袖培訓|20|\n|童軍技能|21|\n|服務|22|\n|國際視野|23|\n|興趣及技能|24|\n|身心健康|25|\n|挑戰|26-27|\n\n5\n\n<!-- p.6 -->\n|第三章：世界童軍組織推出的徽章|28|\n|---|---|\n|寰宇童軍章|29|\n|地球部落徽章|30|\n|童軍世界遺產章|31|\n|第四章：其他獎章及徽章|32|\n|急救章|33|\n|童軍拯溺布章|34|\n|高級空勤員章 及 舵手章|35|\n|飛行章 及 跳傘章|36|\n|「積極公民」獎章系列|37|\n|樂行童軍社區參與章|38-39|\n|樂行童軍宗教章|40-45|\n|公教章|46|\n|香港青年獎勵計劃金章／銀章|47|\n|第五章：徽章簽發/領取/購買||\n|徽章簽發|48-51|\n|徽章領取∕購買|52-53|\n|第六章：典禮與儀式||\n|樂行童軍宣誓儀式|54-56|\n|附錄||\n|樂行童軍啟導班課程概要|57|\n|全港樂行童軍錦標賽|58|\n|鳴謝|59|\n\n6\n\n<!-- p.7 -->\n## 引言 \n\n本書詳述樂行童軍支部組織、規條及訓練課程，並詳列樂行童軍支部各個獎章的考驗 範圍及應達到的水平。 \n\n本書乃本會正式訓練手冊之一，有關領袖均須遵照執行。如有任何進一步修訂，請留 意日後所發出之通告。 \n\n7\n\n<!-- p.8 -->\n## 第一章：樂行童軍支部的組織及規條 \n\n### （ **1** ） 目的 \n\n樂行童軍支部旨在維繫關懷社會、熱心服務之青年，給予他們機會及鼓勵， 為童軍運動及社會服務；同時，通過一個具挑戰性的獎章計劃，激發他們的 進取心、發展個人潛能、促進身心健康並拓展國際視野，使其成為有責任感 及對社會有貢獻的公民。 \n\n### （ **2** ） 方法 \n\n本支部之訓練方法，以自治及自務的樂行童軍團為基礎，輔以具挑戰性及有 進度性之獎章制度。 \n\n### （ **3** ） 童軍誓詞 \n\n我願以信譽為誓，竭盡所能； 對神明，對國家，盡責任； 對別人，要幫助； 對規律，必遵行。 \n\n### （ **4** ） 童軍規律 \n\n1. 童軍信用為人敬。 \n\n2. 童軍待人要忠誠。 \n\n3. 童軍友善兼親切。 \n\n4. 童軍相處如手足。 \n\n5. 童軍勇敢不怕難。 \n\n6. 童軍愛物更惜陰。 \n\n7. 童軍自重又重人。 \n\n### （ **5** ） 銘言 \n\n童軍運動及樂行童軍支部的銘言分別為「準備」及「服務」。 \n\n### （ **6** ） 年齡規限 \n\n18 歲至 25 歲。成員於年滿 26 歲當日，其樂行童軍身分將自動結束。 \n\n8\n\n<!-- p.9 -->\n### （ **7** ） 樂行童軍團的最低應有標準 \n\n1. 人 數 \n\n一已成立的樂行童軍團，最少要有樂行童軍六名。 \n\n2. 領 袖 \n\n一樂行童軍團最少要有兩名領袖，其中一名必須持有領袖委任書。此外， 其中一名領袖的性別必須與該團成員相同。如團內有男及女成員，則必須 有男及女領袖。 \n\n3. 青少年活動與訓練 樂行童軍的活動與訓練，必須遵照總會出版的「樂行童軍訓練綱要」及 所頒佈的任何有關修訂文件。 \n\n4. 團管理委員會 \n\n   - 該委員會負責設計及推行年度活動計劃。 \n\n### （ **8** ） 樂行童軍團內部組織及功能 \n\n1. 一樂行童軍團為樂行童軍所組成，並由團管理委員會管理。 \n\n2. 樂行童軍團的團管理委員會乃由所有團員選舉產生，包括主席及由團員 自行決定的其他委員人選。該委員會負責團內的架構、組織、活動及行 政等事宜。 \n\n### （ **9** ） 領袖的職責及要求 \n\n1. 團長 \n\n   - (a) 最低年齡為 26 歲，並須於 65 歲生日當日退休。 \n\n   - (b) 在旅長督導下及在樂行童軍副團長及教練員的協助下，樂行童軍團長 與團管理委員會合作負責樂行童軍團內的青少年活動與訓練事宜。 \n\n2. 副團長 \n\n   - (a) 最低年齡為 26 歲，並須於 65 歲生日當日退休。 \n\n   - (b) 樂行童軍副團長的職責由樂行童軍團長決定。樂行童軍團長於訂定其 職責時，須以能啟發其領導才為主。 \n\n### （ **10** ） 預期成果 \n\n樂行童軍支部的進度性訓練共分為四個階段，分別為「會員章」、「樂行童軍 肩章」、「樂行童軍獎章」及「貝登堡獎章」。通過進度訓練，成員將最終具 備紮實的童軍技能、健康的體魄與心靈、廣闊的國際視野、以及勇於挑戰自 我的精神，從而達到全人發展的目標。 \n\n同時，本支部將「木章訓練系統」與「童軍旅服務經驗」融入進度性訓練當 中，使樂行童軍支部成為一個培育「準領袖」的平臺，為成員未來成為優秀 的童軍領袖做好充分的準備。 \n\n9\n\n<!-- p.10 -->\n### （ **11** ） 制服 \n\n樂行童軍須穿著總會指定的樂行童軍、樂行海童軍或樂行空童軍制服， 樂行童軍團成員的基本服飾、配件及徽章如下： \n\n#### 男團員 \n\n||樂行童軍|樂行空童軍|樂行海童軍|\n|---|---|---|---|\n|帽|深綠色軟帽|灰藍色軟帽|海童軍男領袖白頂帽|\n||（連成員帽章）|（連成員帽章）|（連樂行海童軍帽章）|\n|恤衫|杏色、短袖、|淺藍色、短袖、|白色、短袖、|\n||兩胸袋、無褶，肩帶|兩胸袋、無褶、肩帶|兩胸袋、無褶、肩帶|\n|長褲|草青色、兩斜袋、|深藍色、兩斜袋、|深藍色、兩斜袋、|\n||兩後袋、有褶|兩後袋、有褶|兩後袋、有褶|\n|皮帶||棕色（連童軍徽皮帶扣）||\n|襪||黑色、短襪||\n|皮鞋||黑色、無花紋、綁帶||\n|領巾||旅巾（連童軍巾圈）||\n|領帶|深綠色|深藍色|黑色|\n|徽章|世界童軍|會員章、香港章、地域章、|區章、旅章|\n\n備註： \n\n1. 完成木章訓練第 2 階段或以上的樂行童軍，可佩戴「基維爾巾圈」。 \n\n2. 上表只供參考，內容如有更改，以總會之最新公佈為準。 \n\n10\n\n<!-- p.11 -->\n#### 女團員 \n\n||樂行童軍|樂行空童軍|樂行海童軍|\n|---|---|---|---|\n|帽|深綠色軟帽<br>（連成員帽章）|灰藍色軟帽<br>（連成員帽章）|海童軍女領袖白頂帽<br>（連樂行海童軍帽章）|\n|恤衫|杏色、短袖、<br>兩胸袋、無褶，肩帶|淺藍色、短袖、<br>兩胸袋、無褶、肩帶|白色、短袖、<br>兩胸袋、無褶、肩帶|\n|長褲|草青色、兩斜袋、<br>兩後袋、有褶|深藍色、兩斜袋、<br>兩後袋、有褶|深藍色、兩斜袋、<br>兩後袋、有褶|\n|半截裙|草青色、側袋、<br>無褶、及膝|深藍色、側袋、<br>無褶、及膝|深藍色、側袋、<br>無褶、及膝|\n|皮帶||棕色（連童軍徽皮帶扣）||\n|襪|肉色、|尼龍、無花、襪褲（配半<br>或<br>黑色（配長褲）|截裙）|\n|皮鞋|黑色、無|花紋、非綁帶、中跟（配<br>或|半截裙）|\n||黑|色、無花紋、綁帶（配長褲|）|\n|領巾||旅巾（連童軍巾圈）||\n|領帶|深綠色|深藍色|黑色|\n|徽章|世界童軍會|員章、香港章、地域章、|區章、旅章|\n\n備註： \n\n1. 完成木章訓練第 2 階段或以上的樂行童軍，可佩戴「基維爾巾圈」。 \n\n2. 上表只供參考，內容如有更改，以總會之最新公佈為準。 \n\n11\n\n<!-- p.12 ocr -->\n#### 樂行童軍制服 \n\n12\n\n樂行童軍制服\n\n6\n\n8\n\n18 12\n\n19 | 20\n\n右袖 | 左袖\n\n①黑色皮製巾圈（附有童軍徽號）/ | ③金紫荊/總領袖/ | 優巽旅團章\n| --- | --- | --- |\n基維爾巾圈 | 榮翏童軍章標/ | 香港青年計劃金/銀章\n②香港章 | 樂行童軍先修章 | 高級空勤員章\n③飛行章/跳傘章 | 9樂行童軍章/貝登堡章 | 舵手章\n④服務年星 | 樂行童軍肩章 | 9急救章\n5會員章/和平使者章 | ①旅章 | 2童軍拯溺布章\n（結合世界童軍會員章） | 區章 | 2樂行童軍社區參與章\n宗教章/公教章 | ③地域章 | 2ATAS標誌\n紀念章 | 4世界童軍組織推出的章/\n\n極公民章系列 （最多佩戴合共四枚）\n\n12\n\n<!-- p.13 -->\n## 第二章：樂行童軍支部訓練計劃 \n\n樂行童軍訓練計劃共分為四個階段，分別為會員章、樂行童軍肩章、樂行童軍獎章及 貝登堡獎章。 \n\n會員章 「會員章」是樂行童軍支部進度性訓練的初階，旨在 讓新加入的成員通過參與團活動去認識童軍運動及樂 行童軍支部，明瞭及接納童軍誓詞和規律。 樂行童軍肩章 「樂行童軍肩章」之設立旨在提供階梯，讓剛考獲會 員章的樂行童軍對樂行童軍支部活動及童軍技能有基 本認識和體驗。 \n\n## 樂行童軍獎章 及 貝登堡獎章 \n\n「樂行童軍獎章」及「貝登堡獎章」的考驗包含 7 個 範疇，分別是：「準領袖培訓」、「童軍技能」、「服 務」、「國際視野」、 「興趣及技能」、「身心健康」和 「挑戰」。 這 7 項考驗緊扣「服務為本．國際視野」的教育目 標，鼓勵樂行童軍積極參與社區服務，加深對社會和 國家的認識，培養他們的公民責任感和使命感。同 時，考驗亦能幫助樂行童軍更深入瞭解香港以至全球 的發展情況，拓展他們的國際視野。此外，考驗亦著 重準領袖培訓，旨在培育樂行童軍成為未來的青年領 袖，回饋社會。考驗內容亦涵蓋其他範疇，鼓勵樂行 童軍持續進修和自我增值，裝備自己成為未來領袖， 促進他們的全面發展。 樂行童軍完成 7 項獎章考驗中的其中 4 項，即可獲頒 「樂行童軍獎章」；完成所有 7 項考驗，便能獲頒「貝 登堡獎章」。 \n\n13\n\n<!-- p.14 -->\n### 進度性獎章考驗程序 \n\n<!-- Start of picture text -->\n平均於 3 個月<br>會員章<br>內完成<br>完成啟導班／等同項目／先修章<br>平均於<br>3 至 6 個月<br>內完成 樂行童軍肩章<br>完成  7  項考驗中的其中  4  項<br>平均於<br>12 至 18 個月<br>內完成 樂行童軍獎章<br>完成所有  7  項考驗<br>平均於<br>12 至 18 個月<br>內完成<br>貝登堡獎章<br><!-- End of picture text -->\n\n備註：7 項考驗可同時進行，該 7 項考驗分別為： 「準領袖培訓」、 「童軍技能」、 「服務」、 「國際視野」、 「興趣及技能」、 「身心健康」及「挑戰」。 \n\n14\n\n<!-- p.15 -->\n### 會員章 \n\n簡介： \n\n此章是由管理委員會安排訓練及考覈，管理委員會主席推薦，經由團長批覈及頒發。 \n\n內容： \n\n完成以下各項： \n\n- **1** 活動 \n\n   - 1.1 參與最少 3 次團活動，其中最少 1 次是團或旅部所安排之活動和 1 次戶外或海 上活動。 \n\n      - 1.1.1 團或旅部所安排之活動可包括綜合晚會、童軍旅聯合活動及童軍旅開 放日等活動。 \n\n      - 1.1.2 戶外活動可包括旅行、露營、營火會或戶外團集會等。 \n\n      - 1.1.3 海上活動可包括游泳、划艇、劃獨木舟等訓練或活動。 \n\n- **2** 理解 \n\n   - 2.1 對國旗、國徽、區旗、區徽和國歌的認識： \n\n      - 2.1.1 能辨認中華人民共和國國旗、國徽，並能說出其含意。 \n\n      - 2.1.2 能辨認香港特別行政區區旗、區徽，並能說出其含意。 \n\n      - 2.1.3 明瞭設立國歌的用意，並能背唱之。 \n\n15\n\n<!-- p.16 -->\n#### 2.2 對香港及世界童軍運動有普遍的認識： \n\n- 2.2.1 對香港童軍運動的認識： \n\n   - a) 香港童軍運動發展史略。 \n\n   - b) 各支部簡介：小童軍、幼童軍、童軍、深資童軍和樂行童軍。 \n\n- 2.2.2 對世界童軍運動的認識： \n\n   - a) 世界童軍運動始創人史略。 \n\n   - b) 世界童軍運動發展史略。 \n\n   - c) 世界童軍運動現況。 \n\n#### **3** 禮節 \n\n- 3.1 認識在國歌奏唱和升掛國旗、區旗時應有之禮儀。 3.2 認識升掛國旗、區旗及展示國徽、區徽時的注意事項及使用之限制。 \n\n- 3.3 示範國旗和區旗的升掛方法。 \n\n- 3.4 認識童軍禮節及步操。 \n\n   - 3.4.1 能夠辨別各支部成員的制服式樣；知道樂行童軍支部制服的式樣及各 徽章的正確佩戴方法和位置。 \n\n   - 3.4.2 能夠認識領袖制服的式樣和辨別各職級標誌。 \n\n   - 3.4.3 懂得使用及明瞭下列的禮節： \n\n      - a) 徒手禮 \n\n      - b) 握手禮 \n\n      - c) 宣誓禮 \n\n   - 3.4.4 明瞭下列的典禮儀式 \n\n      - a) 升或展旗 \n\n      - b) 降旗 \n\n      - c) 宣誓 \n\n   - 3.4.5 懂得基本集合的口令和手號。 \n\n   - 3.4.6 曾接受基本步操訓練，懂得包括原地和行進間的動作和口令。 \n\n16\n\n<!-- p.17 -->\n- **4** 許諾 \n\n   - 4.1 明瞭及能接納童軍誓詞及規律： \n\n      - 4.1.1 能夠背誦童軍誓詞及規律。 \n\n      - 4.1.2 知道童軍誓詞及規律的基本意義。 \n\n4.1.3 願意在日常生活中，履行童軍誓詞及規律。 \n\n- **5** 保護童軍成員免受傷害 \n\n   - 5.1 完成「保護童軍成員免受傷害」網上自學課程。 \n\n備註： \n\n於考取「樂行童軍先修章」時所參與的  2 次樂行童軍團活動可計算在「會員章」的團 活動次數要求內。 \n\n17\n\n<!-- p.18 -->\n### 樂行童軍肩章 \n\n#### 簡介： \n\n樂行童軍肩章之設立旨在提供階梯，讓剛考獲會員章的樂行童軍對樂行童軍支部活動 及童軍技能有基本認識和體驗。 \n\n#### 考覈流程： \n\n樂行童軍肩章須經所屬團長批覈及推薦，由所屬樂行童軍區長／助理區總監（樂行童 軍）／助理總部總監（樂行童軍）／總部總監（樂行童軍）確認及簽發。 \n\n#### 內容： \n\n完成下列各項： \n\n1. 完成總會／地域／區認許之樂行童軍啟導班；或 （於成為樂行童軍前已完成的樂行童軍啟導班可予以追認。） \n\n2. 完成同等項目。 \n\n   - （請參照附錄之「樂行童軍啟導班課程概要」。） \n\n#### 備註： \n\n完成「樂行童軍先修章」之成員於晉團和獲取「會員章」後將視作已完成「樂行童軍 肩章」考驗。 \n\n18\n\n<!-- p.19 -->\n### 樂行童軍獎章及貝登堡獎章考驗項目 \n\n#### 簡介： \n\n兩項獎章的考驗由 7 個項目組成，分別為「準領袖培訓」、「童軍技能」、「服務」、「國 際視野」、 「興趣及技能」、「身心健康」及「挑戰」。樂行童軍可同時進行這 7 項考驗， 當完成其中任何 4 項後，成員可獲頒發「樂行童軍獎章」；而在完成所有考驗後，可獲 頒發「貝登堡獎章」。 \n\n#### 考覈流程： \n\n樂行童軍須自行計劃其考驗內容和進程，並於展開考驗前提交「樂行童軍獎章及貝登 堡獎章考驗申請」予所屬總部總監（樂行童軍）作批覈，除另有註明外，所有考驗項 目必須於「考驗申請」批覈後完成。 \n\n#### **1)** 樂行童軍獎章 \n\n樂行童軍獎章是由所屬團長負責安排訓練及由所屬總部總監（樂行童軍）負責考覈， 樂行童軍在完成 7 項考驗的其中 4 項後，經區會確認及推薦，地域審批，總會確認 及簽發獎章證書。 \n\n#### **2)** 貝登堡獎章 \n\n貝登堡獎章是由所屬團長負責安排訓練及由所屬總部總監（樂行童軍）負責考覈， 樂行童軍在完成全部 7 個項目後，經區總監及地域總監接見及推薦，總會審批及簽 發獎章證書。 \n\n19\n\n<!-- p.20 -->\n### 準領袖培訓 \n\n簡介： \n\n透過「木章訓練系統」及「童軍旅服務經驗」，讓成員具備成為「準領袖」所需的能力， 為他們將來擔任童軍領袖做好充分準備。 \n\n內容： \n\n完成下列各項： \n\n1. 完成木章訓練系統第一階段 - 【童軍運動基本原則訓練班（單元 1A 及單元 1B）】 或同等項目。 \n\n2. 完成木章訓練系統第二階段 - 【支部訓練方法訓練班（單元 2A 及單元 2B）及「在 職輔導」】或同等項目；或服務一個童軍旅，而該服務為期必須不少於 12 個月及合 共服務時數最少為 52 小時。 \n\n#### 備註： \n\n1. 若樂行童軍於開展此項考驗前已完成【木章訓練系統】的任何部分，相關完成部分 將予以追認。 \n\n2. 完成木章訓練第 2 階段或同等項目的樂行童軍，可佩戴「基維爾巾圈」。 \n\n20\n\n<!-- p.21 -->\n### 童軍技能 \n\n簡介： \n\n讓成員至少掌握一項傳統童軍技能，同時要求成員完成一個教練員或導師訓練班及對 步操禮儀有基本認識，以裝備成員未來能有效地將所學知識、技能及童軍禮儀傳授給 其他童軍成員，從而達到傳承童軍知識及文化的效果。 \n\n內容： \n\n完成下列各項： \n\n1. 完成以下任何一個「傳統童軍技能」訓練班，或同等資歷： (i) 領袖遠足訓練班； \n\n   - (ii) 領袖營藝訓練班；或 (iii) 領袖先鋒工程訓練班。 \n\n2. 完成一個於青少年活動署網頁中列出的教練員或導師訓練班。 \n\n3. 完成「隊列訓練工作坊」及以下其中一個訓練班： (i) 基本禮儀及步操訓練班；或 (ii) 步操基本訓練班。 \n\n備註： \n\n1. 若樂行童軍於展開此項考驗前已取得所有「傳統童軍技能」訓練班或同等資歷；或 因合理原因而未能完成「傳統童軍技能」訓練班，則可以以完成一個木章訓練系統 所列出的其他「領袖技能訓練班」進行項目 (1) 之考驗，然而，該訓練班不能為 「急救證書課程」、「繩結訓練班」及「地圖閱讀訓練班」。 \n\n2. 若樂行童軍於開展此項考驗前已完成項目 (3) 之任何部分，相關完成部分將予以追 認。 \n\n3. 若樂行童軍在過往已完成「童軍步操基本訓練班」，則可視作已完成項目 (3) 中的 「步操基本訓練班」。 \n\n21\n\n<!-- p.22 -->\n### 服務 \n\n簡介： \n\n讓成員具備基本的急救能力，使他們能在緊急情況下自救並協助他人。同時要求成員 完成「寰宇童軍計劃『探索』課程」，以促使成員深入瞭解全球面臨的挑戰和社區需求， 並意識到自身對社會的影響力，進一步籌劃和執行服務項目，最終達到改善社區乃至 全球的目標。 \n\n內容： \n\n完成下列各項： \n\n1. 持有有效的本會急救證書或其他根據香港法例第 509 章職業安全及健康條例的勞工 處認可的三十小時急救課程證書（遞交「貝登堡獎章」申請時仍須為有效）。 \n\n2. 完成「寰宇童軍計劃『探索』課程」。 \n\n3. 完成寰宇童軍計劃「自願服務」；或同等服務。 \n\n備註： \n\n1. 若樂行童軍於開展此項考驗前已完成項目 (2)，相關部分將予以追認。 \n\n2. 項目 (3) 必須於展開此項考驗後完成。 \n\n22\n\n<!-- p.23 -->\n### 國際視野 \n\n#### 簡介： \n\n透過參與國際交流活動，擴闊成員的國際視野；並鼓勵文化交流，以培養成員的全球 公民意識，使其成為具責任感的全球公民。同時，通過分享環節，成員可以反思所學， 並將寶貴的經驗傳遞給其他成員。 \n\n#### 內容： \n\n完成「甲」或「乙」項： \n\n甲）日常交流 \n\n選擇一項在校園、辦公室或／及工作的地方，或團體活動中，與不同國籍種族人 士交流、合作，並透過日常生活、學業、工作及社交的經歷進行為期不少於 6 個 月的探討或研究，並於完成此項作一次分享，分享形式由成員與所屬總部總監 （樂行童軍）商討後制定。 \n\n#### 乙）國際交流活動 \n\n參與一次不少於五日四夜的國際交流活動，並於完成此項活動後作一次分享，分 享形式由成員與所屬總部總監（樂行童軍）商討後制定。 \n\n以下為完成國際視野項目的其中一些例子： \n\n- ⚫ 參與世界童軍大露營 \n\n- ⚫ 參與世界樂行童軍大會 \n\n- ⚫ 參與世界童軍會議 \n\n- ⚫ 參與亞太區童軍青年論壇 \n\n- ⚫ 參與童軍旅的交流團 \n\n- ⚫ 參與國際／亞洲青少年交流計劃 \n\n- ⚫ 參與「一帶一路」國家交流團 \n\n#### 備註： \n\n1. 所參與的國際交流活動地點建議為境外，即海外或內地；該活動亦必須包含「國際 交流」元素。 \n\n2. 該國際交流活動包括但不限於童軍交流活動。 \n\n3. 純屬旅遊的活動不能視作此項的國際交流活動。 \n\n23\n\n<!-- p.24 -->\n### 興趣及技能 \n\n簡介： \n\n鼓勵成員深入探索及發展一項個人興趣或技能，並透過持續的參與和努力，不斷提升 自身的能力和知識水平，從而培養自我成長和終身學習的態度。 \n\n內容： \n\n完成以下項目： \n\n選擇一項非體育之活動、興趣或技能，並於不少於 12 個月內，持續進修或／及參與該 項目不少於 52 小時；而在該 12 個月內，樂行童軍成員須於該項目上表現有所進步， 例如達致更深入的認識或掌握適度的技巧等。 \n\n以下為非體育之活動、興趣或技能的其中一些例子： \n\n- ⚫ 無人機駕駛 \n\n- ⚫ 繩索行動技術應用 \n\n- ⚫ 生成式人工智能設計或／及應用 \n\n- ⚫ 機器人設計或／及實戰 \n\n- ⚫ 電競 \n\n- ⚫ 賽車 \n\n- ⚫ 越野電單車 \n\n- ⚫ 占星 \n\n- ⚫ 化妝 \n\n- ⚫ 歌劇 \n\n- ⚫ 三維列印 \n\n- ⚫ 業餘無線電 \n\n- ⚫ 卡牌遊戲 \n\n- ⚫ 咖啡沖泡或／及拉花 \n\n- ⚫ 品酒或／及調酒 \n\n- ⚫ 文化／經濟／歷史／科技研究（如：內蒙古草原文化、大灣區經濟、西安 歷史、國家航天科技等） \n\n24\n\n<!-- p.25 -->\n### 身心健康 \n\n#### 簡介： \n\n透過參與精神健康相關的培訓與服務，以及持續的體育運動，促進成員的身心健康， 及培養健康的生活方式和個人成長。同時，成員透過投入精神健康相關的服務，也能 有效地推廣精神健康意識，並彰顯樂行童軍「服務」的精神。 \n\n#### 內容： \n\n完成下列各項： \n\n1. 完成一項或多項「SOUL Keeper 精神健康守護者計劃」證書或／及與精神健康相關 的證書或課程，並進行不少於 10 小時的相關服務，而所有訓練及服務的合共時數 須為 50 小時或以上。 \n\n2. 學習或／及參與一項體育運動，持續時間不少於 12 個月，累積時數不少於 52 小時； 期間樂行童軍成員應於該項體育運動的表現出持續進步。 \n\n#### 以下為體育運動的其中一些例子： \n\n- ⚫ 特技直排輪 \n\n- ⚫ 花式單車 \n\n- ⚫ 花式滑板 \n\n- ⚫ 街舞 \n\n- ⚫ 衝浪 \n\n- ⚫ 滑雪 \n\n- ⚫ 溜冰 \n\n- ⚫ 攀巖 \n\n- ⚫ 健美運動 \n\n- ⚫ 拯溺（如：沙灘救生、獨木舟拯救、水肺潛水拯救等） \n\n#### 備註： \n\n1. 與精神健康相關的證書或課程可屬「預防層面」、「急救層面」或同時涉及這兩項層 面。「預防層面」是指認識及推廣精神健康概念；而「急救層面」則指辨識精神健 康問題及提供協助。 \n\n2. 若樂行童軍於開展項目 (1) 考驗前已完成有關證書或課程，相關證書或課程的資歷 及課程時數將予以追認，成員只須完成扣除課程時數後的餘下服務時數或要求內所 指的不少於 10 小時的相關服務（以較高時數者為準），而該等服務必須在開展此項 考驗後進行。 \n\n25\n\n<!-- p.26 -->\n### 挑戰 \n\n簡介： \n\n鼓勵成員勇於接受新挑戰，從中培養堅毅不屈的精神與團隊合作能力，達致個人成長。 \n\n內容： \n\n完成「甲」或「乙」項： \n\n甲）野外挑戰 \n\n與其他樂行童軍或深資童軍進行一次 3 日 2 夜或以上之徒步遠足旅程。樂行童軍 須於旅程前後提交遠足計劃書、遠足報告書及事工報告書。另樂行童軍在遠足旅 程考驗開始前必須已完成認可之遠足訓練。 \n\n方法： \n\n以 3 至 6 人為 1 小隊，如小隊包括男女成員，必須為男女各最少 2 名，惟所有參 與成員必須從未進行過 3 日 2 夜之遠足旅程考覈（包括旅程事工）。成員必須在 3 日 2 夜的旅程中，最少有 21 小時進行與考覈相關的活動，包括但不限於：行進過 程、進行旅程目的、營藝工作、煮食之時間以及事工等（若進行 3 日 2 夜以上之 旅程，該總參與時數須有所提升，幅度由相關審核員制定）。各成員須於旅程中擔 任重要工作，並共同完成 2 項事工。考驗必須根據有關指引，由總會認可之遠足 審核員或高級遠足審核員負責。 \n\n26\n\n<!-- p.27 -->\n- 乙）個人挑戰 \n\n完成一些從未在過往完成而具挑戰性的活動，挑戰自我。 \n\n方法： \n\n「個人挑戰」項目內容因人而異，樂行童軍應自我選擇具挑戰性的活動去實行。 \n\n以下為完成個人挑戰項目的其中一些例子： \n\n- ⚫ 完成渡海泳 \n\n- ⚫ 完成三項鐵人比賽 \n\n- ⚫ 完成馬拉松項目 \n\n- ⚫ 進行單車遠足旅程 \n\n- ⚫ 進行海外遠足旅程 \n\n- ⚫ 考取香港青年獎勵計劃金章級野外鍛鍊科 \n\n- ⚫ 考取飛行章 \n\n- ⚫ 考取跳傘章 \n\n- ⚫ 完成 1 次具挑戰性的慈善步行或類似活動，例如「樂施會毅行者」等 \n\n#### 備註： \n\n1. 有關認可之遠足訓練，請以總會公佈最新之通告為準。 \n\n2. 如樂行童軍在過往未曾完成與「野外挑戰」內容一致或程度更高的挑戰，則必須以 「野外挑戰」選項來完成本考驗。反之，如樂行童軍在過往曾完成與「野外挑戰」 內容一致或程度更高的挑戰，則必須以「個人挑戰」來完成本考驗，以鼓勵樂行童 軍勇於接受新挑戰。 \n\n3. 就上述備註 (2) 之條款，若有關成員因合理原因而未能以「野外挑戰」完成本考驗， 則可透過所屬總部總監（樂行童軍）向青少年活動署申請以「個人挑戰」完成本考 驗。 \n\n27\n\n<!-- p.28 -->\n## 第三章：世界童軍組織推出的徽章 \n\n世界童軍組織設有各種其他徽章，可讓樂行童軍按個別需要及興趣考取。 以下為樂行童軍可考取及佩戴的徽章： \n\n- 寰宇童軍章 \n\n- 地球部落徽章 \n\n- 童軍世界遺產章 \n\n28\n\n<!-- p.29 -->\n### 寰宇童軍章 \n\n凡完成「世界童軍組織」寰宇童軍計劃之樂行童軍成員，可在其制服上佩戴「寰宇童 軍章」。 \n\n寰宇童軍計劃背景： \n\n寰宇童軍計劃依據世界童軍組織的「發展青年羣族」(Adolescents)及「鼓勵青年參與決 策」(Youth Involvement)策略而制訂，希望透過計劃讓童軍成員及非童軍青年，以十七 項「可持續發展目標」(The Sustainable Development Goals)， 共同應付世界面對的三大 挑戰，包括「發展社會」、「促進和平」及「保護環境」。 \n\n#### 目標： \n\n希望參加者透過思考、探索及反思等過程，理解世界問題，並擬定出一個自願的服務 計劃，以改善相關問題及狀況，成為一個關心地球生態和人類福祉的公民。 \n\n計劃內容： \n\n1. 計劃分為「探索」（The Scouts of the World－Discovery）及「自願服務」（The Scouts of the World－Voluntary Service）兩部份，參加者必須全期出席「探索」 活動，並自行組織行動小組進行「自願服務」。 \n\n2. 所有項目必須按「世界童軍組織」所訂明之內容進行，計劃詳情可從世界童軍 組織相關網頁下載。中文版之參考及撮要內容可從香港童軍總會網頁下載。 \n\n活動： \n\n「探索」－ 參與一個由總會青少年活動署認可的寰宇童軍計劃「探索」課程； \n\n- 「自願服務」－ 由參加者所組成之行動小組自行協商，進行為期最少相等於 14 天全職 工作的服務。 \n\n29\n\n<!-- p.30 -->\n### 地球部落徽章 \n\n地球部落徽章 \n\n走塑達人挑戰徽章 \n\n自然守護者挑戰徽章 \n\n日光善用者挑戰徽章 \n\n世界童軍組織於 2020 年 6 月推出「地球部落 (Earth Tribe)」，作為一項全球性的環境保 育計劃，目標在於促進青少年參與地球保護工作。該計劃包含三項主要挑戰：「走塑達 人挑戰」(Plastic Tide Turners Challenge)、「自然守護者挑戰」(Champions for Nature Challenge)及「日光善用者挑戰」(Scouts Go Solar Challenge)，旨在鼓勵青少年養成可 持續發展消費行為並實踐健康環保的生活方式。計劃重點包括加強與大自然的聯繫、 保育生物多樣性、推廣潔淨能源的選擇，同時恢復水陸生態系統，以預防環境污染。 地球部落邀請全球青少年共同推動生態保護，確保地球長遠的可持續發展。本計劃強 調青少年主導，著重於環境與可持續發展議題的實際解決，並藉由「部落」概念強化 團隊學習、支持及協作精神。 \n\n日光善用者挑戰、走塑達人挑戰、 自然守護者挑戰均為地球部落計劃的一部份，因此， 凡考獲地球部落計劃任何一個挑戰之支部成員，均已成為地球部落一員。 \n\n成員應佩戴地球部落徽章及最少其中一項挑戰徽章，而成員晉升至下一支部時，須重 新按要求完成相關挑戰（樂行童軍除外）。 \n\n有關如何完成地球部落徽章，可參考「地球部落」之網頁。 \n\n30\n\n<!-- p.31 -->\n### 童軍世界遺產章 \n\n凡於聯合國教科文組織認可之世界遺產內進行「寰宇童軍章」之「自願服務」的成員， 當其考獲「寰宇童軍章」時，將同時獲頒「童軍世界遺產章」，並可佩戴其於制服上。 如希望獲得更多相關資料，可參閱世界童軍組織「童軍世界遺產章」網頁。 \n\n31\n\n<!-- p.32 -->\n## 第四章：其他獎章及徽章 \n\n樂行童軍設有各種其他獎章及徽章，可讓樂行童軍按個別需要及興趣考取。 以下為樂行童軍可考取及佩戴的獎章及徽章： \n\n- 急救章 \n\n- 童軍拯溺布章 \n\n- 高級空勤員章 及 舵手章 \n\n- 飛行章 及 跳傘章 \n\n- 「積極公民」獎章系列 \n\n- 樂行童軍社區參與章 \n\n- 樂行童軍宗教章 \n\n- 公教章 \n\n- 香港青年獎勵計劃金章／銀章 \n\n32\n\n<!-- p.33 -->\n### 急救章 \n\n凡獲取本會急救證書或其他根據香港法例第 509 章職業安全及健康條例的勞工處認可 的三十小時急救課程證書者，可在證書有效期內佩戴此專章。 \n\n<!-- Start of picture text -->\n33<br><!-- End of picture text -->\n\n<!-- p.34 -->\n### 童軍拯溺布章 \n\n凡考獲中國香港拯溺總會拯溺資格的樂行童軍支部成員，可佩戴童軍拯溺布章於制服 上。 \n\n備註： \n\n有關課程內容，可參閱總會之公佈。 \n\n34\n\n<!-- p.35 -->\n### 高級空勤員章 及 舵手章 \n\n高級空勤員章 \n\n舵手章 \n\n完成「高級空勤員章」及／或「舵手章」的樂行童軍支部成員可佩戴相對的活動徽章 於制服上。 \n\n備註： \n\n有關課程內容，可參閱總會之公佈。 \n\n35\n\n<!-- p.36 -->\n### 飛行章 及 跳傘章 \n\n飛行章 跳傘章 \n\n完成「飛行章」或「跳傘章」的樂行童軍支部成員可佩戴相對的活動徽章於制服上， 惟飛行章及跳傘章不可同時佩戴於制服上。 \n\n備註： \n\n有關課程內容，可參閱總會之公佈。 \n\n36\n\n<!-- p.37 -->\n### 「積極公民」獎章系列 \n\n防騙先鋒章 \n\n保護兒童章 \n\n禁毒章 社區應急先鋒章 \n\n環保先鋒章 \n\n世界童軍組織通過不同方式推動積極公民教育，培養青少年的社會責任感、領導能力 和個人成長。香港童軍總會同時致力於培養青少年的公民意識和社會責任感。為此， 我們特別推出了「積極公民」獎章系列，透過一系列挑戰，激勵童軍成員積極參與社 會事務，發展他們的領導能力和團隊合作能力。 \n\n「積極公民」獎章系列旨在透過實踐公民責任、參與社會服務計劃、發展領導能力等 活動，培養青少年成為具有良好道德、知識和技能的積極公民，能夠積極服務社會， 為社會的進步和發展作出貢獻。 \n\n有關如何完成「積極公民」獎章，可參考「積極公民獎章系列」之網頁。 \n\n37\n\n<!-- p.38 -->\n### 樂行童軍社區參與章 \n\n社會變遷對青少年有重要的影響，要在社會中發揮所長，必須追求新知識，學習適當 技能，培養正確態度，更要認識自己周遭的世界，貢獻自己的力量。樂行童軍「社區 參與章」計劃旨在培養助人的精神，並鼓勵多關心周圍的事物，透過個人或集體力量， 用行動參與社區事務，透過社區教育、發展及服務模式，主動瞭解社會上的各種需要， 認識與生活息息相關的政策，培養公民責任感，幫助建立一個有進步及互相關懷的社 會。 \n\n課程大綱： \n\n計劃分別由甲部的專題研習班及乙部的實習部分所組成，而專題研習班設有下列七個 課題，包括： \n\n- （一）環境清潔及衛生 \n\n- （二）肅貪倡廉 \n\n- （三）撲滅罪行 \n\n- （四）藥物教育 \n\n- （五）平等機會 \n\n- （六）愛滋病預防教育 \n\n- （七）尊重知識產權 \n\n38\n\n<!-- p.39 -->\n參加者必須於 6 個月內完成下列各項： \n\n- （甲）完成總會認許專題研習班（可選一項或多項課題），並能： \n\n   1. 述說所選課題的相關知識、列舉應有的技巧及態度； \n\n   2. 闡述社區參與的意義、模式及方法；及 \n\n   3. 述說如何有效策劃及組織社區參與活動。 \n\n- （乙）完成研習班中所選課題的實習部分，並完成下列各項要求： \n\n   1. 完成專題研習班中所選課題的個人紀錄冊，蒐集相關資料以加強其內容，並附 加個人評論； \n\n   2. 以小組形式完成一份由班領導人指定之專題研習，於班內或公開發佈及討論， 並呈交研究報告書；及 \n\n   3. 在班領導人同意下，以小組形式協助推行一項由香港特別行政區政府（或政府 註冊的社會服務機構）所舉辦的活動；或以小組形式自行組織、策劃及推行一 項社區服務，並須呈交活動計劃書及活動報告書予審核員審批。 \n\n39\n\n<!-- p.40 -->\n### 樂行童軍宗教章 \n\n樂行童軍可選擇下列其中一項宗教課程進行研習，考覈可由樂行童軍團長自行安排適 合人士協助，如法師、牧師、神職人員、主日學導師等。有關購買及簽發方法請參閱 相關通告。 \n\n天主教 \n\n1. 認識： \n\n   - 1.1 擁有《聖經》及明白《聖經》之組成。 \n\n   - 1.2 誦念玫瑰經（二十端）。 \n\n   - 1.3 認識教會的年曆。 \n\n   - 1.4 簡述七件聖事的意義。 \n\n   - 1.5 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - 2.1 參與一個善會（堂區性或教區性教友組織）的活動，並作文述報告。 \n\n   - 2.2 參加教區性或堂區性慶典或福傳活動，並作文述報告。 \n\n3. 服務： \n\n   - 3.1 明白祈禱的方法及意義，並在團集會／童軍活動中帶領祈禱。 \n\n   - 3.2 指導團員參與感恩祭。 \n\n   - 3.3 教導一位幼童軍／童軍／深資童軍考取宗教章（天主教課程）。 \n\n   - 3.4 選擇一項有關天主教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（天主教課程）者只須補回第 2.2 及 3.4 項以考取樂行童軍宗 教章。 \n\n40\n\n<!-- p.41 -->\n基督教 \n\n1. 認識： \n\n   - 1.1 擁有《聖經》新舊約全書。 \n\n   - 1.2 誦念主禱文及使徒信經，並解釋其意義。 \n\n   - 1.3 唱聖詩七首（自選）。 \n\n   - 1.4 敘述聖經故事六則。舊約三則，包括出埃及記故事；新約三則，包括耶穌被 釘十字架的故事。 \n\n   - 1.5 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - 2.1 參與教會活動，如主日崇拜、青年團契或詩班等，並作文述報告。 \n\n3. 服務： \n\n   - 3.1 明白十字架的意義，並領導小組進行研討。 \n\n   - 3.2 使用《聖經》，並在團集會／童軍活動中講解耶穌「道成肉身」救贖的意義 及引述有關經文。 \n\n   - 3.3 在團集會／童軍活動中帶領祈禱。 \n\n   - 3.4 教導一位幼童軍／童軍／深資童軍考取宗教章（基督教課程）。 \n\n   - 3.5 選擇一項有關基督教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（基督教課程）者只須補回第 3.5 項以考取樂行童軍宗教章。 \n\n41\n\n<!-- p.42 -->\n伊斯蘭教 \n\n1. 認識： \n\n   - 1.1 擁有中文版的《古蘭經》。 \n\n   - 1.2 閱讀《古蘭經》第一章，並解釋其意義。 \n\n   - 1.3 明白「萬物非主，惟有真主，穆罕默德，是主差使」的意義。 \n\n   - 1.4 解釋做禮拜的動作及意義。 \n\n   - 1.5 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - 2.1 參與伊斯蘭教團體之活動，並作文述報告。 \n\n   - 2.2 參觀清真寺或伊斯蘭機構，並作文述報告。 \n\n3. 服務： \n\n   - 3.1 教導一位幼童軍／童軍／深資童軍考取宗教章（伊斯蘭教課程）。 \n\n   - 3.2 選擇一項有關伊斯蘭教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（伊斯蘭教課程）者只須補回第 2.1 、2.2 及 3.2 項以考取樂 行童軍宗教章。 \n\n42\n\n<!-- p.43 -->\n#### 孔教 \n\n1. 認識： \n\n   - 1.1 認識並尊重中國傳統文化和儒教思想。 \n\n   - 1.2 誦念及明白《禮運．大同》和《孟子經訓》。 \n\n   - 1.3 說出《四書》、《五經》、《六藝》、《八德》的名目。 \n\n   - 1.4 唱《孔聖頌》及明白其意義。 \n\n   - 1.5 在《論語》中摘出章句五則，並解釋其意義。 \n\n   - 1.6 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - 2.1 每年拜祭祖先、天地。 \n\n   - 2.2 參與孔聖誕、孟子誕辰典禮或傳統祭禮，認識和遵守有關禮儀。 \n\n   - 2.3 參觀傳統廟宇、與孔教團體進行交流活動，並作文述報告。 \n\n   - 2.4 本著「老吾老以及人之老、幼吾幼以及人之幼」的精神，熱心參與服務社會 活動。 \n\n3. 服務： \n\n   - 3.1 認識《論語》的內容及其價值，並與他人分享心得。 \n\n   - 3.2 教導一位幼童軍／童軍／深資童軍考取宗教章（孔教課程）。 \n\n   - 3.3 選擇一項有關孔教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（孔教課程）者只須補回第 2.4 、3.1 及 3.3 項以考取樂行童 軍宗教章。 \n\n43\n\n<!-- p.44 -->\n#### 佛教 \n\n1. 認識： \n\n   - 1.1 擁有及誦念《佛經》和早晚《念誦儀規》。 \n\n   - 1.2 唱佛寶歌及明白其意義。 \n\n   - 1.3 講述佛教故事三則。 \n\n   - 1.4 解釋因果定義。 \n\n   - 1.5 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n   - 1.6 認識「皈依三寶」的意義。 \n\n2. 參與： \n\n   - 2.1 參與浴佛禮及佛教活動，並作文述報告。 \n\n   - 2.2 曾參與「皈依三寶」的儀式。 \n\n3. 服務： \n\n   - 3.1 領導佛教青少年團研討佛教教理。 \n\n   - 3.2 協助一位幼童軍／童軍／深資童軍皈依三寶。 \n\n   - 3.3 教導一位幼童軍／童軍／深資童軍考取宗教章（佛教課程）。 \n\n   - 3.4 選擇一項有關佛教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（佛教課程）者只須補回第 3.4 項以考取樂行童軍宗教章。 \n\n44\n\n<!-- p.45 -->\n道教 \n\n1. 認識： \n\n   - 1.1 擁有《道德經》，誦念並解釋其中五章的意義。 \n\n   - 1.2 誦念《太上道祖頌》及《太上老君說清靜經》，並解釋其意義。 \n\n   - 1.3 認識道教「呂祖百字碑」訓詞的意義。 \n\n   - 1.4 說出道教「三清」的名號。 \n\n   - 1.5 解釋「道家三寶」、「道德經第八章之七善」、「呂純陽祖師之九美德」 的 意義。 \n\n   - 1.6 解釋童軍誓詞內「對神明、盡責任」的意義。 \n\n2. 參與： \n\n   - 2.1 參觀兩間道教宮觀，並作文述報告。 \n\n3. 服務： \n\n   - 3.1 在團集會／童軍活動中講述道祖生平故事或其他一位仙師的故事。 \n\n   - 3.2 教導一位幼童軍／童軍／深資童軍考取宗教章（道教課程）。 \n\n   - 3.3 選擇一項有關道教的課題以進行研習，並向團員分享心得。 \n\n備註： \n\n持深資童軍宗教章（道教課程）者只須補回第 1.2 及 3.3 項以考取樂行童軍宗教 章。 \n\n備註： \n\n公教章的佩戴位置與宗教章相同，二者只可選擇其一佩戴。 \n\n45\n\n<!-- p.46 -->\n### 公教章 \n\n只供已領洗之天主教童軍成員在制服上佩戴，詳情請與公教童軍及女童軍協會查詢。 （電郵地址：info@catholicscout.org.hk） \n\n備註： \n\n公教章的佩戴位置與宗教章相同，二者只可選擇其一佩戴。 \n\n46\n\n<!-- p.47 -->\n### 香港青年獎勵計劃金章／銀章 \n\n凡完成香港青年獎勵計劃金章／銀章之樂行童軍成員，可在其制服上佩戴香港青年獎 勵計劃金章或銀章，如樂行童軍同時持有兩者，則只能佩戴最高級別的金章。 \n\n樂行童軍在進行樂行童軍獎章及貝登堡獎章考驗時，可考慮項目的性質，以便同時簽 發香港青年獎勵計劃的相關科目。 \n\n有關如何以樂行童軍身份參加香港青年獎勵計劃，可參考「香港青年獎勵計劃－香港 童軍總會執行處」之網頁。 \n\n47\n\n<!-- p.48 -->\n## 第五章：徽章簽發 **/** 領取 **/** 購買 \n\n### 徽章簽發 \n\n#### 獲授權簽發各級徽章單位及人士對照表 \n\n|徽章名稱|簽發單位|簽發人士|\n|---|---|---|\n|會員章|樂行童軍團|樂行童軍團長|\n|樂行童軍肩章|童軍區|區總監；<br>助理區總監（樂行童軍）；<br>樂行童軍區長 |\n|寰宇童軍章<br>童軍世界遺產章<br>地球部落徽章|在童軍物品供應社發售，購買時須出示<br>由獲授權人士簽署及蓋上獲授權單位印<br>章之相關證書正本。|\n|高級空勤員章||\n|舵手章||\n|飛行章 及 跳傘章<br>「積極公民」獎章系列<br>樂行童軍社區參與章<br>樂行童軍宗教章<br>公教章||\n|急救章|在童軍物品供應社發售，購買時須出示<br>有效急救課程證書及有效樂行童軍紀錄<br>冊。|\n|童軍拯溺布章|在童軍物品供應社發售，購買時須出示<br>由香港拯溺總會發出之有效拯溺銅章或<br>以上級別之證書正本及樂行童軍紀錄<br>冊。|\n\n52\n\n<!-- p.53 -->\n金紫荊獎章標誌 在童軍物品供應社發售，購買時須出示 金紫荊獎章／總領袖獎章／榮譽童軍獎 總領袖獎章標誌 章證書副本， 每次可購買獎章標誌 3 榮譽童軍獎章標誌 枚。 香港青年獎勵計劃獎章（金／銀章） 由青少年活動署送贈，童軍物品供應社 代為派發，領取時須出示由地域發出之 恭賀信正本及有效樂行童軍紀錄冊。 \n\n53\n\n<!-- p.54 -->\n## 第六章：典禮與儀式 \n\n### 樂行童軍宣誓儀式 \n\n#### 簡介： \n\n傳統的典禮與儀式，在童軍運動中甚受重視，但因時代的進展，現今的宣誓儀式與時 並進，令儀式簡單而莊重。以下是根據傳統樂行童軍宣誓儀式修訂的流程，供童軍旅 參考。然而，童軍旅可因應實際情況、成員的宗教信仰、童軍旅傳統等因素作出改動， 唯須確保宣誓儀式莊重以彰顯儀式的意義和承諾的重要性。 \n\n#### 儀式流程： \n\n兩名樂行童軍成員擔任協助人，協助宣誓者瞭解樂行童軍支部的精神。宣誓者在宣誓 前數日，應在一處清靜的地方靜修（Vigil），期間自我反省，並瞭解參與樂行童軍的意 義。 \n\n樂行童軍宣誓儀式建議在黃昏及戶外舉行。宣誓者需要單獨在一處地方靜候。開始前， 兩名協助人前往宣誓者獨處的地方，帶領他進入會場，並向其他人介紹他。團長會說 出宣誓者的名稱，並向其他成員發問是否接納其為成員，接納後，全團會離開會場前 往宣誓地點。當全團離開後，協助人會把一支引火棒交給宣誓者，然後帶著宣誓者一 同前往宣誓場地。 \n\n宣誓場地會放置一張枱，枱上放置一面聖佐治十字旗、銅燭臺連未燃點的蠟燭、聖經 （翻至十誡的那一頁）、少年警探（翻至童軍規律的那一頁）、祈禱經書、樂行童軍肩 膊色帶及騎士之劍。枱的右前方另放一張小枱，小枱上放一壺清水、一個銅盤及一塊 白色抹布。 \n\n儀式開始時，協助人在兩旁引領手持引火棒的宣誓者走到宣誓臺前方，面對團長。 \n\n協助人︰ 「我們現在推薦（宣誓者名稱）宣誓為一名樂行童軍，他已經受過考 驗，能夠成為本團的一份子。」 \n\n團長︰ 「你是否有意成為一個樂行童軍。」 \n\n宣誓者︰ 「是。」 \n\n團長︰ 「（宣誓者名稱），你帶了燃著的引火棒前來，象徵你願意和其他樂行童 軍一起服務，加添你的火種，減少世界黑暗，你用它點蠟燭。」 \n\n- （宣誓者用引火棒燃點蠟燭，然後把引火棒交給協助人，協助人熄滅引 火棒，然後放在枱上。） \n\n團長︰ 「雖然經過許多艱辛，你是否仍然決意竭盡所能，做一個有信用、眞誠 和正直的人，言行純潔？」 \n\n54\n\n<!-- p.55 -->\n- 宣誓者︰ 「是。」 \n\n- 團長︰ 「你曾否靜修過，並細心思量過你的未來生活？」 \n\n- 宣誓者︰ 「有。」 \n\n- 團長︰ 「你是否明白服務是自願的，作好準備，體諒他人的需要，竭盡所能， 隨時隨地去幫助他人，不計較得失和不望報酬？」 \n\n- 宣誓者︰ 「明白。」 \n\n- 團長︰ 「你是否知道當你成為一個樂行童軍後，我們是期望你能在這個四海一 家的童軍運動中，發揮你的理想，遵守童軍規律和履行服務他人的義 務？」 \n\n- 宣誓者︰ 「知道。」 \n\n- 團長︰ 「在古時，在矢志成為騎士前，會先用水清洗，象徵洗除過往所有不良 的行為，同時亦表示下定決心清除污穢，成為一個純潔和清新的人。你 是否願意在我們面前清洗，表示你的決心？」 \n\n- 宣誓者︰ 「願意。」 \n\n   - （將雙手放在盆內，一名協助人提起水壺倒水給他洗手，另一名協助人 給他遞抹布抹乾雙手。） \n\n- 團長︰ 「你現在留心古代騎士戒條中所定的德行，這亦是真正樂行童軍要做到 的。因此你應在日常生活中實踐這些德行，因為這些行為都是成為良好 公民的基礎。 \n\n   1. 對神明盡責任 — 真義，使騎士敬畏神和全力維護正義 \n\n   2. 盡忠 — 效忠國家，勇敢保衛家園。 \n\n   3. 助人— 鋤強扶弱，幫助需要的人。 \n\n   4. 友愛— 重情義。 \n\n   5. 擇友— 選賢為友。 \n\n   6. 寬宏— 常記本身缺點，寬恕他人。 \n\n   7. 勤勞— 善用光陰，勤力工作，不要疏懶。 \n\n   8. 容忍— 凡事寬容，心平氣和。 \n\n   9. 謙遜— 不胡扯，不胡言。 \n\n   10. 正直公平— 不見利忘義，言行公正。」 \n\n55\n\n<!-- p.56 -->\n- 團長︰ 「雖然人性脆弱，但樂行童軍任重道遠，請你在神前跪下，祈求神賜給 你力量，去實現你的理想。」 \n\n   - （宣誓者雙膝下跪，雙手按祈禱經書，團長朗讀騎士經文。） \n\n- 團長︰ 「全能上蒼，願禰眷顧勇敢的人，開啟他的心靈，燃亮他求知的火焰， 服務他人。請聆聽我們的禱告，幫助我們，啟導他去求知，教導他去思 考，謙遜待人，指導他作出準備，為貧困無依的人服務，接受意見，保 持心境開朗，當世界毀滅時，他能回到禰的身旁，共享和平和榮耀。阿 門。」 \n\n   - （宣誓者起立。） \n\n- 團長： 「既然你已明白上述各點，我請你立誓，在立誓時你要記着你已不是孩 童，而是一個成人。你將以成年人的身份去實踐誓言。」 \n\n   - （宣誓者行前，同時，一位協助人持團旗行前，在宣誓者的左邊，將旗 橫降在團長與宣誓者之間，宣誓者左手放在團旗上，右手舉高作宣誓 禮，另一位協助人手執旅旗在枱右方，及團長背後站立。） \n\n   - （宣誓者跟從團長誦念童軍誓詞） \n\n   - （誦念童軍誓詞後，持團旗之協助人把團旗還原至直立位置，並示意宣 誓者以右膝單膝跪下，團長用劍輕拍宣誓者右肩，然後輕拍左肩。） \n\n- 團長： 「我相信你能竭盡所能實踐誓言，如古時騎士一樣，我輕拍你是提醒你 一件重要的東西 — 名譽，名譽沾上污點會很快浮現和歴久不消。」 （團長上前扶起宣誓者，在協助人的協助下，為宣誓者配戴會員章、旅 巾及童軍帽，並將樂行童軍肩膊色帶扣上宣誓者的左膊，同時勉勵宣誓 者。） \n\n- 團長： 「色帶上有橙、黃、綠、棗紅、深藍五色，是五個支部的顏色，即是時 常提醒你要盡忠職守，為年青的童軍服務，並以身作則，為他們樹立好 榜樣。」 \n\n- 團長： 「儀式在此結束，全團站立並除下童軍帽，唸樂行童軍禱文： 憑藉公義精神，減除苦困，尋求完美。啊！上主、祈求禰引導我們，為 禰服務，以盡己任，全心奉獻，不問代價；努力奮鬥，不顧苦痛；默默 耕耘，不會休止；勤勞工作，不計報酬；但願禰能帶領我們完成使命。 阿們。」 \n\n- 宣誓後，宣誓者與協助人返回營火地方，其他團員上前向他致意。 \n\n56\n\n<!-- p.57 -->\n## 附錄 \n\n### 樂行童軍啟導班課程概要 \n\n#### 目的： \n\n樂行童軍啟導班是樂行童軍肩章內的選擇項目，定位為樂行童軍生涯的開始。旨在透 過啟導班課程讓樂行童軍對所屬支部及訓練綱要有基本的認識，引領成員體會及明白 樂行童軍精神；以活動形式讓他們體驗童軍生活、學習基本童軍技能，並作為平臺讓 不同背景的樂行童軍互相交流。 \n\n#### 對象： \n\n1. 樂行童軍； \n\n2. 17 歲或以上之深資童軍；及 \n\n3. 18 歲或以上對樂行童軍有興趣之外界人士。 \n\n#### 內容： \n\n建議安排一次渡宿活動，當中包括課節、活動及體驗，並涵蓋以下內容： \n\n1. 樂行童軍之歷史和沿革 \n\n2. 訓練目標 \n\n3. 團的組織架構和行政管理 \n\n4. 獎章制度 \n\n5. 樂行童軍技能學習 \n\n6. 樂行童軍活動體驗 \n\n7. 閱讀一本有關童軍運動的書籍，並與其他樂行童軍分享。建議讀物如下： \n\n   - ⚫ 童子警探 Scouting for Boys \n\n   - ⚫ 樂行成功之道 Rovering to Success \n\n   - ⚫ 樂行之道 \n\n   - ⚫ 森林故事 The Jungle Book \n\n   - ⚫ 香港童軍百年圖史 A Century of Hong Kong Scouting, an Illustrated History \n\n   - ⚫ Scouting in Hong Kong, 1910-2010 \n\n#### 樂行童軍技能學習及活動體驗範疇： \n\n1. 繩結 \n\n2. 露營活動 \n\n3. 先鋒工程 \n\n4. 輕便炊事 \n\n5. 救傷 \n\n6. 服務 \n\n7. 其他程度相若之樂行童軍活動 \n\n#### 開辦資格： \n\n樂行童軍啟導班可由總會、地域或區會開辦。 \n\n57\n\n<!-- p.58 -->\n### 全港樂行童軍錦標賽 \n\n#### 目的 \n\n全港樂行童軍錦標賽以童軍誓詞及規律為最高標準，透過一連串富趣味、具挑戰及有 意義的比賽項目，使樂行童軍運動更富吸引力，並提高本港樂行童軍成員的水準及甄 選全港最出色之樂行童軍團。 \n\n#### 比賽模式 \n\n全港樂行童軍錦標賽通常每三年舉辦一次，參賽隊伍以童軍旅作為參賽單位參與賽事， 賽事由多個項目組成，旨在全面考驗樂行童軍的綜合能力。 \n\n由於樂行童軍支部的銘言是「服務」，並且致力於培育未來的童軍領袖，因此「服務項 目」和「童軍技能」是每屆錦標賽的必然項目。此外，每屆賽事也會緊扣時代脈搏和 社會需求，加入不同富有樂趣、挑戰性且意義深遠的比賽項目，確保錦標賽既能激發 潛能，又能與時俱進。 \n\n#### 近年錦標賽標誌 \n\n2024 年 \n\n2018 年 \n\n<!-- Start of picture text -->\n2015 年<br><!-- End of picture text -->\n\n58\n\n<!-- p.59 -->\n## 鳴謝 \n\n此新修訂之樂行童軍訓練綱要得以面世，實有賴以下人士之鼎力幫助，謹此向他們致謝。 \n\n#### 支部訓練檢討委員會 \n\n黎偉生 香港總監 陳勇 副香港總監（活動與訓練） 吳家亮 副香港總監（常務） 陳狄安 助理香港總監（青少年活動） 盧沛霖 支部訓練檢討委員會召集人 張俊彥 副青少年活動總監（支部） 邵鈞泰 助理青少年活動總監（支部） \n\n#### 支部訓練檢討委員會 - 樂行童軍支部 \n\n吳文俊 （主席） 青少年活動署總部總監（樂行童軍） 朱均偉 九龍地域總部總監（樂行童軍） 鄭志偉 東九龍地域總部總監（樂行童軍） 曾建民 新界地域總部總監（樂行童軍） 邱雅怡 新界東地域總部總監（樂行童軍） 鄧皓駿 港島地域總部總監（樂行童軍） 李海權 青少年活動署助理總部總監（幼童軍） 蔡嘉俊 傳訊及公共事務署助理總部總監（童軍文物廊） 馮潤林 青少年活動署助理總部領袖 張恩澤 東九龍第1178 旅樂行童軍團長 羅晞彤 沙田西第19 旅童軍副團長 黎家浩 第十三屆樂行童軍議會主席 趙朗謙 第一屆青年事務諮議會委員 容諾行 第一屆青年事務諮議會委員 \n\n繪圖 \n\n張志恆 青少年活動署總部領袖 \n\n59\n\n<!-- p.60 ocr -->\n60\n\nVIRT | TUES\n\nROVERS\n\n香港童軍會 SCOUTASSOCIATIONOFHONGKONG\n\n香港九龍柯士甸道童軍徑香港童軍中心10樓 10/F,HongKongScoutCentre,ScoutPath, Austin Road,Kowloon,Hong Kong\n\n23773300 | 23021001 | www.scout.org.hk\n","02_支部訓練綱要/P022-26.md":"---\nsource_file: \"P022-26.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 12\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **2** 月 **1** 日 第 **22/2026** 號通告 [政策／指引 ] \n\n# 新修訂支部訓練綱要 \n\n# **Updates on Sectional Training Scheme** \n\n為確保香港童軍運動能與時並進，並切合不同年齡層成員的成長需要，總會於 2024 年 成立「支部檢討工作小組」，全面檢視各支部的年齡層分佈、發展方向及訓練架構，並就修 訂各支部訓練綱要展開系統性研究及規劃工作。 \n\n工作小組由具備豐富前線及策劃經驗的領袖組成，期間已完成各支部的年齡層建議及 發展特色定位，並進一步規劃各支部的訓練內容、過渡安排及銜接機制，以確保整個青少年 訓練體系具連貫性及發展階梯。童軍區、地域及青年事務諮議會亦就有關修訂提供寶貴意見， 以協助相關工作更切合青年發展需要。 \n\n經過整合各方意見，並於修訂訓練框架及經過諮詢程序後，小童軍活動指引及各支部 新修訂之訓練綱要經已完成。 \n\n### 一、更清晰支部定位 \n\n為加強各支部的發展焦點及教育特色，總會已確立以下核心理念： \n\n- 小童軍支部 ：認識自己・快樂同行 \n\n- 幼童軍支部 ：多元活動・探索求知 \n\n- 童軍支部 ：擁抱挑戰・建立團隊 \n\n- 深資童軍支部：自務自治・明日領袖 \n\n- 樂行童軍支部：服務為本・國際視野 \n\n有關定位將貫穿各支部的訓練內容、活動設計及獎章制度。 \n\n### 二、發布方式 \n\n已定稿的新修訂小童軍活動指引及各支部訓練綱要，已上載至總會網站所屬支部專屬 網頁，供家長、領袖及成員查閱及下載。請各單位領袖留意相關支部網頁的最新公佈。 \n\n### 三、生效日期 \n\n新修訂之小童軍活動指引及各支部訓練綱要將於 2026 年 8 月 15 日正式生效。\n\n<!-- p.2 -->\n### 四、過渡期安排 \n\n為配合新舊制度順利銜接，青少年活動署已制訂相關過渡期安排，詳情請參閱【附件 1】。 \n\n青少年活動署感謝所有參與檢討及修訂工作的各級總監、領袖、地域代表及青年事務 諮議會成員的寶貴意見與支持，期望新修訂之訓練內容能進一步提升香港童軍運動的教育質 素，引導青少年在不同成長階段培養正確價值觀、責任感及服務精神，裝備他們成為良好及 有為的公民。 \n\n如有查詢，請於辦公時間致電 2957 6411 或 2957 6417 與青少年活動署職員聯絡。 \n\n青少年活動總監 \n\n陳狄安\n\n<!-- p.3 -->\n【附件 1】 青少年活動署第 22/2026 號通告 （1/2/2026） \n\n<!-- Start of picture text -->\n更新<br><!-- End of picture text -->\n\n# 新修訂支部訓練綱要過渡期安排 \n\n為確保新修訂之各支部訓練綱要能順利推行，並讓現有成員及領袖有充足時間適 應新制度，青少年活動署制訂以下過渡期安排。相關安排旨在平衡新舊訓練制度之銜 接，確保成員的學習進程不受影響，同時維持童軍訓練一貫的進度性及公平性。各單 位須按照本附件所列的過渡安排，妥善規劃訓練及獎章考覈事宜。 \n\n### 小童軍支部 \n\n新修訂之《小童軍活動指引》將於 2026 年 8 月 15 日正式推行，現將執行細則及過渡安 排臚列如下： \n\n### **1.** 綱要下載 \n\n新《小童軍活動指引》已上載至小童軍支部網頁以供下載。 \n\n### **2.** 新版小童軍紀錄冊 \n\n新版小童軍紀錄冊預計將於 2026 年 8 月在香港童軍物品供應社發售。 \n\n### **3.  2026** 年 **8** 月 **15** 日或之後宣誓的小童軍成員 \n\n凡於 2026 年 8 月 15 日或之後宣誓之小童軍成員，必須按照新訓練綱要進行小童軍 支部各級獎章體驗。 \n\n### **4.  2026** 年 **8** 月 **15** 日之前宣誓的小童軍成員（兩年過渡期） \n\n此類小童軍成員可選擇： \n\n- (A)  按照新《小童軍活動指引》進行訓練；或 \n\n(B)  沿用原《小童軍活動指引》進行訓練，惟必須於兩年過渡期內完成。 \n\n過渡期： **2026** 年 **8** 月 **15** 日 **— 2028** 年 **8** 月 **14** 日 \n\n1/10\n\n<!-- p.4 -->\n### 幼童軍支部 \n\n新修訂之《幼童軍訓練綱要》將於 2026 年 8 月 15 日正式推行，現將執行細則及過渡安 排臚列如下： \n\n### **1.** 綱要下載 \n\n新《幼童軍訓練綱要》已上載至幼童軍支部網頁以供下載。 \n\n### **2.** 新版紀錄冊、徽章及證書 \n\n新版幼童軍紀錄冊、徽章及證書預計將於 2026 年 8 月在香港童軍物品供應社發售。 \n\n### **3.  2026** 年 **8** 月 **15** 日或之後宣誓的幼童軍成員 \n\n凡 2026 年 8 月 15 日或之後宣誓之幼童軍成員，必須按照新訓練綱要進行幼童軍支 部各級獎章考覈。 \n\n### **4.  2026** 年 **8** 月 **15** 日之前宣誓的幼童軍成員（兩年過渡期） \n\n2/10\n\n<!-- p.5 -->\n|現行階段|過渡安排|\n|---|---|\n|(A)於2026年8月15日之前年滿七歲半<br>已完成「會員章」課程。|等同完成新「幼童軍體驗章」課程，可隨<br>後開展新「幼童軍歷奇章」課程。|\n|(B) 已完成或預計於2027年8月31日或<br>之前完成現行「幼童軍獎章」課程。|等同完成新「幼童軍體驗章」課程，可隨<br>後開展新「幼童軍歷奇章」課程。|\n|(C) 於2026 年8 月15 日之前未滿九歲<br>半，但已完成現行「幼童軍歷奇章」<br>課程。|等同完成新「幼童軍歷奇章」課程，可隨<br>後開展新「幼童軍高級歷奇章」核心課程<br>指定內容，完成後進行新「金紫荊獎章」|\n|(D) 預計於2027年8月31日或之前完成<br>現行「幼童軍歷奇章」課程。|課程。|\n|(E) 於2026年8月15日之前年滿九歲半<br>及已完成現行「幼童軍歷奇章」，並<br>已開展現行「幼童軍高級歷奇章」及<br>現行「金紫荊獎章」課程。|可沿用現行課程考取「幼童軍高級歷奇<br>章」及「金紫荊獎章」，並必須於十二歲<br>生日前或不遲於2028年8月31日或之前<br>完成考驗*，並向所屬童軍區遞交「金紫<br>荊獎章及證書申請表」(PT/68)及其他相關<br>證明文件。<br>*成員完成金紫荊獎章考驗時，必須在十<br>二歲生日前或仍就讀於小學（即該成員小<br>學畢業的學年在8月31日或之前）。|\n\n3/10\n\n<!-- p.6 -->\n### **5.** 新金紫荊獎章考驗延長年限安排 \n\n在新制度下，凡已達十二歲而仍在小學階段者，可繼續其幼童軍成員身份參與「金 紫荊獎章」課程相關之活動， 直至相關新學年度開始前一日 ，惟必須符合以下條件： \n\n- (A) 成員已考獲新「幼童軍高級歷奇章」或年滿十歲而考獲會員章，及完成「幼童 軍體驗章」 、新「幼童軍歷奇章」及新「幼童軍高級歷奇章」內「核心範疇」 指定內容，方可進行新「金紫荊獎章」課程； \n\n- (B) 該幼童軍成員完成金紫荊獎章考驗時，必須仍就讀於小學（即尚未小學畢業）； \n\n沿用現行課程進行「金紫荊獎章」考驗之成員，則按青少年活動署於 2025 年 8 月 1 日所發出之青少年活動通告第 101/2025 號進行考驗。 \n\n**6.** 必須使用指定表格 \n\n無論採用新或原有制度，申請幼童軍支部各級獎章必須使用指定表格。 \n\n**7.** 新活動徽章之安排 \n\n新活動徽章及已考取之現行活動徽章可同時並列於制服上。 \n\n4/10\n\n<!-- p.7 -->\n## 童軍支部 \n\n新修訂之《童軍訓練綱要》將於 2026 年 8 月 15 日正式推行，現將執行細則及過渡安排 臚列如下： \n\n### **1.** 綱要下載 \n\n新《童軍訓練綱要》已上載至童軍支部網頁以供下載。 \n\n### **2.** 新版紀錄冊、徽章及證書 \n\n新版童軍紀錄冊、活動徽章及證書預計將於 2026 年 8 月在香港童軍物品供應社發 售。 \n\n### **3.  2026** 年 **8** 月 **15** 日或之後宣誓的童軍成員 \n\n凡於 2026 年 8 月 15 日或之後宣誓之童軍成員，必須按照新訓練綱要進行童軍支部 各級獎章考覈。 \n\n**4.  2026** 年 **8** 月 **15** 日之前宣誓的童軍成員（兩年過渡期） \n\n此類童軍成員可選擇： \n\n- (A) 按照新訓練綱要進行考覈；或 \n\n- (B) 沿用原訓練綱要進行考覈，惟必須於兩年過渡期內完成。如未能於過渡期內完 成原有制度之全部獎章考覈，未完成部分須循新訓練綱要進行考覈。 \n\n過渡期： **2026** 年 **8** 月 **15** 日 **— 2028** 年 **8** 月 **14** 日 \n\n### **5.** 必須使用指定表格 \n\n無論採用新或原有制度，申請童軍支部各級獎章必須使用指定表格。 \n\n5/10\n\n<!-- p.8 -->\n## 深資童軍支部 \n\n新修訂之《深資童軍訓練綱要》將於 2026 年 8 月 15 日正式推行，有關措施亦會陸續生 效。現將執行細則及過渡安排臚列如下： \n\n### **1.** 綱要下載 \n\n新《深資童軍訓練綱要》已上載至深資童軍支部網頁以供下載。 \n\n### **2.** 新版紀錄冊、徽章及證書 \n\n為配合推行新訓練綱要，新版深資童軍紀錄冊、徽章及證書預計將於 2026 年 8 月在 香港童軍物品供應社發售。 \n\n### **3.  2026** 年 **8** 月 **15** 日或之後宣誓的深資童軍成員 \n\n凡於 2026 年 8 月 15 日或之後宣誓之深資童軍成員，必須按照新修訂之《深資童軍 訓練綱要》進行深資童軍支部各級獎章、段章及金帶的考覈。 \n\n**4. 2026** 年 **8** 月 **15** 日之前宣誓的深資童軍成員（三年過渡期） \n\n此類深資童軍成員可選擇： \n\n- (A) 按照新訓練綱要進行支部獎章考覈；或 \n\n- (B) 沿用原有的訓練綱要進行支部獎章考覈，惟須於三年過渡期內（即 2029 年 8 月 14 日或以前）完成。如深資童軍未能於過渡期內完成考覈，未考獲的獎章或項 目須循新訓練綱要進行考覈，其執行細則如下： \n\n在 2026 年 8 月 15 日之前宣誓，並決定按照新訓練綱要進行支部獎章考覈的深資童 軍成員，可按照以下表格，將原有的訓練綱要已完成項目，過渡至新訓練綱要的項 目；同時，新訓練綱要的所有項目備註亦當適用。 \n\n6/10\n\n<!-- p.9 -->\n|《深資童軍訓練綱要》第十版|《深資童軍訓練綱要》第十一版|\n|---|---|\n|「深資童軍肩章」|「深資童軍肩章」之相應部分|\n|「自立」段章|「活動策劃」段章|\n|「自立」金帶|「活動策劃」金帶|\n|「責任」段章|「社會服務」段章|\n|「責任」金帶|「社會服務」金帶|\n|「活動」段章及金帶<br> 童軍技能<br>A-101原野生活知識；及<br>A-102先鋒工程（知識及技巧）；及<br>A-103露營技藝及營務工作；及<br>A-104先鋒工程（實踐）|「多元技能」<br> 範疇一：「童軍技能」|\n|「活動」段章及金帶<br> 體育技能<br>A-301至A-312|「多元技能」<br> 範疇二：「康樂體育」|\n|「活動」段章及金帶<br> 個人興趣<br>A-203至A-240 及A-999|「多元技能」<br> 範疇三：「新體驗」<br> （須要達到兩項不同類型）|\n|「探險段章」必修項<br>E-A001地圖閱讀訓練|深資童軍地圖閱讀訓練班／考驗|\n|「探險段章」必修項<br>E-A002遠足訓練|深資童軍遠足訓練班|\n|「探險」段章<br>E-A003至E-A009|「戶外探險」段章|\n|「探險」金帶<br>E-B001至E-B007|「戶外探險」金帶<br> 如深資童軍於「探險」段章是利用「境<br>外自行駕駛旅程」或「使用機動化交通<br>工具進行境外旅程」，則不能透過該項<br>目考取「戶外探險」 金帶項目。<br> 如深資童軍需要透過選修「海上探險旅<br>程」 則須先完成海上旅程訓練。|\n\n7/10\n\n<!-- p.10 -->\n### **5.** 過渡期間之佩戴安排 \n\n在過渡期間： \n\n- (A) 如成員仍按原有制度的訓練綱要內容進行考驗，可於制服上佩戴原有制度的段 章或金帶； \n\n- (B) 如成員開始使用或轉換至新修訂訓練綱要進行考驗，則應改為佩戴新制度的段 章或金帶。 \n\n香港童軍物品供應社將於 2029 年 8 月 14 日起停止發售現行制度之段章及金帶。成 員可憑有效之深資童軍段章或金帶證書於童軍物品供應社購買相關段章或金帶，惟 證書之簽發日期必須為 2029 年 8 月 14 日或之前。 \n\n### **6.** 使用指定表格 \n\n無論採用新或原有訓練制度，進行考驗前均須填寫考驗計劃申請表（PT65）； 而申請深資童軍支部各級獎章、段章及金帶，必須使用指定表格（PT19、PT20）。 \n\n8/10\n\n<!-- p.11 -->\n## 樂行童軍支部 \n\n新修訂之《樂行童軍訓練綱要》將由 2026 年 8 月 15 日正式推行，有關執行細則及過 渡期安排臚列如下： \n\n### **1.** 綱要下載 \n\n新《樂行童軍訓練綱要》已上載至樂行童軍資訊網以供下載。 \n\n### **2.** 新版紀錄冊、徽章及證書 \n\n為配合推行新訓練綱要，新版樂行童軍紀錄冊、徽章及證書預計將於 2026 年 8 月於 香港童軍物品供應社發售。 \n\n### **3.  2026** 年 **8** 月 **15** 日或之後宣誓的樂行童軍成員 \n\n在 2026 年 8 月 15 日或之後宣誓的樂行童軍成員，將按照新訓練綱要進行支部獎章 考覈。 \n\n### **4.  2026** 年 **8** 月 **15** 日之前宣誓的樂行童軍成員（三年過渡期） \n\n此類樂行童軍成員可選擇： \n\n- (A) 按照新訓練綱要進行支部獎章考覈；或 \n\n- (B) 沿用原有的訓練綱要進行支部獎章考覈，惟須於三年過渡期內（即 2029 年 8 月 14 日或以前）完成。如樂行童軍未能於過渡期內完成考覈，未考獲的獎章或項 目須循新訓練綱要進行考覈，其執行細則如下： \n\n9/10\n\n<!-- p.12 -->\n在  2026 年 8 月 15 日之前宣誓，並決定按照新訓練綱要進行支部獎章考覈的樂行童軍 成員，可按照以下表格，將原有的訓練綱要已完成項目，過渡至新訓練綱要的項目。 \n\n|《樂行童軍訓練綱要》第四版|《樂行童軍訓練綱要》第五版|\n|---|---|\n|「樂行童軍肩章」|「樂行童軍肩章」之相應部分|\n|「童軍知識」||\n|「童軍技能（Ⅰ）」乙部|「童軍技能」之（1）|\n|（船藝除外）||\n|「童軍技能（Ⅰ）」丙部|「童軍技能」之（2）|\n|「童軍技能（Ⅰ）」甲部|「服務」之（1）|\n|「社區服務（II）」|「服務」之（2）及（3）|\n|「個人興趣」|「興趣及技能」或「身心健康」<br>（取決於該「個人興趣」之性質）|\n|「認識世界」|「國際視野」|\n|「挑戰項目」|「挑戰」|\n\n除上表外，新訓練綱要內的所有項目備註亦適用於 2026 年 8 月 15 日之前宣誓，並決 定按照新訓練綱要進行支部獎章考覈的樂行童軍成員。例如，樂行童軍於新訓練綱要 執行前已完成【木章訓練系統】第一及第二階段，該成員可視作已完成新訓練綱要的 「準領袖培訓」項目，並可佩戴「基維爾巾圈」。 \n\n### **5.** 必須使用指定表格 \n\n無論採用新或原有的考覈制度，申請樂行童軍支部進度性獎章必須使用指定表格。 \n\n10/10\n","02_支部訓練綱要/P022-26_Poster.md":"---\nsource_file: \"P022-26_Poster.pdf\"\nsource_category: \"02_支部訓練綱要\"\nsource_format: \"pdf\"\npages: 10\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n青少年活動署第22/2026號通告 （1/2/2026） \n\n## 年齡： 4 歲⾄ 7 歲 \n\n###### \n\n以積極參 與為 本 \n\n### 4 次集會＋基本常識 \n\n###### \n\n<!-- Start of picture text -->\n戶外 健康 社區 創新<br>七⼤範 疇<br>認識⾃⼰與助⼈ 童軍家庭 科學<br>兩項體驗即完成<br><!-- End of picture text -->\n\n<!-- p.2 -->\n## 年齡： 6 歲⾄ 11 歲 \n\n<!-- Start of picture text -->\n進度性獎章<br>⼀步⼀步升級<br><!-- End of picture text -->\n\n#### 2 ⾄ 3 個⽉內完成 ⼊⾨ 訓練 \n\n<!-- Start of picture text -->\n⾦紫 荊 獎章<br>幼童軍⾼級歷奇章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n認識童 軍運 動、<br>誓詞與規律與保護⾃⼰<br>核⼼＋興趣<br>學習更⽴體<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n章<br>幼童軍體驗章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n幼童軍歷奇 章<br><!-- End of picture text -->\n\n**4** 個「核⼼範疇」：童軍技能、關⼰ 愛⼈、國家與社區、童軍家庭 **3** 個「興趣範疇」：多元創藝、科學 與⼤⾃然 、運動與 愛好 嶄新活動徽章 **-** 與時並進 讓幼童軍在遊戲中 學習技能 ，為晉升 童軍⽀部作好準備 \n\n- 「多元活動」及「循序漸進」 兼具趣味與挑 戰\n\n<!-- p.3 -->\n## 年齡： 6 歲⾄ 11 歲 \n\n<!-- Start of picture text -->\n⾦紫荊獎章<br>幼童軍⾼級歷奇章童軍⾼級歷奇章軍⾼級歷奇章⾼級歷奇章級歷奇章歷奇章奇章章<br>幼童軍歷奇章<br>幼童軍體驗章<br>會員章<br><!-- End of picture text -->\n\n幼童軍⾼級歷奇章童軍⾼級歷奇章軍⾼級歷奇章⾼級歷奇章級歷奇章歷奇章奇章章 \n\n「多元活動」及「循序漸進」 兼具趣味 與挑戰 \n\n嶄新活動徽章 **-** 與時並進 讓幼 童軍 在遊戲中學習技能， 為 晉升童軍 ⽀ 部作 好準備\n\n<!-- p.4 -->\n## 年齡： 11 歲⾄ 15 歲 \n\n認識童 軍誓詞、 規律 、⼩ 隊制 度與 保護⾃⼰ 免受 傷害 \n\n##### 正式加⼊童軍團 準備投⼊訓練 \n\n**6** ⼤訓練範疇：戶外挑戰、⾝⼼ 創藝、領袖修養、社會責任、國 際視野、探索新知。 \n\n<!-- Start of picture text -->\n總 領袖獎章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n童軍標準獎 章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n童軍⾼級獎章<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n童軍探索獎章<br><!-- End of picture text -->\n\n多個嶄新專科徽章，與時並 進， 讓 童軍按興趣深耕專⻑，裝備⾃⼰ \n\n「從做中學習」為本 逐步提升⾃理與領 導能⼒\n\n<!-- p.5 -->\n## 年齡： 11 歲⾄ 15 歲 \n\n總領袖獎章 \n\n戶外挑戰 \n\n<!-- Start of picture text -->\n⾝ ⼼創藝<br><!-- End of picture text -->\n\n童軍⾼ 級獎章 \n\n#### 領袖修養 \n\n社會責任 \n\n童軍標準獎章 童軍探索獎章 會員章 \n\n國際 視野 \n\n<!-- Start of picture text -->\n探索新知<br><!-- End of picture text -->\n\n「從做中學習」為 本 多 個 嶄新 專 科徽 章 ，與 時並進，讓 ⼀步步提升⾃理與領導能⼒ 童軍按興趣深耕專⻑，裝備⾃⼰\n\n<!-- p.6 -->\n年齡： 15 歲⾄ 20 歲 \n\n認識深 資童 軍⽬ 的、 運作、團內⻆⾊與保 護⾃⼰免受 傷害 開始⾃務⾃治旅程 \n\n溫故知新： 露營、 繩結、遠⾜、 急 救 等童軍核 ⼼技能 \n\n###### \n\n<!-- Start of picture text -->\n社會服務<br>活動策劃<br>榮譽童 軍獎章<br>多元技能<br>深資童軍 獎章 戶外探險<br>⾦帶進⼀步考驗領 導與承擔<br><!-- End of picture text -->\n\n<!-- p.7 -->\n## 年齡： 15 歲⾄ 20 歲 \n\n榮譽童 軍獎 章 考取⾦帶 進⼀步考驗領導與承擔 深資童軍獎章 考取四⼤段章 \n\n社會服務 \n\n深資童軍肩章 溫故知新：露營、繩結、遠 ⾜、急救等童軍核⼼技能 \n\n<!-- Start of picture text -->\n能<br><!-- End of picture text -->\n\n戶外探險 \n\n活 動策劃 \n\n<!-- Start of picture text -->\n多元技能<br><!-- End of picture text -->\n\n⾦帶 \n\n會員章\n\n<!-- p.8 -->\n## 年齡： 18 歲⾄ 25 歲 \n\n認識樂⾏ 童軍 精 神、 誓詞規 律、 世界童 軍 與保護⾃⼰ 免受傷 害 透過團活動正式加⼊ 服務⾏列 \n\n完成啟導班 或同 等訓練 （明⽩⽀部 架構 、⾃務⾃治 和準領袖⻆ ⾊） \n\n準 領袖培訓 童 軍技能 服務 興趣及技能 ⾝ ⼼健 康 挑戰 國際視野 \n\n樂⾏童 軍獎章 \n\n⾙登堡獎章 \n\n多元發展 連結社羣 與 世 界 \n\n完成 4 項可獲樂⾏ 童軍獎章 完成全部 項 ⽬可獲⾙ 登堡獎章\n\n<!-- p.9 -->\n## 年齡： 18 歲⾄ 25 歲 \n\n<!-- Start of picture text -->\n童軍技能<br>興趣及技能<br>挑戰戰<br><!-- End of picture text -->\n\n準 領袖培訓 服務 \n\n⾙ 登堡 獎章 \n\n樂⾏童軍獎章 \n\n樂⾏童軍肩章 完成啟導班或同等訓練 （明⽩⽀部架構、⾃務⾃治和 ⾝⼼健康 挑戰戰 準領袖⻆⾊） 會員 章 多元發 展 國際視野 連結社羣與世界 完成 4 項 可獲樂⾏ 童軍獎章 完成全部項⽬可獲⾙ 登堡獎章\n\n<!-- p.10 -->\n# ⽀部訓練核⼼理念 \n\n<!-- Start of picture text -->\n習<br><!-- End of picture text -->\n\n⼩童軍⽀部 年齡： 4 歲⾄ 7 歲 認識⾃⼰ 快樂同⾏ \n\n以遊戲與體驗為主，讓幼兒在安全、愉快的環境中認識⾃⼰、學習 ⾃理、建⽴⾃信與基本社交能⼒。 幼童軍⽀部 年齡： 6 歲⾄ 11 歲 多元活動 探索求知 \n\n<!-- Start of picture text -->\n任<br><!-- End of picture text -->\n\n透過多元活動與探索式學習，引發好奇⼼與學習動機，培養責任 感、合作精神及持續學習的基礎。 年齡： 11 歲⾄ 15 歲 童軍⽀部 擁抱挑戰 建⽴團隊 \n\n<!-- Start of picture text -->\n、<br><!-- End of picture text -->\n\n以戶外活動與⼩隊制度為核⼼，讓⻘少年在挑戰中鍛鍊⾃理能⼒、 團隊合作與初步領導才能。 \n\n深資童軍⽀部 年齡： 15 歲⾄ 20 歲 ⾃務⾃治 明⽇領袖 \n\n強調⾃務⾃治與實踐領導，培養成員策劃、承擔及服務社會的能 ⼒，為成為⻘年領袖作好準備。 \n\n樂⾏童軍⽀部 年齡： 18 歲⾄ 25 歲 服務為本 國際視野 \n\n以服務社羣為本，結合國際視野與個⼈發展，培養能承擔、敢⾏ 動、關懷世界的有為公⺠。\n","03_政策及安全指引/2026_ACR042026C_UniformHandbook.md":"---\nsource_file: \"2026_ACR042026C_UniformHandbook.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 \n\n**2026** 年 **1** 月 **1** 日 第 **04/2026** 號通告 [政策／指引 ] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 《儀容與制服手冊》 制服帽佩戴 \n\n為了能更明確地表達總會對成員佩戴制服帽的原則，總會總部修訂《儀容 與制服手冊》內有關制服帽佩戴的內容。 \n\n第 96 頁章節 3.3「制服帽、帽章及職級肩章」 \n\n1. 「佩戴制服帽」 \n\n   - 第 2 點修訂為 \n\n      - 「在下列情況下佩戴制服帽： \n\n         - 在室外。 \n\n   - 在室內進行宣誓、覆誓、升旗、展旗、降旗及授旗時。」 \n\n   - 第 3 點修訂為「在宗教儀式或葬禮進行期間除下制服帽。」 \n\n2. 「概要」 \n\n   - 第 6 點修訂為「童軍單位負責人應因應現場環境、室內或室外、 天氣情況、成員進行活動期間的安全性及/或特別的原因，靈活安 排穿著制服的成員戴制服帽或暫時不戴帽。」 \n\n修訂後的手冊及佩戴制服帽的常見問題已經上載於本會網頁，網址為： https://www.scout.org.hk/uniformhandbook。 \n\n<!-- Start of picture text -->\n香 港 總 監<br>(吳家亮 代行)<br><!-- End of picture text -->\n\n儀容與制服手冊\n","03_政策及安全指引/AC032026C.md":"---\nsource_file: \"AC032026C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 \n\n**2026** 年 **1** 月 **1** 日 第 **03/2026** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 童軍旅財政管理指引 \n\n本通告取代 _2018_ 年 _1_ 月 _1_ 日所發出之行政通告第 _09/2018_ 號。 \n\n## 引 言： \n\n現今，不少童軍成員、家長、旅內領袖甚至外界人士，均希望瞭解童軍旅如何 處理及運用籌募或向團員收集所得之款項。故此，童軍旅於財政管理方面必須十分 謹慎，要有透明度及問責性，否則，若有童軍旅未能清楚交代公款時，定必會對有 關領袖與香港童軍總會整體之聲譽構成損害。 \n\n雖然本會內所有領袖之信譽均為人敬重，惟在良好機構管理之大前題下，本會 實有必要在此提供一份「童軍旅財政管理指引」，謹請各主辦機構負責人及所有旅領 袖留意指引內所臚列各點。此指引應連同「香港童軍總會政策、組織及規條」（POR） 內有關財務管理條文（規條 2.11）及個別區、地域或總會財務署所發出之財務管理 規定一併閱讀。 \n\n## 注意事項： \n\n- （一） 童軍運動乃一項非牟利之活動，雖然童軍成員可能需要繳交團費或 小隊費支持童軍旅之基本開支（例如行政費用、租金、差餉及集會 所需之用品等），惟無論如何，所有童軍旅皆不可向新加入會員徵收 一筆入會費／按金或保証金。 \n\n   - （備註：所有童軍成員均有責任向總會繳付週年成員費，惟本會目前並未有直接向 會員徵收此年費，而僅透過售賣會員章以取代此項收費。） \n\n- （二） 如童軍旅向成員出售制服配件，例如旅領巾，旅章等，定價應該合 理及避免牟取利潤。 \n\n- （三） 向童軍成員收取之團費或小隊費用皆應以實際需要為原則，款項不 可過多，及不應過早預收有關費用，例如一次過徵收三個月或六個 月團費或小隊費均非適當。各支部負責領袖應將收支帳目清楚記錄， 妥善保存一切單據，以供隨時查閱。\n\n<!-- p.2 -->\n- （四） 向童軍成員或家長收取大額費用時，例如露營費用或海外交流／探 訪費用等，應要求家長及團員以支票交款或直接將款項存入旅團銀 行戶口，以免領袖處理過多現金。收取此類大額費用後應發出收據 以資證明，所有收據簿亦應妥善存放以便核數。 \n\n- （五）* 於一般正常情況下，旅領袖在收取現金後，必須第一時間將現金存 入旅銀行戶口，及不可與私人金錢混淆以致不能清晰交代。 \n\n- （六） 所有童軍旅絕對不可以利用私人銀行帳戶處理或儲存童軍旅之款 項。 \n\n- （七） 所有童軍旅之銀行帳戶，包括往來帳戶及儲蓄帳戶，必須依 POR 規 定由不少於兩位獲旅務委員會或旅領袖會議正式授權（有會議紀錄） 之人士聯名簽署去管理，而其中一位亦必須為旅司庫。所有支票簿 應妥善存放，絕對不可有空白支票由其中一人預先簽署備用。 \n\n- （八） 旅司庫之職位不可由旅內任何一位童軍領袖出任，亦不可與旅會長、 旅主席或旅祕書職位合併，可考慮邀請合適家長出任此職。如旅未 有組織旅務委員會，旅領袖會議須委任一名領袖負責履行旅司庫的 職務。 \n\n- （九） 所有童軍旅帳冊及收支紀錄，包括單據、銀行往來帳戶支票簿與儲 蓄帳戶存摺皆應小心處理及保存最少七年。 \n\n- （十） 為確保童軍旅資金保管及運用得宜，主辦機構負責人實有責任定期 查覈其屬下童軍旅之財務管理狀況。因此，各旅長／旅負責領袖務 須將此份指引文件通傳所屬主辦機構負責人知照。如有任何問題， 可直接向區總監查詢。 \n\n- （十一）*各童軍旅必須於每年的六月三十日前提交一份經審核及在其週年會 議／旅領袖會議中通過之帳目結算表（截至三月三十一日止）予區 總監，旅核數人員應由旅務委員會在週年會議／旅領袖會議中委任， 並須由獨立及能勝任的人士出任，若具備專業會計資格尤佳。另外， 各童軍旅須額外提供該旅及團的所有銀行賬戶及旅／團費金額等資 料以便查覈。童軍旅週年賬目結算表及童軍旅賬目補充資料表格可 於總會網頁下載。 \n\n- （十二） 所有籌募活動必須事先獲得區總監之正式批准方可進行。 \n\n註：*號事項的內容已作更新 \n\n<!-- Start of picture text -->\n副香港總監（常務）<br><!-- End of picture text -->\n\n<!-- Start of picture text -->\n吳 家 亮<br><!-- End of picture text -->\n","03_政策及安全指引/AC292022.md":"---\nsource_file: \"AC292022.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 電話：2957 6300 傳真：2302 1001 \n\n行政通告第 29/2022 號 2022 年 11 月 1 日 \n\n# 《儀容與制服手冊》 \n\n2017 年 1 月首版的《儀容與制服手冊》已經售罄。為支持環保，本會不再 印製《儀容與制服手冊》實體書，童軍成員可於本會網頁閱覽手冊的最新內容及 下載電子書，網址為 http://www.scout.org.hk/uniformhandbook。 \n\n香 港 總 監 （黎偉生 代行） \n\n儀容與制服手冊\n","03_政策及安全指引/ACR012026C.md":"---\nsource_file: \"ACR012026C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 7\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n
