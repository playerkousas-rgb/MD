四）工作坊屆別 ： 由總會青少年活動署自行編配 \n\n- （五）學員人數 ： 6 至 30 人 \n\n- （六）參加資格 ： 1. 持有有效領袖委任書或教練員委任證之各級領袖；或 2. 持有有效會務委員委任證之人士。 \n\n- （七）工作坊負責人資格 ： \n\n   1. 工作坊負責人必須為本會委任之高級步操教練員或步操教練 員；及 \n\n   2. 導師必須為本會委任之高級步操教練員、步操教練員或助理步 操教練員。 \n\n- （八）職員出席要求 \n\n   - ： 1. 工作坊職員與學員比例為 1 比 8 \n\n      2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）工作坊內容 \n\n   - ： 請參閱「會操及護送人員禮節工作坊」課程大綱 \n\n      - （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書 `：` 完成工作坊之學員由青少年活動署發出工作坊證書。證書由青少年 活動署編印。 \n\n1/2\n\n<!-- p.24 -->\n## 「會操及護送人員禮節工作坊」課程大綱 \n\n### 學習時數：不少於 2 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1.<br>介紹童軍會操程序|1.<br>陳述童軍會操程序及場地安排。<br>2.<br>說出童軍會操中有關禮節的工作人員及其職責。<br>3.<br>陳述於童軍會操中安排升降國旗及區旗、奏唱國<br>歌的注意事項。<br>4.<br>列舉主禮嘉賓的須知。|30分鐘|\n|2.<br>與其他團體進行聯合會操<br>的注意事項|解釋與其他採用隊列動作或其他步操方式的團體進<br>行聯合會操的注意事項及相關協調。|45分鐘|\n|3.<br>護送人員的職責及禮節|1.<br>列舉護送人員的職責及禮節。<br>2.<br>示範護送人員於會操中的工作。|45分鐘|\n\n2/2\n\n<!-- p.25 -->\n【附件 11】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「步操教具訓練班」開辦指引 \n\n- （一）訓練班名稱 ： 步操教具訓練班 Foot Drill Teaching Aid Course \n\n- （二）舉辦單位 ： 總會青少年活動署 \n\n- （三）覈准開班人士 ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 ： 由總會青少年活動署自行編配 （五）學員人數 ： 6 至 30 人 （六）參加資格 ： 1. 持有有效領袖委任書或教練員委任證之各級領袖；及 2. 持有步操教練員訓練班證書。 \n\n- （七）班職員資格 ： 1. 班領導人必須為本會委任之高級步操教練員；及 2. 導師必須為本會委任之高級步操教練員、步操教練員或助理步 操教練員。 \n\n- （八）班職員出席要求 ： 1. 班職員與學員比例為 1 比 8 2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）訓練班內容 ： 請參閱「步操教具訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書 ： 完成訓練班之學員由青少年活動署發出訓練班證書。證書由青少年 活動署編印。 \n\n1/2\n\n<!-- p.26 -->\n## 「步操教具訓練班」課程大綱 \n\n### 學習時數：不少於 5 小時 \n\n|項目||內容|建議時間|\n|---|---|---|---|\n|1.步操輔助訓練工具及使用方法|1.<br>列<br>2.<br>說<br>子|舉童軍步操訓練之輔助訓練工具。<br>明如何在童軍步操訓練及會操中使用拍<br>機及鼓。|20分鐘|\n|2.認識步規及使用方法|1.<br>知<br>2.<br>列<br>3.<br>說<br>規<br>4.<br>說|悉步規之來源。<br>舉步規各部份的名稱。<br>明如何在童軍步操訓練及會操中使用步<br>。<br>明典禮及步操組使用步規的規定。|20分鐘|\n|3.拍子機及鼓操作實習|1.<br>原<br>2.<br>原<br>3.<br>睇<br>4.<br>三<br>5.<br>快|地動作。<br>地向前敬禮及最高致敬。<br>齊。<br>排轉兩排及兩排轉三排。<br>步操及慢步操。|20分鐘|\n|4.步規操動作實習|示範下<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>|列步規操動作及其打數︰<br>持步規立正、稍息、休息；<br>攜步規立正、稍息、休息；<br>打開步規立正、稍息、休息；<br>持步規原地向左、向右及向後轉；<br>攜步規原地向左、向右及向後轉；<br>打開步規原地向左、向右及向後轉；<br>攜步規立正轉持步規立正；<br>持步規立正轉攜步規立正；<br>擺動步規；<br>擺動步規停步轉攜步規立正；<br>擺動步規停步轉持步規立正；<br>攜步規停步轉持步規立正；<br>閉合步規原地向前敬禮；<br>打開步規原地向前敬禮；<br>閉合行進間向左及向右敬禮；<br>快步轉動步規；<br>快步轉動步規換手；<br>轉動步規轉為持步規。|240分鐘|\n\n2/2\n\n<!-- p.27 -->\n【附件 12】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「步操教練員覆修訓練班」開辦指引 \n\n- （一）訓練班名稱 ： 步操教練員覆修訓練班 Foot Drill Instructor Refresher Course \n\n- （二）舉辦單位 ： 總會青少年活動署 \n\n- （三）覈准開班人士 \n\n   - ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 \n\n   - ： 由總會青少年活動署自行編配 \n\n- （五）學員人數 \n\n   - ： 6 至 30 人 \n\n- （六）參加資格 \n\n   - ： 1. 持有有效領袖委任書或教練員委任證之各級領袖；及 2. 持有步操教練員訓練班證書。 \n\n- （七）班職員資格 ： 1. 班領導人必須為本會委任之高級步操教練員，並持有「步操教 練員隊列訓練班」證書；及 \n\n      2. 導師必須為本會委任之高級步操教練員、步操教練員或助理步 操教練員。 \n\n      3. 就專題研習而言，班領導人可物色合適人選主持，而該人選須 得青少年活動署總部總監（典禮及步操）或其代表同意 `。` \n\n- （八）班職員出席要求 \n\n   - ： 1. 班職員與學員比例為 1 比 8 2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）訓練班內容 \n\n   - ： 請參閱「步操教練員覆修訓練班」課程大綱 \n\n      - （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書 `：` 完成訓練班之學員由青少年活動署發出訓練班證書。證書由青少年 活動署編印。 \n\n1/2\n\n<!-- p.28 -->\n## 「步操教練員覆修訓練班」課程大綱 \n\n### 學習時數：不少於 2 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1.童軍步操及隊列動作動作重溫|1.<br>示範童軍步操及隊列動作。<br>2.<br>使用步操拖訓技巧進行動作教授。|60分鐘|\n|2.專題研習|專題研習之題目及目標由班領導人與青少年活<br>動署總部總監（典禮及步操）或其代表商議決<br>定，內容環繞步操技巧、典禮儀式等。過住的<br>專題研習題目例子：<br>a. 金紫荊廣場升旗及降旗儀式。<br>b. 轉變隊形方向。<br>c. 童軍婚禮及喪禮。<br>d. 童軍會操場地設計。<br>e. 腹式呼吸及發聲訓練。|60分鐘|\n\n2/2\n\n<!-- p.29 -->\n【附件 13】 青少年活動署通告第 63/2025 號 (1/4/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「步操教練員隊列訓練班」開辦指引 \n\n- （一）訓練班名稱 ： 步操教練員隊列訓練班 Chinese Foot Drill Course for Foot Drill Instructor \n\n- （二）舉辦單位 ： 總會青少年活動署 （三）覈准開班人士 ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 ： 由總會青少年活動署自行編配 （五）學員人數 ： 6 至 20 人 （六）參加資格 ： 1. 持有有效樂行童軍紀錄冊之樂行童軍支部成員；或 2. 持有有效領袖委任書或教練員委任證之各級領袖；及 3. 持有步操教練員訓練班證書。 \n\n- （七）班職員資格 ： 1. 班領導人必須為本會委任之高級步操教練員，並持有「步操 教練員隊列訓練班」證書；及 \n\n- 2. 導師必須為本會委任之高級步操教練員、步操教練員或助理 步操教練員，並持有「步操教練員隊列訓練班」證書。 \n\n- （八）班職員出席要求 ： 1. 班職員與學員比例為 1 比 8 2. 最少 1 名持有有效急救證書之領袖必須出席 \n\n- （九）訓練班內容 ： 請參閱「步操教練員隊列訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書 ： 完成訓練班之學員由青少年活動署發出訓練班證書。證書由青少 年活動署編印。 \n\n1/2\n\n<!-- p.30 -->\n## 「步操教練員隊列訓練班」課程大綱 \n\n### 學習時數：不少於 18 小時 \n\n|項目||內容|建議時間|\n|---|---|---|---|\n|1. 童軍參與隊列訓練的<br>方針|1.<br>說<br>2.<br>說<br>3.<br>列<br>4.<br>闡|明童軍步操訓練方針。<br>出步操教練員的責任。<br>舉童軍步操訓練及隊列訓練之輔助訓練工具。<br>述童軍致敬及其注意事項。|30分鐘|\n|2. 隊列訓練詞彙及口令|陳述隊|列訓練中所用的常用詞彙及口令。|30分鐘|\n|3. 童軍步操及隊列動作<br>的異同及箇中協調|解釋童|軍步操及隊列動作的異同及箇中協調。|40分鐘|\n|4. 隊列訓練|示範下<br><br><br><br><br>|列隊列動︰<br>集合、離散；<br>立正、稍息、跨立；<br>整理著裝；<br>停止間轉法；<br>整齊及報數；|620分鐘|\n|||齊步、立定；||\n|||正步、立定；||\n|||踏步、立定；||\n||<br>|跑步、立定；<br>方向變換；||\n||<br><br>|齊步、正步、踏步步法變換；<br>敬禮、注目禮、禮畢和單個人員敬禮；<br>入列及出列；||\n|||旗的掌持。||\n|5. 隊列動作教授實習|使用步<br><br><br>|操拖訓技巧進行下列隊隊列動作教授︰<br>立正、稍息、跨立；<br>停止間轉法；<br>齊步、立定；|240分鐘|\n|||正步、立定。||\n|6. 檢閱式、分列式及升國<br>旗儀式實習|示範檢|閱式、分列式及升國旗儀式。|120分鐘|\n\n2/2\n","03_政策及安全指引/P067-26.md":"---\nsource_file: \"P067-26.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 6\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 \n\n**2026** 年 **6** 月 **1** 日 第 **67/2026** 號通告 [政策／指引] \n\n電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n# 深資童軍海上旅程訓練安排 **Arrangement for Venture Scout Sea Expedition Training** \n\n由 2026 年 8 月 15 日起，深資童軍支部探險段章及探險金帶加入以海上旅程 作為考覈內容。為配合本會深資童軍海上旅程審核工作，現持有四級童軍標準艇 證書、中級金章獨木舟證書或風帆日間航行證書之持有人，在完成相關要求的工 作坊後，方可開展探險段章及探險金帶的海上旅程考覈。有關詳情臚列如下： \n\n第一部分： 有關「深資童軍海上旅程」之內容，請參閱新修訂深資童軍訓練 綱要 2026。 \n\n第二部份： 證書安排及各類工作坊的開辦指引 1. 「海上旅程訓練證書安排」，見附件 1。 2. 「海上旅程事工工作坊」開辦指引，見附件 2。 3. 「海上旅程度宿工作坊」開辦指引，見附件 3。 \n\n青少年活動總監 陳狄安\n\n<!-- p.2 -->\n【附件 1】 青少年活動署第 67/2026 號通告 (1/6/2026) \n\n# 香港童軍總會 青少年活動署 \n\n# 海上旅程證書安排 \n\n# **Arrangement for Sea Expedition Training Certificate** \n\n深資童軍持有下表內的證書，代表該名成員已經完成海上旅程訓練，並可以向所屬 地域申請獲取海上旅程訓練證書。持有海上旅程訓練證書者，方可進行深資童軍探險段 章及探險金帶考覈。 \n\n|項目|持有證書類別|獲取證書|\n|---|---|---|\n||四級童軍標準艇訓練課程證書||\n|童軍標準艇|及||\n||海上旅程事工工作坊證書||\n||中級金章獨木舟證書||\n|獨木舟|及|海上旅程訓練證書|\n||海上旅程度宿工作坊證書||\n||風帆日間航行訓練證書||\n|小帆船|及||\n||海上旅程度宿工作坊證書||\n\n<!-- p.3 -->\n【附件 2】 青少年活動署第 67/2026 號通告 (1/6/2026) \n\n# 香港童軍總會 青少年活動署 \n\n# 海上旅程事工工作坊開辦指引 **Guidelines of Sea Exploration Assignment** \n\n- （一）工作坊名稱 ： 海上旅程事工工作坊 Sea Exploration Assignment Workshop \n\n- （二）舉辦單位 ： 總會及各地域 （三）覈准及簽發開班證書 ： 1. 總會 — 青少年活動總監；或 副青少年活動總監 \n\n- 2. 地域 — 地域總監；或 副地域總監（活動與訓練） \n\n- （四）參加資格 ： 1. 持有有效深資童軍紀錄冊之成員；及 2. 持有三級童軍標準艇證書或以上資歷。 \n\n- （五）工作坊負責人資格 ： 各類海上旅程審核員 （六）工作坊內容及時數 ： 請參閱「海上旅程事工工作坊」課程大綱 （七）證書及編號 ： 1. 無需向青少年活動署申請工作坊屆別，完成工作坊之學 員由舉辦單位編印及發出證書。 \n\n- 2. 證書編號必須按照總會青少年活動署編配之模式列印， 惟不能使用海上活動證書（白咭）發出。 \n\n- （八）備註 ： 1. 持有此工作坊證書及四級童軍標準艇證書者，可以向所 屬地域／單位申請「海上旅程訓練證書」。 \n\n1/2\n\n<!-- p.4 -->\n# 「海上旅程事工工作坊」課程大綱 \n\n學習時數：不少於 3 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1|旅程的定義、價值及目的|45分鐘|\n|2|旅程事工的重要性和主題選擇|45分鐘|\n|3|急救|45分鐘|\n|4|緊急事件處理|45分鐘|\n\n*上述建議時間可根據實際需要作出調整。 \n\n# 證明書編號及格式 \n\n總會 ：SAT/SEAW/A/00_/0_ 港島地域 ：SAT/SEAW/H/00_/0_ 九龍地域 ：SAT/SEAW/K/00_/0_ 東九龍地域 ：SAT/SEAW/E/00_/0_ 新界地域 ：SAT/SEAW/N/00_/0_ 新界東地域 ：SAT/SEAW/D/00_/0_ \n\n<!-- Start of picture text -->\n證書英文編碼 學員編號<br>SAT/SEAW/A/00_/0_<br>舉辦單位代號 屆別<br><!-- End of picture text -->\n\n2/2\n\n<!-- p.5 -->\n【附件 3】 青少年活動署第 67/2026 號通告 (1/6/2026) \n\n香港童軍總會 青少年活動署 \n\n# 海上旅程度宿工作坊開辦指引 \n\n# **Guidelines of Overnight Sea Exploration Workshop** \n\n|（一）|工作坊名稱|： 海上旅程度宿工作坊<br>Overnight Sea Exploration Workshop|\n|---|---|---|\n|（二）|舉辦單位|： 總會及各地域|\n|（三）|覈准及簽發開班證書|：1.總會—青少年活動總監；或<br>副青少年活動總監<br>2.地域—地域總監；或<br>副地域總監（活動與訓練）|\n|（四）|學員人數|： 每小組4至6名成員|\n|（五）|參加資格|：1.持有有效深資童軍紀錄冊之成員；及<br>2.持有中國香港獨木舟總會中級銀章獨木舟證書或以上資<br>歷；或<br>3.持有中國香港帆船運動總會三級帆船證書或以上資歷。|\n|（六）|工作坊負責人資格|： 各類海上旅程審核員|\n|（七）|導師資格|：1.註冊香港童軍總會獨木舟教練；或<br>2.註冊中國香港總木舟總會獨木舟教練；或<br>3.註冊香港童軍總會風帆教練；或<br>4.註冊中國香港帆船運動總會帆船教練。|\n|（八）|工作坊出席要求|1.導師與小組比例應為1比1。<br>2.依循香港童軍總會海上活動中心出船資格人數要求。|\n|（九）|工作坊內容及時數|： 請參閱「海上旅程度宿工作坊」課程大綱|\n|（十）|證書及編號|：1. 無需向青少年活動署申請工作坊屆別，完成工作坊之學<br>員由舉辦單位編印及發出證書。<br>2. 證書編號必須按照總會青少年活動署編配之模式列印，<br>惟不能使用海上活動證書（白咭）發出。|\n|（十一|）備註|：1. 持有此工作坊證書、中國香港獨木舟總會中級金章獨木<br>舟證書或中國香港帆船運動總會帆船日間航行證書者，<br>可以向所屬地域／單位申請「海上旅程訓練證書」。<br>2. 如在非香港童軍總會海上活動中心進行，需要由負責海<br>上活動的地域總部總監批准。|\n\n1/2\n\n<!-- p.6 -->\n# 「海上旅程度宿工作坊」課程大綱 \n\n學習時數：不少於 6 小時及 2 個兩日一夜旅程 \n\n|項目|內容|建議時間／次數|\n|---|---|---|\n|1|旅程的定義、價值及目的|45分鐘|\n|2|旅程事工的重要性和主題選擇|45分鐘|\n|3|急救|45分鐘|\n|4|緊急事件處理|45分鐘|\n|5|旅程裝備|45分鐘|\n|6|食物與炊事|45分鐘|\n|7|露營技能|45分鐘|\n|8|計劃書及報告書製作|45分鐘|\n|9|海上旅程一|兩日一夜|\n|10|海上旅程二|兩日一夜|\n\n*上述建議時間可根據實際需要作出調整。 \n\n# 證明書編號及格式 \n\n總會 ：SAT/OSEW/A/00_/0_ 港島地域 ：SAT/OSEW/H/00_/0_ 九龍地域 ：SAT/OSEW/K/00_/0_ 東九龍地域 ：SAT/OSEW/E/00_/0_ 新界地域 ：SAT/OSEW/N/00_/0_ 新界東地域 ：SAT/OSEW/D/00_/0_ \n\n<!-- Start of picture text -->\n證書英文編碼 學員編號<br>SAT/OSEW/A/00_/0_<br>舉辦單位代號 屆別<br><!-- End of picture text -->\n\n2/2\n","03_政策及安全指引/P087-25.md":"---\nsource_file: \"P087-25.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 16\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2025** 年 **7** 月 **1** 日 第 **87/2025** 號通告 [政策／指引 ] \n\n#### 各支部「團員章」／「會員章」課程內容修訂通知 加入保護童軍成員免受傷害元素 \n\n為加強各童軍成員對個人安全的認識，並提升他們保護自己及他人免受傷害的能力，現於 小童軍支部的「團員章」，以及幼童軍、童軍、深資童軍及樂行童軍支部之「會員章」課程中加 入有關「保護童軍成員免受傷害」的內容。各支部領袖可按年齡特性及成員的理解能力作出適當 安排，並可參考附件及支部網頁上提供之活動例子及建議，靈活設計訓練內容及進行評核。「團 員章」／「會員章」加入的新內容如下： \n\n【小童軍支部團員章】： \n\n認識如何保護自己免受傷害。 \n\n【幼童軍支部會員章】： \n\n認識基本措施去保護自己及夥伴免受傷害。 \n\n【童軍支部會員章】： \n\n認識常見兒童及青少年受傷害的情況、預防及處理方法。 \n\n【深資童軍支部會員章】： \n\n對保護兒童及青少年有基本認識，並認識保護他們免受傷害的預防及處理方法； 或完成「保護童軍成員免受傷害」網上自學課程。 \n\n【樂行童軍支部會員章】： \n\n完成「保護童軍成員免受傷害」網上自學課程。 \n\n上述修訂自 2025 年 7 月 1 日 起實施。各支部建議內容及教育活動例子將上載至該支部網 頁以供領袖參考。領袖應根據成員的實際情況、年齡特性及理解能力作出彈性調整，務求訓練及 評核更切合其成長需要與發展步伐。 \n\n此外，請現役童軍成員於 2025 年 12 月 31 日前完成會員章內新增之「保護童軍成員免受 傷害」的內容。 \n\n如有查詢，請於辦公時間內致電 2957 6411 或 2957 6417 與青少年活動署職員聯絡。 \n\n「保護童軍成員免受傷害」網上自學課程連結： **https://sfh.scout.org.hk** \n\n<!-- Start of picture text -->\n青少年活動總監<br> 陳 狄 安<br><!-- End of picture text -->\n\n<!-- p.2 -->\n# `會員章` **–** `保護童軍成員免受傷害` \n\n`為加強各童軍成員對個人安全的認識，並提升他們保護自己及他人免受傷害的能力， 現於小童軍支部的「團員章」，以及幼童軍、童軍、深資童軍及樂行童軍支部之「會 員章」課程中加入有關「保護童軍成員免受傷害」的內容。各支部領袖可按年齡特 性及成員的理解能力作出適當安排，並可按照活動例子及建議，靈活設計訓練內容 及進行評核。「團員章」` / `「會員章」加入的新內容如下：` \n\n#### `團員章` \n\n- `【小童軍支部】 ： 認識如何保護自己免受傷害` \n\n#### `會員章` \n\n- `【幼童軍支部】 ： 認識基本措施去保護自己及夥伴免受傷害 【童軍支部】 ： 認識常見兒童及青少年受傷害的情況、預防及處理方法 【深資童軍支部】 ： 對保護兒童及青少年有基本認識，並認識保護他們免受 傷害的預防及處理方法；或完成「保護童軍成員免受傷害」 網上自學課程` \n\n- `【樂行童軍支部】 ： 完成「保護童軍成員免受傷害」網上自學課程` \n\n```\n以下為各支部在進行「保護童軍成員免受傷害」主題下的學習目標及活動例子，旨\n在讓領袖在設計活動或進行會員章評核時作為參考。建議僅屬參考性質，領袖應根\n據新成員的實際情況、年齡特性及理解能力，作出適當調整和安排。領袖在進行會\n員章評核過程中保留彈性，以確保訓練和評核更切合成員的成長需要與發展步伐。\n```\n\n`上述修訂自` **2025** `年` **7** `月` **1** `日 起實施。` \n\n(Version on 7.2025)  1\n\n<!-- p.3 -->\n## `【小童軍支部】` \n\n#### `團員章` \n\n```\n內容：認識如何保護自己免受傷害\n```\n\n#### `學習目標：` \n\n- `認識身體是自己的，沒有人可以在未經允許下觸碰` \n\n- `辨識不恰當身體接觸` \n\n- `學習說「不」及尋求可信任的大人幫助` \n\n- `認識可以求助的對象（如：父母、老師、童軍領袖）` \n\n- `用遊戲、圖畫書、角色扮演等方式學習基本自我保護意識` \n\n#### `教育活動例子：` \n\n- `好觸摸／壞觸摸分類遊戲： 準備圖片卡（如擁抱、握手、打人、摸私密部位 等），讓小童軍分辨屬於「好的身體接觸」或「壞的身體接觸」，並說明原 因。` \n\n- `我說不！角色扮演： 小組練習如何用堅定語氣說「不」，模擬有人想拿走玩 具、不當觸碰身體等情境，學習如何回應和尋求幫助。` \n\n- `身體地圖遊戲紅黃綠： 發放一張人體輪廓圖，讓小童軍用顏色標記哪些部位 是「私密部位」，哪些部位是「安全區域」。紅色為不可讓別人隨便觸碰， 黃色為經同意後可以觸碰，綠色為可以觸碰。` \n\n- `信任圈圖卡活動： 利用圈圖示建立「可以幫助我的人」清單，如爸爸媽媽、 老師、童軍領袖、警察等，幫助小童軍認識安全求助對象。` \n\n- `安全故事時間： 透過故事書（如《不可以碰我》或《身體的界線》）進行講 解，引導小童軍思考遇到可疑情況應怎樣應對。` \n\n- `「安全密語」遊戲： 與小童軍預設一組「安全密語」或手勢，萬一他們在公 眾場所遇到危險，可用這個密語告訴可信任的大人或領袖。` \n\n(Version on 7.2025)  2\n\n<!-- p.4 -->\n- `「小童軍的勇敢徽章」手作： 讓小童軍完成一系列任務（說出不恰當的身體 接觸、記得求助對象等）後，製作「勇敢小童軍徽章」，增加認同感與學習 動機。` \n\n- `手偶互動劇場： 利用手偶模擬生活中的互動情境（如：陌生人搭訕、朋友之 間的身體界線），讓小童軍參與對話與解決方法。` \n\n- `安全標語創作時間： 小組創作簡單安全口號（如：「我的身體我做主！」、 「不舒服就說不！」），加深印象並鼓勵表達。` \n\n(Version on 7.2025)  3\n\n<!-- p.5 -->\n## `【幼童軍支部】` \n\n#### `會員章` \n\n```\n內容：認識基本措施去保護自己及夥伴免受傷害\n```\n\n#### `學習目標：` \n\n- `認識個人的身體界線及尊重他人的身體界線` \n\n- `學習辨識潛在危險情境（如：獨自與陌生人相處）` \n\n- `明白夥伴之間應有的尊重與安全行為` \n\n- `若發現自己或夥伴面對困擾，要勇於告訴可信任的人並尋求協助` \n\n#### `教育活動例子：` \n\n- `「界線在哪裡？」貼紙活動： 領袖可準備一張人體輪廓圖，讓幼童軍用不同 顏色貼紙標示「自己不喜歡別人觸碰的地方」及「可接受的互動」，並分享 理由，學習尊重自己與他人的身體界線。` \n\n- `安全情境小劇場： 分組演出幾個日常情境（如：獨自在升降機遇見陌生人、 朋友推撞打鬧過頭等），並討論哪些屬於行為安全、面對哪些行為需要說「不」、 如何求助等。` \n\n- `危機判斷遊戲「我會怎樣做？」： 以卡牌或口頭描述情境形式出題，例如： 「放學後有陌生人說媽媽叫他來接你」或「有人說想要跟你單獨說個祕密」， 讓幼童軍輪流說出處理方法。` \n\n- `「我是好隊友」任務挑戰： 安排一系列需要夥伴合作、尊重與安全互動的任 務（如雙人背靠背運球、盲行引導行走等），體驗良好夥伴互動及互相照顧 的重要性。` \n\n- `「說出來不怕」故事分享時間： 領袖或安排隊員輪流講述曾經遇到困擾或看 到不公平對待的經驗（可使用虛構例子），並討論「向誰求助」及「說出來 的勇氣」。` \n\n- `「安全大使」徽章工作坊： 透過完成指定任務（例如：說出三個求助對象、 識別兩個危險情境、模擬求助說話等），獲得自製「安全大使」徽章，提升 參與及責任感。` \n\n(Version on 7.2025)  4\n\n<!-- p.6 -->\n- `尊重界線海報設計比賽： 分組設計「尊重自己和別人的界線」主題海報，例 如標語：「朋友之間要說得清楚」、「不想被觸碰，可以說不」，鼓勵表達 與尊重。` \n\n- `「安全與不安全」分類卡遊戲： 提供各種互動情境卡（例如：朋友搶你東西、 別人要你保守祕密、老師讚賞你表現），讓幼童軍判斷哪些行為屬於「安全」 或「不安全」，並說出原因。` \n\n- `「保護我和你」規則書創作： 小隊共創一本屬於自己的「安全守則小冊子」， 列出自己對安全、界線、互動的理解與建議，最後由各隊分享作品。` \n\n- `小任務卡片—安全任務一週挑戰： 向每位幼童軍派發「每日小任務卡」，如 「今天我勇敢地說了不」、「我幫助了一位同學處理衝突」、「我主動關心 了一位朋友」，鼓勵日常實踐。` \n\n(Version on 7.2025)  5\n\n<!-- p.7 -->\n## `【童軍支部】` \n\n#### `會員章` \n\n```\n內容：認識常見兒童及青少年受傷害的情況、預防及處理方法\n```\n\n#### `學習目標：` \n\n- `認識常見的侵犯兒童及青少年行為（包括肢體、性、情緒及網絡欺凌等）` \n\n- `探討侵犯與同儕玩笑的界線` \n\n- `學習如何應對和保護自己免受不當接觸或語言傷害` \n\n- `認識保密與保護的分別：甚麼情況下應向可信任的大人揭露事件` \n\n- `小隊討論、模擬情境處理、分組活動提升實踐能力` \n\n#### `教育活動例子：` \n\n- `情境討論工作坊「這樣算過界嗎？」： 提供不同生活情境（如：不當玩笑、 取笑身體特徵、被強迫拍照、被要求保守祕密等），由小隊討論每個情境是 否構成侵犯，並說出處理建議。` \n\n- `互動遊戲「侵犯` **or** `玩笑？」快速判斷賽： 利用投影片或卡牌呈現不同語句 或行為，童軍需迅速判斷為「可接受」、「不舒服但可處理」或「明顯侵犯」， 加強判別意識與反應速度。` \n\n- `角色扮演劇場「我會怎樣處理？」： 小隊分組設定一個實際案例，例如網絡 欺凌、語言侮辱、身體界線被侵犯，並模擬對話及回應行動（如說不、尋求 協助、安慰受害者等）。` \n\n- `「保密` **vs** `保護」判斷遊戲： 討論常見祕密情境（如朋友說自己被欺凌、朋 友叫你就不當行為保守祕密等），判斷面對哪些情況應該保密，哪些情況應 尋求可信任的大人處理。` \n\n- `網絡安全小任務偵查網騙陷阱： 分析虛構的社交媒體對話或交友軟件截圖， 找出潛在危險訊號，例如過度關心、請求裸照、要求見面等，學習如何應對 與拒絕。` \n\n(Version on 7.2025)  6\n\n<!-- p.8 -->\n- `「你可以這樣說」表達練習： 訓練童軍用清晰、堅定及合適的語氣說「不」， 或表達自己的感受，例如：「這樣的說話讓我感覺不舒服」、「我不想你再 這樣觸碰我」。` \n\n- `侵犯風險分析任務` **—** `校園安全地圖： 小隊繪製校園或社區活動空間地圖，標 記潛在高風險區域與安全支援點（如：廁所、樓梯角落、社工室），並提出 改善建議。` \n\n- `心理界線探索活動` **—** `「我接受／我不接受」清單： 每人填寫一份個人界線清 單，例如哪些玩笑可接受、什麼語氣讓自己不舒服，然後與小隊隊員互相交 流，加強互相理解與尊重。` \n\n- `法律與支援知識小挑戰` **—** `以問答或分站形式學習： 什麼是性騷擾？可以在哪 裡尋求支援？如何向社工、老師或警察尋求協助？強化基本法律與求助知識。` \n\n- `反欺凌承諾行動` **—** `「我守護 我說出」： 全隊完成「童軍反欺凌承諾卡」，寫 下自己願意做的事，例如「我不取笑任何人」、「我會關心有困擾的同伴」、 「我會尋求幫助」等，公開張貼以凝聚隊伍文化。` \n\n#### `參考資料，請按以下連結` **:** \n\n**1.** `保護童軍成員免受傷害政策` \n\n**2.** **Safe from harm in Scouting** \n\n**3.** **Safe from harm in Scouting (YouTube)** \n\n**4.** `家計會資源庫` **/** `性教育資源` **/** `網上資源` \n\n**5.** `護苗基金–護苗資訊` \n\n(Version on 7.2025)  7\n\n<!-- p.9 -->\n## `【深資童軍支部】` \n\n#### `會員章` \n\n```\n內容：對保護兒童及青少年有基本認識，並認識保護他們免受傷害的預防及處理方\n法；或完成「保護童軍成員免受傷害」網上自學課程\n```\n\n#### `學習目標：` \n\n- `建立作為準領袖的責任感與觀察力` \n\n- `認識童軍活動中可能出現的風險與應對方法` \n\n- `學習傾聽與支援技巧：如何接納並處理年幼成員的求助` \n\n- `認識童軍政策中保護兒童及青少年的基本原則` \n\n- `推薦完成「保護童軍成員免受傷害」網上自學課程，加深理解並取得認證` \n\n#### `內容參考：` \n\n- `「積極公民獎章系列` **-** `保護兒童章」網上自學課程：` \n\n- `「保護童軍成員免受傷害」網上自學課程連結：` **https://sfh.scout.org.hk** \n\n#### `教育活動例子：` \n\n- `「我是領袖」責任小組討論： 討論作為活動助理、服務人員或小隊導師時， 面對年幼成員時的責任與角色，如行為榜樣、活動觀察、支援求助等。` \n\n- `風險辨識實戰演練： 領袖準備活動場地或童軍活動情境模擬圖，讓深資童軍 找出潛在風險（如視線死角、人手不足、年幼童軍單獨行動等），並提出改 善措施。` \n\n- `「如果我察覺⋯⋯ 」情境判斷訓練： 模擬實際情景（如：童軍表現異常、不敢 靠近特定領袖、暗示被欺負），訓練成員如何觀察、回應及向領袖或總會通 報。` \n\n- `同理心傾聽練習` **—** `「你可以這樣說」： 透過角色扮演練習，學習如何接納年 幼成員的情緒、鼓勵對方表達感受，以及避免說出會讓人停止分享的回應（例 如「你想多了」）。` \n\n(Version on 7.2025)  8\n\n<!-- p.10 -->\n- `「誰來幫助我？」支援網絡地圖： 認識童軍成員在遇到問題時可以求助的對 象（例如領袖、家長、社工），並建立一張支援網絡圖，讓自己作為中間橋 樑。` \n\n- `童軍政策速讀比賽： 以分組方式閱讀總會的「保護童軍成員免受傷害政策」 及活動安全指引等章節，設計問答遊戲或比賽，加深成員對相關政策和指引 內容的掌握。` \n\n- `信任與界線分站活動： 設計實際操作分站遊戲（例如：身體界線繪圖、信任 傳球、盲行引導），反思如何建立信任、怎樣尊重界線。` \n\n- `「童軍活動中我會怎樣做？」案例研習： 提供真實或虛構的活動案例（如露 營、戶外晚會、夜行），讓深資童軍判斷是否涉及潛在風險以及應對方法， 並分享經驗與建議。` \n\n(Version on 7.2025)  9\n\n<!-- p.11 -->\n## `【樂行童軍支部】` \n\n#### `會員章` \n\n```\n內容：完成「保護童軍成員免受傷害」網上自學課程\n```\n\n```\n目的：\n```\n\n```\n讓成員學習識別、預防及處理因不當行為而讓成員受到傷害的個案，並懂得如何遵\n循本會相關指引，讓童軍活動能在安全情況下進行，確保各級成員不會受到傷害。\n```\n\n```\n參考：\n```\n\n- `「保護童軍成員免受傷害」網上自學課程連結：` **https://sfh.scout.org.hk** \n\n- `社會福利署 保護兒童網上課程` **: https://www.childprotectiontraining.hk** \n\n(Version on 7.2025)  10\n\n<!-- p.12 -->\n## `為有特殊學習需要的童軍成員設計及推行 「保護童軍成員免受傷害」課程之指引` \n\n### `一、前言：多元共融與學習多樣性的實踐` \n\n```\n香港童軍總會致力建構一個多元、共融的學習環境，讓每位青少年不論能力、背\n景或限制，均能在童軍活動中享受學習、發展潛能並貢獻團隊。\n```\n\n`在為童軍成員安排活動或考驗時，領袖應理解「共融」並不代表所有成員要以完 全相同的方式完成活動，而是每位成員都應獲得公平的參與機會與相若的挑戰。 針對有特殊學習需要（` Special Educational Needs, SEN `）的童軍成員，領袖應靈活 調適活動設計與評核方法，以保障其學習權利。` \n\n```\n此指引旨在協助前線領袖在設計及執行「保護童軍成員免受傷害」會員章課程時，\n理解並運用合適的調適方式，讓所有成員，包括視障、聽障、自閉症、讀寫障礙、\n專注力困難等，均可安全而有效地學習自我保護與尊重他人。\n```\n\n### `二、原則與責任：調適不等於簡化` \n\n```\n在課程設計與評核過程中，領袖應遵守以下三大原則：\n```\n\n- `學習目標一致： 即使教學形式或活動方式有所不同，所有成員均應掌握相 同的核心概念及準則；` \n\n- `挑戰程度相若： 調適應回應成員的能力與需要，但應避免過度簡化，確保 成員在參與過程中面對合理挑戰；` \n\n- `強調理解與實踐： 重點不在於文字表達或書面答題，而在於成員是否理解 「保護自己與他人」的核心精神，並能在模擬或實際情境中實踐所學。` \n\n```\n前線領袖應與成員本人、家長或照顧者有適當溝通，如有需要亦可諮詢學校老師\n或專業人士。最終調適安排可由負責領袖根據實際情況自行判斷及執行，無需申\n報或獲得批准。\n```\n\n(Version on 7.2025)  11\n\n<!-- p.13 -->\n### `三、特殊學習需要類型與教學支援策略例子` \n\n|`特殊學習需要類型`|`可能出現的困難`|`支援與調適策略`|\n|---|---|---|\n|`視障／弱視`|`無法閱讀圖像或環境提示`|`使用口述說明、觸感圖、標記`<br>`式物件或模型，活動空間加強`<br>`語音提示`|\n|`聽障／失聰`|`無法接收口頭指令、對情`<br>`緒語氣辨識困難`|`以圖卡替代口語、手語、書寫`<br>`溝通，使用明確視覺提示，減`<br>`少背景噪音`|\n|`自閉症光譜`|`對抽象概念理解困難、對`<br>`環境轉變敏感`|`提供結構化活動流程、情境圖`<br>`解、固定座位與程序，使用社`<br>`交故事教學`|\n|`讀寫障礙`|`難以處理書寫任務、拼讀`<br>`困難`|`使用圖像化教材、語音輸入、口`<br>`述答題、減少文字要求`|\n|`專注力不足或過度`<br>`活躍`|`難以維持集中力、過度活`<br>`動或衝動行為`|`縮短活動時間、分段進行活動、`<br>`使用動態教學、清晰規則與即`<br>`時回饋`|\n|`情緒或焦慮障礙`|`對社交情境不安、情緒易`<br>`波動`|`提供預期說明、安心角落、安`<br>`排穩定同伴、鼓勵參與非競爭`<br>`活動`|\n\n(Version on 7.2025)  12\n\n<!-- p.14 -->\n### `四、教學媒介的選擇與不同角色` \n\n```\n前線領袖和家長在協助有特殊學習需要的童軍成員理解「保護童軍成員免受傷害」\n政策內容時，應採取具體、個別化和多感官的教學方式，並根據成員的溝通模式、\n情緒管理能力和學習風格作出安排。以下部分就不同類型需要，提供教學建議及原\n則。\n```\n\n#### `（一）教學媒介的選擇` \n\n|`成員特性`|`推薦的教學媒介`|`備註`|\n|---|---|---|\n|`視障／弱`<br>`視`|`語音講解、實體模`<br>`型、觸感教材（如浮`<br>`雕圖）`|`使用可觸摸的人體模型說明「私密部位」與`<br>`「辨識不恰當身體接觸」概念`|\n|`聽障／失`<br>`聰`|`手語翻譯、圖解教`<br>`材、短片（有字幕）`|`可用圖卡呈現安全情境或「可信任大人」名`<br>`單，避免只用聲音傳達重點`|\n|`認知或語`<br>`言發展遲`<br>`緩`|`簡短句子、重複練`<br>`習、實物教學`|`每次只教授一項重點，加強活動結構（例`<br>`如：先講解、後示範、再重做）`|\n|`自閉症／`|`結構化教學卡、社交`|`提早通知活動內容和地點變動，讓成員有心`|\n|`情緒障礙`|`故事、預告流程表`|`理準備，降低焦慮`|\n|`學習困難`|`分拆小任務、實際操`|`縮短活動時間、使用獎勵制度、明確闡述任`|\n|`或專注力`<br>`不足`|`作、反覆演練`|`務範圍和時間（例如「完成三項任務後可以`<br>`休息」）`|\n\n#### `（二）角色與配合建議` \n\n#### **1.** `誰來教學？` \n\n- `領袖是主要負責人，應清楚解釋重點，例如：身體是自己的、遇事要說「不」、 要懂得尋求可信任的大人幫忙。` \n\n- `如有需要，家長或照顧者可以在家協助，用孩子熟悉的語言或圖像，幫助成 員記憶和理解。` \n\n- `如果成員有特別依賴的人（例如教學助理、社工），領袖可以邀請他們一起 參與，讓學習更連貫。` \n\n(Version on 7.2025)  13\n\n<!-- p.15 -->\n#### **2.** `用小組還是個別教？` \n\n- `如果成員需要較多幫助，可以安排一對一教學，或分開個別解釋。` \n\n- `安排小組活動時，可以配對有經驗的成員作為拍檔，幫助對方一起完成任 務。` \n\n- `活動後，用簡單句子協助成員回顧學習內容，例如：「我學會了說不」、 「我可以尋求老師幫忙」。` \n\n#### **3.** `如何在其他活動中加入「保護童軍成員免受傷害」元素？` \n\n- `可以把「保護童軍成員免受傷害」的重點（如安全、界線、信任）融入遠足、 露營、合作遊戲等活動。` \n\n- `領袖可以在活動期間提問，例如：「你不想參加，應該怎樣說？」、「發生 問題時可以找誰？」` \n\n- `評核成果時，可改用簡單錄音、自畫圖、簡單口述方式，讓成員表達他們所 學。` \n\n#### **4.** `家長可以如何協助？` \n\n- `領袖應提早通知家長活動內容，讓他們在家配合重溫或講故事。` \n\n- `家長可告訴領袖孩子的反應方式及有效的應對方法，例如：「他緊張時會重 複說話，可以溫柔提醒他呼吸」。` \n\n- `鼓勵家長分享孩子的學習情況，有助領袖調整日後教學安排。` \n\n(Version on 7.2025)  14\n\n<!-- p.16 -->\n### `五、調適方法例子：具體教學與評核建議` \n\n#### **1.** `對視障童軍成員（失明）` \n\n- `以語音或觸感資料（如模型）輔助理解身體界線與「私密部位」概念；` \n\n- `所有圖像活動以實物、口頭描述或互動問答方式代替；` \n\n- `情境活動可安排助手協助操作，如模擬說「不」、尋求協助等；` \n\n- `成果表達可透過錄音或面談進行。` \n\n#### **6.** `對聽障童軍成員（失聰）` \n\n- `提供文字教材、圖解資料，並安排熟悉手語的支援者協助翻譯；` \n\n- `重要概念以清楚的圖片與標語說明，例如「尊重界線」、「可信任的大 人」；` \n\n- `所有回應容許以寫字、手語或選擇圖卡完成；` \n\n- `活動時使用視覺提示代替口頭指令（如舉旗、卡片）。` \n\n#### **7.** `對其他` **SEN** `成員（如自閉症、專注力困難、學習障礙）` \n\n- `活動設計上減少同時接收的資訊量，採用分段教學與重複練習；` \n\n- `提供明確的結構與步驟說明（例如流程圖、小任務清單）；` \n\n- `減少文字評核要求，使用選擇題、配對卡、小組討論等方式評核學習成果；` \n\n- `在需要時安排穩定的同伴支持，營造可預測、輕鬆的參與環境。` \n\n### `六、結語：讓每一位童軍成員都能「安全地成長」` \n\n```\n「保護童軍成員免受傷害」會員章考驗的教育意義是為所有童軍成員建立尊重、\n保護與信任的安全文化。身為童軍領袖，我們有責任確保不同能力的成員都能理\n解這些價值，並在適合自己的學習方式下參與考驗。\n```\n\n```\n領袖可使用口述、手語、圖像、互動遊戲等不同的學習方法，靈活地讓所有成員\n掌握核心知識與保護自己及他人的應對技巧，並視乎需要調整活動步驟與評核方\n法。\n```\n\n```\n本會鼓勵所有前線領袖持續學習處理學習多樣性的技巧，如需支援或查詢，歡迎\n於辦公時間聯絡青少年活動署。\n```\n\n```\n參考：「多元共融」之照顧童軍學習多樣性的考驗\n```\n\n(Version on 7.2025)  15\n","03_政策及安全指引/P089-24.md":"---\nsource_file: \"P089-24.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2024** 年 **8** 月 **1** 日 第 **89/2024** 號通告 [政策／指引] \n\n# 海童軍領袖工作坊開辦指引 **Guidelines of Sea Scout Leader Workshop** \n\n為配合「海童軍及海上活動發展」政策第二階段措施之推行，現推出「海童軍領 袖工作坊」開辦指引，讓各單位對開辦上述工作坊之準則有確切瞭解，本通告現列明 「海童軍領袖工作坊」之開辦指引（見附件）。上述指引於 2024 年 8 月 1 日起生效， 獲準開辦之單位在舉行時必須依據有關指引作出安排。 \n\n青少年活動總監 陳狄安\n\n<!-- p.2 -->\n【附件 1】 青少年活動署第 89/2024 號通告 (1/8/2024) \n\n香港童軍總會 青少年活動署 \n\n# 海童軍領袖工作坊開辦指引 \n\n# **Guidelines of Sea Scout Leader Workshop** \n\n|（一）工作坊名稱|： 海童軍領袖工作坊<br>Sea Scout Leader Workshop|\n|---|---|\n|（二）舉辦單位|： 總會及各地域|\n|（三）覈准及簽發開班證書|： 1.總會—<br>青少年活動總監；或<br>副青少年活動總監<br>2.地域—<br>地域總監；或<br>副地域總監（活動與訓練）|\n|（四）工作坊屆別|： 由總會青少年活動署統一發出屆別，各單位必須於舉行最<br>少1個月前將工作坊通告、負責人及導師名單以電郵方式<br>遞交至本署，以便安排編配相關屆別。|\n|（五）參加資格|： 1.年滿18歲及持有有效所屬支部童軍紀錄冊之成員；或<br>2.持有有效領袖委任書或教練員委任證之各級領袖。|\n|（六）工作坊負責人資格|： 由副青少年活動總監或副地域總監（活動與訓練）批准。|\n|（七）訓練時數|： 不少於5小時|\n|（八）證書及成績總表|：1. 完成工作坊之學員由舉辦單位編印及發出工作坊證書，<br>證書編號必須按照總會青少年活動署編配之模式列印，<br>惟不能使用海上活動證書（白咭）發出。<br>2. 成績總表由總會青少年活動署制訂，於通知相關工作坊<br>屆別時與通知書一併發放。工作坊負責人必須於訓練班<br>完成後一個月內，將成績總表送交本署存案。|\n|（九）備註|： 持有此工作坊證書者可符合開辦及繼續註冊海童軍單位<br>「所有領袖必須於獲得委任後一年內取得海童軍領袖工作<br>坊證書」的附加規定。|\n\n1/2\n\n<!-- p.3 -->\n# 「海童軍領袖工作坊」課程大綱 \n\n學習時數：不少於 5 小時 \n\n|階段|項目|內容|建議時間|\n|---|---|---|---|\n|第一階段|1|海童軍歷史及演變|30分鐘|\n|理論部份|2|海童軍訓練模式及方法|45分鐘|\n||3|海童軍訓練的資源|45分鐘|\n||4|海童軍團行政事務及支援|30分鐘|\n||5|童軍標準艇歷史|30分鐘|\n|第二階段|6|海童軍禮儀`(`敬禮及原地動作`)`|15分鐘|\n|實習部份|7|船鐘及水手長笛號|15分鐘|\n||8|儀式佈置及彩旗使用方法|15分鐘|\n||9|升旗及降旗儀式|15分鐘|\n||10|模擬宣誓禮|60分鐘|\n\n*上述建議時間可根據實際需要作出調整。 \n\n# 證明書編號及格式 \n\n總會 ：SAT/SSLW/A/00_/0_ 港島地域 ：SAT/SSLW/H/00_/0_ 九龍地域 ：SAT/SSLW/K/00_/0_ 東九龍地域 ：SAT/SSLW/E/00_/0_ 新界地域 ：SAT/SSLW/N/00_/0_ 新界東地域 ：SAT/SSLW/D/00_/0_ \n\n<!-- Start of picture text -->\n證書英文編碼 學員編號<br>SAT/SSLW/A/00_/0_<br>舉辦單位代號 屆別<br><!-- End of picture text -->\n\n2/2\n","03_政策及安全指引/P089-25.md":"---\nsource_file: \"P089-25.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2025** 年 **8** 月 **1** 日 第 **89/2025** 號通告 [政策／指引] \n\n# 社區應急先鋒訓練班開辦指引 **Guidelines of Community Emergency Responder Course** \n\n為配合積極公民系列–社區應急先鋒章，現推出「社區應急先鋒訓練班」開 辦指引（見附件）。上述指引於 2025 年 8 月 1 日起生效，獲準開辦之單位在舉 行時必須依據有關指引作出安排。 \n\n署理青少年活動總監 張俊彥\n\n<!-- p.2 -->\n【附件】 青少年活動署第 89/2025 號通告 (1/8/2025) \n\n## 香港童軍總會 青少年活動署 \n\n## 「社區應急先鋒訓練班」開辦指引 \n\n- （一）訓練班名稱 ： \n\n   - 社區應急先鋒訓練班 \n\n   - Community Emergency Responder Course \n\n- （二）舉辦單位 ： \n\n   - 總會青少年活動署、各地域及童軍區 \n\n- （三）覈准開班人士 ： \n\n   - 青少年活動總監；或 副青少年活動總監 \n\n- （四）訓練班屆別 ： \n\n   - 由總會青少年活動署統一發出訓練班屆別，各單位必須於發出通告 前最少 1 個月通知青少年活動署，並將訓練班通告、訓練班時間表 及班職員名單（班領導人需提供香港消防處社區應急先鋒導師電子 證書）以電郵方式遞交至本署，以便安排編配相關訓練班屆別。 \n\n- （五）學員人數 ： \n\n   - 12 至 48 人 \n\n- （六）參加資格 ： \n\n   1. 持有有效所屬支部紀錄冊之幼童軍、童軍、深資童軍及樂行童 軍支部成員；或 \n\n   2. 修畢積極公民–社區應急先鋒計劃網上學習。 \n\n- （七）班職員資格 ： \n\n   1. 班領導人及導師必須為本會委任之消防教練員、助理消防教練 員或本會 CPR/AED 導師，及 \n\n   2. 獲香港消防處委任之社區應急先鋒導師。 \n\n- （八）班職員出席要求 \n\n   - ： 教授消防或應急及 CPR/AED 資格的職員與學員比例為 1 比 10 \n\n- （九）訓練班內容 ： 請參閱「社區應急先鋒訓練班」課程大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為準。） \n\n- （十）證書及成績總表 ： \n\n   1. 完成訓練班之學員由班領導人發出訓練班證書。證書由舉辦單 位編印，證書編號必須按照總會青少年活動署編配之模式列印。 \n\n   2. 成績總表由總會青少年活動署制訂，於通知相關訓練班屆別時 與通知書一併發放。班領導人必須於訓練班完成後一個月內， 將成績總表送交本署存案。 \n\n- 總會 ：CER/A/00_/0_ 社區應急先鋒訓練班證書英文編碼 港島地域 ：CER/H/00_/0_ 訓練班屆別 \n\n- 九龍地域 ：CER/K/00_/0_ 東九龍地域 ：CER/E/00_/0_ CER/A/001/01 新界地域 ：CER/N/00_/0_ 新界東地域 ：CER/D/00_/0_ 主辦單位代號 學員編號 \n\n1/2\n\n<!-- p.3 -->\n## 「社區應急先鋒訓練班」課程大綱 \n\n### 學習時數：不少於 2 小時 \n\n### 訓練班目標 \n\n1. 協助在社區推廣防火； \n\n2. 救人自救，在危急事故中有信心地向有需要人士伸出援手； \n\n3. 協助穩定現場情況，防止情況惡化，便利救援行動； \n\n4. 推廣心肺復甦法及自動心臟除顫器；及 \n\n5. 提供社區服務及協助災後復原。 \n\n||內容|建議時間|\n|---|---|---|\n|1.|消防處社區應急先鋒計劃的目標|5分鐘|\n|2.|認識基本的防火方法|25分鐘|\n|3.|明瞭應急知識|20分鐘|\n|4.|認識心肺復甦法及自動心臟除顫器|70分鐘|\n\n2/2\n","03_政策及安全指引/P095-26.md":"---\nsource_file: \"P095-26.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 5\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **9** 月 **1** 日 第 **95/2026** 號通告 [政策／指引] \n\n# 香港青年獎勵計劃更新安排 **Updated Arrangement for The Hong Kong Award for Young People** \n\n本通告取代 2019 年 3 月 15 日發出之青少年活動通告第 26/2019 號及 2024 年 1 月 1 日發 出之青少年活動署第 4/2024 號通告，旨在綜合及更新本會推行「香港青年獎勵計劃」（下稱 「獎勵計劃」或「AYP」）的安排。 \n\n由 2026 年 8 月 15 日起，本會更新參加獎勵計劃的安排及優化行政程序，主要包括： \n\n- (一) 參加安排 \n\n符合年齡資格的青少年成員及青年領袖，可按指定程序參加獎勵計劃。銅章級一般最 低參加年齡為 14 歲；符合指定條件的 13 歲童軍成員，亦可按特別安排申請參加。青 年領袖可按現行安排直接經青少年活動署參加金章級。 \n\n- (二) 迎新講座及組長座談會 參加者迎新講座及執行處支部組長座談會將同時提供網上及實體形式，方便成員及領 袖按需要參加。 \n\n## (三) 行政程序電子化 \n\n參加者申請、成立執行處支部，以及執行處支部組長註冊及更改等程序，將分階段提 供網上辦理方式。首年將設一年過渡期，網上及紙本申請並行使用。 \n\n- (四) 紀錄簿費用 \n\n由 2026 年 4 月 1 日起，獎勵計劃紀錄簿申請費用為港幣 45 元。 \n\n(五) 執行處支部及支部組長安排 本通告同時整合執行處支部的成立、執行處支部組長首次及再次註冊、首次續任豁免， 以及相關職責和行政安排。 \n\n## (六) 童軍進度性獎章同步完成 **AYP** \n\n配合新《童軍訓練綱要》推行，本會由 2026 年 8 月 15 日起試行「童軍進度性獎章與 香港青年獎勵計劃同步完成方案」。按指定安排，考取「童軍高級獎章」可同步完成 AYP 銅章；已完成 AYP 銅章的成員，則可透過「總領袖獎章」同步完成 AYP 漸進銀章。 \n\n以上為主要更新的摘要。有關參加資格、年齡要求、申請程序、迎新講座、紀錄簿、執 行處支部、執行處支部組長註冊、行政程序電子化、過渡安排及同步完成方案等詳細規定， 請各領袖及成員參閱本通告附件。 \n\n有關網上系統、影片、表格、同步完成方案及最新指引，亦將於香港青年獎勵計劃童軍 執行處網頁公佈。 \n\n如對上述安排有任何查詢，請聯絡所屬地域辦事處或總會青少年活動署。 \n\n青少年活動總監 陳狄安 \n\n《香港童軍總會香港青年獎勵 計劃網頁》\n\n<!-- p.2 -->\n【附件】 青少年活動署第 95/2026 號通告 (1/9/2026) \n\n# 香港青年獎勵計劃更新安排 **Updated Arrangement for The Hong Kong Award for Young People** \n\n除另有註明外，本通告所載的新安排由 2026 年 8 月 15 日起生效。 \n\n## (一) 獎勵計劃在本會的推行 \n\n香港童軍總會（下稱「本會」）自 1969 年起成為香港青年獎勵計劃的執行處之一，並以自 主執行處身份在會內推行獎勵計劃。本會成員及青年領袖可透過童軍活動、訓練或其他合 適活動，按獎勵計劃的年齡、活動內容、最低時數、持續期、紀錄及評核要求，完成相應 章級的各科項目。 \n\n本會青少年活動署負責統籌獎勵計劃童軍執行處的整體運作，並透過香港青年獎勵計劃督 導委員會、相關科目事宜委員會、工作小組、地域辦事處及執行處支部推行有關工作。各 地域辦事處將繼續支援其轄下執行處支部及參加者辦理相關行政事宜。 \n\n## (二) 參加資格及年齡 年齡規定 \n\n獎勵計劃一般供 14 至 24 歲的青年人參加。各章級的通常最低參加年齡分別為銅章級 14 歲、銀章級 15 歲及金章級 16 歲。參加獎勵計劃的最後限期為 23 歲生日當天，而所有活 動原則上須於 25 歲生日前完成。如因疾病、意外或其他不能避免的原因未能在限期前完 成，須按獎勵計劃規定提交個案考慮。 \n\n## 銅章級 **13** 歲特別安排 \n\n根據獎勵計劃的安排，執行處可按個別情況，酌情批准未足 14 歲但不少於 13 歲的參加 者，與適齡朋友一同參加銅章級。此項安排主要適用於計劃在未來一年內以小組形式推行 銅章活動的學校、童軍單位或其他青少年團體。 \n\n為便利符合上述情況的本會成員參加計劃，本會接受年滿 13 歲的童軍成員完成參加者迎 新講座及申請獎勵計劃紀錄簿。獲批准參加的成員須與適齡朋友一同以小組形式進行相關 活動，並遵守獎勵計劃及執行處的相關規定。 \n\n## 青少年成員參加辦法 \n\n已宣誓的童軍成員、深資童軍成員及樂行童軍成員，可按其年齡及所屬單位的安排參加獎 勵計劃。參加者原則上須隸屬一個已獲本會批准成立的執行處支部。如所屬童軍旅尚未成 立執行處支部，而其直屬童軍區或地域已成立執行處支部，則可經有關童軍區或地域的執 行處支部參加。 \n\n成員須先完成參加者迎新講座，再將填妥的「香港青年獎勵計劃參加申請表格」（FORM AYP/01），連同所需文件及費用，經所屬執行處支部組長辦理參加申請及紀錄簿手續。 \n\n## 青年領袖參加辦法 \n\n年滿 18 歲而未滿 23 歲，並持有本會有效領袖委任書或教練員委任證的青年領袖，可參加 獎勵計劃金章級訓練及考驗活動，並直接經青少年活動署辦理參加手續。 \n\n青年領袖須先完成參加者迎新講座，再將填妥的「香港青年獎勵計劃參加申請表格」 （FORM AYP/01），連同所需文件及費用交回青少年活動署。 \n\n1/4\n\n<!-- p.3 -->\n## (三) \n\n## 參加者迎新講座 \n\n有意參加獎勵計劃的人士須先完成參加者迎新講座，認識獎勵計劃的目的、各章級及科目 安排、個人目標、導師和評核員安排、活動紀錄及參加者責任等內容，然後方可辦理參加 申請及紀錄簿手續。 \n\n參加者迎新講座將同時提供網上及實體兩種形式。網上迎新講座以影片形式提供；實體迎 新講座亦會繼續舉行，參加者可按需要選擇合適方式完成迎新講座。 \n\n參加者在正式獲接納前進行的活動，原則上不得用作完成獎勵計劃。 \n\n(四) 參加者申請及紀錄簿安排 完成迎新講座後，參加者須提交「香港青年獎勵計劃參加申請表格」（FORM AYP/01），並 按表格所列要求提交相關文件及費用。 \n\n青少年成員的申請須由所屬執行處支部組長確認後，交由所屬地域辦事處處理；青年領袖 的申請則直接交由青少年活動署處理。 \n\n申請獲接納後，參加者將獲發獎勵計劃紀錄簿，並須按獎勵計劃規定，記錄各科活動及由 合適的導師或評核員作出確認。 \n\n(五) 獎勵計劃紀錄簿申請費用 由 2026 年 4 月 1 日起，獎勵計劃紀錄簿申請費用由港幣 35 元調整至港幣 45 元。申請人 須按遞交申請時適用的費用繳交紀錄簿申請費，相關申請表格亦已作相應修訂。 \n\n## (六) \n\n## 童軍進度性獎章與香港青年獎勵計劃同步完成方案 \n\n為配合新《童軍訓練綱要》由 2026 年 8 月 15 日起推行，本會將試行「童軍進度性獎章與 香港青年獎勵計劃同步完成方案」，讓青少年成員在進行日常童軍訓練及活動的同時，利 用符合《童軍訓練綱要》及獎勵計劃標準的同一訓練、活動、紀錄及評核歷程，同步完成 相應的童軍獎章及獎勵計劃章級。 \n\n在同步完成安排下，「童軍高級獎章」可按指定對接安排同步完成獎勵計劃銅章；已完成 獎勵計劃銅章的成員，則可透過「總領袖獎章」的指定對接安排，同步完成獎勵計劃漸進 銀章。 \n\n同步完成方案由 2026 年 8 月 15 日起試行，詳細對接內容、參加安排、紀錄及評核指引， 將上載至香港青年獎勵計劃童軍執行處網頁，請各執行處支部組長及參加者參閱最新公 布。 \n\n(七) 參加者轉換執行處或執行處支部 如參加者原隸屬其他獎勵計劃執行處，而希望轉往香港童軍總會執行處繼續完成餘下項 目，須提交「轉換執行處申請表」（FORM AYP/09）及相關紀錄，並經收到參加者的執行 處支部組長確認後，交由所屬地域辦事處或青少年活動署處理。 \n\n如參加者只轉換本會內的執行處支部，亦須通知原屬及新屬執行處支部組長，並按指定程 序更新所屬單位資料。 \n\n## (八) 成立執行處支部 \n\n有意成立執行處支部的童軍旅、童軍區、地域或其他合資格單位，可提交「成立執行處支 部申請表」（FORM AYP/10）。申請單位須提名最少一名符合資格的領袖或總監擔任執行處 支部組長。 \n\n童軍旅的申請須經旅長確認；童軍區或地域的申請則須經有關區總監或地域總監確認。 \n\n如童軍區或地域執行處支部內有較多參加者長期來自同一童軍旅，有關童軍區或地域應鼓 勵及協助該童軍旅自行成立執行處支部。 \n\n2/4\n\n<!-- p.4 -->\n## (九) 執行處支部組長註冊制度 \n\n執行處支部組長須按本會指定的註冊期辦理註冊。現行註冊期為 2024 年 4 月 1 日至 2027 年 3 月 31 日。下一次註冊期及相關申請安排，將由青少年活動署另行公佈。 \n\n已成立的執行處支部如需新增或更改執行處支部組長，可提交「執行處支部組長註冊或更 改申請表」（FORM AYP/14）。 \n\n## 首次註冊資格 \n\n首次註冊的申請人須年滿 18 歲而未滿 65 歲，持有本會有效領袖、總監或其他獲本會接納 的相關委任，完成執行處支部組長座談會，並隸屬一個已成立執行處支部的單位。如所屬 單位尚未成立執行處支部，須一併提交（FORM AYP/10）。 \n\n## 再次註冊資格 \n\n再次註冊的申請人須繼續符合首次註冊的相關資格，並在註冊期內最少出席一次由總會舉 辦的執行處支部組長工作坊。 \n\n凡首次註冊為執行處支部組長後不足兩年，即因註冊期屆滿而申請再次註冊者，可獲豁免 首次續任時須在註冊期內出席最少一次執行處支部組長工作坊的條件。申請人於其後再次 續任時，仍須符合當時適用的所有再次註冊條件。 \n\n## 組長座談會安排 \n\n執行處支部組長座談會將同時提供網上及實體兩種形式，網上座談會以影片形式提供；實 體座談會亦會繼續舉行，申請人可按需要選擇合適方式完成座談會。 \n\n申請人完成座談會後，可提交執行處支部組長註冊申請。相關資料經所屬單位確認及執行 處處理後，方可正式註冊並擔任執行處支部組長。 \n\n如執行處支部組長的領袖、總監或相關委任失效，或離開原屬單位，其執行處支部組長註 冊資格亦告終止。如希望在其他單位繼續擔任執行處支部組長，須重新辦理相關註冊手續。 \n\n## (十) 執行處支部組長的職責 \n\n執行處支部組長負責協助所屬單位推行獎勵計劃，包括向參加者提供意見及指引、協助訂 立個人目標、安排合適的導師及評核員，以及協助參加者辦理參加申請、紀錄簿、章級完 成及轉換執行處或執行處支部等手續。 \n\n執行處支部組長亦須按獎勵計劃及執行處的規定，協助核對所屬單位參加者的銅章及銀章 各科紀錄，並妥善保存及更新所屬支部及參加者資料，以及按本會指定的時間及方式提交 統計資料。 \n\n## (十一) 行政程序電子化 \n\n- 為簡化行政程序、提升申請及資料處理效率，以及便利各執行處支部、執行處支部組長及 參加者辦理相關手續，本會將分階段推行獎勵計劃行政程序電子化。 \n\n首階段電子化安排包括參加者申請、成立執行處支部申請、執行處支部組長註冊及更改， 以及參加網上迎新講座和執行處支部組長座談會。 \n\n網上系統、指定影片、申請連結及使用指引，將於香港青年獎勵計劃童軍執行處網頁公佈。 \n\n## (十二) 一年過渡安排 \n\n- 為便利各單位逐步適應新的電子化程序，自網上系統正式啟用之日起計一年內，網上申請 及現行紙本表格將並行使用。 \n\n在過渡期內，（FORM AYP/01）、（FORM AYP/10）及（FORM AYP/14）表格均可透過網上 系統提交，或繼續按原有程序以紙本形式交回所屬地域辦事處或青少年活動署。同一宗申 請只需選用其中一種方式提交，毋須同時提交網上及紙本申請。 \n\n3/4\n\n<!-- p.5 -->\n不論採用網上或紙本方式辦理，有意首次註冊為執行處支部組長的領袖均須完成組長座談 會；有意參加獎勵計劃的青少年成員或青年領袖亦須完成參加者迎新講座。 \n\n一年過渡期屆滿後，原則上將全面採用網上系統辦理上述申請及程序。申請人如因特殊情 況未能使用網上系統，可向所屬地域辦事處或青少年活動署查詢。 \n\n## (十三) 查詢 \n\n網上系統、組長座談會影片、參加者迎新講座影片、最新表格、同步完成方案及相關指引， 將於香港青年獎勵計劃童軍執行處網頁公佈。 \n\n如對上述安排有任何查詢，請聯絡所屬地域辦事處或總會青少年活動署。 \n\n|單位|查詢電話|\n|---|---|\n|港島地域|2574 4296|\n|九龍地域|2957 6488|\n|東九龍地域|2957 6466|\n|新界地域|2425 5999|\n|新界東地域|2667 9100|\n|青少年活動署|2957 6411／2957 6417|\n\n4/4\n","03_政策及安全指引/P110-26.md":"---\nsource_file: \"P110-26.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 3\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 青少年活動署 第 電話：2957 6411 / 2957 6417 傳真：3011 3183 電郵：prog@scout.org.hk \n\n**2026** 年 **10** 月 **1** 日 第 **110/2026** 號通告 [政策／指引] \n\n# 寰宇童軍計劃探索課程開辦指引 **Guidelines on Scouts of the World Award - Discovery** \n\n為讓各單位對開辦「寰宇童軍計劃探索課程」之準則有確切瞭解，本通告現列明課程 之開辦指引（見附件）。上述指引於 2026 年 10 月 1 日起生效，獲準開辦課程之單位在舉行 訓練班時必須依據有關指引作出安排。 \n\n青少年活動總監 陳狄安\n\n<!-- p.2 -->\n【附件】 青少年活動署第 110/2026 號通告 (1/10/2026) \n\n## 香港童軍總會 青少年活動署 \n\n- 「寰宇童軍計劃探索課程」開辦指引 \n\n- （一）課程名稱 ：寰宇童軍計劃探索課程 Scouts of the World Award - Discovery \n\n- （二）舉辦單位 ： 總會青少年活動署及各地域 （三）覈准及簽發開班證書 ： 青少年活動總監；或 副青少年活動總監 \n\n- （四）課程屆別 ： 由總會青少年活動署統一發出屆別，各單位必須於舉行前最 少一個月通知本署，並將課程通告、時間表及班職員名單（需 提供寰宇童軍章導師編號）以電郵方式遞交至本署，以便安 排編配相關屆別。 \n\n- （五）學員人數 ： 12 至 32 人 （六）參加資格 ： 持有有效所屬支部紀錄冊之深資童軍及樂行童軍支部成員 （七）班領導人資格 ： 班領導人必須為本會委任之寰宇童軍章導師，並曾任寰宇童 軍計劃探索課程副班領導人或助理班領導人。 \n\n- （八）學習時數 ： 學習時數不少於 21 小時 （九）課程內容 ： 請參閱「寰宇童軍計劃探索課程」大綱 （內容如有更改，以總會青少年活動署公佈最新之通告為 準。） \n\n- （十）證書及成績總表 ： 1. 完成課程之學員由班領導人發出訓練班證書。證書由舉辦 單位編印，證書編號必須按照總會青少年活動署編配之模 式列印。 \n\n- 2. 成績總表由總會青少年活動署制訂，於通知相關課程屆別 時與通知書一併發放。班領導人必須於課程完成後一個月 內，將成績總表送交本署存案。 \n\n總會 ：SWAD/A/00_/0_ 寰宇童軍計劃探索課程證書英文編碼 港島地域 ：SWAD/H/00_/0_ 訓練班屆別 九龍地域 ：SWAD/K/00_/0_ 東九龍地域 ：SWAD/E/00_/0_ SWAD/A/001/01 新界地域 ：SWAD/N/00_/0_ 新界東地域 ：SWAD/D/00_/0_ 主辦單位代號 學員編號 \n\n1/2\n\n<!-- p.3 -->\n## 「寰宇童軍計劃探索課程」大綱 \n\n### 學習時數：不少於 21 小時 \n\n|項目|內容|建議時間|\n|---|---|---|\n|1.歡迎|1. 班務概要<br>2. 互相認識<br>3. 認識全球挑戰<br>4. 簡介寰宇童軍計劃|120分鐘|\n|2.探索及展示|1. 準備社區探索活動<br>2. 社區探索活動體驗<br>3. 展示社區探索活動的反思|570分鐘|\n|3.技能工作坊|建議主題：衝突調解、情緒管理、處理分歧、保護世界<br>遺產等。|270分鐘|\n|4.個人計劃|1. 個人願景<br>2. 自願服務計劃草擬|180分鐘|\n||1. 重溫課程內容||\n|5.檢討及總結|2. 完成課程評價表<br>3. 總結及頒發證書|120分鐘|\n\n參考資料： \n\n1. Scouts of the World Award NSO Implementation Manual (First Edition, October 2015) \n\n2. Scouts of the World Award Activity Sheets (September 2015) \n\n2/2\n","03_政策及安全指引/PC012026C_性罪行定罪紀錄查核.md":"---\nsource_file: \"PC012026C_性罪行定罪紀錄查核.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2026** 年 **2** 月 **1** 日 第 **01/2026** 號通告 [政策／指引] \n\n# 性罪行定罪紀錄查覈 \n\n## **1.** 背 景 \n\n為加強對兒童或精神上無行為能力人士的保障，香港特區政府現已把「性罪行定罪紀錄 查覈」（下稱「查覈」）機制的涵蓋範圍擴展至志願工作者，讓招募從事與兒童或精神上 無行為能力人士有關工作的機構，得以覈查相關人士有否任何查覈機制指明列表中的性 罪行定罪紀錄。 （有關指明列表可按以下連結或到香港警務處性罪行定罪紀錄查覈網頁 查閱：https://www.police.gov.hk/info/doc/scrc/SCRC_List_tc.pdf） \n\n## **2.** 內 容 \n\n香港童軍總會（下稱「本會」）一直致力培育青少年的工作，有責任為青少年成員提供一 個安全的活動環境，保護他們免受任何危害或侵犯。為配合政府擴展查覈機制至涵蓋志 願工作者，由 2026 年 4 月 1 日起，所有總監、領袖（包括教練員）及本會認為有需要之 人士，必須進行查覈，並提交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件作為完成 查覈的證明，以便在處理提名委任或續任時作參考。 \n\n## **3.** 執 行 \n\n- 3.1 首次被提名的總監及領袖 \n\n   - 由 2026 年 4 月 1 日起，首次被提名的總監及領袖（以提名日期計算），在提交委任 提名錶﹙表格 A01﹚時，須連同成年成員註冊表格﹙表格 R01﹚、完成「保護童軍 成員免受傷害」網上自學課程證書及「性罪行定罪紀錄查覈：獨特的查詢密碼」信 件，交予所屬署／地域／屬會處理。如之前未曾進行過相關查覈，可與所屬署／地 域／屬會聯絡索取證明信，用於申請查覈時提交。有關證明信會由本會行政署以電 郵發出。 \n\n## 3.2 現役總監及領袖 \n\n- 現役總監及領袖在續任提交總監及領袖委任聲明書﹙表格 R02﹚時，須把「性罪行 定罪紀錄查覈：獨特的查詢密碼」信件，透過指定的電子表格上載及交予所屬署／ 地域／屬會。如之前未曾進行過相關查覈，請於續任前兩個月或以前與所屬署／地 域／屬會聯絡索取證明信，用於申請查覈時提交。有關證明信會由所屬署／地域／ 屬會以電郵發出。\n\n<!-- p.2 -->\n- 3.3 教練員 \n\n      - 本會行政署於收到教練員註冊及委任表格﹙表格 CR01﹚後，將透過電郵向被提名 人發出遞交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件的電子表格。如之前未 曾進行過相關查覈，可向行政署索取證明信，用於申請查覈時提交。 \n\n   - 3.4 申請查覈的手續 \n\n      - (1) 新申請：申請人可預約前往查覈辦事處；或經香港警務處網上服務辦理申請 查覈手續。如網上申請，遞交申請表、上載文件及繳費後，可預約前往警察 總部或 24 小時指定警署，套取指紋以進行查覈。 \n\n      - (2) 續期：申請人可在有效期內最後三個月透過網上申請續期；但若過了有效期， 合資格申請人便須重新申請。 \n\n      - (3) 有關申請查覈的詳情，請瀏覽香港警務處性罪行定罪紀錄查覈網頁： https://www.police.gov.hk/ppp_tc/11_useful_info/scrc.html \n\n      - (4) 如申請查覈的人士有需要申領查覈費用，可填寫相關的電子申請表格及上載 收據證明，向本會申領查覈的費用，有關費用將於成功完成委任／續任後發 還（只限首次經本會發出機構證明信及新申請查覈之人士）。 \n\n   - 3.5 若被提名委任及續任之總監及領袖（包括教練員），以及本會認為有需要之人士未 能提供「性罪行定罪紀錄查覈：獨特的查詢密碼」信件，本會或未能處理其委任或 續任。 \n\n   - 3.6 查覈結果的有效期為 36 個月，所有總監及領袖（包括教練員）必須於有效期內申 請續期，否則其委任可能會被終止。 \n\n   - 3.7 所有申報的個人資料會依照本會有關保護個人資料政策處理。 \n\n   - 3.8 總會在適當的時候會檢視上述執行程序及更新處理安排。 \n\n**4.** 查 詢 \n\n   - 如對本政策通告有任何查詢，請與行政執行幹事聯絡（電話：2957 6334）。 \n\n香 港 總 監 （盧建業 代行）\n","03_政策及安全指引/PC022026C_性罪行定罪紀錄查核豁免安排.md":"---\nsource_file: \"PC022026C_性罪行定罪紀錄查核豁免安排.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2026** 年 **3** 月 **20** 日 第 **02/2026** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 性罪行定罪紀錄查覈豁免安排 \n\n## **1.** 背 景 \n\n香港童軍總會（下稱「本會」）為加強保護青少年成員免受任何危害或侵犯，並配 合政府擴展性罪行定罪紀錄查覈機制（下稱「查覈」）至涵蓋志願工作者，由 2026 年 4 月 1 日起，所有總監、領袖（包括教練員）及本會認為有需要之人士，必須進行查 核，並提交「性罪行定罪紀錄查覈：獨特的查詢密碼」信件作為完成查覈的證明，以 便在處理提名委任或續任時作參考。有關詳情可參閱政策通告第 01/2026 號。 \n\n## **2.** 豁免安排 \n\n鑑於一些職業的僱主在聘任員工時，已按法定要求進行註冊／審查或要求準僱員 進行性罪行查覈或有關刑事罪行的背景審查，如本會成員從事相關行業，並提交由其 僱主發出的證明信及工作證明，可獲豁免進行查覈。 \n\n## **3.** 可獲豁免之人士及證明文件 \n\n若申請人現正從事下列行業，並已於入職時完成刑事罪行的背景審查或曾經進行 性罪行定罪紀錄查覈，可提供相關證明文件，以供本會考慮豁免進行查覈： \n\n|可獲豁免之人士|必須提交之證明文件|\n|---|---|\n|香港特別行政區政府全職<br>公務員|有效工作證明副本，如：員工證|\n|現職於正規課程的中、小<br>學、幼稚園及幼兒中心的註<br>冊教師*<br>|僱主證明信：由現任僱主簽署及蓋印的證明信，證<br>明申請人為其現職僱員，並確認該人士在入職時已<br>完成刑事罪行的背景審查或在入職時／任職期間已<br>進行「性罪行定罪紀錄查覈」。申請人必須使用本會|\n|現職註冊社工#|指定的證明信範本，範本可於總會網頁下載<br>www.scout.org.hk/tc/circulars-forms/forms/index.html|\n|其他（因工作性質需要，已<br>按現職僱主要求，完成性罪<br>行查覈的現職僱員）|僱主證明信：由現任僱主簽署及蓋印的證明信，證<br>明申請人為其現職僱員，並確認該人士在入職時或<br>任職期間已進行「性罪行定罪紀錄查覈」。申請人必<br>須使用本會指定的證明信範本，範本可於總會網頁<br>下載<br>www.scout.org.hk/tc/circulars-forms/forms/index.html|\n\n<!-- p.2 -->\n註： \n\n- 根據香港法例第 _279_ 章《教育條例》註冊 \n\n- _#_ 根據香港法例第 _505_ 章《社會工作者註冊條例》註冊 \n\n## **4.** 提交方式 \n\n- 4.1 首次被提名的總監及領袖：在提交委任提名錶（表格 A01）時，須連同成年成員 註冊表格（表格 R01）、完成「保護童軍成員免受傷害」網上自學課程證書、「必 須提交之證明文件」副本，交予所屬署／地域／屬會處理。 \n\n- 4.2 現役總監及領袖：在續任提交總監及領袖委任聲明書（表格 R02）時，須連同 「必須提交之證明文件」副本，透過指定的電子表格上載及交予所屬署／地域 ／屬會。 \n\n- 4.3 教練員：在提交註冊及委任表格（表格 CR01）時，須連同「必須提交之證明文 件」副本，交予行政署處理。 \n\n所有申報的個人資料會依照本會有關保護個人資料政策處理。總會在適當的時候會 檢視上述執行程序及更新處理安排。 \n\n倘有查詢，請與行政執行幹事（電話：2957 6334）或所屬單位執行幹事聯絡。 \n\n香 港 總 監 （盧建業 代行）\n","03_政策及安全指引/PC052024C_Scout-Jacket.md":"---\nsource_file: \"PC052024C_Scout-Jacket.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2024** 年 **9** 月 **1** 日 第 **05/2024** 號通告 [政策／指引 ] \n\n# 童軍外套 \n\n本通告取代 _2023_ 年 _12_ 月 _1_ 日所發出之政策通告第 _03/2023_ 號。 \n\n總會推出一款新設計、具防水及透氣功 能的童軍外套，式樣見右圖。 \n\n童軍成員可因應個人體質或天氣情 況，穿著童軍外套出席一般童軍活動及訓 練（例如團集會、升旗儀式、步操及訓練 班等），或戶外活動、海外及內地交流活動。 \n\n童軍外套將於 2024 年 10 月起在童軍物 品供應社發售。有關其售價與詳情，請留 意童軍物品供應社公佈。 \n\n童軍制服毛衣將於 2024年 10月 1日起取消，過渡期為期 1年，至 2025年 9月 30日止。過渡期間童軍成員可繼續穿著制服毛衣作為制服。因應上述 政策，本會將不再生產制服毛衣，童軍物品供應社現有少量制服毛衣的 存貨，如需購買，請向童軍物品供應社查詢。 \n\n香 港 總 監 黎 偉 生\n","03_政策及安全指引/PC062025C_Safe-from-Harm-Policy_C.md":"---\nsource_file: \"PC062025C_Safe-from-Harm-Policy_C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 13\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 電話：2957 6333  傳真：2302 1001 電郵：administration@scout.org.hk \n\n**2025** 年 **6** 月 **1** 日 第 **06/2025** 號通告 [政策／指引] \n\n## 保護童軍成員免受傷害政策 \n\n本通告取代 _2024_ 年 _4_ 月 _1_ 日所發出之政策通告第 _03/2024_ 號。 \n\n### **1.** 目 的 \n\n- 香港童軍總會（下稱「本會」）致力青少年的培育工作。為提供一個安全的童 軍活動環境予參與者及保護他們在參與童軍運動期間免受任何傷害，本會制定 了是項「保護童軍成員免受傷害政策」（下稱「政策」）。 \n\n### **2.** 生效日期 \n\n本修訂政策由2025年6月1日起生效。 \n\n### **3.** 綱 領 \n\n- 《香港童軍總會條例》（香港法例第 1005 章） \n\n- 本會《會章》 \n\n- 本會《政策、組織及規條》 \n\n- 本會之誓詞與規律 \n\n- 本會之童軍運動目的及方法 \n\n- 本會之抱負、使命及價值觀 \n\n### **4.** 政策基礎 \n\n- 世界童軍組織出版的《世界童軍保護青少年免受傷害政策》 \n\n- 世界童軍組織出版的《國家／地區保護青少年免受傷害政策》 \n\n- 世界童軍組織出版的《保護青少年免受傷害自我評核工具》 \n\n### **5.** 釋 義 \n\n- **5.1** 虐 待 \n\n它意指任何危害個人身體／心理／精神健康和發展的行為或疏忽，其大 體上可分為不同的類型及以不同形式呈現，通常包括： \n\n- (a) 身體虐待； \n\n- (b) 性侵犯或性騷擾； \n\n- (c) 心理或精神虐待；及 \n\n- (d) 疏忽照顧。 \n\n附件 **1** 列出更多有關上述虐待行為的資料。\n\n<!-- p.2 -->\n### **5.2** 童軍成年成員政策 \n\n見本會現行的《童軍成年成員政策》。 \n\n### **5.3** 成年人 \n\n包括本會《政策、組織及規條》規條 1.3.3(b)至 1.3.3(f) 所定義的成年成員， 及規條 1.3.5 所定義的 總會附屬成員 。 \n\n### **5.4** 行為守則 \n\n此守則乃由總會透過相關政策通告頒布作為本會成員與其他童軍成員相處 時以及以童軍名義參加非童軍活動時的行為表現準則。 \n\n### **5.5** 傷 害 \n\n就本政策而言，是指任何對個人的生理、心理或精神健康上及其完整性的 有害影響。 \n\n### **5.6** 安全環境 \n\n它促進並支援童軍運動參與者的權益和發展，同時致力於應對和預防有傷 害性的行為；它亦推動對自己和他人的尊重、建構開放、多元、包容、照 顧特殊需求及所有人均享有平等機會。最終，它使童軍成員得以自我發展， 並令青少年和成年人之間可建立正面和良好的人際關係。 \n\n### **5.7** 保護童軍成員免受傷害 \n\n它意指相關的策略、系統和程序用以促進童軍活動中的成員權益、發展和 安全等首要前提，而當中受保障和促進的童軍運動參與者權益包括但不限 於： \n\n- (a) 防止虐待、損害健康或成長； \n\n- (b) 提供安全的成長和發展環境；及 \n\n- (c) 在旅團集會、青少年活動與訓練、其他活動和大型項目中實施安全規 範。 \n\n### **5.8** 青少年 \n\n包括本會《政策、組織及規條》規條 1.3.3(a) 所定義的青少年成員，以及 任何其他參與本會活動之兒童及青少年。 \n\n### **5.9** 青少年活動 \n\n在童軍運動中實施的青少年活動是為青少年提供一切有用有益的學習機會， 透過「童軍方法」親自體驗，貫徹童軍運動目的。詳情見本會現行的《青 少年活動政策》。\n\n<!-- p.3 -->\n### **6.** 政策內容 \n\n- **6.1** 總 則 \n\n   - 6.1.1 本政策的對象是本會的青少年和成年人，與及參與支持童軍活動 的外界持份者。 \n\n   - 6.1.2 本會以滿足童軍成員在童軍運動的需求並促進其權益、發展和安 全為高度優先前提，從而確保成員免受傷害。本會將嚴肅處理任 何懷疑虐待的舉報或徵兆。 \n\n   - 6.1.3 在制定本政策時，已經參考了童軍成年成員政策、青少年活動政 策以及本會的其他相關政策。 \n\n   - 6.1.4 將會不時檢視保護童軍成員免受傷害政策的施行及其訓練，以使 它們與時並進。 \n\n   - 6.1.5 若本政策與香港法例及有關條例有抵觸，應以後者為先。 \n\n### **6.2** 保護童軍成員免受傷害政策框架 \n\n- 6.2.1 本政策由直屬總會執行委員會的行為操守委員會所管轄，而政策 執行責任落在本會成年人 —— 尤其是那些負責領導和管理香港童 軍總會的總會總部成年成員。 \n\n- 6.2.2 本會的各層組織包括總會總部、總會屬會、童軍地域、童軍區及 童軍旅均有責任按照各自的層面和職責，盡力提供相關資源以執 行本政策。 \n\n- 6.2.3 本會將視乎情況與內部／外界的持份者建立和保持聯絡及合作夥 伴關係，以促進保護童軍成員免受傷害及／或更新相關知識。 \n\n### **6.3** 青少年活動 \n\n- 6.3.1 就保護童軍成員免受傷害而言，所有策劃和推行的青少年活動應 能支援青少年的全面發展，當中應包含相應的訓練、激勵和賦權 方式，以讓他們在與其他人包括成年人建立關係時具備自我覺察 意識／自我保護意念／自信心，並有相應的措施以保護他們免受 傷害及舉報任何與此政策不乎的行為。 \n\n- 6.3.2 因應本政策，青少年活動範疇下的旅團集會、青少年活動與訓練、 其他活動和大型項目應就個別情況進行評估以識別風險，從而開 展足夠的監控及檢討機制。 \n\n- 6.3.3 參與旅團集會、青少年活動與訓練、其他活動和大型項目的青少 年之醫療、飲食和發展需求資料，應由在該等青少年活動中負責 青少年權益的成年人以存取受限的方式保存。 \n\n- 6.3.4 作為青少年之教育／創意／社交機遇不可或缺的一部分，本會的 網上媒體和社交平臺應是安全的。 附件 **2** 列出了一些安全上網的 良好行為，以作參考。 \n\n- 6.3.5 應按照本會的規定和指引安排和執行設備和設施的安全檢查，而 有關規定和指引應適時作出檢視／更新。 \n\n- 6.3.6 本會已就活動安全相應制定有關的指引和通告，並會定期檢視／ 更新；有關指引和通告可於本會網頁查閱。 \n\n### **6.4** 童軍成年成員 \n\n- 6.4.1 本會成年人有責任細閱和理解本政策，從而致力保護青少年。 \n\n- 6.4.2 本會成年人應遵守本會現行的行為守則。 \n\n- 6.4.3 本會將因應情況執行以下一項或多項程序，以招募、甄選、委任和\n\n<!-- p.4 -->\n續任成年成員： \n\n- (a) 背景檢查； \n\n- (b) 刑事罪行聲明：包括性侵犯及／或侵犯青少年相關罪行； \n\n- (c) 面談。 \n\n- 6.4.4 本會所有領袖（即總監、領袖及教練員）和專業領袖／受薪職員必 須接受「保護童軍成員免受傷害」的訓練。就此，首次被委任的領 袖或專業領袖／受薪職員，須於被委任／聘任前完成「【保護童軍 成員免受傷害】網上自學課程」並取得訓練證書。在本政策生效前 已被委任的領袖及專業領袖／受薪職員，須盡快完成上述課程並取 得訓練證書，而領袖最遲須於其首次被續任前取得訓練證書。如 「【保護童軍成員免受傷害】網上自學課程」有重大修改時，則所 有領袖、專業領袖／受薪職員應按照本會的要求完成更新的課程並 取得相關訓練證書。領袖在續任時須申報已閱讀並同意遵守《保護 童軍成員免受傷害政策》及《行為守則》，而專業領袖／受薪職員 亦須每年作出同樣申報。 \n\n- 6.4.5 至於會務會員，他們須透過會務委員資訊套包瞭解本政策及保護童 軍成員免受傷害的知識。鑑於其角色與領袖有別，因此，本會鼓勵 但並不強制他們取得上述訓練證書。惟若他們因應情況需在童軍活 動中與青少年有頻密的接觸，及／或履行領袖相關的職責，則須要 取得該訓練證書。 \n\n- 6.4.6 領袖和專業領袖／受薪職員以外的本會成年人與及外界持份者，亦 須備悉及瞭解本政策。 \n\n- 6.4.7 成年人應在旅團集會、青少年活動與訓練、其他活動和大型項目期 間，留意青少年的安全和權益，以確保他們時刻獲得適當的照顧。 相關的「保護青少年所應採取的行動」見 附件 **3** 。 \n\n- 6.4.8 成年人應向懷疑遭受虐待的青少年提供協助和支援。 \n\n- 6.4.9 應按照《童軍成年成員政策》的成年成員績效檢視推行時間框架條 款，把保護童軍成員免受傷害的相關元素適當地納入成年成員績效 檢視範疇內。 \n\n- 6.4.10 木章訓練系統的核心組成部分應包含保護童軍成員免受傷害的訓練， 並在有需要時提供專門的訓練課程。就保護童軍成員免受傷害的訓 練包括「【保護童軍成員免受傷害】網上自學課程」及其訓練證書， 訓練署將負責掌管及適時作出檢視使相關訓練與時並進，青少年活 動署會就此提供意見。訓練署會不時將保護童軍成員免受傷害的相 關資料上載總會網頁，亦會定期提供保護童軍成員免受傷害的有關 活動／訓練，以俾成員重溫。 \n\n### **6.5** 事件的舉報及處理 \n\n- 6.5.1 任何知曉涉嫌虐待或疏忽照顧事件的人士，應在遵守政策保密要求 的同時，及時透過提交填妥的「保護童軍成員免受傷害事件報告表 格」 （附件 **4** ） 以舉報。如果該事件明顯涉及刑事罪行，則應在切 實可行的情況下盡快向警方報案。 \n\n- 6.5.2 總幹事被指派為「保護童軍成員免受傷害主任」；於其缺席期間或 香港總監認為適當時，副總幹事可擔當該等職務。 \n\n- 6.5.3 於童軍旅發生的事件或懷疑事件，應向旅長（或旅負責領袖）舉報， 而其應立即把事件轉介予相關區總監；必要時，可以直接向區總監 舉報。至於其他童軍單位，應把事件向相關助理香港總監舉報，或\n\n<!-- p.5 -->\n必要時，直接向相關助理香港總監的上級總監舉報。涉及專業領袖 ／受薪職員的事件，則應向副總幹事／相關助理總幹事舉報。對於 涉及總會高層的事件，舉報安排如下： \n\n|事件中涉及的關鍵人物|收件人|\n|---|---|\n|香港總監|總會會長|\n|副香港總監、助理香港總監、總幹事|香港總監|\n|副總幹事、助理總幹事|總幹事|\n\n- 6.5.4 所有舉報應立即轉介予保護童軍成員免受傷害主任處理。 \n\n- 6.5.5 收到轉介後，保護童軍成員免受傷害主任應著手協調安排以下事宜： (a) 在 3 個工作天內以書面形式向舉報者確認收悉； \n\n   - (b) 就受害者的安全和權益進行初步評估； \n\n   - (c) 採取所有必要措施包括但不限於在香港總監同意下立即要求被 指控者／涉嫌人士休假、暫調其他職務或暫停其會籍，以防止 受害者被進一步傷害及避免事件惡化； \n\n   - (d) 為受害者提供即時和持續的支援； \n\n   - (e) 檢視受害者及／或涉嫌人士在本會的紀錄； \n\n   - (f) 如涉及未滿 18 歲的青少年，知會其父母／監護人有關事件； \n\n   - (g) 提供有關個案資料予助理香港總監（傳訊及公共事務），以便 其制訂應對回覆公眾或傳媒的查詢；及 \n\n   - (h) 在有需要時成立調查小組以調查事件。 \n\n   - 在有需要時，應徵求本會法律顧問的意見。如果事件明顯涉及刑事 罪行，則應安排向警方報案。 \n\n- 6.5.6 如本文第 6.5.5(h)項所述，由香港總監委任的調查小組應在認收事 件轉介的兩星期內成立。調查小組的調查將絕對保密並按事件的情 況以合理可行的方式進行，當中可能包括接見 1舉報者、受害者、 被指控者及／或涉嫌人士。因應情況及在受害人或其父母／監護人 同意下，可要求其他人士作證。被指控者或涉嫌人士應有充分的機 會就有關指控和指責表達他們的辯証／回應／觀點。 \n\n- 6.5.7 與受害者進行會面時，應在可靠、無慮及適當的環境下，並由與受 害者同性別人士陪同，避免令受害者尷尬，以使其能夠在無障礙的 情況下講述事件。未滿 18 歲的青少年應由其父母或監護人陪同； 如他們未能出席，則由與該青少年同性別的註冊社會工作者或恰當 的成年人士陪同。 \n\n- 6.5.8 除非有充分的理由和獲香港總監同意，否則不應透露舉報者和受害 者的身份。 \n\n- 6.5.9 經調查後，調查小組應盡快把調查報告經保護童軍成員免受傷害主 任提交予香港總監審視。該報告應包括所需的後續和監管行動，並 一般應於調查小組成立後 3 個月內完成，以及向受害者／舉報者／ 被指控者／涉嫌人士交待調查結果。相關人士可就調查小組的調查 結果，在 30 日內以具體理據／實證向香港總監提出書面上訴，而 香港總監就此而作的決定是為最終的裁決。 \n\n- 6.5.10 就按本文第 6.5.9 項所提出的上訴，香港總監可以考慮交由其委任 的臨時行為及操守專案小組跟進。專案小組應覆核該個案，並就需 要作進一步調查，從而向香港總監提出建議。香港總監會就此作出 最終裁決和在有需要時把事件知會總會執行委員會。 \n\n> 1 透過實體面談及／或書面方式。\n\n<!-- p.6 -->\n- 6.5.11 在有需要時，香港總監可就個案及／或上訴個案向行為操守委員會 徵詢意見。行為操守委員會可在有需要時邀請相關人士出席會議， 作特定的討論。 \n\n      - 6.5.12 一般而言，處理調查及上訴個案應在小組成立三個月內完成所有程 序，並發出覆函。如在三個月（或經香港總監所批准的延長期限） 內未能就事件完成調查和作出結論，應立即通知香港總監和保護童 軍成員免受傷害主任有關情況，以尋求指示，直至完成個案為止。 \n\n      - 6.5.13 如需要採取制裁行動，則應按「處理不當行為及投訴程序」的相關 條文處理。 \n\n      - 6.5.14 任何人士如作出無根據的舉報，本會將保留追究的權利包括索取損 害賠償。 \n\n      - 6.5.15 如事件已向警方報案，「保護童軍成員免受傷害主任」於獲香港總 監同意後，可將調查小組的調查推遲至法律程序完成後才進行或不 安排調查。 \n\n   - **6.6** 機 密 \n\n      - 6.6.1 所有保護童軍成員免受傷害個案皆應保密，並應盡力確保機密資料 的安全；但是，不應容許保密性凌駕於保護相關人士免受傷害的權 利。任何情況下，有關保護童軍成員免受傷害個案的調查報告都是 絕對機密，不得發布。 \n\n      - 6.6.2 必須謹慎處理所有涉嫌／確認保護童軍成員免受傷害個案的披露、 報告和紀錄。僅限於按需知密的原則及防止童軍成員受到傷害的情 況下，纔可分享該等機密資料。除非可以確保保密性，否則在任何 情況下都不應討論該等機密資料。 \n\n      - 6.6.3 所有與事件有關的資料、紀錄和文件（包括其調查報告）都應由 「保護童軍成員免受傷害主任」以存取受限的方式妥為保存於總會 的機密檔案內。 \n\n**7.** 行 政 \n\n   - 本政策的推行事宜由保護童軍成員免受傷害小組協調。小組由副香港總監（管 理）領導，成員包括：保護童軍成員免受傷害主任、助理總幹事（政務）及因 應需要而任命的其他人士。 \n\n**8.** 檢視及修訂 \n\n為反映社會的演變及配合童軍運動參與者之需要，本政策最少每五年或按需要 作出檢視及修訂，以優化其內容，與時並進。 \n\n**9.** 查 詢 \n\n如對本政策有任何查詢，請致電2957 6327與助理總幹事（政務）聯絡。有關 「【保護童軍成員免受傷害】網上自學課程」和訓練證書的事宜，請致電 2957 6472與訓練執行幹事聯絡。 \n\n副香港總監（管理） \n\n盧 建 業\n\n<!-- p.7 -->\n附件一 \n\n## 香港童軍總會 保護童軍成員免受傷害政策 \n\n## 各種形式的虐待 \n\n一般而言，虐待是指任何危害個人身體／心理∕精神健康和發展的行為或疏忽。 在社會規範和專業知識相結合的基礎上，該等行徑被認為具破壞性的。虐待通 常是由某些個體因其屬性（例如年齡、地位、知識、組織）而處於不同權勢位 置所犯下（無論是單獨地或集體地）從而使他人受傷害。這情況不僅出現於父 母／監護人，還包括受委託照顧和管教青少年的任何人；就童軍運動而言，則 泛指成年人。 \n\n以下為各種虐待形式的廣義資料： \n\n- (a) 身體虐待； \n\n- (b) 性侵犯或性騷擾； \n\n- (c) 心理或精神虐待；及 \n\n- (d) 疏忽照顧。 \n\n當中，欺淩是持續虐待的一種相當常見方式。 \n\n身體虐待 ：指對個體使用暴力或以其他方式（例如拳打腳踢、以物件擊打、下 毒、使窒息、灼傷、搖晃等）令其身體受傷或痛苦，而且有明確認知或合理懷 疑這些傷害並非意外造成的。 \n\n性侵犯 ：指強迫或誘使他／她參與性活動的任何行徑以對該個體作出性方面的 利用或侵犯，而他／她因心智發展未成熟並沒有同意或不能完全明白或理解這 些發生在其身上的性活動。這些性活動行徑包括有直接身體接觸或沒有身體接 觸的行為。性侵犯可能發生在家中／家外或透過網上社交平臺以個別或有組織 的方式進行，包括以獎賞或其他方式引誘他／她加以侵犯。 \n\n性騷擾 ：指一個人： \n\n- 對另一人提出不受歡迎的性要求，或提出不受歡迎的獲取性方面的好處的要 求；或就另一人作出其他不受歡迎並涉及性的行徑，在有關情況下，一名合 理的人在顧及所有情況後，應會預期該另一人會感到受冒犯、侮辱或威嚇； 或 \n\n- 自行或聯同其他人作出涉及性的行徑，而該行徑對另一人造成有敵意或具威 嚇性的環境。\n\n<!-- p.8 -->\n心理或精神虐待 ：指危害或損害個人身心健康（包括情緒、認知、社交或身體 發展）的重複行為、互動、及／或極端事件。當中例子包括鄙視性、恐嚇性、 使孤立、剝削性／破壞性、或否定性的情緒反應。這等行徑會即時或長遠損害 個人的行為、認知、情感或生理上的表現。 \n\n疏忽照顧 ：指嚴重或長期地忽視個人的基本需要（例如必需的飲食、衣服、住 宿、教育或醫療照顧），以致危害或損害他／她的健康或發展（包括非生理因 素引致的不正常成長）；或沒有預防他／她身體受傷／受痛苦；或沒有防止他 ／她面對本可避免的極大危險（包括饑寒、長期缺乏照料、被強迫從事與其體 力或年齡不相稱的工作等）。 \n\n更多資料見下列相關網址： \n\n(a) 香港特別行政區政府平等機會委員會 (https://www.eoc.org.hk/compass/tc/) \n\n(b) 香港特別行政區政府社會福利署 (https://www.swd.gov.hk/vs/index_c.html#s7)\n\n<!-- p.9 -->\n附件二 \n\n## 香港童軍總會 保護童軍成員免受傷害政策 \n\n## 安全上網的良好行為 \n\n互聯網具有將人們距離拉近的力量，亦是使世界變得更美好的工具及訊息之重 要渠道。但是，互聯網也帶來不可接受的問題（例如：網絡欺凌、騷擾、盜用 身份和濫用）。在社交媒體、遊戲平臺甚或童軍網絡上聊天和發帖時，也可能 會遇到以上問題。 \n\n作為童軍成員，應避免作出令人難以接受的網上行為，包括但不限於：竊取個 人資料、發送／發布／分享有關某人或某事的虛假訊息、持續接觸已表明拒絕 聯繫的人、發送不當的言論／照片予別人或要求其同樣這樣做、和發送威脅或 仇恨言論。 \n\n其他安全上網的良好行為包括： \n\n### **(a)** 尊重和友善 \n\n保持積極的態度，並銘記童軍誓詞和規律，以友善和尊重的態度對待他人。 \n\n### **(b)** 注意分享資訊的內容 \n\n不要在網上分享個人資料；考慮一下，希望分享和保密甚麼資訊。核實消息來 源，並確保所分享的資訊都是真確及事實。 \n\n### **(c)** 不要與網友會面 \n\n即使已經與網友已交談了一段長時間，他們仍然只是陌生人。如考慮與網友會 面，應格外小心，並應由其他人陪同。 \n\n### **(d)** 保障個人資料 \n\n切勿在互聯網上發布個人資料。檢查社交媒體上的「隱私設置」，並應將其設 置為私密級別，從而只與所揀選及認為可靠的人分享個人資料。 \n\n### **(e)** 作出恰當反應 \n\n遠離令人沮喪或困擾的內容和厭惡的交談；亦要避開暴力或色情的內容。如果 對網上的帖文感到難受，應向有關社交媒體管理員報告。對於不良行為也要採 取相同的行動。 \n\n成年人亦應遵守以下守則： \n\n- (a) 注意個人言行舉動，避免一些可令他人尤其是青少年誤會的行為和言詞。為 保護自己，不要單獨與青少年在網上交談。 \n\n- (b) 避免以任何形式的社交媒體私下與青少年交流。 \n\n- **(c)** 經常提醒青少年與網友分享個人資料的危險。\n\n<!-- p.10 -->\n附件三 \n\n## 香港童軍總會 保護童軍成員免受傷害政策 \n\n## 保護青少年所應採取的行動 \n\n成年人在童軍運動中擔當亦師亦友的角色，所以其行為必須值得信賴並符合家長 和社會的信任和期望，而保護青少年免受傷害亦是成年人的責任。因此，成年人 應遵守以下守則。 \n\n- (1) 在童軍活動期間或日常與青少年接觸時應保持警惕，留意青少年是否有不正 常現象或值得懷疑的虐待情況（例如：在行為或情緒上有異常的表現，或是 身體有顯著的損傷或傷痕等）並視乎情況向有關當局作出舉報。 \n\n- (2) 教導青少年學習保護自己： \n\n   - (a) 明白何謂「侵犯」行為，時刻對潛在危機保持警覺性，提高自我保護 的意識；及 \n\n   - (b) 如不幸遭受侵犯，必須立即向父母或信任的領袖舉報。 \n\n- (3) 除非遇有不可預見的情況，否則在青少年進行童軍活動時，應至少有兩名成 年人在場。注意個人言行舉動，避免一些可令青少年誤會的行徑、行為、言 詞，尤其是身體接觸。 \n\n- (4) 不可與青少年單獨社交約會，特別是與異性成員。 \n\n- (5) 尊重青少年的私隱。 \n\n- (6) 除了本會《政策、組織及規條》容許的情況外，不論任何支部，應至少有一 名與青少年同性別的領袖。 \n\n- (7) 進行童軍活動（包括集會，訓練班和各種戶外活動等）時，應遵守以下規則： (a) 渡宿活動： \n\n      - 如沒有與青少年同性別的領袖參與，則不應讓該等青少年參加。 \n\n      - 除非有需要特別照顧或監督年幼的青少年，否則嚴禁與青少年共用 房間或營帳。 \n\n      - 男女性參加者必須分開房間或營帳，亦不可進入異性的房間或營帳。 至於露營，如環境許可，男女營區亦應分隔開。如發覺有參加者違 反分開房間或營帳的規定，應立即制止和處理，不容忽視。\n\n<!-- p.11 -->\n- 男女浴室及衛生間必須分隔開。若環境不許可，亦必須作出適當安 排，以免產生誤會或尷尬。 \n\n   - 青少年更換衣服或洗澡時，應予以迴避，除非有需要特別照顧或監 督年幼的青少年，並應由同性別的成年人負責。 \n\n   - 勿在睡眠、更衣或洗澡的地方使用任何類型的錄影／錄音儀器。 \n\n- (b) 所有小隊露營、遠足或戶外活動，事先須得到團長或旅長／旅負責領 袖的批准，並須記錄在案。 \n\n- (c) 穿著適當的服裝，避免不必要的暴露。 \n\n- (d) 嚴禁體罰和任何可引致青少年感到不安、焦慮、尷尬、被侮辱的行為 或言詞。 \n\n- (e) 成年人不可誘使或強迫青少年從事與其年齡或體力不相稱的工作，或 任何非法的活動。 \n\n- (f) 遵照本會有關活動安全的所有守則。\n\n<!-- p.12 -->\n附件四 \n\n# 機 密 \n\n## 香港童軍總會 \n\n## 保護童軍成員免受傷害事件報告表格 \n\n［由收件人填寫］ \n\n### 受影響人士的個人資料： \n\n收件日期： 姓名： 簽署： \n\n|姓名：|出生日期或年齡：|\n|---|---|\n|性別：|童軍成員編號（如知悉）：|\n|童軍成員身份及所屬單位資料：|父母／監護人的姓名（如知悉）：|\n|聯絡電話 （如知悉）：|電郵地址（如知悉）：|\n|地址（如知悉）：||\n\n### 舉報內容： \n\n### 請提供事件／舉報的詳情 \n\n### 其他相關資料：\n\n<!-- p.13 -->\n|涉嫌人士的個人資料：<br>姓名：|童軍成員身份及所屬單位資料：|\n|---|---|\n|性別：|與受影響人士的關係：|\n|聯絡電話（如知悉）：|電郵地址（如知悉）：|\n|地址（如知悉）：||\n|舉報者的個人資料：<br>||\n|姓名：|童軍成員身份及所屬單位資料：|\n|性別：|與受影響人士的關係：|\n|聯絡電話（如知悉）：|電郵地址（如知悉）：|\n|地址（如知悉）：||\n|簽署：|日期：|\n|舉報者||\n|［由保護童軍成員免受傷害主任填寫］<br>收件日期：||\n|採取的行動：||\n|簽署：|日期：|\n|保護童軍成員免受傷害主任||\n|注意：填妥的表格應由保護童軍成員免受傷害主|任保存|\n","03_政策及安全指引/PC092025C_有關保障成員之政策及指引.md":"---\nsource_file: \"PC092025C_有關保障成員之政策及指引.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2025** 年 **8** 月 **15** 日 第 **09/2025** 號通告 [政策／指引] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 有關保障成員之政策及指引 \n\n## **1.** 背 景 \n\n   - 本會為保障童軍成員的利益及安全，會進行相關的風險評估，並依據評估結果及／或按 總會執行委員會的指示，制訂一系列的政策及指引，讓童軍成員在進行任何童軍活動及 ／或工作時有所依循。 \n\n**2.** 適用的政策及指引 \n\n現行生效的政策及指引請參閱附件。本會將適時對該等政策及指引作出檢視及修訂，以 配合環境的變遷及童軍成員的需要，加強對成員的保障。一般而言，每年會更新本附件 表列的政策及指引一次。 \n\n**3.** 執 行 \n\n   - 3.1 本文第 2 項所列之政策及指引已上載至總會網頁供童軍成員查閱。如在執行上遇有 困難，應按個別情況，依循以下程序作跟進處理： \n\n      - (1) 如在執行上遇有不明白／疑問的地方，可向單位之執行幹事／相關總監提 出，尋求解述／解決方法。 \n\n      - (2) 如個案情況複雜／嚴重，應向有關單位之助理香港總監匯報事件，並依循其 指示處理。 \n\n      - (3) 如有需要，負責之助理香港總監應把有關情況提交予香港總監諮議會商討； 因應事件的複雜／嚴重性及／或香港總監諮議會的意見，香港總監會考慮把 事件提交至總會執行委員會討論。 \n\n   - 3.2 總會在適當的時候會檢視及討論上述執行程序，以更新處理安排。 \n\n**4.** 查 詢 \n\n如有查詢，請與行政執行幹事聯絡（電話：2957 6334）。 \n\n副香港總監（管理） 盧 建 業\n\n<!-- p.2 -->\n【附 件】 \n\n(更新於 2025 年 7 月 1 日) \n\n|項|目|通告／指引|\n|---|---|---|\n|1. 意|外|- 童軍活動的意外通報指引（活動指引第02/2021號）|\n|2. 安|全|- 安全使用酒精／火酒作為燃料（活動指引第03/2018號）<br>- 戶外活動安全要則及須知（活動指引第05/2018號）<br>- 童軍海上活動安全指引（活動指引第07/2018號）<br>- 進行童軍先鋒工程活動安全須知（活動指引第03/2021號）<br>- 保護童軍成員免受傷害政策（政策通告第06/2025號）|\n|3. 天|氣|- 惡劣天氣及空氣污染應變措施（活動指引第04/2018號）|\n|4. 健|康|- 預防禽流感（活動指引第08/2018號）<br>- 預防流行性感冒 （活動指引第09/2018號）<br>- 預防蚊患措施 （活動指引第10/2018號）|\n|5. 保|險|- 「公眾責任保險」及「團體人身意外保險」（行政署通告第07/2025號）|\n|6. 利|益|- 接受外間機構提供購物及服務優惠的原則（政策通告第06/2018號）<br>- 申報利益政策（政策通告第13/2018號）<br>- 索取或收受利益（政策通告第14/2018號）<br>- 童軍成員參與商業活動的指引（政策通告第19/2018號）|\n|7. 個|人私隱|- 香港童軍總會個人資料私隠政策聲明（政策通告第11/2018號）|\n|8. 政|治|- 童軍成員不涉及政治活動政策（政策通告第20/2018號）|\n|9. 刑|事罪行|- 總監及領袖續任─有關保護童軍成員免受傷害及刑事罪行聲明（政策<br>通告第04/2021號）|\n|10. 投<br>當|訴及不<br>行為|- 處理不當行為及投訴程序（行政署通告第08/2024號）|\n|11. 平|等機會|- 平等機會政策（政策通告第28/2018號）|\n|12. 資|訊科技|- 資訊科技保安（政策通告第02/2023號）|\n","03_政策及安全指引/PC152018C.md":"---\nsource_file: \"PC152018C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n政策通告第 15/2018 號 2018 年 1 月 1 日 \n\n<!-- Start of picture text -->\n香 港 童 軍 總 會<br><!-- End of picture text -->\n\n電話：2957 6333 傳真：2302 1001 \n\n# 《世界童軍青少年活動政策》及《世界童軍青少年參與政策》 \n\n本通告取代 _2016_ 年 _9_ 月 _15_ 日所發出之青少年活動通告第 _100/2016_ 號 及青少年活動通告第 _26/2015_ 號。 \n\n為密切配合世界童軍運動之青少年活動及參與政策，青少年活動署已完 成翻譯世界童軍組織於 2015 年 2 月 12 日公佈之 “World Scout Youth Programme Policy” （《世界童軍青少年活動政策》） 及 “World Scout Youth Involvement Policy” （《世界童軍青少年參與政策》），各級領袖及童軍成員 可於下列網址分別下載參閱： \n\n中文版： \n\n1. http://www.scout.org.hk/article_attach/26623/YouthProgrammePolicy_TW-Final.pdf \n\n2. http://www.scout.org.hk/article_attach/26622/YouthInvolvementPolicy_TW-Final.pdf \n\n英文版： \n\n1. http://www.scout.org.hk/article_attach/23437/YouthProgrammePolicy_EN_FINAL.pdf \n\n2. http://www.scout.org.hk/article_attach/23440/YouthInvolvementPolicy_EN_FINAL.pdf \n\n- 《世界童軍青少年 《世界童軍青少年 “World Scout Youth “World Scout Youth 活動政策》 參與政策》 Programme Policy” Involvement Policy” \n\n青少年活動總監 \n\n劉彥樑\n","03_政策及安全指引/PC_2023_02_ITSecurity_C.md":"---\nsource_file: \"PC_2023_02_ITSecurity_C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 4\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 電話：2957 6433 傳真：2302 1001 電郵：it@scout.org.hk \n\n**2023** 年 **10** 月 **1** 日 第 **02/2023** 號通告 [政策] \n\n# 資訊科技保安 \n\n本通告取代 2019 年 12 月 15 日發出之政策通告第 03/2019 號。 \n\n2. 香港童軍總會（下稱「本會」）非常重視資訊科技保安及個人資料私隱保障，各童 軍單位及成員在使用資訊系統、電腦及行動裝置時，均有責任保障本會電子資料的安 全，以防止任何遺失、外洩和誤用的情況。 \n\n3. 本通告列出本會對資訊科技保安的原則及基本要求，各童軍單位及成員在處理本 會電子資料時，必須注意和貫徹遵守，以確保有關資料得到適當的管理及在安全的情 況下使用。 \n\n## 資訊科技保安核心原則 \n\n4. 在處理、傳送和儲存童軍單位或與其相關的電子資料時，須按以下原則確保資料 的機密性、完整性和可用性： \n\n   - 機密性：按「需要知道」原則設定用戶及使用者的存取權限，確保有關資料只 可在獲授權的情況下存取。 \n\n   - 完整性：確保資料的準確性、一致性及可靠性，以免未經授權下受到更改。 \n\n   - 可用性：確保資訊系統、電腦及行動裝置能夠全面及正常運作，讓獲授權人士 可即時可靠地取用所需的資料。 \n\n## 個人資料私隱 \n\n5. 在本會活動和日常運作中處理電子個人資料時，須遵守本會個人資料私隱政策。 詳情請參照政策通告第 11/2018 號《香港童軍總會個人資料私隱政策聲明》。 \n\n## 電子資料保安級別 \n\n6. 本會電子資料分類為以下四個資訊保安級別，以便採取相應的資訊科技保安措 施： \n\n|保安級別|分類原則|例子|\n|---|---|---|\n|公開|適用於可開放給公眾查閱的資料。披露此類<br>資料不會對本會／童軍單位造成任何風險。|童軍的一般資訊；本會網<br>站公開的政策、指引、通<br>告和統計資料|\n|內部|適用於本會特定成員內部參閱的資料，以及<br>與合作夥伴分享的非敏感運作資料。披露此<br>類資料可能會產生一般程度的不良影響，但<br>不會對本會／童軍單位造成嚴重損害。|訓練資訊、成員手冊、內<br>部政策及運作程序|\n|限閱|適用於特定授權人員纔可存取的敏感資料。<br>未經授權披露、修改或銷毀此類資料可能會<br>給成員帶來不便，對本會／童軍單位的運作<br>產生不良影響，以至一定程度的經濟損失或<br>本會／童軍單位聲譽的損害。|成員的個人資料及童軍<br>記錄（如：出生日期／電<br>話號碼／地址／訓練記<br>錄）；招標文件及記錄|\n\n<!-- p.2 -->\n例子 \n\n保安級別 分類原則 例子 機密 適用於性質非常敏感且受嚴格限制的資料。 成員的敏感個人資料 這類資料對本會／童軍單位的運作極為重 （如：香港出生證明書／ 要，遺失、損壞或未經授權的披露可能會對 香港身份證號碼）；本會 本會／童軍單位的聲譽和運作造成重大不利 ／童軍單位的敏感管理 影響，並會給資料當事人（即屬相關個人資 資料 料的當事人本人）帶來不便、威脅或損失。 \n\n7. 本會各系統／資訊負責人有責任將轄下電子資料分類為適當的資訊保安級別，並 以「需要知道」原則授予合適人士相應的存取權限。一般而言，如資訊屬「內部」、「限 閱」或「機密」級別，系統／資訊負責人必須在有關資料的適當位置上清楚列明其資 訊保安級別，以提示各使用者採取相應的資訊科技保安措施。 \n\n## 使用者責任 \n\n8. 童軍單位及成員不時使用電腦、資訊系統、互聯網、電郵、社交媒體、即時通訊 軟件、雲端儲存等處理和分享他們的資料。他們必須透過以下各項確保身處的環境並 無保安風險，並致力保護資料（包括但不限於個人資料）的安全及私隱性： \n\n   - (a) 確保妥善的保安及私隱設定。 \n\n   - (b) 只按「需要知道」原則與可信任及獲授權的人士分享個人及／或敏感資料。 \n\n   - (c) 保持警惕，防範可疑／未經請求的電子訊息及欺詐。 \n\n   - (d) 透過如電話等其他方式驗證可疑／未經請求的電子訊息的發送者身分。 \n\n   - (e) 在做出任何回應或採取任何行動之前，確定電子訊息、附件、超連結或二維碼 的真實性、可信度和安全性。 \n\n   - (f) 向負責的童軍單位或資訊科技支援團隊報告可疑活動和事件。 \n\n   - (g) 尋求專業協助處理重要資料遭受竊取或騙取的情況，以減低損失及妥善執行補 救工作。 \n\n9. 使用者亦應時刻保持資訊科技保安習慣和警覺性，並留意最新的保安資訊，以履 行責任。本通告附件列舉常用電子資訊系統「應做」及「不應做」的資訊科技保安要 點，各童軍單位及成員均應細閱和遵守。 \n\n## 查詢及支援 \n\n10. 如欲進一步瞭解本通告的內容，請按下列電郵地址查詢： \n\n|地域／署及屬會|電郵地址|\n|---|---|\n|港島地域|it_enquiry@hkirscout.org.hk|\n|九龍地域|kritadmin@krscout.org|\n|東九龍地域|it@hkscout-ekr.org|\n|新界地域|ntrscout.it@gmail.com|\n|新界東地域|it.nterscout.official@gmail.com|\n|署及屬會|it@scout.org.hk|\n\n11. 若遇資訊科技保安事故需要特別支援，亦可直接與總會資訊科技署聯絡（電話： 2957 6433，電郵：it@scout.org.hk）。 \n\n助理香港總監（資訊科技及支援） 岑 偉 建\n\n<!-- p.3 -->\n政策通告通告第 02/2023 號附件 \n\n# 常用電子資訊系統「應做」及「不應做」的資訊保安要點 \n\n## **A.** 使用電腦及行動裝置 \n\n- 應做 不應做 \n\n- (i) 安裝和妥善設定防毒軟件，定期更 (i) 不應直接使用從其他人士獲取的 新病毒定義檔案，安排定時進行自 檔案，需經防毒軟件掃描檢查後方 動掃描。 可開啟使用。 \n\n- (ii) 定時更新作業系統及程式，以堵塞 (ii) 不可使用來歷不明或未獲正式授 保安漏洞。 權的程式。 \n\n- (iii) 使用個人防火牆以控制網絡通訊， (iii) 不應以管理員帳戶進行日常工作， 減低被黑客入侵或攻擊的風險。 避免惡意軟件能以管理員權限自 行安裝。 \n\n- (iv) 個人帳戶應設定登入密碼或其他 身分認證方式，以防止他人以你的 (iv) 不應在無人看管時保持登入狀態。 個人帳戶使用有關設備。 不論離開多久，在離開前，應啟動 屏幕鎖、登出或關機。 \n\n- (v) 如需在單位電腦處理敏感資料，單 位應按需要設立個別成員個人帳 (v) 不應使用公用電腦或單位電腦的 戶以供使用。成員亦應在使用後把 公用帳戶處理敏感資料。 有關檔案徹底刪除（包括清理電腦 (vi) 不應在公眾地方隨便放置而沒有 \n\n- 內「資源回收筒」）。 妥善看管任何行動裝置，以防他人 \n\n- (vi) 如使用便攜式儲存裝置，應小心保 輕易盜取。 管以避免遺失，並使用加密程式1 及 (vii) 不應將未移除儲存裝置的電腦或 \n\n- 密碼保護資料，以確保只有獲授權 行動裝置直接送往維修或棄置，以 \n\n- 人士纔可存取資料。 免被盜取當中資料。如需把儲存裝 \n\n- (vii) 定期進行備份，尤其是在重大系統 置送往維修或棄置，事前應採用安 或軟件安裝／更新，或進行機件維 全及永久性的方法把所有儲存的 修前亦應進行備份，以備遭受病毒 資料徹底刪除2 。 ／黑客攻擊或硬件失效時，可以利 用備份進行復原，以減少資料損 失。 \n\n## **B.** 管理資訊系統帳戶及密碼 \n\n- 應做 不應做 \n\n- (i) 請使用最少由八個數字、字母及符 (i) 不應以生日日期、用戶名稱、電話號 號組成的複雜密碼，或按照網站提 碼、常用字等設定密碼。 示的密碼複雜性來設定密碼。 (ii) 不應向別人透露個人帳戶和密碼， \n\n- (ii) 如系統許可，應使用雙重認證（two亦不應共用系統帳戶。 factor authentication），加強保安。 (iii) 不應在不同系統使用同一密碼。 \n\n- (iii) 應定期更改密碼，並妥善保存。 \n\n> 1 加密程式包括 Windows 平臺的 BitLocker 、 MAC 平臺的 FileVault 等。 \n\n> 2 例如採取硬盤適用的 DBAN (www.dban.org) 或檔案適用的 FileShredder (www.fileshredder.org)\n\n<!-- p.4 -->\n## **C.** 使用互聯網及設立網站／社交媒體帳戶 \n\n- 應做 不應做 \n\n- (i) 當瀏覽含敏感資料的網站或登入任 (i) 不應保留過時單位／活動之網站／ 何處理童軍事務的系統（例如成員 列之各項要求及規定。 \n\n現階段只接受各地域及總會各署為其主辦或參與之國際 `╱` 內地交流活動之成員申請 佩戴香港特區章，申請須經所屬之助理香港總監向國際總監提出。國際署將按情況更新上 述「指定活動」名單，請掃瞄左下之二維碼（QR Code）以獲取最新的名單。 \n\n如對本政策有任何查詢，請致電 2957 6400 與國際署職員聯絡。 \n\n<!-- Start of picture text -->\n香 港 總 監<br><!-- End of picture text -->\n\n（伍頴珊 代行） \n\n可佩戴香港特區章之 「指定活動」名單\n","03_政策及安全指引/PolicyCircular_2026_03_AiSPolicy_C.md":"---\nsource_file: \"PolicyCircular_2026_03_AiSPolicy_C.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 6\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n**2026** 年 **7** 月 **1** 日 第 **03/2026** 號通告 [政策／指引] \n\n電話：2377 3300  傳真：2302 1001 電郵：scoutcraft@scout.org.hk \n\n# 童軍成年成員政策 \n\n本通告取代 _2023_ 年 _10_ 月 _1_ 日所發出之政策通告第 _01/2023_ 號。 \n\n香港童軍總會（本會）制訂的童軍成年成員政策，由2021 年 1 月 1 日起生 效，旨在透過有效的支援及管理，提升成年成員的素質，協助他們更有效地實 踐和發揮其角色和職能，從而為青少年成員提供更佳的活動及訓練，以達至童 軍運動的使命。 \n\n本政策之主要職責由領袖資源署負責統籌，並由各單位及相關委員會共同 協助推行，詳情請參閱附件。 \n\n<!-- Start of picture text -->\n香 港 總 監<br>黎 偉 生<br><!-- End of picture text -->\n\n<!-- p.2 -->\n（附件） \n\n# 香港童軍總會 童軍成年成員政策 \n\n## **1.** 目的 \n\n為貫徹世界童軍運動的基本原則及配合發展需要，香港童軍總會（下稱「本會」） 訂立童軍成年成員政策（下稱「本政策」），透過有效支援及管理成年成員，提升 各級成年成員的素質，從而為年輕人提供更佳的活動及訓練，以達至支持童軍運 動的使命。 \n\n## **2.** 生效日期 \n\n本政策由 2021 年 1 月 1 日起生效。 \n\n## **3.** 綱領 \n\n- 《香港童軍總會條例》（香港法例第 1005 章） \n\n- 本會《會章》及《政策、組織及規條》 \n\n- 本會之童軍誓詞及規律 \n\n- 本會之童軍運動的目的及方法 \n\n- 本會之抱負、使命及價值觀 \n\n## **4.** 基礎 \n\n《世界童軍成年成員政策》 \n\n## **5.** 成年成員 \n\n本會按《政策、組織及規條》規定，公開招收成員，歡迎任何願意接受童軍誓詞 與規律及恪守總會原則的人士參加，並無種族、宗教、階級和性別之分，成員全 部均為自願加入。除香港總監批准外，該等人士應該是香港居民，以及通常於香 港居住、讀書或工作。 \n\n本會之成年成員主要劃分為三大類。 \n\n義務領袖：他們主要負責及推行一切有關童軍運動的事宜，並為義務性質。義務 領袖亦可分為總監、領袖及教練員，分別負責制定政策、統籌策劃、資源管理、 常務營運、童軍活動和訓練、旅團集會以及服務社會等工作。 \n\n會務委員：他們提供支援，如專業意見、財政資源及人脈網絡等，亦為義務性質。 \n\n專業領袖及受薪職員：他們是受薪職員，負責協助執行並處理日常會務。 \n\n註：為免存疑，年滿 _18_ 歲的深資童軍及樂行童軍屬於「青少年成員」，而非「成年成員」。\n\n<!-- p.3 -->\n## **6.** 政策內容 \n\n本政策的目標對象是所有成年成員，以讓他們在實踐童軍運動使命方面能扮演和 發揮其角色和職能。 \n\n## 6.1 成年成員的參與週期 \n\n成年成員在童軍運動中參與任何角色和職能，都會經歷不同階段的參與週期， 當中包括吸引及招募童軍運動所需的成年人、支援成年成員的角色和職能、以 及協助其個人發展和對未來路向的抉擇等階段。成年成員在參與童軍運動期間 可能經歷一個或多個週期。 \n\n## 6.2 招募 \n\n本會的招募政策，採用性別平等及多元化原則，並設立清晰的招募程序，以確 保本會各單位均能持續獲得具備支持童軍運動不同角色所需技能的成年人的 參與，以達成童軍運動的使命。 \n\n## 6.2.1 評估需要 \n\n本會因應策略規劃及未來發展，並以「團隊取向」為基礎，透過評估需 要、定期檢討本會運作及架構，以辨認本會於短、中及長期對成年人參 與（包括其角色和職能及所需才能）的需要。 \n\n## 6.2.2 吸引和甄選 \n\n本會以成年人團隊所需的角色細則為基礎，積極主動地採取合宜的態度 及多元化的方法，以推行系統化及全面化的成年人招募活動。 \n\n本會重視保障個人資料的私隱，並制定《香港童軍總會個人資料私隱政 策聲明》，俾使招募和甄選程序均依循《個人資料（私隱）條例》的原則 及規定。 \n\n在招募過程中，本會向成年人闡明本會的「抱負」、「使命」、「價值觀」 及對他們的期望，同時提供機會讓他們表達其個人信念、價值觀及對本 會的期望，從而招募及甄選與童軍運動使命相符的成年人加入。 \n\n## 6.2.3 協議 \n\n本會採用協商原則，與成年成員就其角色、主要工作關係、職責（包括 為童軍使命作出的貢獻、維護及執行本會政策和持續自我訓練的責任 等）、以及彼此的義務和權利等方面達成清晰的協議，讓成年人認識其 將會投入的工作環境和擔當的角色，同時識別其個人成長和發展的機 會。 \n\n有關協議亦會作為日後進行績效檢視的基礎。\n\n<!-- p.4 -->\n## 6.2.4 委任和聘任 \n\n本會根據《政策、組織及規條》及其他相關政策、機制及程序處理成年 成員之委任事宜。 \n\n義務領袖和會務委員的委任或聘任，包括但不限於： \n\n- 提名和委任所有義務領袖和會務委員的職位； \n\n- 每項委任均設立既定任期； \n\n- 人事任命的檢討以至在有需要時終止委任； \n\n- 獲委任人士的續任、調任或退任等未來狀況的決定條件；及 \n\n- 投訴及申訴的處理程序。 \n\n專業領袖和受薪職員的委任安排根據《政策、組織及規條》、相關機制 及程序處理。 \n\n- 6.3 委任期內的支援和績效表現 \n\n本會在成年成員的委任期內提供支援，包括就任指導、訓練和在職支援等，同 時設立績效表現的檢視制度，協助他們更有效地發揮其角色和職能，以達至本 會的使命。 \n\n## 6.3.1 就任指導 \n\n一般情況下，本會會為新委任之成年成員提供就任指導，讓他們瞭解其 角色和職能的責任和所需的訓練，並獲得指導和支援，以便盡快融入團 隊，並能更好、更快地達至其角色和職能的要求。 \n\n## 6.3.2 訓練 \n\n本會會為成年成員提供「領袖木章訓練系統」、「領袖技能訓練」及其他 持續進修訓練，讓其掌握如何為達成童軍運動使命作出貢獻。 \n\n本會期望成年成員於完成「木章」訓練後持續進修，提升知識和技巧， 與時並進，提升領袖在態度、技能、管理及領導才方面的素質，除促進 個人成長外，亦使青少年成員得到最佳的童軍歷程。 \n\n本會提供的持續性訓練包含成年成員的個人發展元素。本會會定期就訓 練系統作出檢討。 \n\n## 6.3.3 在職支援 \n\n本會將於有需要時向成年成員提供支援，以協助他們有效地履行在童軍 運動的角色和職能，及圓滿地完成其所負責的事工，並同時提高本會的 整體成效。 \n\n本會安排成年成員透過定期會面以識別其訓練需要及發展機會，從而加 強其個人動機、調適行為表現、改變對問題的取向以及克服困難。\n\n<!-- p.5 -->\n## 6.3.4 績效檢視 \n\n本會分別為總監級的義務領袖、專業領袖及受薪職員設立「績效檢視」 及「工作表現評核」機制，以助評估他們就其角色和職能要求等方面的 達標程度，讓他們對自己的發展和績效表現負責。 \n\n本會每年為總監級的義務領袖進行「績效檢視」，以其於被委任該職位 前所簽署之協議為預設目標，並採用協同評估模式，透過與其上級的 檢視，共同參與，以達至如何更好地履行其職責的目的。 \n\n本會每年為專業領袖及受薪職員進行「工作表現評核」，透過其上級根 據其職務大綱及整體表現，作出具體評語，包括其可進一步改善的地 方。 \n\n本會會採取循序漸進的模式，並因應實際情況，適時將「績效檢視」 機制延伸至涵蓋所有義務領袖及會務委員。 \n\n## 6.3.5 表彰 \n\n本會根據《政策、組織及規條》設立獎勵制度及獎勵委員會，並會適時 檢討其合適性。 \n\n## 6.4 未來發展 \n\n為確保不同角色和職能之間具流動性，本會會按成年成員所擔當的角色和職能 的表現，作為他們在未來參與童軍運動的決定條件。 \n\n## 6.4.1 續任 \n\n若成年成員所擔當的角色和職能的表現被評為滿意，及經與其上級商討 後，將可予以續任。 \n\n## 6.4.2 調任 \n\n成年成員在進行績效評估後，可能因為個人決定或其他原因，或會被調 任另一崗位或職能。 \n\n## 6.4.3 退任 \n\n按本會《政策、組織及規條》，成年成員可能因為下列原因退任： \n\n- 成年成員因個人理由自願退任； \n\n- 不切合其職位的資格規定，例如年齡或其他基本要求； \n\n- 成年成員停止、未有或未能履行其任內的職務； \n\n- 成年成員的行為表現出其已不再接納本會目的、使命、方法、童軍 誓詞及規律內的童軍運動基本原則；或 \n\n- 有關崗位被取消。\n\n<!-- p.6 -->\n## 6.5 成年成員紀錄 \n\n本會設有童軍成員資訊系統，妥善保存並適時更新成年成員的紀錄，包括個人 資歷、訓練、委任、調任、退任和獎勵紀錄。 \n\n## 6.6 保留成員 \n\n本會重視並珍惜成年成員在任何週期對童軍運動作出的貢獻，並從多方面推行 保留成年成員策略，包括但不限於： \n\n- 對所有成年成員的貢獻作出定期而有意義的表彰； \n\n- 提供調任崗位的可能，使成年成員可以持續發展本身的技能和知識，並在 \n\n- 個人發展方面有所進步，進一步為童軍運動作出更多貢獻；及 \n\n- 透過現行童軍單位或屬會，如香港童軍貝登堡聯誼會，與曾參加童軍運動 \n\n- 的成年人維持聯繫。 \n\n## **7.** 執行模式及單位 \n\n香港童軍總會採用分權管理模式進行成年成員管理，當中主要職責由領袖資源署 負責統籌，並由下列單位共同協助推行： \n\n- 香港童軍總會執行委員會； \n\n- 香港童軍總會香港總監諮議會； \n\n- 香港童軍總會職員事務委員會； \n\n- 各署； \n\n- 各童軍地域； \n\n- 各總會屬會； \n\n- 各童軍區； \n\n- 各童軍旅；及 \n\n- 其相關委員會。 \n\n專業領袖和受薪職員則在總幹事的督導下執行本政策。 \n\n## **8.** 檢視及修訂 \n\n為反映社會的演變及配合成年成員之需要，本政策將適時作出檢視及修訂，以優 化其內容，與時並進。一般而言本政策五年檢視一次。 \n\n**9.** 查詢 \n\n如對本政策有任何查詢，請與領袖資源執行幹事聯絡（電話：2835 7737）。\n","03_政策及安全指引/Procurement_exception-list-_20251218_.md":"---\nsource_file: \"Procurement_exception-list-_20251218_.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n# **SCOUT ASSOCIATION OF HONG KONG** \n\n# **Exception List of Goods and Services Procurement (Updated in Dec 2025):** \n\n# Quotations may be dispensed of: \n\n- A. where goods or services are provided by B P International House, Scout Units, Hong Kong SAR Government, Non-Government Organization Camps/Centres subvented by Government. \n\n- B. where Chinese-style meal reception procured for the Annual General Meeting/ Inauguration Ceremony/Anniversary event of Scout Unit is at a unit price (per 12-person table) not higher than the charge for similar set menu provided by Commissioners’ Club. \n\n- C. where total sum* of goods or services is HK$500 or below. \n\n- D. where goods or services, of total sum* not exceeding HK$2,000 訓練班」）起，本會所舉辦的「先鋒工程 訓練班」的內容將涵蓋現時「先鋒工程訓練班」（技能訓練班）及「先鋒工程安全工作坊」 的內容。` \n\n`第` 68 `屆或以前屆別的「先鋒工程訓練班」證書持有人，必須同時持有「先鋒工程安全 工作坊」證書，方可借用儲存於本會有關單位的先鋒工程器材和保護裝備；第` 69 `屆或以後 屆別的「先鋒工程訓練班」證書持有人，則不在此限。` \n\n`如有查詢，請致電` 2957 6477 `與訓練署職員聯絡。` \n\n```\n訓練總監\n麥偉明\n```\n","03_政策及安全指引/T5914_Nov_C_SAS_Pioneering_Syllabus_Revised.md":"---\nsource_file: \"T5914_Nov_C_SAS_Pioneering_Syllabus_Revised.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 訓 練 署 訓練通告第 59/2014 號 電話：2957 6477 傳真：3020 6156 2014 年 11 月 15 日 \n\n童軍技能評審計劃－先鋒工程項目課程內容修訂 \n\n為配合本會於 2014 年 6 月 15 日發出的特別通告第 09/2014 號「進行童軍先鋒工程活 動安全須知」，童軍技能評審計劃先鋒工程各級之課程內容將作出相應的修訂。 \n\n由 2014 年 11 月起（即由「第 3 屆先鋒工程第 1 級技能訓練班」及「第 9 屆先鋒工程 第 2 級技能訓練班」開始），評審計劃所舉辦的「先鋒工程第 1 級及第 2 級技能訓練班」 內容將涵蓋現時「先鋒工程安全工作坊」的內容。 \n\n第 1、2 屆「先鋒工程第 1 級技能訓練班」及第 8 屆或以前屆別的「先鋒工程第 2 級技 能訓練班」證書持有人，必須同時持有「先鋒工程安全工作坊」證書，方可借用本會各營 地、訓練署及青少年活動署的先鋒工程器材和保護裝備；「第 3 屆先鋒工程第 1 級技能訓 練班」及「第 9 屆先鋒工程第 2 級技能訓練班」及以後屆別的證書持有人，則不在此限。 \n\n如有查詢，請致電 2957 6477 與訓練署職員聯絡。 \n\n訓練總監 麥 偉 明\n","03_政策及安全指引/TN_plus-Annexures_-_Final-January-2024_r1.1.md":"---\nsource_file: \"TN_plus-Annexures_-_Final-January-2024_r1.1.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 96\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n# **SCOUT ASSOCIATION OF HONG KONG** \n\n## **Technical Note on Tendering and Management of Capital Works Projects** \n\n**November 2020** _(Latest update in January 2024)_\n\n<!-- p.2 -->\n### **Technical Note on Tendering and Management of Capital Works Projects** \n\n### **Contents Page** \n\n|1.1|Preamble|1|\n|---|---|---|\n|2.1|Need for Procurement of Capital Works Projects|2-4|\n|2.2|Project fund and budget|4-5|\n|2.3|Budget Holder and Project In-charge|5|\n|2.4|Consultants for Capital Works Project|5-6|\n|2.5|Consultation Mechanism|6-7|\n|3.1|Procuring Entities|8|\n|3.2|Tender Boards|8-11|\n|3.3|Classification of Tender Information|11|\n|3.4|Types of Procurement|11-17|\n|3.5|Number of Quotations/ Tenders|17|\n|4.1|Tender Documents and Specifications|18-19|\n|4.2|Information on Quantities|19|\n|4.3|Tenders in Foreign Currencies|19|\n|4.4|Tender Deposits|20|\n|4.5|Contract Deposits / Performance Bonds|20|\n|4.6|Retention Money|20-21|\n|4.7|Payment Terms|21|\n|4.8|Indemnity and Insurance|21-23|\n|4.9|Time for Completion|23-24|\n|5.1|Pre-requisites for calling Tenders|25-26|\n|5.2|Tender Notice|26-27|\n|5.3|Declaration of Conflict of Interest and Ethical Commitments|27|\n|6.1|Correspondence with Tenderers|28|\n|6.2|Action during tender period|28-30|\n|6.3|Submission of Tenders|30-31|\n|6.4|Opening of Tenders|31-32|\n|6.5|Tender Assessment Panel|32|\n|6.6|Clarification of Tenders|33-34|\n|6.7|Examination and Evaluation of Tenders|35-38|\n|6.8|Tender Negotiations|38-39|\n|6.9|Tender Reports|39-40|\n|6.10|Award of Tender|40-41|\n|6.11|Amendments to the Project|42|\n|6.12|Exemption for Emergency Repair|42|\n|7.1|Miscellaneous|43|\n\n<!-- p.3 -->\n7.2 Procedures for Handling Complaints 43\n\n<!-- p.4 -->\n#### **ANNEX** \n\n- A Simplified Flow Charts illustrating Tendering and Management Procedures for Capital Works Projects \n\n- 1 Guidance Notes on Association Property 2 Estate Branch Form EB006 – 工程需求及籌劃備忘 2 Estate Branch Form EB006A – 工程需求通知 3 Estate Branch Form EB001 – 發展及改善工程計劃撥款申請 4 Guidelines for Adopting Screening Criteria for Tender Evaluation 4 Guidelines for Adopting a Marking Scheme for Tender Evaluation 5 Guidelines for Drawing up Tender Specifications 6 An Outline of Terms and Conditions on Scout Properties 7 Conflict of Interest Declaration Forms 8 Declaration Form by Contractor on their Compliance with the Ethical Commitments Requirements \n\n- 8 Sample Declaration Form by Consultants on Compliance with the Conflict of Interest Avoidance and Debarring Requirements \n\n- 9 Guidelines for Tender and Contract Negotiations 10 Standard Tender Report Format 11 Estate Branch Form EB003 – 工程視察紀錄表 12 Estate Branch Form EB004a – 工程完成的用家意見（承建商表現評級） 13 Estate Branch Form EB004b – 工程完成的用家意見（工程顧問表現評級） 14 Sample Tender Notice 15 Sample Tender Report for Minor Works of cost not exceeding HK$50,000.00 16 Sample Letter of Acceptance\n\n<!-- p.5 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\n#### **ABBREVIATION** \n\n|CC’s Council|Chief Commissioner’s Council|\n|---|---|\n|CWTB|Capital Works Tender Board|\n|DPSC|Development & Project Sub-committee|\n|EC|Executive Committee|\n|ESA|Equivalent Supreme Authority which is the Service Committee / Council<br>of Scout Shop, Leadership Training Institute, Scout Group|\n|FC|Finance Committee|\n|GNFM|Guidance Notes on Finance Matters|\n|HQTB|Headquarters Tender Board|\n|PAAP|Property Acquisition Assessment Panel|\n|PDAC|Properties Development Advisory Committee|\n|SAHK|Scout Association of Hong Kong|\n\n<!-- p.6 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\n- **1.1 Preamble** \n\n- 1.1.1 This Technical Note provides detailed guidelines on tendering and project management for capital works projects, including the associated consultancy services. Simplified Flow Charts illustrating Tendering and Management Procedures for Capital Works Projects are provided at **Annex A** . \n\n- 1.1.2 The guidelines shall be observed by all procuring scout units (which could be SAHK or its Subsidiaries, Branch, Region, District and Scout Group) and shall apply to all projects no matter they are partially or wholly funded by own resources of the procuring scout units OR by outside bodies. \n\n- 1.1.3 For projects funded by outside bodies, the regulations, tendering guidelines and procedures of the funding authority shall also be observed. This Technical Note shall not apply to capital works and related maintenance / upgrading works for accommodations / sites which are provided, funded and handled by Sponsors and most of the Scout Group headquarters are of this category. For adhoc minor repair involving direct replacement using similar materials without upgrading / modification, only 3.2.3, 3.2.10 and 3.4.2.2 in this Technical Note shall apply provided that the estimated cost of such repair shall not exceed HK$5,000.00 and is funded by the procuring scout unit. \n\n- 1.1.4 Proposed changes to the procedures contained in this Technical Note should be approved by the Chief Commissioner on the advice of HQTB of SAHK. \n\n~ 1 ~ \n\nNovember 2020\n\n<!-- p.7 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\n- **2.1 Need for Procurement of Capital Works Projects** \n\n- 2.1.1 The procuring scout unit shall first identify the need and justification for procurement of the project. In establishing the need, at least the following aspects shall be considered and documented – \n\n   - (a) situations giving rise to the need; \n\n   - (b) the scope and coverage of the project to meet the need; \n\n   - (c) constraints; \n\n   - (d) implications on lease / town planning aspects; \n\n   - (e) availability of options; \n\n   - (f) business plan (where applicable); \n\n   - (g) procurement options; \n\n   - (h) need for engaging consultants; \n\n   - (i) procurement programme; \n\n   - (j) cost estimate, including cash flow and recurrent consequences; and \n\n   - (k) any other necessary information. \n\n_(updated in January 2024)_ \n\n- 2.1.2 Specifically, for a project which – \n\n   - (a) would cast substantial impacts on / changes to the land lease or development type; \n\n   - (b) would involve significant capital investments; \n\n   - (c) would result in significant recurrent expenses; \n\n   - (d) is for consultancy services costing HK$0.75 million or more; \n\n   - (e) is for redevelopment or major augmentation/alteration/addition of existing facilities; or _(updated in January 2024)_ \n\n   - (f) is for new development and / or infrastructure, \n\na paper seeking the consent / policy support of SAHK via CC’s Council and \n\n~ 2 ~ \n\nNovember 2020\n\n<!-- p.8 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\nEC of SAHK on the need for procurement of the project shall be prepared by the procuring scout unit. The paper shall be signed by the Budget Holder (see 2.3 below). Where the procuring scout unit is not a Branch, the paper shall first be endorsed by EC / ESA of the subject unit prior to submission to CC’s Council and EC of SAHK. For project to be procured by a District or Scout Group, the subject paper shall also be endorsed by the concerned Regional Commissioner prior to the submission. _(updated in January 2024)_ \n\nProject proposal related to (a), (e) and / or (f) above should first be scrutinized by PAAP who would refer its recommendations / advice to the Chief Commissioner who, if also concurs with PAAP that the project is worth to be further considered, will refer it to CC’s Council and EC of SAHK for seeking the consent / policy support of SAHK. _(updated in January 2024)_ \n\nAny paper for seeking the consent/policy support of EC of SAHK should be scrutinized by PDAC prior to submission to EC of SAHK for consideration. Where directed by PDAC, the business plan, forming part of the paper to demonstrate financial viability of the project, shall be submitted to FC for vetting. _(updated in January 2024)_ \n\nThe paper to PAAP / PDAC / FC / CC’s Council / EC of SAHK shall be submitted, copied to Estate Branch simultaneously for coordination, at least four weeks in advance of the meeting at which the project proposal is to be deliberated. Estate Branch will provide its comments for reference by relevant panel / committees / councils prior to the meetings. _(updated in January 2024)_ \n\n- 2.1.3 For capital works projects not falling within the ambits listed in 2.1.2 above, procuring scout units shall make use of the “Estate Branch Form EB006” at **Annex 2** for submission to Estate Branch for consideration by the Assistant Chief Commissioner (Estate) in respect of the needs for procurement of the projects. Where considered necessary, the Assistant Chief Commissioner (Estate) can refer the projects to CC’s Council/ PDAC for views. _(updated in January 2024)_ \n\nFor project works and routine maintenance with cost not exceeding HK$50,000.00, the procuring scout unit shall submit “Estate Branch Form EB006A” at **Annex 2** to Estate Branch for agreement prior to proceeding \n\n~ 3 ~ \n\nNovember 2020\n\n<!-- p.9 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\nwith tendering or obtaining quotations. \n\n- 2.1.4 Notwithstanding, capital works projects of the following categories are exempted from submission on need for procurement – \n\n   - (a) project included in the annual capital works budget held by Estate Branch; and \n\n   - (b) emergency repair approved by the Assistant Chief Commissioner (Estate) in accordance with 3.4.2.11 below. \n\n- 2.1.5 The procuring scout unit shall not commence any procurement procedures nor incur any expenditures before the policy support and budget approval are granted. \n\n- **2.2 Project fund and budget** \n\n- 2.2.1 Pertaining to the prevailing policy of SAHK, the procuring scout unit shall be responsible for, and therefore maintain, a recurrent budget to undertake the operation, maintenance and improvements for the completed project. Specific requirements for property developments are set out in the Guidance Notes on Association Property at **Annex 1** . \n\n- 2.2.2 Funds for the procurement proposal can be sought from – \n\n   - outside funding authority; \n\n   - donors in SAHK; \n\n   - fund raising; \n\n   - budgets of the respective procuring scout units; \n\n   - specific budgets approved by SAHK; or \n\n   - the capital works budget* maintained by Estate Branch, subject to funds approved by EC of SAHK, for annual bidding by procuring scout units and “Estate Branch Form EB001” at **Annex 3** is relevant. \n\n      - _inclusion of project proposals in this budget will be subject to the assessment of Capital Works Projects Assessment Panel comprising the Chairman of DPSC under Estate Branch, Commissioner(s) of Estate Branch, and other DPSC members as the Assistant Chief Commissioner (Estate) thinks fit_ \n\n~ 4 ~ \n\nNovember 2020\n\n<!-- p.10 -->\n##### Scout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\n- 2.2.3 Procuring scout units shall first consider seeking funds from outside bodies before applying for budgets from SAHK. \n\n- 2.2.4 In working out the budget for a project, the projected cost inflation / deflation to incur during the planning and construction periods of the project shall be worked out to form part of the total project cost estimate. Procuring scout units shall not purposely split a project or contiguous projects into a number of individual smaller projects so as to avoid the control of GNFM and this Technical Note. \n\n- 2.2.5 The budget estimate of a project, after its first inception, may undergo changes in the course of design development. The procuring scout unit shall in this regard keep its EC / ESA well informed of such changes. For projects within the ambits listed in 2.1.2 above, the procuring scout units and / or the concerned Budget Holders shall update EC of SAHK via PDAC on the progress and budget estimates of the projects regularly, but not less than half-yearly. _(updated in January 2024)_ \n\n- **2.3 Budget Holder and Project In-charge** \n\n- 2.3.1 The Budget Holder can be the Chief Commissioner, the Deputy Chief Commissioner of a wing, the Assistant Chief Commissioner of a Branch / Region, District Commissioner of a District or the Group Scout Leader of a Scout Group who is vested with the authority to expend in accordance with the budgets approved by EC / ESA of the relevant procuring scout unit. \n\n- 2.3.2 Proposal once approved is owned by the Budget Holder who should manage and control the procurement. He should ensure that the procurement process strictly follows procedures in this Technical Note and that the project be completed in accordance with the approved budget and timeframe. He should also ensure that all works carried out shall be within the approved project scope. \n\n- 2.3.3 Where considered appropriate, the Budget Holder can appoint a Project Incharge, who should be a commissioner of at least Grade V in rank and possess suitable knowledge and experience in the management and running of capital works projects, to handle the frontline tasks on his behalf. Nonetheless, the Budget Holder shall remain the person bearing the ultimate responsibility. Where the Budget Holder is the Chief \n\n   - ~ 5 ~ \n\nNovember 2020\n\n<!-- p.11 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\nCommissioner, the Project In-charge shall be the head of the procuring scout unit. \n\n- **2.4 Consultants for Capital Works Project** \n\n- 2.4.1 Simple engineering and construction works (e.g. internal decoration works) shall be managed and run by in-house resources / volunteers of the procuring scout units. Only complex capital works projects and / or those that require specialist input (e.g. feasibility study of major development, structural design) or involve statutory procedures (e.g. building plan submission) would normally warrant the engagement of consultants. \n\n- 2.4.2 Before deciding to engage consultants, the procuring scout units shall thoroughly review the need by considering the scope of services to be required from consultants, justifications for such an engagement, fees to be incurred, etc. For instance, design and build mode of implementation would be a more cost-effective way for implementing some projects (e.g. landscape works, adventure facilities). \n\n- 2.4.3 If consultancy services are demonstrated to be absolutely necessary and agreed by the authorities concerned, the procuring scout unit shall identify suitable firms for inclusion into the tenderer lists, by making reference to some established directories in the trades. It is important that the consultants selected for consideration should be of appropriate disciplines. For instance, there is no point to engage an Authorized Person (who basically is an architect for buildings) to look after greening works or to supervise marine works. Generally, consultancy services shall be procured through the two-envelope tendering system unless otherwise agreed by the Assistant Chief Commissioner (Estate). \n\n- **2.5 Consultation Mechanism** \n\n- 2.5.1 Various committees are established in SAHK for tapping the expertise and advice of community leaders on various matters, with EC / ESA being the mandatory setup for each level of the hierarchy. It is desirable to seek the advice and views of these committees on procurement proposals which have significant implications. \n\n- 2.5.2 For procurement of capital works projects and related consultancy services, \n\n~ 6 ~ November 2020\n\n<!-- p.12 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\nthe proposal and project requirements should be endorsed by a suitable committee (e.g. EC, ESA, campsite committee, property management committee or the like) of the procuring scout unit before submission to relevant authorities for approval. Where the Scout Group does not have such committees, the submission shall instead be first endorsed by relevant committees at the Region level. For procurement by a Scout Group, views of its Sponsor shall also be sought beforehand. For projects proposed at premises under the management of Estate Branch, prior agreement of Estate Branch shall be obtained. \n\n- 2.5.3 For property developments and / or property redevelopments not within the ambits listed in 2.1.2 above but selected by EC of SAHK, advice is to be sought also from PDAC. _(updated in January 2024)_ \n\n~ 7 ~ \n\nNovember 2020\n\n<!-- p.13 -->\nScout Association of Hong Kong – Technical Note on Tendering and Management of Capital Works Projects \n\n- **3.1 Procuring Entities** \n\n- 3.1.1 In addition to giving general guidance and technical advice on tendering procedures and contract administration matters in respect of works contracts, Estate Branch maintains a central performance report system for works contractors and consultants who have provided services to SAHK for reference of the procuring scout units. Notwithstanding that the procurement process is governed by Estate Branch, procuring scout units shall themselves conduct the procurements for capital works projects and related consultancy services. \n\n- 3.1.2 For procurements of capital works projects and related consultancy services by Districts and Scout Groups, proposals requiring funds from the capital works budget of Estate Branch will need to be endorsed and submitted by relevant Regional Commissioners. \n\n- **3.2 Tender Boards** \n\n- 3.2.1 **HQTB,** set up by the Chief Commissioner pursuant to this Technical Note, will consider, amongst others, tenders and related matters for capital works projects and related consultancy services with an estimated value exceeding HK$10.0 million and advise the Chief Commissioner on the acceptance of tender recommendations as well as other tendering matters as required by the Chief Commissioner. The terms of reference and membership of HTQB shall be approved by EC of SAHK. An Assistant Chief Scout Executive will serve as the secretary of HQTB. \n\n- 3.2.2 **CWTB** chaired by the Chairman of DPSC, with Commissioner(s) of Estate Branch, serving non-uniformed member(s) of DPSC and serving nonuniformed member(s) of the Association Headquarters Property Management Sub-committee under Estate Branch to be appointed by the Assistant Chief Commissioner (Estate)
