03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 4\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 \n\n**2024** 年 **4** 月 **1** 日 第 **08/2024** 號通告 [政策／指引 ] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 處理不當行為及投訴程序 \n\n本通告取代 _2022_ 年 _12_ 月 _1_ 日所發出之行政通告第 _33/2022_ 號。 \n\n**1.** 序 言 \n\n本通告載列處理不當行為及投訴的程序。 \n\n**2.** 生效日期 \n\n本修訂通告由 2024 年 4 月 1 日起生效，最少每兩年覆檢一次。 \n\n**3.** 「不當行為」及「投訴」的定義 \n\n   - 3.1 就本通告而言，「不當行為」是指違反香港童軍總會（下簡稱「本會」）的行為 守則或利益衝突、虐待、性騷擾、歧視、不端或不道德行為等事宜，而「投訴」 是指投訴人因受到本會成年成員某種對待而感到不滿／不公平或察覺有不當 行為而作出的申訴。 \n\n   - 3.2 對於與虐待和性騷擾有關的事件／投訴，應按本會《保護童軍成員免受傷害政 策》處理。 \n\n   - 3.3 就童軍旅、童軍區或童軍地域內部的糾紛，應分別按本會《政策、組織及規條》 規條 2.13、3.12 和 4.12 的規定相應處理。 \n\n**4.** 主要負責處理投訴的人士 \n\n   - 4.1 所有助理香港總監均獲委任為投訴主任，負責根據第 6 項所述處理不當行為及 投訴。如屬銀禧區投訴個案，則投訴主任為副香港總監（常務）。 \n\n   - 4.2 總幹事（或其指派之助理總幹事或以上職級人士）負責監察不當行為及投訴個 案的處理程序，並將其紀錄及存入總會的機密檔案。 \n\n**5.** 提出投訴 \n\n   - 5.1 任何人士可由其本人或經家長／監護人（未滿 18 歲的青少年適用），以書面提 出投訴或預約投訴主任提出口頭投訴。 \n\n      - (a) 投訴必須在投訴人知悉事件發生後的一個月內提出。 \n\n      - (b) 如以書面（中文或英文）提出，應以限閱形式發出，信封面應註明由相關 投訴主任親自拆閱。 \n\n      - (c) 對投訴主任1 ／助理香港總監的投訴，不論是投訴其個人或投訴其對個案的 處理方法，均應以限閱文件形式發出，信封面應註明由相關副香港總監親 自拆閱，或以書面與上述人士預約，親自向其提出。副香港總監應根據第 6 項所述處理該項投訴。 \n\n      - (d) 對副香港總監、總會會務委員、專業領袖或受薪職員的投訴，亦應以限閱 文件形式發出，信封面應註明由香港總監親自拆閱，或以書面與香港總監 預約，親自向其提出，香港總監應根據第 6 項所述處理該項投訴。如被投 訴人為總幹事，香港總監會指派其他人士負責第 4.2 項之工作。 \n\n> 1 如被投訴人為助理香港總監（傳訊及公共事務）、助理香港總監（國際）及助理香港總監（內地事 務），則應註明由香港總監親自拆閱或面見投訴人。如投訴主任為副香港總監（常務），應按5.1項 (d) 的程序處理。\n\n<!-- p.2 -->\n- 5.2 外界的投訴、由傳媒或其他途徑所得悉的不當行為及投訴，應按第 5.1 項所述 原則相應轉交予投訴主任／相關副香港總監／香港總監作出跟進及處理。 \n\n- 5.3 所有投訴絕對保密。投訴者應提供其姓名及聯絡資料，以作聯絡或日後跟進之 用，除非有充分的理由並得到香港總監同意，否則本會不會向任何人披露投訴 人的身分。 \n\n- 5.4 可獲受理的投訴必須： \n\n   - (a) 屬於本通告的涵蓋範圍內； \n\n   - (b) 具投訴者的姓名及聯絡資料； \n\n   - (c) 具投訴的依據以及任何已知悉的事實∕證據；和 \n\n   - (d) 不屬於發送給眾多其他組織的海量郵件或電子郵件的一部分。 \n\n- 5.5 儘管如此，投訴主任可酌情決定就匿名投訴作出適當的跟進及在需要時採取恰 當措施，從而改善本會會務。 \n\n- 5.6 任何人士如作出無根據和惡意投訴，本會將保留追究的權利包括索取損害賠償。 \n\n## **6.** 處理投訴的程序 \n\n- 6.1 投訴主任收到投訴個案後，如屬書面投訴，應在 3 個工作天內以書面形式認收； 如屬口頭投訴，投訴主任或其授權人士應記錄在案，並盡快與投訴者核實記錄。 如涉及未滿 18 歲之青少年成員，投訴主任須知會其家長／監護人有關事件。 \n\n- 6.2 投訴主任應盡快向香港總監報告，及知會相關副香港總監及總幹事。如個案明 顯涉及刑事罪行，投訴主任應安排向警方報案。如認為個案將引起公眾或傳媒 關注，總幹事應知會助理香港總監（傳訊及公共事務）有關個案的資料，以便 其制訂應對回覆公眾或傳媒的查詢。 \n\n- 6.3 投訴主任應把個案開檔，並根據個案的具體情況進行調查，當中可能包括接見2 投訴者、被投訴者、涉嫌人士及／或其他人士，但須得到投訴人同意方可向其 他人士透露投訴內容。投訴主任亦可委任另一名人士或一個委員會進行調查， 調查須在保密的情況下進行。 \n\n- 6.4 被投訴者或涉嫌人士，應有機會就有關指控和指責表達他們的辯證／回應／觀 點。 \n\n- 6.5 如個案涉及未滿 18 歲之的青少年成員，則應在可靠，無慮和適當的環境下與 其會面，並應由其父母或監護人陪同；如他們未能出席，則應由與該青少年成 員同性別的註冊社會工作者或恰當的成年人陪同。 \n\n- 6.6 因應情況及需要，投訴主任可安排被投訴者、涉嫌人士及被調查人士休假、暫 調其他職務或暫停其會籍。 \n\n- 6.7 完成調查後，投訴主任應盡快經相關副香港總監3 向香港總監提交報告，當中應 包括建議和給投訴者／被投訴者／涉嫌人士／被調查人士的覆函初稿。如獲接 納，投訴主任應迅速發出有關覆函。 \n\n- 6.8 一般而言，投訴主任應在接獲投訴後 3 個月內完成所有程序，並發出覆函。如 未能在 3 個月內完成，應立即通知香港總監、相關副香港總監及總幹事有關情 況，以尋求指示。 \n\n> 2 透過實體面談及／或書面方式。 \n\n> 3 如投訴主任為助理香港總監（傳訊及公共事務）、助理香港總監（國際）及助理香港總監（內地事 務），應直接向香港總監提交報告。\n\n<!-- p.3 -->\n- 6.9 投訴者／被投訴者／涉嫌人士／被調查人士可於覆函的 30 日內，就投訴主任 的調查結果及建議以具體理據／實證向香港總監提出書面上訴，而香港總監就 此而作的決定是為最終的裁決。 \n\n- 6.10 一般而言，應在接獲書面上訴後 3 個月內完成所有程序，並發出覆函。如未能 在 3 個月內完成，應立即通知香港總監、相關副香港總監及總幹事有關情況， 以尋求指示，直至完成上訴覆函為止。 \n\n- 6.11 如果投訴被認定為無理或惡意的，則投訴主任在諮詢相關副香港總監及／或香 港總監後，可以通知投訴人其投訴不獲受理。無理投訴的準則見 附件 。 \n\n- 6.12 如事件已向警方報案，投訴主任於獲香港總監同意後，可將調查推遲至法律程 序完成後才進行或不安排調查。 \n\n## **7.** 臨時行為及操守專案小組 \n\n- 7.1 視乎投訴主任的建議或調查結果的嚴重程度，香港總監可把個案交由其委任的 臨時行為及操守專案小組跟進。 \n\n- 7.2 就按本文第 6.9 項所提出的上訴，香港總監可考慮交由臨時行為及操守專案小 組跟進。專案小組應覆核該個案，並就需要作進一步調查，從而向香港總監提 出建議。香港總監會就此作出最終裁決和在有需要時把事件知會總會執行委員 會。 \n\n## **8.** 行為操守委員會 \n\n在有需要時，香港總監可就個案及／或上訴個案向行為操守委員會徵詢意見。行為操 守委員會可在有需要時邀請相關人士出席會議，作特定的討論。 \n\n**9.** 制裁行動 \n\n制裁行動指一些本會可能採取的糾正措施，以解決任何不當行為的投訴／舉報。該等 措施可包括： \n\n- 口頭和書面警告 \n\n- 禁令 \n\n- 調任 \n\n- 褫奪本會授予的任何獎勵 \n\n- 暫停或終止會籍 \n\n- 法律行動 \n\n- 任何在本會《會章》及《政策、組織及規條》權限內而又適當的其他制裁行動 \n\n## **10.** 紀錄及存檔 \n\n所有個案的資料包括面見紀錄、調查結果、投訴主任報告、專案小組或行為操守委員 會報告、香港總監最終的裁決等應以存取受限的方式妥為存於總會的機密檔案內。任 何情況下，所有報告都是絕對機密，不得發布。 \n\n## **11.** 查 詢 \n\n如對本通告有任何疑問，請向總會行政執行幹事查詢（電話：2957 6334），或與所屬 署／地域之執行幹事聯絡。 \n\n副香港總監（管理） \n\n<!-- Start of picture text -->\n盧  建  業<br><!-- End of picture text -->\n\n<!-- p.4 -->\n附 件 \n\n符合以下一個或多個準則的投訴將被視為無理的投訴： \n\n- (a) 經恰當程序處理後，仍繼續糾纏 \n\n- (b) 一再拒絕接受有證據證明的事實、拒絕接受具足夠內容回應投訴的覆函，或不接 受有些情況有時是難以核實的 \n\n- (c) 不斷及持續地糾纏在瑣碎的細節上 \n\n- (d) 在處理投訴過程中，不斷提出新事項或試圖透過提出更多的疑問來拖延時間（與 原投訴案有明顯不同而必須處理的事項除外） \n\n- (e) 導致本會需投放與指控／投訴嚴重性不相稱的資源以處理之不合理投訴或要求， 且該投訴或要求明顯地是用以幹擾或令人尷尬、騷擾他人、或可被定性為執迷或 明顯不合理的 \n\n- (f) 無視已獲處理及回覆而重覆提出指控或投訴\n","03_政策及安全指引/ACR242025C_童軍勳章及獎勵等級名單.md":"---\nsource_file: \"ACR242025C_童軍勳章及獎勵等級名單.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 2\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 行政署 \n\n**2025** 年 **10** 月 **15** 日 第 **24/2025** 號通告 [政策／指引 ] \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk \n\n# 童軍勳章及獎勵等級名單 \n\n本通告取代 _2023_ 年 _7_ 月 _1_ 日所發出之行政通告第 _17/2023_ 號。 \n\n就近年新增之童軍勳章及獎勵，現更新按等級排列的童軍勳章及獎勵名單 如下： \n\n1. 英勇獎勵 \n\n2. 銅狼勳章（世界童軍委員會頒授的獎勵） \n\n3. 金獅／金龍勳章 \n\n4. 其他童軍會最高的獎勵 \n\n5. 銀獅／銀龍勳章 \n\n6. 銅獅／青龍勳章 \n\n7. 英國童軍會銀橡實勳章 \n\n8. 世界童軍委員會及亞太區童軍委員會的獎勵 \n\n9. 功績榮譽十字章 \n\n10. 英國童軍會功績榮譽獎章勛帶 \n\n11. 功績榮譽獎章 \n\n12. 英國童軍會功績榮譽獎章 \n\n13. 優異服務獎章 \n\n14. 優良服務獎章 \n\n15. 其他童軍會獎章 \n\n16. 鑽禧大露營紀念章 \n\n17. 香港童軍跨世紀大露營星章或紀念章 \n\n18. 大都會露營徽章銀章或銅章 \n\n19. 香港童軍百週年紀念銀章或銅章 \n\n20. 香港童軍 110 週年紀念銀章 \n\n21. 「香港童軍 – 童心抗疫」徽章 \n\n22. 同行未來—香港童軍大露營紀念章 \n\n23. 香港童軍中心紀念章 \n\n24. 香港童軍 95 週年暨童軍運動百週年特別貢獻金章或銀章 25. 香港童軍百週年特別貢獻三星／二星／一星金章或銀章 \n\n26. 香港童軍 110 週年特別貢獻三星／二星／一星金章或金章 \n\n27. 特殊貢獻星章 – 只佩戴最高的一個 \n\n28. 特殊貢獻徽章 – 只佩戴最高的一個 \n\n29. 亞太區童軍基金管理委員會特別紀念金章或銀章 \n\n30. 香港童軍 110 週年紀念銅章 \n\n31. 長期服務獎章 – 只佩戴最高年資的一個 \n\n32. 英國童軍會長期服務獎章\n\n<!-- p.2 -->\n載於儀容與制服手冊第 191 至 192 頁的童軍勳章及獎勵等級名單 亦已作出相應修訂。 \n\n香 港 總 監 （盧建業 代行）\n","03_政策及安全指引/CIR_0523_Chi_MoP_v2512.md":"---\nsource_file: \"CIR_0523_Chi_MoP_v2512.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 8\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 國 際 署 電話：2957 6400 傳真：2302 1001 \n\n國際通告第 05/2023 號 2023 年 2 月 1 日 \n\n# 和平使者計劃 **（** 香港） \n\n本通告取代 2020 年 3 月 15 日發出之國際通告第 09/2020 號。 \n\n世界童軍委員會於 2011 年推出「和平使者計劃」（Messengers of Peace），旨在鼓勵逾百萬名童軍 成員為其社區作出小貢獻，並向全世界推廣，以感染更多童軍成員為社區出一分力。任何有助促 進健康、環境、社會環境、安全或減少衝突等的童軍活動，都可納入為「和平使者計劃」。 \n\n### 本港的和平使者計劃 \n\n本會鼓勵各童軍單位（包括旅及區）籌辦和平使者活動。認可條件如下： \n\n- (1) 活動必須切合和平使者計劃的任何一項主題；及 \n\n- (2) 活動過程中必須含有服務元素，每名參加者須為社區提供最少一小時的 服務 \n\n### 和平使者章 \n\n為了對童軍成員的貢獻作出肯定，由 2014 年 12 月 1 日起，童軍成員參加任 何已於世界童軍組織可持續發展目標網站（https://sdgs.scout.org/） 登記及獲 本會覈准的和平使者計劃活動，即可獲發和平使者章購章券。青少年成員在 獲取和平使者章（見右圖）後可佩戴於童軍制服直至晉升支部前，晉升支部 後需重新參與相關活動以再獲取佩戴資格。成年成員則可由活動首天起計佩 戴於童軍制服上，為期 12 個月，如完成另一項認可的和平使者計劃活動， 則可繼續佩戴和平使者章 12 個月。 \n\n（和平使者章） \n\n### 計劃流程（詳情請參閱「和平使者計劃流程」 **02/2023** 版） \n\n1. 遞交活動計劃書 \n\n   - i. 如 需要 在活動通告／紀念品／宣傳品上使用「和平使者」標誌 \n\n      - 請向所屬單位的「和平使者統籌」提交申請。【流程 1】 \n\n   - ii. 如 不需要 在活動通告／紀念品／宣傳品上使用「和平使者」標誌  直接實行計劃。【流程 2】 \n\n（如活動由多於一個童軍單位合辦，可向任何一個合辦童軍單位所屬的「和平使者統籌」申 請認可。如申請的童軍單位所屬的地域／署尚未委任「和平使者統籌」，則須向國際署遞交 申請。） \n\n2. 實行計劃。【流程 2】 \n\n3. 負責領袖應註冊個人戶口（適用於首次註冊者）【流程 3】 \n\n4. 完成計劃後上載活動報告及向所屬署／地域或國際署遞交「參加單位購章申請表」。【流程 4】 \n\n5. 獲覈准後，可獲發和平使者章購章券。申請者憑券可到童軍物品供應社購買，和平使者章每 枚售價為港幣 5 元。【流程 5】 \n\n### 佩戴位置 \n\n和平使者章應縫在童軍制服恤衫左胸袋中央位置（即會員章位置），如佩戴和平使者章，不需要 佩戴會員章。詳情請參閱陸續配合更新的《儀容與制服手冊》。 \n\n### 海外的和平使者計劃 \n\n成員如參加海外的和平使者活動，可於活動後向國際署申請認可。 \n\n如有查詢，請致電 2957 6400 與國際署聯絡。 \n\n<!-- Start of picture text -->\n國 際 總 監<br>伍 頴 珊<br><!-- End of picture text -->\n\n<!-- p.2 -->\n（02/2023 版） \n\n## 香港童軍總會 和平使者計劃流程 \n\n有關和平使者計劃要求，請參閱國際通告第 05/2023 號。 \n\n### **1.** 遞交活動計劃書 \n\n- 需要在活動通告／紀念品／宣傳品上使用和平使者標誌 \n\n為確保和平使者標誌的正確使用，負責領袖須於活動通告／紀念品／宣傳品發出首日前最 少 2 星期前向所屬單位的「和平使者統籌」（名單見第 2 頁）遞交「和平使者計劃（香港） － 計劃書」【Form: MoP/01】並連同設計草圖以提出申請。在獲得許可後可以繼續下一個步 驟及實行和平使者計劃。有關和平使者標誌的守則及指引，可以參閱以下網址： https://issuu.com/worldscouting/docs/messengers_of_peace_identity_guide_。 \n\n###  不需要在活動通告／紀念品／宣傳品上使用和平使者標誌 \n\n負責領袖可以繼續下一個步驟及實行和平使者計劃。 \n\n### **2.** 實行計劃 \n\n### **3.** 個人戶口註冊 \n\n負責領袖須在活動期間或活動後在世界童軍組織網站（https://scout.org/）註冊戶口，以作遞交活 動報告之用（見第 3 頁）。 \n\n- 註： \n\n只需註冊 _1_ 次，及供日後上載其他和平使者活動時使用。 \n\n### **4.** 遞交活動報告 \n\n活動完結後，負責領袖： \n\n- (i) 在世界童軍組織可持續發展目標網站（https://sdgs.scout.org/）匯報詳細活動資料及上載活動 相片／影片等（見第 4 頁），並 \n\n(ii) 以電子郵件或書面向所屬署／地域遞交已上載上述資料的網址 (https://sdgs.scout.org/project/xxxxxx) （見第 7 頁）及參加單位購章申請表【Form: MoP/02】， 以便核實資料。 \n\n1\n\n<!-- p.3 -->\n### **5.** 購買和平使者章（每個港幣 **5** 元） \n\n- (i) 個人購買（只適用於總會各單位及地域所舉辦的活動） – 參加者憑個人和平使者章購章券 自行到童軍物品供應社購買 \n\n- (ii) 團體購買 – 活動負責人或單位領袖憑和平使者章團體購章券為所有參加者到香港童軍物品 供應社購買 \n\n### 各童軍單位的和平使者統籌名單： \n\n|童軍單位|和平使者統籌|\n|---|---|\n|青少年活動署|張俊彥|\n|訓練署|樑子雲|\n|傳訊及公共事務署|蔡嘉俊|\n|發展署|吳昭鵬|\n|國際署|馮曉琳|\n|內地事務署|房順堯|\n|港島地域|蔡振輝|\n|九龍地域|殷斯偉|\n|東九龍地域|林思雅|\n|新界地域|吳和來|\n|新界東地域|黃勝輝|\n|童軍知友社|邱祖耀|\n|香港童軍貝登堡聯誼會|陳景禧|\n\n（更新日期：2025 年 12 月 12 日） \n\n- 註：各單位應向所屬單位之「和平使者統籌」遞交申請，若所屬單位尚未委任「和平使者統籌」， 則須將該項活動向國際署遞交申請。 \n\n2\n\n<!-- p.4 -->\n### 個人戶口註冊示範 \n\n在世界童軍組織網站（https://scout.org/）註冊戶口。 \n\n<!-- Start of picture text -->\n請先選擇「LOGIN」，然後於登入<br>版面中選擇「REGISTER」。輸入<br>所需個人資料，並提交。<br><!-- End of picture text -->\n\n完成註冊後檢查你的電郵郵箱，並點擊電郵內的連結以完成註冊程序。 \n\n3\n\n<!-- p.5 -->\n### 遞交活動報告示範 \n\n- 在世界童軍組織可持續發展目標網站（https://sdgs.scout.org/）匯報詳細活動資料及上載活動相片 ／影片等。 \n\n<!-- Start of picture text -->\n1<br>2<br>請登入後按「TAKE ACTION」。<br><!-- End of picture text -->\n\n### 需要準備的資料 \n\n1. 計劃名稱（最多 50 個字） \n\n2. 詳細計劃內容（包括日期、地點、參加者人數、受惠者人數） \n\n3. 計劃推行原因（最多 500 個字） \n\n4. 如何執行計劃（最多 500 個字） \n\n5. 計劃將會帶來什麼影響（最多 500 個字） \n\n6. 從計劃中得到的經驗（最多 500 個字） \n\n7. 至少一張計劃的照片 \n\n### 詳細步驟 \n\n|步驟|詳情|頁面截圖|\n|---|---|---|\n|1<br>2|內容類別**(Content Type)**<br>選擇“Community Service<br>Project”及內容的語言。<br>主題**(Topics)**<br>選擇3個最能描述您的計劃的可<br>持續發展目標關鍵詞。<br>注意：根據您選擇的關鍵詞，網<br>站將自動過濾出相關的可持續發<br>展目標。||\n\n4\n\n<!-- p.6 -->\n<!-- Start of picture text -->\n3  日期及地點  (Date and Location)<br>輸入計劃的日期及地點資訊。<br>4  計劃詳情  (Details)<br>輸入計劃的參加者人數及受惠者<br>人數。<br>5  動機  (Motivation)<br>輸入計劃推行原因（最多 500 個<br>字）。<br>6  執行  (Execution)<br>輸入如何執行計劃（最多 500 個<br>字）。<br>7  影響  (Impact)<br>輸入計劃將會帶來什麼影響（最<br>多 500 個字）。<br><!-- End of picture text -->\n\n5\n\n<!-- p.7 -->\n<!-- Start of picture text -->\n8  經驗  (Learnings)<br>輸入從計劃中得到的經驗（最多<br>500 個字）。<br>9  照片  (Photos)<br>包含至少一張計劃的照片作封<br>面，你亦可以在 “gallery”  加入<br>額外照片。<br>（請在發佈照片前確保你已獲得<br>照片中人士的許可）<br>10  主題  (Title)<br>為你的計劃加入主題（可以是計<br>劃名稱，最多 50 個字）<br>11  預覽  (Preview)<br>預覽過後，你的計劃將會被上傳<br>以供審核，之後將會自動發佈。<br><!-- End of picture text -->\n\n6\n\n<!-- p.8 -->\n### 如何取得計劃網址 \n\n前往世界童軍組織可持續發展目標網站（https://sdgs.scout.org/）。 \n\n<!-- Start of picture text -->\n1<br>2<br>請登入後按「My account」。<br>在「My account」中，選擇你所匯報<br>的活動。<br>計劃網址會在網址欄中顯示。<br><!-- End of picture text -->\n\n7\n","03_政策及安全指引/CIR_0820_Chi_WS-Policy_Revised.md":"---\nsource_file: \"CIR_0820_Chi_WS-Policy_Revised.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 國 際 署 電話：2957 6400 傳真：2302 1001 \n\n國際通告第 08/2020 號 2020 年 3 月 15 日 \n\n# 世界童軍組織政策及參考文件 **-** 《世界童軍保護青少年免受傷害政策》及《世界童軍成年成員政策》 \n\n世界童軍組織不時制訂各類政策及參考文件，向成員國提供指引及方向，從而支持童軍 運動的使命及貫徹童軍運動的基本原則。2019 至 2020 年期間，本會獲世界童軍組織授權，經 訓練署和發展及領袖資源署協助，分別將《世界童軍保護青少年免受傷害政策》(World Safe from Harm Policy) 及《世界童軍成年成員政策》(World Adults in Scouting Policy)翻譯為中文， 童軍成員可於下列超連結及二維碼下載細閱： \n\n世界童軍保護青少年免受傷害政策 \n\n世界童軍成年成員政策 \n\n上述政策及其他世界童軍組織近年出版的政策及參考文件的英文版本，可於下列超連結 或二維碼下載： \n\nWorld Safe from Harm Policy World Adults in Scouting Policy World Scout Youth Involvement Policy \n\nWorld Scout Youth Programme Policy \n\nSafe From Harm Self-Assessment Tool \n\n國 際 總 監 何 恩 民\n","03_政策及安全指引/Circular_童軍技能整合認可安排_Chi.md":"---\nsource_file: \"Circular_童軍技能整合認可安排_Chi.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 第 電話：2957 6333 傳真：2302 1001 電郵：admisinstration@scout.org.hk \n\n**2024** 年 **4** 月 **1** 日 第 **02/2024** 號通告 [政策] \n\n# `童軍技能整合認可安排` \n\n本通告取代 _2019_ 年 _12_ 月 _15_ 日所發出之政策通告第 _02/2019_ 號。 \n\n為鼓勵成員在童軍技能作持續進修及善用訓練資源，本會通過各相關 單位的互相協作，讓青少年成員於成為領袖後，不須重複以往在成員階段的 技能訓練，有更多時間可參加其他不曾參與的訓練，一方面可裝備自己，另 一方面亦令青少年成員得到最佳的童軍歷程，以配合本會「發展策略計劃 （ 2024— 2027）」。 \n\n## 經過試行及檢討後，現將經修訂的童軍技能整合認可安排臚列如下： \n\n|持有於**2014** 年**9** 月**1** 日或以後發出之|可視作等同持有|\n|---|---|\n|深資童軍`∕`樂行童軍地圖閱讀訓練班證書|領袖地圖閱讀訓練班證書|\n|深資童軍`∕`樂行童軍遠足訓練班證書|領袖遠足訓練班證書|\n|深資童軍活動金帶證書|領袖營藝訓練班證書|\n\n上述童軍技能整合認可安排適用於領袖木章訓練系統技能訓練班（核 心及選修領袖技能訓練班）之修讀要求，即可獲豁免修讀相關的領袖技能訓 練班。 \n\n如對上述安排有任何查詢，請與青少年活動執行幹事馬子一先生（電 話： 2957 6415）、訓練執行幹事楊慧敏女士（電話： 2957 6472 ）或助理總幹 事（支援）黃嬋娟女士（電話： 2957 6325）聯絡。 \n\n香 港 總 監 \n\n（盧沛霖 代行）\n","03_政策及安全指引/Decoration-Circular_Chi__202508.md":"---\nsource_file: \"Decoration-Circular_Chi__202508.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 1\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n香 港 童 軍 總 會 政策通告 \n\n2025 年 8 月 1 日 \n\n第 08/2025 號通告 \n\n電話：2957 6333 傳真：2302 1001 電郵：administration@scout.org.hk    [政策／指引] \n\n# 佩戴政府∕其他童軍組織∕其他國家或機構頒發之獎勵及勳章 \n\n本通告取代 _2025_ 年 _1_ 月 _1_ 日所發出之政策通告第 _01/2025_ 號。 \n\n根據總會「政策、組織及規條」規條 6.8.13(a)，所有列於「可佩戴於童軍制服之獎 勵及勳章名單」表一之香港特別行政區政府頒授，以及所有列於該表的其他認可獎勵及 勳章，均可佩戴於童軍制服左胸袋袋蓋上方。 \n\n此外，童軍成員可根據規條 6.8.13(b)及(c)，在提交有關頒授證明至總會行政署及經 審批後，在童軍制服上佩戴下列獎勵及勳章： \n\n1. 由世界童軍組織或由其任何成員組織頒授的獎勵及勳章（包括勳條及布章）（詳 \n\n見「可佩戴於童軍制服之獎勵及勳章名單」表二） \n\n   2. 其他獎勵及勳章（詳見「可佩戴於童軍制服之獎勵及勳章名單」表三） \n\n童軍成員如欲申請佩戴「可佩戴於童軍制服之獎勵及勳章名單」以外的獎勵及勳 章，必須以書面申請，並附上有關證明（例如：憲報公告、通知函、證書副本、頒授資 格及獲頒詳情等），透過行政署經副香港總監（管理）向香港總監提交，獲批准後方可 佩戴在童軍制服上。 \n\n行政署將按情況更新「可佩戴於童軍制服之獎勵及勳章名單」，請掃瞄左下之二維 碼（QR Code）以獲取最新的名單。 \n\n如會務委員以童軍成員身份出席活動，在西服上佩戴獎勵及勳章，亦須遵守上述規 範。 如有查詢，請與香港總監行政助理聯絡（電話：2957 6301）。 \n\n副香港總監（管理） 盧 建 業 \n\n可佩戴於童軍制服之 \n\n獎勵及勳章名單\n","03_政策及安全指引/GNFM-_Oct-2020_-Final__2024_-updated-title.md":"---\nsource_file: \"GNFM-_Oct-2020_-Final__2024_-updated-title.pdf\"\nsource_category: \"03_政策及安全指引\"\nsource_format: \"pdf\"\npages: 51\npipeline: pymupdf-layout\nocr_engine: none\n---\n\n<!-- p.1 -->\n# **SCOUT ASSOCIATION OF HONG KONG** \n\n## **Guidance Notes on Finance Matters** \n\n#### **October 2020**\n\n<!-- p.2 -->\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n### **CONTENTS** \n\n|**DEFINITIONS**||**Page**<br>3|\n|---|---|---|\n|**PREAMBLE**||4|\n|**SECTION**|||\n|One|Corporate Governance|5|\n|Two|Annual Budgeting|6-7|\n|Three|Income Collection and Receipt|8-9|\n|Four|Safe Custody of Cash, Cheques and Valuables|10-11|\n|Five|Bank Account and Cheque|12-13|\n|Six|Petty Cash|14-15|\n|Seven|Payment|16-18|\n|Eight|Programme Income and Expenses|19|\n|Nine|Fixed Assets|20|\n|Ten|Accounting Records and Financial Reports|21-22|\n|Eleven|Procurement|23-31|\n|Twelve|Donations/Sponsorship and Fund Raising|32-34|\n|Thirteen|Investment|35-36|\n|Fourteen|Income Recognition and Accounts Receivable|37-38|\n\n##### **ANNEX** \n\n- 3-1 Register of Official Receipt Books/Forms 3-2 Income Collection Summary 5-1 Register of Cheque Books 5-2 Bank Reconciliation Statement 6-1 Surprise Cash Check Record 7-1 Claim Form for Minor Expenses 9-1 Asset Register 11-1 Supplier/Vendor Assessment Form 11-2 Comparison on Quotations 11-3 Tender Opening Record 11-4 Purchase Request Form 14-1 Ageing Summary\n\n<!-- p.3 -->\nPage 3 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **DEFINITIONS** \n\n|“Budget Holder”|It refers to Chief Commissioner and such other persons as designated by<br>him:|\n|---|---|\n||BudgetHolder|\n||Association Headquarters<br>(inclusive of its Branches and<br>Funds)<br>Deputy Chief Commissioners,<br>Assistant Chief Commissioners,<br>ChiefScoutExecutive|\n||Regions (inclusive of their<br>Campsites & Activities<br>Centres)<br>Regional Commissioners|\n||Subsidiaries (except B P<br>International House)<br>Assistant Chief Commissioners,<br>Chairman ofCommissioners’Club|\n||Districts<br>District Commissioners|\n|“Executive Committee”|It refers to Executive Committee, or equivalent setup having similar<br>roles, of the Association or Scout Unit.|\n|“Financial Management<br>System”|A software system employed by Association Headquarters, Regions and<br>Subsidiaries (except B P International House) for accounting records and<br>preparing various financial reports.|\n|“Fixed Asset”|A piece of furniture, fixture or equipment which normally has a value<br>over $2,000 and life expectancy of over 3 years.|\n|“Income”|It refers to all money including donations, subventions, subscriptions,<br>fees, patent charges, sale proceeds, etc. received by the Association and<br>its Scout Units.|\n|“Journal”|Record of financial transactions in chronological order.|\n|“Programme”|Events, courses, services or activities organized by the Association and<br>its Scout Units.|\n|\"Scout Unit”|All Headquarters Branches (including IT Branch, Performing Arts Units),<br>Regions, Campsites & Activity Centres, Subsidiaries (except B P<br>International House) and Districts of the Association.|\n|“Unit-in-charge”|The salaried staff taking charge of Scout Unit (e.g. Supervisor, Scout<br>Executive, Education Centre Manager, Shop Manager, Camp Manager,<br>Officer of Commissioners’ Club, etc.).  For District, Unit-in-charge shall<br>be one of the Deputy District Commissioners as designated by District<br>Commissioner.  In his absence, whoever acting in the post concerned or<br>where there is no acting appointment, his supervisor shall be<br>Unit-in-charge.|\n\nDefinitions \n\nOctober 2020\n\n<!-- p.4 -->\nPage 4 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **PREAMBLE** \n\nThis Guidance Notes aims at providing a framework for exercising proper control on the services/activities provided by the Association.  Internal control is fundamental to sound and prudent financial management.  We should always ensure that policies are observed and adequate internal control is in place having regard to all services/activities provided. \n\nThis Guidance Notes, superseding the previous version issued in September 2016, is issued for the adoption by Scout Units.  Scout Group should observe this Guidance Notes as far as possible. \n\nMonetary amount expressed in this Guidance Notes is in Hong Kong dollars unless otherwise stated. \n\nGrammatical variations of terms defined in this Guidance Notes shall have the same meaning as such terms, words importing the singular number shall include the plural and vice versa, and words importing the masculine gender shall include the feminine and neuter genders. \n\nPreamble \n\nOctober 2020\n\n<!-- p.5 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nPage 5 of 38 \n\n###### **SECTION ONE** \n\n###### **CORPORATE GOVERNANCE** \n\n###### **1.1 Introduction** \n\nScout Association of Hong Kong (“the Association”) places a high priority on the standard of Corporate Governance and achieving accountability, openness and transparency in its work. \n\n###### **1.2 The Council & Committee** \n\nThe formation of Scout Council and various committees are set up according to the Policy, Organisation & Rules (“POR”) of the Association as applicable or are approved by the Executive Committee concerned.  Each establishment shall have its own terms of reference to clearly state its roles & responsibilities. \n\n###### **1.3 Segregation of Duties** \n\nDifferent persons shall be assigned to undertake different accounting duties of a transaction so as to avoid the possibility of errors, oversights, as well as deliberate manipulation or abuse in processing a transaction. \n\n###### **1.4 Avoiding “Bad Governance”** \n\nThere are actions that all Adult Members (refer to Rules 1.3.3(b) to 1.3.3(f) of POR of the Association) need to avoid.  These include:- \n\n- (a) **Self-dealing** – use of the Committee member position for personal gain; \n\n- (b) **Usurpation of corporate entity** – operating against the advantage of the Association in self-interest; \n\n- (c) **Mismanagement and non-management** – generally the result of inattention, negligence or incompetence. \n\n###### **1.5 Declaration of Interest** \n\nPlease refer to “Policy on Declaration of Interest” at the Association’s website (www.scout.org.hk). \n\nOctober 2020 \n\nSection One – Corporate Governance\n\n<!-- p.6 -->\nPage 6 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION TWO** \n\n###### **ANNUAL BUDGETING** \n\n###### **2.1 Budgeting** \n\n- (a) Budget Holders have to prepare budgets on all income and expenditures for the financial year.  They are required to submit the estimates to budget committee and the finance committee concerned, if so established in Scout Unit concerned, for review and recommendation.  Final approval of the budget shall be obtained from the Executive Committee concerned. \n\n- (b) Budget Holders are responsible for the accuracy and completeness of their estimates, in particular for ensuring that all services and activities that can reasonably be foreseen are included. \n\n- (c) The revenue estimates should state income by categories, i.e. sponsorship, donations, fees, subsidies, etc.  All significant increases and decreases must be explained item by item. \n\n- (d) In respect of expenditure estimates, all recurrent expenditure should be shown in details and all significant increases are to be explained in writing. \n\n- (e) For non-recurrent and capital expenditure, breakdown of expenditure and financial implications if any should be submitted. \n\n- (f) Budget Holders are responsible for controlling such income and expenditures under their respective approved budgets during the financial year. \n\n###### **2.2 Authority and Control of Expenditure** \n\n- (a) The annual budget approved by the Executive Committee concerned shall be documented and notified to Budget Holder(s), with such limitations as may be specified. \n\n- (b) Budget Holders shall only incur expenditure in accordance with the approved budget subject to limitations, if any, as may be specified by the Executive Committee concerned. \n\n- (c) It is the responsibility of Budget Holders to exercise strict economy in the budgets under their control.  Money must not be spent extravagantly simply because it has been allowed in the budget.  All expenditures must be justified for their necessities. \n\n- (d) Where any budgeted programme is suspended or delayed to straddle next financial year, or any budgeted programme is cancelled or conducted in a smaller scale, the budget shall be reduced accordingly. \n\nSection Two – Annual Budgeting \n\nOctober 2020\n\n<!-- p.7 -->\nPage 7 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (e) Funds earmarked for a particular programme must be used for that designated purpose only.  Neither can the surplus of any programme be used to offset the deficit of the other nor for the purchase of equipment or any other purposes. \n\n- (f) If a budgeted programme of budgeted amount exceeding $10,000 is replaced by a new programme, prior written approval should be obtained from the immediate supervising Commissioner of Budget Holder.  Where Regional Commissioner/ District Commissioner is Budget Holder, approval shall be sought from the Executive Committee concerned.  For the case where Chief Commissioner is Budget Holder, Association Treasurer is to be informed. \n\n- (g) Unless otherwise specified, virement of funds under the votes of Association Headquarters and Subsidiaries, involving use of funds allocated to one budget item for another, should only be approved in writing by Chief Commissioner, Deputy Chief Commissioners concerned or Chief Scout Executive with justifications.  If the proposed virement involved two Budget Holders of Association Headquarters / Subsidiaries, the Budget Holder requiring funds should, having sought the consent of his own supervising commissioner, write to the fund releasing authority for approval of the virement, via the other Budget Holder and copied to Finance Branch of the Association Headquarters. For the case where Chief Commissioner is Budget Holder, Association Treasurer is to be informed.  For Region and District, virement of funds should only be approved by the Executive Committee concerned. \n\n- (h) Budget Holders must review the expenditure situation periodically not only in relation to the sums voted but also in direct relation to the progress of the programmes. \n\n- (i) Budget Holders incurring expenditure in excess of the votes under their control or incurring expenditure without proper authority will be held personally liable. \n\n- (j) In any exceptional case where it is manifestly for the benefit of Scout Unit that any unforeseen expenditure should be immediately incurred, and time does not permit to obtain authority in the usual way, Budget Holder may, on his own liability, incur the expenditure, but he is required to take the necessary steps at once to apply to his immediate supervising Commissioner explaining the reasons which induce him to depart from the ordinary course.  In every such case Budget Holder will be held personally liable if any of the expenditure proves to be unnecessary or extravagant in the opinion of his immediate supervising Commissioner.  It follows that all unauthorized expenditure will be charged against the said Budget Holder in his personal capacity. \n\n- (k) No supplementary provision will be considered except for programmes for which it was impossible to foresee the necessity when the annual budget was being prepared or for excessive expenditure due to causes beyond ordinary control. \n\nSection Two – Annual Budgeting \n\nOctober 2020\n\n<!-- p.8 -->\nPage 8 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION THREE** \n\n###### **INCOME COLLECTION AND RECEIPT** \n\n###### **3.1 Segregation of Duties** \n\nThe duties of income collection (i.e. money collection, account recording and issuance of official receipts) and posting of entries to general ledger should be carried out by different persons. Should there be practical constraints which make such segregation of duties impossible, Unit-in-charge shall at least every 3 months conduct proper reviews and reconciliation of the accounts.  Any abnormalities observed should be immediately brought to the attention of the immediate supervisor of Unit-in-charge. \n\n###### **3.2 Official Receipts** \n\n- (a) Official receipts should be: \n\n   - (i) issued for all income collected; \n\n   - (ii)  in prescribed form; \n\n   - (iii) issued in sequential number; \n\n   - (iv) dated and issued to recipient; and \n\n   - (v) written/printed in ink. \n\n- (b) Official receipt should have no amendment or alteration on it.  In case amendment is required or receipt must be cancelled, it must be initialed by the receipt drawing staff and reviewed by Unit-in-charge.  Spoiled/obsolete official receipts should be immediately and individually endorsed “cancelled”.  All cancelled copies must be retained. \n\n- (c) If receipt books are used for the purpose: \n\n   - (i) receipt drawing staff should be issued with only one official receipt book for each type of receipt at a time, or if this is impracticable, the minimum number of books likely to be required for immediate use; \n\n   - (ii) a register should be maintained by Unit-in-charge to control the stock and issue of official receipt books (Sample Register of Official Receipt Books/Forms is attached at Annex 3-1); and \n\n   - (iii) unused official receipt books should be kept under lock by Unit-in-charge while the partly used one should be kept by the receipt drawing staff. \n\n###### **3.3 Income Collected** \n\n- (a) As far as possible, income by cheque or electronic payment shall be specified. \n\n- (b) No post-dated cheque is acceptable. \n\nSection Three - Income Collection & Receipt \n\nOctober 2020\n\n<!-- p.9 -->\nPage 9 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (c) Uncrossed cheques received should be crossed immediately, and made payable to “Account Payee Only”. \n\n- (d) Income collected should be shown in gross in accounting records (i.e. without offsetting it for expenses payment). \n\n- (e) Income collected should be banked promptly or at least once a week, except that the participation fees received for programme could be banked within a week of its application deadline. \n\n- (f) In no case can income collected be banked into personal account. \n\n###### **3.4 Income Collection Summary** \n\n- (a)  All income collected should be entered in Financial Management System, “Income Collection Summary” or other account management system software on the day of collection.  The Summary should include the date of receipt, serial numbers of official receipt issued, nature of income, amount collected and, upon banked, the date of banking. Sample Income Collection Summary is attached at Annex 3-2. \n\n- (b)  Unit-in-charge should check and ensure that income collected (either in cash/cheques, pay-in slip or bank transfer, etc.) matches with records entered in Income Collection Summary and official receipts issued.  The checked Income Collection Summary should be signed by parties concerned. \n\nSection Three - Income Collection & Receipt \n\nOctober 2020\n\n<!-- p.10 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nPage 10 of 38 \n\n###### **SECTION FOUR** \n\n###### **SAFE CUSTODY OF CASH, CHEQUES AND VALUABLES** \n\n###### **4.1 Safe Custody of Cash, Cheques and Valuables** \n\nAll cash (except petty cash) as well as other valuables such as share certificates must be kept in a lockable storage (e.g. double-lock safe) under joint control of no less than two persons who should each hold only one set of key/combination number. \n\n###### **4.2 Records of Key/Combination Number Holders** \n\nIt is necessary to record the name of holder of key/combination number, the date in which he takes over and his signature for receipt of key/combination number.  Unit-in-charge shall as appropriate update the record which shall be passed to Finance Branch of the Association Headquarters for filing.  Person holding key/combination number should be held personally responsible for the security of the keys and their losses. \n\n###### **4.3 Surprise Cash Count** \n\n- (a) Unit-in-charge should conduct surprise cash count at least every 3 months to detect and deter loss/misappropriation of cash/cheques.  Amount counted should match with the collection records.  Should there be any discrepancies, Unit-in-charge should immediately report the case to his immediate supervisor who will inform Budget Holder cum Chief Scout Executive accordingly and conduct investigation as soon as possible.  Where necessary, the immediate supervising Commissioner of Budget Holder should also be informed of the said discrepancies.  For District, the discrepancies should be reported to the Budget Holder who will inform the Treasurer concerned accordingly and conduct the investigation. \n\n- (b) The investigation report of the case should be submitted to Chief Scout Executive and Budget Holder (including his immediate supervising Commissioner as appropriate). For District, the report should be submitted to the Executive Committee. \n\n###### **4.4 Loss of Cash/Cheques/Valuables** \n\n- (a) Unit-in-charge should immediately report any loss of cash/cheques/valuables to his immediate supervisor who will inform Chief Scout Executive accordingly and conduct investigation as soon as possible.  Where necessary, Budget Holder and/or his immediate supervising Commissioner should also be informed of the said loss. For District, the discrepancies should be reported to the Budget Holder who will inform the Treasurer concerned accordingly and conduct the investigation. \n\n- (b) Loss should also be reported to the Police as determined by Budget Holder. \n\n- (c) The investigation report of the case should be submitted to Chief Scout Executive and Budget Holder (including his immediate supervising Commissioner as appropriate).  For District, the report should be submitted to the Executive \n\nSection Four - Safe Custody of Cash, Cheques & Valuables \n\nOctober 2020\n\n<!-- p.11 -->\nPage 11 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nCommittee. \n\n###### **4.5 Write-Off** \n\nWrite-off of receivables, valuables, losses and assets, etc. should comply with the authorization level listed below: \n\n|Costs (per lot)|Recommended by|Endorsed by|Approved by|\n|---|---|---|---|\n|Not exceeding<br>$20,000|Next lower rank to<br>Unit-in-charge<br>(For District, the<br>Unit-in-charge)|Unit-in-charge<br>(For District, the<br>Budget Holder)|Immediate supervisor<br>of Unit-in-charge<br>(For District, the<br>Executive Committee)|\n|$20,001 and above ^|Unit-in-charge|Immediate supervisor<br>of Unit-in-charge|Chief Scout Executive<br>(For District, the<br>Executive Committee)|\n\n^ Write-off amount exceeding of $100,000 in cost (per lot) should be separately shown in the financial statements. \n\nSection Four - Safe Custody of Cash, Cheques & Valuables \n\nOctober 2020\n\n<!-- p.12 -->\nPage 12 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION FIVE** \n\n###### **BANK ACCOUNT AND CHEQUE** \n\n###### **5.1 Authorization of Bank Account and Cheque** \n\n- (a) Authorization limit of each authorized person should be specified. \n\n- (b) Except otherwise agreed by Chief Commissioner and Association Treasurer, all bank accounts should be opened in the name of ‘Scout Association of Hong Kong – **name of Scout Unit** ’.  Opening or closing of a bank account requires prior approval of the Executive Committee concerned, which should be properly recorded. \n\n- (c) Each bank account should be operated by at least two authorized signatories.  Any application for cheque book must bear the signatures of two authorized signatories. \n\n- (d) Specimen signature of each authorized person should be kept in a lockable storage of the Unit. \n\n- (e) All cheques must be crossed before issuance. \n\n###### **5.2 Cheque and Cheque Book** \n\n- (a) Cheque books received should be recorded and signed for receipt in a register, and their issue must be controlled by recording the recipient’s name, signature and date. Sample Register of Cheque Books is attached at Annex 5-1. \n\n- (b) No more than one cheque book for each bank account should be used at any one time. Adequate security measures should be in place to safeguard the cheques contained in cheque book. \n\n- (c) Number of unused cheque books should be kept to minimum. (d) Unused cheque books should be kept in a safe under joint control of no less than two key-holders. \n\n- (e) Cheques should under no circumstances be pre-signed.  They should only be signed upon presentation of approved payment vouchers with supporting documents. Neither blank cheque nor cash cheque can be kept or issued.  When making signatures on cheque, all should be in hand-writing and no authenticated signature chop could be used. \n\n- (f) All cheque stubs must be retained. Spoiled cheques should be effectively cancelled by cutting the cheque number out and stick it on the corresponding stub.  If the cancelled cheque was signed, it should be attached to the payment voucher and stamped “CANCELLED” on it. \n\nSection Five - Bank Account & Cheque \n\nOctober 2020\n\n<!-- p.13 -->\nPage 13 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (g) Unit-in-charge should initial on each cheque stub after reviewing the issuance of cheques. \n\n###### **5.3 Signing of Cheques** \n\n- (a) Authorized person needs to ensure the amount written on cheque matching with the amount stated in the supporting documents or payment voucher and that the cheque is correctly entered. \n\n- (b) Another authorized person who countersigns a cheque needs to ensure that the signature of the other signatory is authentic. \n\n- (c) If the authorized person who dominates authority in approval process is the recipient, he should avoid signing the cheque. \n\n###### **5.4 Recording of Bank Transactions** \n\nTransactions of different bank accounts should not be mixed in a single Cash Book.  For each bank account, separate Cash Book should be maintained or separate ledger account be maintained in Financial Management System (or other account management system software as applicable). \n\n###### **5.5 Bank Reconciliation Statement** \n\n- (a) Bank Reconciliation Statement (Sample at Annex 5-2) should be prepared monthly for each bank account. The preparing person should sign and date on the bank reconciliation statement. \n\n- (b) It should be reviewed, checked and verified at least every 3 months by Unit-in-charge concerned who should sign and date on it to evidence the review. \n\n- (c) Any outstanding items shown on the statement should be followed up promptly. \n\nSection Five - Bank Account & Cheque \n\nOctober 2020\n\n<!-- p.14 -->\nPage 14 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION SIX** \n\n###### **PETTY CASH** \n\n###### **6.1 Imprest System** \n\nImprest System is recommended to be implemented. In essence, under this System, petty cash holder is advanced a fixed float of money out of which he will pay claims of petty cash expenses.  When the amount of the float is almost used up, he will then claim for refilling the amount he has paid as supported by the paid invoices/vouchers/receipts.  Thereby, the total amount of paid invoices/vouchers/receipts kept by the petty cash holder not yet claimed for refilling plus the cash in hand at any point of time should always be equal to the amount of the fixed float.  The amount held in an imprest must be kept to a minimum. \n\n###### **6.2 Authorization of Petty Cash Payment** \n\n- (a) All petty cash payment claims should be of reimbursement nature and supported by invoices /vouchers/receipts duly authorized by Budget Holder. \n\n- (b) Neither Budget Holder nor Unit-in-charge should be the petty cash holder. \n\n###### **6.3 Evidence on Receipt of Petty Cash** \n\n- (a) The claimants should sign on each receipt (including invoice if available)/voucher to give evidence of their receipt of the claims. \n\n- (b) All receipt (including invoice if available)/voucher should be immediately stamped with a ‘PAID’ chop upon settlement of the claims to prevent duplicate payments. \n\n###### **6.4 Recording of Petty Cash Transactions** \n\nA columnised Petty Cash Book, with analysis of different types of expenditures, should be maintained and regularly updated. \n\n###### **6.5 Petty Cash Held in Hand** \n\n- (a) All cash in hand and evidence of payment e.g. receipt (including invoice if available)/voucher must be kept by the petty cash holder in a lockable storage. \n\n- (b) Unauthorized advance from the imprests for personal use is strictly prohibited. \n\n- (c) Imprest money should be kept entirely separated from other money. \n\n###### **6.6 Surprise Check/Cash Count** \n\nIt should be conducted by Unit-in-charge to detect and deter loss of cash at least every 3 months.  Unit-in-charge should sign, date and record the result of the checking (Sample \n\nSection Six - Petty Cash \n\nOctober 2020\n\n<!-- p.15 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nPage 15 of 38 \n\nSurprise Cash Check Record is attached at Annex 6-1).  Finance Branch of the Association Headquarters will conduct surprise check on the said record.  Amount counted plus evidence of payment should always be equal to the amount of the fixed float.  Should there be any discrepancies found, investigation should be conducted as soon as possible, and report should be promptly made to the immediate supervisor of Unit-in-charge. \n\nSection Six - Petty Cash \n\nOctober 2020\n\n<!-- p.16 -->\nPage 16 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION SEVEN** \n\n###### **PAYMENT** \n\n###### **(A) PAYMENT (OTHER THAN PETTY CASH PAYMENT AND PERSONAL EMOLUMENT)** \n\n###### **7.1 Authorization of Payment** \n\nAll expenses must be properly authorized by Budget Holders before payments are made. Specimen signature of Budget Holder should be kept on records in a lockable place. \n\n###### **7.2 Payment Vouchers and Supporting Documents** \n\n- (a) All payments must be supported by approved payment vouchers which should be ready within a month.  Invoice/debit note/receipt (original copy as far as possible) with full details of the goods or services provided must be attached to payment vouchers.  If the invoice/debit note is printed on an easy fade ink/paper, then the bookkeeper should make photocopy for accounting copy. \n\n- (b) Each payment voucher must be signed in ink by two different persons i.e. the checking person and authorizing person.  The checking person should be Unit-in-charge.  In case of special projects of Association Headquarters, Budget Holder can appoint any other paid staff as the checking person.  The authorizing person should be Budget Holder.  Where Budget Holder considers appropriate under some circumstances, an additional covering sheet consolidating the payment information of a number of vouchers on same payment nature may be employed for one-off signature by the authorizing person instead of signing on every payment voucher.  It should however be emphasized that the employment of consolidating covering sheet does not absolve the responsibilities of Budget Holder under Clause 7.2(d) below. \n\n- (c) The checking person is responsible for ensuring the following before signing on the payment voucher: \n\n   - (i) goods received in good order, service/activities duly performed; \n\n   - (ii) due for advance payment is required contractually or under normal business practice; \n\n   - (iii) prices are fair and reasonable or according to contract or scales; \n\n   - (iv) castings and calculations are correct; \n\n   - (v) persons/firms named are entitled to receive payment; \n\n   - (vi) relevant quotation/tender requirements have been compiled with; \n\n   - (vii) payment is supported by invoices/debit notes/receipts duly checked and certified; \n\n   - (viii) correct budget item charging; (ix) no previous payment on the same invoice/debit note/receipt has been made; and \n\nOctober 2020 \n\nSection Seven - Payment\n\n<!-- p.17 -->\nPage 17 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n   - (x) payment together with previous payments already made in the financial year, do not exceed the authorized amount/approved annual budget. \n\n- (d) Budget Holder, who confirm proper use of the fund on the voucher, is responsible for ensuring the following before signing on payment voucher: \n\n   - (i) payment voucher has been properly checked by the checking person; \n\n   - (ii) payment corresponds with the supporting documents; and \n\n   - (iii) signature of the checking person is genuine. \n\n- (e) The approved payment voucher itself should contain: \n\n   - (i) serially assigned voucher number; \n\n   - (ii) date of voucher; \n\n   - (iii) ledger accounts to be entered; \n\n   - (iv) description of the payment or full details of the goods or services provided; (v) name of payee and amount; \n\n   - (vi) cheque number and name of bank (Note: Cheque number should also be recorded in the Cash Book for cross reference); and \n\n   - (vii) signatures and dates of the checking person and Budget Holder. \n\n- (f) Major alterations on payment vouchers (such as name of payee and amount) are strictly prohibited, and minor alterations should be made by striking off and adding in. No alteration by liquid fluid or correction tape is allowed for erasing. \n\n- (g) For minor expenses where supporting invoices/debit notes/receipts are not available from the supplier/service provider, a Claim Form for Minor Expenses (Sample at Annex 7-1) with sufficient details of the transaction should be made for checking and approval. The Form should be duly endorsed by Budget Holder. \n\n###### **7.3 Payment** \n\n- (a) Cheque payment or direct bank-in should be used as far as possible. \n\n- (b) Uncollected cheques should be stamped “CANCELLED” after a reasonable time (normally after 6 months). \n\n- (c) If cash payments are required, payments should be made on reimbursement basis. \n\n- (d) Acknowledgement on receipt of cheque or cash payments should be obtained. \n\n- (e) All paid invoices/debit notes/receipts should be stamped “PAID” immediately by the accounting staff upon settlements in order to prevent duplicate payments. \n\nOctober 2020 \n\nSection Seven - Payment\n\n<!-- p.18 -->\nPage 18 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **(B) PERSONAL EMOLUMENT** \n\n###### **7.4 Payment of Salaries and Allowances** \n\n- (a) A paylist showing details of each payee should be coordinated and issued by Finance Manager, and checked by Human Resources Manager against any change of salaries with explanations before passing to Budget Holder for approval. \n\n- (b) The responsibilities of checking persons and Budget Holder are same as Clause 7.2 (c) and (d) above respectively. \n\n- (c) Bank autopay should be used as far as possible. \n\n- (d) When crossed cheque is paid to an employee, receipt of the cheque should be acknowledged by the employee concerned or supported with bank pay-in slip. \n\nOctober 2020 \n\nSection Seven - Payment\n\n<!-- p.19 -->\nPage 19 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION EIGHT** \n\n###### **PROGRAMME INCOME AND EXPENSES** \n\n###### **8.1 Accounting Record of Programmes** \n\n- (a) An income and expenditure statement should be prepared on each programme by the programme organizer and should be submitted to Unit-in-charge for checking within 6 weeks after completion of the programme thus obtaining approval from Budget Holder. \n\n- (b) Programme income and expenses should be separated.  Expenses should not be paid out of (or netted off) the programme income. \n\n- (c) Enrollment list and attendance records of programme participants/staff/helpers should be kept.  Unit-in-charge should check and ensure that the fee collection/expense records are properly accordant with these enrollment list and attendance records. \n\n###### **8.2 Programme Expenses** \n\n- (a) A financial budget should be prepared for each programme, for approval by Budget Holder, before incurring expenditure or making any expenditure commitment. \n\n- (b) Expenses should be paid directly by Scout Unit through cheques/bank-in as far as possible. \n\n- (c) Advances of Programme Expenses \n\n   - (i) the amount should be kept to a minimum; \n\n   - (ii) the purpose and items to be procured should be clearly stated in the application for advances; \n\n   - (iii) advances should be properly authorized by Budget Holder and made to the appointed programme organizer or any appropriate person designated by Budget Holder; \n\n   - (iv) time lag between programme date and date of advances should be kept to a minimum; \n\n   - (v) expenses incurred shall not exceed the advances or be spent for procurement of items not listed in the approval; and \n\n   - (vi) balances of unspent advances should be promptly returned no later than 6 weeks after completion of the programme. \n\n- (d) Invoices/receipts must be obtained and submitted to Unit-in-charge as part of the income and expenditure statement to demonstrate that the expenses are properly incurred. \n\nSection Eight - Programme Income & ExpensesOctober 2020\n\n<!-- p.20 -->\nPage 20 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION NINE** \n\n###### **FIXED ASSETS** \n\n###### **9.1 Assigning an Identification Number to Each Asset** \n\nEach item of assets should be labelled/marked with an assigned serial number by the owning unit within 1 month upon the delivery to facilitate future physical checking of assets. \n\n###### **9.2 Asset Register** \n\nIt should be kept by each owning unit in electronic form with sorting functions (e.g. Excel, account management system software, etc.) and should contain the following information: \n\n- (a)  description of the assets; \n\n- (b)  assigned asset serial numbers; \n\n- (c)  physical location; \n\n- (d)  date of acquisition; \n\n- (e)  cost of acquisition and, where applicable, source of fund to acquire the assets; \n\n- (f) accumulated depreciation charged and related depreciation rate; and \n\n- (g)  date, reasons, disposal value and authorization for scrap or disposal. \n\nSample Asset Register is attached at Annex 9-1. \n\nThe owning unit is also recommended to include into this Register those assets such as computer monitors, office chairs, training equipment, etc., of which the cost is under $2,000 but life expectancy of over 3 years. \n\n###### **9.3 Physical Checking of Assets** \n\nIt should be conducted by the owning unit at least once a year.  Any discrepancies found should be investigated and reported to the immediate supervisor of Unit-in-charge.  The results and records of each checking should be kept for 3 years. \n\nIn case write-off/scrapping of assets is necessary due to damage, wear and tear, obsolescence or loss, written notice should be prepared, endorsed and approved with reference to the authorization level listed in Clause 4.5.  Evidence of approval must be kept and recorded in the Register. \n\n###### **9.4 Disposal of Assets** \n\nAssets to be disposed of should be, as far as possible, by means of thrift sales or as directed by the approval authority with reference to the authorization level listed in Clause 4.5. Disposal arrangement and the financial return so arising, if any, shall be recorded in the Register with the return properly banked and booked in the account. \n\nSection Nine - Fixed Assets \n\nOctober 2020\n\n<!-- p.21 -->\nPage 21 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION TEN** \n\n###### **ACCOUNTING RECORDS AND FINANCIAL REPORTS** \n\n###### **10.1 Books of Accounts** \n\n   - (a) Books of accounts including Journal and General Ledger (plus Cash Book and Petty Cash Book if Financial Management System or other accounting management system software having similar functions is not yet implemented) should be maintained. \n\n   - (b) The following practices should be employed in preparing and keeping the books of accounts: \n\n      - (i) Correct opening balances should be brought forward with reference to audited accounts of previous year and the ledger accounts should be balanced monthly. \n\n      - (ii) Expenses/income should be allocated to appropriate ledger accounts. \n\n      - (iii) Official receipt numbers, cheque numbers, voucher numbers, ledger account folios, etc. should be recorded in the books of accounts for easy cross-reference. \n\n      - (iv) All transactions must be supported by documentary evidence like duly authorized payment vouchers, petty cash vouchers, receipt vouchers, journal vouchers together with original source documents. \n\n      - (v) Mistakes/errors in recording accounting entries should be crossed out with the initial of officer making corrections instead of erasing or covering them with correction fluid. \n\n      - (vi) Where adjustments to the accounting entries are required, they should be authorized by Unit-in-charge. \n\n- **10.2 Safe Custody of Accounting Records** \n\n   - (a) Accounting records should be protected from unauthorized access. \n\n   - (b) General Ledger should be kept for permanent reference while Journals, Cash Book and Petty Cash Book are required to be kept for at least 7 years.  These documents should be kept in a fire-proof and lockable cabinet. \n\n   - (c) For electronic accounting system, a soft copy of data set for generating books of accounts should be kept for at least 7 years.  A General Ledger file in pdf copy should be generated and kept for permanent reference.  A back-up copy of the files shall also be kept in another safe place. \n\n   - (d) Vouchers and Receipts should be kept for at least 7 years. \n\nSection Ten - Accounting Records & Financial Reports \n\nOctober 2020\n\n<!-- p.22 -->\n**Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nPage 22 of 38 \n\n###### **10.3 Access Rights to Financial Management System and the Like** \n\n- (a) Access rights to Financial Management System and the like should be controlled and properly assigned to ensure adequate segregation of duties.  For example, staff responsible for posting payment vouchers should not have edit rights to the System. \n\n- (b) The framework of access right assignments for Financial Management System shall be agreed by Chief Scout Executive.  For District, the agreement should be sought from District Commissioner. \n\nSection Ten - Accounting Records & Financial Reports \n\nOctober 2020\n\n<!-- p.23 -->\nPage 23 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION ELEVEN PROCUREMENT** \n\n###### **11.1 Public Accountability** \n\nScout Association of Hong Kong is a non-profit organization whose spending is partly financed by Government subventions and donations.  We are accountable to our various stakeholders, including our Youth and Adult members, supporters, the government and members of the public, for proper use of our funds.  We should be prepared to justify our procurement decisions based on demonstrated needs for procurement and the procurement principles of “Transparency,” “Open and Fair Competition,” and “Value for Money.” \n\n###### **11.2 Need for Procurement** \n\nThe procuring Scout Unit shall first identify the need and justification(s) for the procurement of goods and services, including the initiation of capital works projects and their related consultancy services, taking into consideration such factors as the situation giving rise to the need, the scope and coverage of goods and services required, the constraints (if any), the availability of alternatives, the business plan (where applicable), procurement options, need for engaging outside consultants (if any), the procurement programme, future management cum maintenance arrangements, recurrent consequences and appropriate financial projections.  If the proposed procurement will carry major financial implications to the Association, Chief Commissioner may, as he considers fit, seek views of Association Treasurer on such procurement. \n\n###### **11.3 Procurement Principles** \n\n###### **(a) Transparency** \n\nAll requirements and specifications of the intended procurement should be clearly stated and communicated to interested suppliers and tenderers, with a view to giving a fair chance of competition amongst them and encouraging them to submit responsive and competitive quotes or tenders. \n\n###### **(b) Open and Fair Competition** \n\nAll suppliers and tenderers should be treated on equal footing and provided with the same information to facilitate them to prepare their quotes or tenders.  Unnecessary obstacles should not be created when drawing up the specifications for goods and/or services to be procured. \n\n###### **(c) Value for Money** \n\nTo achieve best value for money, not only competitiveness in price, but also compliance with users’ requirements, reliability of performance, qualitative superiority, whole-life costs and after-sale support, where applicable, shall be taken into consideration. \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.24 -->\nPage 24 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **11.4 Conflict of Interest and Confidentiality** \n\nAll personnel involved in the procurement process or tendering exercise, including all members of the tender board(s)/assessment panel(s) and staff members or volunteers involved in preparing procurement or tender documents shall sign the “Conflict of Interest Declaration Form,” and shall also declare any actual or potential conflict of interest, if any, as soon as they become aware of such.  When consultants are engaged, they shall be required to submit “Consultant’s Conflict of Interest Declaration Form”.  Both Forms can be obtained from Administration Branch of the Association.  To ensure fairness of the procurement exercise, all tender/quotation documents, including requirements and specifications, and written communications (including emails) in the procurement process or tendering exercise should be classified as confidential and labelled as appropriate “RESTRICTED (QUOTATION)” or ”RESTRICTED (TENDER)” to which access should be on a need-to-know basis. \n\n###### **11.5 Categories of Procurement** \n\n- **(a) General Procurement of Goods and Services (not related to Capital Works Projects)** \n\nPlease refer to Clause 11.6 for details. \n\n- **(b) Capital Works Projects and Related Consultancy Services** \n\nPlease refer to “Technical Note on Tendering and Management of Capital Works Projects”. \n\n- **(c) Scout Shop Merchandising** \n\nPlease refer to “Scout Shop Merchandising”. \n\n###### **11.6 General Procurement of Goods and Services** \n\n###### **11.6.1 Supplier/Vendor Selection** \n\n- (a) For procurement exceeding $100,000, procuring Scout Unit should compose a list of suppliers/vendors for prior approval by Budget Holder. \n\n- (b) To enable cost-effective and efficient procurement of standard instruments/equipment used by Scout Units other than Region, Subsidiaries and Districts, centralized procurement should be employed for stationery/general items, computer hardware/software and furniture/fixtures with Administration Branch, IT Branch and Estate Branch being the respective procuring Scout Units.  Each of these procuring Scout Units should as appropriate establish its own standing list of suppliers/vendors for the purpose. \n\n- (c) In establishing the list of suppliers/vendors, procuring Scout Unit should give considerations to both the technical and financial capabilities of the proposed \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.25 -->\nPage 25 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nsuppliers/vendors, and where appropriate their past performance.  Those included in the list must have met certain qualification criteria or technical assessments so as to ensure suitability. \n\n- (d) For standing list of suppliers/vendors for centralized procurement, the method and criteria for evaluating and assessing the performance of the suppliers/vendors as well as the procedures for regular review of the list shall be properly documented.  In general, performance of the suppliers/vendors in terms of (1) pricing; (2) punctuality of delivery; (3) quality of goods supplied or services performed; and (4) after-sales services, etc. shall be assessed after each transaction or after a defined period of service.  The assessment results shall be properly documented with the poor performers taken out from the standing list.  Sample Supplier/Vendor Assessment Form (SAF) is attached at Annex 11-1. \n\n###### **11.6.2 Drawing Up of Requirements and Specifications for Goods or Services** \n\nProcuring Scout Unit must ensure that the requirements and specifications laid down for the goods or services are based on functional and performance requirements of the goods or services and where applicable, meet international standard(s).  As far as possible, the requirements and specifications should be definite, with the quotes as the only factor for determining the award. \n\n###### **11.6.3 Number and Approval of Quotations/Tenders Requirement** \n\n- (a) Save the exceptions stated in Clause 11.6.3(c), all procurements should follow the quotation or tender requirements listed below: \n\n###### **Value of the procurement/contract** **_No. of Quotation/Tender Requirement_** \n\n- Not exceeding $5,000 \n\n- $5,001 to $30,000 \n\n- $30,001 to $100,000 \n\n- $100,001 to $300,000 \n\n- $300,001 to $1,000,000 \n\n- $1,000,001 and above \n\n   - at least 1 verbal quotation obtained \n\n   - at least 2 verbal quotations obtained \n\n   - at least 2 written quotations obtained \n\n   - at least 3 written quotations obtained \n\n   - at least 5 written quotations invited \n\n   - at least 5 tenders invited \n\n- (b) Splitting a procurement into several quotation/tendering exercises is strictly forbidden. \n\n- (c) Quotations may be dispensed of if the goods and services are procured from suppliers/vendors included in the Exception List of Goods and Services Procurement as published at the Association’s website. \n\n- (d) For justifiable reason(s) such as security, proprietary/exclusive products/services or compatibility, the minimum required number of quotations obtained/invited or tenders invited stated above could be reduced with the authorization level listed below: \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.26 -->\nPage 26 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n|Value of a single|||\n|---|---|---|\n|procurement/contract|Recommended by|Approved by|\n|- Not exceeding $50,000|Unit-in-charge|Budget Holder|\n|- $50,001 to $300,000|Budget Holder*|Immediate supervising<br>Commissioner of Budget<br>Holder*^|\n|- $300,001 to $1,000,000|Budget Holder*|Immediate supervising<br>Commissioner of Budget<br>Holder and Chief<br>Commissioner^|\n|- $1,000,001 and above|Headquarters Tender<br>Board^|Chief Commissioner^|\n\n- _Where Chief Commissioner is Budget Holder, the in-charge appointed for the subject project will assume the role of Budget Holder._ \n\n- ^ _For Region and District, the recommendation will be made by Budget Holder and the approval by a tender board which shall comprise the Chairman, Treasurer and two non-uniformed members of the Executive Committee concerned._ \n\nProper documents must be kept, including, for example, documentary proof(s) from supplier that it is the exclusive supplier or sole agent of the goods or services. \n\n- (e) Where the procurement is to cover provision of goods/services for a period of time (e.g. a season, a year, etc.), the value in the context of approval is the total projected value of the supply/service contract, not the value of the individual purchase requisitions/purchase orders. \n\n- (f)    For projects or procurements to be financed/subsidized by outside fund(s), the more stringent quotation/tender requirements of the fund(s) and this Guidance Notes shall prevail. \n\n###### **11.6.4 Quotation** \n\n###### **(a) Types and Handling Procedures of Quotation** \n\n- (i)  Verbal Quotation \n\nVerbal quotation refers to the quote obtained by phone, in person or on-line.  A record must be kept for review and verification. \n\n- (ii) Written Quotation \n\n   - (1) Written quotation should be addressed to Unit-in-charge of procuring Scout Unit in a sealed enveloped marked “RESTRICTED (QUOTATION)” and the name of the procurement. \n\n   - (2) Quotations delivered by post should be kept intact and directed to \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.27 -->\nPage 27 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nUnit-in-charge for date-stamping.   Quotations received should be kept under a double-lock device (e.g. safe) to prevent leakage or tempering of written quotations, with the two keys kept separately by Unit-in-charge and his deputy. \n\n- (3) If submission of quotation by fax or email is adopted, an isolated machine should be designated for the purpose.  Adequate security measures should be implemented to ensure that only the responsible person could access the machine.  All quotations received should be date-stamped and initialed.  Any alterations found should also be noted and initiated against. \n\n- (4) For procurement through on-line ordering, every effort should be made to search for the best offers with functions and features of the goods be largely the same.  The quotes obtained should be downloaded and printed out to support the recommendations.  In comparing the costs of options, the estimated delivery costs should be included. \n\n- (5) Quotations shall be opened on the day of closing with the presence of two persons, one being Unit-in-charge of the procuring Scout Unit.  A summary of quotations should be prepared listing the key information and signed by at least two persons present at the opening of the quotations. \n\n- (6) Where technical/performance requirements of the goods and services are of paramount importance, consideration can be given to employ two-envelope approach of which the details are set out in Clause 11.6.5 (b), (c) and (d)(vi) below. \n\n###### **(b) Approval of Award** \n\n- (i) Sample Comparison on Quotations is attached at Annex 11-2. \n\n- (ii) Award for procurement not exceeding $5,000 shall be approved by Unit-in-charge.  Award for procurement exceeding $5,000 but not more than $300,000 shall be approved by Budget Holder.  For award of procurement exceeding $300,000 but not more than $1,000,000 shall be approved by the immediate supervising Commissioner of Budget Holder, and for Region and District, by the Executive Committee concerned.  Where Chief Commissioner is Budget Holder, his approval limit is up to $1,000,000. \n\n- (iii) Where the number of quotations obtained is fewer than the number of quotations stipulated in Clause 11.6.3(a), the approving authority shall consider accepting or rejecting the quotation exercise.  If the quotation exercise is rejected, a new quotation exercise shall be initiated. \n\n- (iv) If the lowest conforming offer is not recommended, reasonable justification should be provided to the authorization level listed in Clause 11.6.3(d) for additional approval. \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.28 -->\nPage 28 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **11.6.5 Tender** \n\n###### **(a) Mode of Tender** \n\nThere are three main ways of seeking tenders from suppliers/contractors: \n\n- (i) Open mode: All interested suppliers/vendors are informed of the procurement intentions and specifications (e.g. by press), and all are free to submit tenders. \n\n- (ii) Selective mode: Only suppliers/vendors on pre-approved lists are informed of the procurement intentions and specifications and are allowed to bid based on their qualifications and experiences. \n\n- (iii)  Single or restricted: When circumstances do not permit selective mode on grounds of justifiable reason(s), one supplier/vendor as approved by the authorization level defined in Clause 11.6.3(d) can be invited to submit tender. \n\n###### **(b) Marking Scheme** \n\nWhere procurement entails evaluation of the competence of tenderers and/or the input/options submitted by tenderers (e.g. consultancy/management services), a marking scheme should be employed and drawn up before inviting tenders.  If marking scheme is employed, two-envelope approach is most preferable.  In any case, the tender sum should not be revealed or not known to members of the Tender Assessment Panel before completion and conclusion of technical marking. \n\n###### **(c) Two-envelope Approach** \n\nUnder this approach, each tenderer is required to submit one envelope containing technical substances to be evaluated and another envelope containing tender sum. Proper considerations should be given in fixing the technical : cost weighting so as to accord with the tendering objectives.  The weighting as well as the marking scheme should be determined prior to inviting tenders.  Outcomes of evaluations should be concluded before the tender sum envelopes are opened for combined assessments. \n\n###### **(d) Notice for Inviting Tenders** \n\nIt may include: \n\n- (i) specifications of the tender; \n\n- (ii) estimated quantities and time schedule; \n\n- (iii) tender validity period; \n\n- (iv) currency to be used for the contract; \n\n- (v) management/maintenance requirements as applicable; \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.29 -->\nPage 29 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (vi) the technical information to be submitted for evaluation of tender particularly when two-envelope approach is employed; \n\n- (vii) where or how to obtain tender documents; \n\n- (viii) closing date and time for submitting tenders; \n\n- (ix) place for lodging tenders; \n\n- (x) name of the officer and a telephone contact for enquiries; \n\n- (xi) channel to lodge complaints in case of improper dealings; and \n\n- (xii) any others required for ensuing adequacy and completeness of the tender. \n\n###### **(e) Submission of Tenders** \n\nTenders should be submitted in a sealed plain envelope clearly marked on the outside with “RESTRICTED (TENDER)” and the name of the procurement.  They should be deposited in a double-locked tender box at a designated office.  Any tender returned to other addresses shall be considered invalid.  Late tenders shall not be accepted. \n\n###### **(f) Opening of Tenders** \n\nOn the tender closing day, a designated Tender Opening Team will: \n\n- (i) open the tender box; \n\n- (ii) open and authenticate the tenders; (iii) complete the tender opening record which summarizes the tender opening results and sign off by all representatives present at the opening; and \n\n- (iv) send the originals of the authenticated tenders to the Tender Assessment Panel for evaluation. \n\nIf two-envelope approach is adopted for the tendering exercise, only the technical submissions for evaluations shall be sent to the Panel whilst the tender sum submissions should be put under custody of an independent third party and not be opened until the evaluation outcomes have been confirmed. \n\nTender Opening Team should preferably comprise 3 or more members, involving 2 key-holders of the tender box and Unit-in-charge of the procuring Scout Unit. \n\nSample Tender Opening Record is attached at Annex 11-3. \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.30 -->\nPage 30 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **(g) Assessment of Tenders** \n\nThe Tender Assessment Panel for procurement should be formed by the procuring Scout Unit for the purpose of assessing the tenders.  Membership of this panel should consist of at least 3 persons, including at least 1 Commissioner and 1 lay member.  A Professional Scouter, or a District scout leader in case of District, will serve as secretary.  The Panel should be responsible for evaluating the tenders based on the terms, conditions and specifications laid down in the tender documents and the principle of best value for money.  When the assessment is completed, the Panel shall produce a Tender Report signed by Budget Holder, to be submitted to the Headquarters Tender Board.  Where Chief Commissioner is Budget Holder, he should not take part in the assessment and the in-charge appointed for the subject project will sign the Report. \n\n###### **(h) Approval of Award** \n\nThe Headquarters Tender Board shall review all tenders for procurement of goods and services with a contract value exceeding $1,000,000 and submit its recommendations to Chief Commissioner.  In the review process, the Board may rely on the Tender Report or other submissions from Budget Holder or other members of the procuring Scout Unit. \n\nWhere the number of valid tenders obtained is too few to demonstrate the best value of money for the procurement exercise, the Headquarters Tender Board may recommend to reject the tender exercise, taken into consideration the views of the relevant Tender Assessment Panel.  If the tender exercise is rejected, a new tender exercise shall be initiated. \n\nIf the lowest conforming offer or the highest conforming score is not recommended, reasonable justification should be provided. \n\nThe award of contract should be approved by Chief Commissioner.  The procuring Scout Unit is required to inform the successful tenderer in writing of the acceptance of his tender and invite him to execute a contract in a prescribed form, if any.  It should be noted that acceptance of tender is already binding to both parties. Unsuccessful tenderers will also be informed of the outcome of their bids. \n\n###### **11.6.6 Centralized Procurement** \n\n###### **(a) Procurement Requisition** \n\n- (i) Sequentially numbered Purchase Request Form (PRF) shall be used by Scout Units requesting procurement.  Prior approval from Budget Holder of the requesting Scout Unit shall first be obtained.  Sample PRF is attached at Annex 11-4.  The procuring Scout Unit shall maintain a PRF register at all times for recording and inspection purposes. \n\n- (ii) Unit-in-charge of the procuring Scout Unit is responsible for ensuring that all \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.31 -->\nPage 31 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\nPRFs are properly approved, and are handled on a timely manner. \n\n###### **(b) Goods Receiving Procedures** \n\nGoods and services received should be checked against their order/quotation for quantities, specifications and other requirements.  Unit-in-charge of the requesting Scout Unit is responsible to ensure that goods and services received are in good order by sight and/or sample checking before acknowledging the receipt on either the invoice or the delivery note, and proceeding for payment and accounting record. \n\n###### **11.7 Payment for Procurements** \n\n- (a) Cheque payment or direct bank-in by Scout Unit shall be employed as far as possible and in this regard payment procedures in Section Seven shall be observed. \n\n- (b) Payment should not be made by personal/private credit card unless unavoidable. \n\nSection Eleven - Procurement \n\nOctober 2020\n\n<!-- p.32 -->\nPage 32 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n###### **SECTION TWELVE** \n\n###### **DONATIONS/SPONSORSHIP AND FUND RAISING** \n\n###### **12.1 Donations** \n\n###### **12.1.1 Receipts** \n\nOfficial receipts must be issued for all donations received.  Attention should be paid to the following: \n\n- (a) Official receipt eligible for tax deduction (i.e. marked as “donation”) shall only be issued for approved charitable donations as defined by the Inland Revenue Ordinance, i.e. it must be **a donation of money** to any charitable institution or trust of a public character that is exempt from tax under section 88 of the Inland Revenue Ordinance; or to the Government, for charitable purposes.  For instance, money made with specific return of benefits (e.g. banquet table), whether enjoyed by donor or his/her nominees, will normally not entitle donation receipt.  Any money donated for the purpose of procuring goods and services must first be banked in and booked, with the procurement following the procedures in Section Eleven of this Guidance Notes. \n\n- (b) No receipt shall be issued for goods and services (e.g. furniture, equipment, computers and software, stationery, human resources, administrative support, etc.) donated/sponsored. \n\n- (c) Collection of money donation and issuance of receipt shall follow the procedures set out in Section Three of this Guidelines. \n\n###### **12.1.2 Acknowledgement** \n\nNormally donations/sponsorship for events will be acknowledged in the event booklets or pamphlets.  On occasions, consideration may be given to acknowledging key donors/sponsors on event backdrops/banners. \n\n###### **12.2 Fund Raising** \n\n###### **12.2.1 General** \n\n- (a) Scout Units may conduct fund raising in accordance with the provisions in this Financial Guidelines and Rule 2.11.6 of POR of the Association.  For fund raising to be conducted by Branches, Regions and Subsidiaries, prior approval from the immediate supervising Commissioner of Budget Holder concerned is required. \n\n- (b) Fund raising should be in the name of Scout Unit.  In case if the fund raising is in joint names with other charitable organization(s) or if the fund raising is for other charitable organization(s), prior consent from the Deputy Chief Commissioner concerned and/or Chief Commissioner is required. \n\nSection Twelve - Donations/Sponsorship & Fund Raising \n\nOctober 2020\n\n<!-- p.33 -->\nPage 33 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (c) Financial report on fund raising comprising an account of income and expenditure of the activities conducted shall be prepared and audited for submission to the immediate supervising Commissioner of Budget Holder concerned. Where Budget Holder is Regional Commissioner or District Commissioner, the consent shall be obtained from the Executive Committee concerned. \n\n###### **12.2.2 Fund Raising Committee/Task Force** \n\n- (a) Fund raising committee/task force may be established, at the discretion of Budget Holder, to conduct the fund raising activities. \n\n- (b) Fund raising committee/task force may decide whether the financial reports will be audited by a Certified Public Accountant (Practicing), unless it is a statutory requirement.  If the audit is not by a Certified Public Accountant (Practicing), the fund raising committee/task force may appoint an independent person to perform an audit on the financial reports with consent from the immediate supervising Commissioner of Budget Holder.  Where Budget Holder is Regional Commissioner or District Commissioner, the consent shall be obtained from the Executive Committee concerned. \n\n###### **12.2.3 Entrustment of Fund-raising Activities to External Partners** \n\n- (a) Where consider appropriate by fund raising committee/task force and/or Budget Holder, fund raising activities can be entrusted by part or in full to external partners with consent from the immediate supervising Commissioner of Budget Holder. Where the Budget Holder is Regional Commissioner or District Commissioner, the consent shall be obtained from the Executive Committee concerned. \n\n- (b) Before decision made to entrust, fund raising committee/task force and/or Budget Holder shall evaluate the external partners as to their suitability including financial capacity and sustainability, track records on fund-raising entrustment, potential benefits/impacts on the image of the Association and Scouting, previous involvements in Non-governmental Organization and any other factors specific to the fund raising activities. \n\n- (c) In fixing the entrustment terms with the external partners, the following must be enforced: \n\n   - (i) disclosure of Association’s name and purpose of fund raising together with the fund-raising target; \n\n   - (ii) proper plan, method, promotion materials and procurement procedures employed for fund raising activities; \n\n   - (iii) fund raising activities be properly conducted and in compliance with laws of Hong Kong including specifically the requirements of Personal Data (Privacy) Ordinance in relation to collection, retention and access of personal data of donors and beneficiaries; \n\n   - (iv) minimal administrative costs and others charged by the external partners; and \n\nSection Twelve - Donations/Sponsorship & Fund Raising \n\nOctober 2020\n\n<!-- p.34 -->\nPage 34 of 38 \n\n###### **Scout Association of Hong Kong – Guidance Notes on Finance Matters** \n\n- (v) submission of audited financial reports with information/breakdown on total funds raised and associated expenses. \n\n###### **12.2.4 Commercial Sponsorship** \n\n- (a) In case commercial sponsorship is pursued, evaluation of sponsors in respect of their suitability same as Clause 12.2.3(b) above shall equally be conducted. \n\n- (b) It is necessary to check if commercial sponsorship can be listed in promotion materials or displayed.  For in
