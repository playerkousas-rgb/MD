  while(i<t.length){
    var rest=t.slice(i),x=rest.slice(0,size);
    if(rest.length>size){
      var cut=x.lastIndexOf("\n");
      if(cut>size*0.5)x=x.slice(0,cut);
    }
    parts.push({page:c.page,text:x});i+=x.length;
  }
  return parts;
}
function excerptOf(text,toks,idf){
  if(text.length<=SMALL)return {whole:true,parts:null};
  var chunks=[];
  splitPages(text).forEach(function(c){splitBig(c).forEach(function(x){if(x.text.trim())chunks.push(x)})});
  /* 用「呢個字在該文件出現於幾多頁」做權重：表格頁成日重複「制服／帽／男團員」，
     但「恤衫／杏色／深資」只在少數頁出現，後者才係答案所在。 */
  var pf=Object.create(null);toks.forEach(function(t){pf[t]=0});
  chunks.forEach(function(c){var low=c.text.toLowerCase();toks.forEach(function(t){if(low.indexOf(t)>=0)pf[t]++})});
  var P=chunks.length||1;
  function lidf(t){return Math.log((P+1)/((pf[t]||0)+0.5))}
  var scored=[];
  chunks.forEach(function(c,idx){
    var low=c.text.toLowerCase(),s=0,cover=0;
    toks.forEach(function(t){
      var n=countOcc(low,t);if(!n)return;
      s+=Math.min(n,5)*lidf(t);
      cover+=lidf(t);          /* 覆蓋「幾多個唔同關鍵詞」，唔係同一個字出現幾多次 */
    });
    if(s>0)scored.push({i:idx,page:c.page,text:c.text,s:s+cover*2.5});
  });
  if(!scored.length)return {whole:false,parts:[{page:chunks[0]?chunks[0].page:1,text:text.slice(0,6000)}],pages:"?"};
  scored.sort(function(a,b){return b.s-a.s});
  /* 首 3 段最相關，之後連前後相鄰段落一齊要（規條常常跨頁） */
  var entries=[],seen={};
  function add(i,pri){
    if(i<0||i>=chunks.length||seen[i])return;
    seen[i]=1;entries.push({i:i,page:chunks[i].page,text:chunks[i].text,pri:pri});
  }
  scored.slice(0,5).forEach(function(x,k){add(x.i,k);add(x.i-1,10+k);add(x.i+1,10+k)});
  entries.sort(function(a,b){return a.i-b.i});
  var total=0,keep=[],BUDGET=30000;
  entries.forEach(function(x){if(x.pri<10){keep.push(x);total+=x.text.length}});
  entries.forEach(function(x){if(x.pri>=10&&total+x.text.length<=BUDGET){keep.push(x);total+=x.text.length}});
  keep.sort(function(a,b){return a.i-b.i});
  var ps=[];
  keep.forEach(function(x){if(x.page&&ps.indexOf(x.page)<0)ps.push(x.page)});
  return {whole:false,parts:keep.map(function(x){return {page:x.page,text:x.text}}),pages:ps.slice(0,8).join("、")};
}

/* ---------- 檢索：全程在本機做，問句不會外傳 ---------- */
function tokens(t){
  var out=new Set(),low=String(t).toLowerCase();
  (low.match(/[a-z0-9]{2,}/g)||[]).forEach(function(w){out.add(w)});
  var cjk=low.replace(/[^\u4e00-\u9fa5]+/g," ").split(/\s+/).filter(Boolean);
  cjk.forEach(function(seg){for(var i=0;i<seg.length-1;i++)out.add(seg.slice(i,i+2))});
  return Array.from(out);
}
function countOcc(h,n){return h.split(n).length-1}
/* 口語 → 文件用詞：問「食煙」文件寫「吸煙」、問「飲酒」文件寫「酒精」，唔對照就係零命中 */
var SYN=[["食煙","吸煙"],["抽煙","吸煙"],["食菸","吸煙"],["吸菸","吸煙"],["煙草","吸煙"],
         ["飲酒","酒精"],["喝酒","酒精"],["飲啤酒","酒精"],["啤酒","酒精"],["紅酒","酒精"],["烈酒","酒精"],["含酒精","酒精"],
         ["露營","營地"],["露宿","營地"],["宿營","營地"],["營友","營地"],["營舍","營地"],["營區","營地"],
         ["場地","營地"],["帳篷","露營"],["泊車","車輛"]];
function aliasTokens(q){
  var s=String(q),out=[];
  SYN.forEach(function(p){ if(s.indexOf(p[0])>=0) out=out.concat(tokens(p[1])) });
  return out;
}
/* 問句屬邊個範疇，就優先讀該目錄：唔加呢層，40 萬字嘅大書一定壓過一兩千字嘅營地守則 */
var CATS=[["營地|營友|營舍|營區|露營|宿營|場地|借用|燒烤|泳池|射箭場|攀爬|無人機|泊車|離營","09_"],
          ["制服|帽|徽章|勳章|領巾|肩章|儀容|襪|皮鞋|皮帶","10_"],
          ["進度性獎章|段章|支部訓練|綱要|小童軍|幼童軍|深資童軍|樂行童軍","02_"]];
function catDirs(q){
  var s=String(q),d=[];
  CATS.forEach(function(c){ if(new RegExp(c[0]).test(s)) d.push(c[1]) });
  return d;
}
/* 文件自報嘅標題：第一個 # 標題，冇就用開頭一句。用嚟做「問句提到文件名」嘅加權。 */
function docTitle(text){
  var s=String(text),fm=s.match(/^---\n([\s\S]*?)\n---\n/);
  if(fm){var tm=fm[1].match(/^title:\s*"?(.*?)"?\s*$/m);if(tm&&tm[1])return tm[1].trim()}
  var body=s.replace(/^---\n[\s\S]*?\n---\n/,"");
  var m=body.match(/^#{1,6}\s*(.{1,40})/m);
  if(m)return m[1].replace(/^#+\s*/,"").trim();
  return body.slice(0,80).replace(/\s+/g," ");
}
/* 全庫切段：短文件整份當一段，長文件按 <!-- p.N --> 切頁後再切 ~2000 字 */
function chunkList(text){
  if(text.length<=SMALL)return [{page:0,text:text}];
  var out=[];
  splitPages(text).forEach(function(c){splitBig(c).forEach(function(x){if(x.text.trim())out.push(x)})});
  return out;
}
/* 段落級 BM25：以前「先為文件打分、再取前 k 份」，40 萬字嘅書一定壓過一兩千字嘅守則，
   而書入面正確嘅一頁亦成日入唔到前 5 段。改成逐段評分（有長度正規化），
   再以「該文件最高分嘅一段」排文件 —— 短文件唔會再被長書淹沒，答案頁會直接被抽中。 */
async function retrieve(question,k,files){
  var toks=tokens(question);
  aliasTokens(question).forEach(function(x){if(toks.indexOf(x)<0)toks.push(x)});
  if(!toks.length)return [];
  var unit=[];
  for(var i=0;i<files.length;i++){
    var f=files[i],text=cache.get(pathOf(f));
    if(text===undefined)continue;
    chunkList(text).forEach(function(c){
      unit.push({f:f,page:c.page,text:c.text,low:c.text.toLowerCase(),len:Math.max(c.text.length,80)});
    });
  }
  if(!unit.length)return [];
  var N=unit.length,avg=0;
  unit.forEach(function(u){avg+=u.len}); avg=(avg/N)||1;
  var df=Object.create(null);toks.forEach(function(t){df[t]=0});
  unit.forEach(function(u){toks.forEach(function(t){if(u.low.indexOf(t)>=0)df[t]++})});
  var W=Object.create(null);
  toks.forEach(function(t){W[t]=Math.log(1+(N-df[t]+0.5)/(df[t]+0.5))});
  var K1=1.2,B=0.75;
  unit.forEach(function(u){
    var s=0,cover=0,hit=0;
    toks.forEach(function(t){
      var n=countOcc(u.low,t);if(!n)return;
      hit++;cover+=W[t];
      s+=W[t]*(n*(K1+1))/(n+K1*(1-B+B*u.len/avg));
    });
    u.hit=hit;u.cover=cover;u.s=hit?(s+cover*0.6):0;   /* 命中越多「唔同」關鍵詞越前 */
  });
  var byPath=Object.create(null),order=[];
  unit.forEach(function(u){
    var pa=pathOf(u.f);
    if(!byPath[pa]){byPath[pa]={f:u.f,chunks:[],best:0};order.push(pa)}
    var e=byPath[pa];
    if(u.s>e.best)e.best=u.s;
    e.chunks.push(u);
  });
  var docs=order.map(function(pa){return byPath[pa]})
    .filter(function(d){return d.best>0});
  docs.forEach(function(d){       /* 問句提到文件名（例如「新領袖手冊第八章」）就加分 */
    var ti=docTitle(cache.get(pathOf(d.f))||"").toLowerCase(),hit=0;
    toks.forEach(function(t){if(ti.indexOf(t)>=0)hit++});
    d.tboost=1+Math.min(hit,2)*0.25;
    d.best=d.best*d.tboost;
  });
  docs.sort(function(a,b){return b.best-a.best});
  var dirs=catDirs(question);
  if(dirs.length){
    var pri=docs.filter(function(d){
      var pa=pathOf(d.f);
      return dirs.some(function(x){return pa.indexOf(x)>=0});
    });
    docs=pri.concat(docs.filter(function(d){return pri.indexOf(d)<0}));
  }
  return docs.slice(0,k).map(function(d){
    if(d.chunks.length===1&&d.chunks[0].page===0){
      return {f:d.f,sc:Math.round(d.best*10)/10,text:cache.get(pathOf(d.f)),
              excerpt:{whole:true,parts:null}};
    }
    var seq=d.chunks,byScore=seq.slice().sort(function(a,b){return b.s-a.s});
    /* 每份文件最多抽 6 段、合計 14,000 字：夠覆蓋規條，又唔會霸佔整份 prompt */
    var picked=[],size=0;
    for(var bi=0;bi<byScore.length;bi++){
      var u=byScore[bi];
      if(picked.length>=4)break;
      if(picked.length>=2&&size+u.text.length>10000)break;
      picked.push(u);size+=u.text.length;
    }
    var seen={},ps=[];
    picked.forEach(function(u){
      var j=seq.indexOf(u);
      [j-1,j,j+1].forEach(function(q){
        if(q>=0&&q<seq.length&&!seen[q]){seen[q]=1;ps.push(seq[q])}
      });
    });
    ps.sort(function(a,b){return a.page-b.page});
    var pages=[];ps.forEach(function(u){if(u.page&&pages.indexOf(u.page)<0)pages.push(u.page)});
    return {f:d.f,sc:Math.round(d.best*10)/10,text:"",
            excerpt:{whole:false,parts:ps.map(function(u){return {page:u.page,text:u.text}}),
                     pages:pages.slice(0,14).join("、")}};
  });
}

/* ---------- 呼叫 Gemini：不帶 tools，所以觸不到互聯網搜尋 ---------- */
var SYSTEM=[

/* 額度 = 天花板，唔係內容長度嘅控制器。按模型給到最大，實際長度由提示詞控制。
   關 thinking 只係為咗快啲出答案（唔係為省額度）。 */
function maxOutFor(model){
  if(/gemini-2\.5-/i.test(model)||/flash-latest/i.test(model))return 65536;
  return 8192;
}
var MAX_CONT=2;
function postOnce(model,body){
  return (async function(){
    var ctrl=new AbortController(),tm=setTimeout(function(){ctrl.abort()},150000);
    var url=API_BASE+encodeURIComponent(model)+":generateContent";
    var key=resolveKey();
    if(key)url+="?key="+encodeURIComponent(key);
    var res;
    try{
      res=await fetch(url,{method:"POST",credentials:"include",
        headers:{"Content-Type":"application/json"},signal:ctrl.signal,body:JSON.stringify(body)});
    }catch(e){
      if(e&&e.name==="AbortError")throw tag(Error("Gemini 超過 150 秒未回應（可能是 Canvas 代理或模型端等待）。"),{soft:true});
      throw tag(Error("Gemini 網絡請求失敗："+((e&&e.message)||e)),{net:true});
    }finally{clearTimeout(tm)}
    var data=await res.json().catch(function(){return{}});
    if(!res.ok){
      var msg=(data.error&&data.error.message)||("HTTP "+res.status);
      throw tag(Error(msg),{
        status:res.status,
        auth:res.status===401||res.status===403||/api key|credential|permission|unauthor|oauth|login/i.test(msg),
        nosuch:res.status===404||/model.*(not found|not exist|not supported|unsupported|invalid|deprecated)/i.test(msg)
      });
    }
    var cand=(data.candidates||[])[0]||{};
    var text=((cand.content&&cand.content.parts)||[]).map(function(p){return p.text||""}).join("").trim();
    var fin=cand.finishReason||"";
    if(!text){
      if(fin==="MAX_TOKENS")throw tag(Error("Gemini 撞到輸出上限但冇內容（已加大額度）。"),{soft:true});
      throw tag(Error("Gemini 沒有回傳內容"+(fin?"（"+fin+"）":"")),{soft:true});
    }
    return {text:text,finish:fin};
  })();
}
async function callOnce(model,system,contents){
  var think=/2\.5-flash/i.test(model);   /* 只有 2.5-flash 系列支援 thinkingBudget:0 */
  var cap=maxOutFor(model);
  for(var a=0;a<3;a++){
    var body={systemInstruction:{parts:[{text:system}]},contents:contents,
      generationConfig:{temperature:0.1,maxOutputTokens:cap}};
    if(think)body.generationConfig.thinkingConfig={thinkingBudget:0};
    try{return await postOnce(model,body)}
    catch(e){
      if(e.status!==400)throw e;
      if(think&&/think/i.test(e.message)){think=false;continue}
      if(cap>8192&&/output|token|max/i.test(e.message)){cap=8192;continue}  /* 模型唔收咁大，降一級 */
      throw e;
    }
  }
}
/* 接住續寫：去掉重複部分，避免同一句出現兩次 */
function joinText(a,b){
  a=String(a||"");b=String(b||"").replace(/^\s+/,"");
  if(!a)return b;
  if(!b)return a;
  var n=Math.min(a.length,b.length,400);
  for(var i=n;i>6;i--){if(a.slice(-i)===b.slice(0,i))return a+b.slice(i)}
  if(a.indexOf(b.slice(0,Math.min(40,b.length)))>=0)return a; /* 整個重寫過 */
  return a+b;
}
/* 半句斷尾的樣子：最後一個字係標點／開括號，或者【要點】開咗但【根據】未出現 */
function looksCut(t){
  var s=String(t||"").replace(/\s+$/,"");
  if(!s)return false;
  if(/[、，,：:．.；;（(「『【《\-—]$/.test(s))return true;
  if(s.indexOf("【要點】")>=0&&s.indexOf("【根據】")<0)return true;
  return false;
}
var CONT_ASK="你上一次嘅輸出被截斷咗。請由中斷位置直接接住續寫，唔好重複已寫過嘅字，唔好重新開頭，唔好加任何說明，只輸出續寫嘅內容。";
async function askGemini(system,user){
  var log=[],last=null;
  var list=good?[good].concat(MODELS.filter(function(x){return x!==good})):MODELS.slice();
  for(var i=0;i<list.length;i++){
    var m=list[i];
    try{
      var contents=[{role:"user",parts:[{text:user}]}];
      var r=await callOnce(m,system,contents);
      var text=r.text,fin=r.finish,cont=0;
      while((fin==="MAX_TOKENS"||looksCut(text))&&cont<MAX_CONT){
        cont++;
        L("偵測到截斷，續寫第 "+cont+" 次（"+m+"）");
        contents=contents.concat([
          {role:"model",parts:[{text:text}]},
          {role:"user",parts:[{text:CONT_ASK}]}
        ]);
        var r2=await callOnce(m,system,contents);
        if(!r2.text)break;
        text=joinText(text,r2.text);fin=r2.finish;
      }
      good=m;
      L("Gemini OK ← "+m+(cont?"（含 "+cont+" 次續寫）":"")+" finish="+(fin||"?"));
      return {model:m,text:text,truncated:(fin==="MAX_TOKENS"||looksCut(text))};
    }catch(e){
      last=e;log.push(m+"："+e.message);L("Gemini 失敗 ← "+m+"："+e.message);
      if(e.auth)break;
      if(!(e.nosuch||e.status===400))break;
    }
  }
  var err=Error(log.join(" ｜ ")||"Gemini 沒有回應");
  err.auth=!!(last&&last.auth);err.net=!!(last&&last.net);
  throw err;
}

/* ---------- 文件清單：優先問 GitHub「目錄內有咩 .md」，所以新檔案唔使改索引 ---------- */
var TREE_URL="https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/git/trees/"+GH.branch+"?recursive=1";
function treeCacheGet(){try{var raw=localStorage.getItem("sk_tree");if(!raw)return null;var o=JSON.parse(raw);return (o&&o.f&&o.f.length)?o.f:null}catch(e){return null}}
function treeCacheSet(f){try{localStorage.setItem("sk_tree",JSON.stringify({t:Date.now(),f:f}))}catch(e){}}
async function loadList(){
  try{
    var r=await fetch(TREE_URL,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
    L("GitHub 清單 HTTP "+r.status);
    if(r.ok){
      var j=await r.json(),files=[];
      (j.tree||[]).forEach(function(t){
        if(t.type!=="blob")return;
        var p=String(t.path||"");
        if(!/\.md$/i.test(p))return;
        var top=p.split("/")[0];
        if(top===p)return;                       /* 根目錄的 README／說明，不當文件 */
        if(GH.dirs.indexOf(top)<0)return;        /* 只讀白名單目錄 */
        var rel=p.slice(top.length+1),parts=rel.split("/");
        files.push({
          md_path:p,
          md_file:rel,
          top:top,
          category:parts.length>1?parts[0]:top,
          title:parts[parts.length-1].replace(/\.md$/i,""),
          chars:t.size||0,
          pages_ocr:undefined
        });
      });
      if(files.length){treeCacheSet(files);L("用 GitHub 清單："+files.length+" 份 .md");return {files:files,mode:"tree"}}
    }
  }catch(e){L("GitHub 清單失敗："+e.message)}
  var cached=treeCacheGet();
  if(cached){L("清單讀唔到，用上次成功的清單："+cached.length+" 份");return {files:cached,mode:"cache"}}
  var u=rawUrl(GH.dir+"/_index.json");L("改用索引 "+u);
  var r2=await fetch(u,{cache:"no-store"});
  L("index HTTP "+r2.status);
  if(!r2.ok)throw Error("HTTP "+r2.status);
  var idx=JSON.parse(await r2.text());
  if(!idx.files||!idx.files.length)throw Error("索引沒有 files");
  return {files:idx.files.map(function(f){return f}),mode:"index"};
}

/* ---------- 啟動 ---------- */
(async function init(){
  try{
    var got=await loadList();
    index={files:got.files};index.mode=got.mode;
    setCount(index.files.length+" 份文件");
    var dh=$("docHead");if(dh)dh.textContent="文件清單（"+index.files.length+" 份）";
    renderDocs();
    L("文件清單 OK："+index.files.length+" 份（"+got.mode+"）");
    startPreload();
  }catch(e){
    var n=$("note");
    if(n)n.innerHTML="讀不到文件清單："+esc(e.message)+
      "<br>若顯示 Failed to fetch，代表這個環境（Canvas 沙盒／CSP）不允許對外連線。";
    L("ERR "+e.message);
  }
})();

/* ---------- 主流程 ---------- */
$("askBtn").onclick=async function(){
  var q=$("q").value.trim(),box=$("answer");
  if(!q||busy)return;
  if(!index){box.innerHTML='<div class="err">知識庫未載入，請開右上角 ⚙ 看「診斷紀錄」。</div>';return}
  busy=true;$("askBtn").disabled=true;lsSet("sk_lastq",q);
  var k=parseInt(lsGet("sk_k"),10)||10,hits=null;
  try{
    var total=index.files.length;
    if(cache.size<total){
      box.innerHTML=spin("正在下載 "+total+" 份文件… <b id=\"prog\">"+cache.size+" / "+total+"</b>");
      pre.notify=function(d,t){var e=$("prog");if(e)e.textContent=d+" / "+t};
      await startPreload();
      pre.notify=null;
    }
    box.innerHTML=spin("正在你的文件庫內檢索…");
    hits=await retrieve(q,k,index.files);
    if(!hits.length||hits[0].sc<=0){box.innerHTML='<div class="err">文件中找不到相關內容。</div>';return}
    box.innerHTML=spin("正在閱讀 "+hits.length+" 份文件並作答…");
    var PER_DOC=30000,CTX_MAX=120000,used=0;
    var ctx=hits.map(function(h){
      if(used>=CTX_MAX)return "";
      var mk=h.f.pages_ocr?"（注意：此檔有 "+h.f.pages_ocr+"/"+h.f.pages+" 頁經 OCR，可能有錯字）":"";
      var body;
      if(h.excerpt&&!h.excerpt.whole){
        body="（全份 "+(h.f.pages||"?")+" 頁，以下是與問題最相關的段落）\n"+
          h.excerpt.parts.map(function(p){return "【第 "+(p.page||"?")+" 頁】\n"+p.text}).join("\n\n");
      }else{
        body=h.text.slice(0,PER_DOC);
      }
      var piece="### 檔案："+(h.f.top?h.f.top+"/":"")+h.f.md_file+" "+mk+"\n"+body;
      used+=piece.length;
      return piece;
    }).filter(Boolean).join("\n\n---\n\n");
    var top=hits[0]?hits[0].sc:0;
    var conf=top>=25?"高":(top>=12?"中":"低");
    L("檢索信心 "+conf+"（最高分 "+top+"），入選 "+hits.length+" 份");
    var payload="以下是官方文件內容（檢索信心："+conf+"）。"+
      (conf==="低"?"「低」代表呢批文件可能同問題無關：除非搵到直接對應嘅原文，否則【答案】要寫「文件中未提及」。":"")+
      "\n\n"+ctx+"\n\n問題："+q;
    var out=await askGemini(SYSTEM,payload);
    showAnswer(out.text,hits,out.model,out.truncated);
  }catch(e){
    L("ERR "+e.message);
    if(e.auth||e.net)showFallback(q,hits,e);
    else box.innerHTML='<div class="err">'+esc(e.message)+'</div>'+
      '<p class="warn">如果重試都一樣，開右上角 ⚙ 看「診斷紀錄」。</p>';
  }finally{busy=false;$("askBtn").disabled=false}
};

function fmt(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}
/* 把「- 」開頭的行變成真正列點；非列點的行照舊分段，唔會炒成一坨 */
function listify(t){
  var lines=String(t||"").replace(/\r/g,"").split("\n"),out=[],buf=[],inList=false;
  function closeList(){if(inList){out.push("</ul>");inList=false}}
  function flushBuf(){if(buf.length){out.push('<div class="pl">'+buf.map(fmt).join("<br>")+"</div>");buf=[]}}
  lines.forEach(function(raw){
    var ln=raw.replace(/\s+$/,"");
    var m=/^\s*(?:[-*•・‧▪]|\d{1,2}[.)、]|[（(]\d{1,2}[)）])\s*(.*)$/.exec(ln);
    if(m&&m[1].trim()){
      flushBuf();
      if(!inList){out.push('<ul class="li">');inList=true}
      out.push("<li>"+fmt(m[1])+"</li>");
    }else if(!ln.trim()){
      closeList();flushBuf();
    }else{
      closeList();buf.push(ln);
    }
  });
  closeList();flushBuf();
  return out.join("");
}
function parseAnswer(raw){
  var t=String(raw||"").trim();
  var a=t.indexOf("【答案】"),b=t.indexOf("【要點】"),c=t.indexOf("【根據】");
  var head="",pts="",src="";
  if(a>=0){
    var headEnd=(b>a)?b:((c>a)?c:t.length);
    head=t.slice(a+4,headEnd);
  }else{
    head=t;
  }
  if(b>=0){
    var ptsEnd=(c>b)?c:t.length;
    pts=t.slice(b+4,ptsEnd);
  }
  if(c>=0)src=t.slice(c+4);
  var empty=function(x){x=(x||"").trim();return (!x||x==="- 無"||x==="無"||x==="（無）")?"":x};
  return {head:(head||t).trim(),pts:empty(pts),src:empty(src)};
}
function showAnswer(raw,hits,model,truncated){
  var p=parseAnswer(raw);
  var html='<div class="answrap"><div class="tagline"><span class="pill">答案</span></div>';
  html+='<div id="ans">'+fmt(p.head)+"</div>";
  if(p.pts){
    var n=(p.pts.match(/^\s*(?:[-*•・‧▪]|\d{1,2}[.)、])/gm)||[]).length;
    html+='<details class="blk"><summary>具體要點<span class="cnt">'+n+' 項</span></summary><div class="pt">'+listify(p.pts)+"</div></details>";
  }
  var files=hits.map(function(h){
    var t=h.f.pages_ocr?'<span class="badge">OCR</span>':"";
    var pg=(h.excerpt&&!h.excerpt.whole&&h.excerpt.pages)?" · 第 "+h.excerpt.pages+" 頁":"";
    return "<div><b>"+esc((h.f.top?h.f.top+"/":"")+h.f.md_file)+"</b>"+t+pg+" 相關度 "+h.sc+"</div>";
  }).join("");
  html+='<details class="blk"><summary>根據<span class="cnt">'+hits.length+' 份</span></summary><div class="pt">'+
    (p.src?listify(p.src)+"<hr>":"")+'<div class="fl">'+files+"</div></div></details>";
  if(truncated)html+='<p class="warn">答案去到一半就斷咗（模型輸出上限）。可以再問一次，或者把問題問窄一點。</p>';
  html+="</div>";
  $("answer").innerHTML=html;
}

/* 代理認證唔通時：仍然把已檢索到的原文同提示詞交返用戶，可以貼去自己的 Gemini */
function showFallback(q,hits,err){
  var lines=[];
  if(hits&&hits.length){
    lines.push("# 以下是官方文件內容：\n");
    hits.forEach(function(h){lines.push("### 檔案："+h.f.md_file+"\n"+h.text.slice(0,6000))});
  }
  lines.push("\n# 問題："+q+"\n\n"+SYSTEM);
  var full=lines.join("\n\n---\n\n");
  window.__skPayload=full;
  var html='<div class="answrap"><div class="tagline"><span class="pill gold">連線失敗</span></div>';
  html+='<div class="err">'+esc(err.message)+"</div>"+
    '<p class="warn">已在你嘅文件庫內檢索到下列文件（問句冇外傳）。可以撳「複製」再貼去 Gemini 問，或者稍後再試。</p>';
  if(hits&&hits.length){
    html+=hits.map(function(h){
      return '<div class="src"><b>'+esc(h.f.md_file)+"</b>（相關度 "+h.sc+"）</div>"+
        '<pre class="md">'+esc(h.text.slice(0,2000))+"</pre>";
    }).join("");
    html+='<div style="margin-top:12px"><button class="cta" id="copyBtn">複製檢索內容 + 提示詞</button></div>';
  }
  html+="</div>";
  $("answer").innerHTML=html;
  var cb=$("copyBtn");
  if(cb)cb.onclick=async function(){
    try{await navigator.clipboard.writeText(full);cb.textContent="已複製"}
    catch(e){cb.textContent="複製失敗，請手動選取上方原文"}
  };
}

/* ---------- 文件清單 ---------- */
function renderDocs(){
  var box=$("docs"),q=($("filter").value||"").trim().toLowerCase();
  box.innerHTML="";
  index.files.filter(function(f){
    return !q||((f.md_file+" "+(f.title||"")+" "+f.category)||"").toLowerCase().indexOf(q)>=0;
  }).forEach(function(f){
    var d=document.createElement("div");d.className="doc";
    d.textContent=String(f.md_file).split("/").pop().replace(/\.md$/,"")+"  ·  "+(f.top||f.category||"");
    d.onclick=async function(){
      box.querySelectorAll(".doc.on").forEach(function(x){x.classList.remove("on")});
      d.classList.add("on");
      $("preview").textContent="載入中…";
      try{$("preview").textContent=await getText(f)}
      catch(e){$("preview").textContent="讀取失敗："+e.message}
    };
    box.appendChild(d);
  });
}
$("filter").addEventListener("input",function(){if(index)renderDocs()});
